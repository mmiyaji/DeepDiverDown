name: Deploy reference site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch official service icons
        run: |
          node tools/fetch-provider-icons.mjs
          node tools/fetch-oss-icons.mjs
          npm run icons
      - name: Build public reference site
        run: node tools/build-public.mjs "$RUNNER_TEMP/ddd-public" --require-icons
      - name: Prepare isolated Wrangler directory
        run: mkdir -p "$RUNNER_TEMP/wrangler"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.168.0'
          workingDirectory: ${{ runner.temp }}/wrangler
          command: pages deploy ${{ runner.temp }}/ddd-public --project-name=deepdiverdown --branch=main
