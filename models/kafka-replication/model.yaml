unknowns:
  - id: UNK-01
    text: replica.lag.time.max.ms と min.insync.replicas の既定値は、確認した Design のページに記載がない。
    refs:
      - broker-1
  - id: UNK-02
    text: 障害時のリーダー切り替えにかかる時間は未確認。
    refs:
      - controller
gates:
  maxDrift: 0
  maxHigh: 99
implementations:
  - id: aws-msk-fargate
    label: AWS（Amazon MSK と ECS on Fargate）
    description: 3 つの AZ に Standard ブローカーを置いた MSK Provisioned に、Fargate 上の Producer が書き込む例。
    sources:
      - title: MSK Provisioned クラスターの作成
        url: https://docs.aws.amazon.com/msk/latest/developerguide/create-cluster-console.html
      - title: Amazon MSK と KRaft
        url: https://docs.aws.amazon.com/msk/latest/developerguide/metadata-management.html
      - title: MSK の IAM アクセス制御
        url: https://docs.aws.amazon.com/msk/latest/developerguide/iam-access-control.html
      - title: Amazon ECS のサービス定義
        url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service_definition_parameters.html
    tiers:
      - id: runtime
        label: 書き込みと複製
        z: 0
        size:
          - 14
          - 9
      - id: operations
        label: メタデータ管理
        z: 1
        size:
          - 14
          - 3
    groups:
      - kind: cloud
        label: AWS アカウント
        provider: aws
        tier:
          - runtime
          - operations
      - kind: vpc
        label: アプリとブローカーの VPC
        provider: aws
        tier:
          - runtime
        nodes:
          - aws-repl-producer
          - aws-repl-b1
          - aws-repl-b2
          - aws-repl-b3
      - kind: cluster
        label: MSK Provisioned（論理的な所属）
        tier:
          - runtime
          - operations
        nodes:
          - aws-repl-b1
          - aws-repl-b2
          - aws-repl-b3
          - aws-repl-controller
    nodes:
      aws-repl-producer:
        label: Fargate タスク（Producer）
        svc: fargate
        kind: worker
        tier: runtime
        x: 1
        'y': 4.5
        realizes:
          - producer
        description: IAM 認証でブローカーに接続し、P0 のリーダーへ書き込む。
        management:
          type: shared
          scope: AWS が Fargate 基盤を運用し、利用者がタスク定義、コンテナ、権限を設定する。
        evidence:
          - type: doc
            ref: docs/reference-kafka-replication.md#§7
      aws-repl-b1:
        label: MSK ブローカー 1（P0 リーダー）
        svc: msk
        kind: db
        tier: runtime
        x: 7
        'y': 1.5
        realizes:
          - broker-1
        description: 例では P0 のリーダー。
        management:
          type: shared
          scope: AWS が Kafka 基盤を運用し、利用者がトピック、複製係数、権限を設定する。
        evidence:
          - type: doc
            ref: docs/reference-kafka-replication.md#§7
      aws-repl-b2:
        label: MSK ブローカー 2
        svc: msk
        kind: db
        tier: runtime
        x: 7
        'y': 4.5
        realizes:
          - broker-2
        description: 例では ISR のフォロワーで、リーダーの切り替え先。
        management:
          type: shared
          scope: AWS が Kafka 基盤を運用し、利用者がトピックと権限を設定する。
        evidence:
          - type: doc
            ref: docs/reference-kafka-replication.md#§7
      aws-repl-b3:
        label: MSK ブローカー 3
        svc: msk
        kind: db
        tier: runtime
        x: 7
        'y': 7.5
        realizes:
          - broker-3
        description: 例では遅れたフォロワー。
        management:
          type: shared
          scope: AWS が Kafka 基盤を運用し、利用者がトピックと権限を設定する。
        evidence:
          - type: doc
            ref: docs/reference-kafka-replication.md#§7
      aws-repl-controller:
        label: MSK 管理の KRaft Controller
        svc: msk
        kind: service
        tier: operations
        x: 7
        'y': 1.5
        realizes:
          - controller
        description: リーダーと ISR のメタデータを管理する。配置は模式図。
        management:
          type: shared
          scope: AWS が Kafka 基盤を運用する。Controller の台数と配置は資料で確認していない。
        evidence:
          - type: doc
            ref: docs/reference-kafka-replication.md#§7
    links: []
