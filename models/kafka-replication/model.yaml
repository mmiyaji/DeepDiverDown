name: Kafka：レプリケーションと ISR・障害復旧
description: リーダーとフォロワーの複製、ISR、acks、リーダー障害後の選出と再開を追う。
reference:
  objectives:
    - リーダー、フォロワー、ISR、コミット済みの関係を説明する。
    - acks=all と min.insync.replicas が書き込み応答にどう効くかを追う。
    - リーダー障害から選出、再送、ISR 復帰までの流れを追う。
  sources:
    - title: Apache Kafka Design
      url: https://kafka.apache.org/44/design/design/
    - title: Producer Configs
      url: https://kafka.apache.org/44/configuration/producer-configs/
    - title: Broker Configs
      url: https://kafka.apache.org/44/configuration/broker-configs/
    - title: KRaft
      url: https://kafka.apache.org/44/operations/kraft/
sources:
  - docs/reference-kafka-replication.md
evidence:
  - type: doc
    ref: docs/reference-kafka-replication.md#§1
tiers:
  - id: producer
    label: 書き込み側
    kind: origin
    z: 0
    origin:
      - -5
      - 0
    size:
      - 2.5
      - 9
  - id: brokers
    label: Kafka クラスタ
    z: 0
    size:
      - 8
      - 9
  - id: metadata
    label: メタデータ管理
    z: 1
    origin:
      - 2
      - 0
    size:
      - 4
      - 2
nodes:
  producer:
    label: イベント送信元
    kind: client
    tier: producer
    x: 0.5
    'y': 2
    description: Topic にイベントを書き込む。対象パーティションのリーダーに接続する。
    evidence:
      - type: doc
        ref: docs/reference-kafka-replication.md#§2
      - type: doc
        ref: docs/reference-kafka-replication.md#§4
  controller:
    label: クラスターのメタデータ管理
    kind: service
    tier: metadata
    x: 1.5
    'y': 0.5
    description: トピック、パーティションの割り当てとリーダーの選出を管理する。
    evidence:
      - type: doc
        ref: docs/reference-kafka-replication.md#§5
    replicas: 3
  broker-1:
    label: Broker 1 · P0 リーダー
    kind: db
    tier: brokers
    x: 3
    'y': 1.5
    description: 開始時に P0 のリーダーを担当し、他のパーティションのレプリカも保持する。
    evidence:
      - type: doc
        ref: docs/reference-kafka-replication.md#§2
      - type: doc
        ref: docs/reference-kafka-replication.md#§3
  broker-2:
    label: Broker 2 · P0 フォロワー（ISR）
    kind: db
    tier: brokers
    x: 3
    'y': 4.5
    description: P0 のフォロワー。リーダー障害時の切り替え先。
    evidence:
      - type: doc
        ref: docs/reference-kafka-replication.md#§3
      - type: doc
        ref: docs/reference-kafka-replication.md#§5
  broker-3:
    label: Broker 3 · P0 フォロワー
    kind: db
    tier: brokers
    x: 3
    'y': 7.5
    description: P0 のフォロワー。遅れていて ISR から外れている例。
    evidence:
      - type: doc
        ref: docs/reference-kafka-replication.md#§3
      - type: doc
        ref: docs/reference-kafka-replication.md#§6
links:
  - id: produce
    from: producer
    to: broker-1
    label: P0 に追記
    evidence:
      - type: doc
        ref: docs/reference-kafka-replication.md#§2
  - id: replicate-2
    from: broker-1
    to: broker-2
    label: P0 の複製データ
    evidence:
      - type: doc
        ref: docs/reference-kafka-replication.md#§3
  - id: replicate-3
    from: broker-1
    to: broker-3
    label: P0 の複製データ
    evidence:
      - type: doc
        ref: docs/reference-kafka-replication.md#§3
  - id: ack
    from: broker-1
    to: producer
    label: 書き込み成功応答
    evidence:
      - type: doc
        ref: docs/reference-kafka-replication.md#§4
  - id: elect
    from: controller
    to: broker-2
    label: ISR から P0 の新リーダーを選出
    evidence:
      - type: doc
        ref: docs/reference-kafka-replication.md#§5
  - id: retry
    from: producer
    to: broker-2
    label: 新リーダーに P0 を再送
    evidence:
      - type: doc
        ref: docs/reference-kafka-replication.md#§6
  - id: replicate-after
    from: broker-2
    to: broker-3
    label: 新リーダーから P0 を複製
    evidence:
      - type: doc
        ref: docs/reference-kafka-replication.md#§6
scenarios:
  - id: kafka-replicate
    label: 複製と書き込み応答
    evidence:
      - type: doc
        ref: docs/reference-kafka-replication.md#§2
      - type: doc
        ref: docs/reference-kafka-replication.md#§3
      - type: doc
        ref: docs/reference-kafka-replication.md#§4
    steps:
      - links:
          - produce
        note: 追記。Producer が P0 のリーダー Broker 1 にバッチを送る。
      - links:
          - replicate-2
          - replicate-3
        note: 複製。フォロワーがリーダーのログを取り込む。遅れて ISR を外れたフォロワーは、応答の待ち対象から外れる。
      - links:
          - ack
        note: 応答。acks=all では ISR 全員が受け、ISR が min.insync.replicas を満たすと成功応答が返る。
  - id: kafka-failover
    visual: replicas
    label: Broker 障害とリーダー切り替え
    evidence:
