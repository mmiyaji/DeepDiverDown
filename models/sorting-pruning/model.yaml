implementations:
  - id: bigquery-clustered
    label: BigQuery の月パーティションと顧客クラスタリング
    description: BigQuery の orders テーブルを注文日の月でパーティション化し、customer_id でクラスタリングする例。月の除外とブロックの除外を別々に追える。
    sources:
      - title: Query partitioned tables
        url: https://cloud.google.com/bigquery/docs/querying-partitioned-tables
      - title: Introduction to clustered tables
        url: https://cloud.google.com/bigquery/docs/clustered-tables
      - title: Query clustered tables
        url: https://cloud.google.com/bigquery/docs/querying-clustered-tables
      - title: Apache Iceberg Specification - Sorting
        url: https://iceberg.apache.org/spec/#sorting
      - title: Create partitioned tables
        url: https://cloud.google.com/bigquery/docs/creating-partitioned-tables
    tiers:
      - id: processing
        label: データの処理と保存
        z: 0
        size:
          - 14
          - 5
      - id: setup
        label: 実行に必要な設定・成果物
        z: 1
        size:
          - 14
          - 3
    nodes:
      bigquery-clustered-client:
        label: BigQuery コンソールの SQL エディター
        kind: client
        tier: processing
        svc: gcp:bigquery
        x: 1
        'y': 1.15
        realizes:
          - analyst
        description: 日付範囲と顧客キーを WHERE に指定する。
        evidence:
          - type: doc
            ref: docs/reference-sorting-pruning.md#§9
      bigquery-clustered-table:
        label: BigQuery orders テーブル
        kind: table
        tier: processing
        x: 1
        'y': 3.65
        svc: gcp:bigquery
        realizes:
          - orders
          - partitions
          - blocks
        description: DATE_TRUNC で月別にパーティション化し、同じ月では customer_id をクラスタ列にする。
        evidence:
          - type: doc
            ref: docs/reference-sorting-pruning.md#§9
      bigquery-clustered-engine:
        label: BigQuery の SQL 実行
        kind: service
        tier: processing
        x: 5
        'y': 1.15
        realizes:
          - query
          - scan
        description: 関係する月に絞り、クラスタ列を使う述語で不要なブロックを除外し得る。
        evidence:
          - type: doc
            ref: docs/reference-sorting-pruning.md#§9
        svc: gcp:bigquery
      bigquery-clustered-result:
        label: BigQuery のクエリ結果
        kind: external
        tier: processing
        x: 5
        'y': 3.65
        realizes:
          - result
        description: 条件に合う行を返し、順序が必要なら SELECT の ORDER BY を使用する。
        evidence:
          - type: doc
            ref: docs/reference-sorting-pruning.md#§9
        svc: gcp:bigquery
      bigquery-clustered-stats:
        label: クエリジョブの処理量
        kind: monitor
        tier: setup
        svc: gcp:bigquery
        x: 1
        'y': 1.5
        description: パーティションによる見積りと、実行後の処理バイトなどを参照する。クラスタリングの除外量は実行まで確定しない。
        evidence:
          - type: doc
            ref: docs/reference-sorting-pruning.md#§9
    links:
      - id: bigquery-clustered-stats-connection
        from: bigquery-clustered-stats
        to: bigquery-clustered-engine
        label: ジョブの処理量を確認
    groups:
      - kind: cloud
        provider: gcp
        label: Google Cloud サービス
        tier:
          - processing
        nodes:
          - bigquery-clustered-client
          - bigquery-clustered-table
          - bigquery-clustered-engine
          - bigquery-clustered-result
      - kind: cloud
        provider: gcp
        label: BigQuery ジョブの観測
        tier: [setup]
        nodes: [bigquery-clustered-stats]
