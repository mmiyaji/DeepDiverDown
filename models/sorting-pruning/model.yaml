requirements:
  - id: BR-01
    kind: usecase
    title: 段階的な読み取り削減
    text: order_date のパーティションと customer_id の保存単位を別々に絞り、残りだけをスキャンする。
    links:
      - partition-prune
      - block-skip
      - read
    evidence:
      - type: doc
        ref: docs/reference-sorting-pruning.md#§3
      - type: doc
        ref: docs/reference-sorting-pruning.md#§4
  - id: BR-02
    kind: rule
    title: ORDER BY の意味を分離
    text: 保存時のソート／クラスタリングをクエリ結果の ORDER BY と混同しない。
    links:
      - cluster
      - order
      - return
    evidence:
      - type: doc
        ref: docs/reference-sorting-pruning.md#§2
      - type: doc
        ref: docs/reference-sorting-pruning.md#§4
  - id: NFR-01
    kind: nfr
    title: 実装差を明示
    text: ブロック、ファイル、列チャンク、min/max 統計の適用単位を特定の実装の保証として断定しない。
    links:
      - block-skip
      - read
    evidence:
      - type: doc
        ref: docs/reference-sorting-pruning.md#§1
      - type: doc
        ref: docs/reference-sorting-pruning.md#§5
unknowns:
  - id: UNK-01
    text: 実際のエンジン、ファイル形式、統計の粒度、再クラスタリング頻度は未確定。
    refs:
      - query
      - blocks
      - scan
