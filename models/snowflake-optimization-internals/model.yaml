name: Snowflake：読み取り・検索と性能最適化
description: 注文データを例に、区画の絞り込み、検索用構造、キャッシュ、追加並列化と観測を追う。図は公開情報から組み立てた論理モデル。
parent:
  model: snowflake-query-performance
  node: metadata
reference:
  objectives:
    - 区画統計・検索パス・式の統計が読み取り候補にどう影響するか理解する。
    - 結果キャッシュとウェアハウスのデータキャッシュを区別する。
    - 任意の最適化の適用条件と維持費を理解する。
  sources:
    - title: Query Profile
      url: https://docs.snowflake.com/en/user-guide/ui-snowsight-activity
    - title: Micro-partitions
      url: https://docs.snowflake.com/en/user-guide/tables-clustering-micropartitions
    - title: Search optimization
      url: https://docs.snowflake.com/en/user-guide/search-optimization-service
    - title: Optima Metadata
      url: https://docs.snowflake.com/en/user-guide/snowflake-optima
    - title: Query Acceleration Service
      url: https://docs.snowflake.com/en/user-guide/query-acceleration-service
    - title: Top-K pruning
      url: https://docs.snowflake.com/en/user-guide/querying-top-k-pruning-optimization
    - title: Result cache
      url: https://docs.snowflake.com/en/user-guide/querying-persisted-results
    - title: Warehouse cache
      url: https://docs.snowflake.com/en/user-guide/performance-query-warehouse-cache
    - title: Automatic Clustering
      url: https://docs.snowflake.com/en/user-guide/tables-auto-reclustering
sources:
  - docs/reference-snowflake-optimization-internals.md
evidence:
  - type: doc
    ref: docs/reference-snowflake-optimization-internals.md#§1
  - type: doc
    ref: docs/reference-snowflake-optimization-internals.md#§3
  - type: doc
    ref: docs/reference-snowflake-optimization-internals.md#§4
  - type: doc
    ref: docs/reference-snowflake-optimization-internals.md#§5
  - type: doc
    ref: docs/reference-snowflake-optimization-internals.md#§6
tiers:
  - id: control
    label: 要求と計画
    z: 2
    size:
      - 24
      - 4
  - id: compute
    label: 実行と観測
    z: 1
    size:
      - 24
      - 4
  - id: storage
    label: データと補助情報
    z: 0
    size:
      - 24
      - 4
nodes:
  client:
    label: SQL の発行
    kind: client
    tier: control
    x: 0
    'y': 1.5
    description: 日付条件や検索条件を付けて SQL を発行する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  planner:
    label: 計画と候補の選択
    kind: service
    tier: control
    x: 5
    'y': 1.5
    description: 条件とメタデータを使って計画し、結果再利用を判断する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  result:
    label: 保存済み結果
    kind: cache
    tier: control
    x: 11
    'y': 1.5
    description: 再利用可能な結果。権限、データ、SQL などの条件が必要で、再利用は保証されない。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  profile:
    label: 実行の観測
    kind: service
    tier: control
    x: 17
    'y': 1.5
    description: 待ち、読み取り区画、演算子ごとの行数や spill を調べる。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  scan:
    label: 候補区画の読み取り
    kind: worker
    tier: compute
    x: 2
    'y': 1.5
    description: 候補となった区画の必要列を読み、フィルターを適用する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  operators:
    drill: snowflake-aggregation-placement
    label: 結合・集計・並べ替え
    kind: worker
    tier: compute
    x: 7
    'y': 1.5
    description: 結合・集計・ソートを実行する。条件に応じて動的 pruning や Top-K pruning が使われる。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  whcache:
    label: 実行資源内のデータキャッシュ
    kind: cache
    tier: compute
    x: 12
    'y': 1.5
    description: 同じウェアハウスの後続クエリで利用できる。ウェアハウス停止時に破棄される。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  qas:
    label: 対象処理の追加並列化
    kind: service
    tier: compute
    x: 17
    'y': 1.5
    description: 有効化され対象条件を満たす場合、処理の一部を共有計算資源にオフロードする。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  metadata:
    drill: snowflake-optima-internals
    label: 区画ごとの統計
    kind: db
    tier: storage
    x: 0
    'y': 1.5
    description: 区画内の列の値域などを使い、条件に合わない区画を除外する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  search:
    label: 検索用の補助構造
    kind: db
    tier: storage
    x: 4
    'y': 1.5
    description: 検索用の永続化された access path。値が存在し得る区画の候補を絞る。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  optima:
    label: 式に応じた追加統計
    kind: db
    tier: storage
    x: 8
    'y': 1.5
    description: 対象ワークロードを分析し式ごとのメタデータを生成する。対象ウェアハウスに制約がある。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  partitions:
    label: 列指向の保存区画
    kind: db
    tier: storage
    x: 13
    'y': 1.5
    description: マイクロパーティションは列ごとに保存・圧縮される。範囲が一部重なる区画は候補として残る。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  cluster:
    drill: snowflake-clustering-internals
    label: データ配置の保守
    kind: service
    tier: storage
    x: 18
    'y': 1.5
    description: 設定したクラスタリングキーに基づく再編成により区画の配置を維持する。費用が発生する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
links:
  - id: submit
    from: client
    to: planner
    label: SQL を送る
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  - id: meta
    from: metadata
    to: planner
    label: 区画統計を参照
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  - id: index
    from: search
    to: planner
    label: 検索候補を参照
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  - id: expr
    from: optima
    to: planner
    label: 式の統計を参照
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  - id: start
    from: planner
    to: scan
    label: 候補区画の読み取りを指示
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  - id: read
    from: partitions
    to: scan
    label: 必要な列を読む
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  - id: cached-read
    from: whcache
    to: scan
    label: キャッシュ済みデータを読む
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  - id: process
    from: scan
    to: operators
    label: 行を結合・集計
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  - id: return
    from: operators
    to: client
    label: 結果を返す
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  - id: result-check
    from: planner
    to: result
    label: 再利用条件を確認
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  - id: result-return
    from: result
    to: client
    label: 保存済み結果を返す
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  - id: accel
    from: operators
    to: qas
    label: 対象処理をオフロード
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  - id: accel-return
    from: qas
    to: operators
    label: 処理結果を返す
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  - id: maintain
    from: cluster
    to: partitions
    label: 区画を再編成
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  - id: search-build
    from: partitions
    to: search
    label: 検索パスを維持
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
  - id: observe
    from: operators
    to: profile
    label: 実行統計を確認
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
scenarios:
  - id: prune
    label: 日付条件と列の読み取り
    visual: grid
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§2
    steps:
      - links:
          - submit
          - meta
        note: 日付条件を計画し、区画の値域で候補を絞る。
        prune:
          - row:p1
          - row:p2
      - links:
          - start
          - read
        note: 候補区画の必要な列だけを読む。
        read:
          - row:p3
          - row:p4
      - links:
          - process
          - return
          - observe
        note: 結合・集計して結果を返し、Query Profile で読み取りを確認する。
  - id: search-qas
    label: 検索パスと追加並列化
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§3
    steps:
      - links:
          - submit
          - index
        note: 対象の等値検索で検索パスを利用できる場合、候補を絞る。
      - links:
          - start
          - read
          - process
        note: 候補から必要な列を読み、実行する。
      - links:
          - accel
          - accel-return
          - return
        note: QAS が有効でクエリが対象なら、残った処理の一部をオフロードする。対象外なら利用しない。
  - id: optima
    label: 式に応じたメタデータ
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§3
    steps:
      - links:
          - submit
          - expr
        note: 対象環境で頻出するフィルター式の追加メタデータを利用できる場合、候補を絞る。
      - links:
          - start
          - read
          - process
          - return
        note: 残った区画を読み、処理して結果を返す。
  - id: reuse
    label: 結果・データのキャッシュ
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§4
    steps:
      - links:
          - submit
          - result-check
        note: 権限、入力の変更、SQL などを確認する。
      - links:
          - result-return
        note: 再利用条件を満たし、結果が利用された場合は保存済み結果を返す。
      - links:
          - start
          - cached-read
          - process
          - return
        note: 結果を再利用しない場合も、稼働中のウェアハウスのデータキャッシュを利用できる場合がある。
  - id: clustering
    label: 配置の保守と再計測
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optimization-internals.md#§5
    steps:
      - links:
          - maintain
          - search-build
        note: 自動クラスタリングが区画を再編成し、検索パスを使用していれば保守対象にもなる。
      - links:
          - submit
          - meta
          - start
          - read
        note: 同じ条件で読み取り候補を調べる。
      - links:
          - process
          - observe
        note: Query Profile と保守費用を以前の結果と比較する。
grid:
  title: 日付条件による候補区画と列
  rowLabel: 注文日の範囲
  colLabel: 列
  unit: ' 単位'
  node: partitions
  rows:
    - id: p1
      label: 1/01〜1/07
    - id: p2
      label: 1/08〜1/14
    - id: p3
      label: 1/24〜1/27
    - id: p4
      label: 1/28〜1/31
  cols:
    - id: date
      label: 注文日
    - id: amount
      label: 金額
  values:
    - - 3
      - 8
    - - 3
      - 8
    - - 3
      - 8
    - - 3
      - 8
  note: 例示値。1/25 以降を検索すると、範囲が一部重なる 1/24〜1/27 は候補に残る。
