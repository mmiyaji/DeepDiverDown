        label: Parquet の Variant 列
        kind: db
        tier: files
        x: 12
        'y': 1.5
        description: 同じ列 ID のままファイルごとに物理配置が異なり得る。
        drill: parquet-internals
        evidence:
          - type: doc
            ref: docs/reference-iceberg-v3-variant.md#§5
        realizes:
          - file
      ex-manifest:
        label: Iceberg data manifest
        kind: file
        tier: metadata
        x: 8
        'y': 1.5
        description: Variant のパス別上下限は任意。常に存在するとは限らない。
        drill: iceberg-v3-metadata
        evidence:
          - type: doc
            ref: docs/reference-iceberg-v3-variant.md#§5
        realizes:
          - manifest
    links:
      - {id: ex-host-spark, from: ex-host, to: ex-engine, label: Spark ジョブを実行}
