  - id: aws-emr-serverless
    label: AWS（EMR Serverless・Glue・S3）
    description: 対応ランタイムの EMR Serverless で Iceberg v3 の Variant を書き込み、S3 上の Parquet を読む例。
    sources:
      - {title: EMR Serverless emr-spark-8.2.0, url: https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/release-version-emr-spark-8.2.0.html}
      - {title: Amazon EMR Spark の Iceberg 対応, url: https://docs.aws.amazon.com/prescriptive-guidance/latest/apache-iceberg-on-aws/working-with-iceberg-in-amazon-emr-spark.html}
      - {title: Apache Iceberg の Variant, url: https://iceberg.apache.org/blog/variant-in-apache-iceberg/}
    tiers:
      - {id: compute, label: Spark SQL の計画と読み書き, z: 1, size: [19, 4]}
      - {id: storage, label: カタログと Iceberg ファイル, z: 0, size: [19, 4]}
    groups:
      - {kind: cloud, label: AWS アカウント, provider: aws, tier: [compute, storage], nodes: [aws-emr, aws-driver, aws-executor, aws-glue, aws-metadata, aws-parquet]}
      - {kind: cluster, label: EMR Serverless の Spark アプリケーション, tier: compute, nodes: [aws-driver, aws-executor]}
    nodes:
      aws-emr: {label: Amazon EMR Serverless, svc: emr, kind: service, tier: compute, x: 2, y: 1.5, description: emr-spark-8.2.0 を使って Spark ジョブとワーカーを管理する。, management: {type: shared, scope: "AWS がサービス基盤を運用し、利用者がアプリケーションとジョブを設定する。"}, evidence: [{type: doc, ref: docs/reference-iceberg-v3-variant.md#§6}]}
      aws-driver: {label: Spark 4.1（Driver）, kind: service, tier: compute, x: 8, y: 1.5, realizes: [engine, plan], description: Variant の SQL と Iceberg のスキャン計画を処理する。, management: {type: shared, scope: "AWS がワーカーを運用し、利用者が SQL とジョブ設定を管理する。"}, evidence: [{type: doc, ref: docs/reference-iceberg-v3-variant.md#§6}]}
      aws-executor: {label: Spark 4.1（Executor）, kind: worker, tier: compute, x: 14, y: 1.5, realizes: [reader], description: Parquet 上の Variant をデコードし、列やパスを評価する。, management: {type: shared, scope: "AWS がワーカーを運用し、利用者がジョブ設定を管理する。"}, evidence: [{type: doc, ref: docs/reference-iceberg-v3-variant.md#§6}]}
      aws-glue: {label: AWS Glue Data Catalog, svc: glue, kind: catalog, tier: storage, x: 2, y: 1.5, description: 論理表名から現在の Iceberg メタデータの場所を取得する。, management: {type: shared, scope: "AWS が Glue 基盤を運用し、利用者がカタログと権限を管理する。"}, evidence: [{type: doc, ref: docs/reference-iceberg-v3-variant.md#§6}]}
      aws-metadata: {label: Amazon S3（Iceberg メタデータ）, svc: s3, kind: db, tier: storage, x: 8, y: 1.5, realizes: [schema, manifest], description: 表スキーマとファイル参照および任意のファイル統計を保存する。, management: {type: shared, scope: "AWS が S3 基盤を運用し、利用者がデータと権限を管理する。"}, evidence: [{type: doc, ref: docs/reference-iceberg-v3-variant.md#§6}]}
      aws-parquet: {label: Amazon S3（Variant の Parquet）, svc: s3, kind: db, tier: storage, x: 14, y: 1.5, realizes: [meta, value, typed, file], description: Variant の metadata・value と書き込みに応じた typed_value を保持する。, management: {type: shared, scope: "AWS が S3 基盤を運用し、利用者がデータと権限を管理する。"}, evidence: [{type: doc, ref: docs/reference-iceberg-v3-variant.md#§6}]}
    links:
      - {id: aws-metadata-read, from: aws-driver, to: aws-metadata, label: 表メタデータと Manifest を読む}
      - {id: aws-executors, from: aws-emr, to: aws-executor, label: Executor ワーカーを確保}
      - {id: aws-manage, from: aws-emr, to: aws-driver, label: Spark ジョブを起動}
      - {id: aws-catalog, from: aws-driver, to: aws-glue, label: 現行メタデータの位置を取得}
      - {id: aws-write, from: aws-executor, to: aws-parquet, label: Variant を含む Parquet を保存}
