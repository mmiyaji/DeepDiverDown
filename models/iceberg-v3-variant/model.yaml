        - {kind: datacenter, label: 自前 Linux Spark クラスター, provider: onprem, tier: [diagram], nodes: [ex-host, ex-storage, ex-engine, ex-schema, ex-plan, ex-reader, ex-meta, ex-value, ex-typed, ex-file, ex-manifest]}
