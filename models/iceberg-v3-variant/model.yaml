        - {id: zone2, label: "S3 ファイル", z: 0, origin: [14, 0], size: [5, 6]}
      nodes:
        aws-emr: {tier: zone0, x: 2, y: 1}
        aws-driver: {tier: zone0, x: 2, y: 4}
        aws-executor: {tier: zone0, x: 2, y: 7}
        aws-glue: {tier: zone1, x: 2, y: 1}
        aws-metadata: {tier: zone2, x: 2, y: 1}
        aws-parquet: {tier: zone2, x: 2, y: 4}
      groups:
        - {kind: cloud, provider: aws, label: AWS の論理的所属, tier: [zone0, zone1, zone2], nodes: [aws-emr, aws-driver, aws-executor, aws-glue, aws-metadata, aws-parquet]}
