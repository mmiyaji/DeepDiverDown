    groups:
      - {kind: datacenter, label: 自前 Linux Spark クラスター, provider: onprem, tier: [zone0, zone1, zone2], nodes: [ex-host, ex-storage, ex-engine, ex-schema, ex-plan, ex-reader, ex-meta, ex-value, ex-typed, ex-file, ex-manifest]}
