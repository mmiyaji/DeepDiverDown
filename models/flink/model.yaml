    tiers:
      - {id: entry, label: 投入元, kind: origin, z: 1, origin: [-5, 0], size: [3, 4]}
      - {id: runtime, label: 管理と実行, z: 1, size: [17, 7]}
      - {id: data, label: データと復旧, z: 0, size: [17, 5]}
    groups:
      - {kind: cloud, label: "AWS アカウント", provider: aws, tier: [runtime, data], nodes: [aws-emr-eks-flink-control, aws-emr-eks-flink-capacity, aws-emr-eks-flink-operator, aws-emr-eks-flink-jobmanager, aws-emr-eks-flink-taskmanager, aws-emr-eks-flink-state, aws-emr-eks-flink-source, aws-emr-eks-flink-sink, aws-emr-eks-flink-checkpoint, aws-emr-eks-flink-ha]}
      - {kind: cluster, label: "Amazon EKS クラスター", provider: k8s, tier: [runtime], nodes: [aws-emr-eks-flink-control, aws-emr-eks-flink-capacity, aws-emr-eks-flink-operator, aws-emr-eks-flink-jobmanager, aws-emr-eks-flink-taskmanager, aws-emr-eks-flink-state]}
      - {kind: namespace, label: "Flink の実行名前空間", provider: k8s, tier: [runtime], nodes: [aws-emr-eks-flink-operator, aws-emr-eks-flink-jobmanager, aws-emr-eks-flink-taskmanager, aws-emr-eks-flink-state]}
