    nodes:
      aws-emr-eks-flink-kubectl: {label: "kubectl", kind: client, tier: entry, x: 1, y: 1.5, description: "FlinkDeployment を EKS の Kubernetes API に適用する。", evidence: [{type: doc, ref: docs/reference-flink.md#§9}]}
      aws-emr-eks-flink-control: {label: "EKS Kubernetes API", kind: service, svc: eks, tier: runtime, x: 1, y: 1.5, description: "Kubernetes API で FlinkDeployment を受け付け、スケジューラーが Pod を配置する。", management: {type: shared, scope: "AWS が制御プレーンを運用し、利用者が Kubernetes API と設定を操作する。"}, evidence: [{type: doc, ref: docs/reference-flink.md#§9}]}
      aws-emr-eks-flink-operator: {label: "Flink Kubernetes Operator", kind: scheduler, tier: runtime, x: 5.5, y: 1.5, description: "FlinkDeployment を監視し、EMR ランタイムの Flink アプリケーションを管理する。", management: {type: customer, scope: "利用者が Operator と設定を管理する。"}, evidence: [{type: doc, ref: docs/reference-flink.md#§9}]}
      aws-emr-eks-flink-capacity: {label: "EKS の EC2 ノード", kind: host, svc: ec2, tier: runtime, x: 14, y: 0.2, description: "Operator Pod と EMR ランタイムを使う Flink Pod を稼働させる。", management: {type: shared, scope: "AWS が EC2 基盤を運用し、利用者がノードグループを管理する。"}, evidence: [{type: doc, ref: docs/reference-flink.md#§9}]}
