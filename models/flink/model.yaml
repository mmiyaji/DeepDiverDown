name: Apache Flink の基本アーキテクチャ
description: JobManager（Dispatcher・JobMaster・ResourceManager）、TaskManager のスロット、Source と Sink、状態バックエンド、チェックポイント保存先の役割と、ジョブが動いて復旧するまでの流れ。
reference:
  objectives:
    - JobManager の 3 つの役割（Dispatcher・JobMaster・ResourceManager）と TaskManager のスロットを区別する。
    - Source・Operator・Sink のデータの流れと、状態・チェックポイントの置き場所を説明する。
    - Amazon Managed Service for Apache Flink と自前ホストの Standalone で、利用者が管理する範囲の違いを読む。
  sources:
    - title: Flink · Flink Architecture
      url: https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/flink-architecture/
    - title: Flink · Overview (API layers)
      url: https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/overview/
    - title: Flink · Stateful Stream Processing
      url: https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/stateful-stream-processing/
    - title: Flink · State Backends
      url: https://nightlies.apache.org/flink/flink-docs-stable/docs/ops/state/state_backends/
    - title: Flink · Native Kubernetes
      url: https://nightlies.apache.org/flink/flink-docs-stable/docs/deployment/resource-providers/native_kubernetes/
    - title: Managed Service for Apache Flink · How it works
      url: https://docs.aws.amazon.com/managed-flink/latest/java/how-it-works.html
sources:
  - docs/reference-flink.md
evidence:
  - type: doc
    ref: docs/reference-flink.md#§1
tiers:
  - id: control
    label: クライアントと JobManager
    z: 2
    size:
      - 22
      - 3
  - id: flow
    label: データの流れ（TaskManager）
    z: 1
    size:
      - 22
      - 3
  - id: fault
    label: 状態とチェックポイント
    z: 0
    size:
      - 22
      - 3
nodes:
  client:
    label: クライアント
    kind: client
    tier: control
    x: 0
    "y": 1.5
    replicas: 2
    description: アプリケーションのデータフローを組み立てて JobManager へ提出する。ランタイムの一部ではない。
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§2
  dispatcher:
    label: Dispatcher
    kind: service
    tier: control
    x: 5
    "y": 1.5
    replicas: 1
    description: 提出を受ける REST インターフェースと Web UI を持ち、ジョブごとに JobMaster を起動する。
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§2
  jobmaster:
    label: JobMaster
    kind: scheduler
    tier: control
    x: 10
    "y": 1.5
    replicas: 1
    description: ジョブ 1 つの JobGraph の実行を管理する。チェックポイントの開始もここから行う。
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§2
      - type: doc
        ref: docs/reference-flink.md#§4
  resourcemanager:
    label: ResourceManager
    kind: scheduler
    tier: control
    x: 16
    "y": 1.5
    replicas: 1
    description: タスクスロットを含むリソースの割り当てと確保を担う。Standalone では既存の TaskManager のスロットを配るだけ。
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§2
      - type: doc
        ref: docs/reference-flink.md#§5
  source:
    label: Source（再読できる入力）
    kind: queue
    tier: flow
    x: 1
    "y": 1.5
    replicas: 2
    description: Kafka などから読み、読み取り位置をチェックポイントに残す。位置を巻き戻せる入力がチェックポイントからの再開に必要。
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§3
  operator:
    label: TaskManager のスロットで動く Task
    kind: worker
    tier: flow
    x: 6
    "y": 1.5
    parallel: "N"
    slots: 2
    description: TaskManager（JVM プロセス）がスロットで Task を並列に実行し、Task 間のデータを交換する。
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§2
      - type: doc
        ref: docs/reference-flink.md#§3
  exchange:
    label: Task 間のデータ交換
    kind: queue
    tier: flow
    x: 12
    "y": 1.5
    replicas: 2
    description: keyBy などの再分配で、Task がバッファ経由でデータを受け渡す。
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§3
  sink:
    label: Sink（出力先）
    kind: queue
    tier: flow
    x: 17
    "y": 1.5
    replicas: 2
    description: 集計結果を Kafka などの外部システムへ書く。
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§3
  state:
    label: 状態バックエンド
    kind: db
    tier: fault
    x: 9
    "y": 1.5
    partitions: 4
    description: キー付き状態を持つ場所。HashMapStateBackend は JVM ヒープ、EmbeddedRocksDBStateBackend は TaskManager のローカルディスク。
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§4
  checkpoint:
    label: チェックポイント保存先
    kind: db
    tier: fault
    x: 17
    "y": 1.5
    replicas: 2
    description: 完了したチェックポイントの状態と入力位置の置き場所。execution.checkpointing.dir に分散ファイルシステムのパスを指定する。状態バックエンドとは別に選ぶ。
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§4
links:
  - id: submit
    from: client
    to: dispatcher
    label: データフローを提出
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§2
  - id: start
    from: dispatcher
    to: jobmaster
    label: JobMaster を起動
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§2
  - id: request
    from: jobmaster
    to: resourcemanager
    label: スロットを要求
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§2
  - id: deploy
    from: jobmaster
    to: operator
    label: Task をデプロイ
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§2
  - id: allocate
    from: resourcemanager
    to: operator
    label: スロットを確保
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§2
  - id: ingest
    from: source
    to: operator
    label: イベントを取り込む
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§3
  - id: shuffle
    from: operator
    to: exchange
    label: 再分配して渡す
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§3
  - id: emit
    from: exchange
    to: sink
    label: 結果を出力
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§3
  - id: aggregate
    from: operator
    to: state
    label: キー別状態を更新
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§4
  - id: trigger
    from: jobmaster
    to: source
    label: チェックポイントを開始（バリアを注入）
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§4
  - id: snapshot
    from: operator
    to: checkpoint
    label: 状態と入力位置を保存
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§4
  - id: restore
    from: checkpoint
    to: operator
    label: 最新の完了点から復元
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§4
scenarios:
  - id: job-run
    label: ジョブが提出されて動き出す
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§6
    steps:
      - links:
          - submit
          - start
        note: クライアントがデータフローを Dispatcher に提出し、Dispatcher がジョブ用の JobMaster を起動する。
      - links:
          - request
          - allocate
        note: JobMaster が ResourceManager にスロットを要求し、TaskManager のスロットが確保される。
      - links:
          - deploy
          - ingest
        note: JobMaster が Task をスロットにデプロイし、Source から読んだイベントが Task へ流れる。
      - links:
          - shuffle
          - aggregate
          - emit
        note: Task がキー別の状態を更新し、結果を Sink へ出す。
  - id: checkpoint-recovery
    label: チェックポイントと復旧
    evidence:
      - type: doc
        ref: docs/reference-flink.md#§6
    steps:
      - links:
          - trigger
          - ingest
        note: JobMaster がバリアを Source に注入し、バリアがイベントと一緒に流れる。
      - links:
          - aggregate
          - snapshot
        note: 各 Task が状態と入力位置をチェックポイント保存先へ書く。
      - links:
          - restore
        note: 障害時は最新の完了したチェックポイントから状態と入力位置を戻して再開する。
unknowns:
  - id: UNK-01
    text: Managed Service for Apache Flink の内部（JobManager・TaskManager の配置、状態バックエンド、チェックポイントの保存先）は、確認した資料に記載がない。図ではサービスの 1 部品として描く。
    refs:
      - jobmaster
      - state
      - checkpoint
  - id: UNK-02
    text: JobManager の高可用性（standby JobManager、ZooKeeper や Kubernetes による leader 選出）の構成は、この図では扱わない。Kubernetes HA は「Flink：Kubernetes 上の運用」で扱う。Standalone での HA の構成は未確認。
    refs:
      - jobmaster
  - id: UNK-03
    text: Standalone クラスタの起動スクリプト、設定ファイル、必要な Java のバージョンは、今回確認した資料の範囲では読めていない（Standalone の概要ページ未確認）。
    refs:
      - dispatcher
      - operator
  - id: UNK-04
    text: Managed Service for Apache Flink が MSK と接続するネットワーク経路（VPC 設定など）は、今回確認した資料に記載がない。
    refs:
      - source
      - sink
gates:
  maxDrift: 0
  maxHigh: 4
implementations:
  - id: msf
    label: Amazon Managed Service for Apache Flink と MSK
    description: S3 のアプリケーションコードを Managed Service for Apache Flink で実行し、MSK の注文トピックを読んで別トピックへ書く構成例。
    sources:
      - title: Managed Service for Apache Flink · How it works
        url: https://docs.aws.amazon.com/managed-flink/latest/java/how-it-works.html
      - title: Managed Service for Apache Flink · Fault tolerance
        url: https://docs.aws.amazon.com/managed-flink/latest/java/how-fault.html
      - title: Managed Service for Apache Flink · Application scaling
        url: https://docs.aws.amazon.com/managed-flink/latest/java/how-scaling.html
      - title: Flink · Flink Architecture
        url: https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/flink-architecture/
    tiers:
      - id: entry
        label: 利用者
        kind: origin
        z: 2
        size:
          - 16
          - 3
      - id: managed
        label: Flink の実行（サービスが運用）
        z: 1
        size:
          - 16
          - 4
      - id: data
        label: 入出力・コード・ログ
        z: 0
        size:
          - 16
          - 4
    nodes:
      msf-client:
        label: AWS コンソール・CLI
        kind: client
        tier: entry
        x: 1
        "y": 1.5
        realizes:
          - client
        description: CreateApplication と StartApplication でアプリケーションを作る。
        evidence:
          - type: doc
            ref: docs/reference-flink.md#§7
      msf-app:
        svc: oss:flink
        label: Flink アプリケーション
        kind: service
        tier: managed
        x: 3
        "y": 1.5
        provider: aws
        realizes:
          - dispatcher
          - jobmaster
          - resourcemanager
          - operator
          - state
          - exchange
        description: S3 のコードを実行する。Parallelism と ParallelismPerKPU から KPU が決まる（1 KPU は 1 vCPU・4 GB）。JobManager・TaskManager の内部配置は公開資料で確認できない。
        evidence:
          - type: doc
            ref: docs/reference-flink.md#§7
        management:
          type: shared
          scope: AWS がサービスの実行基盤を運用し、利用者がアプリケーションコード・並列度・チェックポイント設定・権限を管理する。内部の JobManager・TaskManager の配置と操作範囲は確認した資料に記載がない。
      msf-checkpoint:
        label: チェックポイント・スナップショット
        kind: db
        tier: managed
        x: 11
        "y": 1.5
        provider: aws
        realizes:
          - checkpoint
        description: 既定でチェックポイントが有効（間隔 60000 ms、最小間隔 5000 ms）。保存先と状態バックエンドは確認した資料に記載がない。スナップショットは利用者が作り、更新・スケール時はシステムスナップショットも作られる。
        evidence:
          - type: doc
            ref: docs/reference-flink.md#§7
        management:
          type: shared
          scope: AWS がサービスの実行基盤を運用し、利用者がアプリケーションコード・並列度・チェックポイント設定・権限を管理する。内部の JobManager・TaskManager の配置と操作範囲は確認した資料に記載がない。
      msf-code:
        label: S3 のアプリケーションコード
        kind: db
        tier: data
        x: 1
        "y": 1.5
        svc: s3
        description: 作成時に S3 のバケットとキーで JAR・ZIP を指定する。
        evidence:
          - type: doc
            ref: docs/reference-flink.md#§7
        management:
          type: shared
          scope: AWS が S3 基盤を運用し、利用者がバケット・データ・権限を管理する。
      msf-source:
        label: MSK 注文トピック
        kind: queue
        tier: data
        x: 6
        "y": 1.5
        svc: msk
        realizes:
          - source
        description: KafkaSource が読むイベントを保持する。
        evidence:
          - type: doc
            ref: docs/reference-flink.md#§7
        management:
          type: shared
          scope: AWS が MSK 基盤を運用し、利用者がトピックとアクセス権を管理する。
      msf-sink:
        label: MSK 集計トピック
        kind: queue
        tier: data
        x: 11
        "y": 1.5
        svc: msk
        realizes:
          - sink
        description: KafkaSink が結果を書く。
        evidence:
          - type: doc
            ref: docs/reference-flink.md#§7
        management:
          type: shared
          scope: AWS が MSK 基盤を運用し、利用者がトピックとアクセス権を管理する。
      msf-role:
        label: IAM サービス実行ロール
        kind: policy
        tier: managed
        x: 7
        "y": 1.5
        svc: iam
        description: アプリケーションが S3 のコードや入出力へアクセスする権限（ServiceExecutionRole）。
        evidence:
          - type: doc
            ref: docs/reference-flink.md#§7
        management:
          type: customer
          scope: 利用者がロールとポリシーを設定する。
      msf-logs:
        label: CloudWatch Logs
        kind: monitor
        tier: data
        x: 15
        "y": 1.5
        svc: cloudwatch
        description: アプリケーションのログの出力先。
        evidence:
          - type: doc
            ref: docs/reference-flink.md#§7
        management:
          type: shared
          scope: AWS がログ基盤を運用し、利用者が保持設定と閲覧を管理する。
    links:
      - id: msf-load-code
        from: msf-code
        to: msf-app
        label: コードを取得
        evidence:
          - type: doc
            ref: docs/reference-flink.md#§7
      - id: msf-assume
        from: msf-role
        to: msf-app
        label: 実行権限を付与
        evidence:
          - type: doc
            ref: docs/reference-flink.md#§7
      - id: msf-log
        from: msf-app
        to: msf-logs
        label: ログを出力
        evidence:
          - type: doc
            ref: docs/reference-flink.md#§7
    groups:
      - kind: cloud
        label: AWS アカウント
        provider: aws
        tier:
          - managed
          - data
        nodes:
          - msf-app
          - msf-checkpoint
          - msf-code
          - msf-source
          - msf-sink
          - msf-role
          - msf-logs
    layout2d:
      tiers:
        - {id: diagram, label: Managed Service for Apache Flink と MSK, z: 0, size: [22, 12]}
      nodes:
        msf-client: {tier: diagram, x: 1.5, y: 5.5}
        msf-source: {tier: diagram, x: 7, y: 5.5}
        msf-app: {tier: diagram, x: 12, y: 5.5}
        msf-sink: {tier: diagram, x: 17, y: 5.5}
        msf-role: {tier: diagram, x: 12, y: 2}
        msf-code: {tier: diagram, x: 7, y: 9}
        msf-logs: {tier: diagram, x: 12, y: 9}
        msf-checkpoint: {tier: diagram, x: 17, y: 9}
      groups:
        - {kind: cloud, label: AWS アカウント, provider: aws, tier: [diagram], x0: 4.5, y0: 0, x1: 20, y1: 11.5, nodes: [msf-app, msf-checkpoint, msf-code, msf-source, msf-sink, msf-role, msf-logs]}
    layout3d:
      tiers:
        - {id: entry, label: 利用者, kind: origin, z: 0, origin: [-5, 0], size: [3, 8]}
        - {id: managed, label: Managed Service for Apache Flink, z: 0, size: [10, 8]}
        - {id: support, label: 入出力・コード・権限・ログ, z: 0, origin: [12, 0], size: [17, 8]}
      nodes:
        msf-client: {tier: entry, x: 1.5, y: 4}
        msf-app: {tier: managed, x: 3, y: 3}
        msf-checkpoint: {tier: managed, x: 7.5, y: 6}
        msf-source: {tier: support, x: 3, y: 2}
        msf-sink: {tier: support, x: 8.5, y: 2}
        msf-role: {tier: support, x: 14, y: 2}
        msf-code: {tier: support, x: 3, y: 6}
        msf-logs: {tier: support, x: 11.5, y: 6}
      groups:
        - {kind: cloud, label: AWS アカウント, provider: aws, tier: [managed, support], nodes: [msf-app, msf-checkpoint, msf-code, msf-source, msf-sink, msf-role, msf-logs]}
  - id: standalone
    label: 自前ホストの Standalone クラスタと Kafka・HDFS
    description: 自前のサーバー群に Flink の JobManager・TaskManager を起動し、自前の Kafka を読み、HDFS にチェックポイントを置く構成例。
    sources:
      - title: Flink · Standalone deployment
        url: https://nightlies.apache.org/flink/flink-docs-stable/docs/deployment/resource-providers/standalone/overview/
      - title: Flink · Flink Architecture
        url: https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/flink-architecture/
      - title: Flink · State Backends
        url: https://nightlies.apache.org/flink/flink-docs-stable/docs/ops/state/state_backends/
      - title: Flink · Kafka connector
        url: https://nightlies.apache.org/flink/flink-docs-stable/docs/connectors/datastream/kafka/
    tiers:
      - id: entry
        label: 運用者
        kind: origin
        z: 2
        size:
          - 16
          - 3
      - id: flink
        label: Flink クラスタ
        z: 1
        size:
          - 16
          - 4
      - id: data
        label: 入出力・保存
        z: 0
        size:
          - 16
          - 4
    nodes:
      standalone-client:
        label: Flink CLI・Web UI
        kind: client
        tier: entry
        x: 1
        "y": 1.5
        realizes:
          - client
        description: ジョブを JobManager に提出する。
        evidence:
          - type: doc
            ref: docs/reference-flink.md#§8
      standalone-jm:
        label: JobManager プロセス
        kind: service
        tier: flink
        x: 3
        "y": 1.5
        realizes:
          - dispatcher
          - jobmaster
          - resourcemanager
        description: Dispatcher・JobMaster・ResourceManager を持つ。Standalone の ResourceManager は既存の TaskManager のスロットだけを配る。
        evidence:
          - type: doc
            ref: docs/reference-flink.md#§8
        management:
          type: customer
          scope: 利用者が Flink の設定・ジョブ・並列度と更新を管理する。
      standalone-tm:
        label: TaskManager プロセス
        kind: worker
        tier: flink
        x: 9
        "y": 1.5
        parallel: "N"
        slots: 2
        realizes:
          - operator
          - exchange
        description: 複数ホストで Task を並列に実行する。
        evidence:
          - type: doc
            ref: docs/reference-flink.md#§8
        management:
          type: customer
          scope: 利用者が Flink の設定・ジョブ・並列度と更新を管理する。
      standalone-rocks:
        label: RocksDB（TaskManager のローカルディスク）
        kind: db
        tier: flink
        x: 14
        "y": 1.5
        realizes:
          - state
        description: EmbeddedRocksDBStateBackend がキー別状態を TaskManager のローカルディスクに置く。
        evidence:
          - type: doc
            ref: docs/reference-flink.md#§8
        management:
          type: customer
          scope: 利用者が Flink の設定・ジョブ・並列度と更新を管理する。
      standalone-kafka-in:
        label: Kafka 注文トピック
        kind: queue
        tier: data
        x: 1
        "y": 1.5
        realizes:
          - source
        description: 自前の Kafka が入力イベントを保持する。
        evidence:
          - type: doc
            ref: docs/reference-flink.md#§8
        management:
          type: customer
          scope: 利用者が Kafka クラスタを運用する。
      standalone-kafka-out:
        label: Kafka 集計トピック
        kind: queue
        tier: data
        x: 6
        "y": 1.5
        realizes:
          - sink
        description: KafkaSink が結果を書く。
