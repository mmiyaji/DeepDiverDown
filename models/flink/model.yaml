name: Apache Flink の基本アーキテクチャ
description: Kafka のイベントをイベント時刻の窓で集計し、状態とチェックポイントから復旧する流れを追うリファレンスです。
reference:
  objectives:
    - Source、ウォーターマーク、状態付き演算子、Sink の役割を区別する。
    - イベント時刻とウォーターマークで窓を閉じる流れを理解する。
    - チェックポイントから入力位置と演算子状態を復元する。
  sources:
    - {title: Stateful Stream Processing, url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/stateful-stream-processing/"}
    - {title: Timely Stream Processing, url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/time/"}
sources: [docs/reference-flink.md]
evidence: [{type: doc, ref: "docs/reference-flink.md#§1"}]
tiers:
  - {id: flow, label: 入力と並列データフロー, kind: origin, z: 0, size: [12, 3]}
  - {id: fault, label: 障害復旧, z: 1, origin: [0, 0], size: [18, 3]}
nodes:
  source: {label: 再読できるイベント入力, kind: queue, tier: flow, x: 0, y: 1.5, description: 再読可能なイベントログから、イベントと読み取り位置を取得する。, evidence: [{type: doc, ref: docs/reference-flink.md#§2}]}
  watermark: {label: イベント時刻の進捗生成, kind: service, tier: flow, x: 3, 'y': 1.5, description: イベント時刻の進行をウォーターマークで示す。, evidence: [{type: doc, ref: docs/reference-flink.md#§3}]}
  operator: {parallel: 'N', label: 窓集計の実行, kind: worker, tier: flow, x: 7, 'y': 1.5, description: キーごとの窓状態を更新し、窓を閉じて結果を作る。, evidence: [{type: doc, ref: docs/reference-flink.md#§4}]}
  sink: {label: 結果の出力先, kind: db, tier: flow, x: 11, 'y': 1.5, description: 窓集計の結果を下流システムへ書く。, evidence: [{type: doc, ref: docs/reference-flink.md#§6}]}
  state: {partitions: 4, label: キー別の作業状態, kind: db, tier: fault, x: 7, y: 1.5, description: キーごとの状態を保持し、復旧用スナップショットの対象にする。, evidence: [{type: doc, ref: docs/reference-flink.md#§4}, {type: doc, ref: docs/reference-flink.md#§5}]}
  checkpoint: {label: 永続チェックポイント, kind: db, tier: fault, x: 11, 'y': 1.5, description: 入力位置と演算子状態の一貫したスナップショット。, evidence: [{type: doc, ref: docs/reference-flink.md#§5}]}
links:
  - {id: ingest, from: source, to: watermark, label: イベントを取り込む, evidence: [{type: doc, ref: "docs/reference-flink.md#§2"}]}
  - {id: advance, from: watermark, to: operator, label: 時刻を進める, evidence: [{type: doc, ref: "docs/reference-flink.md#§3"}]}
  - {id: aggregate, from: operator, to: state, label: 窓状態を更新, evidence: [{type: doc, ref: "docs/reference-flink.md#§4"}]}
  - {id: emit, from: operator, to: sink, label: 窓結果を出力, evidence: [{type: doc, ref: "docs/reference-flink.md#§6"}]}
  - {id: snapshot, from: operator, to: checkpoint, label: 状態と入力位置をスナップショット, evidence: [{type: doc, ref: "docs/reference-flink.md#§5"}]}
  - {id: restore, from: checkpoint, to: operator, label: 最新成功点から復元, evidence: [{type: doc, ref: "docs/reference-flink.md#§6"}]}
scenarios:
  - id: flink-window-recovery
    label: イベント時刻の窓集計と復旧
    evidence: [{type: doc, ref: "docs/reference-flink.md#§1"}, {type: doc, ref: "docs/reference-flink.md#§7"}]
    steps:
      - {links: [ingest, advance], note: Source がイベントを読み、ウォーターマークでイベント時刻を進める。}
      - {links: [aggregate], note: Window Operator がキー別の状態を更新する。}
      - {links: [emit, snapshot], note: 窓結果を Sink へ送り、状態と入力位置をチェックポイントする。}
      - {links: [restore], note: 障害時は最新成功チェックポイントから演算子を復元する。}

implementations:
  - id: kafka-managed-state
    label: "Flink・Kafka・永続チェックポイント"
    description: "Kafka の時刻付きイベントをキー別の窓で集計する Flink ジョブ。選んだ状態バックエンドとチェックポイントの保存先は独立に指定する。"
    sources:
      - {title: Stateful Stream Processing, url: https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/stateful-stream-processing/}
      - {title: Timely Stream Processing, url: https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/time/}
      - {title: Flink Checkpointing, url: https://nightlies.apache.org/flink/flink-docs-stable/docs/dev/datastream/fault-tolerance/checkpointing/}
      - {title: Flink State Backends, url: https://nightlies.apache.org/flink/flink-docs-stable/docs/ops/state/state_backends/}
    tiers:
      - {id: processing, label: データの処理と保存, z: 0, size: [14, 5]}
      - {id: setup, label: 実行に必要な設定・成果物, z: 1, size: [14, 3]}
    nodes:
      kafka-managed-state-source: {label: Flink KafkaSource と注文トピック, kind: queue, tier: processing, x: 1, y: 1.15, realizes: [source], description: 入力の Kafka パーティションと読み取り位置を管理する。, evidence: [{type: doc, ref: docs/reference-flink.md#§8}]}
      kafka-managed-state-tasks: {label: TaskManager 上の時刻処理と Window Operator, kind: worker, tier: processing, x: 1, y: 3.65, realizes: [watermark, operator], description: WatermarkStrategy と窓処理をフローの実行タスクに組み込む。, evidence: [{type: doc, ref: docs/reference-flink.md#§8}]}
      kafka-managed-state-rocks: {label: EmbeddedRocksDBStateBackend, kind: db, tier: processing, x: 5, y: 1.15, realizes: [state], description: TaskManager のローカルディスクを利用し、キー別状態を持つ。, evidence: [{type: doc, ref: docs/reference-flink.md#§8}]}
      kafka-managed-state-checkpoint: {label: HDFS のチェックポイントディレクトリー, kind: db, tier: processing, x: 5, y: 3.65, realizes: [checkpoint], description: ファイルシステム型のチェックポイント保存先にする。, evidence: [{type: doc, ref: docs/reference-flink.md#§8}]}
      kafka-managed-state-out: {label: Kafka の出力トピック, kind: queue, tier: processing, x: 9, y: 1.15, realizes: [sink], description: KafkaSink で窓集計の結果を書き込む。, evidence: [{type: doc, ref: docs/reference-flink.md#§8}]}
      kafka-managed-state-coordinator: {label: JobManager のチェックポイント調整, kind: service, tier: setup, x: 1, y: 1.5, description: チェックポイントを開始し、各タスクから完了確認を集める。, evidence: [{type: doc, ref: docs/reference-flink.md#§8}]}
    links:
      - {id: kafka-managed-state-coordinator-connection, from: kafka-managed-state-coordinator, to: kafka-managed-state-tasks, label: バリアによるスナップショットを調整}
