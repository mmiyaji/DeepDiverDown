      aws-emr-eks-flink-state: {label: "TaskManager の RocksDB", kind: db, tier: runtime, x: 12, y: 5.2, realizes: [state], description: "組み込みの RocksDB 状態バックエンドで、キー別の作業状態を保持する。", management: {type: customer, scope: "利用者が状態バックエンドを設定する。"}, evidence: [{type: doc, ref: docs/reference-flink.md#§9}]}
      aws-emr-eks-flink-source: {label: "MSK 注文トピック", kind: queue, tier: data, x: 1, y: 1.5, svc: msk, realizes: [source], description: "Flink KafkaSource が読み込むイベントを保持する。", management: {type: shared, scope: "AWS が MSK 基盤を運用し、利用者がトピックと権限を管理する。"}, evidence: [{type: doc, ref: docs/reference-flink.md#§9}]}
      aws-emr-eks-flink-sink: {label: "MSK 集計トピック", kind: queue, tier: data, x: 6, y: 1.5, svc: msk, realizes: [sink], description: "同じ MSK クラスターの別トピックに集計結果を保持する。", management: {type: shared, scope: "AWS が MSK 基盤を運用し、利用者がトピックと権限を管理する。"}, evidence: [{type: doc, ref: docs/reference-flink.md#§9}]}
      aws-emr-eks-flink-checkpoint: {label: "S3 チェックポイント", kind: db, tier: data, x: 11, y: 1.5, svc: s3, realizes: [checkpoint], description: "完了したチェックポイントの状態と入力位置を保持する。", management: {type: shared, scope: "AWS が S3 基盤を運用し、利用者が復旧データと権限を管理する。"}, evidence: [{type: doc, ref: docs/reference-flink.md#§9}]}
      aws-emr-eks-flink-ha: {label: "S3 の HA メタデータ", kind: db, tier: data, x: 15, y: 1.5, svc: s3, description: "JobManager の切り替えに必要な Kubernetes HA のメタデータを保持する。", management: {type: shared, scope: "AWS が S3 基盤を運用し、利用者が HA 設定と権限を管理する。"}, evidence: [{type: doc, ref: docs/reference-flink.md#§9}]}
