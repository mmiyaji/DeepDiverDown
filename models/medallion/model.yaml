blocks:
  - id: layers
    title: 層ごとのデータの形
    legend:
      '0': Bronze の原本
      '2': Silver の明細
      '4': 検証に失敗
      '5': Gold の集計
    note: 数値は説明用。Bronze の原本は消さずに残る。
    lanes:
      - id: bronze
        label: Bronze
        sub: 原本
        node: bronze
      - id: quar
        label: 隔離
        node: quarantine
      - id: silver
        label: Silver
        sub: 明細
        node: silver
      - id: gold
        label: Gold
        sub: 集計
        node: gold
    items:
      bronze: []
      quar: []
      silver: []
      gold: []
implementations:
  - id: databricks-ldp
    label: Lakeflow・Delta Lake・Databricks SQL
    description: S3 の受注変更ファイルを Auto Loader で取り込み、Databricks のサーバーレス Lakeflow パイプラインで整形して SQL Warehouse から提供する例。
    sources:
      - title: Databricks · Medallion lakehouse architecture
        url: https://docs.databricks.com/aws/en/lakehouse/medallion
      - title: How to use Spark Declarative Pipelines on Lakeflow
        url: https://docs.databricks.com/aws/en/ldp/concepts/how-to-use-pipelines
      - title: 'Lakeflow best practices: Quarantine'
        url: https://docs.databricks.com/aws/en/ldp/best-practices
      - title: Expectations and event log
        url: https://docs.databricks.com/aws/en/ldp/expectations
      - title: Auto Loader による Amazon S3 の増分取り込み
        url: https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/onboard-data
      - title: Unity Catalog 管理ストレージ
        url: https://docs.databricks.com/aws/en/connect/unity-catalog/cloud-storage/managed-storage
      - title: AUTO CDC による変更適用
        url: https://docs.databricks.com/aws/en/ldp/cdc
      - {title: Databricks deployment architecture, url: https://docs.databricks.com/aws/en/security/network/deployment-architecture/}
      - {title: AWS shared responsibility, url: https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/shared-responsibility.html}
    tiers:
      - id: flow
        label: Databricks の取り込み・変換・提供
        z: 1
        size:
          - 18
          - 7
      - id: storage
        label: AWS の入力と保存
        z: 0
        size:
          - 18
          - 4
    nodes:
      databricks-ldp-serverless: {label: Databricks serverless compute plane, kind: host, tier: flow, x: 8, y: 6, description: "Databricks-managed execution environment for the pipeline and serverless SQL warehouse.", evidence: [{type: doc, ref: "docs/reference-medallion.md#§5"}]}
      databricks-ldp-role: {label: AWS IAM storage role, svc: iam, kind: policy, tier: storage, x: 16, y: 2, management: {type: customer, scope: "Customer manages trust policy and S3 permissions."}, evidence: [{type: doc, ref: "docs/reference-medallion.md#§5"}]}
      databricks-ldp-events:
        label: S3 の注文 CDC ファイル
        kind: db
        svc: s3
        tier: storage
        x: 4
        'y': 2
        description: 業務側で書き出した主キー、変更種別、変更順序を含む JSON ファイルを保持する。
        realizes:
          - events
        management: {type: shared, scope: "AWS operates S3; customer manages data and access."}
        evidence:
          - type: doc
            ref: docs/reference-medallion.md#§5
      databricks-ldp-bronze:
        label: Bronze の Delta ストリーミングテーブル
        kind: table
        tier: flow
        x: 4
        'y': 2
        description: 元の受注イベントを追記する。
        realizes:
          - bronze
        evidence:
          - type: doc
            ref: docs/reference-medallion.md#§5
        svc: databricks:delta
      databricks-ldp-pipeline:
        label: Lakeflow Spark Declarative Pipelines
        kind: worker
        tier: flow
        x: 8
        'y': 2
        description: 検証条件で有効行と隔離行を分け、必要に応じて変更を適用する。
        realizes:
          - prepare
        evidence:
          - type: doc
            ref: docs/reference-medallion.md#§5
        svc: databricks:lakeflow
      databricks-ldp-quarantine:
        label: 無効行を保持するストリーミングテーブル
        kind: table
        tier: flow
        x: 8
        'y': 0
        description: 調査と再処理に必要な行を残す。
        realizes:
          - quarantine
        evidence:
          - type: doc
            ref: docs/reference-medallion.md#§5
        svc: databricks:delta
      databricks-ldp-silver:
        label: Silver の整形済み Delta テーブル
        kind: table
        tier: flow
        x: 12
        'y': 2
        description: 検証後の正規化した注文の状態を保持する。
        realizes:
          - silver
        evidence:
          - type: doc
            ref: docs/reference-medallion.md#§5
        svc: databricks:delta
      databricks-ldp-gold:
        label: Gold の日次売上マテリアライズドビュー
        kind: table
        tier: flow
        x: 16
        'y': 2
        description: 日付・通貨別の集計を提供する。
        realizes:
          - gold
        evidence:
          - type: doc
            ref: docs/reference-medallion.md#§5
        svc: databricks:delta
      databricks-ldp-dashboard:
        label: Databricks AI/BI ダッシュボード
        kind: service
        tier: flow
        x: 16
        'y': 6
        description: 日次売上を表示する。
        realizes:
          - bi
        evidence:
          - type: doc
            ref: docs/reference-medallion.md#§5
        svc: databricks:platform
      databricks-ldp-log:
        label: Lakeflow パイプラインイベントログ
        kind: monitor
        tier: flow
        x: 11
        'y': 4
        description: 検証結果や更新状態を記録する。
        evidence:
          - type: doc
            ref: docs/reference-medallion.md#§5
        svc: databricks:lakeflow
      databricks-ldp-autoloader:
        label: Lakeflow の Auto Loader
        svc: databricks:lakeflow
        kind: worker
        tier: flow
        x: 0
        'y': 2
        description: Unity Catalog 外部ロケーション上の JSON を増分取り込みする。
        evidence:
          - type: doc
            ref: docs/reference-medallion.md#§5
      databricks-ldp-unity:
        label: Unity Catalog
        svc: databricks:unity
        kind: catalog
        tier: flow
        x: 4
        'y': 5
        description: 外部ロケーションと管理テーブルのアクセス許可を管理する。
        evidence:
          - type: doc
            ref: docs/reference-medallion.md#§5
      databricks-ldp-managed:
        label: Unity Catalog 管理用の Amazon S3
        svc: s3
        kind: db
        tier: storage
        x: 12
        'y': 2
        description: 入力用とは別のストレージ領域に管理テーブルの実体を保持する。
        management: {type: shared, scope: "AWS operates S3; customer manages data and access."}
        evidence:
          - type: doc
            ref: docs/reference-medallion.md#§5
      databricks-ldp-warehouse:
        label: Databricks SQL Warehouse
        svc: databricks:sql
        kind: worker
        tier: flow
        x: 11
        'y': 6
        description: Gold を読み取るダッシュボードの SQL を実行する。
        evidence:
          - type: doc
            ref: docs/reference-medallion.md#§5
    links:
      - {id: databricks-ldp-compute-pipeline, from: databricks-ldp-serverless, to: databricks-ldp-pipeline, label: "Run pipeline", evidence: [{type: doc, ref: "docs/reference-medallion.md#§5"}]}
      - {id: databricks-ldp-compute-sql, from: databricks-ldp-serverless, to: databricks-ldp-warehouse, label: "Run SQL warehouse", evidence: [{type: doc, ref: "docs/reference-medallion.md#§5"}]}
      - {id: databricks-ldp-storage-role, from: databricks-ldp-unity, to: databricks-ldp-role, label: "Use storage credential", evidence: [{type: doc, ref: "docs/reference-medallion.md#§5"}]}
      - {id: databricks-ldp-role-access, from: databricks-ldp-role, to: databricks-ldp-events, label: "Authorize input access", evidence: [{type: doc, ref: "docs/reference-medallion.md#§5"}]}
      - id: databricks-ldp-load
