name: RisingWave：バリアとチェックポイント・復旧
description: Meta が注入する Barrier で全 Actor の状態を揃えて checkpoint を作り、障害時にそこから Actor を作り直す流れと、Sink への配信のタイミング。
reference:
  objectives:
    - Barrier と checkpoint の関係と、既定の間隔（barrier_interval_ms と checkpoint_frequency）を説明する。
    - メモリ上の未保存の状態が、checkpoint で Hummock に永続化されることを追う。
    - 障害後の再開（checkpoint から Actor を作り直す）と、Sink の commit 間隔、Meta のバックアップを区別する。
  sources:
    - title: RisingWave · Data persistence
      url: https://docs.risingwave.com/reference/data-persistence
    - title: RisingWave · Architecture
      url: https://docs.risingwave.com/get-started/architecture
    - title: RisingWave · Key concepts
      url: https://docs.risingwave.com/reference/key-concepts
    - title: RisingWave · FAQ (using RisingWave)
      url: https://docs.risingwave.com/faq/faq-using-risingwave
    - title: RisingWave · Sink data from RisingWave
      url: https://docs.risingwave.com/delivery/overview
    - title: RisingWave · Meta backup
      url: https://docs.risingwave.com/operate/meta-backup
sources:
  - docs/reference-risingwave-barrier-recovery.md
evidence:
  - type: doc
    ref: docs/reference-risingwave-barrier-recovery.md#§1
tiers:
  - id: flow
    label: Barrier・checkpoint・復旧
    z: 0
    size:
      - 26
      - 10
nodes:
  meta:
    label: Meta（Barrier の注入）
    kind: scheduler
    tier: flow
    x: 0
    'y': 1.5
    replicas: 2
    description: 既定で 1 秒ごと（barrier_interval_ms = 1000）に Barrier を注入し、全 Actor からの収集で checkpoint を確定する。
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§2
  head:
    label: 最上流の Actor
    kind: worker
    tier: flow
    x: 6
    'y': 1.5
    parallel: 'N'
    description: Source の読み取りなど、Barrier を最初に受ける Actor。
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§2
  actors:
    label: Actor（演算子）
    kind: worker
    tier: flow
    x: 12
    'y': 1.5
    parallel: 'N'
    description: 変更とともに Barrier を下流へ渡す。Barrier を受けると状態をバッファから書き出す。
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§2
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§3
  dirty:
    label: 未保存の状態（メモリ）
    kind: cache
    tier: flow
    x: 12
    'y': 5
    description: 直近の checkpoint 以降の変更。バッファがしきい値を超えるか、checkpoint で書き出す。
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§3
  hummock:
    label: Hummock（checkpoint の永続化）
    kind: db
    tier: flow
    x: 18
    'y': 5
    description: checkpoint 時に、差分の状態と結果を耐久性のあるリモートストレージへ書く。
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§3
  recover:
    label: 復旧（Actor の再作成）
    kind: workflow
    tier: flow
    x: 6
    'y': 5
    description: 障害後、Meta が最後の checkpoint から Actor を作り直す。RECOVER で手動実行もでき、処理が一時止まる。
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§4
  sink:
    label: Sink（デカップル）
    kind: queue
    tier: flow
    x: 18
    'y': 1.5
    description: Sink 専用のバッファを挟み、遅い出力先が処理に影響しにくくする。デカップル時は 10 checkpoint ごとに出力先へ commit する。
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§5
  downstream:
    label: 出力先
    kind: external
    tier: flow
    x: 24
    'y': 1.5
    description: Kafka・Iceberg・PostgreSQL など。配信は多くが at-least-once、Iceberg は exactly-once（既定）。
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§5
  operator:
    label: 運用者
    kind: actor
    tier: flow
    x: 0
    'y': 5
    description: RECOVER の実行や、risectl による meta snapshot の作成を行う。
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§4
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§6
  snapshot:
    label: meta snapshot
    kind: file
    tier: flow
    x: 0
    'y': 8.5
    description: Meta のデータのバックアップ。オブジェクトストレージに置き、SST は複製しない。
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§6
links:
  - id: inject
    from: meta
    to: head
    label: Barrier を注入
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§2
  - id: pass
    from: head
    to: actors
    label: Barrier を下流へ流す
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§2
  - id: collect
    from: actors
    to: meta
    label: Barrier の完了を報告
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§2
  - id: buffer
    from: actors
    to: dirty
    label: 状態の変更を溜める
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§3
  - id: flush
    from: dirty
    to: hummock
    label: checkpoint で永続化
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§3
  - id: restore
    from: hummock
    to: recover
    label: 最後の checkpoint の状態
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§4
  - id: recreate
    from: recover
    to: actors
    label: Actor を作り直す
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§4
  - id: detect
    from: meta
    to: recover
    label: 障害後に復旧を開始
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§4
  - id: manual
    from: operator
    to: recover
    label: RECOVER を実行
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§4
  - id: to-sink
    from: actors
    to: sink
    label: checkpoint ごとに変更を渡す
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§5
  - id: commit
    from: sink
    to: downstream
    label: 10 checkpoint ごとに commit
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§5
  - id: backup
    from: operator
    to: snapshot
    label: risectl で meta snapshot を作成
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§6
scenarios:
  - id: checkpoint
    label: checkpoint の作成と障害からの再開
    evidence:
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§2
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§3
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§4
      - type: doc
        ref: docs/reference-risingwave-barrier-recovery.md#§5
    steps:
      - links:
          - inject
          - pass
        note: Meta が Barrier を注入し、変更と一緒に下流へ流れる。
      - links:
          - buffer
          - flush
          - collect
        note: 各 Actor は状態を書き出し、全員の完了を Meta が集めて checkpoint が確定する。
      - links:
          - to-sink
          - commit
        note: Sink は checkpoint を単位に変更を受け、デカップル時は 10 checkpoint ごとに出力先へ commit する。
      - links:
          - detect
          - restore
          - recreate
        note: 障害後は最後の checkpoint から Actor を作り直し、処理を再開する。
      - links:
          - manual
          - backup
        note: 運用者は RECOVER を実行でき、別に meta snapshot でメタデータを守る。
unknowns:
  - id: UNK-01
    text: 障害後にどの checkpoint から再開するかの選択、復旧にかかる時間、Source の位置の巻き戻しの細部は、確認した資料に記載がない。
    refs:
      - recover
  - id: UNK-02
    text: Epoch の定義は確認した資料（Data persistence・Key concepts）に記載がない。Barrier と checkpoint の説明に留める。
    refs:
      - meta
  - id: UNK-03
    text: Meta ノードが落ちたときの切り替え手順と、その間の Barrier の扱いは資料に記載がない。
    refs:
      - meta
  - id: UNK-04
    text: 実装例の台数・ノードサイズ・バージョン互換性は資料で指定されていない。
    refs:
      - actors
gates:
  maxDrift: 0
  maxHigh: 6
implementations:
  - id: aws-eks
    label: EKS 上の RisingWave・S3・RDS for PostgreSQL
    description: EKS の EC2 ノード上に RisingWave の Frontend・Meta・Compute・Compactor の Pod を置き、S3 を state store、RDS for PostgreSQL を meta store にする構成例。
    sources:
      - title: RisingWave · Data persistence
        url: https://docs.risingwave.com/reference/data-persistence
      - title: RisingWave · Sink data from RisingWave
        url: https://docs.risingwave.com/delivery/overview
      - title: RisingWave · Meta backup
        url: https://docs.risingwave.com/operate/meta-backup
      - title: RisingWave · Deploy on Kubernetes
        url: https://docs.risingwave.com/deploy/risingwave-kubernetes
      - title: RisingWave · Hardware requirements
        url: https://docs.risingwave.com/deploy/hardware-requirements
      - title: Amazon EKS managed node groups
        url: https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html
      - title: IAM roles for service accounts
        url: https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html
      - title: Amazon RDS for PostgreSQL
        url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_PostgreSQL.html
    tiers:
      - id: entry
        label: 利用者・外部システム
        kind: origin
        z: 2
        size:
          - 18
          - 3
      - id: control-plane
        label: AWS の管理・認証
        z: 1
        size:
          - 18
          - 3
      - id: processing
        label: EKS の RisingWave 実行
        z: 0
        size:
          - 18
          - 3
      - id: storage
        label: 状態とメタデータの保存
        z: -1
        size:
          - 18
          - 3
    nodes:
      rw-aws-client:
        label: psql などの SQL クライアント
        kind: client
        tier: entry
        x: 1
        'y': 1.5
        realizes:
          - operator
        description: PostgreSQL プロトコルで Frontend に接続する。
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
      rw-aws-downstream:
        label: 出力先（Kafka・Iceberg・PostgreSQL など）
        kind: external
        tier: entry
        x: 9
        'y': 1.5
        realizes:
          - downstream
        description: Sink の配信先。実行場所は選んだ出力先による。
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
      rw-aws-eks:
        label: Amazon EKS / Kubernetes API
        svc: eks
        kind: service
        tier: control-plane
        x: 3
        'y': 1.5
        description: Kubernetes の制御プレーン。RisingWave Operator のカスタムリソースと Pod の配置を管理する。
        management:
          type: shared
          scope: AWS が制御プレーンを運用し、利用者が Kubernetes API、Operator、クラスタ設定を操作する。
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
      rw-aws-iam:
        label: IAM / サービスアカウント用ロール
        svc: iam
        kind: policy
        tier: control-plane
        x: 9
        'y': 1.5
        description: state store の useServiceAccount を使い S3 へ届くための権限。必要な権限の一覧は資料で確認していない。
        management:
          type: customer
          scope: 利用者がサービスアカウントと IAM ロール・ポリシーを設定する。
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
      rw-aws-ec2:
        label: EC2 / EKS ノードグループ
        svc: ec2
        kind: host
        tier: processing
        x: 15
        'y': 1.5
        description: マネージドノードグループの EC2 が RisingWave の Pod を実行する。
        management:
          type: shared
          scope: AWS が EC2 基盤を運用し、利用者がノードグループ、台数、更新を管理する。
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
      rw-aws-frontend:
        label: Frontend Pod
        kind: service
        tier: processing
        x: 1
        'y': 1.5
        parallel: 'N'
        description: SQL を受けて計画し、バッチクエリを実行する。
        management:
          type: customer
          scope: 利用者が RisingWave の配置・設定・容量・更新を管理する。
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
      rw-aws-meta:
        label: Meta Pod
        kind: service
        tier: processing
        x: 5
        'y': 1.5
        realizes:
          - meta
          - recover
        description: Barrier の注入、checkpoint の確定、復旧の開始を担う。
        management:
          type: customer
          scope: 利用者が RisingWave の配置・設定・容量・更新を管理する。
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
      rw-aws-compute:
        label: Compute Pod
        kind: worker
        tier: processing
        x: 9
        'y': 1.5
        parallel: 'N'
        realizes:
          - head
          - actors
          - dirty
          - sink
        description: Actor を実行し、Sink のバッファも持つ。
        management:
          type: customer
          scope: 利用者が RisingWave の配置・設定・容量・更新を管理する。
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
      rw-aws-compactor:
        label: Compactor Pod
        kind: worker
        tier: processing
        x: 13
        'y': 1.5
        parallel: 'N'
        description: checkpoint で書かれた SST を整理する。
        management:
          type: customer
          scope: 利用者が RisingWave の配置・設定・容量・更新を管理する。
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
      rw-aws-s3:
        label: Amazon S3（Hummock の state store）
        svc: s3
        kind: db
        tier: storage
        x: 9
        'y': 1.5
        realizes:
          - hummock
          - snapshot
        description: checkpoint の状態と meta snapshot を保存する。snapshot の既定の保存先は state store の URL 配下。
        management:
          type: shared
          scope: AWS が S3 基盤を運用し、利用者がバケット、権限、データを管理する。
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
      rw-aws-rds:
        label: RDS for PostgreSQL（meta store）
        svc: rds
        kind: db
        tier: storage
        x: 3
        'y': 1.5
        description: メタデータの保存先。
        management:
          type: shared
          scope: AWS がデータベース基盤を運用し、利用者がスキーマ、接続、バックアップ設定を管理する。
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
    links:
      - id: rw-aws-eks-ec2
        from: rw-aws-eks
        to: rw-aws-ec2
        label: ノードグループに Pod を配置
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
      - id: rw-aws-ec2-fe
        from: rw-aws-ec2
        to: rw-aws-frontend
        label: Pod を実行
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
      - id: rw-aws-ec2-meta
        from: rw-aws-ec2
        to: rw-aws-meta
        label: Pod を実行
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
      - id: rw-aws-ec2-cn
        from: rw-aws-ec2
        to: rw-aws-compute
        label: Pod を実行
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
      - id: rw-aws-ec2-cp
        from: rw-aws-ec2
        to: rw-aws-compactor
        label: Pod を実行
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
      - id: rw-aws-iam-cn
        from: rw-aws-iam
        to: rw-aws-compute
        label: S3 アクセス権を付与
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
      - id: rw-aws-iam-cp
        from: rw-aws-iam
        to: rw-aws-compactor
        label: S3 アクセス権を付与
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
      - id: rw-aws-fe-cn
        from: rw-aws-frontend
        to: rw-aws-compute
        label: バッチクエリを実行
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
      - id: rw-aws-meta-rds
        from: rw-aws-meta
        to: rw-aws-rds
        label: メタデータを保存
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
      - id: rw-aws-backup-s3
        from: rw-aws-meta
        to: rw-aws-s3
        label: meta snapshot を保存
        evidence:
          - type: doc
            ref: docs/reference-risingwave-barrier-recovery.md#§7
    groups:
      - kind: cloud
        label: AWS アカウント
        provider: aws
        tier:
          - control-plane
          - processing
          - storage
        nodes:
          - rw-aws-eks
