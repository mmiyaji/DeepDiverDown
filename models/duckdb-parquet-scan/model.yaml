        python-parquet-parquet: {tier: diagram, x: 2, y: 11}
        python-parquet-metadata: {tier: diagram, x: 2, y: 14}
      groups:
        - {kind: nodegroup, label: "自前ホスト", tier: [diagram], x0: 0, y0: 0, x1: 4, y1: 18, nodes: [python-parquet-host, python-parquet-client, python-parquet-engine, python-parquet-parquet, python-parquet-metadata]}
    layout3d:
      tiers:
        - {id: zone0, label: "自前ホスト", z: 0, origin: [0, 0], size: [5, 15]}
      nodes:
        python-parquet-host: {tier: zone0, x: 2, y: 1}
        python-parquet-client: {tier: zone0, x: 2, y: 4}
        python-parquet-engine: {tier: zone0, x: 2, y: 7}
        python-parquet-parquet: {tier: zone0, x: 2, y: 10}
        python-parquet-metadata: {tier: zone0, x: 2, y: 13}
