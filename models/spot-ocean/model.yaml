name: Spot Ocean による Kubernetes 容量管理
description: Pod の要求と VNG の設定を基にノード容量を確保し、中断時は drain と再配置を試みる。
reference:
  objectives:
    - Ocean の外部サービスとクラスタ内 Controller を分ける。
    - VNG の設定と実際のノードの違いを理解する。
    - 中断時の drain と Pod の再配置を追う。
  sources:
    - title: Spot Ocean Kubernetes guide
      url: https://spot.io/wp-content/uploads/2024/09/Guide_Automating_Kubernetes_infrastructure.pdf
    - title: Ocean AWS VNG workshop
      url: https://labs.spot.io/ocean/ocean_workshop/vng_workshop/vng_workshop_instructions.html
    - title: Ocean headroom
      url: https://labs.spot.io/ocean/ocean_workshop/headroom/headroom_overview.html
    - title: Amazon EKS managed nodes
      url: https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html
sources:
  - docs/reference-spot-ocean.md
evidence:
  - type: doc
    ref: docs/reference-spot-ocean.md#§1
  - type: doc
    ref: docs/reference-spot-ocean.md#§3
tiers:
  - id: compute
    label: ワークロードと容量
    z: 1
    size:
      - 20
      - 3
  - id: control
    label: 容量管理と復旧
    z: 0
    size:
      - 20
      - 3
nodes:
  pods:
    label: Pod ワークロード
    kind: service
    tier: compute
    x: 0
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-spot-ocean.md#§2
  cluster:
    label: クラスタの制御
    kind: service
    tier: compute
    x: 4
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-spot-ocean.md#§2
  nodes:
    label: ワーカーノード容量
    kind: service
    tier: compute
    x: 8
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-spot-ocean.md#§2
  controller:
    label: クラスタ内の状態収集と drain
    kind: service
    tier: control
    x: 0
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-spot-ocean.md#§2
  autoscaler:
    label: 外部の容量管理
    kind: service
    tier: control
    x: 4
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-spot-ocean.md#§2
  vng:
    label: ノード選択の設定
    kind: file
    tier: control
    x: 8
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-spot-ocean.md#§2
  cloud:
    label: クラウド容量の起動
    kind: service
    tier: control
    x: 12
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-spot-ocean.md#§2
links:
  - id: observe
    from: cluster
    to: controller
    label: Pod とノードを観測
    evidence:
      - type: doc
        ref: docs/reference-spot-ocean.md#§2
  - id: report
    from: controller
    to: autoscaler
    label: クラスタ状態を報告
    evidence:
      - type: doc
        ref: docs/reference-spot-ocean.md#§2
  - id: configure
    from: vng
    to: autoscaler
    label: 種類と配置の条件を指定
    evidence:
      - type: doc
        ref: docs/reference-spot-ocean.md#§2
  - id: request
    from: autoscaler
    to: cloud
    label: 容量の起動を要求
    evidence:
      - type: doc
        ref: docs/reference-spot-ocean.md#§2
  - id: launch
    from: cloud
    to: nodes
    label: ノードを起動
    evidence:
      - type: doc
        ref: docs/reference-spot-ocean.md#§2
  - id: schedule
    from: cluster
    to: pods
    label: Pod を配置・再配置
    evidence:
      - type: doc
        ref: docs/reference-spot-ocean.md#§2
  - id: host
    from: nodes
    to: pods
    label: Pod を実行
    evidence:
      - type: doc
        ref: docs/reference-spot-ocean.md#§2
  - id: drain
    from: controller
    to: cluster
    label: ノードを drain
    evidence:
      - type: doc
        ref: docs/reference-spot-ocean.md#§2
scenarios:
  - id: main
    label: 容量管理と復旧
    evidence:
      - type: doc
        ref: docs/reference-spot-ocean.md#§2
    steps:
      - links:
          - observe
          - report
          - configure
        note: 状態と VNG 条件に基づき必要な容量を判断する。
      - links:
          - request
          - launch
          - schedule
          - host
        note: クラウドに容量を要求し利用可能なノードに配置する。
      - links:
          - drain
          - schedule
        note: 中断や交換時に drain と再配置を試みる。
implementations:
  - id: example
    label: Spot Ocean と Amazon EKS
    description: 外部の Ocean 容量管理と、EKS 内の Controller および EC2 ノードを分けた例。
    sources:
      - title: Spot Ocean Kubernetes guide
        url: https://spot.io/wp-content/uploads/2024/09/Guide_Automating_Kubernetes_infrastructure.pdf
      - title: Ocean AWS VNG workshop
        url: https://labs.spot.io/ocean/ocean_workshop/vng_workshop/vng_workshop_instructions.html
      - title: Ocean headroom
        url: https://labs.spot.io/ocean/ocean_workshop/headroom/headroom_overview.html
      - {title: Amazon EKS の管理 VPC と顧客 VPC, url: https://docs.aws.amazon.com/eks/latest/best-practices/subnets.html}
      - {title: Spot Ocean Controller v2, url: https://docs.flexera.com/spot/ocean/tutorials/spot-kubernetes-controller/ocean-controller-two-intro}
      - {title: Spot と AWS アカウントの IAM 接続, url: https://docs.flexera.com/spot/connect-your-cloud-provider/first-account/aws-manually}
      - {title: VNG とルートボリューム設定, url: https://docs.flexera.com/spot/ocean/features/vngs/attributes-and-actions-per-vng}
    tiers:
      - id: compute
        label: ワークロードと容量
        z: 1
        size:
          - 20
          - 3
      - id: control
        label: 容量管理と復旧
        z: 0
        size:
          - 20
          - 3
    nodes:
      ex-pods:
        label: アプリ Pod
        kind: service
        tier: compute
        x: 0
        'y': 1.5
        management: {type: customer, scope: "利用者がアプリのコンテナ、要求リソースと Pod の設定を管理する。"}
        evidence:
          - type: doc
            ref: docs/reference-spot-ocean.md#§4
        realizes:
          - pods
      ex-cluster:
        label: Amazon EKS（管理コントロールプレーン）
        kind: service
        tier: compute
        x: 4
        'y': 1.5
        svc: eks
        description: AWS 管理 VPC のコントロールプレーンが Pod を割り当てる。利用者は Kubernetes API とクラスタ設定を操作できるが、制御プレーンサーバーに直接アクセスしない。
        management: {type: aws, scope: "AWS が制御プレーンのサーバーを運用する。利用者は公開された Kubernetes API と EKS の設定・権限を管理する。"}
        evidence:
          - type: doc
            ref: docs/reference-spot-ocean.md#§4
        realizes:
          - cluster
      ex-nodes:
        label: EC2（Ocean が起動するノード）
        kind: service
        tier: compute
        x: 8
        'y': 1.5
        svc: ec2
        description: EC2 インスタンスで kubelet が動き、EKS に参加してアプリの Pod を実行する。
        management: {type: shared, scope: "AWS が EC2 の物理基盤を運用し、Ocean が設定に従い容量の起動を行う。利用者はノード設定とワークロードを管理する。"}
        evidence:
          - type: doc
            ref: docs/reference-spot-ocean.md#§4
        realizes:
          - nodes
      ex-controller:
        label: Ocean Controller v2（EKS 内の Pod）
        kind: service
        tier: control
        x: 0
        'y': 1.5
        description: 顧客 VPC の EKS ワーカー上で動き、メトリクスとイベントを外部 SaaS に報告する。
        management: {type: customer, scope: "利用者がクラスタへの Controller の配備、設定と権限を管理する。"}
        evidence:
          - type: doc
            ref: docs/reference-spot-ocean.md#§4
        realizes:
          - controller
      ex-autoscaler:
        label: Ocean オートスケーラー
        kind: service
        tier: control
        x: 4
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-spot-ocean.md#§4
        realizes:
          - autoscaler
      ex-vng:
        label: Ocean VNG 設定
        kind: file
        tier: control
        x: 8
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-spot-ocean.md#§4
        realizes:
          - vng
      ex-cloud:
        label: Amazon EC2 API
        kind: service
        tier: control
        x: 12
        'y': 1.5
        svc: ec2
        management: {type: shared, scope: "AWS が EC2 API を提供し、利用者は IAM とクラウドリソースの設定を管理する。"}
        evidence:
          - type: doc
            ref: docs/reference-spot-ocean.md#§4
        realizes:
          - cloud
      ex-root: {label: "Amazon EBS（ノードのルートボリューム）", svc: ebs, kind: db, tier: compute, x: 15, y: 1.5, description: "EC2 起動時のブロックデバイス設定により OS とノードの作業領域を保持する。", management: {type: shared, scope: "AWS が EBS を提供し、利用者がボリューム設定とデータを管理する。"}, evidence: [{type: doc, ref: docs/reference-spot-ocean.md#§4}]}
      ex-role: {label: "IAM（Spot SaaS と連携するロール）", svc: iam, kind: policy, tier: control, x: 17, y: 1.5, description: "顧客アカウントが Ocean の利用に必要な権限を持つロールを用意する。", management: {type: shared, scope: "AWS が IAM を提供し、利用者がロールの信頼関係と権限を設定する。"}, evidence: [{type: doc, ref: docs/reference-spot-ocean.md#§4}]}
    links:
      - {id: ex-assume, from: ex-autoscaler, to: ex-role, label: AWS アカウントの連携ロールを使う}
      - {id: ex-root-storage, from: ex-nodes, to: ex-root, label: ノードごとにルートディスクを使用}
    groups:
      - kind: cloud
        provider: aws
        label: AWS アカウント / EKS
        tier:
          - compute
        nodes:
          - ex-pods
          - ex-cluster
          - ex-nodes
          - ex-root
      - kind: cloud
        provider: aws
        label: AWS アカウント / EKS
        tier:
          - control
        nodes:
          - ex-controller
      - kind: cloud
        provider: spotnetapp
        label: Spot Ocean サービス
        tier:
          - control
        nodes:
          - ex-autoscaler
          - ex-vng
      - kind: cloud
        provider: aws
        label: AWS アカウント
        tier:
          - control
        nodes:
          - ex-cloud
          - ex-role
      - {kind: vpc, label: 顧客 VPC の EKS データプレーン, tier: [compute, control], nodes: [ex-pods, ex-nodes, ex-controller]}
    layout2d:
      tiers:
        - {id: diagram, label: Ocean と EKS の実装構成, z: 0, size: [23, 11]}
      nodes:
        ex-autoscaler: {tier: diagram, x: 2, y: 2}
        ex-vng: {tier: diagram, x: 2, y: 6}
        ex-cluster: {tier: diagram, x: 9, y: 1}
        ex-role: {tier: diagram, x: 17, y: 1}
        ex-cloud: {tier: diagram, x: 21, y: 1}
        ex-controller: {tier: diagram, x: 10, y: 5}
        ex-pods: {tier: diagram, x: 15, y: 5}
        ex-nodes: {tier: diagram, x: 10, y: 9}
        ex-root: {tier: diagram, x: 20, y: 9}
      groups:
        - {kind: cloud, provider: spotnetapp, label: Spot Ocean サービス, tier: [diagram], nodes: [ex-autoscaler, ex-vng]}
        - {kind: cloud, provider: aws, label: AWS サービス領域, tier: [diagram], nodes: [ex-cluster, ex-role, ex-cloud, ex-controller, ex-pods, ex-nodes, ex-root]}
        - {kind: vpc, label: 顧客 VPC の EKS ワーカー, tier: [diagram], nodes: [ex-controller, ex-pods, ex-nodes]}
    layout3d:
      tiers:
        - {id: infrastructure, label: AWS と Ocean のサービス・実行基盤, z: 0, size: [23, 10]}
        - {id: workloads, label: EC2 ワーカー上の Pod, z: 1, size: [23, 10]}
      nodes:
        ex-autoscaler: {tier: infrastructure, x: 2, y: 2}
        ex-vng: {tier: infrastructure, x: 2, y: 6}
        ex-cluster: {tier: infrastructure, x: 9, y: 1}
        ex-role: {tier: infrastructure, x: 17, y: 1}
        ex-cloud: {tier: infrastructure, x: 21, y: 1}
        ex-nodes: {tier: infrastructure, x: 12, y: 6}
        ex-root: {tier: infrastructure, x: 17, y: 8}
        ex-controller: {tier: workloads, x: 10, y: 6}
        ex-pods: {tier: workloads, x: 14, y: 6}
      groups:
        - {kind: cloud, provider: spotnetapp, label: Spot Ocean サービス, tier: [infrastructure], nodes: [ex-autoscaler, ex-vng]}
        - {kind: cloud, provider: aws, label: AWS サービス領域, tier: [infrastructure, workloads], nodes: [ex-cluster, ex-role, ex-cloud, ex-controller, ex-pods, ex-nodes, ex-root]}
        - {kind: vpc, label: 顧客 VPC の EKS ワーカー, tier: [infrastructure, workloads], nodes: [ex-controller, ex-pods, ex-nodes]}
