name: "DWH 設計パターンの選び方"
description: "データをどの層で整えるか、DWH でどう統合するか、BI にどんな粒度で出すかを同じ注文データで比較する。"
reference:
  objectives:
    - "データ層、統合方法、分析用モデル、配信時の集約を別の判断として扱う。"
    - "現在と当時の値、複数業務の集計をどのモデルで再現できるか確認する。"
  sources:
    - {"title":"Kimball Group の次元モデリング技法","url":"https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/"}
    - {"title":"Databricks のメダリオン","url":"https://docs.databricks.com/aws/en/lakehouse/medallion"}
    - {"title":"Bill Inmon の CIF と Data Warehousing 2.0","url":"https://www.embarcadero.com/images/dm/technical-papers/bill-inmon-data-warehousing-2-0-whitepaper.pdf"}
    - {"title":"Data Vault Alliance","url":"https://datavaultalliance.com/engineering/data-vault-2-0-an-introduction/"}
    - {"title":"BigQuery のネストと繰り返し列","url":"https://docs.cloud.google.com/bigquery/docs/best-practices-performance-nested"}
    - {"title":"dbt Semantic Layer","url":"https://docs.getdbt.com/docs/use-dbt-semantic-layer/sl-architecture"}
sources: ["docs/reference-dwh-design-patterns.md"]
evidence: [{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§1"}]
tiers:
  - {"id":"flow","label":"構成と処理の流れ","z":0,"size":[20.5,6.5]}
nodes:
  source: {"label":"注文・商品・顧客・返品","kind":"external","tier":"flow","x":0,"y":4,"description":"共通の比較題材。","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§1"}]}
  medallion: {"label":"メダリオン","kind":"service","tier":"flow","x":4,"y":0,"description":"原本から段階的に整備。","drill":"medallion","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§2"}]}
  inmon: {"label":"Inmon CIF","kind":"service","tier":"flow","x":4,"y":3,"description":"統合 EDW と用途別マート。","drill":"dwh-inmon-cif","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§2"}]}
  vault: {"label":"Data Vault","kind":"db","tier":"flow","x":4,"y":6,"description":"業務キーと履歴を保持。","drill":"dwh-data-vault","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§2"}]}
  kimball: {"label":"Kimball バス","kind":"service","tier":"flow","x":8,"y":0,"description":"業務を共通の分析軸で結ぶ。","drill":"dwh-kimball-bus","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§2"}]}
  star: {"label":"スタースキーマ","kind":"db","tier":"flow","x":8,"y":3,"description":"一つの粒度を中心に集計。","drill":"dwh-star-schema","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§3"}]}
  snowflake-schema: {"label":"スノーフレーク","kind":"db","tier":"flow","x":12,"y":0,"description":"ディメンションの階層を分ける。","drill":"dwh-snowflake-schema","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§3"}]}
  scd: {"label":"SCD","kind":"db","tier":"flow","x":8,"y":6,"description":"属性の履歴を扱う。","drill":"dwh-slowly-changing-dimensions","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§3"}]}
  fact-types: {"label":"ファクトテーブルの型","kind":"db","tier":"flow","x":12,"y":3,"description":"イベント・時点・工程で選ぶ。","drill":"dwh-fact-table-types","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§3"}]}
  wide: {"label":"ワイドテーブル","kind":"db","tier":"flow","x":12,"y":6,"description":"定型利用向けに平坦化やネストを選ぶ。","drill":"dwh-wide-table","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§3"}]}
  aggregates: {"label":"事前集約と指標定義","kind":"service","tier":"flow","x":16,"y":2,"description":"よく使う指標と対応する粒度。","drill":"dwh-aggregate-tables","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§4"}]}
  bi: {"label":"BI／業務レポート","kind":"client","tier":"flow","x":20,"y":4,"description":"整備済みのデータを利用。","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§4"}]}
links:
  - {"id":"layers","from":"source","to":"medallion","label":"品質と再処理の起点を設計","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§2"}]}
  - {"id":"integrate","from":"source","to":"inmon","label":"共通の定義で統合","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§2"}]}
  - {"id":"record","from":"source","to":"vault","label":"出所と履歴を保存","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§2"}]}
  - {"id":"conform","from":"medallion","to":"kimball","label":"共有する分析軸を決める","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§2"}]}
  - {"id":"mart","from":"inmon","to":"star","label":"用途別マートの例","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§2"}]}
  - {"id":"derive","from":"vault","to":"star","label":"履歴を分析用マートへ展開","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§2"}]}
  - {"id":"dimensions","from":"kimball","to":"star","label":"共通ディメンションを利用","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§3"}]}
  - {"id":"hierarchy","from":"star","to":"snowflake-schema","label":"次元の階層を分ける選択肢","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§3"}]}
  - {"id":"historical","from":"scd","to":"star","label":"当時の属性で事実を読む","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§3"}]}
  - {"id":"grain","from":"star","to":"fact-types","label":"記録したい事実の粒度を選ぶ","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§3"}]}
  - {"id":"denormalize","from":"star","to":"wide","label":"配信用に平坦化する選択肢","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§3"}]}
  - {"id":"build","from":"star","to":"aggregates","label":"再利用する粒度で集約","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§4"}]}
  - {"id":"query","from":"aggregates","to":"bi","label":"定義済み指標を表示","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§4"}]}
  - {"id":"export","from":"wide","to":"bi","label":"定型の利用先へ配信","evidence":[{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§4"}]}
scenarios:
  - id: sales
    label: "受注の共通指標を BI に届ける"
    evidence: [{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§4"}]
    steps:
      - {"links":["layers","conform"],"note":"整備の層を決め、受注と返品で共通に使う日付・商品を整理する。"}
      - {"links":["dimensions","grain","historical"],"note":"ファクトの粒度と、当時の属性が必要な指標を決める。"}
      - {"links":["build","query"],"note":"利用頻度の高い指標を公開し、どの粒度まで事前集約で答えられるか確認する。"}
  - id: sources
    label: "複数ソースの統合とマートを比較"
    evidence: [{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§2"}]
    steps:
      - {"links":["integrate","record"],"note":"同じ受注データを統合 EDW と履歴中心の Vault で扱う場合の違いを見る。"}
      - {"links":["mart","derive"],"note":"分析用マートに必要な業務ルールと粒度を整理する。"}
      - {"links":["hierarchy","denormalize","export"],"note":"用途に合わせ、階層の分離や定型配信のワイドテーブルを検討する。"}

implementations:
  - id: bq-lab
    label: "BigQuery の DWH 設計比較環境"
    description: "合成の注文 CSV と明細を共通入力にし、試すパターンごとに別データセットへ SQL の成果物を作る比較環境。表の構成は比較候補で、すべてを一つの本番経路として使う想定ではない。"
    sources:
      - {title: "Kimball Group の次元モデリング技法", url: "https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/"}
      - {title: "Databricks のメダリオン", url: "https://docs.databricks.com/aws/en/lakehouse/medallion"}
      - {title: "Bill Inmon の CIF と Data Warehousing 2.0", url: "https://www.embarcadero.com/images/dm/technical-papers/bill-inmon-data-warehousing-2-0-whitepaper.pdf"}
      - {title: "Data Vault Alliance", url: "https://datavaultalliance.com/engineering/data-vault-2-0-an-introduction/"}
      - {title: "BigQuery のネストと繰り返し列", url: "https://docs.cloud.google.com/bigquery/docs/best-practices-performance-nested"}
      - {title: "dbt Semantic Layer", url: "https://docs.getdbt.com/docs/use-dbt-semantic-layer/sl-architecture"}
      - {title: "BigQuery データセットの作成", url: "https://docs.cloud.google.com/bigquery/docs/datasets"}
      - {title: "BigQuery 論理ビュー", url: "https://docs.cloud.google.com/bigquery/docs/views-intro"}
    tiers:
      - {id: "flow", label: "構成と処理の流れ", z: 0, size: [20.5,6.5]}
      - {id: "implementation-setup", label: "実装時の設定・観測", z: 1, size: [8,3]}
    nodes:
      example-source: {label: "BigQuery lab_input データセット", kind: "table", tier: "flow", x: 0, y: 4, svc: "gcp:bigquery", realizes: ["source"], description: "比較に使う注文・商品・顧客・返品の表を登録する。", evidence: [{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§5"}]}
      example-medallion: {label: "lab_layers データセット", kind: "table", tier: "flow", x: 4, y: 0, realizes: ["medallion"], description: "原本、検証済み、業務集計のテーブルを段階別に分ける。", evidence: [{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§5"}]}
      example-inmon: {label: "lab_cif データセット", kind: "table", tier: "flow", x: 4, y: 3, realizes: ["inmon"], description: "統合した正規化表から営業と経理の公開ビューを作る。", evidence: [{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§5"}]}
      example-vault: {label: "lab_vault データセット", kind: "table", tier: "flow", x: 4, y: 6, realizes: ["vault"], description: "Hub・Link・Satellite と業務派生・公開ビューを作る。", evidence: [{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§5"}]}
      example-kimball: {label: "lab_dimensional のディメンション・ファクト", kind: "table", tier: "flow", x: 8, y: 0, realizes: ["kimball","star"], description: "注文と返品から共通ディメンションを再利用し、受注明細のスタースキーマも確認する。", evidence: [{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§5"}]}
      example-snowflake-schema: {label: "lab_hierarchy の商品とカテゴリ表", kind: "table", tier: "flow", x: 12, y: 0, realizes: ["snowflake-schema"], description: "スタースキーマに対し、カテゴリを分離した構成を比較する。", evidence: [{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§5"}]}
      example-scd: {label: "lab_history の顧客履歴表", kind: "table", tier: "flow", x: 8, y: 6, realizes: ["scd"], description: "有効期間と代理キーにより時点で顧客属性を参照する。", evidence: [{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§5"}]}
      example-fact-types: {label: "lab_grain のイベント・日次・進捗表", kind: "table", tier: "flow", x: 12, y: 3, realizes: ["fact-types"], description: "用途ごとに異なる事実の粒度を作って比較する。", evidence: [{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§5"}]}
      example-wide: {label: "lab_wide の平坦表・ネスト表", kind: "table", tier: "flow", x: 12, y: 6, realizes: ["wide"], description: "明細行と注文行の件数・重複集計を比較する。", evidence: [{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§5"}]}
      example-aggregates: {label: "lab_rollup の日次集約と公開ビュー", kind: "table", tier: "flow", x: 16, y: 2, realizes: ["aggregates"], description: "注文明細の結果に対し、日次集約を使う場合の結果を照合する。", evidence: [{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§5"}]}
      example-bi: {label: "比較用の BigQuery SQL 結果", kind: "client", tier: "flow", x: 20, y: 4, realizes: ["bi"], description: "同じ入力範囲と集計指標の結果を記録する。", evidence: [{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§5"}]}
      example-checks: {label: "比較用 SQL スクリプト", kind: "workflow", tier: "implementation-setup", x: 1, y: 1.5, description: "粒度の一意性、行数、売上の合計を、選んだ比較先ごとに確認する。", evidence: [{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§5"}]}
    links:
      - {id: "example-checks-connection", from: "example-checks", to: "example-bi", label: "結果の同等性を照合", evidence: [{"type":"doc","ref":"docs/reference-dwh-design-patterns.md#§5"}]}
