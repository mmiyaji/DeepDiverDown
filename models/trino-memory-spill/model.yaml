name: Trino：メモリ管理とスピル
description: Operator のメモリがどう数えられ、上限を超えたときに終了されるか、スピルでディスクへ逃がすかを追う。
reference:
  objectives:
    - ユーザーメモリの上限（クラスタ全体・ノードごと・ヒープの余白）を区別する。
    - 取り消し可能メモリがスピルの対象になる流れを説明する。
    - スピルできる Operator と、スピルしても成功が保証されない点を説明する。
  sources:
    - title: Trino · Resource management properties
      url: https://trino.io/docs/current/admin/properties-resource-management.html
    - title: Trino · Spilling to disk
      url: https://trino.io/docs/current/admin/spill.html
    - title: Trino · Spilling properties
      url: https://trino.io/docs/current/admin/properties-spilling.html
    - title: Trino · Query management properties
      url: https://trino.io/docs/current/admin/properties-query-management.html
sources:
  - docs/reference-trino-memory-spill.md
evidence:
  - { type: doc, ref: "docs/reference-trino-memory-spill.md#§1" }
tiers:
  - id: flow
    label: メモリの確保から終了・スピルまで
    z: 0
    size: [24, 7]
nodes:
  op:
    label: Operator（結合・集約・ソート・ウィンドウ）
    kind: worker
    tier: flow
    x: 0
    'y': 1.5
    parallel: 'N'
    description: Worker 上の Task で、中間結果をメモリに持ちながら処理する。
    evidence: [{ type: doc, ref: "docs/reference-trino-memory-spill.md#§1" }]
  usermem:
    label: ユーザーメモリ（追跡対象）
    kind: cache
    tier: flow
    x: 6
    'y': 1.5
    replicas: 2
    description: Trino が追跡するクエリのメモリ。クラスタ全体とノードごとに数える。
    evidence: [{ type: doc, ref: "docs/reference-trino-memory-spill.md#§2" }]
  limits:
    label: メモリ上限
    kind: policy
    tier: flow
    x: 12
    'y': 1.5
    replicas: 2
    description: query.max-memory、query.max-memory-per-node、query.max-total-memory、ヒープの余白。超えたクエリは終了される。
    evidence: [{ type: doc, ref: "docs/reference-trino-memory-spill.md#§2" }]
  killer:
    label: 低メモリ時のクエリ終了
    kind: policy
    tier: flow
    x: 18
    'y': 1.5
    replicas: 1
    description: query.low-memory-killer.policy に従い、メモリ不足のとき終了するクエリを選ぶ。
    evidence: [{ type: doc, ref: "docs/reference-trino-memory-spill.md#§5" }]
  revocable:
    label: 取り消し可能メモリ
    kind: cache
    tier: flow
    x: 6
    'y': 5
    replicas: 2
    description: スピルできる中間結果のメモリ。メモリマネージャーが取り消すとディスクへ書く。
    evidence: [{ type: doc, ref: "docs/reference-trino-memory-spill.md#§3" }]
  spill:
    label: スピル先（ローカルディスク）
    kind: file
    tier: flow
    x: 12
    'y': 5
    replicas: 2
    description: spiller-spill-path のディレクトリ。システムドライブを避け、複数ディスクも指定できる。
    evidence:
      - { type: doc, ref: "docs/reference-trino-memory-spill.md#§4" }
      - { type: doc, ref: "docs/reference-trino-memory-spill.md#§6" }
links:
  - id: alloc
    from: op
    to: usermem
    label: メモリを確保
    evidence: [{ type: doc, ref: "docs/reference-trino-memory-spill.md#§2" }]
  - id: alloc-revocable
    from: op
    to: revocable
    label: スピルできる分を確保
    evidence: [{ type: doc, ref: "docs/reference-trino-memory-spill.md#§3" }]
  - id: check-user
    from: usermem
    to: limits
    label: 上限と照合
    evidence: [{ type: doc, ref: "docs/reference-trino-memory-spill.md#§2" }]
  - id: check-total
    from: revocable
    to: limits
    label: 合計を照合
    evidence: [{ type: doc, ref: "docs/reference-trino-memory-spill.md#§3" }]
  - id: kill
    from: limits
    to: killer
    label: 超過・不足でクエリを終了
    evidence: [{ type: doc, ref: "docs/reference-trino-memory-spill.md#§5" }]
  - id: spill-write
    from: revocable
    to: spill
    label: 取り消し時に書き出す
    evidence: [{ type: doc, ref: "docs/reference-trino-memory-spill.md#§4" }]
  - id: unspill
    from: spill
    to: op
    label: 読み戻して処理を続ける
    evidence: [{ type: doc, ref: "docs/reference-trino-memory-spill.md#§4" }]
scenarios:
  - id: memory-pressure
    label: メモリを使い切りそうなクエリ
    evidence: [{ type: doc, ref: "docs/reference-trino-memory-spill.md#§3" }]
    steps:
      - links: [alloc, alloc-revocable]
        note: Operator が中間結果のメモリを確保する。スピルできる分は取り消し可能メモリになる。
      - links: [check-user, check-total]
        note: 追跡中のメモリを上限と照合する。
      - links: [spill-write]
        note: スピルが有効なら、取り消し時に中間データをローカルディスクへ書く。
      - links: [unspill]
        note: 書いたデータを読み戻して処理を続ける。結合は 1 パーティションずつ読む。
      - links: [kill]
        note: 上限を超えるか、メモリが足りないときは、方針に従ってクエリが終了される。
unknowns:
  - id: UNK-01
    text: メモリマネージャーが取り消しを始める閾値（memory-revoking-threshold と memory-revoking-target）の既定値と挙動は、確認した資料に記載がない。
    refs: [revocable]
  - id: UNK-02
    text: 取り消し可能メモリがどの上限に数えられるかの詳細は query.max-total-memory 以外を確認していない。
    refs: [limits]
gates: { maxDrift: 0, maxHigh: 1 }
implementations:
  - id: trino-iceberg
    label: EKS 上の Trino・Glue Catalog・S3
    description: EKS の EC2 ノード上で Trino Coordinator / Worker を実行し、Glue Data Catalog と S3 上の Iceberg を読む構成例。
    sources:
      - title: Trino · Concepts
        url: https://trino.io/docs/current/overview/concepts.html
      - title: Trino · Iceberg connector
        url: https://trino.io/docs/current/connector/iceberg.html
      - title: Trino file system support
        url: https://trino.io/docs/current/object-storage/file-system-s3.html
      - title: Trino on Kubernetes with Helm
        url: https://trino.io/docs/current/installation/kubernetes.html
      - title: Amazon EKS managed node groups
        url: https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html
      - title: IAM roles for service accounts
        url: https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html
    tiers:
      - id: entry
        label: 利用者
        kind: origin
        z: 2
        size:
          - 18
          - 3
      - id: control-plane
        label: AWS の管理・認証
        z: 1
        size:
          - 18
          - 3
      - id: processing
        label: EKS の Trino 実行
        z: 0
        size:
          - 18
          - 3
      - id: storage
        label: テーブルの保存
        z: -1
        size:
          - 18
          - 3
    nodes:
      trino-iceberg-client:
        label: Trino CLI
        kind: client
        tier: entry
        x: 1
        'y': 1.5
        description: SQL を送り、結果を取得する。
        evidence:
          - type: doc
            ref: docs/reference-trino-memory-spill.md#§7
      trino-iceberg-coordinator:
        label: Trino Coordinator Pod
        kind: service
        tier: processing
        x: 3
        'y': 1.5
        realizes:
          - killer
          - limits
        description: Iceberg Connector とカタログ設定を持つ Coordinator が Glue に問い合わせ、分散クエリを計画する。
        evidence:
          - type: doc
            ref: docs/reference-trino-memory-spill.md#§7
        management:
          type: customer
          scope: 利用者が Trino とカタログ設定、SQL アクセスを管理する。
      trino-iceberg-workers:
        label: Trino Worker Pods
        kind: worker
        tier: processing
        x: 9
        'y': 1.5
        realizes:
          - op
          - usermem
          - revocable
          - limits
        description: EC2 ノード上の Worker Pod が S3 のファイルを並列に読み、集計する。
        evidence:
          - type: doc
            ref: docs/reference-trino-memory-spill.md#§7
        management:
          type: customer
          scope: 利用者が Trino の配置、容量と更新を管理する。
      trino-iceberg-data:
        label: S3 / Iceberg テーブル
        kind: db
        tier: storage
        x: 9
        'y': 1.5
        svc: s3
        description: スナップショットが参照する物理ファイルを保持する。
        evidence:
          - type: doc
            ref: docs/reference-trino-memory-spill.md#§7
        management:
          type: shared
          scope: AWS が S3 基盤を運用し、利用者がデータと権限を管理する。
      trino-iceberg-glue:
        label: AWS Glue Data Catalog
        kind: catalog
        tier: control-plane
        x: 3
        'y': 1.5
        description: テーブルのメタデータ位置を提供する。
        evidence:
          - type: doc
            ref: docs/reference-trino-memory-spill.md#§7
        svc: glue
        management:
          type: shared
          scope: AWS が Glue 基盤を運用し、利用者がカタログと権限を管理する。
      trino-iceberg-eks:
        label: Amazon EKS / Kubernetes API
        svc: eks
        kind: service
        tier: control-plane
        x: 9
        'y': 1.5
        description: Kubernetes の制御プレーンが Trino の Pod 配置を管理する。
        evidence:
          - type: doc
            ref: docs/reference-trino-memory-spill.md#§7
        management:
          type: shared
          scope: AWS が制御プレーンを運用し、利用者が Kubernetes API とクラスタ設定を操作する。
      trino-iceberg-ec2:
        label: EC2 / EKS ノードグループ
        svc: ec2
        kind: host
        tier: processing
        x: 15
        'y': 1.5
        description: マネージドノードグループの EC2 が Coordinator と Worker の Pod を実行する。
        evidence:
          - type: doc
            ref: docs/reference-trino-memory-spill.md#§7
        management:
          type: shared
          scope: AWS が EC2 基盤を運用し、利用者がノードグループと更新を管理する。
        realizes:
          - spill
      trino-iceberg-iam:
        label: IAM / Pod 用ロール
        svc: iam
        kind: policy
        tier: control-plane
        x: 15
        'y': 1.5
        description: サービスアカウントに対応する IAM ロールで Glue と S3 へのアクセス権を付与する。
        evidence:
          - type: doc
            ref: docs/reference-trino-memory-spill.md#§7
        management:
          type: customer
          scope: 利用者がサービスアカウントと IAM ロール・ポリシーを設定する。
    links:
      - id: trino-host-coordinator
        from: trino-iceberg-ec2
        to: trino-iceberg-coordinator
        label: Coordinator Pod を実行
      - id: trino-glue
        from: trino-iceberg-coordinator
        to: trino-iceberg-glue
        label: テーブル情報を取得
        evidence:
          - type: doc
            ref: docs/reference-trino-memory-spill.md#§7
      - id: trino-eks-schedule
        from: trino-iceberg-eks
        to: trino-iceberg-workers
        label: Worker Pod を配置
        evidence:
          - type: doc
            ref: docs/reference-trino-memory-spill.md#§7
      - id: trino-ec2-runtime
        from: trino-iceberg-ec2
        to: trino-iceberg-workers
        label: Pod を実行
        evidence:
          - type: doc
            ref: docs/reference-trino-memory-spill.md#§7
      - id: trino-iam-role
        from: trino-iceberg-iam
        to: trino-iceberg-coordinator
        label: AWS アクセス権を付与
        evidence:
          - type: doc
            ref: docs/reference-trino-memory-spill.md#§7
      - id: trino-iam-workers
        from: trino-iceberg-iam
        to: trino-iceberg-workers
        label: S3 読み取り権限を付与
        evidence:
          - type: doc
            ref: docs/reference-trino-memory-spill.md#§7
    groups:
      - kind: cloud
        label: AWS アカウント
        provider: aws
        tier:
          - control-plane
          - processing
          - storage
        nodes:
          - trino-iceberg-glue
          - trino-iceberg-eks
          - trino-iceberg-iam
          - trino-iceberg-coordinator
          - trino-iceberg-workers
          - trino-iceberg-ec2
          - trino-iceberg-data
      - kind: cluster
        label: EKS クラスタ / Trino
        tier:
          - processing
        nodes:
          - trino-iceberg-coordinator
          - trino-iceberg-workers
          - trino-iceberg-ec2
    layout2d:
      tiers:
        - id: diagram
          label: AWS 上の Trino
