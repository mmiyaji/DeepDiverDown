name: Hopsworks の特徴量ストア
description: Hopsworks のフィーチャーグループ、オンラインとオフラインの二つのストア、Kafka 経由の書き込み、フィーチャービュー、モデルの配備を示す。
reference:
  objectives: [オンラインとオフラインの二つのストアの役割を区別する, 書き込み経路（ストリーム API とバッチ API）の違いを確認する, フィーチャービューが学習と推論をつなぐ流れを確認する]
  sources:
    - {title: Hopsworks の概要, url: https://docs.hopsworks.ai/latest/concepts/hopsworks/}
    - {title: フィーチャーグループの概要, url: https://docs.hopsworks.ai/latest/concepts/fs/feature_group/fg_overview/}
    - {title: 書き込み API, url: https://docs.hopsworks.ai/latest/concepts/fs/feature_group/write_apis/}
    - {title: フィーチャービューの概要, url: https://docs.hopsworks.ai/latest/concepts/fs/feature_view/fv_overview/}
    - {title: 外部フィーチャーグループ, url: https://docs.hopsworks.ai/latest/concepts/fs/feature_group/external_fg/}
    - {title: logicalclocks/hopsworks（GitHub）, url: https://github.com/logicalclocks/hopsworks}
sources: [docs/reference-hopsworks.md]
evidence: [{type: doc, ref: docs/reference-hopsworks.md#§1}]
tiers:
  - {id: flow, label: 取り込み・保存・提供, z: 0, size: [46, 11]}
nodes:
  source: {label: データソース, kind: external, tier: flow, x: 1, y: 5, description: バッチ・ストリームの元データ。Snowflake、BigQuery、Redshift、S3 などは外部テーブルとして接続もできる。, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§2}]}
  pipeline: {label: 特徴量パイプライン, kind: worker, tier: flow, x: 7, y: 5, description: Python または Spark で特徴量を計算して書く。Python クライアントの書き込みはストリーム API だけ。, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§3}]}
  kafka: {label: Kafka トピック, kind: service, tier: flow, x: 13, y: 3, description: ストリーム API の書き込みを受ける。配信は at-least-once で、後段の処理で実質 1 回にそろえる。, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§3}]}
  onlinefs: {label: OnlineFS, kind: service, tier: flow, x: 19, y: 1.5, description: Kafka の内容をオンラインストアへ冪等に upsert する。, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§3}]}
  dstream: {label: Hudi DeltaStreamer ジョブ, kind: worker, tier: flow, x: 19, y: 8.5, description: Kafka の内容をオフラインの Hudi テーブルへ書く。コミット時に重複を除く。, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§3}]}
  online: {label: オンラインストア（RonDB）, kind: db, tier: flow, x: 25, y: 2, description: エンティティごとの最新値だけを持つ。event_time と TTL を付けると複数行も持てる。, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§2}]}
  offline: {label: オフラインストア, kind: db, tier: flow, x: 25, y: 8, description: 履歴を持ち、学習データとバッチ推論の取得元になる。Hudi テーブルとして書く（概要図の表記は Delta で、版による違いは未確認）。, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§2}]}
  fview: {label: フィーチャービュー, kind: service, tier: flow, x: 31, y: 5, description: 複数のフィーチャーグループの特徴量を結合した論理的な入口。変換関数を持ち、学習と推論で同じ変換を使う。, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§4}]}
  train: {label: 学習・バッチ推論, kind: worker, tier: flow, x: 37, y: 2, description: フィーチャービューから学習・検証・テストのデータを作り、モデルを学習する。, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§4}]}
  serving: {label: モデルの登録と配備（KServe）, kind: service, tier: flow, x: 37, y: 8, description: モデルレジストリに登録し、KServe で配備する。推論リクエストは Kafka に記録できる。, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§5}]}
  app: {label: 推論クライアント, kind: client, tier: flow, x: 43, y: 8, description: サービングキーを渡して推論を要求する。, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§4}]}
links:
  - {id: l-ingest, from: source, to: pipeline, label: 元データを読み込む, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§3}]}
  - {id: l-stream, from: pipeline, to: kafka, label: ストリーム API で書く, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§3}]}
  - {id: l-batch, from: pipeline, to: offline, label: バッチ API で直接書く（Spark のみ）, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§3}]}
  - {id: l-k-on, from: kafka, to: onlinefs, label: 変更を渡す, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§3}]}
  - {id: l-k-off, from: kafka, to: dstream, label: 変更を渡す, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§3}]}
  - {id: l-upsert, from: onlinefs, to: online, label: 最新値を upsert, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§3}]}
  - {id: l-commit, from: dstream, to: offline, label: 履歴を追記, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§3}]}
  - {id: l-hist, from: offline, to: fview, label: 履歴を取得, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§4}]}
  - {id: l-latest, from: online, to: fview, label: 最新値を取得, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§4}]}
  - {id: l-data, from: fview, to: train, label: 学習データを作成, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§4}]}
  - {id: l-model, from: train, to: serving, label: 学習済みモデルを登録, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§5}]}
  - {id: l-req, from: app, to: serving, label: 推論を要求, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§4}]}
  - {id: l-vec, from: serving, to: fview, label: 特徴量ベクトルを取得, evidence: [{type: doc, ref: docs/reference-hopsworks.md#§4}]}
scenarios:
  - id: stream-write
    label: ストリーム API で書いて二つのストアに反映する
    evidence: [{type: doc, ref: docs/reference-hopsworks.md#§3}]
    steps:
      - {links: [l-ingest, l-stream], note: パイプラインが特徴量を計算し、Kafka トピックへ書く。}
      - {links: [l-k-on, l-k-off], note: OnlineFS と DeltaStreamer ジョブがそれぞれ Kafka を読む。}
      - {links: [l-upsert, l-commit], note: オンラインは最新値に置き換え、オフラインは履歴に追記する。}
  - id: train-and-serve
    label: 学習して配備し、推論時に特徴量を引く
    evidence: [{type: doc, ref: docs/reference-hopsworks.md#§4}]
    steps:
      - {links: [l-hist, l-data, l-model], note: フィーチャービューから学習データを作り、モデルを登録する。}
      - {links: [l-req, l-vec, l-latest], note: 推論時にサービングキーでオンラインの最新値を取得する。}
requirements:
  - {id: HW-01, kind: usecase, title: 学習と推論で同じ特徴量定義と変換を使う, text: フィーチャービューが学習データとオンラインの特徴量ベクトルの両方を供給し、変換関数を共有する。, links: [l-data, l-vec], evidence: [{type: doc, ref: docs/reference-hopsworks.md#§4}]}
unknowns:
  - {id: UNK-01, text: オフラインストアの形式は、書き込み API の資料が Hudi、概要図が Delta と表記しており、版ごとの違いは未確認。, refs: [offline, dstream]}
  - {id: UNK-02, text: 履歴を時点で正しく結合する仕組み（point-in-time join）の詳細は取得した資料に記載がなく未確認。, refs: [fview]}
  - {id: UNK-03, text: Flink の対応、Arrow Flight によるオフラインクエリ、HopsFS の役割は取得した資料に記載がなく未確認。, refs: [pipeline, offline]}
  - {id: UNK-04, text: 稼働台数、ノード構成、Kafka・RonDB の具体的な配置は未確認。, refs: [kafka, online]}
gates: {maxDrift: 0, maxHigh: 0}
