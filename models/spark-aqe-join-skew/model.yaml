parent:
  model: spark
  node: executor-b
blocks:
  - id: partitions
    title: 実行時の partition 調整（概念例）
    note: AQE が実測統計を得た後に小さい partition をまとめたり、条件を満たす偏りを分割する。
    lanes:
      - id: before
        label: shuffle 出力
        node: shuffle
      - id: after
        label: AQE の読み取り単位
        node: aqe
    items:
      before:
        - id: p0
          label: 小 0
          k: 0
        - id: p1
          label: 小 1
          k: 1
        - id: p2
          label: 大 2
          k: 2
      after:
        - id: merged
          label: 小 0 + 1
          k: 0
          note: 小さい連続 partition の結合例。
        - id: split1
          label: 大 2 の一部
          k: 2
          note: 対象の skew partition を分割する例。
        - id: split2
          label: 大 2 の残り
          k: 2
          note: 分割の可否は条件に依存する。
