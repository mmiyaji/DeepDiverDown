name: Spark SQL：AQE と Join・データスキュー
description: shuffle の実測統計を使って Join 方式や partition を調整する適応実行を追う。
reference:
  objectives:
    - shuffle の実測統計を使って Join 方式や partition を調整する適応実行を追う。
    - AQE は Spark 3.2 以降デフォルト有効。
    - skew 対策の分割、サイズに基づく partition 結合は条件と設定に依存する。
  sources:
    - title: Spark SQL performance tuning
      url: https://spark.apache.org/docs/4.3.0/sql-performance-tuning.html
    - title: Spark SQL UI
      url: https://spark.apache.org/docs/4.3.0/web-ui.html
sources:
  - docs/reference-spark-aqe-join-skew.md
evidence:
  - type: doc
    ref: docs/reference-spark-aqe-join-skew.md#§1
tiers:
  - id: flow
    label: 処理の流れ
    z: 0
    size:
      - 21
      - 8
nodes:
  scan:
    label: 入力と推定統計
    kind: db
    tier: flow
    x: 1
    'y': 1.5
    description: データソースとカタログの統計で初期計画を選ぶ。
    evidence:
      - type: doc
        ref: docs/reference-spark-aqe-join-skew.md#§2
  plan:
    label: 初期物理計画
    kind: service
    tier: flow
    x: 6
    'y': 1.5
    description: Join と Exchange を含む計画を準備する。
    evidence:
      - type: doc
        ref: docs/reference-spark-aqe-join-skew.md#§2
  shuffle:
    label: Shuffle 書き込み
    kind: worker
    tier: flow
    x: 11
    'y': 1.5
    description: map 側がデータを partition に再分配して実測サイズを作る。
    evidence:
      - type: doc
        ref: docs/reference-spark-aqe-join-skew.md#§2
  stats:
    label: 実行時統計
    kind: file
    tier: flow
    x: 16
    'y': 1.5
    description: materialized な query stage の partition サイズなどを AQE が受け取る。
    evidence:
      - type: doc
        ref: docs/reference-spark-aqe-join-skew.md#§2
  aqe:
    label: 適応的再計画
    kind: service
    tier: flow
    x: 1
    'y': 5
    description: 条件を満たす場合に小 partition 結合、skew 分割、Join 変更を行う。
    evidence:
      - type: doc
        ref: docs/reference-spark-aqe-join-skew.md#§2
  join:
    label: 下流 Join と集約
    kind: worker
    tier: flow
    x: 6
    'y': 5
    description: 更新後の計画で下流を処理する。
    evidence:
      - type: doc
        ref: docs/reference-spark-aqe-join-skew.md#§2
  output:
    label: 結果
    kind: db
    tier: flow
    x: 11
    'y': 5
    description: クエリ結果またはテーブルに出力する。
    evidence:
      - type: doc
        ref: docs/reference-spark-aqe-join-skew.md#§2
links:
  - id: initial
    from: scan
    to: plan
    label: 統計で初期計画
    evidence:
      - type: doc
        ref: docs/reference-spark-aqe-join-skew.md#§3
  - id: run
    from: plan
    to: shuffle
    label: shuffle を実行
    evidence:
      - type: doc
        ref: docs/reference-spark-aqe-join-skew.md#§3
  - id: measure
    from: shuffle
    to: stats
    label: partition サイズを報告
    evidence:
      - type: doc
        ref: docs/reference-spark-aqe-join-skew.md#§3
  - id: adapt
    from: stats
    to: aqe
    label: 実測値で再計画
    evidence:
      - type: doc
        ref: docs/reference-spark-aqe-join-skew.md#§3
  - id: next
    from: aqe
    to: join
    label: 下流の Join を決定
    evidence:
      - type: doc
        ref: docs/reference-spark-aqe-join-skew.md#§3
  - id: fetch
    from: shuffle
    to: join
    label: shuffle を読み戻す
    evidence:
      - type: doc
        ref: docs/reference-spark-aqe-join-skew.md#§3
  - id: write
    from: join
    to: output
    label: 結果を出力
    evidence:
      - type: doc
        ref: docs/reference-spark-aqe-join-skew.md#§3
scenarios:
  - id: flow
    label: 処理の流れ
    steps:
      - links:
          - initial
        note: 統計で初期計画。
      - links:
          - run
        note: shuffle を実行。
      - links:
          - measure
        note: partition サイズを報告。
      - links:
          - adapt
        note: 実測値で再計画。
      - links:
          - next
        note: 下流の Join を決定。
      - links:
          - fetch
        note: shuffle を読み戻す。
      - links:
          - write
        note: 結果を出力。
implementations:
  - id: spark-standalone
    label: 自己管理 Spark Standalone の代表構成
    description: Spark Standalone のホスト、Driver、Executor と入力・出力を使う概念的な代表例。製品・プラグイン・バージョンの互換性および実機動作は別途確認する。
    sources:
      - title: Spark SQL performance tuning
        url: https://spark.apache.org/docs/4.3.0/sql-performance-tuning.html
      - title: Spark SQL UI
        url: https://spark.apache.org/docs/4.3.0/web-ui.html
      - title: Spark Standalone Mode
        url: https://spark.apache.org/docs/4.3.0/spark-standalone.html
