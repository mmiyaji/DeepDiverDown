name: Snowflake の基本アーキテクチャ
description: ストレージ、仮想ウェアハウス、クラウドサービスを分離し、取り込み、SQL、ガバナンス、復旧、共有を追う。
reference:
  objectives:
    - ストレージと計算を区別する。
    - 用途別ウェアハウスの実行を追う。
    - クラウドサービス層の役割を理解する。
    - データ保護、復旧、アカウント間共有の責務を区別する。
  sources:
    - title: Snowflake key concepts and architecture
      url: https://docs.snowflake.com/en/user-guide/intro-key-concepts
    - title: Secure Data Sharing
      url: https://docs.snowflake.com/en/user-guide/data-sharing-intro
sources:
  - docs/reference-snowflake.md
evidence:
  - type: doc
    ref: docs/reference-snowflake.md#§1
  - type: doc
    ref: docs/reference-snowflake.md#§6
tiers:
  - id: platform
    label: Snowflake platform
    z: 0
    size:
      - 18
      - 6
  - id: compute
    label: 計算ワークロード
    z: 1
    origin:
      - 4
      - 0
    size:
      - 12
      - 3
nodes:
  source:
    label: Source
    kind: external
    tier: platform
    x: 0
    'y': 1.5
    description: 取り込み元。
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§1
  services:
    label: 認証・メタデータ調整
    kind: service
    tier: compute
    x: 3
    'y': 1.5
    description: 認証とメタデータ等を調整。
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§4
  load:
    parallel: 'N'
    label: バッチ取込用の計算資源
    kind: worker
    tier: compute
    x: 6
    'y': 1.5
    drill: snowflake-ingestion-cdc
    description: 取込専用の計算枠を使う。ファイル到着時と行単位の連続取込も選べる。
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§3
  storage:
    label: 永続テーブル保存
    kind: db
    tier: platform
    x: 9
    'y': 1.5
    drill: snowflake-time-travel
    description: 永続データを保持する。履歴参照とクローンは詳細図で確認する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§2
  biwh:
    parallel: 'N'
    label: BI 用の SQL 計算資源
    kind: worker
    tier: compute
    x: 12
    'y': 1.5
    drill: snowflake-query-performance
    description: BIクエリを実行する。待ち行列とスキャン量を詳細図で確認する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§3
  bi:
    label: BI users
    kind: actor
    tier: platform
    x: 15
    'y': 1.5
    description: 分析利用者。
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§5
  metadata:
    label: データカタログと統制
    kind: service
    tier: platform
    x: 6
    'y': 1.5
    drill: snowflake-horizon-catalog
    description: 資産の発見・分類・ガバナンスとアクセスの追跡。
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§4
  sharing:
    label: 読み取り専用データ共有
    kind: service
    tier: platform
    x: 9
    'y': 5
    drill: snowflake-secure-sharing
    description: 受領者へ許可するビューやテーブルを公開する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§7
  partner:
    label: データ受領者
    kind: external
    tier: platform
    x: 15
    'y': 5
    description: 共有したオブジェクトを読み取り専用で利用する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§7
links:
  - id: ingest
    from: source
    to: load
    label: データをロード
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§3
  - id: write
    from: load
    to: storage
    label: 永続化
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§2
  - id: govern
    from: services
    to: metadata
    label: メタデータを管理
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§4
  - id: query
    from: biwh
    to: storage
    label: データをクエリ
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§3
  - id: serve
    from: biwh
    to: bi
    label: 分析結果を提供
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§5
  - id: coordinate
    from: services
    to: biwh
    label: 要求を調整
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§4
  - id: expose
    from: storage
    to: sharing
    label: 公開するビューを選ぶ
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§7
  - id: share
    from: sharing
    to: partner
    label: 受領者へ読み取り権限を提供
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§7
scenarios:
  - id: ingest-bi
    label: 取り込みとBIを分離
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§5
    steps:
      - links:
          - ingest
          - write
        note: Load warehouseがSourceを読み、Cloud storageへ永続化する。
      - links:
          - coordinate
          - query
        note: Cloud servicesがBI要求を調整し、BI warehouseがクエリする。
      - links:
          - serve
        note: 計算結果をBI利用者へ提供する。
  - id: govern-share
    label: 社内の利用と外部への共有を分ける
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§7
    steps:
      - links:
          - govern
        note: 機微列を分類し、社内ロールで参照できる範囲を確認する。
      - links:
          - expose
        note: 外部へは必要な集計に絞った共有用ビューを選ぶ。
      - links:
          - share
        note: 受領アカウントへ読み取り権限を付与する。
requirements:
  - id: BR-01
    kind: usecase
    title: 分離したワークロード
    text: 取り込みとBIクエリを別ウェアハウスで実行する。
    links:
      - ingest
      - query
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§1
  - id: NFR-01
    kind: nfr
    title: 管理サービス利用
    text: 認証とメタデータ調整をサービス層に委ねる。
    links:
      - govern
      - coordinate
    evidence:
      - type: doc
        ref: docs/reference-snowflake.md#§4
unknowns:
  - id: UNK-01
    text: クラウド、ウェアハウスサイズ、権限設定は未確定。
    refs:
      - load
      - biwh
      - services
gates:
  maxDrift: 0
  maxHigh: 0
implementations:
  - id: snowflake-s3
    label: Snowflake と Amazon S3
    description: 注文ファイルを Amazon S3 に置き、Snowflake の別々の仮想ウェアハウスで取込と BI を実行する例。
    sources:
      - title: Snowflake key concepts and architecture
        url: https://docs.snowflake.com/en/user-guide/intro-key-concepts
      - title: Secure Data Sharing
        url: https://docs.snowflake.com/en/user-guide/data-sharing-intro
      - title: Snowflake S3 ストレージ統合
        url: https://docs.snowflake.com/en/user-guide/data-load-s3-config-storage-integration
    tiers:
      - id: platform
        label: Snowflake platform
        z: 0
        size:
          - 18
          - 6
      - id: compute
        label: 計算ワークロード
        z: 1
        size:
          - 13
          - 3
      - id: implementation-setup
        label: 実装時の設定・観測
        z: 2
        size:
          - 8
          - 3
    nodes:
      example-partner-wh: {label: Recipient virtual warehouse, svc: "snowflake:warehouse", kind: worker, tier: compute, x: 12, y: 2.5, description: "Recipient runs read-only queries with its own warehouse.", evidence: [{type: doc, ref: "docs/reference-snowflake.md#§8"}]}
      example-source:
        label: Amazon S3 注文ファイル
        kind: db
        tier: platform
        x: 0
        'y': 1.5
        svc: s3
        realizes:
          - source
        description: CSV を入力バケットに着地させる。
        evidence:
          - type: doc
            ref: docs/reference-snowflake.md#§8
      example-services:
        label: Snowflake Cloud Services と Horizon Catalog
        kind: service
        tier: compute
        svc: snowflake:platform
        x: 0
        'y': 1.5
        realizes:
          - services
          - metadata
        description: 認証・調整と資産調査の入口を同じ Snowflake アカウントに置く。
        evidence:
          - type: doc
            ref: docs/reference-snowflake.md#§8
      example-load:
        svc: snowflake:warehouse
        label: LOAD_WH
        kind: worker
        tier: compute
        x: 3
        'y': 1.5
        realizes:
          - load
        description: 仮想ウェアハウスで COPY INTO を実行する。
        evidence:
          - type: doc
            ref: docs/reference-snowflake.md#§8
      example-storage:
        label: Snowflake ORDERS テーブル
        kind: db
        tier: platform
        x: 9
        'y': 1.5
        realizes:
          - storage
        description: 注文を内部管理テーブルに格納する。
        evidence:
          - type: doc
            ref: docs/reference-snowflake.md#§8
      example-biwh:
        svc: snowflake:warehouse
        label: BI_WH
        kind: worker
        tier: compute
        x: 9
        'y': 1.5
        realizes:
          - biwh
        description: BI クエリに別の仮想ウェアハウスを使う。
        evidence:
          - type: doc
            ref: docs/reference-snowflake.md#§8
      example-bi:
        label: BI クライアント
        kind: actor
        tier: platform
        x: 15
        'y': 1.5
        realizes:
          - bi
        description: BI_WH を指定して SQL を実行する。
        evidence:
          - type: doc
            ref: docs/reference-snowflake.md#§8
      example-sharing:
        label: Snowflake Direct Share
        kind: service
        tier: platform
        svc: snowflake:platform
        x: 9
        'y': 5
        realizes:
          - sharing
        description: 許可した公開ビューを共有オブジェクトとして指定する。
        evidence:
          - type: doc
            ref: docs/reference-snowflake.md#§8
      example-partner:
        label: 同一リージョンの受領アカウント
        kind: external
        tier: platform
        x: 15
        'y': 5
        realizes:
          - partner
        description: 共有から読み取り専用データベースを作る。
        evidence:
          - type: doc
            ref: docs/reference-snowflake.md#§8
      example-stage:
        svc: snowflake:platform
        label: S3 外部ステージとストレージ統合
        kind: service
        tier: implementation-setup
        x: 1
        'y': 1.5
        description: 許可した S3 パスをステージに登録し、ストレージ統合でアクセスを許可する。
        evidence:
          - type: doc
            ref: docs/reference-snowflake.md#§8
      example-iam:
        label: AWS IAM / S3 アクセスロール
        svc: iam
        kind: policy
        tier: implementation-setup
        x: 6
        'y': 1.5
        description: Snowflake が引き受けるロールに対象 S3 パスへの権限と信頼関係を設定する。
        evidence:
          - type: doc
            ref: docs/reference-snowflake.md#§8
    links:
      - {id: example-partner-query, from: example-partner, to: example-partner-wh, label: "Query shared data", evidence: [{type: doc, ref: "docs/reference-snowflake.md#§8"}]}
      - id: example-s3-stage
        from: example-source
        to: example-stage
        label: S3 のファイルを参照
        evidence:
          - type: doc
            ref: docs/reference-snowflake.md#§8
        realizes:
          - ingest
        replace: true
      - id: example-stage-connection
        from: example-stage
        to: example-load
        label: COPY INTO のファイル参照先
        evidence:
          - type: doc
            ref: docs/reference-snowflake.md#§8
        realizes:
          - ingest
        replace: true
      - id: example-storage-role
        from: example-stage
        to: example-iam
        label: ストレージ統合でロールを利用
        evidence:
          - type: doc
            ref: docs/reference-snowflake.md#§8
    groups:
      - {kind: cloud, provider: snowflake, label: Provider Snowflake account, tier: [platform, compute, implementation-setup], nodes: [example-services, example-load, example-storage, example-biwh, example-sharing, example-stage]}
      - {kind: cloud, provider: aws, label: Customer AWS account, tier: [platform, implementation-setup], nodes: [example-source, example-iam]}
      - {kind: cloud, provider: snowflake, label: Recipient Snowflake account, tier: [platform, compute], nodes: [example-partner, example-partner-wh]}
    layout2d:
      tiers: [{id: diagram, label: Snowflake and AWS, z: 0, size: [33, 14]}]
      nodes:
        example-services: {tier: diagram, x: 2, y: 2}
        example-load: {tier: diagram, x: 6, y: 2}
        example-storage: {tier: diagram, x: 10, y: 2}
        example-biwh: {tier: diagram, x: 2, y: 6}
        example-sharing: {tier: diagram, x: 6, y: 6}
        example-stage: {tier: diagram, x: 10, y: 6}
        example-source: {tier: diagram, x: 17, y: 2}
        example-iam: {tier: diagram, x: 17, y: 6}
        example-partner: {tier: diagram, x: 25, y: 2}
        example-partner-wh: {tier: diagram, x: 25, y: 6}
        example-bi: {tier: diagram, x: 25, y: 11}
      groups:
        - {kind: cloud, provider: snowflake, label: Provider Snowflake account, tier: diagram, nodes: [example-services, example-load, example-storage, example-biwh, example-sharing, example-stage]}
        - {kind: cloud, provider: aws, label: Customer AWS account, tier: diagram, nodes: [example-source, example-iam]}
        - {kind: cloud, provider: snowflake, label: Recipient Snowflake account, tier: diagram, nodes: [example-partner, example-partner-wh]}
    layout3d:
      tiers:
        - {id: customer, label: Customer AWS account, z: 0, origin: [0, 0], size: [6, 3]}
        - {id: provider, label: Snowflake account services, z: 0, origin: [9, 0], size: [16, 6.5]}
        - {id: recipient, label: Recipient Snowflake account, z: 0, origin: [28, 0], size: [6, 3]}
        - {id: users, label: BI user, kind: origin, z: 0, origin: [28, 4], size: [6, 2.5]}
      nodes:
        example-source: {tier: customer, x: 2, y: 0.8}
        example-iam: {tier: customer, x: 2, y: 2.3}
        example-stage: {tier: provider, x: 1, y: 2.5}
        example-load: {tier: provider, x: 5, y: 2.5}
        example-storage: {tier: provider, x: 9, y: 2.5}
        example-sharing: {tier: provider, x: 13, y: 1}
        example-biwh: {tier: provider, x: 13, y: 4.2}
        example-services: {tier: provider, x: 9, y: 5}
        example-partner: {tier: recipient, x: 2, y: 1.5}
        example-partner-wh: {tier: recipient, x: 5, y: 1.5}
        example-bi: {tier: users, x: 3, y: 1.2}
      groups:
        - {kind: cloud, provider: snowflake, label: Provider Snowflake account, tier: provider, nodes: [example-services, example-load, example-storage, example-biwh, example-sharing, example-stage]}
        - {kind: cloud, provider: aws, label: Customer AWS account, tier: customer, nodes: [example-source, example-iam]}
        - {kind: cloud, provider: snowflake, label: Recipient Snowflake account, tier: recipient, nodes: [example-partner, example-partner-wh]}
