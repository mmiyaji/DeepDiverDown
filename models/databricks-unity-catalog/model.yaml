name: "Databricks Unity Catalog の権限・ストレージ・リネージ"
description: "名前空間とロール、ワークスペース制限、クラウドデータの管理責任、列リネージをつなげる。"
parent: {"model":"databricks","node":"catalog"}
reference:
  objectives:
    - "カタログ権限とワークスペース・バインディングを区別する。"
    - "管理テーブル、外部テーブル、外部ロケーションの責務を確認する。"
    - "クエリで観測した列リネージの影響を確認する。"
  sources:
    - {"title":"Unity Catalog のアクセス制御","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control"}
    - {"title":"ワークスペース・バインディング","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/workspace-catalog-binding"}
    - {"title":"管理／外部テーブルの指針","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/best-practices"}
    - {"title":"オブジェクトストレージのライフサイクル","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/object-storage-lifecycle"}
    - {"title":"Unity Catalog のリネージ","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/data-lineage"}
sources: ["docs/reference-databricks-unity-catalog.md"]
evidence: [{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§1"}]
tiers:
  - {"id":"flow","label":"構成と処理の流れ","z":0,"size":[19.5,5.5]}
nodes:
  workspace: {"label":"分析ワークスペース","kind":"client","tier":"flow","x":0,"y":2,"description":"本番と開発を区別。","evidence":[{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§2"}]}
  metastore: {"label":"Unity Catalog メタストア","kind":"service","tier":"flow","x":4,"y":2,"description":"カタログとオブジェクトを管理。","evidence":[{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§1"}]}
  catalog: {"label":"prod.sales","kind":"service","tier":"flow","x":8,"y":2,"description":"本番カタログと sales スキーマ。","evidence":[{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§2"}]}
  managed: {"label":"管理テーブル orders","kind":"db","tier":"flow","x":12,"y":0,"description":"ファイルもサービスで管理。","evidence":[{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§3"}]}
  external: {"label":"外部テーブル orders_landing","kind":"db","tier":"flow","x":12,"y":4,"description":"外部ファイルを指す。","evidence":[{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§3"}]}
  location: {"label":"外部ロケーション＋資格情報","kind":"service","tier":"flow","x":8,"y":5,"description":"パスと認証方法を対応付ける。","evidence":[{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§3"}]}
  storage: {"label":"クラウドストレージ","kind":"db","tier":"flow","x":16,"y":4,"description":"基盤ファイルを保持。","evidence":[{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§3"}]}
  masked: {"label":"参照クエリ／BI","kind":"client","tier":"flow","x":16,"y":0,"description":"制御適用後の値を利用。","evidence":[{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§2"}]}
  lineage: {"label":"列リネージ","kind":"service","tier":"flow","x":19,"y":2,"description":"上流列からクエリと下流を辿る。","evidence":[{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§4"}]}
links:
  - {"id":"binding","from":"workspace","to":"metastore","label":"ワークスペースからの利用制約を確認","evidence":[{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§2"}]}
  - {"id":"namespace","from":"metastore","to":"catalog","label":"カタログ・スキーマ解決","evidence":[{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§1"}]}
  - {"id":"grant","from":"catalog","to":"managed","label":"テーブル利用権限を評価","evidence":[{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§2"}]}
  - {"id":"policy","from":"managed","to":"masked","label":"行・列の制御を適用","evidence":[{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§2"}]}
  - {"id":"external","from":"catalog","to":"external","label":"外部テーブルのメタデータ","evidence":[{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§3"}]}
  - {"id":"register","from":"location","to":"external","label":"パスと資格情報を対応","evidence":[{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§3"}]}
  - {"id":"data","from":"external","to":"storage","label":"登録されたパスのデータを読む","evidence":[{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§3"}]}
  - {"id":"files","from":"managed","to":"storage","label":"ファイルのライフサイクルを管理","evidence":[{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§3"}]}
  - {"id":"record","from":"masked","to":"lineage","label":"対応する実行から依存関係を記録","evidence":[{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§4"}]}
scenarios:
  - id: access
    label: "本番ワークスペースで受注テーブルを参照"
    evidence: [{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§2"}]
    steps:
      - {"links":["binding","namespace"],"note":"本番カタログを許可されたワークスペースで解決する。"}
      - {"links":["grant","policy"],"note":"必要権限を満たす利用者に制御を適用した結果を返す。"}
      - {"links":["record"],"note":"捕捉対象のクエリから金額列の下流を調べる。"}
  - id: ownership
    label: "管理テーブルと外部テーブルの削除範囲を比較"
    evidence: [{"type":"doc","ref":"docs/reference-databricks-unity-catalog.md#§3"}]
    steps:
      - {"links":["external","register","data"],"note":"外部ロケーション経由で既存ファイルへの参照を登録する。"}
      - {"links":["files"],"note":"管理テーブルの削除時はファイルも回復期間を経るライフサイクルの対象となる。"}
      - {"links":["external","data"],"note":"外部テーブルを削除しても基盤ファイルの削除は外部で管理する。"}
