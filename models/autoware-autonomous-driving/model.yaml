name: Autoware の自動運転処理
description: センサー、自己位置推定、周辺認識、計画、制御と車両インターフェースを追う。
reference:
  objectives:
    - 観測・位置推定・認識・計画・制御の役割を区別する。
    - 地図と車両インターフェースの接続を追う。
    - 実車ごとの安全検証の必要性を理解する。
  sources:
    - title: Autoware module overview
      url: https://autowarefoundation.github.io/AWSIM-Labs/main/Introduction/Autoware/
    - title: Autoware Core
      url: https://autowarefoundation.github.io/autoware_core/main/
sources:
  - docs/reference-autoware-autonomous-driving.md
evidence:
  - type: doc
    ref: docs/reference-autoware-autonomous-driving.md#§1
  - type: doc
    ref: docs/reference-autoware-autonomous-driving.md#§3
tiers:
  - id: flow
    label: 認識から制御
    z: 1
    size:
      - 20
      - 3
  - id: support
    label: センサー・地図と車両
    z: 0
    size:
      - 20
      - 3
nodes:
  sense:
    label: センサーデータ取得
    kind: service
    tier: flow
    x: 0
    'y': 1.5
    description: LiDAR、カメラ、GNSS 等を前処理する。
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
  perception:
    label: 周辺の認識
    kind: service
    tier: flow
    x: 4
    'y': 1.5
    description: 物体や信号を認識する。
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
  planning:
    label: 走行軌道の計画
    kind: service
    tier: flow
    x: 8
    'y': 1.5
    description: 位置、認識、地図から軌道を計画する。
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
  control:
    label: 軌道追従の制御
    kind: service
    tier: flow
    x: 12
    'y': 1.5
    description: 軌道に従う指令を求める。
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
  interface:
    label: 車両インターフェース
    kind: service
    tier: flow
    x: 16
    'y': 1.5
    description: 車両固有の制御・状態に接続する。
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
  sensors:
    label: センサー
    kind: external
    tier: support
    x: 0
    'y': 1.5
    description: この例では実車のセンサーとし、接続方式は未選定。
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
  localization:
    label: 自己位置推定
    kind: service
    tier: support
    x: 4
    'y': 1.5
    description: センサーや地図から位置と姿勢を推定する。
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
  map:
    label: 地図
    kind: file
    tier: support
    x: 8
    'y': 1.5
    description: 地図は位置推定と計画の参照情報。
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
  vehicle:
    label: 車両・アクチュエーター
    kind: external
    tier: support
    x: 16
    'y': 1.5
    description: 実車への具体的接続は車両ごとに設計する。
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
links:
  - id: observe
    from: sensors
    to: sense
    label: センサー値を取得
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
  - id: perceive
    from: sense
    to: perception
    label: 前処理結果を渡す
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
  - id: localize
    from: sense
    to: localization
    label: 位置推定に観測を渡す
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
  - id: maploc
    from: map
    to: localization
    label: 地図を参照
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
  - id: mapplan
    from: map
    to: planning
    label: 交通規則・地図を参照
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
  - id: positions
    from: localization
    to: planning
    label: 自車位置を渡す
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
  - id: objects
    from: perception
    to: planning
    label: 周辺認識を渡す
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
  - id: trajectory
    from: planning
    to: control
    label: 軌道を渡す
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
  - id: command
    from: control
    to: interface
    label: 制御指令を送る
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
  - id: actuate
    from: interface
    to: vehicle
    label: 車両に指令
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
scenarios:
  - id: drive
    label: 観測から制御まで
    evidence:
      - type: doc
        ref: docs/reference-autoware-autonomous-driving.md#§2
    steps:
      - links:
          - observe
          - perceive
          - localize
          - maploc
        note: 観測を認識と自己位置推定に用いる。
      - links:
          - objects
          - positions
          - mapplan
          - trajectory
        note: 認識・位置・地図から軌道を計画する。
      - links:
          - command
          - actuate
        note: 車両インターフェース経由で制御指令を送る。
implementations:
  - id: example
    label: Autoware のモジュール構成例
    description: Autoware の説明に基づく機能例。実際のセンサー、車両固有インターフェースとアルゴリズムは環境ごとに異なる。
    sources:
      - title: Autoware module overview
        url: https://autowarefoundation.github.io/AWSIM-Labs/main/Introduction/Autoware/
      - title: Autoware Core
        url: https://autowarefoundation.github.io/autoware_core/main/
    tiers:
      - id: flow
        label: 認識から制御
        z: 1
        size:
          - 20
          - 3
      - id: support
        label: センサー・地図と車両
        z: 0
        size:
          - 20
          - 3
    nodes:
      ex-host: {label: 車載計算機（具体機種未選定）, kind: host, tier: flow, x: 2, y: 2, description: Autoware を実行する車載計算機。具体的な機器と接続は未選定。, evidence: [{type: doc, ref: docs/reference-autoware-autonomous-driving.md#§4}]}
      ex-sense:
        label: Autoware Sensing
        kind: service
        tier: flow
        x: 0
        'y': 1.5
        description: LiDAR、カメラ、GNSS 等を前処理する。
        realizes:
          - sense
        evidence:
          - type: doc
            ref: docs/reference-autoware-autonomous-driving.md#§4
      ex-perception:
        label: Autoware Perception
        kind: service
        tier: flow
        x: 4
        'y': 1.5
        description: 物体や信号を認識する。
        realizes:
          - perception
        evidence:
          - type: doc
            ref: docs/reference-autoware-autonomous-driving.md#§4
      ex-planning:
        label: Autoware Planning
        kind: service
        tier: flow
        x: 8
        'y': 1.5
        description: 位置、認識、地図から軌道を計画する。
        realizes:
          - planning
        evidence:
          - type: doc
            ref: docs/reference-autoware-autonomous-driving.md#§4
      ex-control:
        label: Autoware Control
        kind: service
        tier: flow
        x: 12
        'y': 1.5
        description: 軌道に従う指令を求める。
        realizes:
          - control
        evidence:
          - type: doc
            ref: docs/reference-autoware-autonomous-driving.md#§4
      ex-interface:
        label: Autoware Vehicle Interface
        kind: service
        tier: flow
        x: 16
        'y': 1.5
        description: 車両固有の制御・状態に接続する。
        realizes:
          - interface
        evidence:
          - type: doc
            ref: docs/reference-autoware-autonomous-driving.md#§4
      ex-sensors:
        label: LiDAR・カメラ・GNSS / IMU
        kind: external
        tier: support
        x: 0
        'y': 1.5
        description: センサーは実車またはシミュレーターから入力される。
        realizes:
          - sensors
        evidence:
          - type: doc
            ref: docs/reference-autoware-autonomous-driving.md#§4
      ex-localization:
        label: Autoware Localization
        kind: service
        tier: support
        x: 4
        'y': 1.5
        description: センサーや地図から位置と姿勢を推定する。
        realizes:
          - localization
        evidence:
          - type: doc
            ref: docs/reference-autoware-autonomous-driving.md#§4
      ex-map:
        label: Autoware 地図
        kind: file
        tier: support
        x: 8
        'y': 1.5
        description: 地図は位置推定と計画の参照情報。
        realizes:
          - map
        evidence:
          - type: doc
            ref: docs/reference-autoware-autonomous-driving.md#§4
      ex-vehicle:
        label: 車両の制御対象
        kind: external
        tier: support
        x: 16
        'y': 1.5
        description: 実車への具体的接続は車両ごとに設計する。
        realizes:
          - vehicle
        evidence:
          - type: doc
            ref: docs/reference-autoware-autonomous-driving.md#§4
    links:
      - {id: ex-host-sense, from: ex-host, to: ex-sense, label: Autoware を実行, evidence: [{type: doc, ref: docs/reference-autoware-autonomous-driving.md#§4}]}

    layout2d:
      tiers: [{id: diagram, label: 実装構成, z: 0, size: [25, 16]}]
      nodes:
        ex-host: {tier: diagram, x: 1, y: 1}
        ex-sense: {tier: diagram, x: 4, y: 1}
        ex-perception: {tier: diagram, x: 7, y: 1}
        ex-localization: {tier: diagram, x: 1, y: 4}
        ex-planning: {tier: diagram, x: 4, y: 4}
        ex-control: {tier: diagram, x: 7, y: 4}
        ex-interface: {tier: diagram, x: 1, y: 7}
        ex-map: {tier: diagram, x: 4, y: 7}
        ex-sensors: {tier: diagram, x: 13, y: 1}
        ex-vehicle: {tier: diagram, x: 16, y: 1}
      groups:
        - {kind: datacenter, label: 車載計算機, tier: [diagram], x0: -1, y0: 0, x1: 10, y1: 14, nodes: [ex-host, ex-sense, ex-perception, ex-localization, ex-planning, ex-control, ex-interface, ex-map]}
        - {kind: datacenter, label: 車両センサー・制御対象, tier: [diagram], x0: 11, y0: 0, x1: 22, y1: 8, nodes: [ex-sensors, ex-vehicle]}
    layout3d:
      tiers:
        - {id: hosta, label: 実行ホスト, z: 0, size: [10, 12]}
        - {id: appsa, label: ホスト上の処理, z: 1, size: [10, 12]}
        - {id: hostb, label: 対向ホスト・機器, z: 0, origin: [13, 0], size: [10, 8]}
        - {id: appsb, label: 対向ホスト上の処理, z: 1, origin: [13, 0], size: [10, 8]}
        - {id: network, label: 論理通信・設定, z: 0, origin: [26, 0], size: [8, 4]}
      nodes:
        ex-host: {tier: hosta, x: 1, y: 1}
        ex-sense: {tier: appsa, x: 4, y: 1}
        ex-perception: {tier: appsa, x: 7, y: 1}
        ex-localization: {tier: appsa, x: 1, y: 4}
        ex-planning: {tier: appsa, x: 4, y: 4}
        ex-control: {tier: appsa, x: 7, y: 4}
        ex-interface: {tier: appsa, x: 1, y: 7}
        ex-map: {tier: appsa, x: 4, y: 7}
        ex-sensors: {tier: hostb, x: 1, y: 1}
        ex-vehicle: {tier: hostb, x: 4, y: 1}
      groups:
        - {kind: datacenter, label: 車載計算機, tier: [hosta, appsa], nodes: [ex-host, ex-sense, ex-perception, ex-localization, ex-planning, ex-control, ex-interface, ex-map]}
        - {kind: datacenter, label: 車両センサー・制御対象, tier: [hostb, appsb], nodes: [ex-sensors, ex-vehicle]}

  - id: awsim-labs-e2e
    label: "Ubuntu ワークステーション：Autoware・AWSIM Labs"
    description: "同一 GPU ワークステーションで AWSIM Labs と Autoware を別プロセスで実行し、ROS 2 Humble のループバック通信で仮想車両を制御する例。"
    sources:
      - {title: "AWSIM Labs Quick Start Demo", url: https://autowarefoundation.github.io/AWSIM-Labs/main/GettingStarted/QuickStartDemo/}
      - {title: "AWSIM Labs architecture", url: https://autowarefoundation.github.io/AWSIM-Labs/main/Introduction/AWSIM/}
      - {title: "Autoware module overview", url: https://autowarefoundation.github.io/AWSIM-Labs/main/Introduction/Autoware/}
    tiers:
      - {id: sim, label: "AWSIM Labs シミュレーター", z: 2, size: [20, 4]}
      - {id: auto, label: "Autoware / ROS 2 Humble", z: 1, size: [20, 4]}
      - {id: data, label: "実行環境と地図", z: 0, size: [20, 4]}
    groups:
      - {kind: datacenter, label: "Ubuntu 22.04 / NVIDIA GPU ワークステーション", provider: onprem, tier: [sim, auto, data], nodes: [awsim-demo-sensors, awsim-demo-vehicle, awsim-demo-sense, awsim-demo-perception, awsim-demo-localization, awsim-demo-planning, awsim-demo-control, awsim-demo-interface, awsim-demo-map, awsim-demo-dds, awsim-demo-host]}
    nodes:
      awsim-demo-sensors: {label: "AWSIM 仮想センサー", kind: external, tier: sim, x: 4, y: 1.5, realizes: [sensors], description: "仮想の GNSS・IMU、LiDAR と信号機カメラのセンサーデータを生成する。", evidence: [{type: doc, ref: "docs/reference-autoware-autonomous-driving.md#§5"}]}
      awsim-demo-vehicle: {label: "AWSIM 仮想 Lexus RX 450h", kind: external, tier: sim, x: 16, y: 1.5, realizes: [vehicle], description: "シミュレーター内の車両モデルが指令を受け、物理状態を更新する。", evidence: [{type: doc, ref: "docs/reference-autoware-autonomous-driving.md#§5"}]}
      awsim-demo-sense: {label: "Autoware Sensing", kind: worker, tier: auto, x: 2, y: 1.5, realizes: [sense], description: "AWSIM Labs のセンサーキット用トピックから仮想観測値を受け取る。", evidence: [{type: doc, ref: "docs/reference-autoware-autonomous-driving.md#§5"}]}
      awsim-demo-perception: {label: "Autoware Perception", kind: worker, tier: auto, x: 5.5, y: 0.8, realizes: [perception], description: "仮想環境を観測したセンサーデータから対象物を認識する。", evidence: [{type: doc, ref: "docs/reference-autoware-autonomous-driving.md#§5"}]}
      awsim-demo-localization: {label: "Autoware Localization", kind: worker, tier: auto, x: 5.5, y: 2.7, realizes: [localization], description: "仮想センサーとデモの地図で自己位置を推定する。", evidence: [{type: doc, ref: "docs/reference-autoware-autonomous-driving.md#§5"}]}
      awsim-demo-planning: {label: "Autoware Planning", kind: worker, tier: auto, x: 9.5, y: 1.5, realizes: [planning], description: "経路・周辺物体・自己位置から軌道を生成する。", evidence: [{type: doc, ref: "docs/reference-autoware-autonomous-driving.md#§5"}]}
      awsim-demo-control: {label: "Autoware Control", kind: worker, tier: auto, x: 13, y: 1.5, realizes: [control], description: "仮想車両が軌道を追従するための制御指令を計算する。", evidence: [{type: doc, ref: "docs/reference-autoware-autonomous-driving.md#§5"}]}
      awsim-demo-interface: {label: "AWSIM 用 Vehicle Interface", kind: gateway, tier: auto, x: 17, y: 1.5, realizes: [interface], description: "AWSIM Labs 用の車両モデルに合わせた ROS 2 インターフェースで制御指令を届ける。", evidence: [{type: doc, ref: "docs/reference-autoware-autonomous-driving.md#§5"}]}
      awsim-demo-map: {label: "西新宿デモ地図 / PCD・OSM", kind: file, tier: data, x: 4, y: 1.5, realizes: [map], description: "シミュレーションに合わせた点群地図と Lanelet2 地図。", evidence: [{type: doc, ref: "docs/reference-autoware-autonomous-driving.md#§5"}]}
      awsim-demo-dds: {label: "Cyclone DDS / ループバック", kind: service, tier: data, x: 10, y: 1.5, description: "ROS 2 アプリ同士の通信を同一ホストの lo に限定する設定。", evidence: [{type: doc, ref: "docs/reference-autoware-autonomous-driving.md#§5"}]}
      awsim-demo-host: {label: "Ubuntu / NVIDIA GPU・Vulkan", kind: host, tier: data, x: 16, y: 1.5, description: "AWSIM のレンダリングと Autoware の実行に使うデモ用ホスト。", evidence: [{type: doc, ref: "docs/reference-autoware-autonomous-driving.md#§5"}]}
    links:
      - {id: awsim-demo-setup-dds, from: awsim-demo-dds, to: awsim-demo-sense, label: "観測値の受信にループバックを選択", evidence: [{type: doc, ref: "docs/reference-autoware-autonomous-driving.md#§5"}]}
      - {id: awsim-demo-control-dds, from: awsim-demo-dds, to: awsim-demo-interface, label: "制御指令の送信にループバックを選択", evidence: [{type: doc, ref: "docs/reference-autoware-autonomous-driving.md#§5"}]}
      - {id: awsim-demo-host-sim, from: awsim-demo-host, to: awsim-demo-vehicle, label: "GPU 上でシミュレーターを実行", evidence: [{type: doc, ref: "docs/reference-autoware-autonomous-driving.md#§5"}]}

    layout2d:
      tiers: [{id: diagram, label: 実装構成, z: 0, size: [25, 16]}]
      nodes:
        awsim-demo-host: {tier: diagram, x: 1, y: 1}
        awsim-demo-sensors: {tier: diagram, x: 4, y: 1}
        awsim-demo-vehicle: {tier: diagram, x: 7, y: 1}
        awsim-demo-sense: {tier: diagram, x: 1, y: 4}
        awsim-demo-perception: {tier: diagram, x: 4, y: 4}
        awsim-demo-localization: {tier: diagram, x: 7, y: 4}
        awsim-demo-planning: {tier: diagram, x: 1, y: 7}
        awsim-demo-control: {tier: diagram, x: 4, y: 7}
        awsim-demo-interface: {tier: diagram, x: 7, y: 7}
        awsim-demo-map: {tier: diagram, x: 1, y: 10}
        awsim-demo-dds: {tier: diagram, x: 4, y: 10}
      groups:
        - {kind: datacenter, label: Ubuntu GPU ワークステーション, tier: [diagram], x0: -1, y0: 0, x1: 10, y1: 14, nodes: [awsim-demo-host, awsim-demo-sensors, awsim-demo-vehicle, awsim-demo-sense, awsim-demo-perception, awsim-demo-localization, awsim-demo-planning, awsim-demo-control, awsim-demo-interface, awsim-demo-map, awsim-demo-dds]}
    layout3d:
      tiers:
        - {id: hosta, label: 実行ホスト, z: 0, size: [10, 12]}
        - {id: appsa, label: ホスト上の処理, z: 1, size: [10, 12]}
        - {id: hostb, label: 対向ホスト・機器, z: 0, origin: [13, 0], size: [10, 8]}
        - {id: appsb, label: 対向ホスト上の処理, z: 1, origin: [13, 0], size: [10, 8]}
        - {id: network, label: 論理通信・設定, z: 0, origin: [26, 0], size: [8, 4]}
      nodes:
        awsim-demo-host: {tier: hosta, x: 1, y: 1}
        awsim-demo-sensors: {tier: appsa, x: 4, y: 1}
        awsim-demo-vehicle: {tier: appsa, x: 7, y: 1}
        awsim-demo-sense: {tier: appsa, x: 1, y: 4}
        awsim-demo-perception: {tier: appsa, x: 4, y: 4}
        awsim-demo-localization: {tier: appsa, x: 7, y: 4}
        awsim-demo-planning: {tier: appsa, x: 1, y: 7}
        awsim-demo-control: {tier: appsa, x: 4, y: 7}
        awsim-demo-interface: {tier: appsa, x: 7, y: 7}
        awsim-demo-map: {tier: appsa, x: 1, y: 10}
        awsim-demo-dds: {tier: appsa, x: 4, y: 10}
      groups:
        - {kind: datacenter, label: Ubuntu GPU ワークステーション, tier: [hosta, appsa], nodes: [awsim-demo-host, awsim-demo-sensors, awsim-demo-vehicle, awsim-demo-sense, awsim-demo-perception, awsim-demo-localization, awsim-demo-planning, awsim-demo-control, awsim-demo-interface, awsim-demo-map, awsim-demo-dds]}
