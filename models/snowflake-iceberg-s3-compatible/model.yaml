        svc: snowflake:horizon
      ex-translate:
        label: Horizon のストレージ解決
        kind: service
        tier: process
        x: 5.2
        'y': 1.5
        description: 内部のストレージ種別からクライアントが解釈できるアクセス形式を決める。
        evidence:
          - type: doc
            ref: docs/reference-snowflake-iceberg-s3-compatible.md#§5
        realizes:
          - translate
      ex-credentials:
        label: カタログのアクセス制御
        kind: service
        tier: process
        x: 10.4
        'y': 1.5
        description: 対応する環境では一時的なアクセス情報を使い、外部エンジンのアクセスを管理する。
        evidence:
          - type: doc
            ref: docs/reference-snowflake-iceberg-s3-compatible.md#§5
        realizes:
          - credentials
      ex-metadata:
        label: S3 互換の Iceberg メタデータ
        kind: file
        tier: data
        x: 0
        'y': 1.5
        description: 外部エンジンが解釈可能な s3:// 形式のパスでメタデータを参照する。
        evidence:
          - type: doc
            ref: docs/reference-snowflake-iceberg-s3-compatible.md#§5
        realizes:
