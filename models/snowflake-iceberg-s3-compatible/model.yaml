name: Snowflake Horizon Catalog：S3 互換ストレージと Iceberg
description: S3 互換ストレージ上の Iceberg テーブルを外部エンジンへ公開する際のパスと認証を追う。
parent:
  model: snowflake-horizon-catalog
  node: orders
reference:
  objectives:
    - S3 互換ストレージ上の Iceberg テーブルを外部エンジンへ公開する際のパスと認証を追う。
    - 外部エンジンからの要求に対してカタログが権限と保存場所を解決する。
    - 互換パスとアクセス情報を使い、メタデータとデータを参照する。
  sources:
    - title: S3 互換ストレージと Horizon Catalog
      url: https://www.snowflake.com/en/blog/engineering/s3-compatible-storage-iceberg-horizon-catalog/
    - title: Iceberg REST カタログと外部エンジン
      url: https://docs.snowflake.com/en/user-guide/tables-iceberg-access-using-external-query-engine-snowflake-horizon
sources:
  - docs/reference-snowflake-iceberg-s3-compatible.md
evidence:
  - type: doc
    ref: docs/reference-snowflake-iceberg-s3-compatible.md#§1
  - type: doc
    ref: docs/reference-snowflake-iceberg-s3-compatible.md#§4
tiers:
  - id: input
    label: 外部エンジン
    z: 3
    size:
      - 23
      - 4
  - id: process
    label: カタログとアクセス判定
    z: 2
    size:
      - 23
      - 4
  - id: compute
    label: メタデータの更新
    z: 1
    size:
      - 23
      - 4
  - id: data
    label: S3 互換ストレージ
    z: 0
    size:
      - 23
      - 4
nodes:
  client:
    label: 外部エンジン
    kind: client
    tier: input
    x: 0
    'y': 1.5
    description: Iceberg REST API 対応エンジンが表へのアクセスを要求する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-iceberg-s3-compatible.md#§2
  horizon:
    label: カタログとアクセス判定
    kind: service
    tier: process
    x: 0
    'y': 1.5
    description: 表の登録情報と権限を確認し、エンジンへ提供する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-iceberg-s3-compatible.md#§2
  translate:
    label: ストレージ位置の解決
    kind: service
    tier: process
    x: 5.2
    'y': 1.5
    description: 内部のストレージ種別からクライアントが解釈できるアクセス形式を決める。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-iceberg-s3-compatible.md#§2
  credentials:
    label: アクセスの許可
    kind: service
    tier: process
    x: 10.4
    'y': 1.5
    description: 対応する環境では一時的なアクセス情報を使い、外部エンジンのアクセスを管理する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-iceberg-s3-compatible.md#§2
  metadata:
    label: Iceberg メタデータ
    kind: file
    tier: data
    x: 0
    'y': 1.5
    description: 外部エンジンが解釈可能な s3:// 形式のパスでメタデータを参照する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-iceberg-s3-compatible.md#§2
  files:
    label: Iceberg データ
    kind: db
    tier: data
    x: 5.2
    'y': 1.5
    description: S3 互換ストレージの実データを対象エンジンが取得する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-iceberg-s3-compatible.md#§2
  migration:
    label: 既存メタデータの更新
    kind: worker
    tier: compute
    x: 0
    'y': 1.5
    description: 古い内部形式で記載された表では既存メタデータの更新が必要になる場合がある。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-iceberg-s3-compatible.md#§2
links:
  - id: request
    from: client
    to: horizon
    label: 表へのアクセスを要求
    evidence:
      - type: doc
        ref: docs/reference-snowflake-iceberg-s3-compatible.md#§2
  - id: resolve
    from: horizon
    to: translate
    label: ストレージ位置を解決
    evidence:
      - type: doc
        ref: docs/reference-snowflake-iceberg-s3-compatible.md#§2
  - id: auth
    from: horizon
    to: credentials
    label: 権限を確認
    evidence:
      - type: doc
        ref: docs/reference-snowflake-iceberg-s3-compatible.md#§2
  - id: return
    from: translate
    to: client
    label: 互換パスを返す
    evidence:
      - type: doc
        ref: docs/reference-snowflake-iceberg-s3-compatible.md#§2
  - id: access
    from: credentials
    to: client
    label: アクセス情報を返す
    evidence:
      - type: doc
        ref: docs/reference-snowflake-iceberg-s3-compatible.md#§2
  - id: meta
    from: client
    to: metadata
    label: Iceberg メタデータを読む
    evidence:
      - type: doc
        ref: docs/reference-snowflake-iceberg-s3-compatible.md#§2
  - id: read
    from: client
    to: files
    label: 対象データを読む
    evidence:
      - type: doc
        ref: docs/reference-snowflake-iceberg-s3-compatible.md#§2
  - id: update
    from: migration
    to: metadata
    label: 既存メタデータを更新
    evidence:
      - type: doc
        ref: docs/reference-snowflake-iceberg-s3-compatible.md#§2
scenarios:
  - id: flow
    label: データと処理の流れ
    evidence:
      - type: doc
        ref: docs/reference-snowflake-iceberg-s3-compatible.md#§3
    steps:
      - links:
          - request
          - resolve
          - auth
        note: 外部エンジンからの要求に対してカタログが権限と保存場所を解決する。
      - links:
          - return
          - access
          - meta
          - read
        note: 互換パスとアクセス情報を使い、メタデータとデータを参照する。
      - links:
          - update
        note: 既存の一部テーブルには別途メタデータの更新が必要になる。
unknowns:
  - id: internal-deployment
    description: 公開されていない内部配置・閾値は特定できない。
implementations:
  - id: snowflake
    label: Snowflake の実装例
    description: >-
      S3 互換ストレージに置かれた Snowflake Horizon 管理 Iceberg
      テーブルを互換外部エンジンから利用する記事の構成例。記事時点ではプレビューであり、必要なエンドポイント・アクセス制御と利用条件を確認する。S3 互換ストレージの実際の提供元やネットワークは指定しない。
    sources:
      - title: S3 互換ストレージと Horizon Catalog
        url: https://www.snowflake.com/en/blog/engineering/s3-compatible-storage-iceberg-horizon-catalog/
      - title: Iceberg REST カタログと外部エンジン
        url: https://docs.snowflake.com/en/user-guide/tables-iceberg-access-using-external-query-engine-snowflake-horizon
    tiers:
      - id: input
        label: 外部エンジン
        z: 3
        size:
          - 23
          - 4
      - id: process
        label: カタログとアクセス判定
        z: 2
        size:
          - 23
          - 4
      - id: compute
        label: メタデータの更新
        z: 1
        size:
          - 23
          - 4
      - id: data
        label: S3 互換ストレージ
        z: 0
        size:
          - 23
          - 4
    nodes:
      ex-client:
        label: Spark / Trino 等の外部エンジン
        kind: client
        tier: input
        x: 0
        'y': 1.5
        description: Iceberg REST API 対応エンジンが表へのアクセスを要求する。
        evidence:
          - type: doc
            ref: docs/reference-snowflake-iceberg-s3-compatible.md#§5
        realizes:
