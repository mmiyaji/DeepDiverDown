blocks:
  - id: rows
    title: ファイルと無効行（概念例）
    note: 行番号は説明用。更新後も元ファイルは保持され、読み取り時に無効行を除外する。
    lanes:
      - id: old
        label: 元ファイル
        node: original
      - id: deleted
        label: 削除ベクトル
        node: dv
      - id: added
        label: 更新後の行
        node: newrows
      - id: meta
        label: 表の状態
        node: log
    items:
      old:
        - id: row1
          label: 行 0
          k: 0
          note: 読み取る行。
        - id: row2
          label: 行 1
          k: 1
          note: 変更対象の元の行。
        - id: row3
          label: 行 2
          k: 0
          note: 読み取る行。
      deleted:
        - id: deleted1
          label: 行 1 を無効化
          k: 1
          note: 該当行は論理的に除外される。
      added:
        - id: new1
          label: 変更後の行
          k: 2
          note: UPDATE の場合の例。
      meta:
        - id: version
          label: 有効ファイルと DV
          k: 3
          note: Delta ログでスナップショットを構成する。
