            - 15
      nodes:
        ex-query:
          tier: diagram
          x: 1
          'y': 3
        ex-catalog:
          tier: diagram
          x: 9.5
          'y': 5
        ex-builder:
          tier: diagram
          x: 16
          'y': 5
        ex-metadata:
          tier: diagram
          x: 29.5
          'y': 5
        ex-reader:
          tier: diagram
          x: 9.5
          'y': 10
        ex-writer:
          tier: diagram
          x: 16
