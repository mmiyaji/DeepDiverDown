        ex-files:
          tier: storage
          x: 4
          'y': 6
        ex-cluster:
          tier: hosts
          x: 8
          'y': 3
      groups:
        - kind: datacenter
          label: 自前のサーバー群
          provider: onprem
          tier: [hosts, process, storage]
          nodes: [ex-catalog, ex-builder, ex-metadata, ex-reader, ex-writer, ex-commit, ex-files, ex-cluster]
