name: Spark：Data Source V2 と Iceberg の読み書き
description: Spark とテーブルコネクターが pushdown、入力分割、書き込みと commit を調整する。
reference:
  objectives:
    - Spark とテーブルコネクターが pushdown、入力分割、書き込みと commit を調整する。
    - Data Source V2 は connector が実装する能力だけ利用できる。
    - Iceberg の write.distribution-mode は none / hash / range があり、実際の利用可能性や既定値はバージョンと設定を確認する。
  sources:
    - title: Spark Data Source V2
      url: https://spark.apache.org/docs/4.3.0/sql-v2-data-sources.html
    - title: Iceberg Spark Writes
      url: https://iceberg.apache.org/docs/latest/spark-writes/
    - title: Iceberg Spark Queries
      url: https://iceberg.apache.org/docs/latest/spark-queries/
sources:
  - docs/reference-spark-datasource-v2-iceberg.md
evidence:
  - type: doc
    ref: docs/reference-spark-datasource-v2-iceberg.md#§1
tiers:
  - id: flow
    label: 処理の流れ
    z: 0
    size:
      - 21
      - 8
nodes:
  query:
    label: SQL / DataFrame
    kind: client
    tier: flow
    x: 1
    'y': 1.5
    description: 列・条件・テーブルを指定する。
    evidence:
      - type: doc
        ref: docs/reference-spark-datasource-v2-iceberg.md#§2
  catalog:
    label: Catalog / Table
    kind: service
    tier: flow
    x: 6
    'y': 1.5
    description: テーブルを解決し connector の capability を Spark に公開する。
    evidence:
      - type: doc
        ref: docs/reference-spark-datasource-v2-iceberg.md#§2
  builder:
    label: ScanBuilder の交渉
    kind: service
    tier: flow
    x: 11
    'y': 1.5
    description: connector が受理した filter と必要列を計画し、残りは Spark が評価する。
    evidence:
      - type: doc
        ref: docs/reference-spark-datasource-v2-iceberg.md#§2
  metadata:
    label: Iceberg メタデータ
    kind: db
    tier: flow
    x: 16
    'y': 1.5
    description: snapshot と manifest から対象ファイルの候補を計画する。
    evidence:
      - type: doc
        ref: docs/reference-spark-datasource-v2-iceberg.md#§2
  reader:
    label: InputPartition と Reader
    kind: worker
    tier: flow
    x: 1
    'y': 5
    description: 入力分割ごとに task が Parquet 等を読む。
    evidence:
      - type: doc
        ref: docs/reference-spark-datasource-v2-iceberg.md#§2
  writer:
    label: Task の DataWriter
    kind: worker
    tier: flow
    x: 6
    'y': 5
    description: 各 task がデータファイルを書き、commit message を Driver に返す。
    evidence:
      - type: doc
        ref: docs/reference-spark-datasource-v2-iceberg.md#§2
  commit:
    label: Driver の BatchWrite commit
    kind: service
    tier: flow
    x: 11
    'y': 5
    description: 成功した task の commit message を集約し connector が表の更新を commit する。
    evidence:
      - type: doc
        ref: docs/reference-spark-datasource-v2-iceberg.md#§2
  files:
    label: データファイル
    kind: db
    tier: flow
    x: 16
    'y': 5
    description: データファイルの所在と最新 snapshot は分けて管理される。
    evidence:
      - type: doc
        ref: docs/reference-spark-datasource-v2-iceberg.md#§2
links:
  - id: resolve
    from: query
    to: catalog
    label: テーブルを解決
    evidence:
      - type: doc
        ref: docs/reference-spark-datasource-v2-iceberg.md#§3
  - id: build
    from: catalog
    to: builder
    label: scan を構築
    evidence:
      - type: doc
        ref: docs/reference-spark-datasource-v2-iceberg.md#§3
  - id: push
    from: query
    to: builder
    label: 列と条件を交渉
    evidence:
      - type: doc
        ref: docs/reference-spark-datasource-v2-iceberg.md#§3
  - id: manifest
    from: metadata
    to: builder
    label: snapshot と manifest を参照
    evidence:
      - type: doc
        ref: docs/reference-spark-datasource-v2-iceberg.md#§3
  - id: partitions
    from: builder
    to: reader
    label: 入力分割を作成
    evidence:
      - type: doc
        ref: docs/reference-spark-datasource-v2-iceberg.md#§3
  - id: read
    from: files
    to: reader
    label: 必要なファイルを読む
    evidence:
      - type: doc
        ref: docs/reference-spark-datasource-v2-iceberg.md#§3
  - id: write
    from: reader
    to: writer
    label: 変換結果を書き込む
    evidence:
      - type: doc
        ref: docs/reference-spark-datasource-v2-iceberg.md#§3
  - id: persist
    from: writer
    to: files
    label: データファイルを保存
    evidence:
      - type: doc
        ref: docs/reference-spark-datasource-v2-iceberg.md#§3
  - id: messages
    from: writer
    to: commit
    label: task commit を報告
    evidence:
      - type: doc
        ref: docs/reference-spark-datasource-v2-iceberg.md#§3
  - id: commit
    from: commit
    to: metadata
    label: 表の更新を commit
    evidence:
      - type: doc
        ref: docs/reference-spark-datasource-v2-iceberg.md#§3
scenarios:
  - id: flow
    label: 処理の流れ
    steps:
      - links:
          - resolve
        note: テーブルを解決。
      - links:
          - build
        note: scan を構築。
      - links:
          - push
        note: 列と条件を交渉。
      - links:
          - manifest
        note: snapshot と manifest を参照。
      - links:
          - partitions
        note: 入力分割を作成。
      - links:
          - read
        note: 必要なファイルを読む。
      - links:
          - write
        note: 変換結果を書き込む。
      - links:
          - persist
        note: データファイルを保存。
      - links:
          - messages
        note: task commit を報告。
      - links:
          - commit
        note: 表の更新を commit。
implementations:
  - id: spark-standalone
    label: 自己管理 Spark Standalone の代表構成
    description: Spark Standalone のホスト、Driver、Executor と入力・出力を使う概念的な代表例。製品・プラグイン・バージョンの互換性および実機動作は別途確認する。
    sources:
      - title: Spark Data Source V2
        url: https://spark.apache.org/docs/4.3.0/sql-v2-data-sources.html
      - title: Iceberg Spark Writes
        url: https://iceberg.apache.org/docs/latest/spark-writes/
      - title: Spark Standalone Mode
        url: https://spark.apache.org/docs/4.3.0/spark-standalone.html
    tiers:
      - id: runtime
        label: 自己管理環境
        z: 0
        size:
          - 24
          - 11
    groups:
      - kind: datacenter
        label: 自前のサーバー群
        provider: onprem
        tier: [runtime]
        nodes: [ex-catalog, ex-builder, ex-metadata, ex-reader, ex-writer, ex-commit, ex-files, ex-cluster]
      - kind: cluster
        label: Spark Standalone クラスター
        tier:
          - runtime
        nodes:
          - ex-cluster
          - ex-catalog
          - ex-builder
          - ex-reader
          - ex-writer
          - ex-commit
    nodes:
      ex-query:
        label: SQL / DataFrame
        kind: client
        tier: runtime
        x: 2
        'y': 2
        realizes:
          - query
        description: 列・条件・テーブルを指定する。
        evidence:
          - type: doc
            ref: docs/reference-spark-datasource-v2-iceberg.md#§4
      ex-catalog:
        label: Driver：Catalog / Table
        kind: service
        tier: runtime
        x: 7
        'y': 2
        realizes:
          - catalog
        description: テーブルを解決し connector の capability を Spark に公開する。
        evidence:
          - type: doc
            ref: docs/reference-spark-datasource-v2-iceberg.md#§4
      ex-builder:
        label: Driver：ScanBuilder の交渉
        kind: service
        tier: runtime
        x: 12
        'y': 2
        realizes:
          - builder
        description: connector が受理した filter と必要列を計画し、残りは Spark が評価する。
        evidence:
          - type: doc
            ref: docs/reference-spark-datasource-v2-iceberg.md#§4
      ex-metadata:
        label: Iceberg メタデータ
        kind: db
        tier: runtime
        x: 17
        'y': 2
        realizes:
          - metadata
        description: snapshot と manifest から対象ファイルの候補を計画する。
        evidence:
          - type: doc
            ref: docs/reference-spark-datasource-v2-iceberg.md#§4
      ex-reader:
        label: Executor：InputPartition と Reader
        kind: worker
        tier: runtime
        x: 2
        'y': 6
        realizes:
          - reader
        description: 入力分割ごとに task が Parquet 等を読む。
        evidence:
          - type: doc
            ref: docs/reference-spark-datasource-v2-iceberg.md#§4
      ex-writer:
        label: Executor：Task の DataWriter
        kind: worker
        tier: runtime
        x: 7
        'y': 6
        realizes:
          - writer
        description: 各 task がデータファイルを書き、commit message を Driver に返す。
        evidence:
          - type: doc
            ref: docs/reference-spark-datasource-v2-iceberg.md#§4
      ex-commit:
        label: Driver：Driver の BatchWrite commit
        kind: service
        tier: runtime
        x: 12
        'y': 6
        realizes:
          - commit
        description: 成功した task の commit message を集約し connector が表の更新を commit する。
        evidence:
          - type: doc
            ref: docs/reference-spark-datasource-v2-iceberg.md#§4
      ex-files:
        label: データファイル
        kind: db
        tier: runtime
        x: 17
        'y': 6
        realizes:
          - files
        description: データファイルの所在と最新 snapshot は分けて管理される。
        evidence:
          - type: doc
            ref: docs/reference-spark-datasource-v2-iceberg.md#§4
      ex-cluster:
        label: Spark Standalone の Master / Worker
        kind: host
        tier: runtime
        x: 2
        'y': 9
        description: 自己管理するホスト上で Spark Standalone クラスターの資源を管理し Driver と Executor を動かす。
        evidence:
          - type: doc
            ref: docs/reference-spark-datasource-v2-iceberg.md#§4
    links:
      - id: ex-start
        from: ex-cluster
        to: ex-reader
        label: Executor の実行資源を割り当て
    layout2d:
      tiers:
        - id: diagram
          label: 自己管理環境
          z: 0
          size:
