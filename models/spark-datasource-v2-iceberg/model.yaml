    layout3d:
      tiers:
        - {id: access, label: SQL クライアント, kind: origin, z: 0, origin: [-8, 0], size: [4, 8]}
        - id: hosts
          label: Spark ホストと Worker
          z: 0
          size:
            - 17
            - 8
        - id: process
          label: Driver / Executor の実行
          z: 1
