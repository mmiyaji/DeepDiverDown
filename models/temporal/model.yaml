name: "Temporal のワーカー障害とリプレイ"
description: "注文 Workflow の Worker が停止したときの履歴からの再開と、外部決済を伴う Activity の冪等な再試行を追います。"
reference:
  objectives:
    - "Workflow Task と Activity Task の役割を区別する。"
    - "Worker 停止後に Event History から Workflow の状態を復元する流れを追う。"
    - "外部副作用が発生した後に Activity を再試行できる条件を理解する。"
  sources:
    - {title: "Temporal Event History", url: "https://docs.temporal.io/encyclopedia/event-history"}
    - {title: "Temporal Workflow Definition", url: "https://docs.temporal.io/workflow-definition"}
    - {title: "Temporal Activity Definition", url: "https://docs.temporal.io/activity-definition"}
    - {title: "Temporal Retry Policy", url: "https://docs.temporal.io/encyclopedia/retry-policies"}
    - {title: "Understanding Temporal", url: "https://docs.temporal.io/evaluate/understanding-temporal"}
sources: [docs/reference-temporal.md]
evidence: [{type: doc, ref: "docs/reference-temporal.md#§1"}]
tiers:
  - {id: "entry", label: "注文受付", z: 3, size: [16,4], kind: "origin"}
  - {id: "service", label: "実行制御と永続化", z: 2, size: [16,4]}
  - {id: "worker", label: "実行 Worker", z: 1, size: [16,4]}
  - {id: "outside", label: "副作用の記録先", z: 0, size: [16,4]}
nodes:
  order: {label: "注文 API", kind: "client", tier: "entry", x: 3, y: 1.5, description: "注文を受け付け、注文 Workflow を開始する。", evidence: [{type: doc, ref: "docs/reference-temporal.md#§1"}]}
  service: {label: 実行履歴・タスクの制御, kind: workflow, tier: service, x: 2, 'y': 1.5, description: コマンドを受けタスク管理と Event History の永続化を行う。, evidence: [{type: doc, ref: docs/reference-temporal.md#§2}]}
  history: {label: 永続的な実行履歴, kind: db, tier: service, x: 7, 'y': 1.5, description: Workflow の進行をイベントとして保持する。, evidence: [{type: doc, ref: docs/reference-temporal.md#§2}]}
  queue: {label: ワークフロー・アクティビティの作業待ち行列, kind: queue, tier: service, x: 12, 'y': 1.5, description: Workflow Task と Activity Task の取得先を図上でまとめて示す。, evidence: [{type: doc, ref: docs/reference-temporal.md#§2}]}
  workflow-a: {label: 注文処理の実行担当 A, kind: worker, tier: worker, x: 2, 'y': 1.5, description: 注文 Workflow を最初に処理する Worker。, evidence: [{type: doc, ref: docs/reference-temporal.md#§3}]}
  workflow-b: {label: 注文処理の実行担当 B, kind: worker, tier: worker, x: 7, 'y': 1.5, description: A の停止後、履歴から Workflow の状態を再構築する。, evidence: [{type: doc, ref: docs/reference-temporal.md#§3}]}
  activity: {label: 決済処理の実行担当, kind: worker, tier: worker, x: 12, 'y': 1.5, description: 決済 API を呼び、Activity の完了を報告する。, evidence: [{type: doc, ref: docs/reference-temporal.md#§4}]}
  payment: {label: "外部決済 API", kind: "external", tier: "outside", x: 12, y: 1.5, description: "同一操作キーで既存の決済を再利用する架空の API。", evidence: [{type: doc, ref: "docs/reference-temporal.md#§5"}]}
links:
  - {id: "start", from: "order", to: "service", label: "注文 Workflow を開始", evidence: [{type: doc, ref: "docs/reference-temporal.md#§1"}]}
  - {id: "append", from: "service", to: "history", label: "イベントを永続化", evidence: [{type: doc, ref: "docs/reference-temporal.md#§2"}]}
  - {id: "schedule-task", from: "service", to: "queue", label: "Workflow / Activity Task を提供", evidence: [{type: doc, ref: "docs/reference-temporal.md#§2"}]}
  - {id: "run-a", from: "queue", to: "workflow-a", label: "Workflow Task を取得", evidence: [{type: doc, ref: "docs/reference-temporal.md#§3"}]}
  - {id: "decision-a", from: "workflow-a", to: "service", label: "Activity の予約などを報告", evidence: [{type: doc, ref: "docs/reference-temporal.md#§3"}]}
  - {id: "run-b", from: "queue", to: "workflow-b", label: "別 Worker が Workflow Task を取得", evidence: [{type: doc, ref: "docs/reference-temporal.md#§3"}]}
  - {id: "replay", from: "history", to: "workflow-b", label: "Task とともに受け取った履歴を再生", evidence: [{type: doc, ref: "docs/reference-temporal.md#§3"}]}
  - {id: "finish", from: "workflow-b", to: "service", label: "Workflow の結果を報告", evidence: [{type: doc, ref: "docs/reference-temporal.md#§3"}]}
  - {id: "run-activity", from: "queue", to: "activity", label: "Activity Task を取得", evidence: [{type: doc, ref: "docs/reference-temporal.md#§4"}]}
  - {id: "charge", from: "activity", to: "payment", label: "同一操作キーで決済を要求", evidence: [{type: doc, ref: "docs/reference-temporal.md#§5"}]}
  - {id: "complete", from: "activity", to: "service", label: "Activity の完了を報告", evidence: [{type: doc, ref: "docs/reference-temporal.md#§4"}]}
scenarios:
  - id: worker-replay
    label: "Workflow Worker の停止後に履歴から再開"
    evidence: [{type: doc, ref: "docs/reference-temporal.md#§2"}, {type: doc, ref: "docs/reference-temporal.md#§3"}, {type: doc, ref: "docs/reference-temporal.md#§4"}]
    visual: payment-record
    steps:
      - links: [start, append, schedule-task, run-a, decision-a]
        note: 注文 Workflow を開始する。Worker A が決済 Activity の予約を指示し、Temporal Service が履歴に記録する。
        blocks:
          history: &scheduled
            - &started {id: started, label: Workflow 開始, k: 0}
            - &payment-scheduled {id: payment-scheduled, label: 決済 Activity 予約, k: 0}
          payment: []
      - links: [run-activity, charge, complete, append]
        note: 決済 Activity が完了し、結果が Event History に記録される。Worker A は次の Workflow Task を処理する前に停止する。
        blocks:
          history: &completed
            - *started
            - *payment-scheduled
            - &payment-completed {id: payment-completed, label: 決済 Activity 完了, k: 0}
          payment: &charged
            - {id: charged, label: 決済を登録（1 件）, k: 3}
      - links: [run-b, replay, finish, append]
        note: Worker B が履歴に沿って Workflow コードを実行し、記録済みの決済結果を使って注文処理を完了する。リプレイで決済 API を再呼び出ししない。
        blocks:
          history:
            - *started
            - *payment-scheduled
            - *payment-completed
            - {id: workflow-completed, label: Workflow 完了, k: 0}
          payment: *charged
  - id: activity-retry
    label: "完了報告を失った決済 Activity を再試行"
    evidence: [{type: doc, ref: "docs/reference-temporal.md#§2"}, {type: doc, ref: "docs/reference-temporal.md#§4"}, {type: doc, ref: "docs/reference-temporal.md#§5"}]
    visual: payment-record
    steps:
      - links: [start, run-a, decision-a, append, schedule-task, run-activity]
        note: 注文 Workflow が決済 Activity を予約し、Activity Worker が処理を始める。
        blocks: {history: *scheduled, payment: []}
      - links: [charge]
        note: 外部決済が成功する。Activity Worker は Temporal Service に完了を報告する前に停止する。
        blocks: {history: *scheduled, payment: *charged}
      - links: [schedule-task, run-activity, charge, complete, append]
        note: Activity がタイムアウトし、設定した再試行条件を満たすため再実行される。同じ操作キーで決済 API を呼び、既存結果を得て完了を記録する。
        blocks: {history: *completed, payment: *charged}
blocks:
  id: payment-record
  title: 履歴に記録された結果と外部決済
  note: Workflow の代表的なイベントを抜粋。決済側の箱には外部 API が記録した決済を示す。
  legend: {0: Event History のイベント, 3: 外部決済の記録}
  lanes:
    - {id: history, label: Event History, node: history}
    - {id: payment, label: 外部決済 API, node: payment}
  items: {history: [], payment: []}
implementations:
  - id: temporal
    label: 自己管理 Temporal と PostgreSQL
    description: Kubernetes の Temporal Service と PostgreSQL を使い、注文処理の Worker と決済 Worker を別のワークロードで実行する例。
    sources:
      - title: Self-hosted Temporal Service
        url: https://docs.temporal.io/self-hosted-guide
      - title: Temporal Visibility setup
        url: https://docs.temporal.io/self-hosted-guide/visibility
      - title: Temporal Task Queues
        url: https://docs.temporal.io/task-queue
    tiers:
      - id: entry
        label: 注文受付
        z: 3
        kind: origin
      - id: service
        label: Temporal Service
        z: 2
      - id: worker
        label: 実行 Worker
        z: 1
      - id: outside
        label: 副作用の記録先
        z: 0
    groups:
      - kind: cluster
        label: Temporal を実行する Kubernetes クラスタ
        provider: k8s
        tier:
          - entry
          - service
          - worker
        nodes:
          - temporal-order
          - temporal-service
          - temporal-workflow-a
          - temporal-workflow-b
          - temporal-activity
    nodes:
      temporal-host: {label: 自主管理 Kubernetes ノード群, kind: host, tier: worker, description: 注文 API、Temporal Server と Worker Pod を実行する。, evidence: [{type: doc, ref: docs/reference-temporal.md#§6}]}
      temporal-db-host: {label: 自主管理 PostgreSQL ホスト, kind: host, tier: outside, description: クラスタ外で PostgreSQL を実行し、データを永続化する。, evidence: [{type: doc, ref: docs/reference-temporal.md#§6}]}
      temporal-order:
        label: Temporal SDK を使う注文 API
        kind: client
        tier: entry
        svc: k8s:deployment
        realizes:
          - order
        description: Temporal Workflow を開始する。
        evidence:
          - type: doc
            ref: docs/reference-temporal.md#§6
      temporal-service:
        label: Temporal Server の Frontend・History・Matching
        kind: workflow
        tier: service
        realizes:
          - service
          - queue
        description: SDK の要求を受け、履歴と Task Queue を同じ運用境界内で管理する。
        evidence:
          - type: doc
            ref: docs/reference-temporal.md#§6
      temporal-history:
        label: PostgreSQL の Persistence スキーマ
        kind: db
        tier: service
        svc: onprem:db
        realizes:
          - history
        description: Temporal の永続化先として実行履歴を保持する。
        evidence:
          - type: doc
            ref: docs/reference-temporal.md#§6
      temporal-workflow-a:
        label: 注文 Worker Pod A
        kind: worker
        tier: worker
        svc: k8s:deployment
        realizes:
          - workflow-a
        description: orders キューをポーリングして最初の Workflow Task を実行する。
        evidence:
          - type: doc
            ref: docs/reference-temporal.md#§6
      temporal-workflow-b:
        label: 注文 Worker Pod B
        kind: worker
        tier: worker
        svc: k8s:deployment
        realizes:
          - workflow-b
        description: 同じ orders キューをポーリングし、必要なら受けた履歴をリプレイする。
        evidence:
          - type: doc
            ref: docs/reference-temporal.md#§6
      temporal-activity:
        label: 決済 Worker Deployment
        kind: worker
        tier: worker
        svc: k8s:deployment
        realizes:
          - activity
        description: payments キューを処理し、決済 API に操作キーを渡す。
        evidence:
          - type: doc
            ref: docs/reference-temporal.md#§6
      temporal-payment:
        label: 外部決済 API（架空）
        kind: external
        tier: outside
        realizes:
          - payment
        description: 同一操作キーの再試行に同じ結果を返す契約とする。
        evidence:
          - type: doc
            ref: docs/reference-temporal.md#§6
      temporal-visibility:
        label: PostgreSQL の Visibility スキーマ
        kind: table
        tier: service
        description: Web UI / CLI で実行一覧を絞り込むための参照データを保持する。
        evidence:
          - type: doc
            ref: docs/reference-temporal.md#§6
    links:
      - {id: temporal-run-server, from: temporal-host, to: temporal-service, label: Temporal Server を実行, evidence: [{type: doc, ref: docs/reference-temporal.md#§6}]}
      - {id: temporal-run-db, from: temporal-db-host, to: temporal-history, label: PostgreSQL を実行, evidence: [{type: doc, ref: docs/reference-temporal.md#§6}]}
      - id: temporal-index-executions
        from: temporal-service
        to: temporal-visibility
        label: 検索用の実行状態を記録
        evidence:
          - type: doc
            ref: docs/reference-temporal.md#§6

    layout2d:
      tiers: [{id: diagram, label: ワークフローの実行と保存, z: 0, origin: [-4, 0], size: [27, 15]}]
      nodes:
        temporal-host: {tier: diagram, x: 1, y: 1}
        temporal-order: {tier: diagram, x: 4, y: 1}
        temporal-service: {tier: diagram, x: 7, y: 1}
        temporal-workflow-a: {tier: diagram, x: 1, y: 4}
        temporal-workflow-b: {tier: diagram, x: 4, y: 4}
        temporal-activity: {tier: diagram, x: 7, y: 4}
        temporal-db-host: {tier: diagram, x: 14, y: 1}
        temporal-history: {tier: diagram, x: 17, y: 1}
        temporal-visibility: {tier: diagram, x: 20, y: 1}
        temporal-payment: {tier: diagram, x: -3, y: 1}
      groups:
        - {kind: cluster, label: 自主管理 Kubernetes, tier: [diagram], x0: -1, y0: 0.5, x1: 10, y1: 12, nodes: [temporal-host, temporal-order, temporal-service, temporal-workflow-a, temporal-workflow-b, temporal-activity]}
        - {kind: datacenter, label: 自主管理 PostgreSQL ホスト, tier: [diagram], x0: 12, y0: 0, x1: 23, y1: 12, nodes: [temporal-db-host, temporal-history, temporal-visibility]}
    layout3d:
      tiers:
        - {id: nodes, label: Kubernetes ノード, z: 0, size: [10, 10]}
        - {id: pods, label: ノード上の Pod, z: 1, size: [10, 10]}
        - {id: services, label: 独立した制御・保存, z: 0, origin: [13, 0], size: [10, 8]}
        - {id: db, label: PostgreSQL 上のデータ, z: 1, origin: [13, 0], size: [10, 8]}
        - {id: outside, label: 外部の呼び出し先, z: 0, origin: [-5, 0], size: [4, 7]}
      nodes:
        temporal-host: {tier: nodes, x: 1, y: 1}
        temporal-order: {tier: pods, x: 4, y: 1}
        temporal-service: {tier: pods, x: 7, y: 1}
        temporal-workflow-a: {tier: pods, x: 1, y: 4}
        temporal-workflow-b: {tier: pods, x: 4, y: 4}
        temporal-activity: {tier: pods, x: 7, y: 4}
        temporal-db-host: {tier: services, x: 1, y: 1}
        temporal-history: {tier: db, x: 4, y: 1}
        temporal-visibility: {tier: db, x: 7, y: 1}
        temporal-payment: {tier: outside, x: 1, y: 1}
      groups:
        - {kind: cluster, label: 自主管理 Kubernetes, tier: [nodes, pods], nodes: [temporal-host, temporal-order, temporal-service, temporal-workflow-a, temporal-workflow-b, temporal-activity]}
        - {kind: datacenter, label: 自主管理 PostgreSQL ホスト, tier: [services, db], nodes: [temporal-db-host, temporal-history, temporal-visibility]}

  - id: aws-eks-temporal
    label: "Amazon EKS 上の Temporal と RDS PostgreSQL"
    description: "Temporal Server と注文用 Worker を Amazon EKS の EC2 ノードで運用する。RDS PostgreSQL に実行履歴と Visibility を分けて永続化する。"
    sources:
      - {title: EKS Control Plane, url: https://docs.aws.amazon.com/eks/latest/best-practices/control-plane.html}
      - {title: RDS security, url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.html}
      - {title: "Temporal の自己管理構成", url: https://docs.temporal.io/self-hosted-guide}
      - {title: "Temporal の公式 Helm チャート", url: https://github.com/temporalio/helm-charts/blob/main/README.md}
      - {title: "Temporal Visibility の対応データベース", url: https://docs.temporal.io/self-hosted-guide/visibility}
      - {title: "Temporal の本番構成チェックリスト", url: https://docs.temporal.io/self-hosted-guide/production-checklist}
      - {title: "EKS マネージドノードグループ", url: https://docs.aws.amazon.com/eks/latest/userguide/create-managed-node-group.html}
    tiers:
      - {id: entry, label: 投入元, kind: origin, z: 1, origin: [-5, 0], size: [3, 4]}
      - {id: runtime, label: 管理と実行, z: 1, size: [17, 7]}
      - {id: data, label: データと復旧, z: 0, size: [17, 5]}
    groups:
      - {kind: cloud, label: "AWS サービス領域（制御プレーンは AWS 管理 VPC）", provider: aws, tier: [runtime, data], nodes: [aws-eks-temporal-eks, aws-eks-temporal-nodes, aws-eks-temporal-server, aws-eks-temporal-matching, aws-eks-temporal-worker-a, aws-eks-temporal-worker-b, aws-eks-temporal-activity, aws-eks-temporal-history, aws-eks-temporal-visibility]}
      - {kind: cluster, label: "Amazon EKS クラスター", provider: k8s, tier: [runtime], nodes: [aws-eks-temporal-eks, aws-eks-temporal-nodes, aws-eks-temporal-server, aws-eks-temporal-matching, aws-eks-temporal-worker-a, aws-eks-temporal-worker-b, aws-eks-temporal-activity]}
      - {kind: namespace, label: "Temporal Server 名前空間", provider: k8s, tier: [runtime], nodes: [aws-eks-temporal-server, aws-eks-temporal-matching]}
      - {kind: namespace, label: "注文アプリ Worker の名前空間", provider: k8s, tier: [runtime], nodes: [aws-eks-temporal-worker-a, aws-eks-temporal-worker-b, aws-eks-temporal-activity]}
      - {kind: vpc, label: "RDS のプライベート接続先", provider: aws, tier: [data], nodes: [aws-eks-temporal-history, aws-eks-temporal-visibility]}
    nodes:
      aws-eks-temporal-order: {label: "注文 API（Temporal SDK）", kind: client, tier: entry, x: 1, y: 1.1, realizes: [order], description: "顧客の注文を Workflow ID を指定して開始する。", evidence: [{type: doc, ref: docs/reference-temporal.md#§7}]}
      aws-eks-temporal-payment: {label: "外部決済 API（例示）", kind: external, tier: entry, x: 1, y: 3.1, realizes: [payment], description: "同一の操作キーに既存の決済結果を返すと仮定する。", evidence: [{type: doc, ref: docs/reference-temporal.md#§7}]}
      aws-eks-temporal-eks: {label: "EKS Kubernetes API", kind: service, tier: runtime, x: 1, y: 0.4, svc: eks, description: "AWS 管理 VPC 内の Kubernetes API。利用者は API と公開設定を操作するがサーバーに直接アクセスしない。", management: {type: aws, scope: AWS が制御プレーン基盤を運用し、利用者が API と公開設定を操作する。}, evidence: [{type: doc, ref: docs/reference-temporal.md#§7}]}
      aws-eks-temporal-nodes: {label: "EKS の EC2 ノード", kind: host, tier: runtime, x: 1, y: 3.9, svc: ec2, description: "Temporal Server と Worker の Pod を実行する。", management: {type: shared, scope: EKS がノード作成・更新を支援し、利用者が設定と更新開始を担う。}, evidence: [{type: doc, ref: docs/reference-temporal.md#§7}]}
      aws-eks-temporal-server: {label: "Temporal Frontend・History", kind: workflow, tier: runtime, x: 6.2, y: 0.7, realizes: [service], description: "SDK の gRPC 要求を受け、履歴を管理する。", evidence: [{type: doc, ref: docs/reference-temporal.md#§7}]}
      aws-eks-temporal-matching: {label: "Temporal Matching", kind: queue, tier: runtime, x: 12.4, y: 0.7, realizes: [queue], description: "Task Queue の Workflow Task と Activity Task をポーリングする Worker へ配る。", evidence: [{type: doc, ref: docs/reference-temporal.md#§7}]}
      aws-eks-temporal-worker-a: {label: "注文 Worker Pod A", kind: worker, tier: runtime, x: 5, y: 4.9, realizes: [workflow-a], description: "注文 Workflow を最初に処理する実行担当の例。", evidence: [{type: doc, ref: docs/reference-temporal.md#§7}]}
      aws-eks-temporal-worker-b: {label: "注文 Worker Pod B", kind: worker, tier: runtime, x: 9, y: 4.9, realizes: [workflow-b], description: "別の注文 Worker が Task と履歴を受け、決定的に再生する。", evidence: [{type: doc, ref: docs/reference-temporal.md#§7}]}
      aws-eks-temporal-activity: {label: "決済 Activity Worker Pod", kind: worker, tier: runtime, x: 14, y: 4.9, realizes: [activity], description: "専用 Task Queue を読み、注文の操作キーで外部決済を呼ぶ。", evidence: [{type: doc, ref: docs/reference-temporal.md#§7}]}
      aws-eks-temporal-history: {label: "RDS PostgreSQL の Persistence", kind: db, tier: data, x: 6, y: 1.5, svc: rds, realizes: [history], description: "Temporal の履歴イベントや実行状態を永続化する。", management: {type: shared, scope: AWS が RDS 基盤を運用し、利用者がデータ、設定と権限を管理する。}, evidence: [{type: doc, ref: docs/reference-temporal.md#§7}]}
      aws-eks-temporal-visibility: {label: "RDS PostgreSQL の Visibility", kind: db, tier: data, x: 12, y: 1.5, description: "同じ RDS インスタンスの別データベースに検索用情報を保持する。", evidence: [{type: doc, ref: docs/reference-temporal.md#§7}]}
    links:
      - {id: aws-eks-temporal-schedule, from: aws-eks-temporal-eks, to: aws-eks-temporal-nodes, label: "Pod を EC2 ノードへ配置", evidence: [{type: doc, ref: docs/reference-temporal.md#§7}]}
      - {id: aws-eks-temporal-search, from: aws-eks-temporal-server, to: aws-eks-temporal-visibility, label: "実行一覧の検索情報を保存", evidence: [{type: doc, ref: docs/reference-temporal.md#§7}]}
      - {id: aws-eks-temporal-poll, from: aws-eks-temporal-matching, to: aws-eks-temporal-server, label: "ポーリングへの応答を返す", realizes: [run-a, run-b, run-activity], replace: true, evidence: [{type: doc, ref: docs/reference-temporal.md#§7}]}
