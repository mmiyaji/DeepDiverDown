    sources:
      - title: Hypertables
        url: https://www.tigerdata.com/docs/learn/hypertables/understand-hypertables
      - title: Hypercore
        url: https://www.tigerdata.com/docs/learn/columnar-storage/understand-hypercore
      - title: Columnstore policy
        url: https://www.tigerdata.com/docs/reference/timescaledb/hypercore/add_columnstore_policy
      - title: Continuous aggregates
        url: https://www.tigerdata.com/docs/learn/continuous-aggregates
      - title: PostgreSQL WAL
        url: https://www.postgresql.org/docs/current/wal-intro.html
    tiers:
      - id: query
        label: 入力・実行
        z: 1
        size:
          - 20
          - 4
      - id: store
        label: データの保存
        z: 0
        size:
          - 20
          - 4
    nodes:
      impl-write:
        label: 時刻付きの行
        kind: client
        tier: query
        x: 0
        'y': 1.5
        description: 観測時刻・系列属性・値の行。
        realizes:
          - write
        evidence:
          - type: doc
            ref: docs/reference-timescaledb-columnstore-internals.md#§4
      impl-route:
        label: hypertable の振り分け
        kind: service
        tier: query
        x: 4
        'y': 1.5
        description: 時刻に応じた chunk に書き込む。
        realizes:
          - route
        evidence:
          - type: doc
            ref: docs/reference-timescaledb-columnstore-internals.md#§4
      impl-row:
        label: rowstore chunk
        kind: db
        tier: store
        x: 4
        'y': 1.5
        description: 最新の行を時間範囲別に格納する。
        realizes:
          - row
        evidence:
          - type: doc
            ref: docs/reference-timescaledb-columnstore-internals.md#§4
      impl-batch:
        label: columnstore の列バッチ
        kind: db
        tier: store
        x: 9
        'y': 1.5
        description: segmentby のキーと orderby の順序でバッチ化したデータ。
        realizes:
          - batch
        evidence:
          - type: doc
            ref: docs/reference-timescaledb-columnstore-internals.md#§4
      impl-wal:
        label: PostgreSQL WAL
        kind: file
        tier: store
        x: 0
        'y': 1.5
        description: PostgreSQL の変更を復旧用に記録する。
        realizes:
          - wal
        evidence:
          - type: doc
            ref: docs/reference-timescaledb-columnstore-internals.md#§4
      impl-rollup:
        label: continuous aggregate
        kind: db
        tier: store
        x: 14
        'y': 1.5
        description: 時間幅の集計を保存し、更新ポリシーで更新する。
        realizes:
          - rollup
        evidence:
          - type: doc
            ref: docs/reference-timescaledb-columnstore-internals.md#§4
      impl-scan:
        label: SQL の期間・系列検索
        kind: service
        tier: query
        x: 14
        'y': 1.5
        description: 対象 chunk を絞り、行と列バッチや集計を読む。
        realizes:
          - scan
        evidence:
          - type: doc
            ref: docs/reference-timescaledb-columnstore-internals.md#§4
    groups:
      - kind: datacenter
        provider: onprem
        label: 自前の Linux サーバー
        tier:
          - query
          - store
        nodes:
          - impl-write
          - impl-route
          - impl-row
          - impl-batch
          - impl-wal
          - impl-rollup
          - impl-scan
blocks:
  - id: physical-map
    title: chunk と列バッチの構造
    note: 説明用の概念例です。実データの個数、配置、バージョンや設定を表すものではありません。
    hint: 項目を選ぶと説明を表示します。シナリオの進行に合わせて該当項目を強調します。
    lanes:
      - id: rowlane
        label: 時間別 rowstore
        node: row
      - id: columnlane
        label: 列バッチ
        node: batch
      - id: agglane
        label: 継続集計・WAL
        node: rollup
    items:
      rowlane:
        - id: today
          label: 今日
          k: 0
          note: 最近の時間範囲の chunk の例。
        - id: yesterday
          label: 昨日
          k: 1
          note: 別の時間範囲の chunk の例。
      columnlane:
        - id: segment
          label: segmentby
          k: 2
          note: 同じキーで値をまとめる例。
        - id: order
          label: orderby
          k: 3
          note: 列バッチ内の並び順を決める列。
      agglane:
        - id: agg
          label: 時間別集計
          k: 4
          note: 更新された時間幅の集計値。
        - id: wal
          label: WAL
          k: 1
          note: PostgreSQL の変更記録。
