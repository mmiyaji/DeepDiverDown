name: TimescaleDB：chunk・列バッチと絞り込み
description: 時刻別 chunk、列化したバッチの segmentby / orderby、読み取り・継続集計を追う。
parent:
  model: timescaledb-storage-internals
  node: column
reference:
  objectives:
    - 構成要素と書き込み・読み出しの経路を理解する。
    - 保存形式と運用上の前提を区別する。
  sources:
    - title: Hypertables
      url: https://www.tigerdata.com/docs/learn/hypertables/understand-hypertables
    - title: Hypercore
      url: https://www.tigerdata.com/docs/learn/columnar-storage/understand-hypercore
    - title: Columnstore policy
      url: https://www.tigerdata.com/docs/reference/timescaledb/hypercore/add_columnstore_policy
    - title: Continuous aggregates
      url: https://www.tigerdata.com/docs/learn/continuous-aggregates
    - title: PostgreSQL WAL
      url: https://www.postgresql.org/docs/current/wal-intro.html
sources:
  - docs/reference-timescaledb-columnstore-internals.md
evidence:
  - type: doc
    ref: docs/reference-timescaledb-columnstore-internals.md#§1
  - type: doc
    ref: docs/reference-timescaledb-columnstore-internals.md#§3
  - type: doc
    ref: docs/reference-timescaledb-columnstore-internals.md#§5
tiers:
  - id: query
    label: 入力・実行
    z: 1
    size:
      - 20
      - 4
  - id: store
    label: データの保存
    z: 0
    size:
      - 20
      - 4
nodes:
  write:
    label: 時刻付きの行
    kind: client
    tier: query
    x: 0
    'y': 1.5
    description: 観測時刻・系列属性・値の行。
    evidence:
      - type: doc
        ref: docs/reference-timescaledb-columnstore-internals.md#§2
  route:
    label: hypertable の振り分け
    kind: service
    tier: query
    x: 4
    'y': 1.5
    description: 時刻に応じた chunk に書き込む。
    evidence:
      - type: doc
        ref: docs/reference-timescaledb-columnstore-internals.md#§2
  row:
    label: rowstore chunk
    kind: db
    tier: store
    x: 4
    'y': 1.5
    description: 最新の行を時間範囲別に格納する。
    evidence:
      - type: doc
        ref: docs/reference-timescaledb-columnstore-internals.md#§2
  batch:
    label: columnstore の列バッチ
    kind: db
    tier: store
    x: 9
    'y': 1.5
    description: segmentby のキーと orderby の順序でバッチ化したデータ。
    evidence:
      - type: doc
        ref: docs/reference-timescaledb-columnstore-internals.md#§2
  wal:
    label: PostgreSQL WAL
    kind: file
    tier: store
    x: 0
    'y': 1.5
    description: PostgreSQL の変更を復旧用に記録する。
    evidence:
      - type: doc
        ref: docs/reference-timescaledb-columnstore-internals.md#§2
  rollup:
    label: continuous aggregate
    kind: db
    tier: store
    x: 14
    'y': 1.5
    description: 時間幅の集計を保存し、更新ポリシーで更新する。
    evidence:
      - type: doc
        ref: docs/reference-timescaledb-columnstore-internals.md#§2
  scan:
    label: SQL の期間・系列検索
    kind: service
    tier: query
    x: 14
    'y': 1.5
    description: 対象 chunk を絞り、行と列バッチや集計を読む。
    evidence:
      - type: doc
        ref: docs/reference-timescaledb-columnstore-internals.md#§2
links:
  - id: a
    from: write
    to: route
    label: 観測行を投入
    evidence:
      - type: doc
        ref: docs/reference-timescaledb-columnstore-internals.md#§2
  - id: b
    from: route
    to: row
    label: 時間別 chunk に保存
    evidence:
      - type: doc
        ref: docs/reference-timescaledb-columnstore-internals.md#§2
  - id: w
    from: route
    to: wal
    label: 変更を WAL に記録
    evidence:
      - type: doc
        ref: docs/reference-timescaledb-columnstore-internals.md#§2
  - id: c
    from: row
    to: batch
    label: 設定したポリシーで列化
    evidence:
      - type: doc
        ref: docs/reference-timescaledb-columnstore-internals.md#§2
  - id: d
    from: row
    to: rollup
    label: 対象期間を集計
    evidence:
      - type: doc
        ref: docs/reference-timescaledb-columnstore-internals.md#§2
  - id: q
    from: scan
    to: row
    label: 対象の rowstore を読む
    evidence:
      - type: doc
        ref: docs/reference-timescaledb-columnstore-internals.md#§2
  - id: r
    from: scan
    to: batch
    label: 対象の columnstore を読む
    evidence:
      - type: doc
        ref: docs/reference-timescaledb-columnstore-internals.md#§2
  - id: s
    from: scan
    to: rollup
    label: 時間別集計を読む
    evidence:
      - type: doc
        ref: docs/reference-timescaledb-columnstore-internals.md#§2
scenarios:
  - id: store
    label: 投入と列化
    evidence:
      - type: doc
        ref: docs/reference-timescaledb-columnstore-internals.md#§2
    steps:
      - links:
          - a
        note: 観測行を投入。
        highlight:
          - today
      - links:
          - b
        note: 時間別 chunk に保存。
        highlight:
          - today
          - yesterday
      - links:
          - w
        note: 変更を WAL に記録。
        highlight:
          - wal
      - links:
          - c
        note: 設定したポリシーで列化。
        highlight:
          - yesterday
          - segment
          - order
    visual: physical-map
  - id: read
    label: 期間を絞って読む
    evidence:
      - type: doc
        ref: docs/reference-timescaledb-columnstore-internals.md#§2
    steps:
      - links:
          - q
        note: 対象の rowstore を読む。
        highlight:
          - today
      - links:
          - r
        note: 対象の columnstore を読む。
        highlight:
          - segment
          - order
      - links:
          - d
        note: 対象期間を集計。
        highlight:
          - today
          - agg
      - links:
          - s
        note: 時間別集計を読む。
        highlight:
          - agg
    visual: physical-map
implementations:
  - id: local
    label: Linux 上の PostgreSQL と TimescaleDB
