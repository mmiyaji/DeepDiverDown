name: Google Cloud Knowledge Catalog のメタデータ管理
description: BigQuery などの資産に構造化メタデータを付け、検索、リネージ、データ製品のアクセス申請につなげる流れを追います。
parent:
  model: data-catalog-architecture
  node: knowledge
reference:
  objectives:
    - 旧 Data Catalog と旧 Dataplex Universal Catalog からの移行を区別する。
    - Entry と Aspect から資産の説明や分類を探す。
    - メタデータの閲覧とデータ製品のアクセス権限を区別する。
  sources:
    - title: Knowledge Catalog Release Notes
      url: https://docs.cloud.google.com/knowledge-catalog/docs/release-notes
    - title: Transition from Dataplex Universal Catalog
      url: https://docs.cloud.google.com/knowledge-catalog/docs/transition-dataplex-universal-catalog
    - title: Transition from Data Catalog
      url: https://docs.cloud.google.com/dataplex/docs/transition-to-dataplex-catalog?hl=en
    - title: About Metadata in Knowledge Catalog
      url: https://docs.cloud.google.com/knowledge-catalog/docs/metadata-overview
    - title: Manage Aspects and Enrich Metadata
      url: https://docs.cloud.google.com/knowledge-catalog/docs/enrich-entries-metadata
    - title: About Data Lineage
      url: https://docs.cloud.google.com/knowledge-catalog/docs/about-data-lineage
    - title: Manage Access with IAM
      url: https://docs.cloud.google.com/knowledge-catalog/docs/iam-and-access-control
    - title: About Data Products
      url: https://docs.cloud.google.com/knowledge-catalog/docs/data-products-overview
    - title: Manage Data Products
      url: https://docs.cloud.google.com/knowledge-catalog/docs/manage-data-products
sources:
  - docs/reference-google-cloud-knowledge-catalog.md
evidence:
  - type: doc
    ref: docs/reference-google-cloud-knowledge-catalog.md#§1
tiers:
  - id: people
    label: 提供側・利用側
    z: 2
    size:
      - 15
      - 3
  - id: catalog
    label: メタデータ管理とデータ製品
    z: 1
    size:
      - 15
      - 4
  - id: sources
    label: ソースと IAM
    z: 0
    size:
      - 15
      - 3
nodes:
  owner:
    label: データ製品の所有者
    kind: actor
    tier: people
    x: 5
    'y': 1
    description: 利用文脈とアクセスグループを設定し、申請を処理する。
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§3
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§5
  consumer:
    label: データ利用者
    kind: actor
    tier: people
    x: 11
    'y': 1
    description: 資産を検索し、製品の利用を申請する。
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§5
  entries:
    label: Entry Group・Entry
    kind: db
    tier: catalog
    x: 2
    'y': 1
    description: 分析基盤や外部ソースから取り込んだ資産を登録する。
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§2
  aspects:
    label: Aspect Type・Aspect
    kind: service
    tier: catalog
    x: 5
    'y': 2.5
    description: 項目を型で定義して資産・列に構造化情報を付ける。
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§3
  lineage:
    label: リネージ
    kind: service
    tier: catalog
    x: 8
    'y': 1
    description: 収集した処理の入出力を資産に関連付ける。
    drill: openlineage
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§4
  products:
    label: データ製品・アクセス申請
    kind: service
    tier: catalog
    x: 12
    'y': 1
    description: 用途に沿って資産をまとめ、グループごとの利用を承認する。
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§5
  bigquery:
    label: 分析基盤の資産
    kind: db
    tier: sources
    x: 3
    'y': 1
    description: テーブルのスキーマを提供し、実行時にデータ権限を評価する。
    drill: bigquery
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§2
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§4
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§5
  group:
    label: グループと資産の利用権限
    kind: external
    tier: sources
    x: 12
    'y': 1
    description: 承認経路に応じて利用者をグループに追加し、資産のアクセス権限と対応付ける。
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§5
links:
  - id: catalog
    from: bigquery
    to: entries
    label: テーブルを Entry として取り込む
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§2
  - id: curate
    from: owner
    to: aspects
    label: 分類・利用目的・連絡先を設定
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§3
  - id: enrich
    from: aspects
    to: entries
    label: Entry や列に Aspect を付与
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§3
  - id: collect-lineage
    from: bigquery
    to: lineage
    label: 対応する処理履歴を連携
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§4
  - id: link-lineage
    from: lineage
    to: entries
    label: 処理の上流・下流を資産と対応付ける
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§4
  - id: search
    from: consumer
    to: entries
    label: 資産とリネージを調べる
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§4
  - id: package
    from: owner
    to: products
    label: 利用目的に沿って資産・権限を設定
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§5
  - id: request
    from: consumer
    to: products
    label: アクセスグループを選び申請
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§5
  - id: approve
    from: owner
    to: products
    label: 申請をコンソールで承認
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§5
  - id: membership
    from: products
    to: group
    label: グループに利用者を追加
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§5
  - id: enforce
    from: group
    to: bigquery
    label: 資産の IAM ロールを評価
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§5
  - id: read
    from: consumer
    to: bigquery
    label: 認可範囲でクエリを実行
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§5
scenarios:
  - id: discover-metadata
    label: 注文テーブルの意味と由来を調べる
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§6
    steps:
      - links:
          - catalog
          - curate
          - enrich
        note: 登録した注文テーブルと列に運用の文脈を付ける。
        read:
          - schema
          - purpose
          - classification
      - links:
          - collect-lineage
          - link-lineage
          - search
        note: 上流の処理と利用目的を確認する。
        read:
          - upstream
          - purpose
  - id: request-access
    label: データ製品の利用を申請する
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§6
    steps:
      - links:
          - package
          - request
        note: 所有者はデータ製品を公開し、利用者は必要な権限のグループへ申請する。
      - links:
          - approve
          - membership
        note: コンソールから承認し、利用者がグループに追加される。
      - links:
          - enforce
          - read
        note: 分析基盤が資産の権限を評価し、許可されたデータを読み込む。
treeLayout:
  title: 注文データ製品から資産の文脈へ
  unit: 情報項目
  levels:
    - データ製品
    - 資産の Entry
    - 紐付く情報
  note: 注文テーブル一件に付く技術情報と事業上の情報の論理ビュー。
  root:
    id: order-product
    label: 注文データ製品
    kind: meta
    node: products
    children:
      - id: orders-entry
        label: 注文テーブル / orders
        kind: snapshot
        node: entries
        children:
          - id: schema
            label: Schema
            kind: data
            node: entries
            sub: テーブルのスキーマ
          - id: purpose
            label: Overview / Contacts
            kind: data
            node: aspects
            sub: 利用目的と運用連絡先
          - id: classification
            label: 列の分類
            kind: data
            node: aspects
            sub: 顧客識別子の扱い
          - id: upstream
            label: 上流のジョブ
            kind: data
            node: lineage
            sub: 注文データの入力と変換
requirements:
  - id: R-01
    kind: rule
    title: 利用権限を資産ごとに評価すること
    text: 承認で選ばれた権限を対応する資産に反映し、アクセス時に検証する。
    links:
      - approve
      - membership
      - enforce
    evidence:
      - type: doc
        ref: docs/reference-google-cloud-knowledge-catalog.md#§5
implementations:
  - id: gcp-bigquery
    label: Knowledge Catalog・BigQuery
    description: BigQuery の注文テーブルと承認付きアクセスグループを結び付ける Google Cloud の例。
    sources:
      - title: About Metadata in Knowledge Catalog
        url: https://docs.cloud.google.com/knowledge-catalog/docs/metadata-overview
      - title: About Data Lineage
        url: https://docs.cloud.google.com/knowledge-catalog/docs/about-data-lineage
      - title: Manage Data Products
        url: https://docs.cloud.google.com/knowledge-catalog/docs/manage-data-products
      - title: Use data products
        url: https://docs.cloud.google.com/knowledge-catalog/docs/use-data-products
      - title: Run a query in BigQuery
        url: https://docs.cloud.google.com/bigquery/docs/running-queries
    nodes:
      gcp-bigquery-service: {label: BigQuery managed service, svc: "gcp:bigquery", kind: service, tier: sources, x: 8, y: 5, evidence: [{type: doc, ref: "docs/reference-google-cloud-knowledge-catalog.md#§7"}]}
      gcp-bigquery-owner:
        label: データ製品の担当者
        kind: actor
        tier: sources
        x: 0
        y: 2
        description: Google Cloud コンソールでアクセスグループとメタデータを管理する。
        realizes:
          - owner
        evidence:
          - type: doc
            ref: docs/reference-google-cloud-knowledge-catalog.md#§7
      gcp-bigquery-user:
        label: BigQuery の利用者
        kind: actor
        tier: sources
        x: 0
        y: 6
        description: 個人 ID でデータ製品の申請を行う。
        realizes:
          - consumer
        evidence:
          - type: doc
            ref: docs/reference-google-cloud-knowledge-catalog.md#§7
      gcp-bigquery-metadata:
        svc: gcp:knowledgecatalog
        label: Knowledge Catalog（Entry・Aspect）
        kind: catalog
        tier: sources
        x: 4
        y: 1
        description: BigQuery テーブルの自動 Entry とカスタム Aspect を管理する。
        realizes:
          - entries
          - aspects
        evidence:
          - type: doc
            ref: docs/reference-google-cloud-knowledge-catalog.md#§7
      gcp-bigquery-lineage:
        label: Google Cloud Data Lineage API
        kind: service
        tier: sources
        x: 8
        y: 1
        description: 対応する BigQuery ジョブの入出力を記録する。
        realizes:
          - lineage
        evidence:
          - type: doc
            ref: docs/reference-google-cloud-knowledge-catalog.md#§7
        drill: openlineage
      gcp-bigquery-products:
        label: Knowledge Catalog データ製品
        kind: catalog
        tier: sources
        x: 12
        y: 1
        description: 関連資産とアクセス要求を管理する。
        realizes:
          - products
        evidence:
          - type: doc
            ref: docs/reference-google-cloud-knowledge-catalog.md#§7
      gcp-bigquery-bigquery:
        label: BigQuery テーブル
        kind: table
        tier: sources
        x: 4
        y: 5
        description: 提供側の BigQuery 管理ストレージに注文データを保持し、クエリ時に資産 IAM を評価する。
        realizes:
          - bigquery
        evidence:
          - type: doc
            ref: docs/reference-google-cloud-knowledge-catalog.md#§7
        drill: bigquery
      gcp-bigquery-google-group:
        label: Google グループと IAM ロール
        kind: external
        tier: sources
        x: 26
        y: 2
        description: アクセスグループから利用者と資産権限を対応付ける。
        realizes:
          - group
        evidence:
          - type: doc
            ref: docs/reference-google-cloud-knowledge-catalog.md#§7
      gcp-bigquery-job-project:
        label: BigQuery クエリジョブ
        svc: gcp:bigquery
        kind: service
        tier: sources
        x: 20
        y: 2
        description: 利用側プロジェクトで実行する。利用者には当該プロジェクトのジョブ作成権限が要る。
        evidence:
          - type: doc
            ref: docs/reference-google-cloud-knowledge-catalog.md#§7
    links:
      - {id: gcp-bigquery-store-table, from: gcp-bigquery-service, to: gcp-bigquery-bigquery, label: "Store and query table", evidence: [{type: doc, ref: "docs/reference-google-cloud-knowledge-catalog.md#§7"}]}
      - {id: gcp-bigquery-run-job, from: gcp-bigquery-service, to: gcp-bigquery-job-project, label: "Execute query job", evidence: [{type: doc, ref: "docs/reference-google-cloud-knowledge-catalog.md#§7"}]}
      - id: gcp-bigquery-query-job
        from: gcp-bigquery-job-project
        to: gcp-bigquery-bigquery
        label: 実行プロジェクトからクエリする
        evidence:
          - type: doc
            ref: docs/reference-google-cloud-knowledge-catalog.md#§7
    groups:
      - {kind: cloud, provider: gcp, label: Provider Google Cloud project, tier: sources, nodes: [gcp-bigquery-metadata, gcp-bigquery-lineage, gcp-bigquery-products, gcp-bigquery-bigquery, gcp-bigquery-service]}
      - {kind: cloud, provider: gcp, label: Consumer Google Cloud project, tier: sources, nodes: [gcp-bigquery-job-project]}
    layout2d:
      tiers: [{id: diagram, label: Knowledge Catalog and BigQuery, z: 0, size: [30, 13]}]
      nodes:
        gcp-bigquery-metadata: {tier: diagram, x: 4, y: 1}
        gcp-bigquery-lineage: {tier: diagram, x: 8, y: 1}
        gcp-bigquery-products: {tier: diagram, x: 12, y: 1}
        gcp-bigquery-bigquery: {tier: diagram, x: 4, y: 5}
        gcp-bigquery-service: {tier: diagram, x: 8, y: 5}
        gcp-bigquery-job-project: {tier: diagram, x: 20, y: 2}
        gcp-bigquery-owner: {tier: diagram, x: 0, y: 2}
        gcp-bigquery-user: {tier: diagram, x: 0, y: 6}
        gcp-bigquery-google-group: {tier: diagram, x: 26, y: 2}
      groups:
        - {kind: cloud, provider: gcp, label: Provider Google Cloud project, tier: diagram, nodes: [gcp-bigquery-metadata, gcp-bigquery-lineage, gcp-bigquery-products, gcp-bigquery-bigquery, gcp-bigquery-service]}
        - {kind: cloud, provider: gcp, label: Consumer Google Cloud project, tier: diagram, nodes: [gcp-bigquery-job-project]}
    layout3d:
      tiers:
        - {id: provider, label: Provider Google Cloud project, z: 0, size: [16, 6]}
        - {id: consumer, label: Consumer Google Cloud project, z: 0, origin: [19, 0], size: [5, 3]}
        - {id: identity, label: Users and Google Group, kind: origin, z: 0, origin: [-5, 0], size: [4, 3]}
      nodes:
        gcp-bigquery-metadata: {tier: provider, x: 2, y: 1}
        gcp-bigquery-lineage: {tier: provider, x: 6, y: 1}
        gcp-bigquery-products: {tier: provider, x: 10, y: 1}
        gcp-bigquery-bigquery: {tier: provider, x: 14, y: 1}
        gcp-bigquery-service: {tier: provider, x: 2, y: 4}
        gcp-bigquery-job-project: {tier: consumer, x: 2, y: 1.5}
        gcp-bigquery-owner: {tier: identity, x: 0, y: 1.5}
        gcp-bigquery-user: {tier: identity, x: 1, y: 1.5}
        gcp-bigquery-google-group: {tier: identity, x: 2, y: 1.5}
      groups:
        - {kind: cloud, provider: gcp, label: Provider Google Cloud project, tier: provider, nodes: [gcp-bigquery-metadata, gcp-bigquery-lineage, gcp-bigquery-products, gcp-bigquery-bigquery, gcp-bigquery-service]}
        - {kind: cloud, provider: gcp, label: Consumer Google Cloud project, tier: consumer, nodes: [gcp-bigquery-job-project]}
