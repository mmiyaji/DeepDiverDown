name: "Apache Paimon の主キーテーブル：Flink 更新と変更ログ"
description: "Flink から届く注文更新が主キーで統合される過程を追い、スナップショットと下流向けの変更ログを比較する。"
reference:
  objectives:
    - 主キーの更新が sorted run とスナップショットにどう現れるかを追う。
    - merge-engine と changelog-producer が担う役割を説明する。
    - Paimon の LSM と Hudi の CoW・MoR の保存単位を比較する。
  sources:
    - title: Paimon 2.1 Primary-Key Table
      url: https://paimon.apache.org/docs/2.1/primary-key-table/
    - title: Paimon 2.1 Merge Engines
      url: https://paimon.apache.org/docs/2.1/primary-key-table/merge-engine/
    - title: Paimon 2.1 Changelog Producer
      url: https://paimon.apache.org/docs/2.1/primary-key-table/changelog-producer/
    - title: Paimon 2.1 Compaction
      url: https://paimon.apache.org/docs/2.1/primary-key-table/compaction/
    - title: Apache Hudi Concepts
      url: https://hudi.apache.org/docs/concepts/
    - title: Paimon 2.1 Table Mode
      url: https://paimon.apache.org/docs/2.1/primary-key-table/table-mode/
sources: ["docs/reference-apache-paimon.md"]
evidence:
  - {"type":"doc","ref":"docs/reference-apache-paimon.md#§1"}
  - {"type":"doc","ref":"docs/reference-apache-paimon.md#§2"}
  - {"type":"doc","ref":"docs/reference-apache-paimon.md#§3"}
  - {"type":"doc","ref":"docs/reference-apache-paimon.md#§4"}
  - {"type":"doc","ref":"docs/reference-apache-paimon.md#§5"}
  - {"type":"doc","ref":"docs/reference-apache-paimon.md#§6"}
tiers:
  - {"id":"processing","label":"テーブル読み書きと下流","z":1,"origin":[0,0],"size":[16,3]}
  - {"id":"lake","label":"Paimon 主キーテーブル","z":0,"origin":[2,0],"size":[14,3]}
nodes:
  source: {"label":"上流の注文更新","kind":"external","tier":"processing","x":0,"y":1.5,"description":"order_id=42 の完全な更新行を送る。","evidence":[{"type":"doc","ref":"docs/reference-apache-paimon.md#§1"}]}
  writer: {"label":"主キーを使うテーブル書き込み","kind":"worker","tier":"processing","x":4,"y":1.5,"description":"同じ主キーを同じパーティション・バケットへ書き込む。","evidence":[{"type":"doc","ref":"docs/reference-apache-paimon.md#§2"}]}
  reader: {"label":"スナップショット読み取り","kind":"service","tier":"processing","x":10,"y":0.5,"description":"選択したスナップショットの論理行を取得する。","evidence":[{"type":"doc","ref":"docs/reference-apache-paimon.md#§2"}]}
  consumer: {"label":"ストリーム利用者","kind":"external","tier":"processing","x":15,"y":2.5,"description":"主キー upsert または更新前後の変更を受け取る。","evidence":[{"type":"doc","ref":"docs/reference-apache-paimon.md#§4"}]}
  runs: {"label":"バケット内の sorted run","kind":"db","tier":"lake","x":3,"y":1.5,"description":"ソート済みファイルに複数の世代を持ち得る LSM の保存単位。","evidence":[{"type":"doc","ref":"docs/reference-apache-paimon.md#§2"}]}
  compact: {"label":"LSM コンパクション","kind":"worker","tier":"lake","x":7,"y":1.5,"description":"run をマージし、同じキーを merge-engine で統合する。","evidence":[{"type":"doc","ref":"docs/reference-apache-paimon.md#§3"}]}
  snapshots: {"label":"コミット済みスナップショット","kind":"db","tier":"lake","x":10,"y":0.3,"description":"読み取り対象のファイル集合を確定する。","evidence":[{"type":"doc","ref":"docs/reference-apache-paimon.md#§2"}]}
  changelog: {"label":"Changelog Producer","kind":"service","tier":"lake","x":12,"y":2.4,"description":"選んだ方式に応じて下流が読める変更を決める。","evidence":[{"type":"doc","ref":"docs/reference-apache-paimon.md#§4"}]}
links:
  - {"id":"ingest","from":"source","to":"writer","label":"主キー付きの更新行を渡す","evidence":[{"type":"doc","ref":"docs/reference-apache-paimon.md#§2"}]}
  - {"id":"flush","from":"writer","to":"runs","label":"ソート済みファイルを書く","evidence":[{"type":"doc","ref":"docs/reference-apache-paimon.md#§2"}]}
  - {"id":"commit","from":"runs","to":"snapshots","label":"ファイル集合をコミット","evidence":[{"type":"doc","ref":"docs/reference-apache-paimon.md#§2"}]}
  - {"id":"read-state","from":"snapshots","to":"reader","label":"論理行を読む","evidence":[{"type":"doc","ref":"docs/reference-apache-paimon.md#§2"}]}
  - {"id":"pick-runs","from":"runs","to":"compact","label":"重なる run を選ぶ","evidence":[{"type":"doc","ref":"docs/reference-apache-paimon.md#§3"}]}
  - {"id":"publish-compact","from":"compact","to":"snapshots","label":"新しいファイル集合をコミット","evidence":[{"type":"doc","ref":"docs/reference-apache-paimon.md#§3"}]}
  - {"id":"upsert","from":"snapshots","to":"consumer","label":"増分 upsert を読む","evidence":[{"type":"doc","ref":"docs/reference-apache-paimon.md#§4"}]}
  - {"id":"lookup","from":"compact","to":"changelog","label":"旧値を参照して前後を生成","evidence":[{"type":"doc","ref":"docs/reference-apache-paimon.md#§4"}]}
  - {"id":"deliver","from":"changelog","to":"consumer","label":"コミットした変更を読む","evidence":[{"type":"doc","ref":"docs/reference-apache-paimon.md#§4"}]}
scenarios:
  - id: state
    label: 注文 42 のスナップショットを更新する
    visual: lsm
    evidence:
      - type: doc
        ref: docs/reference-apache-paimon.md#§2
    steps:
      - links:
          - commit
          - read-state
        note: 既存スナップショットでは、注文 42 の状態は open。
        highlight:
          - v1
      - links:
          - ingest
          - flush
          - commit
        note: 同じキーの paid を新しい run に保存し、コミットする。
        blocks:
          previous:
            - id: v1
              label: "#42 · open"
              k: 0
          incoming:
            - id: v2
              label: "#42 · paid"
              k: 1
          output: []
        highlight:
          - v2
      - links:
          - read-state
        note: deduplicate がキー 42 の最新行 paid を返す。元の run が両方残っている間も論理行は 1 行。
        highlight:
          - v1
          - v2
      - links:
          - pick-runs
          - publish-compact
        note: コンパクションが run をマージし、新しいスナップショットは統合後のファイルを参照する。
        blocks:
          previous: []
          incoming: []
          output:
            - id: v3
              label: "#42 · paid"
              k: 2
              from:
                - v1
                - v2
        highlight:
          - v3
  - id: changes
    label: paid への更新を下流へ届ける
    visual: changes
    evidence:
      - type: doc
        ref: docs/reference-apache-paimon.md#§4
    steps:
      - links:
          - ingest
          - flush
        note: 入力は更新後の paid のみ。既存の open はテーブル側にある。
        highlight:
          - after
      - links:
          - commit
          - upsert
        note: none の場合、増分読み取りでは paid の upsert を受け取り、下流がキー 42 の状態を置き換えられる。
        blocks:
          input:
            - id: after
              label: +U paid
              k: 1
          none:
            - id: upsert-only
              label: +U paid
              k: 1
              from:
                - after
          lookup: []
        highlight:
          - upsert-only
      - links:
          - pick-runs
          - lookup
          - deliver
        note: 別の設定 lookup では、旧値 open を参照して −U open と +U paid を生成し、変更をコミットする。
        blocks:
          input:
            - id: after
              label: +U paid
              k: 1
          none:
            - id: upsert-only
              label: +U paid
              k: 1
          lookup:
            - id: before
              label: −U open
              k: 0
            - id: after-lookup
              label: +U paid
              k: 1
              from:
                - after
        highlight:
          - before
          - after-lookup
requirements:
  - {"id":"BR-01","kind":"rule","title":"キーごとに現在状態を得る","text":"最新の完全な注文行をキーごとに読み取れる。","links":["commit","read-state"],"evidence":[{"type":"doc","ref":"docs/reference-apache-paimon.md#§2"}]}
  - {"id":"BR-02","kind":"usecase","title":"下流の更新形式を選ぶ","text":"下流が上書きだけで処理できるか、旧値の取り消しが必要かに応じて提供する変更を選ぶ。","links":["upsert","lookup","deliver"],"evidence":[{"type":"doc","ref":"docs/reference-apache-paimon.md#§4"}]}
unknowns:
  - {"id":"UNK-01","text":"実環境の到着順と業務順、ストレージモード、下流の更新要件、コンパクションの時期は未確認。","refs":["writer","compact","consumer"]}
implementations:
  - id: flink-paimon
    label: Flink SQL・Paimon ファイルカタログ
    description: ローカル Flink SQL クラスターで Paimon の主キーテーブルを作り、更新とバッチ・ストリーム読み取りを試す例。
    sources:
      - title: Paimon 2.1 Primary-Key Table
        url: https://paimon.apache.org/docs/2.1/primary-key-table/
      - title: Paimon 2.1 Changelog Producer
        url: https://paimon.apache.org/docs/2.1/primary-key-table/changelog-producer/
      - title: Paimon 2.1 Compaction
        url: https://paimon.apache.org/docs/2.1/primary-key-table/compaction/
      - title: Flink Quick Start
        url: https://paimon.apache.org/docs/2.1/flink/quick-start/
      - title: Understand Files
        url: https://paimon.apache.org/docs/2.1/learn-paimon/understand-files/
    nodes:
      flink-paimon-host: {label: "Local machine", kind: host, tier: processing, x: 2, y: 0, evidence: [{type: doc, ref: "docs/reference-apache-paimon.md#§7"}]}
      flink-paimon-jobmanager: {label: "Flink JobManager", kind: scheduler, tier: processing, x: 2, y: 0, evidence: [{type: doc, ref: "docs/reference-apache-paimon.md#§7"}]}
      flink-paimon-taskmanager: {label: "Flink TaskManager", kind: host, tier: processing, x: 2, y: 0, evidence: [{type: doc, ref: "docs/reference-apache-paimon.md#§7"}]}
      flink-paimon-warehouse: {label: "Local filesystem warehouse", kind: service, tier: processing, x: 2, y: 0, evidence: [{type: doc, ref: "docs/reference-apache-paimon.md#§7"}]}
      flink-paimon-source:
        label: Flink SQL Client の試験用 INSERT
        kind: external
        tier: processing
        x: 0
        y: 1.5
        description: 同じ注文キーに対する複数回の更新を入力する。
        realizes:
          - source
        evidence:
          - type: doc
            ref: docs/reference-apache-paimon.md#§7
      flink-paimon-sink:
        label: Flink SQL・Paimon Sink
        kind: worker
        tier: processing
        x: 4
        y: 1.5
        description: Paimon コネクタを使い、パーティションとバケットへ書く。
        realizes:
          - writer
        evidence:
          - type: doc
            ref: docs/reference-apache-paimon.md#§7
      flink-paimon-reader:
        label: Flink のバッチ読み取り
        kind: service
        tier: processing
        x: 10
        y: 0.5
        description: 選んだスナップショットの論理行を確認する。
        realizes:
          - reader
        evidence:
          - type: doc
            ref: docs/reference-apache-paimon.md#§7
      flink-paimon-consumer:
        label: Flink のストリーム SELECT
        kind: external
        tier: processing
        x: 15
        y: 2.5
        description: 生成された更新を増分で受け取る。
        realizes:
          - consumer
        evidence:
          - type: doc
            ref: docs/reference-apache-paimon.md#§7
      flink-paimon-runs:
        label: warehouse 内のバケットファイル
        kind: file
        tier: lake
        x: 3
        y: 1.5
        description: テーブルの sorted run を保持する。
        realizes:
          - runs
        evidence:
          - type: doc
            ref: docs/reference-apache-paimon.md#§7
      flink-paimon-compact:
        label: Paimon コンパクション
        kind: worker
        tier: lake
        x: 7
        y: 1.5
        description: 同一キーの更新を整理する。
        realizes:
          - compact
        evidence:
          - type: doc
            ref: docs/reference-apache-paimon.md#§7
      flink-paimon-snapshot:
        label: warehouse の snapshot メタデータ
        kind: file
        tier: lake
        x: 10
        y: 0.3
        description: コミット済みのファイル集合を記録する。
        realizes:
          - snapshots
        evidence:
          - type: doc
            ref: docs/reference-apache-paimon.md#§7
      flink-paimon-changes:
        label: Paimon の lookup Changelog
        kind: service
        tier: lake
        x: 12
        y: 2.4
        description: '`lookup` を選ぶと旧値を使い更新前後を出す。'
        realizes:
          - changelog
        evidence:
          - type: doc
            ref: docs/reference-apache-paimon.md#§7
      flink-paimon-config:
        label: Paimon ファイルカタログ設定
        kind: catalog
        tier: processing
        x: 7
        y: 2.5
        description: '`CREATE CATALOG` で warehouse を指定する。'
        evidence:
          - type: doc
            ref: docs/reference-apache-paimon.md#§7
    links:
