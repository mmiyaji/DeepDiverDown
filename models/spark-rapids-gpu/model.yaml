name: Spark RAPIDS：GPU 実行と fallback
description: Spark の SQL 演算を GPU に委譲し、未対応部分を CPU に戻す構成を追う。
reference:
  objectives:
    - Spark の SQL 演算を GPU に委譲し、未対応部分を CPU に戻す構成を追う。
    - RAPIDS の資料は 24.12 を参照。
    - GPU の導入が常に高速・低コストになるわけではない。
  sources:
    - title: RAPIDS Accelerator Overview
      url: https://docs.nvidia.com/spark-rapids/user-guide/24.12/getting-started/overview.html
    - title: RAPIDS Accelerator FAQ
      url: https://docs.nvidia.com/spark-rapids/user-guide/24.12/faq.html
    - title: Spark Resource Configuration
      url: https://spark.apache.org/docs/4.3.0/configuration.html
sources:
  - docs/reference-spark-rapids-gpu.md
evidence:
  - type: doc
    ref: docs/reference-spark-rapids-gpu.md#§1
tiers:
  - id: flow
    label: 処理の流れ
    z: 0
    size:
      - 21
      - 8
nodes:
  query:
    label: SQL / DataFrame
    kind: client
    tier: flow
    x: 1
    'y': 1.5
    description: Spark アプリがクエリを発行する。
    evidence:
      - type: doc
        ref: docs/reference-spark-rapids-gpu.md#§2
  plan:
    label: Spark 物理計画
    kind: service
    tier: flow
    x: 6
    'y': 1.5
    description: Spark の計画を plugin が GPU 対応可能な演算に変換する。
    evidence:
      - type: doc
        ref: docs/reference-spark-rapids-gpu.md#§2
  plugin:
    label: RAPIDS plugin
    kind: service
    tier: flow
    x: 11
    'y': 1.5
    description: 対応する SQL 演算を GPU 実装に置き換える。
    evidence:
      - type: doc
        ref: docs/reference-spark-rapids-gpu.md#§2
  gpu:
    label: GPU と device memory
    kind: worker
    tier: flow
    x: 16
    'y': 1.5
    description: 対応する列指向演算を GPU 上で実行する。
    evidence:
      - type: doc
        ref: docs/reference-spark-rapids-gpu.md#§2
  cpu:
    label: CPU fallback
    kind: worker
    tier: flow
    x: 1
    'y': 5
    description: 非対応の演算や条件は Spark の CPU 演算に戻る。
    evidence:
      - type: doc
        ref: docs/reference-spark-rapids-gpu.md#§2
  transfer:
    label: CPU / GPU データ転送
    kind: gateway
    tier: flow
    x: 6
    'y': 5
    description: 実行境界の変換や転送は追加コストになり得る。
    evidence:
      - type: doc
        ref: docs/reference-spark-rapids-gpu.md#§2
  result:
    label: 結果と診断
    kind: db
    tier: flow
    x: 11
    'y': 5
    description: 結果を出力し explain と実行指標で GPU 化範囲を確認する。
    evidence:
      - type: doc
        ref: docs/reference-spark-rapids-gpu.md#§2
links:
  - id: plan
    from: query
    to: plan
    label: 物理計画を作成
    evidence:
      - type: doc
        ref: docs/reference-spark-rapids-gpu.md#§3
  - id: convert
    from: plan
    to: plugin
    label: GPU 対応を判定
    evidence:
      - type: doc
        ref: docs/reference-spark-rapids-gpu.md#§3
  - id: gpu
    from: plugin
    to: gpu
    label: 対応演算を実行
    evidence:
      - type: doc
        ref: docs/reference-spark-rapids-gpu.md#§3
  - id: fallback
    from: plugin
    to: cpu
    label: 未対応演算を実行
    evidence:
      - type: doc
        ref: docs/reference-spark-rapids-gpu.md#§3
  - id: move
    from: cpu
    to: transfer
    label: データを転送
    evidence:
      - type: doc
        ref: docs/reference-spark-rapids-gpu.md#§3
  - id: batch
    from: transfer
    to: gpu
    label: GPU にデータを渡す
    evidence:
      - type: doc
        ref: docs/reference-spark-rapids-gpu.md#§3
  - id: result
    from: gpu
    to: result
    label: 結果を返す
    evidence:
      - type: doc
        ref: docs/reference-spark-rapids-gpu.md#§3
  - id: cpu-result
    from: cpu
    to: result
    label: CPU 結果を返す
    evidence:
      - type: doc
        ref: docs/reference-spark-rapids-gpu.md#§3
scenarios:
  - id: flow
    label: 処理の流れ
    steps:
      - links:
          - plan
        note: 物理計画を作成。
      - links:
          - convert
        note: GPU 対応を判定。
      - links:
          - gpu
        note: 対応演算を実行。
      - links:
          - fallback
        note: 未対応演算を実行。
      - links:
          - move
        note: データを転送。
      - links:
          - batch
        note: GPU にデータを渡す。
      - links:
          - result
        note: 結果を返す。
      - links:
          - cpu-result
        note: CPU 結果を返す。
implementations:
  - id: spark-standalone
    label: 自己管理 Spark Standalone の代表構成
    description: Spark Standalone のホスト、Driver、Executor と入力・出力を使う概念的な代表例。製品・プラグイン・バージョンの互換性および実機動作は別途確認する。
    sources:
      - title: RAPIDS Accelerator Overview
        url: https://docs.nvidia.com/spark-rapids/user-guide/24.12/getting-started/overview.html
      - title: RAPIDS Accelerator FAQ
        url: https://docs.nvidia.com/spark-rapids/user-guide/24.12/faq.html
      - title: Spark Standalone Mode
        url: https://spark.apache.org/docs/4.3.0/spark-standalone.html
    tiers:
      - id: runtime
        label: 自己管理環境
        z: 0
        size:
          - 24
          - 11
    groups:
      - kind: cluster
        label: Spark Standalone クラスター
        tier:
          - runtime
        nodes:
          - ex-cluster
          - ex-plan
          - ex-plugin
          - ex-gpu
          - ex-cpu
          - ex-transfer
    nodes:
      ex-query:
        label: SQL / DataFrame
        kind: client
        tier: runtime
        x: 2
        'y': 2
        realizes:
