      ex-cpu:
        label: Executor：CPU fallback
        kind: worker
        tier: runtime
        x: 2
        'y': 6
        realizes:
          - cpu
        description: 非対応の演算や条件は Spark の CPU 演算に戻る。
        evidence:
          - type: doc
            ref: docs/reference-spark-rapids-gpu.md#§4
      ex-transfer:
        label: Executor：CPU / GPU データ転送
        kind: gateway
        tier: runtime
        x: 7
        'y': 6
        realizes:
          - transfer
        description: 実行境界の変換や転送は追加コストになり得る。
        evidence:
          - type: doc
            ref: docs/reference-spark-rapids-gpu.md#§4
      ex-result:
        label: 結果と診断
        kind: db
        tier: runtime
        x: 12
        'y': 6
        realizes:
          - result
        description: 結果を出力し explain と実行指標で GPU 化範囲を確認する。
        evidence:
          - type: doc
            ref: docs/reference-spark-rapids-gpu.md#§4
      ex-cluster:
        label: Spark Standalone の Master / Worker
        kind: host
        tier: runtime
        x: 2
        'y': 9
        description: 自己管理するホスト上で Spark Standalone クラスターの資源を管理し Driver と Executor を動かす。
        evidence:
          - type: doc
            ref: docs/reference-spark-rapids-gpu.md#§4
