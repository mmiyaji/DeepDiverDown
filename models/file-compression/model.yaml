      - title: Parquet compression
        url: https://parquet.apache.org/docs/file-format/data-pages/compression/
      - title: PyArrow Parquet writer
        url: https://arrow.apache.org/docs/python/generated/pyarrow.parquet.write_table.html
      - title: Snappy
        url: https://github.com/google/snappy/blob/main/README.md
      - title: Zstd manual
        url: https://github.com/facebook/zstd/blob/dev/doc/zstd_manual.html
      - title: GZIP RFC 1952
        url: https://www.rfc-editor.org/rfc/rfc1952
      - title: GNU gzip
        url: https://www.gnu.org/s/gzip/manual/html_node/Advanced-usage.html
      - title: Amazon EC2 instances
        url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Instances.html
      - title: Amazon EBS volumes
        url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes.html
    tiers:
      - id: host
        label: AWS の実行と保存
        z: 2
        size:
          - 16
          - 3
