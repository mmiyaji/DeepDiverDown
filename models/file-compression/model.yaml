        kind: file
        tier: write
        x: 12
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-file-compression.md#§4
        realizes:
          - stored
      ex-decompress:
        label: Parquet ページを Zstd 伸長
        kind: service
        tier: read
        x: 4
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-file-compression.md#§4
        realizes:
          - decompress
      ex-decode:
        label: Parquet 列をデコード
        kind: service
        tier: read
        x: 8
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-file-compression.md#§4
        realizes:
          - decode
      ex-consumer:
        label: 読み取り結果
        kind: file
        tier: read
        x: 12
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-file-compression.md#§4
        realizes:
          - consumer
      ex-ec2:
        label: Amazon EC2 / Linux
        kind: host
        svc: ec2
        tier: host
        x: 4
        'y': 1.5
        description: 利用者が Linux と Python の処理を管理する。
        evidence:
          - type: doc
            ref: docs/reference-file-compression.md#§4
        management: {type: shared, scope: "AWS が EC2 基盤を運用し、利用者が OS と Python アプリを管理する。"}
      ex-ebs:
        label: Amazon EBS ボリューム
        kind: db
        svc: ebs
        tier: host
        x: 12
        'y': 1.5
        description: 処理対象ファイルを保存する EC2 にアタッチされたボリューム。
        evidence:
          - type: doc
            ref: docs/reference-file-compression.md#§4
        management: {type: shared, scope: "AWS が EBS 基盤を運用し、利用者がファイル、ボリュームとバックアップを管理する。"}
    links:
      - id: parquet-zstd-host-write
        from: ex-ec2
        to: ex-encode
