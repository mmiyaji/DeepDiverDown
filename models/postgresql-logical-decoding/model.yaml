        - {kind: nodegroup, label: "PostgreSQL ホスト", tier: [diagram], x0: 0, y0: 0, x1: 4, y1: 12, nodes: [pg-connect-db-host, pg-connect-postgres, pg-connect-health]}
        - {kind: nodegroup, label: "Connect ホスト群", tier: [diagram], x0: 6, y0: 0, x1: 10, y1: 9, nodes: [pg-connect-connect-host, pg-connect-connect]}
        - {kind: nodegroup, label: "Kafka ホスト群", tier: [diagram], x0: 12, y0: 0, x1: 16, y1: 9, nodes: [pg-connect-kafka-host, pg-connect-kafka]}
    layout3d:
