name: Apache Iceberg の基本アーキテクチャ
description: テーブルメタデータからスナップショット、Manifest、データファイルをたどって読む流れを追います。
reference:
  objectives:
    - テーブルメタデータとスナップショットの関係を説明する。
    - Manifest List と Manifest を経由してデータファイルを絞り込む流れを追う。
    - スナップショットを選んだ時点読み取りの考え方を理解する。
  sources:
    - {title: Apache Iceberg Specification, url: https://iceberg.apache.org/spec/}
    - {title: Apache Iceberg Terms, url: https://iceberg.apache.org/terms/}
sources: [docs/reference-apache-iceberg.md]
evidence: [{type: doc, ref: docs/reference-apache-iceberg.md#§1}]
tiers:
  - {id: query, label: クエリとメタデータ, z: 1, size: [10,3]}
  - {id: storage, label: オブジェクトストレージ, z: 0, origin: [1,0], size: [15,3]}
nodes:
  engine: {label: SQL エンジン, kind: service, tier: query, x: 0, y: 1.5, description: テーブルを読み、スナップショットを選ぶ。, evidence: [{type: doc, ref: docs/reference-apache-iceberg.md#§1}]}
  metadata: {drill: iceberg-catalog-read, label: Table Metadata, kind: db, tier: storage, x: 3, y: 1.5, description: スキーマ、パーティション、スナップショットを記録する。, evidence: [{type: doc, ref: docs/reference-apache-iceberg.md#§2}]}
  snapshot: {label: Snapshot, kind: db, tier: storage, x: 6, y: 1.5, description: ある時点の表の状態を指す。, evidence: [{type: doc, ref: docs/reference-apache-iceberg.md#§2}]}
  list: {label: Manifest List, kind: db, tier: storage, x: 9, y: 1.5, description: スナップショットを構成する Manifest を列挙する。, evidence: [{type: doc, ref: docs/reference-apache-iceberg.md#§3}]}
  manifest: {label: Manifest, kind: db, tier: storage, x: 12, y: 1.5, description: データファイル、パーティション値、統計を保持する。, evidence: [{type: doc, ref: docs/reference-apache-iceberg.md#§3}]}
  data: {drill: parquet-internals, label: Data Files, kind: db, shape3D: crate, tier: storage, x: 15, y: 1.5, description: クエリが実際に読むデータファイル。, evidence: [{type: doc, ref: docs/reference-apache-iceberg.md#§4}]}
links:
  - {id: choose, from: engine, to: metadata, label: テーブルを解決, evidence: [{type: doc, ref: docs/reference-apache-iceberg.md#§1}]}
  - {id: select, from: metadata, to: snapshot, label: スナップショットを選択, evidence: [{type: doc, ref: docs/reference-apache-iceberg.md#§2}]}
  - {id: locate, from: snapshot, to: list, label: Manifest List を参照, evidence: [{type: doc, ref: docs/reference-apache-iceberg.md#§3}]}
  - {id: expand, from: list, to: manifest, label: Manifest を列挙, evidence: [{type: doc, ref: docs/reference-apache-iceberg.md#§3}]}
  - {id: scan, from: manifest, to: data, label: 必要なファイルを読む, evidence: [{type: doc, ref: docs/reference-apache-iceberg.md#§4}]}
  - {id: timetravel, from: engine, to: snapshot, label: 過去の snapshot を指定, evidence: [{type: doc, ref: docs/reference-apache-iceberg.md#§5}]}
scenarios:
  - id: time-travel
    label: 過去のスナップショットを読む
    evidence: [{type: doc, ref: docs/reference-apache-iceberg.md#§7}]
    steps:
      - {current: s8812, links: [choose, select], note: 通常の読み取りは current-snapshot-id（8812）を使う。}
      - {travel: s8805, highlight: [s8805], links: [timetravel], note: "FOR TIMESTAMP AS OF '2026-11-20 09:00' を指定すると、その時点で最新だったスナップショット 8805 を選ぶ。"}
      - {travel: s8805, links: [locate, expand, scan], note: 8805 の Manifest List をたどり、当時の生存ファイルだけを読む。後から上書きされた行も当時の値で読める。}
  - id: expire-snapshots
    visual: files
    label: 古いスナップショットを失効させる
    evidence: [{type: doc, ref: docs/reference-apache-iceberg.md#§7}]
    steps:
      - {"blocks": {"live":[{"id":"c1","label":"f-101","k":0},{"id":"c2","label":"f-102","k":0},{"id":"c3","label":"f-103","k":0},{"id":"c4","label":"f-110","k":2},{"id":"c5","label":"f-111","k":2}],"old":[{"id":"x1","label":"f-090","k":4,"note":"上書き前の古いファイル。8805 以前の版だけが参照する。"},{"id":"x2","label":"f-091","k":4},{"id":"x3","label":"f-092","k":4},{"id":"x4","label":"f-093","k":4}],"orphan":[{"id":"z1","label":"tmp-7f3","k":6,"note":"書き込みに失敗したジョブが残したファイル。どのメタデータも参照しない。"}]}, current: s8812, links: [select], note: スナップショットはコミットのたびに増え、古い版の Manifest とデータファイルも残り続ける。}
      - {"blocks": {"live":[{"id":"c1","label":"f-101","k":0},{"id":"c2","label":"f-102","k":0},{"id":"c3","label":"f-103","k":0},{"id":"c4","label":"f-110","k":2},{"id":"c5","label":"f-111","k":2}],"old":[{"id":"x1","label":"f-090","k":4,"note":"上書き前の古いファイル。8805 以前の版だけが参照する。"},{"id":"x2","label":"f-091","k":4},{"id":"x3","label":"f-092","k":4},{"id":"x4","label":"f-093","k":4}],"orphan":[{"id":"z1","label":"tmp-7f3","k":6,"note":"書き込みに失敗したジョブが残したファイル。どのメタデータも参照しない。"}]}, "lanes": {"old":{"sub":"失効した版だけが参照 → 削除対象","tone":"new"}}, expire: [s8801, s8803, s8805], highlight: [s8801, s8803, s8805, x1, x2, x3, x4], links: [timetravel], note: "expire_snapshots で保持期間より古い版を失効させる。失効した版へのタイムトラベルはできなくなる。"}
      - {"blocks": {"live":[{"id":"c1","label":"f-101","k":0},{"id":"c2","label":"f-102","k":0},{"id":"c3","label":"f-103","k":0},{"id":"c4","label":"f-110","k":2},{"id":"c5","label":"f-111","k":2}],"old":[],"orphan":[{"id":"z1","label":"tmp-7f3","k":6,"note":"書き込みに失敗したジョブが残したファイル。どのメタデータも参照しない。"}]}, "lanes": {"old":{"sub":"削除済み"}}, links: [scan], note: 失効した版だけが参照していたデータファイルが削除対象になる。現在の版が使うファイルは残る。}
  - {id: snapshot-read, label: 注文スナップショットを読む, evidence: [{type: doc, ref: docs/reference-apache-iceberg.md#§6}], steps: [{links: [choose, select], note: テーブルのメタデータから読みたいスナップショットを選ぶ。}, {links: [locate, expand], note: Snapshot から Manifest List と Manifest をたどる。}, {links: [scan], note: 統計で絞り込んだデータファイルだけを読む。}]}
  - {"id":"partition-evolution","label":"パーティションを月から日に変える","visual":"evolution","evidence":[{"type":"doc","ref":"docs/reference-apache-iceberg.md#§8"}],"steps":[{"links":["choose","select"],"note":"これまでのファイルは月（month）でパーティション分けされている。"},{"lanes":{"m09":{"sub":"旧仕様のまま"},"m10":{"sub":"旧仕様のまま"}},"highlight":["s1","s2","s3","o1","o2","o3"],"links":["select"],"note":"仕様を日（day）に変える。メタデータに新しい仕様を足すだけで、既存のファイルは 1 つも動かない（書き直しの費用が無い）。"},{"blocks":{"m09":[{"id":"s1","label":"09-a","k":0},{"id":"s2","label":"09-b","k":0},{"id":"s3","label":"09-c","k":0}],"m10":[{"id":"o1","label":"10-a","k":0},{"id":"o2","label":"10-b","k":0},{"id":"o3","label":"10-c","k":0}],"d01":[{"id":"n1","label":"11-01","k":2,"note":"新しい仕様（day）で書いたファイル"}],"d02":[{"id":"n2","label":"11-02","k":2}],"d03":[{"id":"n3","label":"11-03","k":2}]},"links":["scan"],"note":"以後に書くファイルだけが、日ごとのパーティションに置かれる。"},{"blocks":{"m09":[{"id":"s1","label":"09-a","k":0},{"id":"s2","label":"09-b","k":0},{"id":"s3","label":"09-c","k":0}],"m10":[{"id":"o1","label":"10-a","k":0},{"id":"o2","label":"10-b","k":0},{"id":"o3","label":"10-c","k":0}],"d01":[{"id":"n1","label":"11-01","k":2,"note":"新しい仕様（day）で書いたファイル"}],"d02":[{"id":"n2","label":"11-02","k":2}],"d03":[{"id":"n3","label":"11-03","k":2}]},"highlight":["n2"],"lanes":{"m09":{"tone":"down","sub":"範囲外"},"m10":{"tone":"down","sub":"範囲外"},"d01":{"tone":"down"},"d03":{"tone":"down"}},"links":["locate","expand","scan"],"note":"WHERE が 11-02 のクエリは、旧仕様のファイルを月の範囲で、新仕様のファイルを日で、それぞれ絞り込む。"}]}
  - {"id":"remove-orphans","label":"孤立ファイルを掃除する","visual":"files","evidence":[{"type":"doc","ref":"docs/reference-apache-iceberg.md#§8"}],"steps":[{"blocks":{"live":[{"id":"c1","label":"f-101","k":0},{"id":"c2","label":"f-102","k":0},{"id":"c3","label":"f-103","k":0},{"id":"c4","label":"f-110","k":2},{"id":"c5","label":"f-111","k":2}],"old":[],"orphan":[{"id":"z1","label":"tmp-7f3","k":6,"note":"書き込みに失敗したジョブが残したファイル。どのメタデータも参照しない。"}]},"highlight":["z1"],"links":["scan"],"note":"失敗したジョブが書き込んだまま、どのメタデータからも参照されないファイルが残っている。"},{"blocks":{"live":[{"id":"c1","label":"f-101","k":0},{"id":"c2","label":"f-102","k":0},{"id":"c3","label":"f-103","k":0},{"id":"c4","label":"f-110","k":2},{"id":"c5","label":"f-111","k":2}],"old":[],"orphan":[]},"links":["scan"],"note":"remove_orphan_files で、一定期間より古い未参照ファイルを削除する（書き込み中のファイルを消さないよう猶予を置く）。"}]}
timeline:
  title: events テーブルのスナップショット
  current: s8812
  note: "コミットのたびにスナップショットが 1 つ増える。数値・時刻は説明用。"
  commits:
    - {id: s8801, label: "8801", time: "11-18 02:00", kind: append, node: snapshot, description: 日次の追記。, sample: "operation: append\nadded-data-files: 24, added-records: 3,120,000"}
    - {id: s8803, label: "8803", time: "11-19 02:00", kind: append, node: snapshot}
    - {id: s8805, label: "8805", time: "11-20 02:00", kind: append, node: snapshot, description: タイムトラベルの例で読む版。11-20 09:00 時点で最新だった。}
    - {id: s8807, label: "8807", time: "11-20 14:30", kind: overwrite, node: snapshot, description: 誤データの訂正で一部のファイルを置き換えた版。, sample: "operation: overwrite\ndeleted-data-files: 3, added-data-files: 3"}
    - {id: s8809, label: "8809", time: "11-21 02:00", kind: append, node: snapshot}
    - {id: s8810, label: "8810", time: "11-21 05:00", kind: compact, node: snapshot, description: コンパクションで小さなファイルをまとめた版。行の内容は変わらない。, sample: "operation: replace\ndeleted-data-files: 32, added-data-files: 3"}
    - {id: s8811, label: "8811", time: "11-22 02:00", kind: delete, node: snapshot, description: 行単位の削除（位置削除ファイルの追加）。}
    - {id: s8812, label: "8812", time: "11-23 02:00", kind: append, node: snapshot, description: 現在の版（current-snapshot-id）。}
