name: K3s によるエッジクラスタ
description: 軽量 Kubernetes のサーバー、エージェントと現場のワークロードを整理する。
reference:
  objectives:
    - サーバーとエージェントの役割を区別する。
    - 単一サーバー構成の状態保存と現場処理を追う。
  sources:
    - title: K3s architecture
      url: https://docs.k3s.io/architecture
    - title: K3s datastore
      url: https://docs.k3s.io/datastore
sources:
  - docs/reference-edge-k3s.md
evidence:
  - type: doc
    ref: docs/reference-edge-k3s.md#§1
  - type: doc
    ref: docs/reference-edge-k3s.md#§3
tiers:
  - id: flow
    label: クラスタ管理と実行
    z: 1
    size:
      - 20
      - 3
  - id: support
    label: 状態と現場
    z: 0
    size:
      - 20
      - 3
nodes:
  admin:
    label: 運用者
    kind: actor
    tier: flow
    x: 0
    'y': 1.5
    description: クラスタを管理する。
    evidence:
      - type: doc
        ref: docs/reference-edge-k3s.md#§2
  server:
    label: 管理サーバー
    kind: service
    tier: flow
    x: 4
    'y': 1.5
    description: API とクラスタ管理を担う。
    drill: k3s
    evidence:
      - type: doc
        ref: docs/reference-edge-k3s.md#§2
  agent:
    label: エッジノード
    kind: service
    tier: flow
    x: 8
    'y': 1.5
    description: ワークロードを実行する。
    evidence:
      - type: doc
        ref: docs/reference-edge-k3s.md#§2
  workload:
    label: 現場の処理
    kind: service
    tier: flow
    x: 12
    'y': 1.5
    description: センサー値の処理を行う例。
    evidence:
      - type: doc
        ref: docs/reference-edge-k3s.md#§2
  state:
    label: クラスタ状態
    kind: db
    tier: support
    x: 4
    'y': 1.5
    description: 単一サーバー構成の状態を保存する。
    evidence:
      - type: doc
        ref: docs/reference-edge-k3s.md#§2
  sensor:
    label: 現場センサー
    kind: external
    tier: support
    x: 12
    'y': 1.5
    description: 現場から値を提供する。
    evidence:
      - type: doc
        ref: docs/reference-edge-k3s.md#§2
links:
  - id: manage
    from: admin
    to: server
    label: クラスタを管理
    evidence:
      - type: doc
        ref: docs/reference-edge-k3s.md#§2
  - id: schedule
    from: server
    to: agent
    label: ワークロードを配置
    evidence:
      - type: doc
        ref: docs/reference-edge-k3s.md#§2
  - id: run
    from: agent
    to: workload
    label: Pod を実行
    evidence:
      - type: doc
        ref: docs/reference-edge-k3s.md#§2
  - id: store
    from: server
    to: state
    label: 状態を保存
    evidence:
      - type: doc
        ref: docs/reference-edge-k3s.md#§2
  - id: observe
    from: sensor
    to: workload
    label: 現場データを入力
    evidence:
      - type: doc
        ref: docs/reference-edge-k3s.md#§2
scenarios:
  - id: edge
    label: 現場処理の配置
    evidence:
      - type: doc
        ref: docs/reference-edge-k3s.md#§2
    steps:
      - links:
          - manage
          - store
          - schedule
          - run
        note: 管理者がワークロードを配置する。
      - links:
          - observe
        note: 現場センサーの値を処理する。
implementations:
  - id: example
    label: 単一サーバーの自主管理 K3s
    description: K3s Server、SQLite と Agent を使う最小構成例。クラウド提供サービスは仮定しない。
    sources:
      - title: K3s architecture
        url: https://docs.k3s.io/architecture
      - title: K3s datastore
        url: https://docs.k3s.io/datastore
    tiers:
      - id: flow
        label: クラスタ管理と実行
        z: 1
        size:
          - 20
          - 3
      - id: support
        label: 状態と現場
        z: 0
        size:
          - 20
          - 3
    nodes:
      ex-server-host: {label: 現場 Server ホスト, kind: host, tier: flow, x: 3, y: 2, description: K3s Server と SQLite が稼働する利用者管理のホスト。, evidence: [{type: doc, ref: docs/reference-edge-k3s.md#§4}]}
      ex-agent-host: {label: 現場 Agent ホスト, kind: host, tier: flow, x: 9, y: 2, description: K3s Agent と Pod が稼働する利用者管理のホスト。, evidence: [{type: doc, ref: docs/reference-edge-k3s.md#§4}]}
      ex-admin:
        label: 運用者
        kind: actor
        tier: flow
        x: 0
        'y': 1.5
        description: クラスタを管理する。
        realizes:
          - admin
        evidence:
          - type: doc
            ref: docs/reference-edge-k3s.md#§4
      ex-server:
        label: K3s Server
        kind: service
        tier: flow
        x: 4
        'y': 1.5
        description: API とクラスタ管理を担う。
        drill: k3s
        realizes:
          - server
        evidence:
          - type: doc
            ref: docs/reference-edge-k3s.md#§4
      ex-agent:
        label: K3s Agent
        kind: service
        tier: flow
        x: 8
        'y': 1.5
        description: ワークロードを実行する。
        realizes:
          - agent
        evidence:
          - type: doc
            ref: docs/reference-edge-k3s.md#§4
      ex-workload:
        label: エッジ処理 Pod
        kind: service
        tier: flow
        x: 12
        'y': 1.5
        description: センサー値の処理を行う例。
        realizes:
          - workload
        evidence:
          - type: doc
            ref: docs/reference-edge-k3s.md#§4
      ex-state:
        label: SQLite
        kind: db
        tier: support
        x: 4
        'y': 1.5
        description: 単一サーバー構成の状態を保存する。
        realizes:
          - state
        evidence:
          - type: doc
            ref: docs/reference-edge-k3s.md#§4
      ex-sensor:
        label: センサー
        kind: external
        tier: support
        x: 12
        'y': 1.5
        description: 現場から値を提供する。
        realizes:
          - sensor
        evidence:
          - type: doc
            ref: docs/reference-edge-k3s.md#§4
    links:
      - {id: ex-server-hosts, from: ex-server-host, to: ex-server, label: K3s Server を実行, evidence: [{type: doc, ref: docs/reference-edge-k3s.md#§4}]}
      - {id: ex-agent-hosts, from: ex-agent-host, to: ex-agent, label: K3s Agent を実行, evidence: [{type: doc, ref: docs/reference-edge-k3s.md#§4}]}

    layout2d:
      tiers: [{id: diagram, label: 現場と管理区画, z: 0, origin: [-4, 0], size: [23, 11]}]
      nodes:
        ex-admin: {tier: diagram, x: -3, y: 1}
        ex-server-host: {tier: diagram, x: 2, y: 2}
        ex-server: {tier: diagram, x: 3, y: 4}
        ex-state: {tier: diagram, x: 3, y: 7}
        ex-agent-host: {tier: diagram, x: 8, y: 2}
        ex-agent: {tier: diagram, x: 9, y: 4}
        ex-workload: {tier: diagram, x: 9, y: 7}
        ex-sensor: {tier: diagram, x: 14, y: 6}
      groups:
        - {kind: datacenter, label: 現場 Server ホスト, tier: [diagram], x0: 0, y0: 0, x1: 6, y1: 9, nodes: [ex-server-host, ex-server, ex-state]}
        - {kind: datacenter, label: 現場エッジ端末, tier: [diagram], x0: 6.5, y0: 0, x1: 13, y1: 9, nodes: [ex-agent-host, ex-agent, ex-workload]}
    layout3d:
      tiers:
        - {id: left, label: 管理側ホスト, z: 0, size: [6, 5]}
        - {id: leftapps, label: 管理側コンポーネント, z: 1, size: [6, 5]}
        - {id: right, label: 現場端末, z: 0, origin: [9, 0], size: [6, 5]}
        - {id: rightapps, label: 現場の処理, z: 1, origin: [9, 0], size: [6, 5]}
        - {id: external, label: 運用端末・現場機器, z: 0, origin: [18, 0], size: [5, 5]}
      nodes:
        ex-server-host: {tier: left, x: 1, y: 1}
        ex-server: {tier: leftapps, x: 3, y: 1}
        ex-state: {tier: leftapps, x: 1, y: 3}
        ex-agent-host: {tier: right, x: 1, y: 1}
        ex-agent: {tier: rightapps, x: 3, y: 1}
        ex-workload: {tier: rightapps, x: 1, y: 3}
        ex-admin: {tier: external, x: 1, y: 1}
        ex-sensor: {tier: external, x: 3, y: 1}
      groups:
        - {kind: datacenter, label: 現場 Server ホスト, tier: [left, leftapps], nodes: [ex-server-host, ex-server, ex-state]}
        - {kind: datacenter, label: 現場エッジ端末, tier: [right, rightapps], nodes: [ex-agent-host, ex-agent, ex-workload]}

  - id: site-ubuntu-sqlite
    label: "現場 LAN：Ubuntu・K3s Server / Raspberry Pi Agent"
    description: "現場 LAN の Ubuntu サーバーで K3s API と SQLite を稼働させ、Ubuntu の Raspberry Pi Agent でセンサーデータ処理を行う構成例。"
    sources:
      - {title: "K3s architecture", url: https://docs.k3s.io/architecture}
      - {title: "K3s requirements and ports", url: https://docs.k3s.io/installation/requirements}
      - {title: "K3s Flannel network options", url: https://docs.k3s.io/installation/network-options}
      - {title: "K3s datastore backup and restore", url: https://docs.k3s.io/datastore/backup-restore}
    tiers:
      - {id: admin, label: "運用端末", z: 2, size: [20, 4]}
      - {id: server, label: "現場サーバー", z: 1, size: [20, 4]}
      - {id: edge, label: "現場エッジノードとセンサー", z: 0, size: [20, 4]}
    groups:
      - {kind: datacenter, label: "Ubuntu 24.04 Server / x86-64・SSD", provider: onprem, tier: [server], nodes: [site-k3s-server, site-k3s-data]}
      - {kind: datacenter, label: "Raspberry Pi / Ubuntu 24.04 arm64", provider: onprem, tier: [edge], nodes: [site-k3s-agent, site-k3s-pod]}
    nodes:
      site-k3s-admin: {label: "運用 PC / kubectl", kind: actor, tier: admin, x: 4, y: 1.5, realizes: [admin], description: "現場 LAN から K3s API に接続し、Kubernetes リソースを管理する。", evidence: [{type: doc, ref: "docs/reference-edge-k3s.md#§5"}]}
      site-k3s-server: {label: "Ubuntu サーバー上の K3s Server / systemd", kind: service, tier: server, x: 5, y: 1.5, realizes: [server], description: "単一の Ubuntu ホストで Kubernetes API、スケジューラーと supervisor を動かす。", evidence: [{type: doc, ref: "docs/reference-edge-k3s.md#§5"}]}
      site-k3s-data: {label: "内蔵 SQLite / サーバー SSD", kind: db, tier: server, x: 14, y: 1.5, realizes: [state], description: "K3s のクラスタ状態をホストのデータディレクトリに保存する。", evidence: [{type: doc, ref: "docs/reference-edge-k3s.md#§5"}]}
      site-k3s-agent: {label: "Raspberry Pi 上の K3s Agent / kubelet・containerd", kind: host, tier: edge, x: 4, y: 1.5, realizes: [agent], description: "Raspberry Pi でエージェントを実行し、管理サーバーへ TLS で接続する。", evidence: [{type: doc, ref: "docs/reference-edge-k3s.md#§5"}]}
      site-k3s-pod: {label: "センサーデータ処理 Pod", kind: worker, tier: edge, x: 10, y: 1.5, realizes: [workload], description: "arm64 対応イメージを使い、センサーの LAN インターフェースからデータを読む。", evidence: [{type: doc, ref: "docs/reference-edge-k3s.md#§5"}]}
      site-k3s-sensor: {label: "LAN 接続の現場センサー", kind: external, tier: edge, x: 17, y: 1.5, realizes: [sensor], description: "センサー固有のプロトコルで観測値を提供する。", evidence: [{type: doc, ref: "docs/reference-edge-k3s.md#§5"}]}
    links:
      - {id: site-k3s-connect, from: site-k3s-agent, to: site-k3s-server, label: "TCP 6443 へ接続し登録・状態を送る", evidence: [{type: doc, ref: "docs/reference-edge-k3s.md#§5"}]}
      - {id: site-k3s-assign, from: site-k3s-server, to: site-k3s-agent, label: "接続済み Agent へ Pod の設定を通知", realizes: [schedule], replace: true, evidence: [{type: doc, ref: "docs/reference-edge-k3s.md#§5"}]}
      - {id: site-k3s-pod-net, from: site-k3s-agent, to: site-k3s-server, label: "Flannel VXLAN のノード間通信", evidence: [{type: doc, ref: "docs/reference-edge-k3s.md#§5"}]}
      - {id: site-k3s-observe, from: site-k3s-sensor, to: site-k3s-pod, label: "現場 LAN で観測値を渡す", realizes: [observe], replace: true, evidence: [{type: doc, ref: "docs/reference-edge-k3s.md#§5"}]}

    layout2d:
      tiers: [{id: diagram, label: 現場と管理区画, z: 0, origin: [-4, 0], size: [23, 11]}]
      nodes:
        site-k3s-admin: {tier: diagram, x: -3, y: 1}
        site-k3s-server: {tier: diagram, x: 3, y: 3}
        site-k3s-data: {tier: diagram, x: 3, y: 7}
        site-k3s-agent: {tier: diagram, x: 9, y: 3}
        site-k3s-pod: {tier: diagram, x: 9, y: 7}
        site-k3s-sensor: {tier: diagram, x: 15.5, y: 6}
      groups:
        - {kind: datacenter, label: 現場 Server ホスト, tier: [diagram], x0: 0, y0: 0, x1: 6, y1: 9, nodes: [site-k3s-server, site-k3s-data]}
        - {kind: datacenter, label: 現場エッジ端末, tier: [diagram], x0: 6.5, y0: 0, x1: 13, y1: 9, nodes: [site-k3s-agent, site-k3s-pod]}
    layout3d:
      tiers:
        - {id: left, label: 管理側ホスト, z: 0, size: [6, 5]}
        - {id: leftapps, label: 管理側コンポーネント, z: 1, size: [6, 5]}
        - {id: right, label: 現場端末, z: 0, origin: [9, 0], size: [6, 5]}
        - {id: rightapps, label: 現場の処理, z: 1, origin: [9, 0], size: [6, 5]}
        - {id: external, label: 運用端末・現場機器, z: 0, origin: [18, 0], size: [5, 5]}
      nodes:
        site-k3s-server: {tier: left, x: 1, y: 1}
        site-k3s-data: {tier: leftapps, x: 3, y: 1}
        site-k3s-agent: {tier: right, x: 1, y: 1}
        site-k3s-pod: {tier: rightapps, x: 3, y: 1}
        site-k3s-admin: {tier: external, x: 1, y: 1}
        site-k3s-sensor: {tier: external, x: 3, y: 1}
      groups:
        - {kind: datacenter, label: 現場 Server ホスト, tier: [left, leftapps], nodes: [site-k3s-server, site-k3s-data]}
        - {kind: datacenter, label: 現場エッジ端末, tier: [right, rightapps], nodes: [site-k3s-agent, site-k3s-pod]}
