      - title: Prometheus data model
        url: https://prometheus.io/docs/concepts/data_model/
    tiers:
      - id: write
        label: 処理と検索
        z: 1
        size:
          - 21
          - 4
      - id: disk
        label: データと保存
        z: 0
        size:
          - 21
          - 4
    nodes:
      ex-scrape:
        label: 監視対象のメトリクス
