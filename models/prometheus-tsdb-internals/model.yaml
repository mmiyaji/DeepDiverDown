          - disk
        nodes:
          - ex-scrape
          - ex-head
          - ex-wal
          - ex-blocks
          - ex-index
          - ex-compact
          - ex-query
blocks:
  - id: detail-map
    title: サンプル・WAL・ブロックの対応
    note: 概念例です。WAL は復旧用の記録で、Head とブロックの単純な移動を示すものではありません。
    hint: 項目を選ぶと説明を表示します。処理の流れに合わせて関連する項目を強調します。
    lanes:
      - id: head
        label: Head
        node: head
      - id: wal
        label: WAL
        node: wal
      - id: block
        label: 時間別ブロック
        node: blocks
    items:
      head:
        - id: h1
          label: CPU系列
          k: 0
          note: メモリ上の最近のサンプル。
        - id: h2
          label: メモリ系列
          k: 0
          note: 別のラベルを持つ系列の例。
      wal:
        - id: w1
          label: ログ
          k: 1
          note: 障害時に Head を復旧するための記録。
      block:
        - id: b1
          label: chunks
          k: 2
          note: 時間範囲内の系列サンプル。
        - id: b2
          label: index
          k: 3
          note: 系列を探すための索引。
        - id: b3
          label: meta
          k: 4
          note: ブロックのメタデータ。
