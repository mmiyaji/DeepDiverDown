name: BigQuery のストレージ・コンピュート分離アーキテクチャ
description: BigQuery APIを入口に、データセットと管理ストレージをクエリ実行基盤から分離する流れを追います。
reference:
  objectives:
    - BigQuery のリソース階層とデータセットの役割を区別する。
    - 管理ストレージとクエリコンピュートが独立して伸縮する理由を理解する。
    - ロードとクエリが API、データセット、ワーカーを通る流れを追う。
  sources:
    - title: BigQuery overview
      url: https://cloud.google.com/bigquery/docs/introduction
    - title: Overview of BigQuery storage
      url: https://cloud.google.com/bigquery/docs/storage_overview
    - title: Introduction to the resource hierarchy
      url: https://cloud.google.com/bigquery/docs/resource-hierarchy
    - title: Query plan and timeline
      url: https://cloud.google.com/bigquery/docs/query-plan-explanation
    - title: Overview of BigQuery analytics
      url: https://cloud.google.com/bigquery/docs/query-overview
    - title: Apache Iceberg managed tables in BigQuery
      url: https://docs.cloud.google.com/bigquery/docs/iceberg-tables
sources:
  - docs/reference-bigquery.md
evidence:
  - type: doc
    ref: docs/reference-bigquery.md#§1
  - type: doc
    ref: docs/reference-bigquery.md#§7
  - type: doc
    ref: docs/reference-bigquery.md#§8
  - type: doc
    ref: docs/reference-bigquery.md#§10
tiers:
  - id: interface
    label: 利用と管理
    z: 2
    size:
      - 12
      - 3
  - id: data
    label: 永続データ
    z: 0
    size:
      - 8
      - 3
  - id: compute
    label: クエリコンピュート
    z: 1
    origin:
      - 1
      - 0
    size:
      - 8
      - 3
nodes:
  client:
    label: ジョブ実行クライアント
    kind: external
    tier: interface
    x: 0
    'y': 1.5
    description: コンソール、CLI、APIクライアントからジョブを送る利用者側の入口。
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§1
  api:
    label: SQL 計画とステージ分割
    kind: worker
    tier: interface
    x: 4
    'y': 1.5
    description: SQLを複数のステージからなる実行グラフへ分解する。
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§6
  bi:
    label: BI 利用者
    kind: actor
    tier: interface
    x: 8
    'y': 1.5
    description: クエリ結果を分析に利用する利用者。
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§7
  dataset:
    label: 分析テーブルの名前空間
    kind: db
    tier: data
    x: 1
    'y': 1.5
    description: テーブルやビューをまとめて権限と所在を管理する。
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§2
  storage:
    label: 管理された列指向ストレージ
    kind: db
    tier: data
    x: 6
    'y': 1.5
    description: 列指向のテーブルデータを保持する管理ストレージ。
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§3
  iceberg:
    label: Iceberg テーブルとカタログ（Lakehouse for Apache Iceberg、旧 BigLake）
    kind: catalog
    tier: data
    x: 3.5
    'y': 2.6
    description: 利用者の Cloud Storage に置く Iceberg テーブルと REST カタログ。BigQuery と外部エンジンが共有する。名称は旧 BigLake。
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§10
  engine:
    slots: 8
    label: 並列クエリ実行枠
    kind: worker
    tier: compute
    x: 2
    'y': 1.5
    description: ステージの作業単位を実行枠が並列に処理する。
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§6
  workers:
    label: 分散シャッフル
    kind: queue
    tier: compute
    x: 7
    'y': 1.5
    description: ステージ間の中間データを保持して次のステージへ渡す分散層。
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§6
links:
  - id: submit
    from: client
    to: api
    label: ジョブを送信
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§1
      - type: doc
        ref: docs/reference-bigquery.md#§5
  - id: bi-submit
    from: bi
    to: api
    label: 分析クエリを送信
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§5
  - id: organize
    from: api
    to: dataset
    label: データセットを指定
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§2
  - id: persist
    from: dataset
    to: storage
    label: テーブルを保持
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§3
  - id: plan
    from: api
    to: engine
    label: 実行ステージを並列計算に割り当てる
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§6
  - id: scan
    from: engine
    to: storage
    label: 必要なデータを読む
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§4
      - type: doc
        ref: docs/reference-bigquery.md#§6
  - id: distribute
    from: engine
    to: workers
    label: 中間データをshuffle
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§6
  - id: lake-read
    from: engine
    to: iceberg
    label: Iceberg テーブルを読む
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§10
  - id: aggregate
    from: workers
    to: engine
    label: 次のステージへ渡す
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§6
  - id: serve
    from: engine
    to: bi
    label: 結果を返す
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§5
scenarios:
  - id: load-query
    label: 取り込み後にクエリする
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§1
      - type: doc
        ref: docs/reference-bigquery.md#§3
      - type: doc
        ref: docs/reference-bigquery.md#§4
      - type: doc
        ref: docs/reference-bigquery.md#§5
      - type: doc
        ref: docs/reference-bigquery.md#§6
      - type: doc
        ref: docs/reference-bigquery.md#§7
    steps:
      - links:
          - submit
          - organize
        note: 受付。クライアントがBigQuery APIへロードジョブを送り、対象データセットを指定する。
      - links:
          - persist
        note: 保存。データセットのテーブルデータを管理ストレージへ保持する。
      - links:
          - bi-submit
          - plan
        note: 実行。BI利用者のクエリをステージへ分解し、スロットが処理する。
      - links:
          - scan
          - distribute
        note: 分散。スロットがストレージを読み、中間データを分散shuffleへ書く。
      - links:
          - aggregate
          - serve
        note: 返却。shuffleの中間結果を次のステージで集約し、分析利用者へ返す。
  - id: independent-scale
    label: ストレージとコンピュートを別に伸縮する
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§3
      - type: doc
        ref: docs/reference-bigquery.md#§4
    steps:
      - links:
          - persist
        note: データ量。テーブルは管理ストレージに蓄積される。
      - links:
          - scan
          - distribute
        note: 需要。クエリ需要に応じてワーカーへ処理を分散する。
      - links:
          - aggregate
        note: 分離。ステージ間のshuffleを介して、ストレージとコンピュートを独立に扱う。
requirements:
  - id: BR-01
    kind: usecase
    title: 分離した分析基盤
    text: 管理ストレージに保持したテーブルをステージとスロットで分析する。
    links:
      - persist
      - plan
      - scan
      - serve
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§3
      - type: doc
        ref: docs/reference-bigquery.md#§6
  - id: NFR-01
    kind: nfr
    title: 独立した伸縮
    text: ストレージとコンピュートを別々にリソース割り当てできる。
    links:
      - persist
      - distribute
    evidence:
      - type: doc
        ref: docs/reference-bigquery.md#§4
unknowns:
  - id: UNK-01
    text: 実際のプロジェクト、リージョン、予約スロット、権限設定は未確定。
    refs:
      - api
      - storage
      - workers
gates:
  maxDrift: 0
  maxHigh: 0
implementations:
  - id: bq-reservation
    label: BigQuery と Cloud Storage の受注分析
    description: Cloud Storage から同一ロケーションの BigQuery データセットへロードし、分析プロジェクトのクエリに予約を割り当てる例。
    sources:
      - title: BigQuery overview
        url: https://cloud.google.com/bigquery/docs/introduction
      - title: Overview of BigQuery storage
        url: https://cloud.google.com/bigquery/docs/storage_overview
      - title: Introduction to the resource hierarchy
        url: https://cloud.google.com/bigquery/docs/resource-hierarchy
      - title: Query plan and timeline
        url: https://cloud.google.com/bigquery/docs/query-plan-explanation
      - title: Overview of BigQuery analytics
        url: https://cloud.google.com/bigquery/docs/query-overview
      - title: BigQuery のワークロード管理
        url: https://docs.cloud.google.com/bigquery/docs/reservations-intro
      - title: Cloud Storage の CSV をロード
        url: https://docs.cloud.google.com/bigquery/docs/loading-data-cloud-storage-csv
      - {title: BigQuery の予約割り当て, url: https://docs.cloud.google.com/bigquery/docs/reservations-assignments}
      - {title: BigQuery のバッチロードと容量, url: https://docs.cloud.google.com/bigquery/docs/batch-loading-data}
    tiers:
      - id: interface
        label: 利用と管理
        z: 2
        size:
          - 12
          - 3
      - id: data
        label: 永続データ
        z: 0
        size:
          - 8
          - 3
      - id: compute
        label: クエリコンピュート
        z: 1
        origin:
          - 1
          - 0
        size:
          - 8
          - 3
      - id: implementation-setup
        label: 実装時の設定・観測
        z: 3
        size:
          - 17
          - 3
    groups:
      - kind: cloud
        label: Google Cloud 分析環境
        provider: gcp
        tier:
          - interface
          - data
          - compute
          - implementation-setup
        nodes: [example-api, example-dataset, example-engine, example-gcs, example-loader, example-reservation, example-iceberg]
    nodes:
      example-client:
        label: bq CLI を使う投入端末
        kind: external
        tier: interface
        x: 0
        'y': 1.5
        realizes:
          - client
        description: 受注ファイルの URI と出力テーブルを指定してロードジョブを送信する。
        evidence:
          - type: doc
            ref: docs/reference-bigquery.md#§9
      example-api:
        label: BigQuery ジョブとクエリ計画
        kind: worker
        tier: interface
        x: 4
        'y': 1.5
        realizes:
          - api
        description: ジョブを受け付け、クエリのステージを作る。
        evidence:
          - type: doc
            ref: docs/reference-bigquery.md#§9
        svc: gcp:bigquery
      example-bi:
        label: BigQuery Studio を使う分析者
        kind: actor
        tier: interface
        x: 8
        'y': 1.5
        realizes:
          - bi
        description: 分析プロジェクトの資格情報でクエリする。
        evidence:
          - type: doc
            ref: docs/reference-bigquery.md#§9
      example-dataset:
        label: BigQuery sales データセットと管理表
        kind: table
        tier: data
        x: 1
        'y': 1.5
        svc: gcp:bigquery
        realizes:
          - dataset
          - storage
        description: ロケーションを設定し、受注データを BigQuery の管理ストレージに保持する。
        evidence:
          - type: doc
            ref: docs/reference-bigquery.md#§9
      example-engine:
        label: BigQuery のクエリステージと実行スロット
        kind: worker
        tier: compute
        x: 2
        'y': 1.5
        realizes:
          - engine
          - workers
        description: 分析プロジェクトにクエリジョブの予約割当を付け、実行時のステージとシャッフルはクエリ計画で確認する。
        evidence:
          - type: doc
            ref: docs/reference-bigquery.md#§9
        svc: gcp:bigquery
      example-gcs:
        label: Cloud Storage の取込バケット
        kind: file
        tier: implementation-setup
        x: 1
        'y': 1.5
        svc: gcp:gcs
        description: データセットとロケーション要件を満たす場所に CSV を着地させる。
        evidence:
          - type: doc
            ref: docs/reference-bigquery.md#§9
      example-loader: {label: BigQuery（CSV ロードジョブ）, svc: gcp:bigquery, kind: worker, tier: implementation-setup, x: 6, y: 1.5, description: Google 管理のロード処理が Cloud Storage から CSV を読み管理表へ保存する。利用者は API からジョブと権限を指定する。, evidence: [{type: doc, ref: docs/reference-bigquery.md#§9}]}
      example-iceberg: {label: BigQuery の Iceberg 管理テーブルとカタログ, svc: gcp:bigquery, kind: catalog, tier: implementation-setup, x: 6, y: 0.2, realizes: [iceberg], description: 利用者の Cloud Storage に置く Iceberg テーブル。詳細は Iceberg レイクハウスの図で扱う。, evidence: [{type: doc, ref: docs/reference-bigquery.md#§10}]}
      example-reservation: {label: BigQuery（QUERY 予約割当）, svc: gcp:bigquery, kind: policy, tier: implementation-setup, x: 12, y: 1.5, description: 利用者が同一ロケーションの QUERY 予約を分析プロジェクトに割り当てる。ロードは既定の共有プールを利用する。, evidence: [{type: doc, ref: docs/reference-bigquery.md#§9}]}
    links:
      - id: example-gcs-connection
        from: example-gcs
        to: example-loader
        label: Cloud Storage から CSV を読み取る
        evidence:
          - type: doc
            ref: docs/reference-bigquery.md#§9
      - {id: example-submit-load, from: example-client, to: example-loader, label: ファイル URI を指定してロード, realizes: [submit], replace: true}
      - {id: example-load-table, from: example-loader, to: example-dataset, label: BigQuery 管理テーブルに保存, realizes: [organize, persist], replace: true}
      - {id: example-use-reservation, from: example-reservation, to: example-engine, label: クエリジョブに予約スロットを割り当てる}

    layout2d:
      tiers:
        - {id: diagram, label: BigQuery 受注分析, z: 0, size: [23, 12]}
      nodes:
        example-client: {tier: diagram, x: 1, y: 2}
        example-bi: {tier: diagram, x: 1, y: 8}
        example-gcs: {tier: diagram, x: 7, y: 2}
        example-loader: {tier: diagram, x: 12, y: 2}
        example-dataset: {tier: diagram, x: 18, y: 2}
        example-api: {tier: diagram, x: 7, y: 8}
        example-engine: {tier: diagram, x: 12, y: 8}
        example-iceberg: {tier: diagram, x: 18, y: 5}
        example-reservation: {tier: diagram, x: 18, y: 8}
      groups:
        - {kind: cloud, label: Google Cloud 分析プロジェクト（サービスの論理的所属）, provider: gcp, tier: [diagram], x0: 4.3, y0: -0.5, x1: 21.5, y1: 11.5, nodes: [example-gcs, example-loader, example-dataset, example-api, example-engine, example-reservation, example-iceberg]}
    layout3d:
      tiers:
        - {id: clients, label: 利用者, kind: origin, z: 0, origin: [-5, 0], size: [3, 7]}
        - {id: input, label: Cloud Storage, z: 0, size: [4, 7]}
        - {id: bigquery, label: BigQuery ジョブと管理データ, z: 0, origin: [8, 0], size: [17, 7]}
      nodes:
        example-client: {tier: clients, x: 1, y: 1}
        example-bi: {tier: clients, x: 1, y: 5}
        example-gcs: {tier: input, x: 2, y: 3}
        example-loader: {tier: bigquery, x: 2, y: 1}
        example-dataset: {tier: bigquery, x: 7, y: 1}
        example-api: {tier: bigquery, x: 2, y: 5}
        example-engine: {tier: bigquery, x: 7, y: 5}
        example-iceberg: {tier: bigquery, x: 13, y: 1}
        example-reservation: {tier: bigquery, x: 13, y: 5}
      groups:
        - {kind: cloud, label: Google Cloud 分析プロジェクト（サービスの論理的所属）, provider: gcp, tier: [input, bigquery], nodes: [example-gcs, example-loader, example-dataset, example-api, example-engine, example-reservation, example-iceberg]}
