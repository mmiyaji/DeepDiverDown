name: "Argo CD の GitOps 同期とセルフヒール"
description: "注文 API の Deployment を例に、Git の更新による自動同期と、クラスタで発生した差分のセルフヒールを追います。"
reference:
  objectives:
    - "Git の目標状態と Kubernetes の実状態をどこで比較するか理解する。"
    - "Git 側の変更と実環境のみの変更が起こす同期の違いを追う。"
    - "自動同期と selfHeal の設定が担当する動作を区別する。"
  sources:
    - {title: "Argo CD Architectural Overview", url: "https://argo-cd.readthedocs.io/en/stable/operator-manual/architecture/"}
    - {title: "Argo CD Automated Sync Policy", url: "https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/"}
    - {title: "Argo CD Diffing Customization", url: "https://argo-cd.readthedocs.io/en/stable/user-guide/diffing/"}
sources: [docs/reference-argo-cd.md]
evidence: [{type: doc, ref: "docs/reference-argo-cd.md#§1"}]
tiers:
  - {id: "inputs", label: "変更の入力", z: 2, size: [15,4], kind: "origin"}
  - {id: "gitops", label: "Argo CD", z: 1, size: [15,4]}
  - {id: "cluster", label: "Kubernetes", z: 0, size: [15,4]}
nodes:
  git: {label: "Git リポジトリ", kind: "db", tier: "inputs", x: 2, y: 1.5, description: "注文 API の Deployment マニフェストを保持する。", evidence: [{type: doc, ref: "docs/reference-argo-cd.md#§1"}]}
  operator: {label: "運用者", kind: "actor", tier: "inputs", x: 10, y: 1.5, description: "障害対応を想定し、クラスタでレプリカ数を一時変更する。", evidence: [{type: doc, ref: "docs/reference-argo-cd.md#§4"}]}
  application: {label: 同期対象・方針の宣言, kind: workflow, tier: gitops, x: 1, 'y': 1.5, description: 管理対象のリポジトリ、パス、行き先と同期方針を表す。, evidence: [{type: doc, ref: docs/reference-argo-cd.md#§2}]}
  repo-server: {label: デプロイ定義の取得と生成, kind: service, tier: gitops, x: 5, 'y': 1.5, description: 対象リビジョンから Kubernetes マニフェストを生成する。, evidence: [{type: doc, ref: docs/reference-argo-cd.md#§2}]}
  controller: {label: 望ましい状態と稼働状態の照合, kind: worker, tier: gitops, x: 10, 'y': 1.5, description: 目標状態と実状態を比較し、同期を実行する。, evidence: [{type: doc, ref: docs/reference-argo-cd.md#§2}]}
  api: {label: 対象クラスタの制御 API, kind: service, tier: cluster, x: 7, 'y': 1.5, description: 実状態を提供し、対象リソースの変更を受け付ける。, evidence: [{type: doc, ref: docs/reference-argo-cd.md#§2}]}
  deployment: {label: 注文 API の稼働構成, kind: service, tier: cluster, x: 11, 'y': 1.5, description: 例では Git 管理下の spec.replicas を持つ。, evidence: [{type: doc, ref: docs/reference-argo-cd.md#§4}]}
links:
  - {id: "app-config", from: "application", to: "controller", label: "ソース・同期方針", evidence: [{type: doc, ref: "docs/reference-argo-cd.md#§2"}]}
  - {id: "manifest-request", from: "controller", to: "repo-server", label: "目標マニフェストを要求", evidence: [{type: doc, ref: "docs/reference-argo-cd.md#§2"}]}
  - {id: "fetch", from: "repo-server", to: "git", label: "対象リビジョンを取得", evidence: [{type: doc, ref: "docs/reference-argo-cd.md#§2"}]}
  - {id: "desired", from: "repo-server", to: "controller", label: "目標マニフェストを返す", evidence: [{type: doc, ref: "docs/reference-argo-cd.md#§2"}]}
  - {id: "live", from: "api", to: "controller", label: "実状態を監視・比較", evidence: [{type: doc, ref: "docs/reference-argo-cd.md#§2"}]}
  - {id: "apply", from: "controller", to: "api", label: "同期して目標状態を適用", evidence: [{type: doc, ref: "docs/reference-argo-cd.md#§3"}]}
  - {id: "scale", from: "operator", to: "api", label: "クラスタでレプリカ数を変更", evidence: [{type: doc, ref: "docs/reference-argo-cd.md#§4"}]}
  - {id: "deploy", from: "api", to: "deployment", label: "Deployment の spec が更新", evidence: [{type: doc, ref: "docs/reference-argo-cd.md#§4"}]}
scenarios:
  - id: git-change
    label: "Git 更新を自動同期"
    evidence: [{type: doc, ref: "docs/reference-argo-cd.md#§2"}, {type: doc, ref: "docs/reference-argo-cd.md#§3"}, {type: doc, ref: "docs/reference-argo-cd.md#§4"}]
    steps:
      - {links: ["app-config","manifest-request","fetch","desired"], note: "Git にレプリカ数を 2 から 3 にする変更が入る。Repository Server が新しい目標マニフェストを返す。"}
      - {links: ["live"], note: "Application Controller が実状態の 2 と比較し、Application を OutOfSync と判定する。"}
      - {links: ["apply","deploy"], note: "自動同期が有効なので、管理対象の Deployment に目標の 3 を適用する。"}
  - id: self-heal
    label: "クラスタだけで変更された差分を修復"
    evidence: [{type: doc, ref: "docs/reference-argo-cd.md#§2"}, {type: doc, ref: "docs/reference-argo-cd.md#§3"}, {type: doc, ref: "docs/reference-argo-cd.md#§4"}]
    steps:
      - {links: ["scale","deploy"], note: "Git の値は 3 のまま、クラスタ側でレプリカ数を 1 に変更する。"}
      - {links: ["manifest-request","desired","live"], note: "Application Controller が目標 3 と実状態 1 の差分を検出する。"}
      - {links: ["apply","deploy"], note: "自動同期と selfHeal が有効なので、同じ Git リビジョンの目標状態 3 を再適用する。"}
implementations:
  - id: argocd
    label: Argo CD と Helm の宣言同期
    description: 2つの Amazon EKS クラスタを用意し、運用側で動く Argo CD が注文 API 用のクラスタへ Helm の生成結果を同期する例。
    sources:
      - {title: EKS Control Plane, url: https://docs.aws.amazon.com/eks/latest/best-practices/control-plane.html}
      - title: Argo CD Architecture
        url: https://argo-cd.readthedocs.io/en/stable/operator-manual/architecture/
      - title: Argo CD Helm guide
        url: https://argo-cd.readthedocs.io/en/stable/user-guide/helm/
      - title: Argo CD High Availability
        url: https://argo-cd.readthedocs.io/en/stable/operator-manual/high_availability/
      - title: Argo CD の EKS 認証
        url: https://argo-cd.readthedocs.io/en/stable/operator-manual/declarative-setup/#eks
      - title: Argo CD のプライベートリポジトリ
        url: https://argo-cd.readthedocs.io/en/stable/user-guide/private-repositories/
    tiers:
      - id: inputs
        label: 変更の入力
        z: 2
        kind: origin
      - id: gitops
        label: Argo CD
        z: 1
      - id: cluster
        label: Kubernetes
        z: 0
    groups:
      - {kind: cloud, label: AWS サービス領域（制御プレーンは AWS 管理 VPC）, provider: aws, tier: [gitops, cluster], nodes: [argocd-management-api, argocd-management-nodes, argocd-application, argocd-repo-server, argocd-controller, argocd-redis, argocd-api, argocd-target-nodes, argocd-deployment]}
      - kind: cluster
        label: Argo CD 運用クラスタ
        provider: k8s
        tier:
          - gitops
        nodes:
          - argocd-application
          - argocd-repo-server
          - argocd-controller
          - argocd-redis
          - argocd-management-api
          - argocd-management-nodes
      - kind: cluster
        label: 注文 API の対象クラスタ
        provider: k8s
        tier:
          - cluster
        nodes:
          - argocd-api
          - argocd-deployment
          - argocd-target-nodes
    nodes:
      argocd-git:
        label: GitHub の注文 API Helm chart
        kind: file
        svc: github
        tier: inputs
        realizes:
          - git
        description: Chart と values をレビューして同期対象にする。
        evidence:
          - type: doc
            ref: docs/reference-argo-cd.md#§5
      argocd-operator:
        label: kubectl を使う運用者
        kind: actor
        tier: inputs
        realizes:
          - operator
        description: 手変更時にドリフト検知を試す。
        evidence:
          - type: doc
            ref: docs/reference-argo-cd.md#§5
      argocd-application:
        label: Argo CD の Application CR
        kind: workflow
        tier: gitops
        realizes:
          - application
        description: repoURL、対象 revision、path、同期方針を宣言する。
        evidence:
          - type: doc
            ref: docs/reference-argo-cd.md#§5
      argocd-repo-server:
        label: argocd-repo-server Deployment
        kind: service
        tier: gitops
        svc: k8s:deployment
        realizes:
          - repo-server
        description: Git の Helm chart から目的状態のマニフェストを生成する。
        management: {type: customer, scope: 利用者が Argo CD とリポジトリ資格情報を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-argo-cd.md#§5
      argocd-controller:
        label: argocd-application-controller
        kind: worker
        tier: gitops
        svc: k8s:statefulset
        realizes:
          - controller
        description: 目的状態と対象クラスタの状態を比較して同期する。
        management: {type: customer, scope: 利用者が Argo CD と同期権限を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-argo-cd.md#§5
      argocd-api:
        label: 対象 EKS Kubernetes API
        svc: eks
        kind: service
        tier: cluster
        realizes:
          - api
        description: Argo CD が権限を持つ名前空間の API を監視・更新する。
        management: {type: aws, scope: AWS が制御プレーン基盤を運用し、利用者が API と公開設定を操作する。}
        evidence:
          - type: doc
            ref: docs/reference-argo-cd.md#§5
      argocd-deployment:
        label: 対象クラスタの注文 API Deployment
        kind: service
        tier: cluster
        svc: k8s:deployment
        realizes:
          - deployment
        description: Helm で生成したマニフェストが API 経由で適用される。
        management: {type: customer, scope: 利用者が注文 API と配備を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-argo-cd.md#§5
      argocd-redis:
        label: Argo CD の Redis キャッシュ
        kind: cache
        tier: gitops
        description: マニフェストや計算結果のキャッシュに使う。
        evidence:
          - type: doc
            ref: docs/reference-argo-cd.md#§5
      argocd-management-api: {label: 運用 EKS Kubernetes API, svc: eks, kind: service, tier: gitops, x: 1, y: 3.8, description: Argo CD の運用リソースと Application CR を管理する。, management: {type: aws, scope: AWS が制御プレーン基盤を運用し、利用者が API と公開設定を操作する。}, evidence: [{type: doc, ref: docs/reference-argo-cd.md#§5}]}
      argocd-management-nodes: {label: Argo CD 用 EC2 ノード, svc: ec2, kind: host, tier: gitops, x: 6, y: 3.8, description: 利用者が配置した Argo CD と Redis の Pod を実行する。, management: {type: shared, scope: EKS がノード管理を支援し、利用者が設定と更新開始を担う。}, evidence: [{type: doc, ref: docs/reference-argo-cd.md#§5}]}
      argocd-target-nodes: {label: 注文 API 用 EC2 ノード, svc: ec2, kind: host, tier: cluster, x: 11, y: 3.8, description: 同期対象の注文 API Pod を実行する。, management: {type: shared, scope: EKS がノード管理を支援し、利用者が設定と更新開始を担う。}, evidence: [{type: doc, ref: docs/reference-argo-cd.md#§5}]}
    links:
      - {id: argocd-schedule-management, from: argocd-management-api, to: argocd-management-nodes, label: Argo CD Pod を配置, evidence: [{type: doc, ref: docs/reference-argo-cd.md#§5}]}
      - {id: argocd-schedule-target, from: argocd-api, to: argocd-target-nodes, label: 注文 API Pod を配置, evidence: [{type: doc, ref: docs/reference-argo-cd.md#§5}]}
      - id: argocd-cache-manifests
        from: argocd-repo-server
        to: argocd-redis
        label: 取得・生成結果をキャッシュ
        evidence:
          - type: doc
            ref: docs/reference-argo-cd.md#§5
      - id: argocd-cache-diff
        from: argocd-controller
        to: argocd-redis
        label: 比較結果のキャッシュを使う
        evidence:
          - type: doc
            ref: docs/reference-argo-cd.md#§5

    layout2d:
      tiers: [{id: diagram, label: クラスタと外部の接続, z: 0, origin: [-4, 0], size: [27, 15]}]
      nodes:
        argocd-operator: {tier: diagram, x: -3, y: 1}
        argocd-git: {tier: diagram, x: 22, y: 2}
        argocd-management-api: {tier: diagram, x: 2, y: 1}
        argocd-management-nodes: {tier: diagram, x: 2, y: 4}
        argocd-application: {tier: diagram, x: 5, y: 1.5}
        argocd-repo-server: {tier: diagram, x: 5, y: 4}
        argocd-controller: {tier: diagram, x: 5, y: 7}
        argocd-redis: {tier: diagram, x: 5, y: 10}
        argocd-api: {tier: diagram, x: 13, y: 1}
        argocd-target-nodes: {tier: diagram, x: 13, y: 4}
        argocd-deployment: {tier: diagram, x: 13, y: 7}
      groups:
        - {kind: cloud, provider: aws, label: AWS サービス領域, tier: [diagram], x0: 0, y0: -1, x1: 19, y1: 12, nodes: [argocd-management-api, argocd-management-nodes, argocd-application, argocd-repo-server, argocd-controller, argocd-redis, argocd-api, argocd-target-nodes, argocd-deployment]}
        - {kind: cluster, label: 運用 EKS（論理）, tier: [diagram], x0: 0.5, y0: 0, x1: 9.5, y1: 12, nodes: [argocd-management-api, argocd-management-nodes, argocd-application, argocd-repo-server, argocd-controller, argocd-redis]}
        - {kind: cluster, label: 対象 EKS（論理）, tier: [diagram], x0: 11, y0: 0, x1: 18, y1: 12, nodes: [argocd-api, argocd-target-nodes, argocd-deployment]}
        - {kind: vpc, provider: aws, label: 運用側ノードの顧客 VPC, tier: [diagram], x0: 0.6, y0: 3, x1: 8, y1: 12, nodes: [argocd-management-nodes, argocd-repo-server, argocd-controller, argocd-redis]}
        - {kind: vpc, provider: aws, label: 対象側ノードの顧客 VPC, tier: [diagram], x0: 11.6, y0: 3, x1: 17, y1: 12, nodes: [argocd-target-nodes, argocd-deployment]}
    layout3d:
      tiers:
        - {id: nodes, label: 顧客 EC2 ノード, z: 0, size: [11, 10]}
        - {id: pods, label: ノード上の Pod・設定, z: 1, size: [11, 10]}
        - {id: targetnodes, label: 対象 EC2 ノード, z: 0, origin: [13, 0], size: [8, 8]}
        - {id: targetpods, label: 対象ノード上の Pod, z: 1, origin: [13, 0], size: [8, 8]}
        - {id: control, label: AWS 管理制御プレーン, z: 0, origin: [24, 0], size: [8, 4]}
        - {id: outside, label: 外部の利用者・サービス, z: 0, origin: [35, 0], size: [8, 4]}
      nodes:
        argocd-management-api: {tier: control, x: 1, y: 1}
        argocd-management-nodes: {tier: nodes, x: 1, y: 2}
        argocd-application: {tier: pods, x: 1, y: 1}
        argocd-repo-server: {tier: pods, x: 4, y: 1}
        argocd-controller: {tier: pods, x: 7, y: 1}
        argocd-redis: {tier: pods, x: 1, y: 4}
        argocd-api: {tier: control, x: 4, y: 1}
        argocd-target-nodes: {tier: targetnodes, x: 2, y: 2}
        argocd-deployment: {tier: targetpods, x: 2, y: 2}
        argocd-operator: {tier: outside, x: 1, y: 1}
        argocd-git: {tier: outside, x: 4, y: 1}
      groups:
        - {kind: cloud, provider: aws, label: AWS サービス領域, tier: [nodes, pods, targetnodes, targetpods, control], nodes: [argocd-management-api, argocd-management-nodes, argocd-application, argocd-repo-server, argocd-controller, argocd-redis, argocd-api, argocd-target-nodes, argocd-deployment]}
