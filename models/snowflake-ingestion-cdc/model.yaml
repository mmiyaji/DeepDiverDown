      - {kind: cloud, provider: aws, label: Customer AWS account, tier: [flow, implementation-setup], nodes: [example-files, example-ecs, example-fargate, example-client, example-iam]}
      - {kind: cloud, provider: aws, label: Snowflake-managed AWS notification queue, tier: implementation-setup, nodes: [example-notif]}
