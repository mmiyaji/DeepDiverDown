        evidence:
          - type: doc
            ref: docs/reference-snowflake-ingestion-cdc.md#§6
      - id: example-notif-connection
        from: example-notif
        to: example-pipe
        label: オブジェクト作成を通知
        evidence:
          - type: doc
            ref: docs/reference-snowflake-ingestion-cdc.md#§6
    groups:
