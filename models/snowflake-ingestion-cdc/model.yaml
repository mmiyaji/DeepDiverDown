        kind: service
        tier: implementation-setup
        svc: snowflake:platform
        x: 5
        y: 1.5
        description: ストレージ統合の IAM ロールで S3 入力プレフィックスを参照する。
        evidence:
          - type: doc
            ref: docs/reference-snowflake-ingestion-cdc.md#§6
      example-ecs: {label: Amazon ECS サービス, svc: ecs, kind: service, tier: implementation-setup, x: 1, y: 4, description: SDK を組み込んだ送信アプリを Fargate 上で稼働させる。, evidence: [{type: doc, ref: docs/reference-snowflake-ingestion-cdc.md#§6}]}
      example-transform-wh: {label: 変換・更新用 Virtual Warehouse, svc: 'snowflake:warehouse', kind: worker, tier: implementation-setup, x: 10, y: 1.5, description: Task の MERGE と Dynamic Table の更新で使う SQL 計算資源。, evidence: [{type: doc, ref: docs/reference-snowflake-ingestion-cdc.md#§6}]}
      example-bi-wh: {label: BI 用 Virtual Warehouse, svc: 'snowflake:warehouse', kind: worker, tier: implementation-setup, x: 15, y: 1.5, description: BI クライアントの SQL を実行し日別集計を参照する。, evidence: [{type: doc, ref: docs/reference-snowflake-ingestion-cdc.md#§6}]}
    links:
      - {id: example-event-source, from: example-origin, to: example-client, label: "Supply order events", evidence: [{type: doc, ref: "docs/reference-snowflake-ingestion-cdc.md#§6"}]}
      - {id: example-execute-sdk, from: example-fargate, to: example-client, label: "Run SDK app", evidence: [{type: doc, ref: "docs/reference-snowflake-ingestion-cdc.md#§6"}]}
      - {id: example-stage-role, from: example-stage, to: example-iam, label: "Assume storage role", evidence: [{type: doc, ref: "docs/reference-snowflake-ingestion-cdc.md#§6"}]}
      - {id: example-s3-notify, from: example-files, to: example-notif, label: オブジェクト作成通知を送る, evidence: [{type: doc, ref: docs/reference-snowflake-ingestion-cdc.md#§6}]}
      - {id: example-run-sdk, from: example-ecs, to: example-client, label: 送信アプリを稼働させる, evidence: [{type: doc, ref: docs/reference-snowflake-ingestion-cdc.md#§6}]}
      - {id: example-run-merge, from: example-task, to: example-transform-wh, label: MERGE の SQL を実行, evidence: [{type: doc, ref: docs/reference-snowflake-ingestion-cdc.md#§6}]}
      - {id: example-refresh-compute, from: example-dynamic, to: example-transform-wh, label: 指定 Warehouse で更新を実行, evidence: [{type: doc, ref: docs/reference-snowflake-ingestion-cdc.md#§6}]}
      - {id: example-bi-query, from: example-dynamic, to: example-bi-wh, label: 日別集計を読み取る, realizes: [serve], replace: true, evidence: [{type: doc, ref: docs/reference-snowflake-ingestion-cdc.md#§6}]}
      - {id: example-bi-result, from: example-bi-wh, to: example-bi, label: BI に集計結果を返す, realizes: [serve], replace: true, evidence: [{type: doc, ref: docs/reference-snowflake-ingestion-cdc.md#§6}]}
      - id: example-stage-bucket
        from: example-stage
        to: example-files
        label: バケットのファイルを参照
        evidence:
          - type: doc
            ref: docs/reference-snowflake-ingestion-cdc.md#§6
      - id: example-pipe-stage
