name: InfluxDB 3 の基本アーキテクチャ
description: 書き込み元、単一プロセスのサーバー、オブジェクトストアの Parquet、検索クライアントの関係と、Enterprise のノードモードを示す。
reference:
  objectives: [書き込み・検索・永続化の経路を区別する, データモデルとプロセシングエンジンの位置を確認する, Core と Enterprise のノード構成の違いを確認する]
  sources:
    - {title: InfluxDB 3 Core and Enterprise architecture, url: https://www.influxdata.com/blog/influxdb3-core-enterprise-architecture}
    - {title: Get started with InfluxDB 3 Core, url: https://docs.influxdata.com/influxdb3/core/get-started/}
    - {title: InfluxDB 3 Core durability, url: https://docs.influxdata.com/influxdb3/core/reference/internals/durability/}
    - {title: Enterprise clustering, url: https://docs.influxdata.com/influxdb3/enterprise/admin/clustering/}
sources: [docs/reference-influxdb3.md]
evidence: [{type: doc, ref: docs/reference-influxdb3.md#§1}]
tiers:
  - {id: flow, label: 書き込み・サーバー・検索・保存, z: 0, size: [30, 12]}
nodes:
  writers: {label: 書き込み元, kind: client, tier: flow, x: 1, y: 3, description: Telegraf、HTTP API、influxdb3 CLI、クライアントライブラリから書く。API の形式は未確認。, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§3}]}
  ingest: {label: 書き込みバッファと WAL, kind: service, tier: flow, x: 8, y: 3, description: 書き込みをメモリに蓄え、既定で 1 秒ごとに WAL へフラッシュする。詳細は WAL と Parquet の図を参照。, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§3}]}
  model: {label: データベース・テーブル・列, kind: db, tier: flow, x: 8, y: 7, description: タグ、フィールド、time の列を持つ。主キーはタグと time。, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§2}]}
  buffer: {label: クエリ可能バッファ, kind: db, tier: flow, x: 15, y: 3, description: Arrow 形式で直近のデータを保持する。10 分ごとに古い部分を Parquet にする。, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§4}]}
  store: {label: オブジェクトストアの Parquet, kind: db, tier: flow, x: 23, y: 3, description: S3、MinIO、Google Cloud Storage、Azure Blob Storage などに置く。, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§4}]}
  query: {label: クエリエンジン（DataFusion）, kind: service, tier: flow, x: 15, y: 7, description: SQL と InfluxQL を実行する。, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§5}]}
  clients: {label: 検索クライアント, kind: client, tier: flow, x: 23, y: 7, description: CLI、HTTP API、InfluxDB 3 Explorer、Flight SQL クライアント、Grafana。, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§5}]}
  pe: {label: プロセシングエンジン, kind: service, tier: flow, x: 8, y: 10, description: Python プラグインが到着時、オンデマンド、スケジュールで動く。, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§6}]}
  compactor: {label: コンパクター（Enterprise）, kind: service, tier: flow, x: 23, y: 10, description: compact モードのノードが Parquet を整理し、長期間のクエリを速くする。, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§7}]}
links:
  - {id: write, from: writers, to: ingest, label: 書き込み, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§3}]}
  - {id: apply-model, from: ingest, to: model, label: スキーマを適用, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§2}]}
  - {id: to-buffer, from: ingest, to: buffer, label: WAL から反映, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§4}]}
  - {id: persist, from: buffer, to: store, label: Parquet で永続化, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§4}]}
  - {id: read-buffer, from: query, to: buffer, label: 直近を検索, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§5}]}
  - {id: read-store, from: query, to: store, label: 過去を検索, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§4}]}
  - {id: serve, from: query, to: clients, label: 結果を返す, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§5}]}
  - {id: plugin-write, from: pe, to: ingest, label: 変換結果を書く, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§6}]}
  - {id: compact, from: compactor, to: store, label: 整理, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§7}]}
scenarios:
  - id: write-and-query
    label: 書き込んで検索する
    evidence: [{type: doc, ref: docs/reference-influxdb3.md#§4}]
    steps:
      - {links: [write, apply-model], note: 書き込み元がデータを送り、スキーマに沿って WAL へ入る。}
      - {links: [to-buffer, persist], note: クエリ可能バッファを経て Parquet がオブジェクトストアに置かれる。}
      - {links: [read-buffer, read-store, serve], note: クエリエンジンが直近と過去を読み、クライアントへ返す。}
requirements:
  - {id: IX-01, kind: usecase, title: 直近のデータを書いてすぐ検索する, text: WAL への書き込み後、クエリ可能バッファから検索できる。, links: [write, to-buffer, read-buffer], evidence: [{type: doc, ref: docs/reference-influxdb3.md#§4}]}
unknowns:
  - {id: UNK-01, text: 書き込み API のエンドポイントと形式は取得した資料に記載がなく未確認。, refs: [writers]}
  - {id: UNK-02, text: Core と Enterprise の機能差の詳細と、コンパクターとオブジェクトストアの接続の詳細は未確認。, refs: [compactor]}
gates: {maxDrift: 0, maxHigh: 0}
implementations:
  - id: enterprise-multi-node
    label: Enterprise の役割別ノードとオブジェクトストア
    description: Enterprise を --mode で取り込み・クエリ・コンパクション・プロセシングの専用ノードに分け、共通のオブジェクトストアを使う代表例。導入事例ではない。
    sources:
      - {title: InfluxDB 3 Core and Enterprise architecture, url: https://www.influxdata.com/blog/influxdb3-core-enterprise-architecture}
      - {title: Enterprise clustering, url: https://docs.influxdata.com/influxdb3/enterprise/admin/clustering/}
    tiers:
      - {id: diagram, label: 書き込み・ノード・保存, z: 0, size: [30, 12]}
    nodes:
      ix-telegraf: {label: Telegraf, kind: client, tier: diagram, x: 1, y: 3, realizes: [writers], description: 収集した指標を書き込む。, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§8}]}
      ix-ingest: {label: 取り込みノード（--mode ingest）, kind: service, tier: diagram, x: 8, y: 3, realizes: [ingest, model, buffer], description: 書き込みの受け付け、WAL、スキーマの適用、クエリ可能バッファを担う。クエリノードが直近のデータをどう読むかは未確認。, management: {type: customer, scope: "Customer operates the node, host and configuration."}, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§8}]}
      ix-process: {label: プロセシングノード（--mode process）, kind: service, tier: diagram, x: 8, y: 7, realizes: [pe], description: Python プラグインを動かす。--plugin-dir が必要。, management: {type: customer, scope: "Customer operates the node, host and configuration."}, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§8}]}
      ix-query: {label: クエリノード（--mode query）, kind: service, tier: diagram, x: 16, y: 7, realizes: [query], description: SQL と InfluxQL を実行する。同じオブジェクトストアを読むため水平に増やせる。, management: {type: customer, scope: "Customer operates the node, host and configuration."}, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§8}]}
      ix-compactor: {label: コンパクターノード（--mode compact）, kind: service, tier: diagram, x: 16, y: 10.5, realizes: [compactor], description: Parquet を整理して長期間のクエリを速くする。推奨の複数ノード構成は専用のコンパクターを置く。, management: {type: customer, scope: "Customer operates the node, host and configuration."}, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§8}]}
      ix-store: {label: S3 互換オブジェクトストア, kind: db, tier: diagram, x: 24, y: 3, realizes: [store], description: Parquet の永続化先。各ノードがこの上の専用領域を使う。, management: {type: customer, scope: "Customer operates the storage."}, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§8}]}
      ix-grafana: {label: Grafana, kind: client, tier: diagram, x: 24, y: 7, realizes: [clients], description: SQL または InfluxQL で検索する。, evidence: [{type: doc, ref: docs/reference-influxdb3.md#§8}]}
    groups:
      - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [ix-telegraf, ix-ingest, ix-process, ix-query, ix-compactor, ix-store, ix-grafana]}
    layout2d:
      tiers:
        - {id: diagram, label: 書き込み・ノード・保存, z: 0, size: [30, 12]}
      nodes:
        ix-telegraf: {tier: diagram, x: 1, y: 3}
        ix-ingest: {tier: diagram, x: 8, y: 3}
        ix-process: {tier: diagram, x: 8, y: 7}
        ix-query: {tier: diagram, x: 16, y: 7}
        ix-compactor: {tier: diagram, x: 16, y: 10.5}
        ix-store: {tier: diagram, x: 24, y: 3}
        ix-grafana: {tier: diagram, x: 24, y: 7}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [ix-telegraf, ix-ingest, ix-process, ix-query, ix-compactor, ix-store, ix-grafana]}
    layout3d:
      tiers:
        - {id: src, label: 書き込み元, z: 0, size: [6, 12]}
        - {id: nodes, label: 役割別ノード, z: 0, origin: [8, 0], size: [10, 12]}
        - {id: out, label: 保存と検索, z: 0, origin: [20, 0], size: [8, 12]}
      nodes:
        ix-telegraf: {tier: src, x: 3, y: 3}
        ix-ingest: {tier: nodes, x: 2, y: 3}
        ix-process: {tier: nodes, x: 2, y: 7}
        ix-query: {tier: nodes, x: 8, y: 7}
        ix-compactor: {tier: nodes, x: 8, y: 10.5}
        ix-store: {tier: out, x: 4, y: 3}
        ix-grafana: {tier: out, x: 4, y: 7}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: [src, nodes, out], nodes: [ix-telegraf, ix-ingest, ix-process, ix-query, ix-compactor, ix-store, ix-grafana]}
