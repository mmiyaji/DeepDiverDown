name: AWS IoT Greengrass のエッジ処理
description: AWS の管理サービスと、端末上の Nucleus・コンポーネント・MQTT を分ける。
reference:
  objectives:
    - AWS 管理サービスと端末の境界を理解する。
    - コンポーネントの配備と MQTT の経路を追う。
  sources:
    - title: How Greengrass works
      url: https://docs.aws.amazon.com/greengrass/v2/developerguide/how-it-works.html
    - title: Connect client devices
      url: https://docs.aws.amazon.com/greengrass/v2/developerguide/connect-client-devices.html
    - title: Create deployments
      url: https://docs.aws.amazon.com/greengrass/v2/developerguide/create-deployments.html
sources:
  - docs/reference-aws-iot-greengrass.md
evidence:
  - type: doc
    ref: docs/reference-aws-iot-greengrass.md#§1
  - type: doc
    ref: docs/reference-aws-iot-greengrass.md#§3
tiers:
  - id: cloud
    label: AWS クラウド
    z: 2
    size:
      - 20
      - 3
  - id: edge
    label: エッジ端末
    z: 1
    size:
      - 20
      - 3
  - id: devices
    label: 現場デバイス
    z: 0
    size:
      - 20
      - 3
nodes:
  manager:
    label: 配備の管理
    kind: service
    tier: cloud
    x: 4
    'y': 1.5
    description: クラウドから端末への配備を管理する。
    evidence:
      - type: doc
        ref: docs/reference-aws-iot-greengrass.md#§2
  iot:
    label: クラウド通信
    kind: service
    tier: cloud
    x: 12
    'y': 1.5
    description: AWS 側の MQTT 通信を受け付ける。
    evidence:
      - type: doc
        ref: docs/reference-aws-iot-greengrass.md#§2
  nucleus:
    label: 端末の実行基盤
    kind: service
    tier: edge
    x: 0
    'y': 1.5
    description: 端末上でコンポーネントを管理する。
    evidence:
      - type: doc
        ref: docs/reference-aws-iot-greengrass.md#§2
  component:
    label: 現場の処理
    kind: service
    tier: edge
    x: 4
    'y': 1.5
    description: 端末で動くユーザー定義の処理。
    evidence:
      - type: doc
        ref: docs/reference-aws-iot-greengrass.md#§2
  broker:
    label: ローカル MQTT
    kind: service
    tier: edge
    x: 8
    'y': 1.5
    description: 設定されたローカルブローカー。
    evidence:
      - type: doc
        ref: docs/reference-aws-iot-greengrass.md#§2
  bridge:
    label: メッセージ転送
    kind: service
    tier: edge
    x: 12
    'y': 1.5
    description: 設定したトピックをローカルとクラウドの間で転送する。
    evidence:
      - type: doc
        ref: docs/reference-aws-iot-greengrass.md#§2
  device:
    label: クライアントデバイス
    kind: external
    tier: devices
    x: 8
    'y': 1.5
    description: ローカル MQTT に接続する。
    evidence:
      - type: doc
        ref: docs/reference-aws-iot-greengrass.md#§2
links:
  - id: deploy
    from: manager
    to: nucleus
    label: コンポーネントを配備
    evidence:
      - type: doc
        ref: docs/reference-aws-iot-greengrass.md#§2
  - id: run
    from: nucleus
    to: component
    label: 処理を実行
    evidence:
      - type: doc
        ref: docs/reference-aws-iot-greengrass.md#§2
  - id: publish
    from: device
    to: broker
    label: MQTT メッセージを発行
    evidence:
      - type: doc
        ref: docs/reference-aws-iot-greengrass.md#§2
  - id: route
    from: broker
    to: bridge
    label: 設定したトピックを転送
    evidence:
      - type: doc
        ref: docs/reference-aws-iot-greengrass.md#§2
  - id: cloud
    from: bridge
    to: iot
    label: AWS IoT Core へ転送
    evidence:
      - type: doc
        ref: docs/reference-aws-iot-greengrass.md#§2
scenarios:
  - id: deploy
    label: 配備とメッセージ転送
    evidence:
      - type: doc
        ref: docs/reference-aws-iot-greengrass.md#§2
    steps:
      - links:
          - deploy
          - run
        note: クラウド管理から端末へ処理を配備する。
      - links:
          - publish
          - route
          - cloud
        note: 設定した MQTT bridge を介しクラウドへ転送する。
implementations:
  - id: example
    label: Greengrass V2 と MQTT bridge
    description: AWS IoT Greengrass、AWS IoT Core と現場端末を分けた例。MQTT broker・認証・bridge は別途構成する。
    sources:
      - title: How Greengrass works
        url: https://docs.aws.amazon.com/greengrass/v2/developerguide/how-it-works.html
      - title: Connect client devices
        url: https://docs.aws.amazon.com/greengrass/v2/developerguide/connect-client-devices.html
      - title: Create deployments
        url: https://docs.aws.amazon.com/greengrass/v2/developerguide/create-deployments.html
    tiers:
      - id: cloud
        label: AWS クラウド
        z: 2
        size:
          - 20
          - 3
      - id: edge
        label: エッジ端末
        z: 1
        size:
          - 20
          - 3
      - id: devices
        label: 現場デバイス
        z: 0
        size:
          - 20
          - 3
    nodes:
      ex-manager:
        label: AWS IoT Greengrass
        kind: service
        tier: cloud
        x: 4
        'y': 1.5
        description: クラウドから端末への配備を管理する。
        svc: greengrass
        realizes:
          - manager
        management: {type: shared, scope: AWS が基盤を運用し、利用者が設定と権限を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-aws-iot-greengrass.md#§4
      ex-iot:
        label: AWS IoT Core
        kind: service
        tier: cloud
        x: 12
        'y': 1.5
        description: AWS 側の MQTT 通信を受け付ける。
        svc: iotcore
        realizes:
          - iot
        management: {type: shared, scope: AWS が基盤を運用し、利用者が設定と権限を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-aws-iot-greengrass.md#§4
      ex-host: {label: 現場 Greengrass コア端末, kind: host, tier: edge, x: 1, y: 2, description: 利用者が管理する Linux 端末で Nucleus とコンポーネントを動かす。, management: {type: customer, scope: 利用者が端末と OS を管理する。}, evidence: [{type: doc, ref: docs/reference-aws-iot-greengrass.md#§4}]}
      ex-auth: {label: Client device auth, kind: policy, tier: edge, x: 6, y: 2, description: クライアント証明書の認証と操作の認可を行う。, management: {type: customer, scope: 利用者が認証と権限を設定する。}, evidence: [{type: doc, ref: docs/reference-aws-iot-greengrass.md#§4}]}
      ex-nucleus:
        label: Greengrass Nucleus
        kind: service
        tier: edge
        x: 0
        'y': 1.5
        description: 端末上でコンポーネントを管理する。
        realizes:
          - nucleus
        evidence:
          - type: doc
            ref: docs/reference-aws-iot-greengrass.md#§4
      ex-component:
        label: エッジコンポーネント
        kind: service
        tier: edge
        x: 4
        'y': 1.5
        description: 端末で動くユーザー定義の処理。
        realizes:
          - component
        evidence:
          - type: doc
            ref: docs/reference-aws-iot-greengrass.md#§4
      ex-broker:
        label: Moquette MQTT broker
        kind: service
        tier: edge
        x: 8
        'y': 1.5
        description: 設定されたローカルブローカー。
        realizes:
          - broker
        evidence:
          - type: doc
            ref: docs/reference-aws-iot-greengrass.md#§4
      ex-bridge:
        label: MQTT bridge
        kind: service
        tier: edge
        x: 12
        'y': 1.5
        description: 設定したトピックをローカルとクラウドの間で転送する。
        realizes:
          - bridge
        evidence:
          - type: doc
            ref: docs/reference-aws-iot-greengrass.md#§4
      ex-device:
        label: センサー / クライアント
        kind: external
        tier: devices
        x: 8
        'y': 1.5
        description: ローカル MQTT に接続する。
        realizes:
          - device
        evidence:
          - type: doc
            ref: docs/reference-aws-iot-greengrass.md#§4
    groups:
      - id: aws
        label: AWS クラウド
        kind: cloud
        tier:
          - cloud
        nodes:
          - ex-manager
          - ex-iot
        provider: aws
      - id: edge-device
        label: エッジ端末
        kind: datacenter
        tier:
          - edge
        nodes:
          - ex-host
          - ex-auth
          - ex-nucleus
          - ex-component
          - ex-broker
          - ex-bridge
    links:
      - {id: ex-host-nucleus, from: ex-host, to: ex-nucleus, label: Nucleus を実行, evidence: [{type: doc, ref: docs/reference-aws-iot-greengrass.md#§4}]}
      - {id: ex-broker-auth, from: ex-broker, to: ex-auth, label: クライアントを認証・認可, evidence: [{type: doc, ref: docs/reference-aws-iot-greengrass.md#§4}]}

    layout2d:
      tiers: [{id: diagram, label: 配備管理と現場端末, z: 0, origin: [-4, 0], size: [26, 14]}]
      nodes:
        ex-manager: {tier: diagram, x: 1, y: 1}
        ex-iot: {tier: diagram, x: 4, y: 1}
        ex-host: {tier: diagram, x: 11, y: 1}
        ex-nucleus: {tier: diagram, x: 14, y: 1}
        ex-component: {tier: diagram, x: 17, y: 1}
        ex-broker: {tier: diagram, x: 11, y: 4}
        ex-auth: {tier: diagram, x: 14, y: 4}
        ex-bridge: {tier: diagram, x: 17, y: 4}
        ex-device: {tier: diagram, x: 21, y: 1}
      groups:
        - {kind: cloud, provider: aws, label: AWS アカウント, tier: [diagram], x0: -1, y0: 0, x1: 9, y1: 11, nodes: [ex-manager, ex-iot]}
        - {kind: datacenter, label: 現場端末, tier: [diagram], x0: 9.5, y0: 0, x1: 19, y1: 11, nodes: [ex-host, ex-nucleus, ex-component, ex-broker, ex-auth, ex-bridge]}
    layout3d:
      tiers:
        - {id: management, label: 管理側基盤, z: 0, size: [9, 9]}
        - {id: managementapps, label: 管理側ソフトウェア, z: 1, size: [9, 9]}
        - {id: edgehost, label: 現場端末, z: 0, origin: [12, 0], size: [9, 9]}
        - {id: edgeapps, label: 端末上の処理と保存, z: 1, origin: [12, 0], size: [9, 9]}
        - {id: external, label: 運用者・現場機器, z: 0, origin: [24, 0], size: [7, 4]}
      nodes:
        ex-manager: {tier: management, x: 1, y: 1}
        ex-iot: {tier: management, x: 4, y: 1}
        ex-host: {tier: edgehost, x: 1, y: 1}
        ex-nucleus: {tier: edgeapps, x: 4, y: 1}
        ex-component: {tier: edgeapps, x: 7, y: 1}
        ex-broker: {tier: edgeapps, x: 1, y: 4}
        ex-auth: {tier: edgeapps, x: 4, y: 4}
        ex-bridge: {tier: edgeapps, x: 7, y: 4}
        ex-device: {tier: external, x: 1, y: 1}
      groups:
        - {kind: cloud, provider: aws, label: AWS アカウント, tier: [management, managementapps], nodes: [ex-manager, ex-iot]}
        - {kind: datacenter, label: 現場端末, tier: [edgehost, edgeapps], nodes: [ex-host, ex-nucleus, ex-component, ex-broker, ex-auth, ex-bridge]}

  - id: aws-ubuntu-core
    label: "AWS IoT・S3：Ubuntu ゲートウェイに Greengrass V2"
    description: "AWS の配備管理と S3 のコンポーネント成果物を、現場 Ubuntu の Nucleus、Moquette、Client device auth と MQTT bridge に接続する例。"
    sources:
      - {title: "Greengrass nucleus component", url: https://docs.aws.amazon.com/greengrass/v2/developerguide/greengrass-nucleus-component.html}
      - {title: "Greengrass client device tutorial", url: https://docs.aws.amazon.com/greengrass/v2/developerguide/client-devices-tutorial.html}
      - {title: "Greengrass component artifacts on S3", url: https://docs.aws.amazon.com/greengrass/v2/developerguide/upload-first-component.html}
      - {title: "Greengrass client device auth", url: https://docs.aws.amazon.com/greengrass/v2/developerguide/client-device-auth-component.html}
      - {title: "Greengrass MQTT bridge", url: https://docs.aws.amazon.com/greengrass/v2/developerguide/mqtt-bridge-component.html}
      - {title: "Greengrass core connectivity and system service", url: https://docs.aws.amazon.com/greengrass/v2/developerguide/configure-greengrass-core-v2.html}
      - {title: "AWS IoT Core credential provider", url: https://docs.aws.amazon.com/iot/latest/developerguide/authorizing-direct-aws.html}
    tiers:
      - {id: cloud, label: "管理とクラウドのメッセージング", z: 2, size: [20, 4]}
      - {id: edge, label: "現場の Ubuntu ゲートウェイ", z: 1, size: [20, 4]}
      - {id: device, label: "現場 LAN と端末の永続領域", z: 0, size: [20, 4]}
    groups:
      - {kind: cloud, label: "AWS アカウント", provider: aws, tier: [cloud], nodes: [gg-ubuntu-manager, gg-ubuntu-iot, gg-ubuntu-s3]}
      - {kind: datacenter, label: "現場 Ubuntu Linux / systemd", provider: onprem, tier: [edge, device], nodes: [gg-ubuntu-host, gg-ubuntu-nucleus, gg-ubuntu-broker, gg-ubuntu-auth, gg-ubuntu-bridge, gg-ubuntu-app, gg-ubuntu-disk]}
    nodes:
      gg-ubuntu-manager: {label: "AWS IoT Greengrass / 配備管理", svc: greengrass, kind: service, tier: cloud, x: 3, y: 1.5, realizes: [manager], description: "IoT Thing または Thing Group を指定し、コンポーネントと設定の配備を管理する。", management: {type: shared, scope: AWS が基盤を運用し、利用者が設定、データと権限を管理する。}, evidence: [{type: doc, ref: "docs/reference-aws-iot-greengrass.md#§5"}]}
      gg-ubuntu-iot: {label: "AWS IoT Core", svc: iotcore, kind: service, tier: cloud, x: 10, y: 1.5, realizes: [iot], description: "クラウドの MQTT と端末資格情報の接続先を提供する。", management: {type: shared, scope: AWS が基盤を運用し、利用者が設定、データと権限を管理する。}, evidence: [{type: doc, ref: "docs/reference-aws-iot-greengrass.md#§5"}]}
      gg-ubuntu-s3: {label: "Amazon S3 / コンポーネント成果物", svc: s3, kind: db, tier: cloud, x: 17, y: 1.5, description: "カスタムコンポーネントのスクリプト等をバージョン別に保存する。", management: {type: shared, scope: AWS が基盤を運用し、利用者が設定、データと権限を管理する。}, evidence: [{type: doc, ref: "docs/reference-aws-iot-greengrass.md#§5"}]}
      gg-ubuntu-host: {label: 現場 Ubuntu ゲートウェイ, kind: host, tier: edge, x: 1, y: 3, description: 利用者が管理する OS 上で Nucleus とコンポーネントを実行する。, management: {type: customer, scope: 利用者が端末と OS を管理する。}, evidence: [{type: doc, ref: docs/reference-aws-iot-greengrass.md#§5}]}
      gg-ubuntu-nucleus: {label: "Greengrass Nucleus / Java", kind: host, tier: edge, x: 3, y: 1.5, realizes: [nucleus], description: "Ubuntu の systemd サービスとして動き、取得したレシピと成果物からコンポーネントを起動する。", evidence: [{type: doc, ref: "docs/reference-aws-iot-greengrass.md#§5"}]}
      gg-ubuntu-auth: {label: "Client device auth", kind: policy, tier: edge, x: 8, y: 1.5, description: "関連付けた Thing の X.509 証明書と MQTT 操作権限を確認する。", evidence: [{type: doc, ref: "docs/reference-aws-iot-greengrass.md#§5"}]}
      gg-ubuntu-broker: {label: "Moquette / MQTT 3.1.1", kind: queue, tier: edge, x: 12, y: 1.5, realizes: [broker], description: "現場 MQTT クライアントの TLS 接続とトピックを受ける。", evidence: [{type: doc, ref: "docs/reference-aws-iot-greengrass.md#§5"}]}
      gg-ubuntu-bridge: {label: "Greengrass MQTT bridge", kind: worker, tier: edge, x: 16, y: 1.5, realizes: [bridge], description: "対象トピックをローカル Pub/Sub とクラウド MQTT に転送する。", evidence: [{type: doc, ref: "docs/reference-aws-iot-greengrass.md#§5"}]}
      gg-ubuntu-app: {label: "Python のローカル購読コンポーネント", kind: worker, tier: edge, x: 8, y: 3.4, realizes: [component], description: "AWS IoT Device SDK v2 でローカル Pub/Sub を購読して処理する。", evidence: [{type: doc, ref: "docs/reference-aws-iot-greengrass.md#§5"}]}
      gg-ubuntu-disk: {label: "ゲートウェイの SSD / Greengrass root", kind: db, tier: device, x: 4, y: 1.5, description: "取得した成果物、設定、ログをホスト側のストレージに保持する。", evidence: [{type: doc, ref: "docs/reference-aws-iot-greengrass.md#§5"}]}
      gg-ubuntu-sensor: {label: "現場 MQTT クライアント", kind: external, tier: device, x: 16, y: 1.5, realizes: [device], description: "登録した X.509 証明書で Moquette へ接続し観測値を送る。", evidence: [{type: doc, ref: "docs/reference-aws-iot-greengrass.md#§5"}]}
    links:
      - {id: gg-ubuntu-host-run, from: gg-ubuntu-host, to: gg-ubuntu-nucleus, label: Nucleus を実行, evidence: [{type: doc, ref: docs/reference-aws-iot-greengrass.md#§5}]}
      - {id: gg-ubuntu-cloud-connect, from: gg-ubuntu-nucleus, to: gg-ubuntu-iot, label: "MQTT/TLS で接続", evidence: [{type: doc, ref: "docs/reference-aws-iot-greengrass.md#§5"}]}
      - {id: gg-ubuntu-role, from: gg-ubuntu-nucleus, to: gg-ubuntu-iot, label: "HTTPS の認証情報エンドポイントで一時資格情報を取得", evidence: [{type: doc, ref: "docs/reference-aws-iot-greengrass.md#§5"}]}
      - {id: gg-ubuntu-artifact, from: gg-ubuntu-nucleus, to: gg-ubuntu-s3, label: "端末ロールでコンポーネント成果物を取得", evidence: [{type: doc, ref: "docs/reference-aws-iot-greengrass.md#§5"}]}
      - {id: gg-ubuntu-artifact-cache, from: gg-ubuntu-nucleus, to: gg-ubuntu-disk, label: "成果物と実行設定を端末に保存", evidence: [{type: doc, ref: "docs/reference-aws-iot-greengrass.md#§5"}]}
      - {id: gg-ubuntu-authentication, from: gg-ubuntu-broker, to: gg-ubuntu-auth, label: "証明書と操作権限を確認", evidence: [{type: doc, ref: "docs/reference-aws-iot-greengrass.md#§5"}]}
      - {id: gg-ubuntu-local-pubsub, from: gg-ubuntu-bridge, to: gg-ubuntu-app, label: "ローカル Pub/Sub に観測値を転送", evidence: [{type: doc, ref: "docs/reference-aws-iot-greengrass.md#§5"}]}
      - {id: gg-ubuntu-client, from: gg-ubuntu-sensor, to: gg-ubuntu-broker, label: "MQTT over TLS で観測値を送る", realizes: [publish], replace: true, evidence: [{type: doc, ref: "docs/reference-aws-iot-greengrass.md#§5"}]}

    layout2d:
      tiers: [{id: diagram, label: 配備管理と現場端末, z: 0, origin: [-4, 0], size: [26, 14]}]
      nodes:
        gg-ubuntu-manager: {tier: diagram, x: 1, y: 1}
