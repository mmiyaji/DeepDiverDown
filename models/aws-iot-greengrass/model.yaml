        gg-ubuntu-auth: {tier: edgeapps, x: 7, y: 1}
        gg-ubuntu-broker: {tier: edgeapps, x: 1, y: 4}
        gg-ubuntu-bridge: {tier: edgeapps, x: 4, y: 4}
        gg-ubuntu-app: {tier: edgeapps, x: 7, y: 4}
        gg-ubuntu-disk: {tier: edgeapps, x: 1, y: 7}
        gg-ubuntu-sensor: {tier: external, x: 1, y: 1}
      groups:
        - {kind: cloud, provider: aws, label: AWS アカウント, tier: [management, managementapps], nodes: [gg-ubuntu-manager, gg-ubuntu-iot, gg-ubuntu-s3]}
