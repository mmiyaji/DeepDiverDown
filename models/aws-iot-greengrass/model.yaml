        gg-ubuntu-disk: {tier: diagram, x: 11, y: 7}
        gg-ubuntu-sensor: {tier: diagram, x: 21, y: 1}
      groups:
        - {kind: cloud, provider: aws, label: AWS アカウント, tier: [diagram], x0: -1, y0: 0, x1: 9, y1: 11, nodes: [gg-ubuntu-manager, gg-ubuntu-iot, gg-ubuntu-s3]}
        - {kind: datacenter, label: 現場端末, tier: [diagram], x0: 9.5, y0: 0, x1: 19, y1: 11, nodes: [gg-ubuntu-host, gg-ubuntu-nucleus, gg-ubuntu-auth, gg-ubuntu-broker, gg-ubuntu-bridge, gg-ubuntu-app, gg-ubuntu-disk]}
    layout3d:
      tiers:
        - {id: management, label: 管理側基盤, z: 0, size: [9, 9]}
        - {id: managementapps, label: 管理側ソフトウェア, z: 1, size: [9, 9]}
        - {id: edgehost, label: 現場端末, z: 0, origin: [12, 0], size: [9, 9]}
        - {id: edgeapps, label: 端末上の処理と保存, z: 1, origin: [12, 0], size: [9, 9]}
        - {id: external, label: 運用者・現場機器, z: 0, origin: [24, 0], size: [7, 4]}
      nodes:
        gg-ubuntu-manager: {tier: management, x: 1, y: 1}
