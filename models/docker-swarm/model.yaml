name: Docker Swarm mode サービススケジューリング
description: replicated の注文 API を Swarm manager が task に割り当て、障害時に置き換える流れ。
reference:
  objectives: [service の desired state と task slot を区別する, scheduler のノード割り当てを説明する, 注文 API のデプロイとローリング更新を追う]
  sources:
    - {title: How services work, url: https://docs.docker.com/engine/swarm/how-swarm-mode-works/services}
    - {title: Deploy services to a swarm, url: https://docs.docker.com/engine/swarm/services}
    - {title: Apply rolling updates to a service, url: https://docs.docker.com/engine/swarm/swarm-tutorial/rolling-update}
sources: [docs/reference-docker-swarm.md]
evidence: [{type: doc, ref: docs/reference-docker-swarm.md#§1}]
tiers: [{id: control, label: Swarm 制御, z: 1, size: [12, 3]}, {id: runtime, label: ノード実行, z: 0, size: [12, 3]}]
nodes:
  service: {label: レプリカ数と設定の宣言, kind: service, tier: control, x: 1, 'y': 1.5, description: replicas と更新方針を持つ desired state。, evidence: [{type: doc, ref: docs/reference-docker-swarm.md#§1}, {type: doc, ref: docs/reference-docker-swarm.md#§3}]}
  manager: {label: 配置制御の入口, kind: scheduler, tier: control, x: 5, 'y': 1.5, description: オーケストレーターと scheduler を実行する管理ノード。, evidence: [{type: doc, ref: docs/reference-docker-swarm.md#§1}, {type: doc, ref: docs/reference-docker-swarm.md#§2}]}
  scheduler: {label: 実行先の決定, kind: scheduler, tier: control, x: 9, 'y': 1.5, description: task slot を条件適合 worker に割り当てる機構。, evidence: [{type: doc, ref: docs/reference-docker-swarm.md#§2}, {type: doc, ref: docs/reference-docker-swarm.md#§3}]}
  task: {label: コンテナの実行単位, kind: service, tier: runtime, x: 2, 'y': 1.5, description: scheduler が container を起動するための一方向の slot。, evidence: [{type: doc, ref: docs/reference-docker-swarm.md#§2}]}
  worker: {label: コンテナ実行ノード, kind: host, tier: runtime, x: 6, 'y': 1.5, description: task に割り当てられ container を実行するノード。, evidence: [{type: doc, ref: docs/reference-docker-swarm.md#§3}, {type: doc, ref: docs/reference-docker-swarm.md#§4}]}
  update: {label: ローリング更新方針, kind: policy, tier: runtime, x: 10, 'y': 1.5, description: 更新並列度・遅延・失敗時動作を定める方針。, evidence: [{type: doc, ref: docs/reference-docker-swarm.md#§5}]}
links:
  - {id: desired, from: service, to: manager, label: desired state, evidence: [{type: doc, ref: docs/reference-docker-swarm.md#§1}]}
  - {id: assign, from: manager, to: scheduler, label: task を計画, evidence: [{type: doc, ref: docs/reference-docker-swarm.md#§2}]}
  - {id: fill, from: scheduler, to: task, label: slot を作成, evidence: [{type: doc, ref: docs/reference-docker-swarm.md#§2}]}
  - {id: run, from: task, to: worker, label: container を実行, evidence: [{type: doc, ref: docs/reference-docker-swarm.md#§3}]}
  - {id: recover, from: manager, to: scheduler, label: 失敗 task を再配置, evidence: [{type: doc, ref: docs/reference-docker-swarm.md#§4}]}
scenarios:
  - id: order-api
    label: 注文 API のデプロイ
    evidence: [{type: doc, ref: docs/reference-docker-swarm.md#§1}, {type: doc, ref: docs/reference-docker-swarm.md#§2}, {type: doc, ref: docs/reference-docker-swarm.md#§3}]
    steps:
      - {links: [desired], note: replicated Service に注文 API の desired replicas を登録する。}
      - {links: [assign, fill], note: manager の scheduler が task slot を作り worker を選ぶ。}
      - {links: [run], note: worker が task の container を起動し API を提供する。}
  - id: replacement
    label: 注文 API の置き換え
    evidence: [{type: doc, ref: docs/reference-docker-swarm.md#§4}, {type: doc, ref: docs/reference-docker-swarm.md#§5}]
    steps:
      - {links: [recover], note: health check 失敗または worker drain を検知する。}
      - {links: [assign, fill], note: scheduler が利用可能な worker へ新 task を割り当てる。}
      - {links: [run], note: 新 container が RUNNING になり、更新なら UpdateConfig の順序で次へ進む。}
implementations:
  - id: vm
    label: Docker Engine と routing mesh
    description: Docker Engine の manager / worker VM 間で注文 API をローリング更新し、公開ポートから同じ名前で到達する例。
    sources:
      - title: Swarm services
        url: https://docs.docker.com/engine/swarm/services/
      - title: Swarm mode routing mesh
        url: https://docs.docker.com/engine/swarm/ingress/
      - title: Rolling updates
        url: https://docs.docker.com/engine/swarm/swarm-tutorial/rolling-update/
      - {title: "Docker Swarm manager の運用とバックアップ", url: https://docs.docker.com/engine/swarm/admin_guide/}
    tiers:
      - id: control
        label: Swarm 制御
        z: 1
      - id: runtime
        label: ノード実行
        z: 0
    groups:
      - kind: cluster
        label: Docker Swarm
        provider: onprem
        tier:
          - control
          - runtime
        nodes:
          - vm-manager
          - vm-raft
          - vm-worker
          - vm-task
          - vm-ingress
    nodes:
      vm-service:
        label: docker service のサービス仕様
        kind: file
        tier: control
        realizes:
          - service
        description: 注文 API のイメージ、レプリカ数、公開ポートを宣言する。
        management: {type: customer, scope: 利用者がサービス仕様を設定する。}
        evidence:
          - type: doc
            ref: docs/reference-docker-swarm.md#§6
      vm-manager:
        label: Docker Swarm manager VM × 3
        kind: worker
        tier: control
        svc: onprem:vm
        realizes:
          - manager
          - scheduler
        description: 各 manager が Raft の状態を保持し、リーダーがタスクの配置を決める。
        management: {type: customer, scope: 利用者がmanager、Docker Engine と状態を運用する。}
        evidence:
          - type: doc
            ref: docs/reference-docker-swarm.md#§6
      vm-worker:
        label: worker VM 上の Docker Engine
        kind: worker
        tier: runtime
        svc: onprem:vm
        realizes:
          - worker
        description: 割り当てられた Service タスクをコンテナとして実行する。
        management: {type: customer, scope: 利用者がworker、Docker Engine とホスト OS を運用する。}
        evidence:
          - type: doc
            ref: docs/reference-docker-swarm.md#§6
      vm-task:
        label: 注文 API の Service タスク
        kind: service
        tier: runtime
        realizes: [task]
        description: worker の Docker Engine 上で動く注文 API コンテナ。
        management: {type: customer, scope: 利用者がアプリとイメージを管理する。}
        evidence: [{type: doc, ref: docs/reference-docker-swarm.md#§6}]
      vm-update:
        label: Service の UpdateConfig
        kind: policy
        tier: runtime
        realizes:
          - update
        description: 同時に更新するタスク数や失敗時の扱いを設定する。
        management: {type: customer, scope: 利用者が更新設定を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-docker-swarm.md#§6
      vm-ingress:
        label: ingress routing mesh
        kind: lb
        tier: runtime
        description: タスクの有無に関係なく到達したノードから、実行中のサービスのタスクへ接続を転送する。
        management: {type: customer, scope: 利用者が公開ポートと Swarm ネットワークを設定する。}
        evidence:
          - type: doc
            ref: docs/reference-docker-swarm.md#§6
      vm-registry:
        label: コンテナレジストリ
        kind: catalog
        tier: runtime
        description: 配備するイメージをノードから取得可能にする。
        management: {type: customer, scope: 利用者がレジストリの提供先とアクセス権を決める。}
        evidence:
          - type: doc
            ref: docs/reference-docker-swarm.md#§6
      vm-raft: {label: "manager VM ごとの Raft データ", kind: db, tier: control, description: "Docker データディレクトリの swarm 以下に状態を永続化する。", evidence: [{type: doc, ref: docs/reference-docker-swarm.md#§6}]}
    links:
      - {id: vm-run, from: vm-worker, to: vm-task, label: 注文 API コンテナを実行, evidence: [{type: doc, ref: docs/reference-docker-swarm.md#§6}]}
      - {id: vm-persist, from: vm-manager, to: vm-raft, label: Swarm の状態を永続ディスクに保存}
      - id: vm-route
        from: vm-ingress
        to: vm-task
        label: 稼働中のタスクに転送
        evidence:
          - type: doc
            ref: docs/reference-docker-swarm.md#§6
      - id: vm-pull
        from: vm-worker
        to: vm-registry
        label: 配備イメージを取得
        evidence:
          - type: doc
            ref: docs/reference-docker-swarm.md#§6

    layout2d:
      tiers: [{id: diagram, label: 自主管理構成, z: 0, origin: [-4, 0], size: [22, 11]}]
      nodes:
        vm-service: {tier: diagram, x: 2, y: 1}
        vm-manager: {tier: diagram, x: 6, y: 1}
        vm-raft: {tier: diagram, x: 10, y: 1}
        vm-worker: {tier: diagram, x: 6, y: 5}
        vm-task: {tier: diagram, x: 6, y: 8}
        vm-ingress: {tier: diagram, x: 10, y: 6}
        vm-update: {tier: diagram, x: 2, y: 7}
        vm-registry: {tier: diagram, x: 14, y: 3}
      groups:
        - {kind: datacenter, label: 利用者の環境, tier: [diagram], x0: 0, y0: -1, x1: 12, y1: 10, nodes: [vm-service, vm-manager, vm-raft, vm-worker, vm-task, vm-ingress, vm-update]}
        - {kind: cluster, label: Docker Swarm, tier: [diagram], x0: 4, y0: -0.5, x1: 11.8, y1: 9.5, nodes: [vm-manager, vm-raft, vm-worker, vm-task, vm-ingress]}
    layout3d:
      tiers:
        - {id: nodes, label: 実行ノード, z: 0, size: [10, 4]}
        - {id: apps, label: ノード上の処理・データ, z: 1, size: [10, 4]}
        - {id: external, label: クラスタ外の設定・サービス, z: 0, origin: [12, 0], size: [4, 5]}
        - {id: registry, label: レジストリ（提供先未指定）, z: 0, origin: [18, 0], size: [3, 3]}
        - {id: outside, label: 利用者, z: 0, origin: [-5, 0], size: [3, 3]}
      nodes:
        vm-service: {tier: external, x: 1, y: 1}
        vm-manager: {tier: nodes, x: 2, y: 2}
        vm-raft: {tier: apps, x: 2, y: 2}
        vm-worker: {tier: nodes, x: 6, y: 2}
        vm-task: {tier: apps, x: 6, y: 2}
        vm-ingress: {tier: apps, x: 6, y: 3.5}
        vm-update: {tier: external, x: 1, y: 3}
        vm-registry: {tier: registry, x: 1, y: 1}
      groups:
        - {kind: datacenter, label: 利用者の環境, tier: [nodes, apps, external], nodes: [vm-service, vm-manager, vm-raft, vm-worker, vm-task, vm-ingress, vm-update]}
        - {kind: cluster, label: Docker Swarm, tier: [nodes, apps], nodes: [vm-manager, vm-raft, vm-worker, vm-task, vm-ingress]}
