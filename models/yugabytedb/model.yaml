name: YugabyteDB の基本アーキテクチャ
description: YugabyteDB の YSQL・YCQL、YB-Master と YB-TServer、タブレットと Raft、DocDB、トランザクション、xCluster を示す。
reference:
  objectives: [クエリ層とストレージ層（DocDB）の分担を確認する, 行がタブレットに割り当てられ Raft で複製される経路を確認する, YB-Master と YB-TServer の役割を区別する]
  sources:
    - {title: YugabyteDB architecture, url: https://docs.yugabyte.com/preview/architecture/}
    - {title: Sharding data across nodes, url: https://docs.yugabyte.com/preview/architecture/docdb-sharding/sharding/}
    - {title: Replication in DocDB, url: https://docs.yugabyte.com/preview/architecture/docdb-replication/replication/}
    - {title: Distributed transactions overview, url: https://docs.yugabyte.com/preview/architecture/transactions/transactions-overview/}
    - {title: xCluster replication, url: https://docs.yugabyte.com/preview/architecture/docdb-replication/async-replication/}
    - {title: yugabyte-db (GitHub), url: https://github.com/yugabyte/yugabyte-db}
sources: [docs/reference-yugabytedb.md]
evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§1}]
tiers:
  - {id: flow, label: クライアント・クエリ層・ストレージ層, z: 0, size: [46, 11]}
nodes:
  client: {label: クライアント, kind: client, tier: flow, x: 1, y: 5, description: YSQL は PostgreSQL 互換、YCQL は Cassandra 系の API で接続する。, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§2}]}
  ysql: {label: YSQL（PostgreSQL 互換 API）, kind: service, tier: flow, x: 7, y: 3, description: PostgreSQL のクエリ層を再利用するリレーショナル API。, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§2}]}
  ycql: {label: YCQL（Cassandra 系 API）, kind: service, tier: flow, x: 7, y: 7, description: Cassandra QL を起源にもつ準リレーショナル API。ハッシュシャーディングのみ。, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§2}]}
  txn: {label: トランザクション（ハイブリッド時刻・MVCC）, kind: service, tier: flow, x: 13, y: 5, description: 更新は単一行も含めてすべてトランザクションとして扱う。HLC で決めた時刻で MVCC の版を読む。, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§5}]}
  master: {label: YB-Master, kind: service, tier: flow, x: 19, y: 1.5, description: カタログ管理とクラスタの調整を担い、バックグラウンド処理を実行する。, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§3}]}
  tserver: {label: YB-TServer, kind: service, tier: flow, x: 19, y: 5, description: ノード上のタブレットを保持・管理する。, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§3}]}
  tablet: {label: タブレット, kind: db, tier: flow, x: 25, y: 5, description: テーブルを分けたシャード。主キーから所属が決まる。ハッシュ（2 バイト空間、最大 64K）またはレンジで分ける。, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§4}]}
  raft: {label: Raft グループ（リーダー・フォロワー）, kind: service, tier: flow, x: 31, y: 5, description: タブレットごとに 1 リーダーを選び、書き込みをフォロワーへ複製する。RF は障害許容数 f に対して 2f+1 以上。, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§6}]}
  wal: {label: Raft ログ（WAL）, kind: db, tier: flow, x: 37, y: 3, description: 多数のタブレットピアが永続化した時点で書き込みが確定する。, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§6}]}
  docdb: {label: DocDB（RocksDB ベース）, kind: db, tier: flow, x: 37, y: 7, description: タブレットのデータを保持するドキュメントストア。RocksDB を土台にする。, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§2}]}
  xcluster: {label: xCluster（ユニバース間の非同期複製）, kind: service, tier: flow, x: 43, y: 3, description: WAL のレコードを別のユニバースへ非同期に複製する。, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§7}]}
links:
  - {id: c-ysql, from: client, to: ysql, label: SQL を送信, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§2}]}
  - {id: c-ycql, from: client, to: ycql, label: CQL を送信, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§2}]}
  - {id: ysql-txn, from: ysql, to: txn, label: トランザクションを開始, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§5}]}
  - {id: ycql-txn, from: ycql, to: txn, label: トランザクションを開始, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§5}]}
  - {id: txn-ts, from: txn, to: tserver, label: 読み書きを送信, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§5}]}
  - {id: master-ts, from: master, to: tserver, label: カタログとタブレットの配置を管理, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§3}]}
  - {id: ts-tablet, from: tserver, to: tablet, label: 所属タブレットに振り分け, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§4}]}
  - {id: tablet-raft, from: tablet, to: raft, label: 書き込みをリーダーへ, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§6}]}
  - {id: raft-wal, from: raft, to: wal, label: ログを複製・永続化, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§6}]}
  - {id: raft-docdb, from: raft, to: docdb, label: 確定後に適用, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§6}]}
  - {id: wal-xc, from: wal, to: xcluster, label: WAL レコードを非同期に送る, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§7}]}
  - {id: docdb-read, from: docdb, to: tablet, label: リーダーが読み出す, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§6}]}
scenarios:
  - id: write
    label: 書き込みを実行して複製する
    evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§6}]
    steps:
      - {links: [c-ysql, ysql-txn], note: YSQL がトランザクションを開始する。}
      - {links: [txn-ts, ts-tablet], note: 主キーから決まるタブレットへ振り分ける。}
      - {links: [tablet-raft, raft-wal], note: リーダーがフォロワーへ複製し、多数が永続化すると確定する。}
      - {links: [raft-docdb, wal-xc], note: DocDB に適用し、設定があれば別ユニバースへ非同期に送る。}
  - id: read
    label: 強い一貫性で読む
    evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§6}]
    steps:
      - {links: [c-ycql, ycql-txn, txn-ts], note: 読み取りがトランザクション経由でタブレットサーバーへ届く。}
      - {links: [ts-tablet, docdb-read], note: 強い一貫性の読み取りはリーダーが DocDB から返す。}
requirements:
  - {id: YB-01, kind: usecase, title: PostgreSQL 互換の分散 SQL で水平に拡張する, text: YSQL は PostgreSQL のクエリ層を再利用し、テーブルはタブレットに分かれて複数ノードへ配置される。, links: [c-ysql, ts-tablet], evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§2}]}
unknowns:
  - {id: UNK-01, text: YB-Master のメタデータの保存方式（システムカタログの複製など）は取得した資料に記載がなく未確認。, refs: [master]}
  - {id: UNK-02, text: トランザクションステータステーブルと分離レベルの扱いは取得した資料に記載がなく未確認。, refs: [txn]}
  - {id: UNK-03, text: リーダーリース、タブレット分割、コロケーション、リードレプリカの詳細は未確認。, refs: [raft, tablet]}
  - {id: UNK-04, text: 実運用の台数、ゾーン配置、TLS・認証の設定は未確認。, refs: [tserver]}
gates: {maxDrift: 0, maxHigh: 0}
implementations:
  - id: onprem-universe
    label: 自前のサーバー上のユニバース（RF 3）と xCluster の複製先
    description: 3 台の YB-Master と 3 台の YB-TServer でユニバースを組み、タブレットを Raft で複製し、別ユニバースへ xCluster で非同期に複製する例。図は YB-TServer 1 台とそのディスクに省略している。代表例であり、導入事例ではない。
    sources:
      - {title: YugabyteDB architecture, url: https://docs.yugabyte.com/preview/architecture/}
      - {title: Replication in DocDB, url: https://docs.yugabyte.com/preview/architecture/docdb-replication/replication/}
      - {title: xCluster replication, url: https://docs.yugabyte.com/preview/architecture/docdb-replication/async-replication/}
    tiers:
      - {id: diagram, label: クライアント・ユニバース・複製先, z: 0, size: [32, 11]}
    nodes:
      yb-client: {label: クライアント, kind: client, tier: diagram, x: 1, y: 5, realizes: [client], description: PostgreSQL ドライバーや Cassandra 系ドライバーなどの接続元。, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§8}]}
      yb-master: {label: YB-Master（3 台）, kind: service, tier: diagram, x: 9, y: 2, realizes: [master], description: カタログとクラスタの調整を担う。, management: {type: customer, scope: "Customer operates the hosts, YB-Master processes and configuration."}, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§8}]}
      yb-tserver: {label: YB-TServer（YSQL・YCQL・タブレット）, kind: service, tier: diagram, x: 9, y: 6, realizes: [ysql, ycql, txn, tserver, tablet, raft], description: クエリ層と DocDB のタブレットを同じノードで動かし、Raft のリーダーまたはフォロワーを担う。, management: {type: customer, scope: "Customer operates the hosts, YB-TServer processes and configuration."}, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§8}]}
      yb-disk: {label: ローカルディスク（WAL・DocDB）, kind: db, tier: diagram, x: 17, y: 6, realizes: [wal, docdb], description: Raft ログと RocksDB ベースのデータを置く。, management: {type: customer, scope: "Customer operates the disks, backups and access."}, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§8}]}
      yb-target: {label: 複製先ユニバース, kind: service, tier: diagram, x: 25, y: 4, realizes: [xcluster], description: xCluster の複製先となる別の YugabyteDB ユニバース。, management: {type: customer, scope: "Customer operates the second universe."}, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§8}]}
    links:
      - {id: yb-req, from: yb-client, to: yb-tserver, label: SQL・CQL を送信, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§8}]}
      - {id: yb-cat, from: yb-master, to: yb-tserver, label: カタログとタブレット配置を管理, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§8}]}
      - {id: yb-save, from: yb-tserver, to: yb-disk, label: WAL と DocDB に保存, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§8}]}
      - {id: yb-xc, from: yb-disk, to: yb-target, label: WAL を非同期に複製, evidence: [{type: doc, ref: docs/reference-yugabytedb.md#§8}]}
    groups:
      - {kind: datacenter, label: 自前のサーバー群（ユニバース A）, provider: onprem, tier: diagram, nodes: [yb-master, yb-tserver, yb-disk]}
      - {kind: datacenter, label: 自前のサーバー群（ユニバース B）, provider: onprem, tier: diagram, nodes: [yb-target]}
    layout2d:
      tiers:
        - {id: diagram, label: クライアント・ユニバース・複製先, z: 0, size: [32, 11]}
      nodes:
        yb-client: {tier: diagram, x: 1, y: 5}
        yb-master: {tier: diagram, x: 9, y: 2}
        yb-tserver: {tier: diagram, x: 9, y: 6}
        yb-disk: {tier: diagram, x: 17, y: 6}
        yb-target: {tier: diagram, x: 25, y: 4}
      groups:
        - {kind: datacenter, label: 自前のサーバー群（ユニバース A）, provider: onprem, tier: diagram, nodes: [yb-master, yb-tserver, yb-disk]}
        - {kind: datacenter, label: 自前のサーバー群（ユニバース B）, provider: onprem, tier: diagram, nodes: [yb-target]}
    layout3d:
      tiers:
        - {id: clients, label: クライアント, z: 0, size: [6, 11]}
        - {id: universe-a, label: ユニバース A, z: 0, origin: [8, 0], size: [16, 11]}
        - {id: universe-b, label: ユニバース B, z: 0, origin: [25, 0], size: [8, 11]}
      nodes:
        yb-client: {tier: clients, x: 3, y: 5}
        yb-master: {tier: universe-a, x: 3, y: 2}
        yb-tserver: {tier: universe-a, x: 3, y: 6}
        yb-disk: {tier: universe-a, x: 11, y: 6}
        yb-target: {tier: universe-b, x: 4, y: 5}
      groups:
        - {kind: datacenter, label: 自前のサーバー群（ユニバース A）, provider: onprem, tier: [universe-a], nodes: [yb-master, yb-tserver, yb-disk]}
        - {kind: datacenter, label: 自前のサーバー群（ユニバース B）, provider: onprem, tier: [universe-b], nodes: [yb-target]}
