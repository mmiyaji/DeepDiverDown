        kind: service
        tier: flow
        x: 8
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-dwh-differential-privacy.md#§4
        realizes:
          - bound
      ex-aggregate:
        label: BigQuery DP 集計
        kind: service
        tier: flow
        x: 12
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-dwh-differential-privacy.md#§4
        realizes:
          - aggregate
      ex-result:
        label: BigQuery 集計結果
        kind: db
        tier: flow
        x: 16
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-dwh-differential-privacy.md#§4
        realizes:
          - result
      ex-analyst:
        label: 分析者
        kind: actor
        tier: flow
        x: -5
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-dwh-differential-privacy.md#§4
        realizes:
          - analyst
      ex-policy:
        label: BigQuery 分析ルール
        kind: service
        tier: control
        x: 4
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-dwh-differential-privacy.md#§4
        realizes:
          - policy
      ex-budget:
        label: BigQuery 利用者予算（プレビュー）
        kind: db
        tier: control
        x: 8
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-dwh-differential-privacy.md#§4
        realizes:
          - budget
      ex-admin:
        label: 方針管理者
        kind: actor
        tier: control
        x: -5
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-dwh-differential-privacy.md#§4
        realizes:
          - admin
    groups:
