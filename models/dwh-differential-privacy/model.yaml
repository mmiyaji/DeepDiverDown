        aws-clean-rooms-dp-view: {tier: diagram, x: 10, y: 6}
        aws-clean-rooms-dp-bound: {tier: diagram, x: 15, y: 6}
        aws-clean-rooms-dp-aggregate: {tier: diagram, x: 20, y: 6}
        aws-clean-rooms-dp-catalog: {tier: diagram, x: 4, y: 11}
        aws-clean-rooms-dp-source: {tier: diagram, x: 8, y: 11}
        aws-clean-rooms-dp-result: {tier: diagram, x: 25, y: 11}
