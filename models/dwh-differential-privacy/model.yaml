        aws-clean-rooms-dp-output-role: {tier: diagram, x: 25, y: 15}
      groups:
        - {kind: cloud, provider: aws, label: Provider AWS account, tier: diagram, nodes: [aws-clean-rooms-dp-catalog, aws-clean-rooms-dp-source, aws-clean-rooms-dp-input-role]}
        - {kind: cloud, provider: aws, label: AWS Clean Rooms collaboration, tier: diagram, nodes: [aws-clean-rooms-dp-policy, aws-clean-rooms-dp-budget, aws-clean-rooms-dp-view, aws-clean-rooms-dp-bound, aws-clean-rooms-dp-aggregate]}
        - {kind: cloud, provider: aws, label: Recipient AWS account, tier: diagram, nodes: [aws-clean-rooms-dp-result, aws-clean-rooms-dp-output-role]}
    layout3d:
      tiers:
        - {id: users, label: Members, kind: origin, z: 0, origin: [-5, 0], size: [3, 5]}
