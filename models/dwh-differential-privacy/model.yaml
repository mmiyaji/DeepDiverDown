        x: 4
        'y': 1.5
        svc: gcp:bigquery
        evidence:
          - type: doc
            ref: docs/reference-dwh-differential-privacy.md#§4
        realizes:
          - view
      ex-bound:
        label: BigQuery 貢献の制限
        kind: service
        tier: flow
        x: 8
        'y': 1.5
        svc: gcp:bigquery
        evidence:
          - type: doc
            ref: docs/reference-dwh-differential-privacy.md#§4
        realizes:
          - bound
      ex-aggregate:
        label: BigQuery DP 集計
        kind: service
        tier: flow
        x: 12
        'y': 1.5
        svc: gcp:bigquery
        evidence:
          - type: doc
            ref: docs/reference-dwh-differential-privacy.md#§4
        realizes:
          - aggregate
      ex-result:
        label: BigQuery 集計結果
        kind: db
        tier: flow
        x: 16
        'y': 1.5
        svc: gcp:bigquery
        evidence:
          - type: doc
            ref: docs/reference-dwh-differential-privacy.md#§4
        realizes:
          - result
      ex-analyst:
        label: 分析者
        kind: actor
        tier: flow
        x: 20
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-dwh-differential-privacy.md#§4
        realizes:
          - analyst
      ex-policy:
        label: BigQuery 分析ルール
        kind: service
        tier: control
        x: 4
        'y': 1.5
        svc: gcp:bigquery
        evidence:
          - type: doc
            ref: docs/reference-dwh-differential-privacy.md#§4
        realizes:
          - policy
      ex-budget:
        label: BigQuery 利用者予算（プレビュー）
        kind: db
        tier: control
        x: 8
        'y': 1.5
        svc: gcp:bigquery
        evidence:
          - type: doc
            ref: docs/reference-dwh-differential-privacy.md#§4
        realizes:
          - budget
      ex-admin:
        label: 方針管理者
        kind: actor
        tier: control
        x: 0
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-dwh-differential-privacy.md#§4
        realizes:
          - admin
    groups:
      - kind: cloud
        provider: gcp
        label: Google Cloud / BigQuery
        tier:
          - flow
        nodes:
          - ex-source
          - ex-view
          - ex-bound
          - ex-aggregate
          - ex-result
      - kind: cloud
        provider: gcp
        label: Google Cloud / BigQuery
        tier:
          - control
        nodes:
          - ex-policy
          - ex-budget
