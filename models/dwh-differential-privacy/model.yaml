    links:
      - {id: dp-bigquery-access, from: ex-analyst, to: ex-access, label: "Authenticate and authorize query", evidence: [{type: doc, ref: "docs/reference-dwh-differential-privacy.md#§4"}]}
      - {id: dp-bigquery-run, from: ex-access, to: ex-engine, label: "Submit authorized SQL", evidence: [{type: doc, ref: "docs/reference-dwh-differential-privacy.md#§4"}]}
      - {id: dp-bigquery-exec, from: ex-engine, to: ex-aggregate, label: "Execute protected query", evidence: [{type: doc, ref: "docs/reference-dwh-differential-privacy.md#§4"}]}
