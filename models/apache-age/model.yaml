name: Apache AGE の基本アーキテクチャ
description: PostgreSQL の拡張として、SQL 内の cypher() 呼び出しから ag_catalog とグラフごとのラベルテーブルへ頂点・辺を保存する構成を示す。
reference:
  objectives: [SQL 内で openCypher を呼ぶ入口を確認する, ag_catalog の登録情報とラベルテーブルの関係を確認する, 通常のテーブルと同じデータベースで扱う前提と制限を確認する]
  sources:
    - {title: AGE Manual Overview, url: https://age.apache.org/age-manual/master/intro/overview.html}
    - {title: AGE Manual Graphs, url: https://age.apache.org/age-manual/master/intro/graphs.html}
    - {title: AGE Manual Data Types, url: https://age.apache.org/age-manual/master/intro/types.html}
    - {title: AGE Manual Cypher Query Format, url: https://age.apache.org/age-manual/master/intro/cypher.html}
    - {title: apache/age (GitHub), url: https://github.com/apache/age}
sources: [docs/reference-apache-age.md]
evidence: [{type: doc, ref: docs/reference-apache-age.md#§1}]
tiers:
  - {id: flow, label: クライアント・拡張・保存先, z: 0, size: [32, 11]}
nodes:
  client: {label: SQL クライアント, kind: client, tier: flow, x: 1, y: 5.5, description: 接続ごとに LOAD 'age' と search_path の設定を行う。, evidence: [{type: doc, ref: docs/reference-apache-age.md#§3}]}
  sql: {label: SQL の実行（PostgreSQL）, kind: service, tier: flow, x: 8, y: 5.5, description: FROM 句の cypher() を AS の列定義つきで受け付ける。SELECT 句や式の中には書けない。, evidence: [{type: doc, ref: docs/reference-apache-age.md#§7}, {type: doc, ref: docs/reference-apache-age.md#§8}, {type: doc, ref: docs/reference-apache-age.md#§2}]}
  cypher: {label: AGE 拡張の cypher(), kind: service, tier: flow, x: 15, y: 5.5, description: グラフ名と openCypher 文字列を受け取り、agtype の結果を返す。, evidence: [{type: doc, ref: docs/reference-apache-age.md#§7}]}
  catalog: {label: ag_catalog（ag_graph・ag_label）, kind: db, tier: flow, x: 22, y: 1.5, description: グラフとラベルの登録情報。ラベルの種別は v（頂点）と e（辺）。, evidence: [{type: doc, ref: docs/reference-apache-age.md#§4}]}
  graphns: {label: グラフの名前空間, kind: db, tier: flow, x: 22, y: 5.5, description: グラフごとに 1 つ。親テーブル _ag_label_vertex と _ag_label_edge を持つ。, evidence: [{type: doc, ref: docs/reference-apache-age.md#§5}]}
  vlabel: {label: 頂点ラベルのテーブル, kind: db, tier: flow, x: 29, y: 3.5, description: create_vlabel() か CREATE で作られる。頂点は id、label、properties を持つ（agtype）。テーブルの列名は未確認。, evidence: [{type: doc, ref: docs/reference-apache-age.md#§5}, {type: doc, ref: docs/reference-apache-age.md#§6}]}
  elabel: {label: 辺ラベルのテーブル, kind: db, tier: flow, x: 29, y: 7.5, description: create_elabel() か CREATE で作られる。辺は始点・終点の graphid を持つ。, evidence: [{type: doc, ref: docs/reference-apache-age.md#§5}, {type: doc, ref: docs/reference-apache-age.md#§6}]}
  rel: {label: 通常のテーブル, kind: db, tier: flow, x: 15, y: 9.5, description: 同じデータベースのリレーショナルデータ。SQL 側で cypher() の結果と組み合わせる。, evidence: [{type: doc, ref: docs/reference-apache-age.md#§1}]}
links:
  - {id: connect, from: client, to: sql, label: SQL を送信, evidence: [{type: doc, ref: docs/reference-apache-age.md#§7}]}
  - {id: call, from: sql, to: cypher, label: FROM 句で cypher() を呼ぶ, evidence: [{type: doc, ref: docs/reference-apache-age.md#§7}]}
  - {id: lookup, from: cypher, to: catalog, label: グラフ・ラベルを参照, evidence: [{type: doc, ref: docs/reference-apache-age.md#§4}]}
  - {id: use-ns, from: cypher, to: graphns, label: 名前空間を指定, evidence: [{type: doc, ref: docs/reference-apache-age.md#§4}]}
  - {id: store-v, from: graphns, to: vlabel, label: 頂点を保存, evidence: [{type: doc, ref: docs/reference-apache-age.md#§5}]}
  - {id: store-e, from: graphns, to: elabel, label: 辺を保存, evidence: [{type: doc, ref: docs/reference-apache-age.md#§5}]}
  - {id: join-rel, from: sql, to: rel, label: 通常のテーブルを読む, evidence: [{type: doc, ref: docs/reference-apache-age.md#§1}]}
scenarios:
  - id: create-graph-data
    label: Cypher の CREATE で頂点と辺を保存する
    evidence: [{type: doc, ref: docs/reference-apache-age.md#§5}]
    steps:
      - {links: [connect, call], note: クライアントが cypher() を含む SQL を送る。}
      - {links: [lookup, use-ns], note: ag_catalog でグラフとラベルを解決する。ラベルがなければテーブルが作られる。}
      - {links: [store-v, store-e], note: 頂点と辺をラベルテーブルへ保存する。}
  - id: query-with-sql
    label: グラフの結果を通常のテーブルと組み合わせる
    evidence: [{type: doc, ref: docs/reference-apache-age.md#§7}]
    steps:
      - {links: [call, lookup], note: cypher() が agtype の結果を返す。}
      - {links: [join-rel], note: SQL 側で通常のテーブルと組み合わせる。}
requirements:
  - {id: AGE-01, kind: usecase, title: 同じデータベースでグラフと表を扱う, text: PostgreSQL の SQL と openCypher を同じ接続で使う。, links: [connect, call, join-rel], evidence: [{type: doc, ref: docs/reference-apache-age.md#§1}]}
unknowns:
  - {id: UNK-01, text: ラベルテーブルの列名は取得した公式資料に記載がなく未確認。, refs: [vlabel, elabel]}
  - {id: UNK-02, text: 対応する PostgreSQL バージョンは README が 11〜18、セットアップ頁が 11〜15 で食い違う。ブランチごとの対応は未確認。, refs: [sql]}
  - {id: UNK-03, text: インデックスと openCypher の対応範囲の公式な制限一覧は未確認。, refs: [cypher]}
gates: {maxDrift: 0, maxHigh: 0}
implementations:
  - id: self-hosted-postgres
    label: 自前の PostgreSQL サーバーに AGE を導入
    description: PostgreSQL に AGE 拡張を入れた自前の単一サーバー構成の例。代表例であり、導入事例ではない。
    sources:
      - {title: apache/age (GitHub), url: https://github.com/apache/age}
      - {title: AGE Manual Graphs, url: https://age.apache.org/age-manual/master/intro/graphs.html}
      - {title: AGE Manual Cypher Query Format, url: https://age.apache.org/age-manual/master/intro/cypher.html}
    tiers:
      - {id: diagram, label: クライアント・PostgreSQL, z: 0, size: [32, 11]}
    nodes:
      age-client: {label: psql・アプリケーション, kind: client, tier: diagram, x: 1, y: 5.5, realizes: [client], description: CREATE EXTENSION age のあと、接続ごとに LOAD 'age' と search_path を設定する。, evidence: [{type: doc, ref: docs/reference-apache-age.md#§3}]}
      age-pg: {label: PostgreSQL サーバー, svc: 'postgresql:server', kind: service, tier: diagram, x: 9, y: 5.5, realizes: [sql, rel], description: 通常のテーブルとグラフのテーブルを同じデータベースに持つ。, management: {type: customer, scope: "Customer operates the PostgreSQL server and extension installation."}, evidence: [{type: doc, ref: docs/reference-apache-age.md#§9}]}
      age-ext: {label: AGE 拡張, kind: service, tier: diagram, x: 17, y: 5.5, realizes: [cypher], description: make install か Docker イメージ apache/age で導入する。, management: {type: customer, scope: "Customer builds or installs the extension."}, evidence: [{type: doc, ref: docs/reference-apache-age.md#§3}]}
      age-store: {label: ag_catalog とグラフのラベルテーブル, kind: db, tier: diagram, x: 25, y: 5.5, realizes: [catalog, graphns, vlabel, elabel], description: PostgreSQL のテーブルとして頂点・辺と登録情報を保存する。, management: {type: customer, scope: "Customer operates storage, backups and access."}, evidence: [{type: doc, ref: docs/reference-apache-age.md#§5}]}
    links: []
    groups:
      - {kind: datacenter, label: 自前のサーバー, provider: onprem, tier: diagram, nodes: [age-pg, age-ext, age-store]}
    layout2d:
      tiers:
        - {id: diagram, label: クライアント・PostgreSQL, z: 0, size: [32, 11]}
      nodes:
        age-client: {tier: diagram, x: 1, y: 5.5}
        age-pg: {tier: diagram, x: 9, y: 5.5}
        age-ext: {tier: diagram, x: 17, y: 5.5}
        age-store: {tier: diagram, x: 25, y: 5.5}
      groups:
        - {kind: datacenter, label: 自前のサーバー, provider: onprem, tier: diagram, nodes: [age-pg, age-ext, age-store]}
    layout3d:
      tiers:
        - {id: client, label: クライアント, z: 0, size: [6, 11]}
        - {id: server, label: PostgreSQL サーバー, z: 0, origin: [8, 0], size: [22, 11]}
      nodes:
        age-client: {tier: client, x: 3, y: 5.5}
        age-pg: {tier: server, x: 3, y: 5.5}
        age-ext: {tier: server, x: 11, y: 5.5}
        age-store: {tier: server, x: 19, y: 5.5}
      groups:
        - {kind: datacenter, label: 自前のサーバー, provider: onprem, tier: server, nodes: [age-pg, age-ext, age-store]}
