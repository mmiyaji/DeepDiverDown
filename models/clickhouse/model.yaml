name: "ClickHouse の基本アーキテクチャ"
description: "SQL を受けるサーバー、ベクトル化された列指向の実行、テーブルエンジン、MergeTree の保存、Distributed とシャード・レプリカ、Keeper による調整までを一枚で見る。"
reference:
  objectives:
    - クエリ処理、テーブルエンジン、ストレージの役割を区別する。
    - MergeTree が不変のパートとして保存し、疎主インデックスで読む範囲を絞ることを説明する。
    - シャード（分散）とレプリカ（複製）の違いと、Distributed テーブル・ReplicatedMergeTree・Keeper の役割を説明する。
    - 自前運用のクラスターと ClickHouse Cloud で、保存と複製の担い手がどう変わるかを比べる。
  sources:
    - title: ClickHouse アーキテクチャ概説（学術論文の解説）
      url: https://clickhouse.com/docs/academic_overview
    - title: ClickHouse MergeTree table engine
      url: https://clickhouse.com/docs/engines/table-engines/mergetree-family/mergetree
    - title: ClickHouse Distributed table engine
      url: https://clickhouse.com/docs/engines/table-engines/special/distributed
    - title: ClickHouse データレプリケーション
      url: https://clickhouse.com/docs/engines/table-engines/mergetree-family/replication
    - title: ClickHouse Keeper
      url: https://clickhouse.com/docs/guides/sre/keeper/clickhouse-keeper
    - title: ClickHouse の水平スケール
      url: https://clickhouse.com/docs/architecture/horizontal-scaling
sources: ["docs/reference-clickhouse.md"]
evidence:
  - {type: doc, ref: "docs/reference-clickhouse.md#§1"}
  - {type: doc, ref: "docs/reference-clickhouse.md#§2"}
  - {type: doc, ref: "docs/reference-clickhouse.md#§3"}
  - {type: doc, ref: "docs/reference-clickhouse.md#§4"}
  - {type: doc, ref: "docs/reference-clickhouse.md#§5"}
  - {type: doc, ref: "docs/reference-clickhouse.md#§6"}
  - {type: doc, ref: "docs/reference-clickhouse.md#§7"}
  - {type: doc, ref: "docs/reference-clickhouse.md#§8"}
  - {type: doc, ref: "docs/reference-clickhouse.md#§9"}
tiers:
  - {id: query, label: クエリ処理, z: 1, size: [22, 7]}
  - {id: storage, label: ストレージ・複製・分散, z: 0, size: [22, 7]}
nodes:
  client:
    label: SQL クライアント
    kind: client
    tier: query
    x: 1
    y: 3
    description: SQL を送り、結果を受け取る。
    evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§2"}]
  planner:
    label: SQL の解析と計画
    kind: service
    tier: query
    x: 6
    y: 3
    replicas: 2
    description: クライアントからの接続を受け、SQL を実行できる形にする。
    evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§2"}]
  scan:
    label: ベクトル化された列処理
    kind: worker
    tier: query
    x: 12
    y: 3
    replicas: 2
    description: 複数行のまとまり（チャンク）を単位に、列ごとのデータを処理する。
    evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§3"}]
  engine:
    label: テーブルエンジン
    kind: service
    tier: query
    x: 17
    y: 3
    replicas: 2
    description: テーブルごとに、データの保存・読み取り・複製・分散の方法を決める。
    evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§4"}]
  granules:
    label: MergeTree のパートと疎主インデックス
    kind: db
    tier: storage
    x: 17
    y: 3
    replicas: 2
    description: 行を主キー順に並べた不変のパートとして保存し、グラニュール単位の疎なインデックスで読む範囲を絞る。
    evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§5"}]
  distributed:
    label: Distributed テーブル
    kind: service
    tier: storage
    x: 1
    y: 3
    replicas: 2
    description: データを持たず、クラスター定義に従って各シャードへ問い合わせ・書き込みを振り分ける。
    evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§6"}]
  replicated:
    label: シャード内のレプリカ（ReplicatedMergeTree）
    kind: db
    tier: storage
    x: 8
    y: 3
    replicas: 2
    description: 同じシャードの複数サーバーが同じデータを持つ。どのレプリカにも書き込める。
    evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§7"}]
  keeper:
    label: ClickHouse Keeper
    kind: catalog
    tier: storage
    x: 13
    y: 3
    replicas: 3
    description: レプリケーションの調整に使うレプリカのメタデータとログを保持する。
    evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§7"}]
links:
  - {id: sql, from: client, to: planner, label: SQL を送る, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§2"}]}
  - {id: open-table, from: planner, to: engine, label: テーブルのエンジンに読み書きを依頼, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§4"}]}
  - {id: read-local, from: engine, to: granules, label: パートから必要な列を読む, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§5"}]}
  - {id: chunks, from: granules, to: scan, label: 列データをチャンクで渡す, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§3"}]}
  - {id: return, from: scan, to: client, label: 結果を返す, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§2"}]}
  - {id: to-distributed, from: engine, to: distributed, label: Distributed の表は各シャードへ回す, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§6"}]}
  - {id: to-replica, from: distributed, to: replicated, label: 各シャードの 1 レプリカへ送る, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§6"}]}
  - {id: replica-store, from: replicated, to: granules, label: ローカルのパートとして保存, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§7"}]}
  - {id: coordinate, from: replicated, to: keeper, label: 更新の記録と同期を調整, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§7"}]}
scenarios:
  - id: local-select
    label: 1 台のテーブルを読む
    evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§5"}]
    steps:
      - {links: [sql], note: クライアントが SQL を送る。}
      - {links: [open-table], note: 計画した読み取りを、テーブルのエンジン（MergeTree）に依頼する。}
      - {links: [read-local], note: 疎主インデックスで候補を絞り、必要な列だけ読む。}
      - {links: [chunks, return], note: 複数行のチャンクを単位に処理し、結果を返す。}
  - id: cluster-select
    label: Distributed テーブルで全シャードを読む
    evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§6"}]
    steps:
      - {links: [sql, open-table], note: Distributed の表への SELECT を、エンジンに依頼する。}
      - {links: [to-distributed, to-replica], note: 各シャードで利用できる 1 レプリカを選び、問い合わせを送る。}
      - {links: [replica-store, read-local], note: 各レプリカが自分のパートを読む。}
      - {links: [chunks, return], note: 結果を集約して返す。集約は一部をシャード側で行える。}
  - id: replicated-insert
    label: レプリカへの書き込みと複製
    evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§7"}]
    steps:
      - {links: [replica-store], note: 書き込みを受けたレプリカが、先に自分のパートとして保存する。}
      - {links: [coordinate], note: 更新を Keeper の調整に記録し、ほかのレプリカが取り込む。}
requirements:
  - {id: BR-01, kind: usecase, title: 全シャードを 1 つの表として検索, text: Distributed テーブルへの SELECT が各シャードを読み、結果を返す。, scenario: cluster-select, links: [to-distributed, to-replica, return], evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§6"}]}
  - {id: BR-02, kind: rule, title: 複製の調整は Keeper に任せる, text: レプリケーションされた表のメタデータの調整に Keeper を使う。, links: [coordinate], evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§7"}]}
unknowns:
  - {id: UNK-01, text: 実環境のシャード数・レプリカ数・Keeper の台数・パート数は未確認。, refs: [distributed, replicated, keeper, granules]}
  - {id: UNK-02, text: Kubernetes 上での運用は、この図では検証していない。, refs: [replicated, keeper]}
  - {id: UNK-03, text: ClickHouse Cloud の内部の制御系の構成は公開資料で確認できていない。, refs: [engine]}
gates: {maxDrift: 0, maxHigh: 0}
implementations:
  - id: self-managed
    label: 自前運用クラスター（Linux ホストの Server と Keeper）
    description: 利用者が Linux ホストに ClickHouse Server と ClickHouse Keeper を導入し、シャードとレプリカを設定ファイルで定義する代表例。
    sources:
      - {title: ClickHouse の水平スケール, url: "https://clickhouse.com/docs/architecture/horizontal-scaling"}
      - {title: ClickHouse の複製, url: "https://clickhouse.com/docs/architecture/replication"}
      - {title: ClickHouse Keeper, url: "https://clickhouse.com/docs/guides/sre/keeper/clickhouse-keeper"}
      - {title: ClickHouse データレプリケーション, url: "https://clickhouse.com/docs/engines/table-engines/mergetree-family/replication"}
    tiers:
      - {id: access, label: クライアント, z: 0, origin: [-6, 0], size: [4, 7]}
      - {id: servers, label: ClickHouse Server のホスト, z: 1, size: [22, 7]}
      - {id: keeperhosts, label: ClickHouse Keeper のホスト, z: 0, size: [22, 4]}
    groups:
      - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: [servers, keeperhosts], nodes: [sm-server, sm-distributed, sm-replica, sm-parts, sm-keeper, sm-config]}
      - {kind: cluster, label: 自前運用のクラスター, tier: [servers, keeperhosts], nodes: [sm-server, sm-distributed, sm-replica, sm-parts, sm-keeper, sm-config]}
    nodes:
      sm-client: {label: clickhouse-client, kind: client, tier: access, x: 1, y: 3, realizes: [client], description: クラスターのいずれかの Server へ SQL を送る。, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§8"}]}
      sm-server: {label: clickhouse-server（SQL 計画・列処理・エンジン）, kind: service, tier: servers, x: 2, y: 3, realizes: [planner, scan, engine], description: 各ホストで SQL を計画し、ベクトル化して実行する。, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§8"}]}
      sm-distributed: {label: Distributed テーブル, kind: service, tier: servers, x: 8, y: 1.5, realizes: [distributed], description: remote_servers に定義したクラスターの各シャードへ振り分ける。, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§8"}]}
      sm-replica: {label: ReplicatedMergeTree のレプリカ, kind: db, tier: servers, x: 8, y: 4.5, realizes: [replicated], description: マクロの shard と replica で識別される各ホストのローカルテーブル。, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§8"}]}
      sm-parts: {label: ホストのローカルディスク上のパート, kind: file, tier: servers, x: 15, y: 4.5, realizes: [granules], description: 各レプリカが自分のディスクにパートを持つ。, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§8"}]}
      sm-keeper: {label: ClickHouse Keeper（3 台以上を推奨）, kind: catalog, tier: keeperhosts, x: 8, y: 1.5, realizes: [keeper], description: Raft で合意し、レプリカのメタデータを保持する。本番では専用ホストを推奨。, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§8"}]}
      sm-config: {label: 設定ファイル（remote_servers・macros・zookeeper）, kind: policy, tier: servers, x: 15, y: 1.5, description: クラスター定義、shard と replica のマクロ、Keeper の接続先を指定する。, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§8"}]}
    links:
      - {id: sm-use-config, from: sm-config, to: sm-server, label: クラスター構成を読み込む}
      - {id: sm-keeper-conn, from: sm-server, to: sm-keeper, label: Keeper のクライアントポートへ接続}
    layout2d:
      tiers:
        - {id: diagram, label: ClickHouse Server と Keeper, z: 0, size: [29, 16]}
      nodes:
        sm-client: {tier: diagram, x: 1, y: 5}
        sm-server: {tier: diagram, x: 10, y: 5}
        sm-distributed: {tier: diagram, x: 18, y: 3}
        sm-replica: {tier: diagram, x: 18, y: 8}
        sm-parts: {tier: diagram, x: 25, y: 8}
        sm-config: {tier: diagram, x: 25, y: 3}
        sm-keeper: {tier: diagram, x: 10, y: 13}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, x0: 5.2, y0: -0.3, x1: 30, y1: 16, nodes: [sm-server, sm-distributed, sm-replica, sm-parts, sm-config, sm-keeper]}
        - {kind: nodegroup, label: ClickHouse Server のホスト, tier: diagram, x0: 6.3, y0: 0.7, x1: 29, y1: 10.3, nodes: [sm-server, sm-distributed, sm-replica, sm-parts, sm-config]}
    layout3d:
      tiers:
        - {id: diagram, label: ClickHouse Server と Keeper, z: 0, size: [23, 13]}
      nodes:
        sm-client: {tier: diagram, x: 0, y: 4}
        sm-server: {tier: diagram, x: 7, y: 4}
        sm-distributed: {tier: diagram, x: 14, y: 2}
        sm-replica: {tier: diagram, x: 14, y: 6}
        sm-parts: {tier: diagram, x: 21, y: 6}
        sm-config: {tier: diagram, x: 21, y: 2}
        sm-keeper: {tier: diagram, x: 7, y: 10}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, x0: 3.7, y0: -0.4, x1: 23.7, y1: 12.4, nodes: [sm-server, sm-distributed, sm-replica, sm-parts, sm-config, sm-keeper]}
        - {kind: nodegroup, label: ClickHouse Server のホスト, tier: diagram, x0: 4.6, y0: 0.3, x1: 22.7, y1: 7.7, nodes: [sm-server, sm-distributed, sm-replica, sm-parts, sm-config]}
  - id: cloud
    label: ClickHouse Cloud（計算とオブジェクトストレージの分離）
    description: ClickHouse Cloud のサービスで、SharedMergeTree が共有のオブジェクトストレージを使い、計算ノードを増減する構成。公開資料にある範囲だけを描く。
    sources:
      - {title: ClickHouse Cloud のアーキテクチャ, url: "https://clickhouse.com/docs/cloud/reference/architecture"}
      - {title: SharedMergeTree, url: "https://clickhouse.com/docs/cloud/reference/shared-merge-tree"}
    tiers:
      - {id: access, label: クライアント, z: 0, origin: [-6, 0], size: [4, 7]}
      - {id: compute, label: 計算ノードとテーブルエンジン, z: 1, size: [22, 7]}
      - {id: shared, label: 共有ストレージと調整, z: 0, size: [22, 5]}
    groups:
      - {kind: cloud, label: ClickHouse Cloud, provider: clickhouse, tier: [compute, shared], nodes: [cl-compute, cl-smt, cl-object, cl-keeper]}
    nodes:
      cl-client: {label: SQL クライアント, kind: client, tier: access, x: 1, y: 3, realizes: [client], description: サービスの URL へ接続して SQL を送る。, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§9"}]}
      cl-compute: {label: 計算ノード（レプリカ）, kind: service, tier: compute, x: 2, y: 3, realizes: [planner, scan, engine, distributed], description: SQL を処理する。レプリカ数を増やして水平に拡張でき、Cloud ではシャードを足さずに拡張できる。, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§9"}]}
      cl-smt: {label: SharedMergeTree, kind: service, tier: compute, x: 10, y: 3, realizes: [replicated], description: ReplicatedMergeTree に代わる Cloud のエンジン。レプリカ間は共有ストレージと Keeper を通じて非同期に調整する。, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§9"}]}
      cl-object: {label: オブジェクトストレージ, kind: db, tier: shared, x: 3, y: 2, realizes: [granules], description: データを保存する。サービスごとに分離される。, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§9"}]}
      cl-keeper: {label: ClickHouse Keeper, kind: catalog, tier: shared, x: 12, y: 2, realizes: [keeper], description: SharedMergeTree のレプリカが調整に使う。, evidence: [{type: doc, ref: "docs/reference-clickhouse.md#§9"}]}
    links:
      - {id: cl-shared-read, from: cl-compute, to: cl-object, label: 共有ストレージから読み書き}
    layout2d:
      tiers:
        - {id: diagram, label: クエリ処理・保存・調整, z: 0, size: [24, 11]}
      nodes:
        cl-client: {tier: diagram, x: 1, y: 3}
        cl-compute: {tier: diagram, x: 10, y: 3}
        cl-smt: {tier: diagram, x: 19, y: 3}
        cl-object: {tier: diagram, x: 10, y: 8}
        cl-keeper: {tier: diagram, x: 19, y: 8}
      groups:
        - {kind: cloud, label: ClickHouse Cloud, provider: clickhouse, tier: diagram, x0: 5.5, y0: 0.5, x1: 23.5, y1: 10.5, nodes: [cl-compute, cl-smt, cl-object, cl-keeper]}
    layout3d:
      tiers:
        - {id: access, label: クライアント, kind: origin, z: 0, origin: [-9, 0], size: [4, 5]}
        - {id: compute, label: 計算ノードとテーブルエンジン, z: 1, size: [15, 5]}
        - {id: shared, label: 共有ストレージと調整, z: 0, size: [15, 5]}
      nodes:
        cl-client: {tier: access, x: 1.5, y: 2.5}
        cl-compute: {tier: compute, x: 3, y: 2}
        cl-smt: {tier: compute, x: 11, y: 2}
        cl-object: {tier: shared, x: 3, y: 3}
        cl-keeper: {tier: shared, x: 11, y: 3}
      groups:
        - {kind: cloud, label: ClickHouse Cloud, provider: clickhouse, tier: [compute, shared], nodes: [cl-compute, cl-smt, cl-object, cl-keeper]}
