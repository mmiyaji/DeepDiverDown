      groups:
        - {kind: datacenter, label: 自前のサーバー群（Kubernetes クラスタ）, provider: onprem, tier: diagram, nodes: [mv-proxy, mv-coord, mv-etcd, mv-stream, mv-query, mv-woodpecker, mv-data, mv-minio]}
