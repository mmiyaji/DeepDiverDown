        drill: iceberg-v3-variant
        evidence:
          - type: doc
            ref: docs/reference-iceberg-v3-metadata.md#§5
        realizes:
          - data
      ex-dictionary:
        label: Variant の metadata
        kind: file
        tier: files
        x: 12
        'y': 1.5
