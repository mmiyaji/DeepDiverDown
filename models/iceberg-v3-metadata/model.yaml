        url: https://iceberg.apache.org/spark-quickstart/
    tiers:
      - id: schema
        label: 表の定義と参照
        z: 2
        size:
          - 20
          - 3
      - id: files
        label: データファイルと値
        z: 1
        size:
          - 20
          - 3
      - id: metadata
        label: 削除参照と読み取り
        z: 0
        size:
          - 20
          - 3
