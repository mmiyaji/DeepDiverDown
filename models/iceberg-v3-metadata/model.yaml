        description: Puffin blob の行位置ビットマップ。参照するデータファイルに適用する。
        evidence:
          - type: doc
            ref: docs/reference-iceberg-v3-metadata.md#§5
        realizes:
          - dv
      ex-reader:
        label: Iceberg 対応 reader
        kind: service
        tier: metadata
        x: 12
        'y': 1.5
        description: 選択した snapshot のファイルと適用される削除を組み合わせる。
