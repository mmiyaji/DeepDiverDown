      ex-catalog-store: {label: REST fixture の SQLite, kind: db, tier: schema, x: 0.7, y: 3, description: JdbcCatalog が試行用の表名とメタデータ位置をコンテナ内の SQLite に格納する。, evidence: [{type: doc, ref: "docs/reference-iceberg-v3-metadata.md#§5"}]}
    links:
      - {id: ex-host-catalog, from: ex-host, to: ex-catalog, label: REST fixture を実行}
      - {id: ex-host-storage, from: ex-host, to: ex-data, label: MinIO のデータを提供}
      - {id: ex-catalog-state, from: ex-catalog, to: ex-catalog-store, label: 表名とメタデータ位置を保存, evidence: [{type: doc, ref: "docs/reference-iceberg-v3-metadata.md#§5"}]}
    layout2d:
      tiers:
        - {id: diagram, label: 実装構成, z: 0, size: [30, 19]}
      nodes:
        ex-host: {tier: diagram, x: 2, y: 2}
        ex-catalog: {tier: diagram, x: 2, y: 5}
        ex-catalog-store: {tier: diagram, x: 2, y: 8}
        ex-reader: {tier: diagram, x: 2, y: 11}
        ex-metadata: {tier: diagram, x: 8, y: 2}
        ex-schema: {tier: diagram, x: 8, y: 5}
        ex-snapshot: {tier: diagram, x: 8, y: 8}
        ex-list: {tier: diagram, x: 8, y: 11}
        ex-data-manifest: {tier: diagram, x: 14, y: 2}
        ex-data: {tier: diagram, x: 14, y: 5}
        ex-dictionary: {tier: diagram, x: 14, y: 8}
        ex-delete-manifest: {tier: diagram, x: 20, y: 2}
        ex-dv: {tier: diagram, x: 20, y: 5}
        ex-lineage: {tier: diagram, x: 20, y: 8}
      groups:
        - {kind: nodegroup, label: "Docker ホストと REST", tier: [diagram], x0: 0, y0: 0, x1: 4, y1: 15, nodes: [ex-host, ex-catalog, ex-catalog-store, ex-reader]}
    layout3d:
      tiers:
        - {id: zone0, label: "Docker ホストと REST", z: 0, origin: [0, 0], size: [5, 12]}
        - {id: zone1, label: "MinIO 表メタデータ", z: 0, origin: [7, 0], size: [5, 12]}
        - {id: zone2, label: "MinIO データ", z: 0, origin: [14, 0], size: [5, 9]}
        - {id: zone3, label: "MinIO 削除と行系譜", z: 0, origin: [21, 0], size: [5, 9]}
      nodes:
        ex-host: {tier: zone0, x: 2, y: 1}
        ex-catalog: {tier: zone0, x: 2, y: 4}
        ex-catalog-store: {tier: zone0, x: 2, y: 7}
        ex-reader: {tier: zone0, x: 2, y: 10}
        ex-metadata: {tier: zone1, x: 2, y: 1}
        ex-schema: {tier: zone1, x: 2, y: 4}
        ex-snapshot: {tier: zone1, x: 2, y: 7}
        ex-list: {tier: zone1, x: 2, y: 10}
        ex-data-manifest: {tier: zone2, x: 2, y: 1}
        ex-data: {tier: zone2, x: 2, y: 4}
        ex-dictionary: {tier: zone2, x: 2, y: 7}
        ex-delete-manifest: {tier: zone3, x: 2, y: 1}
        ex-dv: {tier: zone3, x: 2, y: 4}
        ex-lineage: {tier: zone3, x: 2, y: 7}
      groups:
        - {kind: nodegroup, label: "Docker ホストと REST", tier: [zone0], nodes: [ex-host, ex-catalog, ex-catalog-store, ex-reader]}
  - id: aws-emr-ec2
    label: "AWS：EMR on EC2 / Spark 4.1・Iceberg v3"
    description: "EMR Spark 8.1.0 の Spark 4.1.1 / Iceberg 1.11.0 で、Glue Data Catalog と S3 に置いた Iceberg v3 テーブルの Variant・行の系譜・削除ベクトルを読む例。"
    sources:
      - {title: "Amazon EMR Spark 8.1.0", url: https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-spark810-release.html}
      - {title: "Iceberg v3 compatibility", url: https://docs.aws.amazon.com/prescriptive-guidance/latest/apache-iceberg-on-aws/table-spec-v3.html}
      - {title: "EMR Spark Glue Catalog", url: https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-iceberg-use-spark-cluster.html}
      - {title: "Iceberg specification", url: https://iceberg.apache.org/spec/}
    tiers:
      - {id: management, label: クラスタ管理とテーブル登録, z: 2, size: [20, 4]}
      - {id: compute, label: ジョブの実行, z: 1, size: [20, 4]}
      - {id: storage, label: テーブルの永続ストレージ, z: 0, size: [20, 4]}
      - {id: files, label: データ・削除ファイル, z: -1, size: [20, 4]}
    groups:
      - {kind: cloud, label: AWS アカウント, provider: aws, tier: [management, compute, storage, files], nodes: [aws-emr-control, aws-emr-host, aws-emr-glue, aws-emr-spark, aws-emr-meta, aws-emr-list, aws-emr-data-manifest, aws-emr-delete-manifest, aws-emr-s3, aws-emr-variant, aws-emr-lineage, aws-emr-dv]}
      - {kind: cluster, label: EMR on EC2 クラスタ, tier: compute, nodes: [aws-emr-host, aws-emr-spark]}
    nodes:
