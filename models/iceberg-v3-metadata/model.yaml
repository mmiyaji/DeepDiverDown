        realizes:
          - list
      ex-data-manifest:
        label: MinIO の Data Manifest
        kind: file
        tier: files
        x: 4
        'y': 1.5
        description: データファイルの位置、パーティションと任意の統計を保持する。
        evidence:
          - type: doc
            ref: docs/reference-iceberg-v3-metadata.md#§5
        realizes:
          - data-manifest
      ex-data:
        label: MinIO の Parquet ファイル
        kind: db
        tier: files
        x: 8
        'y': 1.5
        description: Parquet などのデータ。Variant の物理配置を含む。
        drill: iceberg-v3-variant
        evidence:
          - type: doc
            ref: docs/reference-iceberg-v3-metadata.md#§5
        realizes:
          - data
      ex-dictionary:
