        kind: file
        tier: schema
        x: 4
        'y': 1.5
        description: バージョン・スキーマ・snapshot 等を保持する。
        evidence:
          - type: doc
            ref: docs/reference-iceberg-v3-metadata.md#§5
        realizes:
          - metadata
      ex-schema:
        label: 表スキーマと field ID
        kind: file
        tier: schema
        x: 8
        'y': 1.5
        description: 列 ID と型 variant を持ち、値の名前辞書とは異なる。
        drill: iceberg-v3-variant
        evidence:
          - type: doc
            ref: docs/reference-iceberg-v3-metadata.md#§5
        realizes:
          - schema
      ex-snapshot:
        label: 選択した Snapshot
        kind: file
        tier: schema
        x: 12
        'y': 1.5
        description: 特定の時点の表の状態と manifest list を参照する。
        evidence:
          - type: doc
