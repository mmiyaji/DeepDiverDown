      aws-emr-host: {label: "Amazon EC2 / YARN", svc: ec2, kind: host, tier: compute, x: 17, y: 1.5, description: "EMR の EC2 ノードで YARN がアプリケーションの実行リソースを割り当てる。", management: {type: shared, scope: "AWS が EC2 基盤を運用し、利用者がノード構成とジョブを管理する。"}, evidence: [{type: doc, ref: "docs/reference-iceberg-v3-metadata.md#§6"}]}
      aws-emr-glue: {label: "AWS Glue Data Catalog", svc: glue, kind: catalog, tier: management, x: 11, y: 1.5, realizes: [catalog], drill: iceberg-catalog-read, description: "GlueCatalog が表名から現行 metadata.json の場所を解決する。", management: {type: shared, scope: "AWS が Glue 基盤を運用し、利用者がカタログと権限を管理する。"}, evidence: [{type: doc, ref: "docs/reference-iceberg-v3-metadata.md#§6"}]}
      aws-emr-spark: {label: "Spark 4.1.1 / Iceberg 1.11.0", kind: worker, tier: compute, x: 8, y: 1.5, realizes: [reader], description: "Driver が対象 Snapshot を選んで計画し、Executor が DV を適用して Parquet を読む。", management: {type: customer, scope: "利用者が Spark ジョブと設定を管理する。"}, evidence: [{type: doc, ref: "docs/reference-iceberg-v3-metadata.md#§6"}]}
      aws-emr-meta: {label: "metadata.json / Schema・Snapshot", kind: file, tier: storage, x: 3, y: 1.5, realizes: [metadata, schema, snapshot], description: "S3 上に v3 の表定義・列 ID・スナップショット情報を保持する。", evidence: [{type: doc, ref: "docs/reference-iceberg-v3-metadata.md#§6"}]}
      aws-emr-list: {label: "Manifest List", kind: file, tier: storage, x: 8, y: 1.5, realizes: [list], description: "選択したスナップショットの Manifest を列挙する。", evidence: [{type: doc, ref: "docs/reference-iceberg-v3-metadata.md#§6"}]}
