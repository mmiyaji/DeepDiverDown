        - {kind: datacenter, label: 自前 Linux Hadoop ノード群, provider: onprem, tier: [zone0, zone1, zone2], nodes: [hadoop-mapreduce-host, hadoop-mapreduce-front, hadoop-mapreduce-tail, hadoop-mapreduce-hdfs, hadoop-mapreduce-output, hadoop-mapreduce-input]}
