name: Databricks：RocksDB 状態とチェックポイント
description: 状態付き Structured Streaming の RocksDB、差分チェックポイント、障害復旧を追う。
parent:
  model: databricks
  node: transform
reference:
  objectives:
    - 状態付き Structured Streaming の RocksDB、差分チェックポイント、障害復旧を追う。
    - 入力範囲の各イベントで RocksDB のキー別状態を更新する。
    - 差分と進捗を保存し、結果を出力する。snapshot はバックグラウンドで作られる。
  sources:
    - title: 状態付きパイプラインの性能改善
      url: >-
        https://www.databricks.com/blog/deep-dive-latest-performance-improvements-stateful-pipelines-apache-spark-structured-streaming
    - title: RocksDB state store の設定
      url: https://docs.databricks.com/aws/en/structured-streaming/rocksdb-state-store
    - title: Structured Streaming のチェックポイント
      url: https://docs.databricks.com/aws/en/structured-streaming/checkpoints
    - title: 非同期 state checkpointing
      url: https://docs.databricks.com/aws/en/structured-streaming/async-checkpointing
    - title: Databricks コンピュート
      url: https://docs.databricks.com/aws/en/compute/
sources:
  - docs/reference-databricks-streaming-state-internals.md
evidence:
  - type: doc
    ref: docs/reference-databricks-streaming-state-internals.md#§1
  - type: doc
    ref: docs/reference-databricks-streaming-state-internals.md#§4
tiers:
  - id: input
    label: 入力
    z: 3
    size:
      - 23
      - 4
  - id: process
    label: バッチ処理と状態
    z: 2
    size:
      - 23
      - 4
  - id: compute
    label: 再開
    z: 1
    size:
      - 23
      - 4
  - id: data
    label: チェックポイントと出力
    z: 0
    size:
      - 23
      - 4
nodes:
  source:
    label: 再読できる入力
    kind: queue
    tier: input
    x: 0
    'y': 1.5
    description: 入力イベントと処理位置を取得する。
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
  driver:
    label: バッチの進行管理
    kind: service
    tier: process
    x: 0
    'y': 1.5
    description: マイクロバッチの入力範囲と完了状況を管理する。
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
  task:
    label: 状態付き演算
    kind: worker
    tier: process
    x: 5.2
    'y': 1.5
    description: キー別の集計などを行い、状態ストアを読み書きする。
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
  state:
    label: ローカル状態ストア
    kind: db
    tier: process
    x: 10.4
    'y': 1.5
    description: RocksDB がネイティブメモリとローカルディスクを利用してキー別状態を管理する。
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
  changes:
    label: 状態の差分
    kind: file
    tier: data
    x: 0
    'y': 1.5
    description: changelog checkpointing では各バッチの変更を永続ストレージに記録する。
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
  snapshot:
    label: 状態のスナップショット
    kind: file
    tier: data
    x: 5.2
    'y': 1.5
    description: 復旧を速めるためのスナップショットをバックグラウンドで保存する。
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
  progress:
    label: オフセットと完了記録
    kind: file
    tier: data
    x: 10.4
    'y': 1.5
    description: 入力位置、コミット、クエリと状態のメタデータをチェックポイントに保持する。
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
  sink:
    label: 結果の出力
    kind: db
    tier: data
    x: 15.600000000000001
    'y': 1.5
    description: 結果を出力先に保存する。処理保証は出力先の対応に依存する。
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
  restart:
    label: 障害からの再開
    kind: service
    tier: compute
    x: 0
    'y': 1.5
    description: チェックポイントから進捗と状態を復元し、必要な入力を再処理する。
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
links:
  - id: input
    from: source
    to: driver
    label: 入力位置を取得
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
  - id: schedule
    from: driver
    to: task
    label: 入力範囲を実行
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
  - id: update
    from: task
    to: state
    label: キー別の状態を読み書き
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
  - id: change
    from: state
    to: changes
    label: 変更を保存
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
  - id: save
    from: state
    to: snapshot
    label: 状態の基準を保存
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
  - id: offset
    from: driver
    to: progress
    label: 進捗と完了を記録
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
  - id: output
    from: task
    to: sink
    label: 結果を出力
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
  - id: replay
    from: changes
    to: restart
    label: 差分を読み戻す
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
  - id: restore
    from: snapshot
    to: restart
    label: 基準状態を読み戻す
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
  - id: resume
    from: progress
    to: restart
    label: 再開位置を確認
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
  - id: rebuild
    from: restart
    to: state
    label: 状態を復元
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
  - id: reread
    from: restart
    to: source
    label: 必要な入力を再読
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§2
scenarios:
  - id: flow
    label: データと処理の流れ
    evidence:
      - type: doc
        ref: docs/reference-databricks-streaming-state-internals.md#§3
    steps:
      - links:
          - input
          - schedule
          - update
        note: 入力範囲の各イベントで RocksDB のキー別状態を更新する。
        highlight:
          - localstate
      - links:
          - change
          - save
          - offset
          - output
        note: 差分と進捗を保存し、結果を出力する。snapshot はバックグラウンドで作られる。
        highlight:
          - change1
          - change2
          - snapshot1
          - offset1
      - links:
          - resume
          - restore
          - replay
          - rebuild
          - reread
        note: 障害後に保存済みの状態と進捗を復元し、必要な入力を再処理する。
        highlight:
          - snapshot1
          - change1
          - change2
          - offset1
    visual: checkpoint
unknowns:
  - id: internal-deployment
    description: 公開されていない内部配置・閾値は特定できない。
implementations:
  - id: databricks
    label: AWS 上の Databricks Jobs と S3
    description: >-
      Lakeflow Jobs が顧客 AWS アカウントのクラシックジョブコンピュートで Structured Streaming を実行する。
      クエリは外部の Kafka 入力を処理し、クエリ専用の S3 チェックポイントに状態と進捗を保存する。結果は S3 上の Delta テーブルに書き込む。
      S3 はクラスタと同じ顧客 AWS アカウントに置く構成例とする。Kafka の提供元と設置場所は指定しない。
    sources:
      - title: 状態付きパイプラインの性能改善
        url: >-
          https://www.databricks.com/blog/deep-dive-latest-performance-improvements-stateful-pipelines-apache-spark-structured-streaming
      - title: RocksDB state store の設定
        url: https://docs.databricks.com/aws/en/structured-streaming/rocksdb-state-store
      - title: Structured Streaming のチェックポイント
        url: https://docs.databricks.com/aws/en/structured-streaming/checkpoints
      - title: 非同期 state checkpointing
        url: https://docs.databricks.com/aws/en/structured-streaming/async-checkpointing
      - title: Databricks on AWS のアーキテクチャ
        url: https://docs.databricks.com/aws/en/getting-started/high-level-architecture
      - title: クラシックコンピュートの設定
        url: https://docs.databricks.com/aws/en/compute/configure
      - title: 本番向け Structured Streaming のジョブ設定
        url: https://docs.databricks.com/aws/en/structured-streaming/production
      - title: Lakeflow Jobs の継続実行
        url: https://docs.databricks.com/aws/en/jobs/continuous
      - title: Apache Kafka への接続
        url: https://docs.databricks.com/aws/en/connect/streaming/kafka
      - title: Spark Structured Streaming の Kafka コネクター
        url: https://spark.apache.org/docs/latest/streaming/structured-streaming-kafka-integration.html
      - title: Delta テーブルのストリーミング書き込み
        url: https://docs.databricks.com/aws/en/structured-streaming/delta-lake
      - title: Amazon S3 の責任共有モデル
        url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/security.html
    tiers: &classic-job-tiers
      - {id: diagram, label: クラシックジョブコンピュートと S3, z: 0, origin: [-3, 0], size: [30, 18]}
    nodes:
      ex-source:
        label: 外部 Kafka 入力
        kind: external
        tier: diagram
        x: 0
        'y': 7
        description: クエリが接続する Kafka トピック。入力元の提供者と設置場所は指定せず、再処理に必要なオフセットが保持されることを前提とする。
        evidence:
          - type: doc
            ref: docs/reference-databricks-streaming-state-internals.md#§5
        realizes:
          - source
      ex-driver:
        label: Spark ドライバー
        kind: service
        tier: diagram
        x: 8
        'y': 6
        description: Databricks Runtime のドライバー上でクエリを実行し、マイクロバッチの入力範囲と完了状況を管理する。
        evidence:
          - type: doc
            ref: docs/reference-databricks-streaming-state-internals.md#§5
        realizes:
          - driver
      ex-task:
        label: Spark エグゼキューター
        kind: worker
        tier: diagram
        x: 14
        'y': 6
        description: Databricks Runtime のワーカー上で入力を読み、キー別の集計などのタスクを実行する。状態はワーカーのローカル状態ストアに読み書きする。
        evidence:
          - type: doc
            ref: docs/reference-databricks-streaming-state-internals.md#§5
        realizes:
          - task
      ex-state:
        label: RocksDB state store
        kind: db
        tier: diagram
        x: 20
        'y': 6
        description: RocksDB がワーカーのネイティブメモリとローカルディスクを利用してキー別状態を管理する。
        evidence:
          - type: doc
            ref: docs/reference-databricks-streaming-state-internals.md#§5
        realizes:
          - state
      ex-changes:
        label: 状態の changelog
        kind: file
        tier: diagram
        x: 23
        'y': 12
        description: changelog checkpointing では各バッチの変更を S3 のチェックポイントに記録する。
        evidence:
          - type: doc
            ref: docs/reference-databricks-streaming-state-internals.md#§5
        realizes:
          - changes
      ex-snapshot:
        label: RocksDB snapshot
        kind: file
        tier: diagram
        x: 18
        'y': 12
        description: 復旧を速めるためのスナップショットをバックグラウンドで S3 のチェックポイントに保存する。
        evidence:
          - type: doc
            ref: docs/reference-databricks-streaming-state-internals.md#§5
        realizes:
          - snapshot
      ex-progress:
        label: チェックポイントログ
        kind: file
        tier: diagram
        x: 8
        'y': 12
        description: 入力位置、コミット、クエリと状態のメタデータを S3 のチェックポイントに保持する。
        evidence:
          - type: doc
            ref: docs/reference-databricks-streaming-state-internals.md#§5
        realizes:
          - progress
      ex-sink:
        label: Delta 出力テーブル
        kind: table
        tier: diagram
        x: 13
        'y': 12
        description: 結果を S3 上の Delta テーブルに書き込む。
        evidence:
          - type: doc
            ref: docs/reference-databricks-streaming-state-internals.md#§5
        realizes:
          - sink
      ex-restart:
        label: クエリの復旧
        kind: service
        tier: diagram
        x: 8
        'y': 9
        description: 再起動した Structured Streaming が同じチェックポイントから進捗と状態を復元し、必要な入力を再処理する。
        evidence:
          - type: doc
            ref: docs/reference-databricks-streaming-state-internals.md#§5
        realizes:
          - restart
      ex-jobs:
        label: Lakeflow Jobs
        svc: databricks:lakeflow
        kind: service
        tier: diagram
        x: 0
        'y': 2
        description: Databricks のコントロールプレーンがジョブを起動し、継続実行で障害が起きたジョブを再試行する。利用者はジョブ定義でトリガーや実行環境を設定する。
        evidence:
          - type: doc
            ref: docs/reference-databricks-streaming-state-internals.md#§5
      ex-compute:
        label: EC2 ドライバー・ワーカーノード
        svc: aws:ec2
        kind: host
        tier: diagram
        x: 14
        'y': 3
        description: クラシックジョブコンピュートの EC2 ノードで Databricks Runtime が動く。
        management:
          type: shared
          scope: AWS が EC2 基盤を運用し、利用者は Lakeflow Jobs でノード型や Databricks Runtime を指定する。
        evidence:
          - type: doc
            ref: docs/reference-databricks-streaming-state-internals.md#§5
      ex-s3:
        label: Amazon S3
        svc: aws:s3
        kind: db
        tier: diagram
        x: 15.5
        'y': 16
        description: クエリ専用のチェックポイントと Delta 出力テーブルのオブジェクトを保存する。
        management:
          type: aws
          scope: AWS は S3 の基盤を運用する。利用者はバケットの設定、データ、アクセス権限を管理する。
        evidence:
          - type: doc
            ref: docs/reference-databricks-streaming-state-internals.md#§5
    links:
      - {id: ex-start-job, from: ex-jobs, to: ex-compute, label: ジョブを起動・再試行}
      - {id: ex-start-query, from: ex-compute, to: ex-driver, label: クエリを実行}
      - {id: ex-fetch-records, from: ex-source, to: ex-task, label: 入力イベントを読み取る, realizes: [input]}
      - {id: ex-store-changes, from: ex-changes, to: ex-s3, label: changelog を保存}
      - {id: ex-store-snapshot, from: ex-snapshot, to: ex-s3, label: snapshot を保存}
      - {id: ex-store-progress, from: ex-progress, to: ex-s3, label: チェックポイントログを保存}
      - {id: ex-store-output, from: ex-sink, to: ex-s3, label: Delta のデータとログを保存}
    groups: &classic-job-groups
      - {kind: cloud, provider: databricks, label: Databricks コントロールプレーン, tier: diagram, x0: -2.8, y0: 0, x1: 2.8, y1: 4, nodes: &job-control-nodes [ex-jobs]}
      - {kind: cloud, provider: aws, label: 顧客 AWS アカウント, tier: diagram, x0: 4.5, y0: 0, x1: 26, y1: 18, nodes: &job-aws-nodes [ex-compute, ex-driver, ex-task, ex-state, ex-restart, ex-progress, ex-changes, ex-snapshot, ex-sink, ex-s3]}
      - {kind: cluster, label: クラシックジョブコンピュート, tier: diagram, x0: 5.5, y0: 1.4, x1: 24.5, y1: 10.5, nodes: [ex-compute, ex-driver, ex-task, ex-state, ex-restart]}
    layout2d:
      tiers: *classic-job-tiers
      groups: *classic-job-groups
      nodes: {}
    layout3d:
      tiers:
        - {id: runtime, label: Jobs クラスタの Databricks Runtime, z: 1, origin: [5, 0], size: [20, 8]}
        - {id: platform, label: ジョブ制御・EC2・S3, z: 0, origin: [-4, 0], size: [30, 15]}
      nodes:
        ex-jobs: {tier: platform, x: 0, y: 2}
        ex-source: {tier: platform, x: 0, y: 8}
        ex-compute: {tier: platform, x: 16, y: 3}
        ex-driver: {tier: runtime, x: 1, y: 2}
        ex-task: {tier: runtime, x: 7, y: 2}
        ex-state: {tier: runtime, x: 13, y: 2}
        ex-restart: {tier: runtime, x: 1, y: 5}
        ex-progress: {tier: platform, x: 10, y: 10}
        ex-sink: {tier: platform, x: 15, y: 10}
        ex-snapshot: {tier: platform, x: 20, y: 10}
        ex-changes: {tier: platform, x: 25, y: 10}
        ex-s3: {tier: platform, x: 8.8, y: 13}
      groups:
        - {kind: cloud, provider: databricks, label: Databricks コントロールプレーン, tier: platform, nodes: *job-control-nodes}
        - {kind: cloud, provider: aws, label: 顧客 AWS アカウント, tier: [runtime, platform], nodes: *job-aws-nodes}
        - {kind: cluster, tier: platform, x0: 13.2, y0: 1, x1: 18.5, y1: 6.6, nodes: [ex-compute]}
        - {kind: cluster, tier: runtime, x0: 0, y0: 0.85, x1: 14.25, y1: 7.9, nodes: [ex-driver, ex-task, ex-state, ex-restart]}
blocks:
  - id: checkpoint
    title: 状態とチェックポイント（概念例）
    note: バッチ番号は説明用。差分・スナップショット・進捗を組み合わせて復元する。
    lanes:
      - id: local
        label: 実行中の状態
        node: state
      - id: delta
        label: 差分
        node: changes
      - id: base
        label: スナップショット
        node: snapshot
      - id: progress
        label: 入力の進捗
        node: progress
    items:
      local:
        - id: localstate
          label: key A → 42
          k: 0
          note: 実行中の状態例。
      delta:
        - id: change1
          label: batch 2 の変更
          k: 1
          note: 変更したキーの差分。
        - id: change2
          label: batch 3 の変更
          k: 2
          note: 続くバッチの差分。
      base:
        - id: snapshot1
          label: batch 1 の基準
          k: 3
          note: 復旧の基準となる状態の例。
      progress:
        - id: offset1
          label: 入力 offset と commit
          k: 4
          note: どこから再開するかを判断する。
