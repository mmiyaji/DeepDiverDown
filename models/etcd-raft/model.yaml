name: "etcd と Raft のクォーラム"
description: "3メンバーの etcd を例に、注文 API の設定変更がコミットされる条件と、リーダーが孤立した場合の選出・復旧を追います。"
reference:
  objectives:
    - "リーダー、フォロワー、過半数の関係を把握する。"
    - "過半数を維持した側で書き込みが再開する過程を追う。"
    - "クライアントのタイムアウトとコミットの有無を区別する。"
  sources:
    - {title: "etcd Failure modes", url: "https://etcd.io/docs/v3.6/op-guide/failures/"}
    - {title: "etcd API guarantees", url: "https://etcd.io/docs/v3.6/learning/api_guarantees/"}
    - {title: "In Search of an Understandable Consensus Algorithm (Raft)", url: "https://raft.github.io/raft.pdf"}
    - {title: "etcd FAQ", url: "https://etcd.io/docs/v3.6/faq/"}
sources: [docs/reference-etcd-raft.md]
evidence: [{type: doc, ref: "docs/reference-etcd-raft.md#§1"}]
tiers:
  - {id: "client", label: "設定の更新", z: 1, size: [14,4], kind: "origin"}
  - {id: "cluster", label: "etcd クラスタ", z: 0, size: [14,7]}
nodes:
  operator: {label: "運用者", kind: "actor", tier: "client", x: 0, y: 1.5, description: "注文 API の受付上限を設定変更する。", evidence: [{type: doc, ref: "docs/reference-etcd-raft.md#§1"}]}
  client: {label: 状態更新のクライアント, kind: client, tier: client, x: 5, 'y': 1.5, description: 設定キーへの Put と完了を確認する。, evidence: [{type: doc, ref: docs/reference-etcd-raft.md#§2}]}
  member-a: {label: "メンバー A", kind: "db", tier: "cluster", x: 2, y: 1.5, description: "初期状態のリーダー。分断時には単独になる。", evidence: [{type: doc, ref: "docs/reference-etcd-raft.md#§3"}]}
  member-b: {label: "メンバー B", kind: "db", tier: "cluster", x: 6, y: 1.5, description: "初期状態のフォロワー。例では分断後にリーダーとなる。", evidence: [{type: doc, ref: "docs/reference-etcd-raft.md#§4"}]}
  member-c: {label: "メンバー C", kind: "db", tier: "cluster", x: 10, y: 1.5, description: "初期状態のフォロワー。分断中も B と通信できる。", evidence: [{type: doc, ref: "docs/reference-etcd-raft.md#§4"}]}
  setting: {label: 確定した設定値, kind: segment, tier: cluster, x: 6, 'y': 5, description: 各メンバーの状態機械で反映される注文 API の設定キーを論理的に表す。, evidence: [{type: doc, ref: docs/reference-etcd-raft.md#§2}]}
links:
  - {id: "update", from: "operator", to: "client", label: "受付上限の更新を指示", evidence: [{type: doc, ref: "docs/reference-etcd-raft.md#§1"}]}
  - {id: "put-a", from: "client", to: "member-a", label: "A に Put", evidence: [{type: doc, ref: "docs/reference-etcd-raft.md#§2"}]}
  - {id: "put-b", from: "client", to: "member-b", label: "B に Put", evidence: [{type: doc, ref: "docs/reference-etcd-raft.md#§4"}]}
  - {id: "a-replicate-b", from: "member-a", to: "member-b", label: "Raft ログを複製", evidence: [{type: doc, ref: "docs/reference-etcd-raft.md#§3"}]}
  - {id: "a-replicate-c", from: "member-a", to: "member-c", label: "Raft ログを複製", evidence: [{type: doc, ref: "docs/reference-etcd-raft.md#§3"}]}
  - {id: "elect-replicate", from: "member-b", to: "member-c", label: "投票・ログ複製", evidence: [{type: doc, ref: "docs/reference-etcd-raft.md#§4"}]}
  - {id: "apply-a", from: "member-a", to: "setting", label: "コミット後に設定に反映", evidence: [{type: doc, ref: "docs/reference-etcd-raft.md#§3"}]}
  - {id: "apply-b", from: "member-b", to: "setting", label: "コミット後に設定に反映", evidence: [{type: doc, ref: "docs/reference-etcd-raft.md#§4"}]}
  - {id: "catch-up", from: "member-b", to: "member-a", label: "復旧した A が追随", evidence: [{type: doc, ref: "docs/reference-etcd-raft.md#§5"}]}
scenarios:
  - id: write-majority
    label: "3メンバーで設定を更新"
    evidence: [{type: doc, ref: "docs/reference-etcd-raft.md#§2"}, {type: doc, ref: "docs/reference-etcd-raft.md#§3"}]
    steps:
      - {links: ["update","put-a"], note: "クライアントがリーダー A に受付上限を 100 にする Put を送る。"}
      - {links: ["a-replicate-b","a-replicate-c"], note: "A が今の任期のログエントリを複製する。A 自身とフォロワー 1 台で 2/3 の過半数を満たす。"}
      - {links: ["apply-a"], note: "コミット済みの更新を状態機械に適用し、Put の成功を返す。"}
  - id: partition
    label: "リーダーが 1 対 2 の分断で孤立"
    evidence: [{type: doc, ref: "docs/reference-etcd-raft.md#§3"}, {type: doc, ref: "docs/reference-etcd-raft.md#§4"}, {type: doc, ref: "docs/reference-etcd-raft.md#§5"}]
    visual: partition-quorum
    steps:
      - links: [put-a]
        note: 分断で A が孤立する。A は過半数を得られず追加の更新をコミットできない。
        lanes:
          a: {sub: 少数派・到達可能 1/3, tone: down}
          b: {sub: 多数派・選挙前}
          c: {sub: 多数派・選挙前}
      - links: [elect-replicate]
        note: B と C は互いに通信できる。選挙が完了して B が新しいリーダーになる。
        lanes:
          a: {sub: 少数派・到達可能 1/3, tone: down}
          b: {sub: 新リーダー・到達可能 2/3, tone: new}
          c: {sub: フォロワー}
      - links: [put-b]
        note: クライアントが B に受付上限を 120 にする Put を送る。B が新しい値をログに追加する。
        lanes:
          a: {sub: 少数派・到達可能 1/3, tone: down}
          b: {sub: リーダー・到達可能 2/3}
          c: {sub: フォロワー}
        blocks:
          b: [{id: b120, label: 上限 120, k: 3}]
      - links: [elect-replicate, apply-b]
        note: B が C にログを複製する。B と C の 2 台でコミットし、更新を適用する。
        blocks:
          b: [{id: b120, label: 上限 120, k: 0}]
          c: [{id: c120, label: 上限 120, k: 0, from: [b120]}]
      - links: [catch-up]
        note: 分断が解消すると A が新しいリーダーに追随し、コミット済みの状態に追いつく。
        lanes:
          a: {sub: 復旧したフォロワー, tone: new}
          b: {sub: リーダー・到達可能 3/3}
          c: {sub: フォロワー}
        blocks:
          a: [{id: a120, label: 上限 120, k: 0, from: [b120]}]
          b: [{id: b120, label: 上限 120, k: 0}]
          c: [{id: c120, label: 上限 120, k: 0}]
blocks:
  id: partition-quorum
  title: 分断前後のメンバーと新しい設定
  note: 受付上限 120 がコミットされ、各メンバーに反映される順序を追う。
  legend: {0: コミット済み, 3: 未コミット}
  lanes:
    - {id: a, label: メンバー A, sub: 初期リーダー, node: member-a}
    - {id: b, label: メンバー B, sub: 初期フォロワー, node: member-b}
    - {id: c, label: メンバー C, sub: 初期フォロワー, node: member-c}
  items: {a: [], b: [], c: []}
implementations:
  - id: etcd
    label: AWS（3 AZ の EC2 で運用する etcd）
    description: 各 AZ に EC2 上の etcd メンバーと専用 EBS を1組ずつ置き、状態を etcdctl で確認する例。
    sources:
      - title: etcd Clustering Guide
        url: https://etcd.io/docs/v3.6/op-guide/clustering/
      - title: etcd Cluster Status
        url: https://etcd.io/docs/v3.6/tasks/operator/how-to-check-cluster-status/
      - title: etcd API guarantees
        url: https://etcd.io/docs/v3.6/learning/api_guarantees/
      - {title: etcd のハードウェア要件, url: https://etcd.io/docs/v3.6/op-guide/hardware/}
      - {title: Amazon EBS ボリュームのアタッチ, url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-attaching-volume.html}
    tiers:
      - id: client
        label: 設定の更新
        z: 2
        kind: origin
      - id: cluster
        label: etcd クラスタ
        z: 1
      - {id: disk, label: メンバーごとのローカル永続化, z: 0, size: [14, 4]}
    groups:
      - {kind: cloud, provider: aws, label: AWS アカウント, tier: [cluster, disk]}
      - kind: cluster
        label: 同一リージョン・VPC の 3 投票メンバー
        tier:
          - cluster
        nodes:
          - etcd-member-a
          - etcd-member-b
          - etcd-member-c
          - etcd-setting
    nodes:
      etcd-operator:
        label: 設定変更を行う運用者
        kind: actor
        tier: client
        realizes:
          - operator
        description: テスト用の受付上限キーの値を変更する。
        evidence:
          - type: doc
            ref: docs/reference-etcd-raft.md#§6
      etcd-client:
        label: etcdctl put
        kind: client
        tier: client
        realizes:
          - client
        description: 認証済みクライアントから複数のクライアントエンドポイントを指定する。
        evidence:
          - type: doc
            ref: docs/reference-etcd-raft.md#§6
      etcd-member-a:
        label: EC2（etcd メンバー A・AZ A）
        kind: db
        tier: cluster
        svc: ec2
        x: 2
        y: 1.5
        realizes:
          - member-a
        description: 初期リーダーの例。Raft ログとローカルデータを保持する。
        evidence:
          - type: doc
            ref: docs/reference-etcd-raft.md#§6
        management: {type: shared, scope: "AWS が EC2 基盤を運用し、利用者が OS・etcd・バックアップを管理する。"}
      etcd-member-b:
        label: EC2（etcd メンバー B・AZ B）
        kind: db
        tier: cluster
        svc: ec2
        x: 6
        y: 1.5
        realizes:
          - member-b
        description: A 停止後にリーダーとなる候補。
        evidence:
          - type: doc
            ref: docs/reference-etcd-raft.md#§6
        management: {type: shared, scope: "AWS が EC2 基盤を運用し、利用者が OS・etcd・バックアップを管理する。"}
      etcd-member-c:
        label: EC2（etcd メンバー C・AZ C）
        kind: db
        tier: cluster
        svc: ec2
        x: 10
        y: 1.5
        realizes:
          - member-c
        description: 同じ Raft グループに参加する。
        evidence:
          - type: doc
            ref: docs/reference-etcd-raft.md#§6
        management: {type: shared, scope: "AWS が EC2 基盤を運用し、利用者が OS・etcd・バックアップを管理する。"}
      etcd-setting:
        label: etcd MVCC の受付上限キー
        kind: table
        tier: cluster
        x: 6
        y: 5
        realizes:
          - setting
        description: 各メンバーの適用済み状態に存在する同じキーを表す。別ストレージへの複製を示す箱ではない。
        evidence:
          - type: doc
            ref: docs/reference-etcd-raft.md#§6
      etcd-health:
        label: etcdctl endpoint status
        kind: monitor
        tier: client
        description: リーダーの識別と各エンドポイントの状態確認に使う。
        evidence:
          - type: doc
            ref: docs/reference-etcd-raft.md#§6
      etcd-ebs-a: {label: Amazon EBS（A のデータ）, svc: ebs, kind: db, tier: disk, x: 2, y: 1.5, description: 同じ AZ のメンバー A 専用で etcd の WAL とバックエンドを保存する。, management: {type: shared, scope: "AWS が EBS 基盤を運用し、利用者がボリューム・データ・バックアップを管理する。"}, evidence: [{type: doc, ref: docs/reference-etcd-raft.md#§6}]}
      etcd-ebs-b: {label: Amazon EBS（B のデータ）, svc: ebs, kind: db, tier: disk, x: 6, y: 1.5, description: 同じ AZ のメンバー B 専用で etcd の WAL とバックエンドを保存する。, management: {type: shared, scope: "AWS が EBS 基盤を運用し、利用者がボリューム・データ・バックアップを管理する。"}, evidence: [{type: doc, ref: docs/reference-etcd-raft.md#§6}]}
      etcd-ebs-c: {label: Amazon EBS（C のデータ）, svc: ebs, kind: db, tier: disk, x: 10, y: 1.5, description: 同じ AZ のメンバー C 専用で etcd の WAL とバックエンドを保存する。, management: {type: shared, scope: "AWS が EBS 基盤を運用し、利用者がボリューム・データ・バックアップを管理する。"}, evidence: [{type: doc, ref: docs/reference-etcd-raft.md#§6}]}
    links:
      - {id: etcd-local-a, from: etcd-member-a, to: etcd-ebs-a, label: A の WAL と状態を永続化}
      - {id: etcd-local-b, from: etcd-member-b, to: etcd-ebs-b, label: B の WAL と状態を永続化}
      - {id: etcd-local-c, from: etcd-member-c, to: etcd-ebs-c, label: C の WAL と状態を永続化}
      - id: etcd-observe-a
        from: etcd-health
        to: etcd-member-a
        label: 状態を取得
        evidence:
          - type: doc
            ref: docs/reference-etcd-raft.md#§6
      - id: etcd-observe-b
        from: etcd-health
        to: etcd-member-b
        label: 状態を取得
        evidence:
          - type: doc
            ref: docs/reference-etcd-raft.md#§6
      - id: etcd-observe-c
        from: etcd-health
        to: etcd-member-c
        label: 状態を取得
        evidence:
          - type: doc
            ref: docs/reference-etcd-raft.md#§6

    layout2d:
      tiers:
        - {id: diagram, label: 実装構成, z: 0, size: [31, 17]}
      nodes:
        etcd-operator: {tier: diagram, x: 2, y: 2}
        etcd-client: {tier: diagram, x: 2, y: 5}
        etcd-health: {tier: diagram, x: 2, y: 8}
        etcd-member-a: {tier: diagram, x: 8, y: 2}
        etcd-ebs-a: {tier: diagram, x: 8, y: 10}
        etcd-member-b: {tier: diagram, x: 14, y: 2}
        etcd-ebs-b: {tier: diagram, x: 14, y: 10}
        etcd-member-c: {tier: diagram, x: 20, y: 2}
        etcd-ebs-c: {tier: diagram, x: 20, y: 10}
        etcd-setting: {tier: diagram, x: 26, y: 2}
      groups:
        - {kind: cloud, provider: aws, label: AWS アカウント, tier: [diagram], x0: 5, y0: 0, x1: 30, y1: 16, nodes: [etcd-member-a, etcd-ebs-a, etcd-member-b, etcd-ebs-b, etcd-member-c, etcd-ebs-c, etcd-setting]}
        - {kind: vpc, provider: aws, label: 利用者 VPC, tier: [diagram], x0: 6, y0: 0, x1: 22, y1: 4, nodes: [etcd-member-a, etcd-member-b, etcd-member-c]}
    layout3d:
      tiers:
        - {id: zone0, label: "運用者", z: 0, origin: [0, 0], size: [5, 9]}
        - {id: zone1, label: "AZ A", z: 0, origin: [7, 0], size: [5, 6]}
        - {id: zone2, label: "AZ B", z: 0, origin: [14, 0], size: [5, 6]}
        - {id: zone3, label: "AZ C", z: 0, origin: [21, 0], size: [5, 6]}
        - {id: zone4, label: "論理的な共有状態", z: 0, origin: [28, 0], size: [5, 5]}
      nodes:
        etcd-operator: {tier: zone0, x: 2, y: 1}
        etcd-client: {tier: zone0, x: 2, y: 4}
        etcd-health: {tier: zone0, x: 2, y: 7}
        etcd-member-a: {tier: zone1, x: 2, y: 1}
        etcd-ebs-a: {tier: zone1, x: 2, y: 4}
        etcd-member-b: {tier: zone2, x: 2, y: 1}
        etcd-ebs-b: {tier: zone2, x: 2, y: 4}
        etcd-member-c: {tier: zone3, x: 2, y: 1}
        etcd-ebs-c: {tier: zone3, x: 2, y: 4}
        etcd-setting: {tier: zone4, x: 2, y: 1}
      groups:
        - {kind: cloud, provider: aws, label: AWS アカウント, tier: [zone1, zone2, zone3, zone4], nodes: [etcd-member-a, etcd-ebs-a, etcd-member-b, etcd-ebs-b, etcd-member-c, etcd-ebs-c, etcd-setting]}
        - {kind: vpc, provider: aws, label: 利用者 VPC, tier: [zone1, zone2, zone3], nodes: [etcd-member-a, etcd-member-b, etcd-member-c]}
