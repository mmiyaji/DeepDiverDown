        aws-mwaa-dataset: {tier: diagram, x: 16, y: 1}
        aws-mwaa-logs: {tier: diagram, x: 21, y: 1}
        aws-mwaa-role: {tier: diagram, x: 26, y: 1}
        aws-mwaa-scheduler: {tier: diagram, x: 1, y: 5}
        aws-mwaa-worker: {tier: diagram, x: 6, y: 5}
        aws-mwaa-queue: {tier: diagram, x: 11, y: 5}
        aws-mwaa-metadata: {tier: diagram, x: 16, y: 5}
        aws-mwaa-ingest: {tier: diagram, x: 21, y: 5}
        aws-mwaa-transform: {tier: diagram, x: 26, y: 5}
        aws-mwaa-quality: {tier: diagram, x: 1, y: 9}
      groups:
        - {kind: cloud, provider: aws, label: Customer AWS account, tier: diagram, nodes: [aws-mwaa-environment, aws-mwaa-dag, aws-mwaa-dataset, aws-mwaa-logs, aws-mwaa-role]}
        - {kind: cloud, provider: aws, label: AWS-managed MWAA environment, tier: diagram, nodes: [aws-mwaa-scheduler, aws-mwaa-worker, aws-mwaa-queue, aws-mwaa-metadata, aws-mwaa-ingest, aws-mwaa-transform, aws-mwaa-quality]}
    layout3d:
      tiers:
        - {id: tasks, label: Airflow tasks, z: 1, size: [16, 3]}
        - {id: runtime, label: MWAA managed components, z: 0, size: [16, 3]}
        - {id: customer, label: Customer AWS account, z: 0, origin: [19, 0], size: [20, 3]}
        - {id: outside, label: Operator, kind: origin, z: 0, origin: [-4, 0], size: [2, 3]}
      nodes:
        aws-mwaa-operator: {tier: outside, x: 0, y: 1.5}
        aws-mwaa-environment: {tier: customer, x: 2, y: 1.5}
        aws-mwaa-dag: {tier: customer, x: 6, y: 1.5}
        aws-mwaa-dataset: {tier: customer, x: 10, y: 1.5}
        aws-mwaa-logs: {tier: customer, x: 14, y: 1.5}
        aws-mwaa-role: {tier: customer, x: 18, y: 1.5}
        aws-mwaa-scheduler: {tier: runtime, x: 2, y: 1.5}
        aws-mwaa-worker: {tier: runtime, x: 6, y: 1.5}
        aws-mwaa-queue: {tier: runtime, x: 10, y: 1.5}
        aws-mwaa-metadata: {tier: runtime, x: 14, y: 1.5}
