name: Apache Airflow のワークフローアーキテクチャ
description: DAGで取り込み、変換、品質チェックを順序付け、失敗後に再試行する流れです。
reference:
  objectives:
    - DAGとTaskの依存関係を読む。
    - SchedulerとExecutorを区別する。
    - Worker実行と再試行を追う。
  sources:
    - {title: Airflow Architecture Overview, url: https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/overview.html}
sources: [docs/reference-apache-airflow.md]
evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§1}, {type: doc, ref: docs/reference-apache-airflow.md#§6}]
tiers: [{id: orchestration, label: オーケストレーション, z: 1, size: [16, 3]}, {id: data, label: タスクと状態, z: 0, size: [18, 3]}]
nodes:
  dag: {label: 作業手順の依存グラフ, kind: service, tier: orchestration, x: 0, 'y': 1.5, description: Taskと依存関係を定義。, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§2}]}
  scheduler: {label: スケジューラー, kind: service, tier: orchestration, x: 3, 'y': 1.5, description: Taskを提出。, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§3}]}
  executor: {label: タスクの配布, kind: worker, tier: orchestration, x: 6, 'y': 1.5, description: 実行方式を提供。, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§3}]}
  worker: {label: タスクの実行プロセス, kind: worker, tier: data, x: 9, 'y': 1.5, description: Taskを実行。, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§4}]}
  metadata: {label: 実行メタデータの保存先, kind: db, tier: data, x: 6, 'y': 1.5, description: DAGと状態を保持。, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§4}]}
  ingest: {label: 元データの取り込み, kind: service, tier: data, x: 12, 'y': 1.5, description: 取り込みTask。, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§5}]}
  transform: {label: データ変換, kind: service, tier: data, x: 15, 'y': 1.5, description: 変換Task。, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§5}]}
  quality: {label: 品質検査, kind: service, tier: data, x: 18, 'y': 1.5, description: 品質チェックTask。, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§5}]}
links:
  - {id: schedule, from: dag, to: scheduler, label: 依存グラフを参照, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§2}]}
  - {id: submit, from: scheduler, to: executor, label: Taskを提出, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§3}]}
  - {id: dispatch, from: executor, to: worker, label: 実行を割り当て, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§3}]}
  - {id: run-ingest, from: worker, to: ingest, label: 取り込み, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§5}]}
  - {id: run-transform, from: ingest, to: transform, label: 依存順に変換, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§2}]}
  - {id: run-quality, from: transform, to: quality, label: 品質検査, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§5}]}
  - {id: state, from: worker, to: metadata, label: 実行状態を記録, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§4}]}
scenarios:
  - {id: pipeline, label: 取り込みから品質確認, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§5}], steps: [{links: [schedule, submit, dispatch], note: SchedulerがDAGを発火し、ExecutorへTaskを提出する。}, {links: [run-ingest, run-transform, run-quality], note: Workerが依存順に取り込み、変換、品質検査を実行する。}, {links: [state], note: 実行状態をMetadata DBへ記録する。}]}
requirements:
  - {id: BR-01, kind: usecase, title: 依存順ワークフロー, text: 取り込み、変換、品質検査を順に実行する。, links: [run-ingest, run-transform, run-quality], evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§2}]}
  - {id: NFR-01, kind: nfr, title: 失敗からの再試行, text: Task失敗を記録し再試行できる。, links: [state, dispatch], evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§4}]}
unknowns: [{id: UNK-01, text: Executor種別、Worker台数、リトライ回数は未確定。, refs: [executor, worker, dispatch]}]
gates: {maxDrift: 0, maxHigh: 0}

implementations:
  - id: celery-redis
    label: "Airflow CeleryExecutor と Redis"
    description: "Airflow 3 のスケジューラーと Celery ワーカーを分け、Redis にタスクをキューイングする例。DAG の解析は専用プロセスで行い、タスクの実行状態は Execution API を経由してメタデータ DB に保存する。"
    sources:
      - {title: Airflow Architecture Overview, url: https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/overview.html}
      - {title: Airflow Celery Executor, url: https://airflow.apache.org/docs/apache-airflow-providers-celery/stable/celery_executor.html}
      - {title: DAG Serialization, url: https://airflow.apache.org/docs/apache-airflow/stable/dag-serialization.html}
      - {title: Airflow Security Model, url: https://airflow.apache.org/docs/apache-airflow/stable/security/security_model.html}
      - {title: Airflow Docker Compose quickstart, url: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html}
    tiers:
      - {id: processing, label: データの処理と保存, z: 0, size: [14, 5]}
      - {id: setup, label: 実行に必要な設定・成果物, z: 1, size: [14, 3]}
    nodes:
      celery-redis-host: {label: Docker Compose host, kind: host, tier: processing, x: 12, y: 1, evidence: [{type: doc, ref: "docs/reference-apache-airflow.md#§7"}]}
      celery-redis-input: {label: Input files on local volume, kind: file, tier: processing, x: 12, y: 3, evidence: [{type: doc, ref: "docs/reference-apache-airflow.md#§7"}]}
      celery-redis-output: {label: Output files on local volume, kind: file, tier: processing, x: 14, y: 3, evidence: [{type: doc, ref: "docs/reference-apache-airflow.md#§7"}]}
      celery-redis-dag: {label: Python の DAG ファイル, kind: file, tier: processing, x: 1, y: 1.15, realizes: [dag], description: 取込・変換・検査のタスクと依存関係を定義する。, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§7}]}
      celery-redis-scheduler: {label: Airflow Scheduler と CeleryExecutor, kind: service, tier: processing, x: 1, y: 3.65, realizes: [scheduler, executor], description: 依存関係を見て実行可能なタスクを Redis に送る。, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§7}]}
      celery-redis-worker: {label: Airflow Celery Worker と三つの業務タスク, kind: worker, tier: processing, x: 5, y: 1.15, realizes: [worker, ingest, transform, quality], description: キューからタスクを受け取り、必要な依存ライブラリーと接続で処理する。, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§7}]}
      celery-redis-api: {label: Airflow API Server の Execution API, kind: service, tier: processing, x: 9, y: 1.15, realizes: [metadata], description: タスク実行プロセスとメタデータ DB の橋渡しをする。, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§7}]}
      celery-redis-db: {label: PostgreSQL メタデータ DB, kind: db, tier: processing, x: 9, y: 3.65, description: DAG Run や Task Instance、シリアライズされた DAG を保存する。, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§7}]}
      celery-redis-processor: {label: Airflow DAG Processor, kind: worker, tier: setup, x: 5, y: 1.5, description: Python の DAG を解析し、シリアライズした定義をメタデータ DB に渡す。, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§7}]}
      celery-redis-redis: {label: Redis Celery ブローカー, kind: queue, tier: setup, x: 1, y: 1.5, description: CeleryExecutor から受け取った実行依頼をキューで保持する。Airflow の実行履歴はメタデータ DB に保存する。, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§7}]}
    links:
      - {id: celery-redis-read-input, from: celery-redis-input, to: celery-redis-worker, label: "Read input", evidence: [{type: doc, ref: "docs/reference-apache-airflow.md#§7"}]}
      - {id: celery-redis-write-output, from: celery-redis-worker, to: celery-redis-output, label: "Write and check output", evidence: [{type: doc, ref: "docs/reference-apache-airflow.md#§7"}]}
      - {id: celery-redis-redis-connection, from: celery-redis-redis, to: celery-redis-worker, label: キューからタスクを取得, realizes: [dispatch], replace: true}
      - {id: celery-redis-queue-task, from: celery-redis-scheduler, to: celery-redis-redis, label: 実行可能なタスクをキューへ送る, realizes: [dispatch], replace: true}
      - {id: celery-redis-read-definition, from: celery-redis-dag, to: celery-redis-processor, label: DAG 定義を渡す, realizes: [schedule], replace: true}
      - {id: celery-redis-serialize-definition, from: celery-redis-processor, to: celery-redis-db, label: シリアライズした DAG を保存, realizes: [schedule], replace: true}
      - {id: celery-redis-load-definition, from: celery-redis-db, to: celery-redis-scheduler, label: スケジューリング用の DAG を参照, realizes: [schedule], replace: true}
      - {id: celery-redis-save-task-state, from: celery-redis-api, to: celery-redis-db, label: タスクの状態を永続化, realizes: [state]}

    layout2d:
      tiers: [{id: local, label: Docker Compose, z: 0, size: [24, 12]}]
      nodes:
        celery-redis-host: {tier: local, x: 2, y: 2}
        celery-redis-dag: {tier: local, x: 6, y: 2}
        celery-redis-scheduler: {tier: local, x: 10, y: 2}
        celery-redis-worker: {tier: local, x: 14, y: 2}
        celery-redis-api: {tier: local, x: 18, y: 2}
        celery-redis-db: {tier: local, x: 2, y: 6}
        celery-redis-processor: {tier: local, x: 6, y: 6}
        celery-redis-redis: {tier: local, x: 10, y: 6}
        celery-redis-input: {tier: local, x: 14, y: 6}
        celery-redis-output: {tier: local, x: 18, y: 6}
      groups:
        - {kind: datacenter, label: Docker Compose host, tier: local, nodes: [celery-redis-host, celery-redis-dag, celery-redis-scheduler, celery-redis-worker, celery-redis-api, celery-redis-db, celery-redis-processor, celery-redis-redis, celery-redis-input, celery-redis-output]}
    layout3d:
      tiers:
        - {id: app, label: Containers, z: 1, size: [22, 6]}
        - {id: host, label: Host and volumes, z: 0, size: [22, 6]}
      nodes:
        celery-redis-host: {tier: host, x: 2, y: 1}
        celery-redis-dag: {tier: host, x: 6, y: 1}
        celery-redis-scheduler: {tier: app, x: 10, y: 1}
        celery-redis-worker: {tier: app, x: 14, y: 1}
        celery-redis-api: {tier: app, x: 18, y: 1}
        celery-redis-db: {tier: app, x: 2, y: 4}
        celery-redis-processor: {tier: app, x: 6, y: 4}
        celery-redis-redis: {tier: app, x: 10, y: 4}
        celery-redis-input: {tier: host, x: 14, y: 4}
        celery-redis-output: {tier: host, x: 18, y: 4}
      groups:
        - {kind: datacenter, label: Docker Compose host, tier: [app, host], nodes: [celery-redis-host, celery-redis-dag, celery-redis-scheduler, celery-redis-worker, celery-redis-api, celery-redis-db, celery-redis-processor, celery-redis-redis, celery-redis-input, celery-redis-output]}

  - id: aws-mwaa
    label: "Amazon MWAA・Fargate・S3"
    description: "Amazon MWAA の Airflow 2 系 CeleryExecutor 環境で、S3 の受注データを取り込み、変換と品質検査を実行する例。"
    sources:
      - {title: "Amazon MWAA のネットワークとコンポーネント", url: https://docs.aws.amazon.com/mwaa/latest/migrationguide/mwaa-architecture.html}
      - {title: "Amazon MWAA の概要", url: https://docs.aws.amazon.com/mwaa/latest/userguide/what-is-mwaa.html}
      - {title: "Amazon MWAA の実行ロール", url: https://docs.aws.amazon.com/mwaa/latest/userguide/mwaa-create-role.html}
      - {title: AWS shared responsibility, url: https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/shared-responsibility.html}
    tiers:
      - {id: entry, label: 投入元, kind: origin, z: 1, origin: [-5, 0], size: [3, 4]}
      - {id: runtime, label: 管理と実行, z: 1, size: [17, 7]}
      - {id: data, label: データと復旧, z: 0, size: [17, 5]}
    groups:
      - {kind: cloud, label: "利用者の AWS アカウント", provider: aws, tier: [runtime, data], nodes: [aws-mwaa-environment, aws-mwaa-dag, aws-mwaa-dataset, aws-mwaa-logs, aws-mwaa-role]}
      - {kind: cloud, label: "AWS の MWAA 管理領域", provider: aws, tier: [runtime, data], nodes: [aws-mwaa-scheduler, aws-mwaa-worker, aws-mwaa-queue, aws-mwaa-metadata, aws-mwaa-ingest, aws-mwaa-transform, aws-mwaa-quality]}
    nodes:
      aws-mwaa-role: {label: MWAA execution IAM role, svc: iam, kind: policy, tier: data, x: 14, y: 3, management: {type: customer, scope: "Customer manages permissions and trust."}, evidence: [{type: doc, ref: "docs/reference-apache-airflow.md#§8"}]}
      aws-mwaa-operator: {label: "DAG の運用担当", kind: client, tier: entry, x: 1, y: 1.5, description: "DAG ファイルを S3 に配置し、環境へアクセスする。", evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
      aws-mwaa-environment: {label: "Amazon MWAA 環境", kind: service, tier: runtime, x: 1, y: 1.3, svc: mwaa, description: "Airflow の環境、コンポーネントとワーカーのスケーリングを管理する。", management: {type: shared, scope: "AWS operates MWAA infrastructure; customer configures environment and access."}, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
      aws-mwaa-scheduler: {label: "Fargate 上の Scheduler", kind: scheduler, tier: runtime, x: 6, y: 1.3, realizes: [scheduler, executor], description: "Scheduler プロセス内の CeleryExecutor が実行可能なタスクをキューへ送る。", management: {type: aws, scope: "AWS manages internal Fargate scheduler; customer configures environment."}, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
      aws-mwaa-queue: {label: "MWAA 管理の SQS", kind: queue, tier: runtime, x: 10.5, y: 0.7, svc: sqs, description: "Celery ワーカーが取得するタスクの待ち行列。", management: {type: aws, scope: "AWS manages the internal task queue."}, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
      aws-mwaa-worker: {label: "Fargate 上の Celery Worker", kind: worker, tier: runtime, x: 14.5, y: 1.3, realizes: [worker], parallel: N, description: "SQS からタスクを取得し、DAG に従って実行する。", management: {type: aws, scope: "AWS manages internal Fargate workers; customer sets scaling and DAGs."}, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
      aws-mwaa-ingest: {label: "取り込みタスク", kind: worker, tier: runtime, x: 5, y: 5.5, realizes: [ingest], description: "S3 の原本を読み、処理対象を準備する。", management: {type: customer, scope: "Customer manages task code and permissions."}, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
      aws-mwaa-transform: {label: "変換タスク", kind: worker, tier: runtime, x: 9, y: 5.5, realizes: [transform], description: "受注データを整形して S3 に書く。", management: {type: customer, scope: "Customer manages task code and permissions."}, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
      aws-mwaa-quality: {label: "品質検査タスク", kind: worker, tier: runtime, x: 13, y: 5.5, realizes: [quality], description: "変換結果に対して件数や必須列を検査する。", management: {type: customer, scope: "Customer manages task code and permissions."}, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
      aws-mwaa-dag: {label: "S3 の DAG・依存ファイル", kind: file, tier: data, x: 2, y: 1.5, svc: s3, realizes: [dag], description: "環境用のバケットに DAG と対応した依存ファイルを置く。", management: {type: customer, scope: "Customer manages DAGs and dependencies in S3."}, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
      aws-mwaa-metadata: {label: "管理用 Aurora PostgreSQL", kind: db, tier: data, x: 16, y: 1.5, svc: aurora, realizes: [metadata], description: "DAG ランやタスク状態を保持する AWS 管理のデータベース。", management: {type: aws, scope: "AWS manages the metadata database; customer does not directly operate it."}, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
      aws-mwaa-dataset: {label: "S3 の受注データ", kind: db, tier: data, x: 6, y: 1.5, svc: s3, description: "原本と整形後の成果物を異なるプレフィックスに保存する。", management: {type: shared, scope: "AWS operates S3; customer manages data and permissions."}, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
      aws-mwaa-logs: {label: "CloudWatch Logs", kind: monitor, tier: data, x: 10, y: 1.5, svc: cloudwatch, description: "タスクと Scheduler の有効にしたログを受け取る。", management: {type: shared, scope: "AWS operates CloudWatch; customer configures logging and access."}, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
    links:
      - {id: aws-mwaa-role-permissions, from: aws-mwaa-role, to: aws-mwaa-worker, label: "Authorize task access", evidence: [{type: doc, ref: "docs/reference-apache-airflow.md#§8"}]}
      - {id: aws-mwaa-deploy, from: aws-mwaa-operator, to: aws-mwaa-dag, label: "DAG と依存ファイルを配置", evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
      - {id: aws-mwaa-manage, from: aws-mwaa-environment, to: aws-mwaa-scheduler, label: "Scheduler を管理", evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
      - {id: aws-mwaa-scale, from: aws-mwaa-environment, to: aws-mwaa-worker, label: "Worker を管理", evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
      - {id: aws-mwaa-enqueue, from: aws-mwaa-scheduler, to: aws-mwaa-queue, label: "Celery タスクを送信", realizes: [submit], replace: true, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
      - {id: aws-mwaa-dispatch, from: aws-mwaa-queue, to: aws-mwaa-worker, label: "実行可能なタスクを取得", realizes: [dispatch], replace: true, evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
      - {id: aws-mwaa-logging, from: aws-mwaa-worker, to: aws-mwaa-logs, label: "タスクログを送信", evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
      - {id: aws-mwaa-data-input, from: aws-mwaa-dataset, to: aws-mwaa-ingest, label: "受注原本を読み込む", evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
      - {id: aws-mwaa-data-output, from: aws-mwaa-transform, to: aws-mwaa-dataset, label: "整形したデータを保存", evidence: [{type: doc, ref: docs/reference-apache-airflow.md#§8}]}
    layout2d:
      tiers: [{id: diagram, label: MWAA and customer account, z: 0, size: [31, 15]}]
      nodes:
        aws-mwaa-operator: {tier: diagram, x: 1, y: 1}
        aws-mwaa-environment: {tier: diagram, x: 6, y: 1}
