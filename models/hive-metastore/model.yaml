name: Hive Metastore のテーブルメタデータとパーティション
description: 複数のエンジンが Thrift サービス経由で共有するテーブル定義と、RDB のメタデータが指す S3・HDFS 上のデータの実体を示す。
reference:
  objectives: [Thrift サービス・メタストア DB・データの実体の 3 層を区別する, パーティションと Iceberg のテーブル位置が実体を指す仕組みを確認する, スタンドアロン運用と Hive 本体との関係を確認する]
  sources:
    - {title: Hive Metastore Administration (Hive 2.x), url: https://hive.apache.org/docs/latest/admin/adminmanual-metastore-administration/}
    - {title: Hive Metastore Administration (3.0, standalone), url: https://hive.apache.org/docs/latest/admin/adminmanual-metastore-3-0-administration/}
    - {title: Trino Hive connector, url: https://trino.io/docs/current/connector/hive.html}
    - {title: Apache Iceberg Hive integration, url: https://iceberg.apache.org/docs/latest/hive/}
sources: [docs/reference-hive-metastore.md]
evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§1}]
tiers:
  - {id: flow, label: エンジン・メタストア・データの実体, z: 0, size: [28, 11]}
nodes:
  spark: {label: Spark, kind: client, tier: flow, x: 1, y: 1, description: Thrift でテーブル定義を取得し、データファイルは直接読み書きする。, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§4}]}
  trino: {label: Trino, kind: client, tier: flow, x: 1, y: 4, description: Hive コネクタが Thrift の URI を指定してメタストアに接続する。Hive の実行環境は使わない。, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§4}]}
  hive: {label: Hive（HiveServer2）, kind: client, tier: flow, x: 1, y: 7, description: ローカルまたはリモートのメタストアを使う。, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§4}]}
  flink: {label: Flink, kind: client, tier: flow, x: 1, y: 10, description: Hive カタログとしてメタストアを共有する（公式資料は未確認）。, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§4}]}
  thrift: {label: メタストアの Thrift サービス, kind: service, tier: flow, x: 8, y: 5.5, description: 既定のポートは 9083。状態を持たず、複数台で冗長化できる。, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§2}, {type: doc, ref: docs/reference-hive-metastore.md#§6}]}
  rdb: {label: メタストア DB（RDB）, kind: db, tier: flow, x: 14, y: 5.5, description: DataNucleus（JDO）経由で定義を永続化する。, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§2}]}
  tables: {label: データベース・テーブル定義, kind: db, tier: flow, x: 20, y: 1.5, description: データベース、テーブル、関数の定義。, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§3}]}
  partitions: {label: パーティションとストレージ記述子, kind: db, tier: flow, x: 20, y: 5.5, description: パーティションごとの格納先の場所と入出力形式。項目の詳細は未確認。, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§3}]}
  pointer: {label: Iceberg の metadata_location, kind: db, tier: flow, x: 20, y: 9.5, description: Hive カタログ方式の Iceberg テーブルが、現在のメタデータ JSON の場所を保持する。, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§5}]}
  objstore: {label: S3・HDFS のデータの実体, kind: db, tier: flow, x: 26, y: 7.5, description: データファイルと Iceberg のメタデータファイルを置く。メタストアはデータを保持しない。, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§3}]}
links:
  - {id: spark-get, from: spark, to: thrift, label: テーブル定義を取得, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§4}]}
  - {id: trino-get, from: trino, to: thrift, label: テーブル定義を取得, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§4}]}
  - {id: hive-get, from: hive, to: thrift, label: 定義の取得・登録, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§4}]}
  - {id: flink-get, from: flink, to: thrift, label: Hive カタログとして接続, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§4}]}
  - {id: persist, from: thrift, to: rdb, label: JDBC で読み書き, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§2}]}
  - {id: hold-tables, from: rdb, to: tables, label: 定義を保持, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§3}]}
  - {id: hold-parts, from: rdb, to: partitions, label: パーティションを保持, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§3}]}
  - {id: hold-pointer, from: rdb, to: pointer, label: テーブル位置を保持, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§5}]}
  - {id: locate-parts, from: partitions, to: objstore, label: 格納先の場所が指す, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§3}]}
  - {id: locate-meta, from: pointer, to: objstore, label: メタデータ JSON を指す, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§5}]}
  - {id: direct-io, from: spark, to: objstore, label: データファイルを直接読み書き, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§4}]}
scenarios:
  - id: read-hive-table
    label: Hive 形式のテーブルを複数エンジンで読む
    evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§4}]
    steps:
      - {links: [spark-get, persist], note: エンジンが Thrift 経由でテーブルとパーティションの定義を取得する。}
      - {links: [hold-parts, locate-parts], note: パーティションの格納先の場所を特定する。}
      - {links: [direct-io], note: エンジンがデータファイルを S3・HDFS から直接読む。}
  - id: read-iceberg-table
    label: Iceberg テーブルを Hive カタログ方式で解決する
    evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§5}]
    steps:
      - {links: [trino-get, persist], note: エンジンが Iceberg テーブルの定義を取得する。}
      - {links: [hold-pointer, locate-meta], note: 現在のメタデータ JSON の場所をたどり、以降は Iceberg のメタデータからファイルを解決する。}
requirements:
  - {id: HM-01, kind: usecase, title: 複数エンジンでテーブル定義を共有する, text: エンジンごとに定義を持たず、Thrift サービスの定義を参照する。, links: [spark-get, trino-get, hive-get, flink-get, persist], evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§4}]}
unknowns:
  - {id: UNK-01, text: Flink の Hive カタログと Iceberg の Hive カタログ方式の詳細（ロック、同時更新の扱い）は公式資料で未確認。, refs: [flink, pointer]}
  - {id: UNK-02, text: パーティションとストレージ記述子の項目の詳細は今回取得した管理資料に記載がなく未確認。, refs: [partitions]}
gates: {maxDrift: 0, maxHigh: 0}
implementations:
  - id: standalone-onprem
    label: 自前のスタンドアロン Metastore・PostgreSQL・HDFS
    description: Hive 3.0 以降の Metastore を単独で動かし、Spark・Trino・HiveServer2・Flink が共有する自前構成の例。代表例であり、導入事例ではない。
    sources:
      - {title: Hive Metastore Administration (3.0, standalone), url: https://hive.apache.org/docs/latest/admin/adminmanual-metastore-3-0-administration/}
      - {title: Trino Hive connector, url: https://trino.io/docs/current/connector/hive.html}
      - {title: Apache Iceberg Hive integration, url: https://iceberg.apache.org/docs/latest/hive/}
    tiers:
      - {id: diagram, label: エンジン・Metastore・HDFS, z: 0, size: [28, 12]}
    nodes:
      hms-spark: {label: Spark, kind: client, tier: diagram, x: 1, y: 1, realizes: [spark], description: hive.metastore.uris に Metastore を指定する。, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§7}]}
      hms-trino: {label: Trino, kind: client, tier: diagram, x: 1, y: 4, realizes: [trino], description: Hive コネクタの hive.metastore.uri に Thrift の URI を指定する。, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§7}]}
      hms-hive: {label: HiveServer2, kind: client, tier: diagram, x: 1, y: 7, realizes: [hive], description: Metastore サーバーへリモート接続する。, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§7}]}
      hms-flink: {label: Flink, kind: client, tier: diagram, x: 1, y: 10, realizes: [flink], description: Hive カタログ経由で接続する。, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§7}]}
      hms-server: {label: スタンドアロン Metastore サーバー, kind: service, tier: diagram, x: 9, y: 5.5, realizes: [thrift], description: Hive 3.0 以降は Hive 本体なしで起動できる。複数台で冗長化できる。, management: {type: customer, scope: "Customer operates the Metastore servers and configuration."}, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§7}]}
      hms-pg: {label: PostgreSQL（メタストア DB）, svc: 'postgresql:server', kind: db, tier: diagram, x: 16, y: 5.5, realizes: [rdb, tables, partitions, pointer], description: 外部 RDB にメタデータを保存する。schematool でスキーマを作る。, management: {type: customer, scope: "Customer operates the database, backups and access."}, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§7}]}
      hms-hdfs: {label: HDFS（または S3 互換ストレージ）, kind: db, tier: diagram, x: 24, y: 7.5, realizes: [objstore], description: データファイルと Iceberg のメタデータファイルを置く。, management: {type: customer, scope: "Customer operates the storage cluster."}, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§7}]}
      hms-admin: {label: 運用者（schematool）, kind: actor, tier: diagram, x: 16, y: 10.5, description: schematool -initSchema で新しい Metastore のスキーマを作る。, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§7}]}
    links:
      - {id: hms-init, from: hms-admin, to: hms-pg, label: スキーマを初期化, evidence: [{type: doc, ref: docs/reference-hive-metastore.md#§7}]}
    groups:
      - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [hms-spark, hms-trino, hms-hive, hms-flink, hms-server, hms-pg, hms-hdfs]}
    layout2d:
      tiers:
        - {id: diagram, label: エンジン・Metastore・HDFS, z: 0, size: [28, 12]}
      nodes:
        hms-spark: {tier: diagram, x: 1, y: 1}
        hms-trino: {tier: diagram, x: 1, y: 4}
        hms-hive: {tier: diagram, x: 1, y: 7}
        hms-flink: {tier: diagram, x: 1, y: 10}
        hms-server: {tier: diagram, x: 9, y: 5.5}
        hms-pg: {tier: diagram, x: 16, y: 5.5}
        hms-hdfs: {tier: diagram, x: 24, y: 7.5}
        hms-admin: {tier: diagram, x: 16, y: 10.5}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [hms-spark, hms-trino, hms-hive, hms-flink, hms-server, hms-pg, hms-hdfs]}
    layout3d:
      tiers:
        - {id: engines, label: クエリエンジン, z: 0, size: [6, 12]}
        - {id: meta, label: Metastore と DB, z: 0, origin: [8, 0], size: [10, 12]}
        - {id: data, label: データの実体, z: 0, origin: [20, 0], size: [6, 12]}
      nodes:
        hms-spark: {tier: engines, x: 3, y: 1}
        hms-trino: {tier: engines, x: 3, y: 4}
        hms-hive: {tier: engines, x: 3, y: 7}
        hms-flink: {tier: engines, x: 3, y: 10}
        hms-server: {tier: meta, x: 2, y: 5.5}
        hms-pg: {tier: meta, x: 7, y: 5.5}
        hms-admin: {tier: meta, x: 7, y: 10.5}
        hms-hdfs: {tier: data, x: 3, y: 7.5}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: [engines, meta, data], nodes: [hms-spark, hms-trino, hms-hive, hms-flink, hms-server, hms-pg, hms-hdfs]}
