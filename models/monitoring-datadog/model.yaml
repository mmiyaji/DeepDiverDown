name: Datadog による監視と分析
description: Agent と SaaS を組み合わせ、メトリクス・ログ・トレースの収集から調査と通知までを追う。
reference:
  objectives:
    - 対象から収集・保存・分析までの流れを追う。
    - 通知と運用担当者の役割を区別する。
    - 収集方法と保存・権限の前提を理解する。
  sources:
    - title: Datadog Agent architecture
      url: https://docs.datadoghq.com/agent/architecture/
    - title: Datadog monitors
      url: https://docs.datadoghq.com/monitors/
    - title: Datadog OTLP ingestion
      url: https://docs.datadoghq.com/opentelemetry/setup/otlp_ingest_in_the_agent/
sources:
  - docs/reference-monitoring-datadog.md
evidence:
  - type: doc
    ref: docs/reference-monitoring-datadog.md#§1
  - type: doc
    ref: docs/reference-monitoring-datadog.md#§3
tiers:
  - id: flow
    label: 収集と分析
    z: 1
    size:
      - 20
      - 3
  - id: ops
    label: 通知と運用
    z: 0
    size:
      - 14
      - 3
nodes:
  app:
    label: 監視対象
    kind: service
    tier: flow
    x: 0
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-monitoring-datadog.md#§2
  collector:
    label: テレメトリ収集
    kind: service
    tier: flow
    x: 4
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-monitoring-datadog.md#§2
  store:
    label: データの保存と問い合わせ
    kind: db
    tier: flow
    x: 8
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-monitoring-datadog.md#§2
  dashboard:
    label: 監視画面
    kind: service
    tier: flow
    x: 12
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-monitoring-datadog.md#§2
  operator:
    label: 運用担当者
    kind: actor
    tier: ops
    x: 12
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-monitoring-datadog.md#§2
  alert:
    label: アラートと通知
    kind: service
    tier: ops
    x: 8
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-monitoring-datadog.md#§2
links:
  - id: capture
    from: app
    to: collector
    label: 監視データを収集
    evidence:
      - type: doc
        ref: docs/reference-monitoring-datadog.md#§2
  - id: ingest
    from: collector
    to: store
    label: 監視基盤に送信
    evidence:
      - type: doc
        ref: docs/reference-monitoring-datadog.md#§2
  - id: view
    from: store
    to: dashboard
    label: データを検索・表示
    evidence:
      - type: doc
        ref: docs/reference-monitoring-datadog.md#§2
  - id: inspect
    from: operator
    to: dashboard
    label: 状況を確認
    evidence:
      - type: doc
        ref: docs/reference-monitoring-datadog.md#§2
  - id: check
    from: store
    to: alert
    label: 通知条件を評価
    evidence:
      - type: doc
        ref: docs/reference-monitoring-datadog.md#§2
  - id: notify
    from: alert
    to: operator
    label: アラートを通知
    evidence:
      - type: doc
        ref: docs/reference-monitoring-datadog.md#§2
scenarios:
  - id: monitor
    label: 監視と通知
    evidence:
      - type: doc
        ref: docs/reference-monitoring-datadog.md#§2
    steps:
      - links:
          - capture
          - ingest
        note: 対象の監視データを収集し SaaS に送る。
      - links:
          - view
          - inspect
        note: データを画面で確認する。
      - links:
          - check
          - notify
        note: 設定した条件に応じて担当者に通知する。
implementations:
  - id: example
    label: EC2 の Datadog Agent と SaaS
    description: Amazon EC2 の Linux ホストとアプリに Datadog の Agent を配置し、SaaS に送る例。
    sources:
      - {title: Security in Amazon EC2, url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security.html}
      - {title: Datadog Agent network traffic, url: https://docs.datadoghq.com/agent/configuration/network/}
      - title: Datadog Agent architecture
        url: https://docs.datadoghq.com/agent/architecture/
      - title: Datadog monitors
        url: https://docs.datadoghq.com/monitors/
      - title: Datadog OTLP ingestion
        url: https://docs.datadoghq.com/opentelemetry/setup/otlp_ingest_in_the_agent/
      - title: Datadog Linux agent
        url: https://docs.datadoghq.com/agent/architecture/
      - title: Amazon EC2 instances
        url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Instances.html
    tiers:
      - id: host
        label: AWS 実行環境
        z: 2
        size:
          - 16
          - 3
      - id: flow
        label: 収集と分析
        z: 1
        size:
          - 20
          - 3
      - id: ops
        label: 通知と運用
        z: 0
        size:
          - 14
          - 3
    nodes:
      ex-app:
        label: APM 計装済みアプリ
        kind: service
        tier: flow
        x: 0
        'y': 1.5
        management: {type: customer, scope: 利用者がアプリと計装を設定・運用する。}
        evidence:
          - type: doc
            ref: docs/reference-monitoring-datadog.md#§4
        realizes:
          - app
      ex-collector:
        label: Datadog Agent / APM Agent
        kind: service
        tier: flow
        x: 4
        'y': 1.5
        management: {type: customer, scope: 利用者が Agent、認証情報、収集対象と送信先を設定・更新する。}
        evidence:
          - type: doc
            ref: docs/reference-monitoring-datadog.md#§4
        realizes:
          - collector
      ex-store:
        label: Datadog 取り込み・保存
        kind: db
        tier: flow
        x: 8
        'y': 1.5
        svc: datadog:platform
        evidence:
          - type: doc
            ref: docs/reference-monitoring-datadog.md#§4
        realizes:
          - store
      ex-dashboard:
        label: Datadog ダッシュボード
        kind: service
        tier: flow
        x: 12
        'y': 1.5
        svc: datadog:platform
        evidence:
          - type: doc
            ref: docs/reference-monitoring-datadog.md#§4
        realizes:
          - dashboard
      ex-operator:
        label: 運用担当者
        kind: actor
        tier: ops
        x: 12
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-monitoring-datadog.md#§4
        realizes:
          - operator
      ex-alert:
        label: Datadog Monitor
        kind: service
        tier: ops
        x: 8
        'y': 1.5
        svc: datadog:platform
        evidence:
          - type: doc
            ref: docs/reference-monitoring-datadog.md#§4
        realizes:
          - alert
      ex-ec2:
        label: Amazon EC2 / Linux
        kind: host
        svc: ec2
        tier: host
        x: 2
        'y': 1.5
        description: 計装アプリと Datadog のホスト Agent を稼働させる。
        management: {type: customer, scope: 利用者がゲスト OS、ネットワーク、アプリと Agent を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-monitoring-datadog.md#§4
    groups:
      - kind: cloud
        label: Datadog SaaS
        provider: datadog
        tier:
          - flow
        nodes:
          - ex-store
          - ex-dashboard
      - kind: cloud
        label: Datadog SaaS
        provider: datadog
        tier:
          - ops
        nodes:
          - ex-alert
      - kind: cloud
        provider: aws
        label: AWS アカウント
        tier:
          - host
          - flow
        nodes:
          - ex-ec2
          - ex-app
          - ex-collector
      - kind: cluster
        label: EC2 ホスト
        tier:
          - flow
        nodes:
          - ex-app
          - ex-collector
    links:
      - id: ec2-run-app
        from: ex-ec2
        to: ex-app
        label: アプリを実行
        evidence:
          - type: doc
            ref: docs/reference-monitoring-datadog.md#§4
      - id: ec2-run-agent
        from: ex-ec2
        to: ex-collector
        label: ホスト Agent を実行
        evidence:
          - type: doc
            ref: docs/reference-monitoring-datadog.md#§4

    layout2d:
      tiers: [{id: diagram, label: 監視対象と SaaS, z: 0, origin: [-3, 0], size: [23, 12]}]
      nodes:
        ex-operator: {tier: diagram, x: -2, y: 1}
        ex-ec2: {tier: diagram, x: 2, y: 2}
        ex-app: {tier: diagram, x: 2, y: 5}
        ex-collector: {tier: diagram, x: 5, y: 5}
        ex-store: {tier: diagram, x: 11, y: 3}
        ex-dashboard: {tier: diagram, x: 15, y: 3}
        ex-alert: {tier: diagram, x: 13, y: 7}
      groups:
        - {kind: cloud, provider: aws, label: 顧客 AWS アカウント, tier: [diagram], x0: 0, y0: 0, x1: 7, y1: 8, nodes: [ex-ec2, ex-app, ex-collector]}
        - {kind: cluster, label: 顧客 EC2 / Linux, tier: [diagram], x0: 0.5, y0: 1, x1: 6.5, y1: 7.5, nodes: [ex-ec2, ex-app, ex-collector]}
        - {kind: cloud, provider: datadog, label: Datadog SaaS, tier: [diagram], x0: 9, y0: 0, x1: 18, y1: 9, nodes: [ex-store, ex-dashboard, ex-alert]}
    layout3d:
      tiers:
        - {id: host, label: 顧客 EC2, z: 0, size: [8, 5]}
        - {id: apps, label: アプリと Agent, z: 1, size: [8, 5]}
        - {id: saas, label: SaaS の公開機能, z: 0, origin: [11, 0], size: [10, 7]}
        - {id: outside, label: 運用者, z: 0, origin: [-5, 0], size: [3, 3]}
      nodes:
        ex-ec2: {tier: host, x: 2, y: 2}
        ex-app: {tier: apps, x: 2, y: 2}
        ex-collector: {tier: apps, x: 5, y: 2}
        ex-store: {tier: saas, x: 1, y: 1}
        ex-dashboard: {tier: saas, x: 5, y: 1}
        ex-alert: {tier: saas, x: 3, y: 5}
        ex-operator: {tier: outside, x: 1, y: 1}
      groups:
        - {kind: cloud, provider: aws, label: 顧客 AWS アカウント, tier: [host, apps], nodes: [ex-ec2, ex-app, ex-collector]}
        - {kind: cloud, provider: datadog, label: Datadog SaaS, tier: [saas], nodes: [ex-store, ex-dashboard, ex-alert]}
