        description: 対応演算子を Substrait の表現に変換する。
        evidence:
          - type: doc
            ref: docs/reference-spark-gluten-velox.md#§4
      ex-jni:
        label: Executor：JNI 境界
        kind: gateway
        tier: runtime
        x: 12
        'y': 2
        realizes:
          - jni
        description: JVM とネイティブコードの間で計画と実行を橋渡しする。
        evidence:
          - type: doc
            ref: docs/reference-spark-gluten-velox.md#§4
      ex-velox:
        label: Executor：Velox ネイティブ実行
        kind: worker
        tier: runtime
        x: 17
        'y': 2
        realizes:
          - velox
        description: C++ の列指向演算が対応する計画部分を処理する。
        evidence:
          - type: doc
            ref: docs/reference-spark-gluten-velox.md#§4
      ex-arrow:
        label: Executor：Arrow / ColumnarBatch
        kind: db
        tier: runtime
        x: 2
        'y': 6
        realizes:
          - arrow
        description: 列指向データを受け渡す。
        evidence:
          - type: doc
            ref: docs/reference-spark-gluten-velox.md#§4
      ex-fallback:
        label: Executor：Spark fallback と形式変換
        kind: worker
        tier: runtime
        x: 7
        'y': 6
        realizes:
          - fallback
        description: 未対応箇所は Spark で実行し必要に応じ行・列を変換する。
        evidence:
          - type: doc
            ref: docs/reference-spark-gluten-velox.md#§4
      ex-metrics:
        label: Spark UI の実行指標
        kind: client
        tier: runtime
        x: 12
        'y': 6
        realizes:
          - metrics
        description: native 側の指標も確認し fallback と変換の影響を調べる。
        evidence:
          - type: doc
            ref: docs/reference-spark-gluten-velox.md#§4
      ex-cluster:
        label: Spark Standalone の Master / Worker
        kind: host
        tier: runtime
        x: 2
        'y': 9
        description: 自己管理するホスト上で Spark Standalone クラスターの資源を管理し Driver と Executor を動かす。
        evidence:
          - type: doc
            ref: docs/reference-spark-gluten-velox.md#§4
    links:
      - id: ex-start
        from: ex-cluster
        to: ex-jni
        label: Executor の実行資源を割り当て
