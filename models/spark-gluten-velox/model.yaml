name: Spark Gluten：Velox による列指向ネイティブ実行
description: Spark の物理計画を Substrait に変換し、対応する演算をネイティブ実行する。
reference:
  objectives:
    - Spark の物理計画を Substrait に変換し、対応する演算をネイティブ実行する。
    - Gluten は Spark 全体の置き換えではなく、対応する物理演算を Velox や ClickHouse バックエンドに委譲する中間層。
    - 参照した Gluten の README は Spark 3.4・3.5・4.0・4.1 を列挙しており、4.3 対応を仮定しない。
  sources:
    - title: Apache Gluten Architecture
      url: https://github.com/apache/gluten
    - title: Gluten Configuration
      url: https://github.com/apache/gluten/blob/main/docs/Configuration.md
sources:
  - docs/reference-spark-gluten-velox.md
evidence:
  - type: doc
    ref: docs/reference-spark-gluten-velox.md#§1
tiers:
  - id: flow
    label: 処理の流れ
    z: 0
    size:
      - 21
      - 8
nodes:
  plan:
    label: Spark 物理計画
    kind: service
    tier: flow
    x: 1
    'y': 1.5
    description: Spark がクエリを解析し物理演算を作る。
    evidence:
      - type: doc
        ref: docs/reference-spark-gluten-velox.md#§2
  convert:
    label: Gluten の計画変換
    kind: service
    tier: flow
    x: 6
    'y': 1.5
    description: 対応演算子を Substrait の表現に変換する。
    evidence:
      - type: doc
        ref: docs/reference-spark-gluten-velox.md#§2
  jni:
    label: JNI 境界
    kind: gateway
    tier: flow
    x: 11
    'y': 1.5
    description: JVM とネイティブコードの間で計画と実行を橋渡しする。
    evidence:
      - type: doc
        ref: docs/reference-spark-gluten-velox.md#§2
  velox:
    label: Velox ネイティブ実行
    kind: worker
    tier: flow
    x: 16
    'y': 1.5
    description: C++ の列指向演算が対応する計画部分を処理する。
    evidence:
      - type: doc
        ref: docs/reference-spark-gluten-velox.md#§2
  arrow:
    label: Arrow / ColumnarBatch
    kind: db
    tier: flow
    x: 1
    'y': 5
    description: 列指向データを受け渡す。
    evidence:
      - type: doc
        ref: docs/reference-spark-gluten-velox.md#§2
  fallback:
    label: Spark fallback と形式変換
    kind: worker
    tier: flow
    x: 6
    'y': 5
    description: 未対応箇所は Spark で実行し必要に応じ行・列を変換する。
    evidence:
      - type: doc
        ref: docs/reference-spark-gluten-velox.md#§2
  metrics:
    label: Spark UI の実行指標
    kind: client
    tier: flow
    x: 11
    'y': 5
    description: native 側の指標も確認し fallback と変換の影響を調べる。
    evidence:
      - type: doc
        ref: docs/reference-spark-gluten-velox.md#§2
links:
  - id: transform
    from: plan
    to: convert
    label: 対応計画を変換
    evidence:
      - type: doc
        ref: docs/reference-spark-gluten-velox.md#§3
  - id: native
    from: convert
    to: jni
    label: Substrait を渡す
    evidence:
      - type: doc
        ref: docs/reference-spark-gluten-velox.md#§3
  - id: run
    from: jni
    to: velox
    label: ネイティブ演算を実行
    evidence:
      - type: doc
        ref: docs/reference-spark-gluten-velox.md#§3
  - id: batch
    from: velox
    to: arrow
    label: 列バッチを返す
    evidence:
      - type: doc
        ref: docs/reference-spark-gluten-velox.md#§3
  - id: unsupported
    from: plan
    to: fallback
    label: 非対応演算を実行
    evidence:
      - type: doc
        ref: docs/reference-spark-gluten-velox.md#§3
  - id: convertrow
    from: fallback
    to: arrow
    label: 行・列形式を変換
    evidence:
      - type: doc
        ref: docs/reference-spark-gluten-velox.md#§3
  - id: observe
    from: velox
    to: metrics
    label: 実行指標を公開
    evidence:
      - type: doc
        ref: docs/reference-spark-gluten-velox.md#§3
scenarios:
  - id: flow
    label: 処理の流れ
    steps:
      - links:
          - transform
        note: 対応計画を変換。
      - links:
          - native
        note: Substrait を渡す。
      - links:
          - run
        note: ネイティブ演算を実行。
      - links:
          - batch
        note: 列バッチを返す。
      - links:
          - unsupported
        note: 非対応演算を実行。
      - links:
          - convertrow
        note: 行・列形式を変換。
      - links:
          - observe
        note: 実行指標を公開。
implementations:
  - id: spark-standalone
    label: 自己管理 Spark Standalone の代表構成
    description: Spark Standalone のホスト、Driver、Executor と入力・出力を使う概念的な代表例。製品・プラグイン・バージョンの互換性および実機動作は別途確認する。
    sources:
      - title: Apache Gluten Architecture
        url: https://github.com/apache/gluten
      - title: Gluten Configuration
        url: https://github.com/apache/gluten/blob/main/docs/Configuration.md
      - title: Spark Standalone Mode
        url: https://spark.apache.org/docs/4.3.0/spark-standalone.html
    tiers:
      - id: runtime
        label: 自己管理環境
        z: 0
        size:
          - 24
          - 11
    groups:
      - kind: datacenter
        label: 自前のサーバー群
        provider: onprem
        tier: [runtime]
        nodes: [ex-plan, ex-convert, ex-jni, ex-velox, ex-arrow, ex-fallback, ex-cluster]
      - kind: cluster
        label: Spark Standalone クラスター
        tier:
          - runtime
        nodes:
          - ex-cluster
          - ex-plan
          - ex-convert
          - ex-jni
          - ex-velox
          - ex-arrow
          - ex-fallback
    nodes:
      ex-plan:
        label: Driver：Spark 物理計画
        kind: service
        tier: runtime
        x: 2
        'y': 2
        realizes:
          - plan
        description: Spark がクエリを解析し物理演算を作る。
        evidence:
          - type: doc
            ref: docs/reference-spark-gluten-velox.md#§4
      ex-convert:
        label: Driver：Gluten の計画変換
        kind: service
        tier: runtime
        x: 7
        'y': 2
        realizes:
