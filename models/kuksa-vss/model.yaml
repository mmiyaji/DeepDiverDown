        evidence:
          - type: doc
            ref: docs/reference-kuksa-vss.md#§4
      ex-broker:
        label: Kuksa Databroker
        kind: service
        tier: flow
        x: 8
        'y': 1.5
        description: VSS 信号の取得と更新を仲介する。
        realizes:
          - broker
        evidence:
          - type: doc
            ref: docs/reference-kuksa-vss.md#§4
      ex-app:
        label: 車載アプリ
        kind: service
        tier: flow
        x: 12
        'y': 1.5
        description: 共有された信号を取得する。
        realizes:
          - app
        evidence:
          - type: doc
            ref: docs/reference-kuksa-vss.md#§4
      ex-mapping:
        label: DBC / VSS mapping
        kind: file
        tier: support
        x: 4
