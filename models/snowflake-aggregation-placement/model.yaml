name: Snowflake：JOIN 前後の集約と適応的実行
description: JOIN で膨らむ中間行に対し、事前集約を加えて処理量を抑える適応的な実行を追う。
parent:
  model: snowflake-optimization-internals
  node: operators
reference:
  objectives:
    - JOIN で膨らむ中間行に対し、事前集約を加えて処理量を抑える適応的な実行を追う。
    - SQL を演算子の計画に変換し、可能な集約配置を検討する。
    - 一部の入力を先に集約し、JOIN と最終集約の中間行数を抑える。
  sources:
    - title: Aggregation Placement の概要
      url: >-
        https://www.snowflake.com/en/blog/engineering/aggregation-placement-an-adaptive-query-optimization-for-snowflake/
    - title: Optima Planning
      url: https://www.snowflake.com/en/blog/engineering/snowflake-optima-planning-query-performance/
sources:
  - docs/reference-snowflake-aggregation-placement.md
evidence:
  - type: doc
    ref: docs/reference-snowflake-aggregation-placement.md#§1
  - type: doc
    ref: docs/reference-snowflake-aggregation-placement.md#§4
tiers:
  - id: input
    label: SQL
    z: 3
    size:
      - 23
      - 4
  - id: process
    label: 計画と観測
    z: 2
    size:
      - 23
      - 4
  - id: compute
    label: JOIN と集約
    z: 1
    size:
      - 23
      - 4
  - id: data
    label: 入力テーブル
    z: 0
    size:
      - 23
      - 4
nodes:
  query:
    label: 集計 SQL
    kind: client
    tier: input
    x: 0
    'y': 1.5
    description: JOIN と GROUP BY を含む分析 SQL を実行する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-aggregation-placement.md#§2
  planner:
    label: 計画と変換
    kind: service
    tier: process
    x: 0
    'y': 1.5
    description: クエリを演算子の計画に変換し、集約を別の位置に置く候補を生成する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-aggregation-placement.md#§2
  left:
    label: 左側の入力
    kind: db
    tier: data
    x: 0
    'y': 1.5
    description: 結合する一方のテーブルを読む。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-aggregation-placement.md#§2
  right:
    label: 右側の入力
    kind: db
    tier: data
    x: 5.2
    'y': 1.5
    description: 結合するもう一方のテーブルを読む。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-aggregation-placement.md#§2
  early:
    label: 事前集約
    kind: worker
    tier: compute
    x: 0
    'y': 1.5
    description: 適用可能な場合、JOIN の入力を事前集約して行数を減らす。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-aggregation-placement.md#§2
  join:
    label: 結合
    kind: worker
    tier: compute
    x: 5.2
    'y': 1.5
    description: 入力を JOIN する。キーの重複などにより中間行数が膨らむことがある。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-aggregation-placement.md#§2
  aggregate:
    label: 最終集約
    kind: worker
    tier: compute
    x: 10.4
    'y': 1.5
    description: 必要な最終結果を集約する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-aggregation-placement.md#§2
  adaptive:
    label: 実行時の判定
    kind: service
    tier: process
    x: 5.2
    'y': 1.5
    description: 事前集約が十分有効でない場合は、実行時にその効果を見て無効化する設計。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-aggregation-placement.md#§2
  profile:
    label: 演算の観測
    kind: service
    tier: process
    x: 10.4
    'y': 1.5
    description: Query Profile で演算子と入出力行数を確認する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-aggregation-placement.md#§2
links:
  - id: submit
    from: query
    to: planner
    label: SQL を計画
    evidence:
      - type: doc
        ref: docs/reference-snowflake-aggregation-placement.md#§2
  - id: choose
    from: planner
    to: early
    label: 事前集約を計画
    evidence:
      - type: doc
        ref: docs/reference-snowflake-aggregation-placement.md#§2
  - id: left
    from: left
    to: join
