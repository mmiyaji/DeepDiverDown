    to: early
    label: 右入力を読む
    evidence:
      - type: doc
        ref: docs/reference-snowflake-aggregation-placement.md#§2
  - id: reduce
    from: early
    to: join
    label: 集約した入力を結合
    evidence:
      - type: doc
        ref: docs/reference-snowflake-aggregation-placement.md#§2
  - id: bypass
    from: right
    to: join
    label: 事前集約を使わず結合
    evidence:
      - type: doc
        ref: docs/reference-snowflake-aggregation-placement.md#§2
  - id: group
    from: join
    to: aggregate
    label: 結合後に集約
    evidence:
      - type: doc
        ref: docs/reference-snowflake-aggregation-placement.md#§2
  - id: adapt
    from: adaptive
    to: early
    label: 効果を見て適用を調整
    evidence:
      - type: doc
        ref: docs/reference-snowflake-aggregation-placement.md#§2
  - id: inspect
    from: aggregate
    to: profile
    label: 演算結果を観測
    evidence:
      - type: doc
        ref: docs/reference-snowflake-aggregation-placement.md#§2
scenarios:
  - id: flow
    label: データと処理の流れ
    evidence:
      - type: doc
        ref: docs/reference-snowflake-aggregation-placement.md#§3
    steps:
      - links:
          - submit
          - choose
        note: SQL を演算子の計画に変換し、可能な集約配置を検討する。
      - links:
          - right
          - reduce
          - left
          - group
        note: 一部の入力を先に集約し、JOIN と最終集約の中間行数を抑える。
      - links:
          - adapt
          - inspect
        note: 効果が小さい事前集約は実行時に無効化し、Profile で演算を確認する。
unknowns:
  - id: internal-deployment
    description: 公開されていない内部配置・閾値は特定できない。
