name: Amazon Timestream（LiveAnalytics）の基本アーキテクチャ
description: 時系列データを WriteRecords で受け、メモリストアとマグネティックストアの 2 層に保持期間で振り分け、SQL で両層をまとめて読む。対象は新規受付終了済みの Timestream for LiveAnalytics。
reference:
  objectives: [メモリストアとマグネティックストアの役割分担を区別する, 保持期間によるデータの移動と削除を確認する, 遅延データの書き込み条件を確認する, LiveAnalytics の提供状況と InfluxDB との関係を確認する]
  sources:
    - {title: Amazon Timestream for LiveAnalytics availability change, url: https://docs.aws.amazon.com/timestream/latest/developerguide/AmazonTimestreamForLiveAnalytics-availability-change.html}
    - {title: Storage, url: https://docs.aws.amazon.com/timestream/latest/developerguide/storage.html}
    - {title: Writes, url: https://docs.aws.amazon.com/timestream/latest/developerguide/writes.html}
    - {title: Quotas, url: https://docs.aws.amazon.com/timestream/latest/developerguide/ts-limits.html}
    - {title: What is Amazon Timestream for LiveAnalytics?, url: https://docs.aws.amazon.com/timestream/latest/developerguide/what-is-timestream.html}
    - {title: Timestream for InfluxDB, url: https://docs.aws.amazon.com/timestream/latest/developerguide/timestream-for-influxdb.html}
sources: [docs/reference-amazon-timestream.md]
evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§1}, {type: doc, ref: docs/reference-amazon-timestream.md#§2}]
tiers:
  - {id: flow, label: 書き込み・保存・クエリ, z: 0, size: [28, 11]}
nodes:
  producers: {label: 書き込み元, kind: client, tier: flow, x: 1, y: 4, description: アプリ、IoT Core、Kinesis、MSK、Flink、Telegraf などから書く。, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§5}]}
  write: {label: WriteRecords API, kind: service, tier: flow, x: 7, y: 4, description: 1 リクエスト最大 100 レコード。スキーマは自動検出し、upsert もできる。, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§5}]}
  rejected: {label: 拒否データの保存先（S3）, kind: db, tier: flow, x: 7, y: 9, description: マグネティックストア書き込みを有効にするテーブルで、作成時に指定する。, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§5}]}
  mem: {label: メモリストア, kind: db, tier: flow, x: 13, y: 2.5, description: 直近のデータ。高スループットの書き込みと高速なクエリ向け。書き込みから読み取りまでサブ秒。, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§3}]}
  mag: {label: マグネティックストア, kind: db, tier: flow, x: 20, y: 2.5, description: 履歴データと遅延データ。書き込みから読み取りまで最大 6 時間。期限が来たデータは削除する。, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§3}]}
  retention: {label: 保持ポリシー, kind: service, tier: flow, x: 16.5, y: 0.5, description: テーブルごとに設定。メモリは 1〜8,766 時間、マグネティックは 1〜73,000 日。, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§4}]}
  query: {label: クエリエンジン（SQL）, kind: service, tier: flow, x: 16.5, y: 7, description: 保存場所を指定せず両層をまとめて読む。実行は最大 1 時間。, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§6}]}
  reader: {label: 読み出し側（Grafana・Quick・JDBC）, kind: client, tier: flow, x: 25, y: 7, description: SQL でクエリし、可視化や BI に使う。, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§6}]}
  kms: {label: KMS カスタマー管理キー, kind: service, tier: flow, x: 25, y: 0.5, description: マグネティックストアの暗号化に指定できる。, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§3}]}
links:
  - {id: ingest, from: producers, to: write, label: レコードを書き込む, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§5}]}
  - {id: write-mem, from: write, to: mem, label: 保持期間内を書き込む, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§5}]}
  - {id: write-mag, from: write, to: mag, label: 遅延データを書き込む, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§5}]}
  - {id: write-rej, from: write, to: rejected, label: 拒否データの保存先, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§5}]}
  - {id: tier-move, from: mem, to: mag, label: 保持期間を過ぎると移動, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§4}]}
  - {id: policy-mem, from: retention, to: mem, label: メモリの保持期間, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§4}]}
  - {id: policy-mag, from: retention, to: mag, label: 期限切れは削除, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§4}]}
  - {id: encrypt, from: kms, to: mag, label: 暗号化, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§3}]}
  - {id: query-mem, from: query, to: mem, label: 直近データを読む, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§6}]}
  - {id: query-mag, from: query, to: mag, label: 履歴データを読む, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§6}]}
  - {id: sql, from: reader, to: query, label: SQL でクエリ, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§6}]}
scenarios:
  - id: write-and-age
    label: 書き込んだデータが保持期間で移る
    evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§4}]
    steps:
      - {links: [ingest, write-mem], note: 現在時刻付近のデータがメモリストアに入る。}
      - {links: [policy-mem, tier-move], note: メモリの保持期間を過ぎたデータがマグネティックストアへ移る。}
      - {links: [policy-mag], note: マグネティックの保持期間を過ぎたデータは削除される。}
  - id: late-data
    label: 遅れて届いたデータを書く
    evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§5}]
    steps:
      - {links: [ingest, write-mag], note: テーブルでマグネティックストア書き込みを有効にしていれば、メモリの保持期間より古いデータを直接書ける。}
      - {links: [write-rej], note: 書けなかったレコードの情報は、指定した S3 に出力される（出力内容の詳細は未確認）。}
requirements:
  - {id: TS-01, kind: usecase, title: 直近と履歴を同じ SQL で読む, text: 保存場所を指定せず、メモリストアとマグネティックストアをまとめてクエリする。, links: [sql, query-mem, query-mag], evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§6}]}
unknowns:
  - {id: UNK-01, text: LiveAnalytics のサポート終了日は取得した公式ページに記載がなく未確認。新規顧客の受け付けは 2025-06-20 に終了済み。, refs: [write]}
  - {id: UNK-02, text: InfluxDB 3 系の提供有無と、InfluxDB から LiveAnalytics への公式な連携は未確認。, refs: [write]}
  - {id: UNK-03, text: スケジュールクエリと UNLOAD の動作は今回確認しておらず、図に含めていない。, refs: [query]}
gates: {maxDrift: 0, maxHigh: 0}
implementations:
  - id: liveanalytics-on-aws
    label: AWS 上の Timestream for LiveAnalytics（既存顧客向け）
    description: 書き込み元から WriteRecords で受け、メモリとマグネティックの 2 層に保存し、SQL で読む構成の例。新規顧客は 2025-06-20 以降作れない。代表例であり、導入事例ではない。
    sources:
      - {title: Amazon Timestream for LiveAnalytics availability change, url: https://docs.aws.amazon.com/timestream/latest/developerguide/AmazonTimestreamForLiveAnalytics-availability-change.html}
      - {title: Storage, url: https://docs.aws.amazon.com/timestream/latest/developerguide/storage.html}
      - {title: Writes, url: https://docs.aws.amazon.com/timestream/latest/developerguide/writes.html}
    tiers:
      - {id: diagram, label: 書き込み・保存・クエリ, z: 0, size: [28, 11]}
    nodes:
      ts-producers: {label: 書き込み元（アプリ・Telegraf など）, kind: client, tier: diagram, x: 1, y: 4, realizes: [producers], description: 利用者側のアプリやエージェント。AWS SDK などで書く。, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§8}]}
      ts-write: {label: Timestream Write（WriteRecords）, svc: timestream, kind: service, tier: diagram, x: 7, y: 4, realizes: [write], description: 書き込み API。呼び出し側に IAM 権限が必要。, management: {type: aws, scope: "AWS operates the write endpoint. Customer controls IAM permissions and tables."}, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§5}]}
      ts-s3: {label: Amazon S3（拒否データ用バケット）, svc: 'aws:s3', kind: db, tier: diagram, x: 7, y: 9, realizes: [rejected], description: 利用者のバケット。書き込み側に s3:PutObject が必要。, management: {type: shared, scope: "AWS operates S3. Customer owns the bucket, permissions and contents."}, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§5}]}
      ts-mem: {label: メモリストア, kind: db, tier: diagram, x: 13, y: 2.5, realizes: [mem], description: 内部構成は公開資料で未確認。保持期間は利用者が設定する。, management: {type: aws, scope: "AWS operates the storage. Customer sets the retention period."}, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§7}]}
      ts-mag: {label: マグネティックストア, kind: db, tier: diagram, x: 20, y: 2.5, realizes: [mag], description: 内部構成は公開資料で未確認。保持期間と暗号化キーは利用者が設定する。, management: {type: aws, scope: "AWS operates the storage. Customer sets retention and the KMS key."}, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§7}]}
      ts-retention: {label: テーブルの保持ポリシー, kind: service, tier: diagram, x: 16.5, y: 0.5, realizes: [retention], description: テーブルごとに設定する。, management: {type: shared, scope: "Customer configures the policy. AWS applies it."}, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§4}]}
      ts-kms: {label: AWS KMS（カスタマー管理キー）, kind: service, tier: diagram, x: 25, y: 0.5, realizes: [kms], description: マグネティックストアの暗号化に指定する。, management: {type: shared, scope: "AWS operates KMS. Customer owns the key and its policy."}, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§3}]}
      ts-query: {label: Timestream Query（SQL）, svc: timestream, kind: service, tier: diagram, x: 16.5, y: 7, realizes: [query], description: クエリ API。両層をまとめて読む。, management: {type: aws, scope: "AWS operates the query engine. Customer controls IAM permissions and query limits."}, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§6}]}
      ts-reader: {label: Grafana・Quick・JDBC クライアント, kind: client, tier: diagram, x: 25, y: 7, realizes: [reader], description: 可視化や BI に使う利用者側のツール。, evidence: [{type: doc, ref: docs/reference-amazon-timestream.md#§6}]}
    groups:
      - {kind: cloud, label: AWS アカウント（リージョン内）, provider: aws, tier: diagram, nodes: [ts-write, ts-s3, ts-mem, ts-mag, ts-retention, ts-kms, ts-query]}
    layout2d:
      tiers:
        - {id: diagram, label: 書き込み・保存・クエリ, z: 0, size: [28, 11]}
      nodes:
        ts-producers: {tier: diagram, x: 1, y: 4}
        ts-write: {tier: diagram, x: 7, y: 4}
        ts-s3: {tier: diagram, x: 7, y: 9}
