        ts-mag: {tier: diagram, x: 20, y: 2.5}
        ts-retention: {tier: diagram, x: 16.5, y: 0.5}
        ts-kms: {tier: diagram, x: 25, y: 0.5}
        ts-query: {tier: diagram, x: 16.5, y: 7}
        ts-reader: {tier: diagram, x: 25, y: 7}
      groups:
        - {kind: cloud, label: AWS アカウント（リージョン内）, provider: aws, tier: diagram, nodes: [ts-write, ts-s3, ts-mem, ts-mag, ts-retention, ts-kms, ts-query]}
    layout3d:
      tiers:
        - {id: clients, label: 利用者側, z: 0, size: [4, 11]}
