        ts-mag: {tier: aws, x: 14, y: 2.5}
        ts-retention: {tier: aws, x: 11, y: 0.5}
        ts-kms: {tier: aws, x: 19, y: 0.5}
        ts-query: {tier: aws, x: 11, y: 7}
      groups:
        - {kind: cloud, label: AWS アカウント（リージョン内）, provider: aws, tier: [aws], nodes: [ts-write, ts-s3, ts-mem, ts-mag, ts-retention, ts-kms, ts-query]}
