name: PostGIS：空間索引と厳密な判定
description: 利用者が PostgreSQL / PostGIS と GiST インデックスを Linux 上で運用し、SQL の ST_DWithin で候補抽出と距離判定を行う。
parent:
  model: geospatial-types
  node: index
reference:
  objectives:
    - 書き込みと検索の経路を追う。
    - データ構造と保持・復旧の役割を区別する。
    - 実装の前提と制約を確認する。
  sources:
    - title: PostGIS Spatial Indexing
      url: https://postgis.net/workshops/postgis-intro/indexing.html
    - title: PostGIS ST_DWithin
      url: https://postgis.net/docs/ST_DWithin.html
    - title: Geometry or Geography
      url: https://postgis.net/documentation/faq/geometry-or-geography/
sources:
  - docs/reference-postgis-spatial-index.md
evidence:
  - type: doc
    ref: docs/reference-postgis-spatial-index.md#§1
  - type: doc
    ref: docs/reference-postgis-spatial-index.md#§2
  - type: doc
    ref: docs/reference-postgis-spatial-index.md#§3
  - type: doc
    ref: docs/reference-postgis-spatial-index.md#§5
tiers:
  - id: write
    label: 処理と検索
    z: 1
    size:
      - 21
      - 4
  - id: disk
    label: データと保存
    z: 0
    size:
      - 21
      - 4
nodes:
  query:
    label: 空間検索の条件
    kind: client
    tier: write
    x: 0
    'y': 1.5
    description: 形状と座標系、距離などの検索条件を指定する。
    evidence:
      - type: doc
        ref: docs/reference-postgis-spatial-index.md#§1
  bounds:
    label: 検索範囲を準備
    kind: service
    tier: write
    x: 4
    'y': 1.5
    description: 検索条件からインデックスに利用できる範囲を用意する。
    evidence:
      - type: doc
        ref: docs/reference-postgis-spatial-index.md#§1
  gist:
    label: GiST 外接矩形インデックス
    kind: db
    tier: disk
    x: 4
    'y': 1.5
    description: 形状の外接矩形によって候補を絞る。
    evidence:
      - type: doc
        ref: docs/reference-postgis-spatial-index.md#§2
  candidates:
    label: 候補行
    kind: file
    tier: write
    x: 8
    'y': 1.5
    description: 矩形による検索で得られた候補で、厳密な一致とは限らない。
    evidence:
      - type: doc
        ref: docs/reference-postgis-spatial-index.md#§1
  geom:
    label: 元の地理データ
    kind: db
    tier: disk
    x: 10
    'y': 1.5
    description: 元の geometry または geography の値を保持する。
    evidence:
      - type: doc
        ref: docs/reference-postgis-spatial-index.md#§2
  exact:
    label: 距離・交差の厳密判定
    kind: service
    tier: write
    x: 13
    'y': 1.5
    description: 候補と元の形状から距離・交差などの述語を評価する。
    evidence:
      - type: doc
        ref: docs/reference-postgis-spatial-index.md#§1
  out:
    label: 一致した結果
    kind: file
    tier: write
    x: 17
    'y': 1.5
    description: 条件に一致した行を返す。
    evidence:
      - type: doc
        ref: docs/reference-postgis-spatial-index.md#§1
links:
  - id: a
    from: query
    to: bounds
    label: 座標系と検索条件を渡す
    evidence:
      - type: doc
        ref: docs/reference-postgis-spatial-index.md#§2
  - id: b
    from: bounds
    to: gist
    label: 外接矩形で絞る
    evidence:
      - type: doc
        ref: docs/reference-postgis-spatial-index.md#§2
  - id: c
    from: gist
    to: candidates
    label: 候補を選ぶ
    evidence:
      - type: doc
        ref: docs/reference-postgis-spatial-index.md#§2
  - id: d
    from: candidates
    to: exact
    label: 候補を判定
    evidence:
      - type: doc
        ref: docs/reference-postgis-spatial-index.md#§2
  - id: e
    from: geom
    to: exact
    label: 元の形状を読む
    evidence:
      - type: doc
        ref: docs/reference-postgis-spatial-index.md#§2
  - id: f
    from: exact
    to: out
    label: 一致した行を返す
    evidence:
      - type: doc
        ref: docs/reference-postgis-spatial-index.md#§2
scenarios:
  - id: find
    label: 候補抽出と厳密判定
    evidence:
      - type: doc
        ref: docs/reference-postgis-spatial-index.md#§2
    steps:
      - links:
          - a
        note: 座標系と検索条件を渡す。
        highlight:
          - a
          - b
          - c
      - links:
          - b
        note: 外接矩形で絞る。
        highlight:
          - a2
          - b2
      - links:
          - c
        note: 候補を選ぶ。
        highlight:
          - a2
          - b2
      - links:
          - d
        note: 候補を判定。
        highlight:
          - a2
          - b2
      - links:
          - e
        note: 元の形状を読む。
        highlight:
          - a
          - b
      - links:
          - f
        note: 一致した行を返す。
        highlight:
          - a3
    visual: detail-map
implementations:
