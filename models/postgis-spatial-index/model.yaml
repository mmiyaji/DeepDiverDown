blocks:
  - id: detail-map
    title: 空間索引の候補と厳密判定
    note: 矩形の重なりで候補を絞った後、元の形状で判定する説明用の例です。
    hint: 項目を選ぶと説明を表示します。処理の流れに合わせて関連する項目を強調します。
    lanes:
      - id: all
        label: 入力データ
        node: geom
      - id: cand
        label: GiST の候補
        node: gist
      - id: res
        label: 厳密な結果
        node: out
    items:
      all:
        - id: a
          label: 地点 A
          k: 0
          note: 実際の検索対象に一致する例。
        - id: b
          label: 地点 B
          k: 1
          note: 外接矩形では候補だが条件を満たさない例。
        - id: c
          label: 地点 C
          k: 2
          note: 候補から除外される例。
      cand:
        - id: a2
          label: A の矩形
          k: 0
          note: 矩形による候補。
        - id: b2
          label: B の矩形
          k: 1
          note: 矩形による候補。形状の一致はまだ確定しない。
      res:
        - id: a3
          label: 地点 A
          k: 0
          note: 元の形状に対して距離・交差の条件を満たす。
