name: "OpenTelemetry の分散トレーシングとサンプリング"
description: "注文 API の設計上の依存関係と、OTLP と Collector を経由して観測されたトレースの違いを追います。"
reference:
  objectives:
    - "コンテキスト伝播と OTLP による Span の送信を区別する。"
    - "Collector の Receiver、Processor、Exporter を順に追う。"
    - "サンプリングと計装の有無が設計図・観測結果の照合に与える影響を説明する。"
  sources:
    - {title: "OpenTelemetry Context propagation", url: "https://opentelemetry.io/docs/concepts/context-propagation/"}
    - {title: "OTLP Specification", url: "https://opentelemetry.io/docs/specs/otlp/"}
    - {title: "Collector Configuration", url: "https://opentelemetry.io/docs/collector/configuration/"}
    - {title: "OpenTelemetry Sampling", url: "https://opentelemetry.io/docs/concepts/sampling/"}
    - {title: "Tail Sampling Processor", url: "https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/tailsamplingprocessor"}
sources: [docs/reference-opentelemetry.md]
evidence: [{type: doc, ref: "docs/reference-opentelemetry.md#§1"}]
tiers:
  - {id: "app", label: "アプリケーション", z: 1, size: [16,4], kind: "origin"}
  - {id: "collect", label: "テレメトリー収集", z: 0, size: [16,4]}
nodes:
  caller: {label: "注文クライアント", kind: "client", tier: "app", x: 0, y: 1.5, description: "注文リクエストを送る。", evidence: [{type: doc, ref: "docs/reference-opentelemetry.md#§1"}]}
  order: {label: 注文 API と計装, kind: service, tier: app, x: 4, 'y': 1.5, description: サーバー Span と下流呼び出しの Span を生成する。, evidence: [{type: doc, ref: docs/reference-opentelemetry.md#§2}]}
  inventory: {label: 在庫 API と計装, kind: service, tier: app, x: 8, 'y': 1.5, description: 受け取った Trace Context に基づき子 Span を生成する。, evidence: [{type: doc, ref: docs/reference-opentelemetry.md#§2}]}
  receiver: {label: テレメトリ受信, kind: service, tier: collect, x: 0, 'y': 1.5, description: SDK 等からトレースデータを受信する。, evidence: [{type: doc, ref: docs/reference-opentelemetry.md#§3}]}
  sampling: {label: トレースの保持判定, kind: worker, tier: collect, x: 4, 'y': 1.5, description: 同じ Trace ID の Span を集め、設定した条件で保持を判定する。, evidence: [{type: doc, ref: docs/reference-opentelemetry.md#§4}]}
  exporter: {label: 採用トレースの送信, kind: worker, tier: collect, x: 8, 'y': 1.5, description: 保持されたトレースをバックエンドに送る。, evidence: [{type: doc, ref: docs/reference-opentelemetry.md#§3}]}
  backend: {label: 分散トレースの保存と検索, kind: monitor, tier: collect, x: 12, 'y': 1.5, description: 届いた Span を検索・表示できる状態にする。, evidence: [{type: doc, ref: docs/reference-opentelemetry.md#§5}]}
links:
  - {id: "request", from: "caller", to: "order", label: "注文リクエスト", evidence: [{type: doc, ref: "docs/reference-opentelemetry.md#§1"}]}
  - {id: "reserve", from: "order", to: "inventory", label: "在庫引当 + Trace Context", evidence: [{type: doc, ref: "docs/reference-opentelemetry.md#§2"}]}
  - {id: "order-otlp", from: "order", to: "receiver", label: "注文側 Span を OTLP 送信", evidence: [{type: doc, ref: "docs/reference-opentelemetry.md#§3"}]}
  - {id: "inventory-otlp", from: "inventory", to: "receiver", label: "在庫側 Span を OTLP 送信", evidence: [{type: doc, ref: "docs/reference-opentelemetry.md#§3"}]}
  - {id: "process", from: "receiver", to: "sampling", label: "受信した Span を処理", evidence: [{type: doc, ref: "docs/reference-opentelemetry.md#§3"}]}
  - {id: "keep", from: "sampling", to: "exporter", label: "保持対象の Trace", evidence: [{type: doc, ref: "docs/reference-opentelemetry.md#§4"}]}
  - {id: "export", from: "exporter", to: "backend", label: "保持した Span を送信", evidence: [{type: doc, ref: "docs/reference-opentelemetry.md#§5"}]}
scenarios:
  - id: keep-error
    label: "在庫エラーのトレースを保持"
    evidence: [{type: doc, ref: "docs/reference-opentelemetry.md#§2"}, {type: doc, ref: "docs/reference-opentelemetry.md#§3"}, {type: doc, ref: "docs/reference-opentelemetry.md#§4"}, {type: doc, ref: "docs/reference-opentelemetry.md#§5"}]
    steps:
      - {links: ["request","reserve"], note: "注文 API が在庫 API を呼び出す。在庫 API は親コンテキストを引き継ぎ、失敗した処理を ERROR の Span として記録する。"}
      - {links: ["order-otlp","inventory-otlp","process"], note: "両サービスの SDK が同じ Trace ID の Span を OTLP で送る。Collector が判定に必要な Span を集める。"}
      - {links: ["keep","export"], note: "ERROR を含むためトレースを保持する。バックエンドで注文と在庫の Span をたどる。"}
  - id: drop-success
    label: "成功した注文が検索結果に現れない"
    evidence: [{type: doc, ref: "docs/reference-opentelemetry.md#§2"}, {type: doc, ref: "docs/reference-opentelemetry.md#§4"}, {type: doc, ref: "docs/reference-opentelemetry.md#§5"}]
    steps:
      - {links: ["request","reserve"], note: "在庫引当を含む注文処理が成功する。設計上の依存先を実際に呼び出している。"}
      - {links: ["order-otlp","inventory-otlp","process"], note: "Collector は両サービスの Span を受信する。例の保持条件に一致しない Trace を破棄する。"}
      - {links: [], note: "バックエンドにこの注文の Trace は届かない。検索結果を設計と照合する際は、サンプリング方針と計装範囲を確認する。"}
implementations:
  - id: otel
    label: Kubernetes の分配・サンプリング Gateway
    description: EKS の EC2 ノードで OpenTelemetry Collector を 2 段運用し、Jaeger で取り込んだトレースを OpenSearch Service に保存する例。
    sources:
      - {title: EKS Control Plane, url: https://docs.aws.amazon.com/eks/latest/best-practices/control-plane.html}
      - title: OpenTelemetry Collector gateway pattern
        url: https://opentelemetry.io/docs/collector/deploy/gateway/
      - title: Tail Sampling Processor
        url: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/tailsamplingprocessor
      - title: Jaeger APIs
        url: https://www.jaegertracing.io/docs/latest/apis/
      - title: Jaeger のストレージ
        url: https://www.jaegertracing.io/docs/2.23/storage/
      - title: Amazon OpenSearch Service のアクセス制御
        url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/fgac.html
      - title: EKS のマネージドノードグループ
        url: https://docs.aws.amazon.com/eks/latest/userguide/create-managed-node-group.html
    tiers:
      - id: app
        label: アプリケーション
        z: 1
        kind: origin
      - id: collect
        label: テレメトリー収集
        z: 0
      - {id: aws-runtime, label: AWS のクラスタ管理とトレース保存, z: 2, size: [15, 4]}
    groups:
      - {kind: cloud, label: AWS サービス領域（EKS 制御プレーンは AWS 管理 VPC）, provider: aws, tier: [app, collect, aws-runtime], nodes: [otel-order, otel-inventory, otel-receiver, otel-sampling, otel-routing, otel-backend, otel-eks, otel-ec2, otel-storage]}
      - kind: cluster
        label: 計装アプリと Collector の Kubernetes クラスタ
        provider: k8s
        tier:
          - app
          - collect
          - aws-runtime
        nodes:
          - otel-order
          - otel-inventory
          - otel-receiver
          - otel-sampling
          - otel-routing
          - otel-backend
          - otel-eks
          - otel-ec2
    nodes:
      otel-caller:
        label: テスト用 HTTP クライアント
        kind: client
        tier: app
        realizes:
          - caller
        description: 注文 API を呼ぶ。
        evidence:
          - type: doc
            ref: docs/reference-opentelemetry.md#§6
      otel-order:
        label: 注文 API と OpenTelemetry SDK
        kind: service
        tier: app
        svc: k8s:deployment
        realizes:
          - order
        description: 在庫 API 呼び出しを計装し、トレースの Span を OTLP で送信する。
        management: {type: customer, scope: 利用者が Pod と設定を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-opentelemetry.md#§6
      otel-inventory:
        label: 在庫 API と OpenTelemetry SDK
        kind: service
        tier: app
        svc: k8s:deployment
        realizes:
          - inventory
        description: 受け取った Trace Context を使い、同じ Trace に Span を送る。
        management: {type: customer, scope: 利用者が Pod と設定を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-opentelemetry.md#§6
      otel-receiver:
        label: Collector 入口 Deployment
        kind: service
        tier: collect
        svc: k8s:deployment
        realizes:
          - receiver
        description: OTLP Receiver と loadbalancing exporter を置き、Trace ID で次の段へ分配する。
        management: {type: customer, scope: 利用者が Pod と設定を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-opentelemetry.md#§6
      otel-sampling:
        label: Collector サンプリング Deployment
        kind: worker
        tier: collect
        svc: k8s:deployment
        realizes:
          - sampling
          - exporter
        description: Trace ID ごとに受けた Span を tail_sampling で選別し、OTLP exporter で送る。
        management: {type: customer, scope: 利用者が Pod と設定を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-opentelemetry.md#§6
      otel-backend:
        label: Jaeger の取り込み・検索 Deployment
        kind: monitor
        tier: collect
        svc: k8s:deployment
        realizes:
          - backend
        description: OTLP で受けたトレースを OpenSearch に保存し、検索 UI と API を提供する。
        management: {type: customer, scope: 利用者が Pod と設定を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-opentelemetry.md#§6
      otel-routing:
        label: 第2段 Collector 用 Headless Service
        kind: lb
        tier: collect
        svc: k8s:service
        description: サンプリング側レプリカの集合を入口側が解決する。
        management: {type: customer, scope: 利用者が Pod と設定を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-opentelemetry.md#§6
      otel-eks: {label: EKS Kubernetes API, kind: service, svc: eks, tier: aws-runtime, x: 1, y: 1.5, description: AWS 管理 VPC の制御プレーン。利用者は API と公開設定を操作するがサーバーに直接アクセスしない。, management: {type: aws, scope: AWS が制御プレーン基盤を運用し、利用者が API と設定を操作する。}, evidence: [{type: doc, ref: docs/reference-opentelemetry.md#§6}]}
      otel-ec2: {label: EKS ノードグループの EC2, kind: host, svc: ec2, tier: aws-runtime, x: 6, y: 1.5, description: 利用者が配置する SDK 計装アプリ・Collector・Jaeger の Pod を実行する。, management: {type: shared, scope: EKS がノードの作成・更新を支援し、利用者が設定と更新開始を担う。}, evidence: [{type: doc, ref: docs/reference-opentelemetry.md#§6}]}
      otel-storage: {label: OpenSearch Service のトレース索引, kind: db, svc: opensearch, tier: aws-runtime, x: 13, y: 1.5, description: Jaeger が作るトレース索引を VPC のプライベートドメインで保持する。, management: {type: shared, scope: AWS が基盤を運用し、利用者がドメイン設定、データとアクセスを管理する。}, evidence: [{type: doc, ref: docs/reference-opentelemetry.md#§6}]}
    links:
      - {id: otel-schedule, from: otel-eks, to: otel-ec2, label: Pod を EC2 ノードへ配置, evidence: [{type: doc, ref: docs/reference-opentelemetry.md#§6}]}
      - {id: otel-persist, from: otel-backend, to: otel-storage, label: トレースを保存・検索, realizes: [export], evidence: [{type: doc, ref: docs/reference-opentelemetry.md#§6}]}
      - id: otel-resolve
        from: otel-receiver
        to: otel-routing
        label: サンプリング側の宛先を解決
        evidence:
          - type: doc
            ref: docs/reference-opentelemetry.md#§6
      - id: otel-sampling-endpoints
        from: otel-routing
        to: otel-sampling
        label: レプリカを発見
        evidence:
          - type: doc
            ref: docs/reference-opentelemetry.md#§6

    layout2d:
      tiers: [{id: diagram, label: 実行基盤と監視サービス, z: 0, origin: [-3, 0], size: [27, 15]}]
      nodes:
        otel-eks: {tier: diagram, x: 1, y: 1}
        otel-ec2: {tier: diagram, x: 4, y: 1}
        otel-order: {tier: diagram, x: 7, y: 1}
        otel-inventory: {tier: diagram, x: 1, y: 4}
        otel-receiver: {tier: diagram, x: 4, y: 4}
        otel-sampling: {tier: diagram, x: 7, y: 4}
        otel-routing: {tier: diagram, x: 1, y: 7}
        otel-backend: {tier: diagram, x: 4, y: 7}
        otel-storage: {tier: diagram, x: 14, y: 1}
        otel-caller: {tier: diagram, x: -4, y: 1}
      groups:
        - {kind: cloud, provider: aws, label: AWS サービス領域, tier: [diagram], x0: -1.5, y0: 0, x1: 24, y1: 12, nodes: [otel-eks, otel-ec2, otel-order, otel-inventory, otel-receiver, otel-sampling, otel-routing, otel-backend, otel-storage]}
        - {kind: cluster, label: EKS 論理クラスタ（制御プレーンは AWS 管理 VPC）, tier: [diagram], x0: -1, y0: 0.5, x1: 10, y1: 12, nodes: [otel-eks, otel-ec2, otel-order, otel-inventory, otel-receiver, otel-sampling, otel-routing, otel-backend]}
    layout3d:
      tiers:
        - {id: hosts, label: 実行基盤, z: 0, size: [10, 10]}
        - {id: apps, label: ノード上の処理, z: 1, size: [10, 10]}
        - {id: services, label: 独立サービス・監視ホスト, z: 0, origin: [13, 0], size: [10, 9]}
        - {id: serviceapps, label: 監視ホスト上の処理, z: 1, origin: [13, 0], size: [10, 9]}
        - {id: outside, label: 利用者, z: 0, origin: [-5, 0], size: [4, 4]}
      nodes:
        otel-eks: {tier: services, x: 7, y: 6}
        otel-ec2: {tier: hosts, x: 4, y: 1}
        otel-order: {tier: apps, x: 7, y: 1}
        otel-inventory: {tier: apps, x: 1, y: 4}
        otel-receiver: {tier: apps, x: 4, y: 4}
        otel-sampling: {tier: apps, x: 7, y: 4}
        otel-routing: {tier: apps, x: 1, y: 7}
        otel-backend: {tier: apps, x: 4, y: 7}
        otel-storage: {tier: services, x: 1, y: 1}
        otel-caller: {tier: outside, x: 1, y: 1}
      groups:
        - {kind: cloud, provider: aws, label: AWS サービス領域, tier: [hosts, apps, services], nodes: [otel-eks, otel-ec2, otel-order, otel-inventory, otel-receiver, otel-sampling, otel-routing, otel-backend, otel-storage]}
