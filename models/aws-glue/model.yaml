name: AWS Glue の基本アーキテクチャ
description: Crawler と Data Catalog でデータを発見し、トリガーされたサーバーレス ETL Job で分析用に整備する流れを追います。
reference:
  objectives:
    - Crawler と Data Catalog の役割を区別する。
    - AWS Glue Job がサーバーレス実行環境で抽出・変換・ロードする流れを追う。
    - Trigger と Workflow による依存関係・監視を理解する。
  sources:
    - title: AWS Glue concepts
      url: https://docs.aws.amazon.com/glue/latest/dg/components-key-concepts.html
    - title: AWS Glue components
      url: https://docs.aws.amazon.com/glue/latest/dg/components-overview.html
    - title: AWS Glue How it works
      url: https://docs.aws.amazon.com/glue/latest/dg/how-it-works.html
    - title: AWS Glue workflows
      url: https://docs.aws.amazon.com/glue/latest/dg/workflows_overview.html
sources:
  - docs/reference-aws-glue.md
evidence:
  - type: doc
    ref: docs/reference-aws-glue.md#§1
tiers:
  - id: discover
    label: 発見と制御
    z: 1
    size:
      - 15
      - 3
  - id: data
    label: データ処理
    z: 0
    origin:
      - 2
      - 0
    size:
      - 14
      - 3
nodes:
  source:
    label: 変換前のデータ置き場
    kind: external
    tier: data
    x: 0
    'y': 1.5
    description: 注文ファイルなどの元データ。
    evidence:
      - type: doc
        ref: docs/reference-aws-glue.md#§1
  crawler:
    label: 入力スキーマの発見
    kind: worker
    tier: discover
    x: 2
    'y': 1.5
    description: データを走査しスキーマを推測する。
    evidence:
      - type: doc
        ref: docs/reference-aws-glue.md#§1
  catalog:
    label: テーブルの定義台帳
    kind: db
    tier: discover
    x: 5
    'y': 1.5
    description: テーブルとジョブが使う技術メタデータを管理する。
    evidence:
      - type: doc
        ref: docs/reference-aws-glue.md#§2
  trigger:
    label: 処理の起動と依存制御
    kind: service
    tier: discover
    x: 8
    'y': 1.5
    description: スケジュール・イベント・依存関係で Job を起動する。
    evidence:
      - type: doc
        ref: docs/reference-aws-glue.md#§4
  job:
    label: 抽出・変換の実行
    kind: worker
    tier: data
    x: 10
    'y': 1.5
    description: 入力データを抽出し、型や項目を変換して分析用の出力に書く。
    evidence:
      - type: doc
        ref: docs/reference-aws-glue.md#§3
  target:
    label: 分析データの保存先
    kind: db
    shape3D: crate
    tier: data
    x: 13
    'y': 1.5
    description: 整備済みデータを置くデータレイク等。
    evidence:
      - type: doc
        ref: docs/reference-aws-glue.md#§5
  monitor:
    label: 実行ログと監視
    kind: service
    tier: discover
    x: 13
    'y': 2.5
    description: ジョブ実行の状態、ログ、通知を追う。
    evidence:
      - type: doc
        ref: docs/reference-aws-glue.md#§5
links:
  - id: crawl
    from: source
    to: crawler
    label: スキーマを発見
    evidence:
      - type: doc
        ref: docs/reference-aws-glue.md#§1
  - id: catalog
    from: crawler
    to: catalog
    label: テーブル定義を登録
    evidence:
      - type: doc
        ref: docs/reference-aws-glue.md#§1
  - id: trigger
    from: trigger
    to: job
    label: Job を起動
    evidence:
      - type: doc
        ref: docs/reference-aws-glue.md#§4
  - id: metadata
    from: catalog
    to: job
    label: ソース・ターゲット定義を提供
    evidence:
      - type: doc
        ref: docs/reference-aws-glue.md#§2
  - id: process
    from: source
    to: job
    label: データを抽出・変換
    evidence:
      - type: doc
        ref: docs/reference-aws-glue.md#§3
  - id: load
    from: job
    to: target
    label: 結果をロード
    evidence:
      - type: doc
        ref: docs/reference-aws-glue.md#§5
  - id: observe
    from: job
    to: monitor
    label: 実行を監視
    evidence:
      - type: doc
        ref: docs/reference-aws-glue.md#§5
scenarios:
  - id: catalog-etl
    label: Catalog から分析用データへ
    evidence:
      - type: doc
        ref: docs/reference-aws-glue.md#§6
    steps:
      - links:
          - crawl
          - catalog
        note: Crawler がソースを走査し、Data Catalog にテーブル定義を登録する。
      - links:
          - trigger
          - metadata
          - process
        note: Trigger が Job を起動し、Catalog の定義を使って抽出・変換する。
      - links:
          - load
          - observe
        note: 結果をターゲットへ書き、ログと状態を監視する。
implementations:
  - id: aws
    label: AWS Glue で S3 の CSV を Parquet に変換
    description: S3 の raw プレフィックスにある注文 CSV をクロールし、登録した定義を Glue の Spark ジョブで読む例。処理後は別のプレフィックスに Parquet を保存する。
    sources:
      - title: AWS Glue concepts
        url: https://docs.aws.amazon.com/glue/latest/dg/components-key-concepts.html
      - title: AWS Glue components
        url: https://docs.aws.amazon.com/glue/latest/dg/components-overview.html
      - title: AWS Glue How it works
        url: https://docs.aws.amazon.com/glue/latest/dg/how-it-works.html
      - title: AWS Glue workflows
        url: https://docs.aws.amazon.com/glue/latest/dg/workflows_overview.html
      - title: Crawler prerequisites
        url: https://docs.aws.amazon.com/glue/latest/dg/crawler-prereqs.html
      - title: Logging and monitoring in AWS Glue
        url: https://docs.aws.amazon.com/glue/latest/dg/logging-and-monitoring.html
      - {title: Glue Spark ジョブのスクリプトの場所, url: https://docs.aws.amazon.com/glue/latest/webapi/API_JobCommand.html}
      - {title: AWS shared responsibility, url: https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/shared-responsibility.html}
    tiers:
      - id: processing
        label: データの処理と保存
        z: 0
        size:
          - 19
          - 5
      - id: setup
        label: 実行に必要な設定・成果物
        z: 1
        size:
          - 14
          - 3
    groups:
      - kind: cloud
        label: AWS アカウント
        provider: aws
        tier:
          - processing
          - setup
    nodes:
      aws-runtime: {label: Glue managed Spark runtime, kind: host, tier: processing, x: 13, y: 3, management: {type: aws, scope: "AWS provisions and manages serverless job infrastructure."}, evidence: [{type: doc, ref: "docs/reference-aws-glue.md#§7"}]}
      aws-s3:
        label: Amazon S3（raw の注文 CSV）
        kind: db
        tier: processing
        x: 1
        'y': 1.15
        svc: s3
        realizes:
          - source
        description: raw プレフィックスに投入した注文 CSV を保持する。
        management: {type: shared, scope: "AWS operates S3; customer manages data and access."}
        evidence:
          - type: doc
            ref: docs/reference-aws-glue.md#§7
      aws-crawler:
        label: Glue Crawler
        kind: worker
        tier: processing
        x: 1
        'y': 3.65
        svc: glue
        realizes:
          - crawler
        description: raw プレフィックスを分類し、テーブル定義を更新する。
        management: {type: shared, scope: "AWS operates crawler infrastructure; customer configures crawler and access."}
        evidence:
          - type: doc
            ref: docs/reference-aws-glue.md#§7
      aws-catalog:
        label: Glue Data Catalog
        kind: catalog
        tier: processing
        x: 5
        'y': 1.15
        svc: glue
        realizes:
          - catalog
        description: クロール結果のスキーマと S3 上の位置を持つ。
        management: {type: shared, scope: "AWS operates the catalog; customer manages definitions and permissions."}
        evidence:
          - type: doc
            ref: docs/reference-aws-glue.md#§7
      aws-workflow:
        label: Glue Workflow と Trigger
        kind: workflow
        tier: processing
        x: 5
        'y': 3.65
        svc: glue
        realizes:
          - trigger
        description: Crawler の成功を条件にジョブを起動する。
        management: {type: shared, scope: "AWS operates the service; customer configures workflow and triggers."}
        evidence:
          - type: doc
            ref: docs/reference-aws-glue.md#§7
      aws-spark:
        label: Glue Spark ETL ジョブ
        kind: worker
        tier: processing
        x: 9
        'y': 1.15
        svc: glue
        realizes:
          - job
        description: AWS 管理の Glue ワーカー上で Spark を実行し、Catalog の入力定義を使って Parquet に変換する。
        management: {type: customer, scope: "Customer manages job code, runtime settings and permissions."}
        evidence:
          - type: doc
            ref: docs/reference-aws-glue.md#§7
      aws-logs:
        label: Amazon CloudWatch Logs
        kind: monitor
        tier: processing
        x: 9
        'y': 3.65
        svc: cloudwatch
        realizes:
          - monitor
        description: ジョブ実行ログから処理結果とエラーを確認する。
        management: {type: shared, scope: "AWS operates CloudWatch; customer manages logging and access."}
        evidence:
          - type: doc
            ref: docs/reference-aws-glue.md#§7
      aws-role:
        label: Glue の IAM 実行ロール
        kind: policy
        tier: setup
        x: 1
        'y': 1.5
        description: Crawler とジョブに必要な S3・Data Catalog へのアクセスを用途に応じて付与する。
        management: {type: customer, scope: "Customer manages IAM permissions and trust."}
        evidence:
          - type: doc
            ref: docs/reference-aws-glue.md#§7
        svc: iam
      aws-curated: {label: Amazon S3（curated の Parquet）, svc: s3, kind: db, tier: processing, x: 15, y: 1.15, realizes: [target], description: Glue ジョブの Parquet 出力を保持する。, management: {type: shared, scope: "AWS operates S3; customer manages data and access."}, evidence: [{type: doc, ref: docs/reference-aws-glue.md#§7}]}
      aws-script: {label: Amazon S3（PySpark スクリプト）, svc: s3, kind: file, tier: setup, x: 6, y: 1.5, description: ジョブの ScriptLocation で指定した変換スクリプトを保持する。, management: {type: customer, scope: "Customer manages job script and access."}, evidence: [{type: doc, ref: docs/reference-aws-glue.md#§7}]}
    links:
      - {id: aws-runtime-execute, from: aws-runtime, to: aws-spark, label: "Run Spark job", evidence: [{type: doc, ref: "docs/reference-aws-glue.md#§7"}]}
      - {id: aws-crawler-role, from: aws-role, to: aws-crawler, label: 入力とカタログへの権限を付与}
      - {id: aws-script-location, from: aws-spark, to: aws-script, label: 起動時に PySpark スクリプトを取得}
      - {id: aws-crawler-complete, from: aws-crawler, to: aws-workflow, label: 成功後に依存トリガーを起動}
      - {id: aws-input-schema, from: aws-catalog, to: aws-spark, label: 入力スキーマと S3 のパスを参照, realizes: [metadata], replace: true}
      - id: aws-role-connection
        from: aws-role
        to: aws-spark
        label: ジョブのアクセス権限を渡す
    layout2d:
      tiers: [{id: diagram, label: Glue and customer data, z: 0, size: [28, 12]}]
      nodes:
        aws-s3: {tier: diagram, x: 2, y: 2}
        aws-crawler: {tier: diagram, x: 7, y: 2}
        aws-catalog: {tier: diagram, x: 12, y: 2}
        aws-workflow: {tier: diagram, x: 17, y: 2}
        aws-logs: {tier: diagram, x: 22, y: 2}
        aws-role: {tier: diagram, x: 2, y: 6}
        aws-curated: {tier: diagram, x: 7, y: 6}
        aws-script: {tier: diagram, x: 12, y: 6}
        aws-runtime: {tier: diagram, x: 17, y: 6}
        aws-spark: {tier: diagram, x: 22, y: 6}
      groups:
        - {kind: cloud, provider: aws, label: Customer AWS account and Glue service configuration, tier: diagram, nodes: [aws-s3, aws-crawler, aws-catalog, aws-workflow, aws-logs, aws-role, aws-curated, aws-script]}
        - {kind: cloud, provider: aws, label: AWS Glue managed job runtime, tier: diagram, nodes: [aws-runtime, aws-spark]}
    layout3d:
      tiers:
        - {id: job, label: Spark job, z: 1, size: [5, 3]}
        - {id: runtime, label: Glue managed runtime, z: 0, size: [5, 3]}
        - {id: account, label: Customer account and Glue APIs, z: 0, origin: [8, 0], size: [20, 6]}
      nodes:
        aws-s3: {tier: account, x: 2, y: 1}
        aws-crawler: {tier: account, x: 6, y: 1}
        aws-catalog: {tier: account, x: 10, y: 1}
        aws-workflow: {tier: account, x: 14, y: 1}
        aws-logs: {tier: account, x: 18, y: 1}
        aws-role: {tier: account, x: 2, y: 4}
        aws-curated: {tier: account, x: 6, y: 4}
        aws-script: {tier: account, x: 10, y: 4}
        aws-runtime: {tier: runtime, x: 2, y: 1.5}
        aws-spark: {tier: job, x: 2, y: 1.5}
      groups:
        - {kind: cloud, provider: aws, label: Customer AWS account and Glue service configuration, tier: account, nodes: [aws-s3, aws-crawler, aws-catalog, aws-workflow, aws-logs, aws-role, aws-curated, aws-script]}
        - {kind: cloud, provider: aws, label: AWS Glue managed job runtime, tier: [job, runtime], nodes: [aws-runtime, aws-spark]}
