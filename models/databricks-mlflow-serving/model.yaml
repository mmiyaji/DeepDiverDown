name: Databricks MLflow と Model Serving の版管理
description: 注文遅延の予測モデルを学習し、検証済みのバージョンを登録・配備して推論する。
parent:
  model: databricks
  node: ml
reference:
  objectives:
    - 実験の記録、登録モデルのバージョン、稼働中エンドポイントの状態を区別する。
    - 配備時に旧版と新版を確認し、切り戻せるようにする。
  sources:
    - title: MLflow のモデル記録
      url: https://docs.databricks.com/aws/en/mlflow/models
    - title: Unity Catalog のモデルライフサイクル
      url: https://docs.databricks.com/aws/en/machine-learning/manage-model-lifecycle/
    - title: Model Serving エンドポイントの作成
      url: https://docs.databricks.com/aws/en/machine-learning/model-serving/create-manage-serving-endpoints
sources:
  - docs/reference-databricks-mlflow-serving.md
evidence:
  - type: doc
    ref: docs/reference-databricks-mlflow-serving.md#§1
tiers:
  - id: flow
    label: 構成と処理の流れ
    z: 0
    size:
      - 18.5
      - 2.5
nodes:
  orders:
    label: 学習用の注文テーブル
    kind: db
    tier: flow
    x: 0
    'y': 2
    description: 注文時点の特徴量。
    evidence:
      - type: doc
        ref: docs/reference-databricks-mlflow-serving.md#§1
  train:
    label: 学習ジョブ
    kind: worker
    tier: flow
    x: 3
    'y': 2
    description: 予測モデルを学習。
    evidence:
      - type: doc
        ref: docs/reference-databricks-mlflow-serving.md#§2
  tracking:
    label: 実験記録とモデル成果物
    kind: db
    tier: flow
    x: 6
    'y': 0
    description: パラメータ・指標・成果物。
    evidence:
      - type: doc
        ref: docs/reference-databricks-mlflow-serving.md#§2
  registry:
    label: モデル版のレジストリ
    kind: db
    tier: flow
    x: 9
    'y': 2
    description: 名前・版・エイリアス。
    evidence:
      - type: doc
        ref: docs/reference-databricks-mlflow-serving.md#§3
  deploy:
    label: 検証・配備ジョブ
    kind: worker
    tier: flow
    x: 12
    'y': 0
    description: 検証済みの版を選択。
    evidence:
      - type: doc
        ref: docs/reference-databricks-mlflow-serving.md#§3
  endpoint:
    label: オンライン推論エンドポイント
    kind: service
    tier: flow
    x: 15
    'y': 2
    description: 設定した版で推論。
    evidence:
      - type: doc
        ref: docs/reference-databricks-mlflow-serving.md#§4
  app:
    label: 注文アプリ
    kind: client
    tier: flow
    x: 18
    'y': 2
    description: オンラインでスコアを要求。
    evidence:
      - type: doc
        ref: docs/reference-databricks-mlflow-serving.md#§4
links:
  - id: train
    from: orders
    to: train
    label: 学習データを読む
    evidence:
      - type: doc
        ref: docs/reference-databricks-mlflow-serving.md#§2
  - id: record
    from: train
    to: tracking
    label: 実験と成果物を記録
    evidence:
      - type: doc
        ref: docs/reference-databricks-mlflow-serving.md#§2
  - id: register
    from: tracking
    to: registry
    label: 選んだ成果物を登録
    evidence:
      - type: doc
        ref: docs/reference-databricks-mlflow-serving.md#§3
  - id: promote
    from: registry
    to: deploy
    label: 検証済みの版を確認
    evidence:
      - type: doc
        ref: docs/reference-databricks-mlflow-serving.md#§3
  - id: configure
    from: deploy
    to: endpoint
    label: 明示したバージョンを配備
    evidence:
      - type: doc
        ref: docs/reference-databricks-mlflow-serving.md#§4
  - id: predict
    from: app
    to: endpoint
    label: スコアを要求
    evidence:
      - type: doc
        ref: docs/reference-databricks-mlflow-serving.md#§4
  - id: respond
    from: endpoint
    to: app
    label: 予測を返す
    evidence:
      - type: doc
        ref: docs/reference-databricks-mlflow-serving.md#§4
scenarios:
  - id: release
    label: 検証済みの予測モデルを公開
    evidence:
      - type: doc
        ref: docs/reference-databricks-mlflow-serving.md#§4
    steps:
      - links:
          - train
          - record
        note: 注文データで学習し、どの実験で作られたかを保存する。
      - links:
          - register
          - promote
        note: 登録モデルの版と承認した版が一致することを確認する。
      - links:
          - configure
          - predict
          - respond
        note: 選んだバージョンを配備し、リクエストと応答を確認する。
  - id: rollback
    label: 新版に問題があり旧版に戻す
    evidence:
      - type: doc
        ref: docs/reference-databricks-mlflow-serving.md#§4
    steps:
      - links:
          - predict
        note: 推論結果の問題と現在稼働しているバージョンを調べる。
      - links:
          - promote
          - configure
        note: 旧版を選び、エンドポイントの配備設定を切り替える。
      - links:
          - predict
          - respond
        note: 戻したバージョンで結果を再確認する。
implementations:
  - id: databricks-ml-serving
    label: Unity Catalog モデルのオンライン配備
    description: 実験結果から承認済みの版を選び、注文アプリから Databricks のカスタムモデルエンドポイントを呼ぶ構成。
    sources:
      - title: MLflow のモデル記録
        url: https://docs.databricks.com/aws/en/mlflow/models
      - title: Unity Catalog のモデルライフサイクル
        url: https://docs.databricks.com/aws/en/machine-learning/manage-model-lifecycle/
      - title: Model Serving エンドポイントの作成
        url: https://docs.databricks.com/aws/en/machine-learning/model-serving/create-manage-serving-endpoints
      - title: Query serving endpoints for custom models
        url: https://docs.databricks.com/aws/en/machine-learning/model-serving/score-custom-model-endpoints
      - title: Databricks Runtime ML
        url: https://docs.databricks.com/aws/en/machine-learning/databricks-runtime-ml
      - title: クラシック計算資源の配置
        url: https://docs.databricks.com/aws/en/compute/use-compute
      - title: MLflow Experiment の成果物と Volume
        url: https://docs.databricks.com/aws/en/mlflow/experiments
      - title: モデル配信エンドポイントの権限
        url: https://docs.databricks.com/aws/en/machine-learning/model-serving/manage-serving-endpoints
      - title: OAuth M2M
        url: https://docs.databricks.com/aws/en/dev-tools/auth/oauth-m2m
      - {title: Databricks architecture, url: https://docs.databricks.com/aws/en/security/network/deployment-architecture/}
      - {title: Unity Catalog managed storage, url: https://docs.databricks.com/aws/en/connect/unity-catalog/cloud-storage/managed-storage}
    tiers:
      - id: flow
        label: 構成と処理の流れ
        z: 0
        size:
          - 18.5
          - 2.5
      - id: implementation-setup
        label: 実装時の設定・観測
        z: 1
        size:
          - 18
          - 4
    nodes:
      example-training-s3: {label: S3 managed training table storage, svc: s3, kind: db, tier: flow, x: 22, y: 5, management: {type: shared, scope: "AWS operates S3; customer manages storage and permissions."}, evidence: [{type: doc, ref: "docs/reference-databricks-mlflow-serving.md#§5"}]}
      example-serving-compute: {label: Databricks Model Serving compute, kind: host, tier: flow, x: 11, y: 5, evidence: [{type: doc, ref: "docs/reference-databricks-mlflow-serving.md#§5"}]}
      example-deploy-host: {label: Customer deployment runner, kind: host, tier: flow, x: 30, y: 5, evidence: [{type: doc, ref: "docs/reference-databricks-mlflow-serving.md#§5"}]}
      example-orders:
        label: Unity Catalog のモデル学習用テーブル
        kind: db
        tier: flow
        x: 3
        y: 1
        realizes:
          - orders
        description: 注文時点の特徴量を読み取れるようにする。
        evidence:
          - type: doc
            ref: docs/reference-databricks-mlflow-serving.md#§5
        svc: databricks:delta
      example-train:
        label: Lakeflow Jobs の学習ジョブ
        kind: worker
        tier: flow
        svc: databricks:platform
        x: 11
        y: 1
        realizes:
          - train
        description: 利用者の AWS アカウントに配置するクラシック Jobs コンピュートで学習を起動する。
        evidence:
          - type: doc
            ref: docs/reference-databricks-mlflow-serving.md#§5
      example-registry:
        label: Unity Catalog の登録モデル
        kind: db
        tier: flow
        x: 7
        y: 1
        realizes:
          - registry
        description: 選んだ成果物を新しいモデル版として登録する。
        evidence:
          - type: doc
            ref: docs/reference-databricks-mlflow-serving.md#§5
        svc: databricks:unity
      example-deploy:
        label: モデル配備ジョブ
        kind: worker
        tier: flow
        x: 30
        y: 9
        realizes:
          - deploy
        description: モデル名と承認済みバージョンをエンドポイント設定へ渡す。
        evidence:
          - type: doc
            ref: docs/reference-databricks-mlflow-serving.md#§5
      example-endpoint:
        label: Databricks Model Serving
        kind: service
        tier: flow
        svc: databricks:modelserving
        x: 3
        y: 5
        realizes:
          - endpoint
        description: Databricks 管理のサーバーレス計算資源で、設定した Unity Catalog モデルを実行する。
        evidence:
          - type: doc
            ref: docs/reference-databricks-mlflow-serving.md#§5
      example-app:
        label: 注文アプリのエンドポイントクライアント
        kind: client
        tier: flow
        x: 30
        y: 1
        realizes:
          - app
        description: 推論 API を呼んでスコアを取得する。
        evidence:
          - type: doc
            ref: docs/reference-databricks-mlflow-serving.md#§5
      example-identity:
        label: 推論呼び出し用サービスプリンシパル
        kind: policy
        tier: flow
        x: 7
        y: 5
        description: 注文アプリが OAuth M2M を使う主体。対象エンドポイントには CAN QUERY を付与する。
        evidence:
          - type: doc
            ref: docs/reference-databricks-mlflow-serving.md#§5
      example-runtime:
        label: EC2 の Databricks Runtime ML
        kind: worker
        svc: ec2
        tier: flow
        x: 22
        y: 1
        description: クラシック Jobs コンピュートが学習用データを読みモデルを訓練する。
        management: {type: shared, scope: "AWS operates EC2; customer configures training compute and code."}
        evidence:
          - type: doc
            ref: docs/reference-databricks-mlflow-serving.md#§5
      example-artifacts:
        label: 成果物の S3 管理ストレージ
        kind: db
        svc: s3
        tier: flow
        x: 26
        y: 1
        description: Unity Catalog Volume に指定した MLflow Run の成果物を保持する。
        management: {type: shared, scope: "AWS operates S3; customer manages artifacts and access."}
        evidence:
          - type: doc
            ref: docs/reference-databricks-mlflow-serving.md#§5
      example-tracking:
        label: Databricks 管理の MLflow Tracking
        kind: service
        tier: flow
        x: 15
        y: 1
        description: 実験パラメーターと検証結果を記録し、モデル成果物を紐付ける。
        realizes:
          - tracking
        evidence:
          - type: doc
            ref: docs/reference-databricks-mlflow-serving.md#§5
        svc: databricks:platform
    links:
      - {id: example-training-storage, from: example-orders, to: example-training-s3, label: "Store training data", evidence: [{type: doc, ref: "docs/reference-databricks-mlflow-serving.md#§5"}]}
      - {id: example-serving-runtime, from: example-serving-compute, to: example-endpoint, label: "Run serving endpoint", evidence: [{type: doc, ref: "docs/reference-databricks-mlflow-serving.md#§5"}]}
      - {id: example-deployment-runtime, from: example-deploy-host, to: example-deploy, label: "Run deployment job", evidence: [{type: doc, ref: "docs/reference-databricks-mlflow-serving.md#§5"}]}
      - id: example-start-training
        from: example-train
        to: example-runtime
        label: クラシック計算資源で学習を起動
        evidence:
          - type: doc
            ref: docs/reference-databricks-mlflow-serving.md#§5
      - id: example-load-training
        from: example-orders
        to: example-runtime
        label: 注文の学習データを読む
        realizes:
          - train
        replace: true
        evidence:
          - type: doc
            ref: docs/reference-databricks-mlflow-serving.md#§5
      - id: example-log-training
        from: example-runtime
        to: example-tracking
        label: パラメーターと検証結果を記録
        realizes:
          - record
        replace: true
        evidence:
          - type: doc
            ref: docs/reference-databricks-mlflow-serving.md#§5
      - id: example-save-artifacts
        from: example-runtime
        to: example-artifacts
        label: 指定 Volume にモデル成果物を保存
        realizes:
          - record
        replace: true
        evidence:
          - type: doc
            ref: docs/reference-databricks-mlflow-serving.md#§5
      - id: example-identity-connection
        from: example-identity
        to: example-app
        label: 認証済み要求で呼び出す
        evidence:
          - type: doc
            ref: docs/reference-databricks-mlflow-serving.md#§5
    groups:
      - {kind: cloud, provider: databricks, label: Databricks workspace and serving, tier: flow, nodes: [example-orders, example-registry, example-train, example-tracking, example-endpoint, example-identity, example-serving-compute]}
      - {kind: cloud, provider: aws, label: Customer AWS account, tier: flow, nodes: [example-runtime, example-artifacts, example-training-s3]}
      - {kind: datacenter, provider: onprem, label: 顧客の配備環境, tier: flow, nodes: [example-deploy-host, example-deploy]}
    layout2d:
      tiers: [{id: diagram, label: Model lifecycle, z: 0, size: [35, 15]}]
      nodes:
        example-orders: {tier: diagram, x: 3, y: 1}
        example-registry: {tier: diagram, x: 7, y: 1}
        example-train: {tier: diagram, x: 11, y: 1}
        example-tracking: {tier: diagram, x: 15, y: 1}
        example-endpoint: {tier: diagram, x: 3, y: 5}
        example-identity: {tier: diagram, x: 7, y: 5}
        example-serving-compute: {tier: diagram, x: 11, y: 5}
        example-runtime: {tier: diagram, x: 22, y: 1}
        example-artifacts: {tier: diagram, x: 26, y: 1}
        example-training-s3: {tier: diagram, x: 22, y: 5}
        example-app: {tier: diagram, x: 30, y: 1}
        example-deploy-host: {tier: diagram, x: 30, y: 5}
        example-deploy: {tier: diagram, x: 30, y: 9}
      groups:
        - {kind: cloud, provider: databricks, label: Databricks workspace and serving, tier: diagram, nodes: [example-orders, example-registry, example-train, example-tracking, example-endpoint, example-identity, example-serving-compute]}
        - {kind: cloud, provider: aws, label: Customer AWS account, tier: diagram, nodes: [example-runtime, example-artifacts, example-training-s3]}
        - {kind: datacenter, provider: onprem, label: 顧客の配備環境, tier: diagram, nodes: [example-deploy-host, example-deploy]}
    layout3d:
      tiers:
        - {id: workspace, label: Databricks services, z: 1, size: [16, 6]}
        - {id: serving, label: Model Serving compute, z: 0, size: [16, 6]}
        - {id: aws, label: Customer AWS account, z: 0, origin: [19, 0], size: [12, 3]}
        - {id: external, label: Customer clients and runner, kind: origin, z: 0, origin: [-8, 0], size: [6, 3]}
      nodes:
        example-orders: {tier: workspace, x: 2, y: 1}
        example-registry: {tier: workspace, x: 6, y: 1}
        example-train: {tier: workspace, x: 10, y: 1}
        example-tracking: {tier: workspace, x: 14, y: 1}
        example-endpoint: {tier: workspace, x: 2, y: 4}
        example-identity: {tier: workspace, x: 6, y: 4}
        example-serving-compute: {tier: serving, x: 10, y: 1.5}
        example-runtime: {tier: aws, x: 2, y: 1.5}
        example-artifacts: {tier: aws, x: 6, y: 1.5}
        example-training-s3: {tier: aws, x: 10, y: 1.5}
        example-app: {tier: external, x: 0, y: 1.5}
        example-deploy-host: {tier: external, x: 2, y: 1.5}
        example-deploy: {tier: external, x: 4, y: 1.5}
      groups:
        - {kind: cloud, provider: databricks, label: Databricks workspace and serving, tier: [workspace, serving], nodes: [example-orders, example-registry, example-train, example-tracking, example-endpoint, example-identity, example-serving-compute]}
        - {kind: cloud, provider: aws, label: Customer AWS account, tier: aws, nodes: [example-runtime, example-artifacts, example-training-s3]}
        - {kind: datacenter, provider: onprem, label: 顧客の配備環境, tier: external, nodes: [example-deploy-host, example-deploy]}
