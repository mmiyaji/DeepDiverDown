        hb-swu-server: {tier: managementapps, x: 1, y: 4}
        hb-swu-amqp: {tier: managementapps, x: 4, y: 4}
        hb-swu-db: {tier: managementapps, x: 7, y: 4}
        hb-swu-store: {tier: managementapps, x: 1, y: 7}
        hb-swu-device: {tier: edgehost, x: 1, y: 1}
        hb-swu-swupdate: {tier: edgeapps, x: 4, y: 1}
        hb-swu-boot: {tier: edgeapps, x: 7, y: 1}
