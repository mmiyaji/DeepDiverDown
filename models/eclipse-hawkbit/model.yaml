        hb-swu-operator: {tier: diagram, x: 20, y: 1}
        hb-swu-artifact: {tier: diagram, x: 4, y: 7}
      groups:
        - {kind: datacenter, label: 利用者の管理ホスト, tier: [diagram], x0: -1, y0: 0, x1: 9, y1: 11, nodes: [hb-swu-host, hb-swu-proxy, hb-swu-ui, hb-swu-server, hb-swu-amqp, hb-swu-db, hb-swu-store, hb-swu-artifact]}
