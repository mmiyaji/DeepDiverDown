            ref: docs/reference-eclipse-hawkbit.md#§4
      ex-server:
        label: Eclipse hawkBit
        kind: service
        tier: flow
        x: 4
        'y': 1.5
        description: ターゲットとロールアウトを管理する。
        realizes:
          - server
        evidence:
          - type: doc
            ref: docs/reference-eclipse-hawkbit.md#§4
      ex-client:
        label: 端末 updater
        kind: service
        tier: flow
        x: 8
        'y': 1.5
        description: DDI をポーリングし更新を取得する。
        realizes:
          - client
        evidence:
          - type: doc
            ref: docs/reference-eclipse-hawkbit.md#§4
      ex-software:
        label: 端末ソフトウェア
        kind: service
        tier: flow
        x: 12
        'y': 1.5
        description: 検証と適用の対象。
        realizes:
          - software
        evidence:
          - type: doc
            ref: docs/reference-eclipse-hawkbit.md#§4
      ex-artifact:
        label: 更新アーティファクト
        kind: file
