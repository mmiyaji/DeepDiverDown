name: dbt：解析・コンパイルと実行順序
description: プロジェクトを解析して依存グラフを作り、モデルごとの SQL をウェアハウスへ投げる。データの処理はウェアハウス側で行う。
parent: {model: dbt, node: dag}
reference:
  objectives:
    - ref と source から manifest と依存グラフができる流れを追う。
    - materialization ごとに、dbt が生成する SQL が変わることを区別する。
    - dbt が SQL を送る側で、行の処理はウェアハウスが担うことを確かめる。
  sources:
    - {title: About dbt compile command, url: https://docs.getdbt.com/reference/commands/compile}
    - {title: Manifest JSON file, url: https://docs.getdbt.com/reference/artifacts/manifest-json}
    - {title: Materializations, url: https://docs.getdbt.com/docs/build/materializations}
    - {title: ref function, url: https://docs.getdbt.com/reference/dbt-jinja-functions/ref}
sources: [docs/reference-dbt-compile-run-order.md]
evidence: [{type: doc, ref: "docs/reference-dbt-compile-run-order.md#§1"}, {type: doc, ref: "docs/reference-dbt-compile-run-order.md#§6"}, {type: doc, ref: "docs/reference-dbt-compile-run-order.md#§8"}]
tiers:
  - {id: dbt, label: dbt の制御プロセス, z: 1, size: [24, 6]}
  - {id: wh, label: ウェアハウス（SQL とデータ）, z: 0, size: [24, 5]}
nodes:
  files: {label: モデル SQL と YAML, kind: file, tier: dbt, x: 1, y: 1, description: select 文のモデル、source の宣言、テスト、materialization の設定を持つ。, evidence: &parse [{type: doc, ref: "docs/reference-dbt-compile-run-order.md#§2"}]}
  parser: {label: プロジェクトの解析, kind: worker, tier: dbt, x: 5, y: 1, description: Jinja の ref と source を読み取り、モデル間の参照を集める。, evidence: *parse}
  manifest: {label: manifest.json, kind: file, tier: dbt, x: 9, y: 1, description: 解析結果として、ノードと依存関係を保持する成果物。, evidence: *parse}
  graph: {label: 依存グラフ, kind: service, tier: dbt, x: 13, y: 1, description: ref と source の参照から有向グラフを作り、実行順の元にする。, evidence: *parse}
  planner: {label: 実行順の決定, kind: worker, tier: dbt, x: 17, y: 1, description: 選択したノードを依存順に並べ、threads の数まで並行に実行する。, evidence: &order [{type: doc, ref: "docs/reference-dbt-compile-run-order.md#§3"}]}
  compiler: {label: モデルのコンパイル, kind: worker, tier: dbt, x: 21, y: 1, description: Jinja を展開し、ref を実際のスキーマ付き名前に置き換えた SELECT を作る。, evidence: *order}
  adapter: {label: アダプターと接続, kind: service, tier: dbt, x: 21, y: 4, description: materialization に応じた DDL・DML を組み立て、ウェアハウスへ送る。, evidence: &mat [{type: doc, ref: "docs/reference-dbt-compile-run-order.md#§4"}]}
  engine: {label: ウェアハウスの SQL 実行, kind: service, tier: wh, x: 17, y: 1.5, description: 受け取った SQL を実行し、行の読み書きと結果表の作成を担う。, evidence: &exec [{type: doc, ref: "docs/reference-dbt-compile-run-order.md#§5"}]}
  upstream: {label: source と上流モデルの表, kind: db, tier: wh, x: 8, y: 1.5, evidence: *exec}
  built: {label: view・table のモデル, kind: db, tier: wh, x: 1, y: 1.5, description: view は定義だけを保存し、table は select の結果を保存する。, evidence: *exec}
links:
  - {id: read-files, from: files, to: parser, label: ファイルを読み込む, evidence: *parse}
  - {id: write-manifest, from: parser, to: manifest, label: 解析結果を記録, evidence: *parse}
  - {id: build-graph, from: manifest, to: graph, label: 参照から依存関係を作る, evidence: *parse}
  - {id: order, from: graph, to: planner, label: 依存順に並べる, evidence: *order}
  - {id: compile, from: planner, to: compiler, label: ノードを順に渡す, evidence: *order}
  - {id: submit, from: compiler, to: adapter, label: SELECT を渡す, evidence: *mat}
  - {id: send-sql, from: adapter, to: engine, label: CREATE 文として送る, evidence: *mat}
  - {id: read-upstream, from: upstream, to: engine, label: 上流の行を読む, evidence: *exec}
  - {id: create-relation, from: engine, to: built, label: view・table を作成, evidence: *exec}
  - {id: status, from: engine, to: planner, label: 成功・失敗を返す, evidence: *exec}
scenarios:
  - id: dbt-run
    label: dbt run の 1 回の流れ
    evidence: [{type: doc, ref: "docs/reference-dbt-compile-run-order.md#§3"}]
    steps:
      - {links: [read-files, write-manifest, build-graph], note: ファイルを解析し、manifest と依存グラフを作る。}
      - {links: [order, compile], note: 選択したモデルを依存順に取り出し、1 モデルずつ SELECT を作る。}
      - {links: [submit, send-sql, read-upstream, create-relation], note: materialization に合う文をウェアハウスへ送り、ウェアハウスが行を処理して表を作る。}
      - {links: [status], note: 結果を受け取り、失敗したモデルの下流は実行しない。}
unknowns:
  - {id: unverified, text: 実環境の実行時間、threads の最適値、ウェアハウス側のコストは未検証。, refs: [order, create-relation]}
implementations:
  - id: core-postgres
    label: 自前 CI の dbt Core と PostgreSQL
    description: セルフホストの CI ランナーで dbt Core を動かし、dbt-postgres が PostgreSQL へ SQL を送る。行の処理は PostgreSQL サーバーが担う。
    sources:
      - {title: Connect Postgres to dbt, url: https://docs.getdbt.com/docs/local/connect-data-platform/postgres-setup}
      - {title: Manifest JSON file, url: https://docs.getdbt.com/reference/artifacts/manifest-json}
      - {title: Materializations, url: https://docs.getdbt.com/docs/build/materializations}
      - {title: About dbt compile command, url: https://docs.getdbt.com/reference/commands/compile}
    tiers: &cp-tiers [{id: diagram, label: CI ランナーと PostgreSQL, z: 0, size: [26, 11]}]
    nodes:
      ci-files: {label: Git から取得したプロジェクト, kind: file, tier: diagram, x: 2, y: 2, realizes: [files], evidence: &cp [{type: doc, ref: "docs/reference-dbt-compile-run-order.md#§7"}]}
      ci-dbt: {label: dbt Core の解析・コンパイル, kind: worker, tier: diagram, x: 7, y: 2, realizes: [parser, graph, planner, compiler], description: dbt Core が manifest を作り、依存順に SELECT を組み立てる。, evidence: *cp}
      ci-manifest: {label: target/manifest.json, kind: file, tier: diagram, x: 7, y: 5, realizes: [manifest], description: CI ランナーのディスク上の target ディレクトリに書き出す。, evidence: *cp}
      ci-adapter: {label: dbt-postgres アダプター, kind: service, tier: diagram, x: 12, y: 2, realizes: [adapter], description: profiles.yml の接続先へ接続し、DDL・DML を送る。, evidence: *cp}
      pg-engine: {label: PostgreSQL サーバー, svc: postgresql:server, kind: db, tier: diagram, x: 19, y: 2, realizes: [engine], description: 受け取った SQL を実行し、行を処理する。, evidence: *cp}
      pg-raw: {label: raw と上流のスキーマ, kind: db, tier: diagram, x: 19, y: 6.5, realizes: [upstream], evidence: *cp}
      pg-built: {label: staging・mart のスキーマ, kind: db, tier: diagram, x: 23, y: 6.5, realizes: [built], evidence: *cp}
    links:
      - {id: ci-load, from: ci-files, to: ci-dbt, label: ファイルを解析, realizes: [read-files], replace: true}
      - {id: ci-write, from: ci-dbt, to: ci-manifest, label: manifest を書き出す, realizes: [write-manifest], replace: true}
      - {id: ci-submit, from: ci-dbt, to: ci-adapter, label: SELECT を渡す, realizes: [submit], replace: true}
      - {id: ci-send, from: ci-adapter, to: pg-engine, label: SQL を送る, realizes: [send-sql], replace: true}
      - {id: ci-read, from: pg-raw, to: pg-engine, label: 上流の行を読む, realizes: [read-upstream], replace: true}
      - {id: ci-create, from: pg-engine, to: pg-built, label: view・table を作成, realizes: [create-relation], replace: true}
    groups: &cp-groups
      - {kind: datacenter, provider: onprem, label: 自前の CI ランナー, tier: diagram, x0: 0.5, y0: 0.5, x1: 14.5, y1: 8, nodes: [ci-files, ci-dbt, ci-manifest, ci-adapter]}
      - {kind: datacenter, provider: onprem, label: 自前の PostgreSQL サーバー, tier: diagram, x0: 16.5, y0: 0.5, x1: 25.5, y1: 9, nodes: [pg-engine, pg-raw, pg-built]}
    layout2d: {tiers: *cp-tiers, nodes: {}, groups: *cp-groups}
    layout3d:
      tiers:
        - {id: ci, label: CI ランナー, z: 0, size: [10, 8]}
        - {id: db, label: PostgreSQL サーバー, z: 0, origin: [12, 0], size: [10, 8]}
      nodes:
        ci-files: {tier: ci, x: 2, y: 1.5}
        ci-dbt: {tier: ci, x: 5, y: 3}
        ci-manifest: {tier: ci, x: 2, y: 5.5}
        ci-adapter: {tier: ci, x: 8, y: 5.5}
        pg-engine: {tier: db, x: 3, y: 2}
        pg-raw: {tier: db, x: 2, y: 5.5}
        pg-built: {tier: db, x: 7, y: 5.5}
      groups:
        - {kind: datacenter, provider: onprem, label: 自前の CI ランナー, tier: ci, nodes: [ci-files, ci-dbt, ci-manifest, ci-adapter]}
        - {kind: datacenter, provider: onprem, label: 自前の PostgreSQL サーバー, tier: db, nodes: [pg-engine, pg-raw, pg-built]}
