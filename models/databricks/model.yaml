name: Databricks の基本アーキテクチャ
description: 取り込み、Delta テーブルの整備、Unity Catalog、Databricks SQL、共有、機械学習の役割を追う。
reference:
  objectives:
    - SourceからStorageまでのレーンを追う。
    - TransformとQuery/Processを区別する。
    - Unity Catalogのガバナンスを理解する。
    - データ共有と学習済みモデルの配備を区別する。
  sources:
    - title: Databricks reference architectures
      url: https://docs.databricks.com/aws/en/lakehouse-architecture/reference
    - title: OpenSharing
      url: https://docs.databricks.com/aws/en/opensharing
    - title: Model Serving
      url: https://docs.databricks.com/aws/en/machine-learning/model-serving/
sources:
  - docs/reference-databricks.md
evidence:
  - type: doc
    ref: docs/reference-databricks.md#§1
  - type: doc
    ref: docs/reference-databricks.md#§6
tiers:
  - id: lakehouse
    label: Lakehouse
    z: 0
    size:
      - 18
      - 3
  - id: governance
    label: Governance and serving
    z: 1
    origin:
      - 4
      - 0
    size:
      - 13
      - 6
nodes:
  source:
    label: 外部データ源
    kind: external
    tier: lakehouse
    x: 0
    'y': 1.5
    description: 外部データ源。
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§2
  ingest:
    label: 増分データ取り込み
    kind: service
    tier: lakehouse
    x: 3
    'y': 1.5
    drill: databricks-lakeflow
    description: データベースやファイルなどを取り込む。
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§2
  storage:
    label: オブジェクトストレージ
    kind: db
    tier: lakehouse
    x: 6
    'y': 1.5
    description: データとAI資産を保存。
    drill: databricks-liquid-clustering-internals
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§3
  transform:
    drill: databricks-streaming-state-internals
    parallel: 'N'
    label: 変換・品質管理
    kind: worker
    tier: lakehouse
    x: 9
    'y': 1.5
    description: ファイルとテーブルを読み、型や業務ルールを適用する。
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§3
  catalog:
    label: 権限・リネージカタログ
    kind: service
    tier: governance
    x: 5
    'y': 1.5
    drill: databricks-unity-catalog
    description: 権限、名前空間、管理データと外部データの責務、リネージを扱う。
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§4
  query:
    label: SQL クエリの計算資源
    kind: worker
    tier: governance
    x: 9
    'y': 1.5
    drill: databricks-sql-performance
    description: アクセスを許可されたテーブルを並列クエリする。
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§4
  serving:
    label: 分析結果の利用先
    kind: service
    tier: governance
    x: 13
    'y': 1.5
    description: 分析・提供先。
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§5
  sharing:
    label: 別組織へのデータ公開
    kind: service
    tier: governance
    x: 5
    'y': 5
    drill: databricks-open-sharing
    description: 共有する資産と受領者を管理する。
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§7
  ml:
    label: モデルの登録・配備
    kind: service
    tier: governance
    x: 10
    'y': 5
    drill: databricks-mlflow-serving
    description: 検証したモデルのバージョンを登録して推論に使う。
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§8
links:
  - id: ingest-data
    from: source
    to: ingest
    label: データを取り込む
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§2
  - id: land
    from: ingest
    to: storage
    label: Storageへ配置
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§3
  - id: refine
    from: storage
    to: transform
    label: データを変換
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§3
  - id: govern
    from: transform
    to: catalog
    label: 所在と権限をカタログで管理
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§4
  - id: query-data
    from: query
    to: catalog
    label: オブジェクトの名前解決と権限確認
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§4
  - id: read-storage
    from: query
    to: storage
    label: 許可されたテーブルを読む
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§4
  - id: serve
    from: query
    to: serving
    label: 分析へ提供
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§5
  - id: share
    from: catalog
    to: sharing
    label: 共有対象と受領者を管理
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§7
  - id: train
    from: storage
    to: ml
    label: 整備したテーブルから学習
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§8
  - id: model
    from: ml
    to: catalog
    label: 検証対象をモデルバージョンとして登録
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§8
scenarios:
  - id: lakehouse-flow
    label: 取り込みから分析
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§5
    steps:
      - links:
          - ingest-data
          - land
        note: Sourceからバッチまたはストリームでデータを取り込む。
      - links:
          - refine
          - govern
        note: Storage上のデータを変換しUnity Catalogで管理する。
      - links:
          - query-data
          - read-storage
          - serve
        note: 管理下のテーブルをクエリし分析へ提供する。
  - id: reuse
    label: 整備したデータを共有とモデル学習に利用
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§8
    steps:
      - links:
          - share
        note: 受領者と公開する集計を選び共有する。
      - links:
          - train
          - model
        note: 整備したデータで学習したモデルを版として登録し配備する候補を選ぶ。
requirements:
  - id: BR-01
    kind: usecase
    title: 取り込みと分析
    text: 外部データを整備し分析利用できる。
    links:
      - ingest-data
      - refine
      - serve
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§2
  - id: NFR-01
    kind: nfr
    title: ガバナンス
    text: 管理カタログ下でデータを参照する。
    links:
      - govern
      - query-data
    evidence:
      - type: doc
        ref: docs/reference-databricks.md#§4
unknowns:
  - id: UNK-01
    text: クラウドサービス、テーブル形式、計算サイズは未確定。
    refs:
      - ingest
      - storage
      - transform
gates:
  maxDrift: 0
  maxHigh: 0
implementations:
  - id: databricks-aws
    label: Databricks on AWS の注文レイクハウス
    description: S3 の着地先を登録し、取込から BI・共有・モデル配備までを一つの Databricks ワークスペースの運用単位として構成する例。
    sources:
      - title: Databricks reference architectures
        url: https://docs.databricks.com/aws/en/lakehouse-architecture/reference
      - title: OpenSharing
        url: https://docs.databricks.com/aws/en/opensharing
      - title: Model Serving
        url: https://docs.databricks.com/aws/en/machine-learning/model-serving/
      - title: Databricks の S3 外部ロケーション
        url: https://docs.databricks.com/aws/en/connect/unity-catalog/cloud-storage/s3
      - title: Auto Loader
        url: https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/
      - {title: Databricks deployment architecture, url: https://docs.databricks.com/aws/en/security/network/deployment-architecture/}
      - {title: Unity Catalog managed storage, url: https://docs.databricks.com/aws/en/connect/unity-catalog/cloud-storage/managed-storage}
    tiers:
      - id: lakehouse
        label: Lakehouse
        z: 0
        size:
          - 18
          - 3
      - id: governance
        label: Governance and serving
        z: 1
        size:
          - 12
          - 6
      - id: implementation-setup
        label: 実装時の設定・観測
        z: 2
        size:
          - 8
          - 3
    nodes:
      example-managed-s3: {label: S3 managed table storage, svc: s3, kind: db, tier: lakehouse, x: 23, y: 5, management: {type: shared, scope: "AWS operates S3; customer configures storage and permissions."}, evidence: [{type: doc, ref: "docs/reference-databricks.md#§9"}]}
      example-serverless: {label: Databricks serverless compute plane, kind: host, tier: lakehouse, x: 6, y: 9, evidence: [{type: doc, ref: "docs/reference-databricks.md#§9"}]}
      example-training: {label: Databricks classic compute on EC2, svc: ec2, kind: host, tier: lakehouse, x: 27, y: 5, management: {type: shared, scope: "AWS operates EC2; customer configures compute and workloads."}, evidence: [{type: doc, ref: "docs/reference-databricks.md#§9"}]}
      example-source:
        label: Amazon S3 の到着ファイル
        kind: db
        tier: lakehouse
        x: 23
        y: 1
        svc: s3
        realizes:
          - source
        description: 入力ファイルをソース別プレフィックスに配置する。
        evidence:
          - type: doc
            ref: docs/reference-databricks.md#§9
      example-ingest:
        label: Lakeflow Spark Declarative Pipelines
        kind: service
        tier: lakehouse
        x: 2
        y: 1
        realizes:
          - ingest
          - transform
        description: Auto Loader で到着ファイルを取得し、同じパイプラインの後続段で品質ルールを適用する。
        evidence:
          - type: doc
            ref: docs/reference-databricks.md#§9
        svc: databricks:lakeflow
      example-storage:
        label: Unity Catalog 管理 Delta テーブル
        kind: db
        tier: lakehouse
        x: 6
        y: 1
        realizes:
          - storage
        description: 管理テーブルの保存領域はカタログの設定に従う。
        evidence:
          - type: doc
            ref: docs/reference-databricks.md#§9
      example-catalog:
        label: Unity Catalog
        kind: service
        tier: lakehouse
        x: 10
        y: 1
        realizes:
          - catalog
        description: アクセス許可、データの名前空間、リネージを管理する。
        evidence:
          - type: doc
            ref: docs/reference-databricks.md#§9
        svc: databricks:unity
      example-query:
        label: Databricks サーバーレス SQL Warehouse
        kind: worker
        tier: lakehouse
        x: 14
        y: 1
        realizes:
          - query
        description: 注文集計を提供する。
        evidence:
          - type: doc
            ref: docs/reference-databricks.md#§9
        svc: databricks:sql
      example-serving:
        label: Databricks ダッシュボード
        kind: service
        tier: lakehouse
        x: 2
        y: 5
        realizes:
          - serving
        description: SQL Warehouse の集計を表示する。
        evidence:
          - type: doc
            ref: docs/reference-databricks.md#§9
        svc: databricks:sql
      example-sharing:
        label: OpenSharing の Share と Recipient
        kind: service
        tier: lakehouse
        x: 6
        y: 5
        realizes:
          - sharing
        description: Databricks が管理する OpenSharing の Share と Recipient を利用する。
        evidence:
          - type: doc
            ref: docs/reference-databricks.md#§9
        svc: databricks:platform
      example-ml:
        label: MLflow / モデルの追跡
        kind: service
        tier: lakehouse
        x: 10
        y: 5
        realizes:
          - ml
        description: 学習実験を追跡し、モデル版を Unity Catalog に登録する。
        evidence:
          - type: doc
            ref: docs/reference-databricks.md#§9
      example-iam:
        label: AWS IAM / ストレージ用ロール
        kind: service
        tier: lakehouse
        x: 27
        y: 1
        description: S3 の着地先にアクセスするための IAM ロール。
        evidence:
          - type: doc
            ref: docs/reference-databricks.md#§9
        svc: iam
      example-location:
        label: Unity Catalog / 外部ロケーション
        kind: policy
        svc: databricks:unity
        tier: lakehouse
        x: 14
        y: 5
        description: S3 の着地パスとストレージ認証情報を関連付ける設定。
        evidence:
          - type: doc
            ref: docs/reference-databricks.md#§9
      example-serving-model:
        label: Databricks Model Serving
        kind: service
        svc: databricks:modelserving
        tier: lakehouse
        x: 2
        y: 9
        description: 明示的に選択したモデル版をエンドポイントに配備する。
        evidence:
          - type: doc
            ref: docs/reference-databricks.md#§9
    links:
      - {id: example-pipeline-runtime, from: example-serverless, to: example-ingest, label: "Run pipeline", evidence: [{type: doc, ref: "docs/reference-databricks.md#§9"}]}
      - {id: example-query-runtime, from: example-serverless, to: example-query, label: "Run SQL warehouse", evidence: [{type: doc, ref: "docs/reference-databricks.md#§9"}]}
      - {id: example-table-storage, from: example-storage, to: example-managed-s3, label: "Store managed table files", evidence: [{type: doc, ref: "docs/reference-databricks.md#§9"}]}
      - {id: example-train-runtime, from: example-training, to: example-ml, label: "Run training and log model", evidence: [{type: doc, ref: "docs/reference-databricks.md#§9"}]}
      - id: example-role-location
        from: example-iam
        to: example-location
        label: ストレージ認証情報にロールを設定
        evidence:
          - type: doc
            ref: docs/reference-databricks.md#§9
      - id: example-location-access
        from: example-location
        to: example-source
        label: S3 パスへのアクセスを管理
        evidence:
          - type: doc
            ref: docs/reference-databricks.md#§9
      - id: example-model-deploy
        from: example-ml
        to: example-serving-model
        label: 選択したモデル版を配備
        evidence:
          - type: doc
            ref: docs/reference-databricks.md#§9
    groups:
      - {kind: cloud, provider: databricks, label: Databricks workspace, tier: lakehouse, nodes: [example-ingest, example-storage, example-catalog, example-query, example-serving, example-sharing, example-ml, example-location, example-serving-model, example-serverless]}
      - {kind: cloud, provider: aws, label: Customer AWS account, tier: lakehouse, nodes: [example-source, example-iam, example-managed-s3, example-training]}
    layout2d:
      tiers: [{id: diagram, label: Databricks on AWS, z: 0, size: [32, 15]}]
      nodes:
        example-ingest: {tier: diagram, x: 2, y: 1}
        example-storage: {tier: diagram, x: 6, y: 1}
        example-catalog: {tier: diagram, x: 10, y: 1}
        example-query: {tier: diagram, x: 14, y: 1}
        example-serving: {tier: diagram, x: 2, y: 5}
        example-sharing: {tier: diagram, x: 6, y: 5}
        example-ml: {tier: diagram, x: 10, y: 5}
        example-location: {tier: diagram, x: 14, y: 5}
        example-serving-model: {tier: diagram, x: 2, y: 9}
        example-serverless: {tier: diagram, x: 6, y: 9}
        example-source: {tier: diagram, x: 23, y: 1}
        example-iam: {tier: diagram, x: 27, y: 1}
        example-managed-s3: {tier: diagram, x: 23, y: 5}
        example-training: {tier: diagram, x: 27, y: 5}
      groups:
        - {kind: cloud, provider: databricks, label: Databricks workspace and serverless, tier: diagram, nodes: [example-ingest, example-storage, example-catalog, example-query, example-serving, example-sharing, example-ml, example-location, example-serving-model, example-serverless]}
        - {kind: cloud, provider: aws, label: Customer AWS account, tier: diagram, nodes: [example-source, example-iam, example-managed-s3, example-training]}
    layout3d:
      tiers:
        - {id: workspace, label: Workspace services, z: 1, size: [20, 6]}
        - {id: serverless, label: Serverless compute plane, z: 0, size: [20, 6]}
        - {id: customer, label: Customer AWS account, z: 0, origin: [23, 0], size: [16, 3]}
      nodes:
        example-ingest: {tier: workspace, x: 2, y: 1}
        example-storage: {tier: workspace, x: 6, y: 1}
        example-catalog: {tier: workspace, x: 10, y: 1}
        example-query: {tier: workspace, x: 14, y: 1}
        example-serving: {tier: workspace, x: 18, y: 1}
        example-sharing: {tier: workspace, x: 2, y: 4}
        example-ml: {tier: workspace, x: 6, y: 4}
        example-location: {tier: workspace, x: 10, y: 4}
        example-serving-model: {tier: workspace, x: 14, y: 4}
        example-serverless: {tier: serverless, x: 8, y: 1.5}
        example-source: {tier: customer, x: 2, y: 1.5}
        example-iam: {tier: customer, x: 6, y: 1.5}
        example-managed-s3: {tier: customer, x: 10, y: 1.5}
        example-training: {tier: customer, x: 14, y: 1.5}
      groups:
        - {kind: cloud, provider: databricks, label: Databricks workspace and serverless, tier: [workspace, serverless], nodes: [example-ingest, example-storage, example-catalog, example-query, example-serving, example-sharing, example-ml, example-location, example-serving-model, example-serverless]}
        - {kind: cloud, provider: aws, label: Customer AWS account, tier: customer, nodes: [example-source, example-iam, example-managed-s3, example-training]}
