      ex-catalog:
        label: 外部 Iceberg REST カタログ
        kind: service
        tier: input
        x: 5.2
        'y': 1.5
        description: Iceberg REST カタログは表メタデータとスコープを絞った短期認証情報を提供する。
        evidence:
          - type: doc
            ref: docs/reference-snowflake-iceberg-vended-credentials.md#§5
        realizes:
          - catalog
      ex-engine:
        label: Snowflake のクエリエンジン
        kind: worker
        tier: process
        x: 0
        'y': 1.5
        description: カタログを通じて対象テーブルを解決し、データを取得する。
        evidence:
          - type: doc
            ref: docs/reference-snowflake-iceberg-vended-credentials.md#§5
        realizes:
          - engine
        svc: snowflake:warehouse
      ex-volume:
        label: Snowflake の内部ボリューム
        kind: service
        tier: process
        x: 5.2
        'y': 1.5
        description: カタログ発行の認証情報を用いるテーブル単位の内部ボリューム。表のライフサイクルに関連付く。
        evidence:
          - type: doc
            ref: docs/reference-snowflake-iceberg-vended-credentials.md#§5
        realizes:
          - volume
      ex-credentials:
        label: vended credentials
        kind: file
        tier: process
        x: 10.4
        'y': 1.5
        description: 必要なスコープに限定された一時的なストレージ認証情報を取得し、期限に応じて更新する。
        evidence:
          - type: doc
            ref: docs/reference-snowflake-iceberg-vended-credentials.md#§5
        realizes:
