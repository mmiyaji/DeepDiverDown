        evidence:
          - type: doc
            ref: docs/reference-snowflake-iceberg-vended-credentials.md#§5
        realizes:
          - metadata
        svc: aws:s3
      ex-files:
        label: S3 の Iceberg データ
        kind: db
        tier: data
        x: 5.2
        'y': 1.5
        description: 認証情報を用いて Iceberg のデータファイルにアクセスする。
        evidence:
          - type: doc
            ref: docs/reference-snowflake-iceberg-vended-credentials.md#§5
        realizes:
          - files
        svc: aws:s3
    groups:
      - kind: cloud
        label: Snowflake のクエリ・認証処理（論理範囲）
        provider: snowflake
        tier:
          - process
        nodes:
          - ex-engine
          - ex-volume
          - ex-credentials
      - kind: cloud
        label: 顧客 AWS アカウント：S3
        provider: aws
        tier:
          - data
        nodes:
          - ex-metadata
          - ex-files
      - kind: datacenter
        label: 利用者が運用する外部カタログ（配置は説明用の仮定）
        provider: onprem
