name: DWH の合成データ生成と公開
description: 機微なデータから合成データを生成し、品質と開示リスクを評価してから公開する。合成データ自体はプライバシー保証ではない。
reference:
  objectives:
    - 生成候補と公開済みデータを区別する。
    - 品質と開示リスクの評価、公開承認を追う。
    - 差分プライバシーの保証を仮定しない。
  sources:
    - title: NIST 合成データと差分プライバシー
      url: https://www.nist.gov/blogs/cybersecurity-insights/differentially-private-synthetic-data
    - title: SDV Community
      url: https://docs.sdv.dev/sdv/explore/sdv-community
    - title: SDMetrics Privacy
      url: https://docs.sdv.dev/sdmetrics/data-metrics/privacy
sources:
  - docs/reference-dwh-synthetic-data.md
evidence:
  - type: doc
    ref: docs/reference-dwh-synthetic-data.md#§1
  - type: doc
    ref: docs/reference-dwh-synthetic-data.md#§3
tiers:
  - id: flow
    label: データの処理と提供
    z: 1
    size:
      - 32
      - 3
  - id: control
    label: 評価と管理
    z: 0
    size:
      - 24
      - 3
nodes:
  source:
    label: 制限された元データ
    kind: db
    tier: flow
    x: 0
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
  metadata:
    label: 列と制約の確認
    kind: service
    tier: flow
    x: 4
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
  train:
    label: 生成器の学習・生成
    kind: service
    tier: flow
    x: 8
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
  candidate:
    label: 非公開の生成候補
    kind: db
    tier: flow
    x: 12
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
  quality:
    label: 品質の評価
    kind: service
    tier: flow
    x: 16
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
  risk:
    label: 開示リスクの評価
    kind: service
    tier: control
    x: 8
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
  review:
    label: 公開の審査
    kind: actor
    tier: control
    x: 12
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
  release:
    label: 承認済み合成データ
    kind: db
    tier: flow
    x: 20
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
  consumer:
    label: 開発・分析担当者
    kind: actor
    tier: flow
    x: 24
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
links:
  - id: schema
    from: source
    to: metadata
    label: 列と制約を確認
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
  - id: configure
    from: metadata
    to: train
    label: 生成条件を設定
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
  - id: learn
    from: source
    to: train
    label: 元データから学習
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
  - id: generate
    from: train
    to: candidate
    label: 候補を生成
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
  - id: evaluate
    from: candidate
    to: quality
    label: 品質を検証
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
  - id: privacy
    from: candidate
    to: risk
    label: 開示リスクを検証
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
  - id: compare
    from: source
    to: risk
    label: 元データと比較
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
  - id: quality-review
    from: quality
    to: review
    label: 品質結果を報告
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
  - id: risk-review
    from: risk
    to: review
    label: リスクを報告
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
  - id: approve
    from: review
    to: release
    label: 公開を承認
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
  - id: publish
    from: candidate
    to: release
    label: 承認後に公開
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
  - id: use
    from: release
    to: consumer
    label: 検証データを利用
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
scenarios:
  - id: main-flow
    label: 処理の流れ
    evidence:
      - type: doc
        ref: docs/reference-dwh-synthetic-data.md#§2
    steps:
      - links:
          - schema
          - configure
          - learn
        note: 権限を制限した環境で元データと制約を確認し生成器を学習する。
      - links:
          - generate
          - evaluate
          - privacy
          - compare
        note: 候補を非公開で保管し品質と開示リスクを評価する。
      - links:
          - quality-review
          - risk-review
          - approve
          - publish
        note: 用途と残存リスクを審査し承認後に公開する。
      - links:
          - use
        note: 提供先で検証に利用する。
implementations:
  - id: example
    label: BigQuery と Cloud Run Jobs 上の SDV
    description: BigQuery の元・候補・公開テーブルと Cloud Run Jobs 上の SDV / SDMetrics を使う例。公開は人が審査する。
    sources:
      - title: NIST 合成データと差分プライバシー
        url: https://www.nist.gov/blogs/cybersecurity-insights/differentially-private-synthetic-data
      - title: SDV Community
        url: https://docs.sdv.dev/sdv/explore/sdv-community
      - title: SDMetrics Privacy
        url: https://docs.sdv.dev/sdmetrics/data-metrics/privacy
      - title: Cloud Run jobs
        url: https://docs.cloud.google.com/run/docs/create-jobs
      - title: Cloud Run jobs service identity
        url: https://docs.cloud.google.com/run/docs/configuring/jobs/service-identity
    tiers:
      - id: flow
        label: 元データと生成
        z: 2
        size:
          - 14
          - 3
      - id: control
        label: 評価と審査
        z: 1
        size:
          - 14
          - 3
      - id: delivery
        label: 提供
        z: 0
        size:
          - 14
          - 3
    nodes:
      ex-engine: {label: BigQuery managed service, svc: "gcp:bigquery", kind: service, tier: control, x: 16, y: 1, evidence: [{type: doc, ref: "docs/reference-dwh-synthetic-data.md#§4"}]}
      ex-service-account: {label: Cloud Run job service account, kind: policy, tier: control, x: 18, y: 1, evidence: [{type: doc, ref: "docs/reference-dwh-synthetic-data.md#§4"}]}
      ex-release-operator: {label: Authorized release operator, kind: actor, tier: delivery, x: -5, y: 1, evidence: [{type: doc, ref: "docs/reference-dwh-synthetic-data.md#§4"}]}
      ex-source:
        label: BigQuery 元テーブル
        kind: db
        tier: flow
        x: 0
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-dwh-synthetic-data.md#§4
        realizes:
          - source
      ex-metadata:
        label: SDV Metadata
        kind: service
        tier: flow
        x: 4
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-dwh-synthetic-data.md#§4
        realizes:
          - metadata
      ex-train:
        label: SDV Gaussian Copula 生成器
        kind: service
        tier: flow
        x: 8
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-dwh-synthetic-data.md#§4
        realizes:
          - train
      ex-candidate:
        label: BigQuery / 非公開の生成候補
        kind: db
        tier: flow
        x: 12
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-dwh-synthetic-data.md#§4
        realizes:
          - candidate
        description: 公開先とは権限を分けた候補用データセットに保持する。
      ex-quality:
        label: SDMetrics 品質評価
        kind: service
        tier: control
        x: 4
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-dwh-synthetic-data.md#§4
        realizes:
          - quality
      ex-risk:
        label: SDMetrics 等のリスク評価
        kind: service
        tier: control
        x: 8
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-dwh-synthetic-data.md#§4
        realizes:
          - risk
      ex-review:
        label: 公開審査担当者
        kind: actor
        tier: control
        x: -5
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-dwh-synthetic-data.md#§4
        realizes:
          - review
      ex-release:
        label: BigQuery 合成テーブル
        kind: db
        tier: delivery
        x: 8
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-dwh-synthetic-data.md#§4
        realizes:
          - release
      ex-consumer:
        label: 開発・分析担当者
        kind: actor
        tier: delivery
        x: -5
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-dwh-synthetic-data.md#§4
        realizes:
          - consumer
      ex-run:
        label: Cloud Run Jobs / Python
        svc: gcp:cloudrun
        kind: service
        tier: control
        x: 0
        'y': 1.5
        description: SDV と SDMetrics を含むコンテナーをバッチ実行する。BigQuery のアクセスはサービスアカウントに付与する。
        evidence:
          - type: doc
            ref: docs/reference-dwh-synthetic-data.md#§4
    links:
      - {id: synthetic-job-identity, from: ex-service-account, to: ex-run, label: "Authenticate job to BigQuery", evidence: [{type: doc, ref: "docs/reference-dwh-synthetic-data.md#§4"}]}
      - {id: synthetic-bigquery, from: ex-run, to: ex-engine, label: "Read source and write candidate", evidence: [{type: doc, ref: "docs/reference-dwh-synthetic-data.md#§4"}]}
      - {id: synthetic-release-operator, from: ex-release-operator, to: ex-release, label: "Publish approved candidate", evidence: [{type: doc, ref: "docs/reference-dwh-synthetic-data.md#§4"}]}
      - id: synthetic-run-train
        from: ex-run
        to: ex-train
        label: 生成処理を実行
        evidence:
          - type: doc
            ref: docs/reference-dwh-synthetic-data.md#§4
      - id: synthetic-run-quality
        from: ex-run
        to: ex-quality
        label: 品質評価を実行
        evidence:
          - type: doc
            ref: docs/reference-dwh-synthetic-data.md#§4
      - id: synthetic-run-risk
        from: ex-run
        to: ex-risk
        label: リスク評価を実行
        evidence:
          - type: doc
            ref: docs/reference-dwh-synthetic-data.md#§4
    groups:
      - {kind: cloud, provider: gcp, label: Google Cloud project, tier: [flow, control, delivery], nodes: [ex-source, ex-metadata, ex-train, ex-candidate, ex-quality, ex-risk, ex-release, ex-run, ex-engine, ex-service-account]}
    layout2d:
      tiers: [{id: diagram, label: Synthetic data generation and review, z: 0, size: [31, 15]}]
      nodes:
        ex-source: {tier: diagram, x: 4, y: 1}
        ex-metadata: {tier: diagram, x: 8, y: 1}
        ex-train: {tier: diagram, x: 8, y: 5}
        ex-candidate: {tier: diagram, x: 12, y: 1}
        ex-quality: {tier: diagram, x: 12, y: 5}
        ex-risk: {tier: diagram, x: 16, y: 5}
        ex-review: {tier: diagram, x: 0, y: 1}
        ex-release: {tier: diagram, x: 16, y: 1}
        ex-consumer: {tier: diagram, x: 0, y: 5}
        ex-run: {tier: diagram, x: 4, y: 5}
        ex-engine: {tier: diagram, x: 20, y: 5}
        ex-service-account: {tier: diagram, x: 24, y: 5}
        ex-release-operator: {tier: diagram, x: 0, y: 9}
      groups:
        - {kind: cloud, provider: gcp, label: Google Cloud project, tier: diagram, nodes: [ex-source, ex-metadata, ex-train, ex-candidate, ex-quality, ex-risk, ex-release, ex-run, ex-engine, ex-service-account]}
        - {kind: cluster, label: Cloud Run job container, tier: diagram, nodes: [ex-run, ex-train, ex-quality, ex-risk]}
    layout3d:
      tiers:
        - {id: job, label: SDV and SDMetrics, z: 1, size: [12, 3]}
        - {id: runtime, label: Cloud Run job, z: 0, size: [12, 3]}
        - {id: data, label: BigQuery and access, z: 0, origin: [15, 0], size: [20, 3]}
        - {id: users, label: Review and release, kind: origin, z: 0, origin: [-6, 0], size: [4, 3]}
      nodes:
        ex-source: {tier: data, x: 2, y: 1.5}
        ex-metadata: {tier: data, x: 5, y: 1.5}
        ex-train: {tier: job, x: 2, y: 1.5}
        ex-candidate: {tier: data, x: 8, y: 1.5}
        ex-quality: {tier: job, x: 6, y: 1.5}
        ex-risk: {tier: job, x: 10, y: 1.5}
        ex-review: {tier: users, x: 0, y: 1.5}
        ex-release: {tier: data, x: 11, y: 1.5}
        ex-consumer: {tier: users, x: 1, y: 1.5}
        ex-run: {tier: runtime, x: 6, y: 1.5}
        ex-engine: {tier: data, x: 14, y: 1.5}
        ex-service-account: {tier: data, x: 17, y: 1.5}
        ex-release-operator: {tier: users, x: 2, y: 1.5}
      groups:
        - {kind: cloud, provider: gcp, label: Google Cloud project, tier: [job, runtime, data], nodes: [ex-source, ex-metadata, ex-train, ex-candidate, ex-quality, ex-risk, ex-release, ex-run, ex-engine, ex-service-account]}
        - {kind: cluster, label: Cloud Run job, tier: [job, runtime], nodes: [ex-run, ex-train, ex-quality, ex-risk]}
