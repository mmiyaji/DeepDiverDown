name: Trino の基本アーキテクチャ
description: Coordinator・Worker・カタログ・Connector・クライアントの役割と、SQL が結果になるまでのデータの流れ。
reference:
  objectives:
    - Coordinator と Worker の役割を区別する。
    - カタログ、Connector、メタストア、データソースの関係を説明する。
    - SQL が計画され、Worker が読み、結果が返るまでの流れを追う。
  sources:
    - title: Trino · Use cases
      url: https://trino.io/docs/current/overview/use-cases.html
    - title: Trino · Concepts
      url: https://trino.io/docs/current/overview/concepts.html
    - title: Trino · Deploying Trino
      url: https://trino.io/docs/current/installation/deployment.html
    - title: Trino · Client protocol
      url: https://trino.io/docs/current/client/client-protocol.html
    - title: Trino · Iceberg connector
      url: https://trino.io/docs/current/connector/iceberg.html
sources:
  - docs/reference-trino.md
evidence:
  - type: doc
    ref: docs/reference-trino.md#§1
tiers:
  - id: flow
    label: クエリの流れ
    z: 0
    size: [20, 6]
nodes:
  client:
    label: クライアント（CLI・JDBC など）
    kind: client
    tier: flow
    x: 0
    'y': 1.5
    replicas: 2
    description: SQL を Coordinator に送り、結果を受け取る。
    evidence:
      - { type: doc, ref: "docs/reference-trino.md#§4" }
  coordinator:
    label: Coordinator
    kind: service
    tier: flow
    x: 5
    'y': 1.5
    replicas: 1
    description: SQL を解析して計画を作り、Worker を管理して実行を調整する。クライアントの接続先。
    evidence:
      - { type: doc, ref: "docs/reference-trino.md#§2" }
  worker:
    label: Worker
    kind: worker
    tier: flow
    x: 10
    'y': 1.5
    parallel: 'N'
    description: Task を実行してデータを処理する。起動時に Coordinator へ登録し、ハートビートを送る。
    evidence:
      - { type: doc, ref: "docs/reference-trino.md#§2" }
      - { type: doc, ref: "docs/reference-trino.md#§5" }
  catalog:
    label: カタログ設定
    kind: file
    tier: flow
    x: 5
    'y': 4.5
    replicas: 2
    description: etc/catalog/<名前>.properties。connector.name と接続情報を持つ。
    evidence:
      - { type: doc, ref: "docs/reference-trino.md#§3" }
  connector:
    label: Connector
    kind: service
    tier: flow
    x: 10
    'y': 4.5
    replicas: 2
    description: データソースへのアダプター（Coordinator と各 Worker が読み込む）。メタデータ、Split、データの読み出しを担う。
    evidence:
      - { type: doc, ref: "docs/reference-trino.md#§3" }
  metastore:
    label: メタストア
    kind: catalog
    tier: flow
    x: 16
    'y': 0.5
    replicas: 2
    description: テーブルの定義とメタデータの位置を持つ。Iceberg Connector は Hive metastore・Glue・JDBC・REST などを選ぶ。
    evidence:
      - { type: doc, ref: "docs/reference-trino.md#§3" }
  source:
    label: データソース
    kind: db
    tier: flow
    x: 16
    'y': 4.5
    replicas: 2
    description: Trino の外にあるデータ。オブジェクトストレージや RDB など。
    evidence:
      - { type: doc, ref: "docs/reference-trino.md#§1" }
links:
  - id: submit
    from: client
    to: coordinator
    label: SQL を送る
    sync: true
    timeoutMs: 60000
    evidence: [{ type: doc, ref: "docs/reference-trino.md#§4" }]
  - id: register
    from: worker
    to: coordinator
    label: 登録とハートビート
    evidence: [{ type: doc, ref: "docs/reference-trino.md#§2" }]
  - id: assign
    from: coordinator
    to: worker
    label: Task と Split を割り当てる
    evidence: [{ type: doc, ref: "docs/reference-trino.md#§4" }]
  - id: configure
    from: catalog
    to: connector
    label: Connector を構成
    evidence: [{ type: doc, ref: "docs/reference-trino.md#§3" }]
  - id: resolve
    from: connector
    to: metastore
    label: テーブルのメタデータを解決
    evidence: [{ type: doc, ref: "docs/reference-trino.md#§3" }]
  - id: list-splits
    from: connector
    to: source
    label: メタデータを読み Split を列挙
    evidence: [{ type: doc, ref: "docs/reference-trino.md#§4" }]
  - id: read
    from: worker
    to: source
    label: Split のデータを読む
    evidence: [{ type: doc, ref: "docs/reference-trino.md#§4" }]
  - id: collect
    from: worker
    to: coordinator
    label: 結果を渡す
    evidence: [{ type: doc, ref: "docs/reference-trino.md#§4" }]
  - id: return
    from: coordinator
    to: client
    label: 結果を返す
    evidence: [{ type: doc, ref: "docs/reference-trino.md#§4" }]
scenarios:
  - id: query-flow
    label: SQL が結果になるまで
    evidence: [{ type: doc, ref: "docs/reference-trino.md#§4" }]
    steps:
      - links: [register]
        note: Worker は起動時に Coordinator の discovery へ登録し、ハートビートで登録を保つ。
      - links: [submit, configure]
        note: クライアントが SQL を送る。Coordinator はカタログ設定で構成された Connector を使う。
      - links: [resolve, list-splits]
        note: Connector がメタデータを解決し、読み取り単位（Split）を列挙する。
      - links: [assign, read]
        note: Coordinator が Worker に Task と Split を割り当て、Worker が Connector を通してデータを読む。
      - links: [collect, return]
        note: 結果が Coordinator 経由でクライアントに返る（direct protocol の場合）。
gates: { maxDrift: 0, maxHigh: 1 }   # Coordinator 1 台構成（公式の構成どおり）の指摘のみ許容
unknowns:
  - id: UNK-01
    text: Coordinator の冗長化（複数台構成）は今回確認した資料の範囲では記載を確認していない。図では 1 台とする。
    refs: [coordinator]
  - id: UNK-02
    text: 実装例の台数、ノードサイズ、ネットワーク経路、Trino・EKS のバージョン互換性は資料で指定されていない。
    refs: [coordinator, worker]
implementations:
  - id: trino-iceberg
    label: EKS 上の Trino・Glue Catalog・S3
    description: EKS の EC2 ノード上で Trino Coordinator / Worker を実行し、Glue Data Catalog と S3 上の Iceberg を読む構成例。
    sources:
      - title: Trino · Concepts
        url: https://trino.io/docs/current/overview/concepts.html
      - title: Trino · Iceberg connector
        url: https://trino.io/docs/current/connector/iceberg.html
      - title: Trino file system support
        url: https://trino.io/docs/current/object-storage/file-system-s3.html
      - title: Trino on Kubernetes with Helm
        url: https://trino.io/docs/current/installation/kubernetes.html
      - title: Amazon EKS managed node groups
        url: https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html
      - title: IAM roles for service accounts
        url: https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html
    tiers:
      - id: entry
        label: 利用者
        kind: origin
        z: 2
        size:
          - 18
          - 3
      - id: control-plane
        label: AWS の管理・認証
        z: 1
        size:
          - 18
          - 3
      - id: processing
        label: EKS の Trino 実行
        z: 0
        size:
          - 18
          - 3
      - id: storage
        label: テーブルの保存
        z: -1
        size:
          - 18
          - 3
    nodes:
      trino-iceberg-client:
        label: Trino CLI
        kind: client
        tier: entry
        x: 1
        'y': 1.5
        realizes:
          - client
        description: SQL を送り、結果を取得する。
        evidence:
          - type: doc
            ref: docs/reference-trino.md#§6
      trino-iceberg-coordinator:
        svc: oss:trino
        label: Trino Coordinator Pod
        kind: service
        tier: processing
        x: 3
        'y': 1.5
        realizes:
          - coordinator
          - catalog
          - connector
        description: Iceberg Connector とカタログ設定を持つ Coordinator が Glue に問い合わせ、分散クエリを計画する。
        evidence:
          - type: doc
            ref: docs/reference-trino.md#§6
        management: {type: customer, scope: "利用者が Trino とカタログ設定、SQL アクセスを管理する。"}
      trino-iceberg-workers:
        svc: oss:trino
        label: Trino Worker Pods
        kind: worker
        tier: processing
        x: 9
        'y': 1.5
        realizes:
          - worker
          - connector
        description: EC2 ノード上の Worker Pod が S3 のファイルを並列に読み、集計する。
        evidence:
          - type: doc
            ref: docs/reference-trino.md#§6
        management: {type: customer, scope: "利用者が Trino の配置、容量と更新を管理する。"}
      trino-iceberg-data:
        label: S3 / Iceberg テーブル
        kind: db
        tier: storage
        x: 9
        'y': 1.5
        svc: s3
        realizes:
          - source
        description: スナップショットが参照する物理ファイルを保持する。
        evidence:
          - type: doc
            ref: docs/reference-trino.md#§6
        management: {type: shared, scope: "AWS が S3 基盤を運用し、利用者がデータと権限を管理する。"}
      trino-iceberg-glue:
        label: AWS Glue Data Catalog
        kind: catalog
        tier: control-plane
        x: 3
        'y': 1.5
        description: テーブルのメタデータ位置を提供する。
        evidence:
          - type: doc
            ref: docs/reference-trino.md#§6
        svc: glue
        realizes:
          - metastore
        management: {type: shared, scope: "AWS が Glue 基盤を運用し、利用者がカタログと権限を管理する。"}
      trino-iceberg-eks:
        label: Amazon EKS / Kubernetes API
        svc: eks
        kind: service
        tier: control-plane
        x: 9
        'y': 1.5
        description: Kubernetes の制御プレーンが Trino の Pod 配置を管理する。
        evidence:
          - type: doc
            ref: docs/reference-trino.md#§6
        management: {type: shared, scope: "AWS が制御プレーンを運用し、利用者が Kubernetes API とクラスタ設定を操作する。"}
      trino-iceberg-ec2:
        label: EC2 / EKS ノードグループ
        svc: ec2
        kind: host
        tier: processing
        x: 15
        'y': 1.5
        description: マネージドノードグループの EC2 が Coordinator と Worker の Pod を実行する。
        evidence:
          - type: doc
            ref: docs/reference-trino.md#§6
        management: {type: shared, scope: "AWS が EC2 基盤を運用し、利用者がノードグループと更新を管理する。"}
      trino-iceberg-iam:
        label: IAM / Pod 用ロール
        svc: iam
        kind: policy
        tier: control-plane
        x: 15
        'y': 1.5
        description: サービスアカウントに対応する IAM ロールで Glue と S3 へのアクセス権を付与する。
        evidence:
          - type: doc
            ref: docs/reference-trino.md#§6
        management: {type: customer, scope: "利用者がサービスアカウントと IAM ロール・ポリシーを設定する。"}
    links:
      - {id: trino-host-coordinator, from: trino-iceberg-ec2, to: trino-iceberg-coordinator, label: Coordinator Pod を実行}
      - id: trino-glue
        from: trino-iceberg-coordinator
        to: trino-iceberg-glue
        label: テーブル情報を取得
        evidence:
          - type: doc
            ref: docs/reference-trino.md#§6
      - id: trino-eks-schedule
        from: trino-iceberg-eks
        to: trino-iceberg-workers
        label: Worker Pod を配置
        evidence:
          - type: doc
            ref: docs/reference-trino.md#§6
      - id: trino-ec2-runtime
        from: trino-iceberg-ec2
        to: trino-iceberg-workers
        label: Pod を実行
        evidence:
          - type: doc
            ref: docs/reference-trino.md#§6
      - id: trino-iam-role
        from: trino-iceberg-iam
        to: trino-iceberg-coordinator
        label: AWS アクセス権を付与
        evidence:
          - type: doc
            ref: docs/reference-trino.md#§6
      - id: trino-iam-workers
        from: trino-iceberg-iam
        to: trino-iceberg-workers
        label: S3 読み取り権限を付与
        evidence:
          - type: doc
            ref: docs/reference-trino.md#§6
    groups:
      - kind: cloud
        label: AWS アカウント
        provider: aws
        tier:
          - control-plane
          - processing
          - storage
        nodes:
          - trino-iceberg-glue
          - trino-iceberg-eks
          - trino-iceberg-iam
          - trino-iceberg-coordinator
          - trino-iceberg-workers
          - trino-iceberg-ec2
          - trino-iceberg-data
      - kind: cluster
        label: EKS クラスタ / Trino
        tier:
          - processing
        nodes:
          - trino-iceberg-coordinator
          - trino-iceberg-workers
          - trino-iceberg-ec2

    layout2d:
      tiers:
        - {id: diagram, label: AWS 上の Trino, z: 0, size: [25, 13]}
      nodes:
        trino-iceberg-client: {tier: diagram, x: 1, y: 2}
        trino-iceberg-eks: {tier: diagram, x: 4.5, y: 2}
        trino-iceberg-ec2: {tier: diagram, x: 11, y: 2}
        trino-iceberg-coordinator: {tier: diagram, x: 9, y: 6}
        trino-iceberg-workers: {tier: diagram, x: 13, y: 6}
        trino-iceberg-iam: {tier: diagram, x: 7, y: 10}
        trino-iceberg-glue: {tier: diagram, x: 19, y: 3}
        trino-iceberg-data: {tier: diagram, x: 19, y: 8}
      groups:
        - {kind: cloud, label: AWS アカウント, provider: aws, tier: [diagram], x0: 2.8, y0: -0.3, x1: 22, y1: 12, nodes: [trino-iceberg-eks, trino-iceberg-ec2, trino-iceberg-coordinator, trino-iceberg-workers, trino-iceberg-iam, trino-iceberg-glue, trino-iceberg-data]}
        - {kind: vpc, label: EKS ワーカーの利用者 VPC, provider: aws, tier: [diagram], x0: 6.8, y0: 0.7, x1: 15.5, y1: 8.5, nodes: [trino-iceberg-ec2, trino-iceberg-coordinator, trino-iceberg-workers]}
        - {kind: cluster, label: EKS クラスター（ワーカー側）, provider: k8s, tier: [diagram], x0: 6.8, y0: 0.7, x1: 15.5, y1: 8.5, nodes: [trino-iceberg-ec2, trino-iceberg-coordinator, trino-iceberg-workers]}
        - {kind: namespace, label: Trino 名前空間, provider: k8s, tier: [diagram], x0: 6.8, y0: 4.2, x1: 15.5, y1: 8.5, nodes: [trino-iceberg-coordinator, trino-iceberg-workers]}
    layout3d:
      tiers:
        - {id: client, label: Trino CLI, kind: origin, z: 0, origin: [-5, 0], size: [3, 5]}
        - {id: platform, label: EKS 実行ノード, z: 0, size: [10, 5]}
        - {id: pods, label: Trino Pods, z: 1, size: [10, 5]}
        - {id: services, label: AWS 管理サービス, z: 0, origin: [14, 0], size: [16, 5]}
      nodes:
        trino-iceberg-client: {tier: client, x: 1, y: 2}
        trino-iceberg-ec2: {tier: platform, x: 5, y: 2}
        trino-iceberg-coordinator: {tier: pods, x: 2, y: 2}
        trino-iceberg-workers: {tier: pods, x: 7, y: 2}
        trino-iceberg-eks: {tier: services, x: 2, y: 2}
        trino-iceberg-iam: {tier: services, x: 6, y: 2}
        trino-iceberg-glue: {tier: services, x: 10, y: 2}
        trino-iceberg-data: {tier: services, x: 14, y: 2}
      groups:
        - {kind: cloud, label: AWS アカウント, provider: aws, tier: [platform, pods, services], nodes: [trino-iceberg-eks, trino-iceberg-ec2, trino-iceberg-coordinator, trino-iceberg-workers, trino-iceberg-iam, trino-iceberg-glue, trino-iceberg-data]}
        - {kind: vpc, label: EKS ワーカーの利用者 VPC, provider: aws, tier: [platform, pods], nodes: [trino-iceberg-ec2, trino-iceberg-coordinator, trino-iceberg-workers]}
        - {kind: cluster, label: EKS クラスター（ワーカー側）, provider: k8s, tier: [platform, pods], nodes: [trino-iceberg-ec2, trino-iceberg-coordinator, trino-iceberg-workers]}
        - {kind: namespace, label: Trino 名前空間, provider: k8s, tier: [pods], nodes: [trino-iceberg-coordinator, trino-iceberg-workers]}
