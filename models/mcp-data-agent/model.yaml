      ex-tools-host: {label: 利用者管理の MCP ツール実行基盤, kind: host, tier: data, x: 3, y: 2, description: 指標と文書検索ツールを実行する。具体的な実行基盤は未選定。, evidence: [{type: doc, ref: docs/reference-mcp-data-agent.md#§3}]}
