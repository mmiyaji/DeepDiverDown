name: "Microsoft Fabric の基本アーキテクチャ"
description: "受注データを OneLake に置き、Lakehouse の Delta テーブルを SQL と Power BI で利用します。"
reference:
  objectives: ["OneLake、Lakehouse、Spark、SQL 分析エンドポイントの役割を区別する。", "一つの Delta テーブルを更新と分析で共有する流れを追う。"]
  sources:
    - {"title": "Microsoft Learn · Microsoft Fabric", "url": "https://learn.microsoft.com/en-us/fabric/fundamentals/microsoft-fabric-overview"}
    - {"title": "Microsoft Learn · OneLake", "url": "https://learn.microsoft.com/en-us/fabric/onelake/onelake-overview"}
    - {"title": "Microsoft Learn · SQL analytics endpoint", "url": "https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sql-analytics-endpoint"}
    - {title: Microsoft Learn · Fabric Lakehouse, url: "https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-overview"}
    - {title: Microsoft Learn · OneLake catalog, url: "https://learn.microsoft.com/en-us/fabric/governance/onelake-catalog-overview"}
sources: [docs/reference-microsoft-fabric.md]
evidence: [{"type": "doc", "ref": "docs/reference-microsoft-fabric.md#§1"}]
tiers:
  - {id: flow, label: データと処理, z: 0, size: [16, 5]}
nodes:
  source: {"label": "受注データ", "kind": "external", "tier": "flow", "x": 0, "y": 3, "description": "取り込み元。", "evidence": [{"type": "doc", "ref": "docs/reference-microsoft-fabric.md#§2"}]}
  pipeline: {"label": "取込パイプライン", "kind": "service", "tier": "flow", "x": 4, "y": 3, "description": "受注ファイルをコピーする。", "evidence": [{"type": "doc", "ref": "docs/reference-microsoft-fabric.md#§2"}]}
  files: {"label": "取込ファイルの保管領域", "kind": "db", "tier": "flow", "x": 8, "y": 3, "description": "受注ファイルを置く。", "evidence": [{"type": "doc", "ref": "docs/reference-microsoft-fabric.md#§2"}]}
  spark: {"label": "データ変換ノートブック", "kind": "worker", "tier": "flow", "x": 12, "y": 3, "description": "型や欠損値を確認する。", "evidence": [{"type": "doc", "ref": "docs/reference-microsoft-fabric.md#§2"}]}
  delta: {"label": "分析用の Delta テーブル", "kind": "db", "tier": "flow", "x": 16, "y": 3, "description": "分析用明細を保持する。", "evidence": [{"type": "doc", "ref": "docs/reference-microsoft-fabric.md#§1"}]}
  sql: {"label": "SQL 読み取り口", "kind": "service", "tier": "flow", "x": 12, "y": 0, "description": "Delta テーブルの読み取り口。", "evidence": [{"type": "doc", "ref": "docs/reference-microsoft-fabric.md#§3"}]}
  bi: {"label": "BI レポート", "kind": "client", "tier": "flow", "x": 8, "y": 0, "description": "集計結果を可視化する。", "evidence": [{"type": "doc", "ref": "docs/reference-microsoft-fabric.md#§3"}]}
  catalog: {label: "データ資産カタログ", kind: service, tier: flow, x: 16, y: 0, drill: fabric-onelake-catalog, description: "分析資産を検索して管理状況を調べる。", evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§4}]}
links:
  - {"id": "extract", "from": "source", "to": "pipeline", "label": "受注データを取得", "evidence": [{"type": "doc", "ref": "docs/reference-microsoft-fabric.md#§2"}]}
  - {"id": "copy", "from": "pipeline", "to": "files", "label": "着地領域にファイルをコピー", "evidence": [{"type": "doc", "ref": "docs/reference-microsoft-fabric.md#§2"}]}
  - {"id": "load", "from": "files", "to": "spark", "label": "取り込んだデータを読む", "evidence": [{"type": "doc", "ref": "docs/reference-microsoft-fabric.md#§2"}]}
  - {"id": "write", "from": "spark", "to": "delta", "label": "Delta テーブルに書く", "evidence": [{"type": "doc", "ref": "docs/reference-microsoft-fabric.md#§2"}]}
  - {"id": "read", "from": "delta", "to": "sql", "label": "明細を SQL で読む", "evidence": [{"type": "doc", "ref": "docs/reference-microsoft-fabric.md#§3"}]}
  - {"id": "report", "from": "sql", "to": "bi", "label": "売上を表示", "evidence": [{"type": "doc", "ref": "docs/reference-microsoft-fabric.md#§3"}]}
  - {id: discover, from: catalog, to: delta, label: "レイクハウスの資産を検索", evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§4}]}
scenarios:
  - id: report-sales
    label: "受注データから売上レポートへ"
    evidence: [{"type": "doc", "ref": "docs/reference-microsoft-fabric.md#§1"}]
    steps:
      - {"links": ["extract", "copy"], "note": "Fabric のパイプラインで受注ファイルを OneLake に取り込む。"}
      - {"links": ["load", "write"], "note": "Spark で受注を整え、分析用 Delta テーブルに書き込む。"}
      - {"links": ["read"], "note": "SQL 分析エンドポイントが Delta テーブルから売上を集計する。"}
      - {"links": ["report"], "note": "Power BI が SQL 接続経由で集計結果を表示する。"}
  - id: discover-asset
    label: カタログから Lakehouse を探して利用する
    evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§4}]
    steps:
      - {links: [discover], note: OneLake catalog で目的の Lakehouse を探し、発見可能性と権限を確認する。}
      - {links: [read, report], note: 読み取り権限のあるデータから売上を集計する。}

implementations:
  - id: fabric-lakehouse
    label: "Microsoft Fabric の注文レイクハウス"
    description: "Fabric の同一ワークスペースに取込パイプライン、Lakehouse、ノートブック、Power BI レポートを置く例。"
    sources:
      - {title: "Microsoft Learn · Microsoft Fabric", url: "https://learn.microsoft.com/en-us/fabric/fundamentals/microsoft-fabric-overview"}
      - {title: "Microsoft Learn · OneLake", url: "https://learn.microsoft.com/en-us/fabric/onelake/onelake-overview"}
      - {title: "Microsoft Learn · SQL analytics endpoint", url: "https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sql-analytics-endpoint"}
      - {title: "Microsoft Learn · Fabric Lakehouse", url: "https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-overview"}
      - {title: "Microsoft Learn · OneLake catalog", url: "https://learn.microsoft.com/en-us/fabric/governance/onelake-catalog-overview"}
      - {title: "Fabric の Copy activity", url: "https://learn.microsoft.com/en-us/fabric/data-factory/copy-data-activity"}
      - {title: "Power BI セマンティックモデルの作成", url: "https://learn.microsoft.com/en-us/fabric/data-warehouse/create-semantic-model"}
    tiers:
      - {id: "flow", label: "データと処理", z: 0, size: [16,5]}
      - {id: "implementation-setup", label: "実装時の設定・観測", z: 1, size: [8,3]}
    nodes:
      example-source: {label: "受注 CSV の外部保存先", kind: "file", tier: "flow", x: 0, y: 3, realizes: ["source"], description: "取込接続からファイルを読み出す。", evidence: [{"type":"doc","ref":"docs/reference-microsoft-fabric.md#§5"}]}
      example-pipeline: {label: "Fabric Data Factory の Copy activity", kind: "workflow", tier: "flow", x: 4, y: 3, realizes: ["pipeline"], description: "原本ファイルを OneLake の Lakehouse にコピーする。", evidence: [{"type":"doc","ref":"docs/reference-microsoft-fabric.md#§5"}]}
      example-files: {label: "OneLake の Lakehouse Files と Tables", kind: "table", tier: "flow", x: 8, y: 3, realizes: ["files","delta"], description: "原本ファイルは Files、整備済み Delta は Tables に分ける。", evidence: [{"type":"doc","ref":"docs/reference-microsoft-fabric.md#§5"}]}
      example-spark: {label: "Fabric Spark ノートブック", kind: "worker", tier: "flow", x: 12, y: 3, realizes: ["spark"], description: "型変換や品質チェックを行い、分析用 Delta を書き込む。", evidence: [{"type":"doc","ref":"docs/reference-microsoft-fabric.md#§5"}]}
      example-sql: {label: "Lakehouse SQL 分析エンドポイント", kind: "service", tier: "flow", x: 12, y: 0, realizes: ["sql"], description: "Lakehouse のテーブルを読み取り専用 SQL で提供する。", evidence: [{"type":"doc","ref":"docs/reference-microsoft-fabric.md#§5"}]}
      example-bi: {label: "Power BI 受注レポート", kind: "client", tier: "flow", x: 8, y: 0, realizes: ["bi"], description: "公開されたセマンティックモデルの指標を表示する。", evidence: [{"type":"doc","ref":"docs/reference-microsoft-fabric.md#§5"}]}
      example-catalog: {label: "OneLake カタログ", kind: "catalog", tier: "flow", x: 16, y: 0, realizes: ["catalog"], description: "Lakehouse などの資産を確認する。", evidence: [{"type":"doc","ref":"docs/reference-microsoft-fabric.md#§5"}]}
      example-semantic: {label: "Power BI セマンティックモデル", kind: "table", tier: "implementation-setup", x: 1, y: 1.5, description: "注文日と売上のリレーション・指標を定義し、レポートで共有する。", evidence: [{"type":"doc","ref":"docs/reference-microsoft-fabric.md#§5"}]}
    links:
      - {id: "example-semantic-source", from: "example-sql", to: "example-semantic", label: "モデルで使うテーブルを公開", evidence: [{"type":"doc","ref":"docs/reference-microsoft-fabric.md#§5"}]}
      - {id: "example-semantic-connection", from: "example-semantic", to: "example-bi", label: "定義済み指標を提供", evidence: [{"type":"doc","ref":"docs/reference-microsoft-fabric.md#§5"}]}
