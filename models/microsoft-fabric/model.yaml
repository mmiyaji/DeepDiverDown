: 4, realizes: [lakehouse], description: Files に原本、Tables に Delta を置く。, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§7}]}, i-spark: {svc: fabric:notebook, label: Fabric Spark ノートブック, kind: worker, tier: flow, x: 4, 'y': 7.5, realizes: [spark], description: Microsoft 管理の Spark で実行する。利用者はノートブックと容量を設定し、内部ホストは操作しない。, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§7}]}, i-warehouse: {svc: fabric:platform, label: Fabric Warehouse, kind: service, tier: flow, x: 12, 'y': 7.5, realizes: [warehouse], description: T-SQL の書き込みを受ける。内部の計算ノードは操作しない。, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§7}]}, i-onelake: {svc: fabric:lakehouse, label: OneLake, kind: db, tier: flow, x: 12, 'y': 4, realizes: [onelake], description: 各項目の Delta Parquet を保持する。, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§7}]}, i-sqlep: {svc: fabric:platform, label: Lakehouse SQL 分析エンドポイント, kind: service, tier: flow, x: 12, 'y': 0.5, realizes: [sqlep], description: Microsoft 管理。利用者は SQL と権限を設定する。, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§7}]}, i-semantic: {svc: fabric:semantic, label: Power BI セマンティックモデル, kind: table, tier: flow, x: 16, 'y': 4, realizes: [semantic], description: Direct Lake で売上の定義とリレーションを共有する。, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§7}]}, i-bi: {svc: fabric:report, label: Power BI 受注レポート, kind: client, tier: flow, x: 20, 'y': 4, realizes: [bi], description: 公開したセマンティックモデルの指標を表示する。, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§7}]}, i-catalog: {svc: fabric:platform, label: OneLake catalog, kind: catalog, tier: flow, x: 4, 'y': 0.5, realizes: [catalog], description: Lakehouse などの資産を検索する。, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§7}]}, i-capacity: {svc: fabric:platform, label: Fabric 容量（F SKU）, kind: scheduler, tier: flow, x: 8, 'y': 10.5, realizes: [capacity], description: Azure で購入し、ワークスペースを割り当てる。F64 未満では閲覧者にも Pro などのライセンスが要る。, evidenc