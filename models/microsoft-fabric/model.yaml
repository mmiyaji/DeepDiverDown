name: Microsoft Fabric の基本アーキテクチャ
description: 一つの OneLake に Lakehouse と Warehouse の Delta テーブルを置き、SQL 分析エンドポイントと Power BI から読む流れを、容量とワークスペースの単位で追う。
reference:
  objectives: [OneLake、Lakehouse、Warehouse、SQL 分析エンドポイント、セマンティックモデルの役割を区別する。, 取り込みから Power BI レポートまでの経路と、Spark と T-SQL の書き込み経路の違いを追う。, 容量（CU）とワークスペースが計算の単位になることを説明する。]
  sources: [{title: Microsoft Learn · Microsoft Fabric, url: https://learn.microsoft.com/en-us/fabric/fundamentals/microsoft-fabric-overview}, {title: Microsoft Learn · OneLake, url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-overview}, {title: Microsoft Learn · Fabric Lakehouse, url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-overview}, {title: Microsoft Learn · SQL analytics endpoint, url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sql-analytics-endpoint}, {title: Microsoft Learn · Fabric Data Warehouse, url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-warehousing}, {title: Microsoft Learn · Direct Lake overview, url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview}, {title: Microsoft Learn · Fabric licenses and capacity, url: https://learn.microsoft.com/en-us/fabric/enterprise/licenses}, {title: Microsoft Learn · OneLake catalog, url: https://learn.microsoft.com/en-us/fabric/governance/onelake-catalog-overview}]
sources:
  - docs/reference-microsoft-fabric.md
evidence:
  - {type: doc, ref: docs/reference-microsoft-fabric.md#§1}
  - {type: doc, ref: docs/reference-microsoft-fabric.md#§2}
tiers:
  - {id: flow, label: データと処理, z: 0, size: [22, 12]}
nodes:
  source: {label: 受注データ（業務システム・ファイル）, kind: external, tier: flow, x: 0, 'y': 4, description: 取り込み元。Azure のストレージや業務 DB などの外部データ。, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§2}]}
  pipeline: {label: 取込パイプライン, kind: service, tier: flow, x: 4, 'y': 4, description: Data Factory のパイプラインで外部データをコピーする。Lakehouse と Warehouse のどちらにも取り込める。, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§2}]}
  lakehouse: {label: Lakehouse（Files・Tables）, kind: table, tier: flow, x: 8, 'y': 4, description: Files に原本、Tables に Delta テーブルを置く項目。作成すると SQL 分析エンドポイントが自動で付く。, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§3}]}
  spark: {label: Spark ノートブック, kind: worker, tier: flow, x: 4, 'y': 7.5, description: Files のデータを整え、Tables に Delta テーブルとして書く。Lakehouse の更新は Spark が担う。, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§3}]}
  warehouse: {label: Warehouse（T-SQL で読み書き）, kind: service, tier: flow, x: 12, 'y': 7.5, drill: fabric-warehouse-sql-endpoint, description: T-SQL の DDL・DML とマルチテーブルのトランザクションを使えるウェアハウス項目。データは OneLake に Delta で保存される。詳細は「Warehouse と SQL 分析エンドポイント」。, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§4}]}
  onelake: {label: OneLake（Delta Parquet）, kind: db, tier: flow, x: 12, 'y': 4, drill: fabric-onelake-shortcuts, description: テナントに一つの論理データレイク。Fabric の各項目のデータを Delta Parquet で保持し、ショートカットで外部ストレージも同じ名前空間に見せる。詳細は「OneLake とショートカット」。, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§2}]}
  sqlep: {label: SQL 分析エンドポイント（読み取り専用）, kind: service, tier: flow, x: 12, 'y': 0.5, description: Lakehouse の Delta テーブルを T-SQL で読む入口。更新はできない。Warehouse などにも同種のエンドポイントが付く。, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§4}]}
  semantic: {label: Power BI セマンティックモデル, kind: table, tier: flow, x: 16, 'y': 4, drill: fabric-direct-lake, description: 指標とリレーションを定義する。Direct Lake では OneLake の Delta テーブルを VertiPaq に読み込んで応答する。詳細は「Direct Lake と Power BI」。, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§5}]}
  bi: {label: Power BI レポート, kind: client, tier: flow, x: 20, 'y': 4, description: セマンティックモデルの指標を表示する。, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§5}]}
  catalog: {label: OneLake catalog, kind: catalog, tier: flow, x: 4, 'y': 0.5, drill: fabric-onelake-catalog, description: Fabric の資産を検索し、認定やリネージを調べる入口。詳細は「OneLake catalog の発見とガバナンス」。, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§6}]}
  capacity: {label: 容量（Capacity Unit）, kind: scheduler, tier: flow, x: 8, 'y': 10.5, description: ワークスペースを割り当てる計算資源の単位。Spark と SQL の処理が CU を消費する。F SKU は Azure で購入する。, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§6}]}
links:
  - {id: extract, from: source, to: pipeline, label: 外部データを取得, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§2}]}
  - {id: copy, from: pipeline, to: lakehouse, label: Files にコピー, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§2}]}
  - {id: transform, from: lakehouse, to: spark, label: Files を読む, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§3}]}
  - {id: write, from: spark, to: lakehouse, label: Tables に Delta を書く, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§3}]}
  - {id: persist-lh, from: lakehouse, to: onelake, label: Delta ファイルを保存, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§3}]}
  - {id: load-wh, from: pipeline, to: warehouse, label: COPY INTO・パイプラインで取り込み, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§4}]}
  - {id: persist-wh, from: warehouse, to: onelake, label: Delta として保存, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§4}]}
  - {id: expose, from: lakehouse, to: sqlep, label: Delta テーブルを自動検出, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§4}]}
  - {id: direct-lake, from: onelake, to: semantic, label: Direct Lake で列を読む, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§5}]}
  - {id: resolve, from: sqlep, to: semantic, label: テーブルを解決（Direct Lake on SQL）, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§5}]}
  - {id: report, from: semantic, to: bi, label: 指標を表示, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§5}]}
  - {id: discover, from: catalog, to: lakehouse, label: 資産を検索, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§6}]}
  - {id: run-spark, from: capacity, to: spark, label: CU を割り当て, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§6}]}
  - {id: run-sql, from: capacity, to: warehouse, label: CU を割り当て, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§6}]}
scenarios:
  - {id: lakehouse-report, label: 受注データから売上レポートへ（Lakehouse 経路）, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§1}], steps: [{links: [extract, copy], note: パイプラインが受注ファイルを Lakehouse の Files にコピーする。}, {links: [transform, write, persist-lh, run-spark], note: Spark が型や欠損を整え、Tables の Delta テーブルに書く。実体は OneLake に保存され、容量の CU を消費する。}, {links: [expose, resolve], note: SQL 分析エンドポイントが Delta テーブルを検出し、セマンティックモデルがテーブルを解決する。}, {links: [direct-lake, report], note: Direct Lake が OneLake から必要な列を読み、Power BI レポートが指標を表示する。}]}
  - {id: warehouse-load, label: T-SQL で Warehouse に取り込む, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§1}], steps: [{links: [extract, load-wh, run-sql], note: パイプラインが外部データを Warehouse にロードする。}, {links: [persist-wh, direct-lake, report], note: Warehouse のテーブルは OneLake の Delta として保存され、Direct Lake のモデルから同じように読める。}]}
  - {id: discover-asset, label: カタログから Lakehouse を探す, evidence: [{type: doc, ref: docs/reference-microsoft-fabric.md#§1}], steps: [{links: [discover], note: OneLake catalog で目的の Lakehouse を探し、権限を確認して利用する。}]}
unknowns:
  - {id: synapse-dates, text: Azure Synapse Analytics の提供終了日は取得した資料で未確認。Fabric Data Warehouse の Migration Assistant が Synapse などからの移行を支援する。, refs: [load-wh]}
  - {id: perf, text: 取り込みや照会の性能・料金の実測値は未確認。容量の消費量は実環境で確認する。, refs: [run-spark, run-sql]}
