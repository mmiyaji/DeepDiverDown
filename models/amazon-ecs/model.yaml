name: Amazon ECS サービススケジューリング
description: Fargate と EC2 の実行方式を比較し、注文 API のタスク配置と障害時の置き換えを追います。
reference:
  objectives: [Fargate と EC2 の実行方式、および capacity provider の違いを区別する, desired count を維持するサービススケジューラーとタスク配置を区別する, 注文 API のデプロイと失敗タスクの置き換えを追う]
  sources:
    - {title: Amazon ECS scheduling tasks, url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/scheduling_tasks.html}
    - {title: Amazon ECS service deployment controllers and strategies, url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs_service-options.html}
sources: [docs/reference-amazon-ecs.md]
evidence: [{type: doc, ref: docs/reference-amazon-ecs.md#§1}]
tiers: [{id: control, label: ECS 制御, z: 1, size: [12, 3]}, {id: runtime, label: 実行基盤, z: 0, size: [12, 3]}]
nodes:
  service: {label: 長時間稼働サービスの定義, kind: service, tier: control, x: 1, 'y': 1.5, description: desired count と更新方針を持つ長時間稼働サービス。, evidence: [{type: doc, ref: docs/reference-amazon-ecs.md#§3}]}
  scheduler: {label: 実行数の維持と再配置, kind: scheduler, tier: control, x: 5, 'y': 1.5, description: desired count を維持し、起動・停止・置き換えを調整する。, evidence: [{type: doc, ref: docs/reference-amazon-ecs.md#§2}, {type: doc, ref: docs/reference-amazon-ecs.md#§4}]}
  placement: {label: 実行先の選択と配置, kind: service, tier: control, x: 9, 'y': 1.5, description: 実行方式、容量、制約、配置戦略を使い候補を選ぶ仕組み。, evidence: [{type: doc, ref: docs/reference-amazon-ecs.md#§2}]}
  fargate: {label: 利用者がホストを管理しない実行先, kind: worker, tier: runtime, x: 2, 'y': 1.5, description: AWS 管理のサーバーレス実行方式。AZ 間の均衡を試みる。, evidence: [{type: doc, ref: docs/reference-amazon-ecs.md#§1}, {type: doc, ref: docs/reference-amazon-ecs.md#§2}]}
  ec2: {label: 利用者がホストを管理する実行先, kind: host, tier: runtime, x: 6, 'y': 1.5, description: 登録済みインスタンスの CPU・メモリ・属性を使う実行基盤。, evidence: [{type: doc, ref: docs/reference-amazon-ecs.md#§1}, {type: doc, ref: docs/reference-amazon-ecs.md#§2}]}
  alb: {label: ロードバランサー, kind: gateway, tier: runtime, x: 10, y: 1.5, description: ECS Service の注文 API へリクエストを転送する入口。, evidence: [{type: doc, ref: docs/reference-amazon-ecs.md#§3}]}
links:
  - {id: define, from: service, to: scheduler, label: desired state を登録, evidence: [{type: doc, ref: docs/reference-amazon-ecs.md#§3}]}
  - {id: choose, from: scheduler, to: placement, label: 配置を依頼, evidence: [{type: doc, ref: docs/reference-amazon-ecs.md#§2}]}
  - {id: fargate-place, from: placement, to: fargate, label: Fargate に配置, evidence: [{type: doc, ref: docs/reference-amazon-ecs.md#§1}, {type: doc, ref: docs/reference-amazon-ecs.md#§2}]}
  - {id: ec2-place, from: placement, to: ec2, label: EC2 に配置, evidence: [{type: doc, ref: docs/reference-amazon-ecs.md#§1}, {type: doc, ref: docs/reference-amazon-ecs.md#§2}]}
  - {id: route, from: alb, to: service, label: API リクエスト, evidence: [{type: doc, ref: docs/reference-amazon-ecs.md#§3}]}
  - {id: replace, from: scheduler, to: placement, label: 失敗タスクを再配置, evidence: [{type: doc, ref: docs/reference-amazon-ecs.md#§4}]}
scenarios:
  - id: order-api
    label: 注文 API のデプロイ
    evidence: [{type: doc, ref: docs/reference-amazon-ecs.md#§1}, {type: doc, ref: docs/reference-amazon-ecs.md#§2}, {type: doc, ref: docs/reference-amazon-ecs.md#§3}]
    steps:
      - {links: [define], note: ECS Service に注文 API のタスク定義と desired count を登録する。}
      - {links: [choose], note: サービススケジューラーが実行方式・容量・制約を使って配置候補を決める。}
      - {links: [fargate-place, ec2-place, route], note: Fargate または EC2 にタスクを置き、ロードバランサーから API を受ける。}
  - id: replacement
    label: 注文 API タスクの置き換え
    evidence: [{type: doc, ref: docs/reference-amazon-ecs.md#§4}, {type: doc, ref: docs/reference-amazon-ecs.md#§5}]
    steps:
      - {links: [define], note: 実行中タスクの停止・失敗を ECS Service が検知する。}
      - {links: [replace], note: サービススケジューラーが desired count を満たす置き換えを計画する。}
      - {links: [choose, fargate-place, ec2-place], note: 配置条件を再評価し、Fargate または適合する EC2 へ新タスクを置く。}
implementations:
  - id: ecs
    label: ECS の Fargate サービスと EC2 サービス
    description: 同じ ECS クラスタの中で注文 API のタスク定義を共有し、Fargate と EC2 を別のサービスとして比較する例。
    sources:
      - {title: ECS shared responsibility, url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/security-shared-model.html}
      - {title: Fargate host access, url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-security-considerations.html}
      - title: Amazon ECS launch types and capacity providers
        url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/capacity-launch-type-comparison.html
      - title: Amazon ECS capacity providers for EC2 workloads
        url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/asg-capacity-providers.html
      - title: Use an Application Load Balancer for Amazon ECS
        url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/alb.html
      - {title: "ECS タスクの awsvpc ネットワーク", url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-networking-awsvpc.html}
    tiers:
      - id: control
        label: ECS 制御
        z: 1
      - id: runtime
        label: 実行基盤
        z: 0
    groups:
      - kind: cloud
        label: AWS アカウント
        provider: aws
        tier:
          - control
          - runtime
        nodes:
          - ecs-service
          - ecs-scheduler
          - ecs-fargate
          - ecs-ec2
          - ecs-ec2-task
          - ecs-alb
          - ecs-image
      - {kind: vpc, label: タスクと ALB を配置する VPC, tier: [runtime], nodes: [ecs-fargate, ecs-ec2, ecs-ec2-task, ecs-alb]}
    nodes:
      ecs-service:
        label: ECS Service の設定 × 2
        kind: service
        tier: control
        svc: aws:ecs
        realizes:
          - service
        description: 両起動タイプに対応した awsvpc の共通タスク定義で Fargate と EC2 を別サービスにする。
        management: {type: customer, scope: 利用者がサービス、タスク定義、台数とネットワークを設定する。}
        evidence:
          - type: doc
            ref: docs/reference-amazon-ecs.md#§6
      ecs-scheduler:
        label: ECS サービス制御と容量戦略
        kind: workflow
        tier: control
        svc: aws:ecs
        realizes:
          - scheduler
          - placement
        description: 必要なタスク数と、各サービスの capacity provider strategy を適用する。
        management: {type: aws, scope: AWS がスケジューラー基盤を運用し、利用者がサービスと容量戦略を設定する。}
        evidence:
          - type: doc
            ref: docs/reference-amazon-ecs.md#§6
      ecs-fargate:
        label: Fargate capacity provider のタスク
        kind: worker
        tier: runtime
        svc: aws:fargate
        realizes:
          - fargate
        description: AWS が基盤を管理する実行先。利用者は基盤ホストへ接続できず、タスク設定とアプリを管理する。
        management: {type: shared, scope: AWS が実行基盤を運用し、利用者がタスク定義とアプリを管理する。}
        evidence:
          - type: doc
            ref: docs/reference-amazon-ecs.md#§6
      ecs-ec2:
        label: EC2 Auto Scaling group のコンテナインスタンス
        kind: host
        tier: runtime
        svc: ec2
        realizes:
          - ec2
        description: EC2 capacity provider と関連付け、タスクをコンテナインスタンスへ配備する。
        management: {type: customer, scope: 利用者がインスタンスの容量、OS と更新を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-amazon-ecs.md#§6
      ecs-ec2-task:
        label: EC2 上の注文 API タスク
        kind: service
        tier: runtime
        x: 8
        y: 1.5
        description: EC2 コンテナインスタンス上で動き、awsvpc のタスク ENI を持つ。
        management: {type: customer, scope: 利用者がイメージとタスク定義を管理する。}
        evidence: [{type: doc, ref: docs/reference-amazon-ecs.md#§6}]
      ecs-alb:
        label: Application Load Balancer と別ターゲットグループ
        kind: gateway
        tier: runtime
        svc: alb
        realizes:
          - alb
        description: リスナールールで 2 つの IP 型ターゲットグループを使い分け、個々のタスク ENI へ転送する。
        management: {type: shared, scope: AWS が基盤を運用し、利用者がリスナーとターゲットグループを設定する。}
        evidence:
          - type: doc
            ref: docs/reference-amazon-ecs.md#§6
      ecs-image:
        label: Amazon ECR の共通イメージ
        kind: file
        tier: runtime
        svc: ecr
        description: 両方のサービスが同じバージョンの注文 API イメージを参照する。
        management: {type: shared, scope: AWS が基盤を運用し、利用者がイメージと権限を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-amazon-ecs.md#§6
    links:
      - {id: ecs-alb-fargate, from: ecs-alb, to: ecs-fargate, label: Fargate タスクの ENI へ転送, realizes: [route], replace: true}
      - {id: ecs-alb-ec2, from: ecs-alb, to: ecs-ec2-task, label: EC2 上のタスク ENI へ転送, realizes: [route], replace: true}
      - {id: ecs-run-ec2, from: ecs-ec2, to: ecs-ec2-task, label: 注文 API タスクを実行, evidence: [{type: doc, ref: docs/reference-amazon-ecs.md#§6}]}
      - id: ecs-pull-fargate
        from: ecs-fargate
        to: ecs-image
        label: イメージを取得
        evidence:
          - type: doc
            ref: docs/reference-amazon-ecs.md#§6
      - id: ecs-pull-ec2
        from: ecs-ec2
        to: ecs-image
        label: イメージを取得
        evidence:
          - type: doc
            ref: docs/reference-amazon-ecs.md#§6

    layout2d:
      tiers: [{id: diagram, label: 実装構成, z: 0, origin: [-4, 0], size: [21, 11]}]
      nodes:
        ecs-service: {tier: diagram, x: 2, y: 1}
        ecs-scheduler: {tier: diagram, x: 6, y: 1}
        ecs-fargate: {tier: diagram, x: 3, y: 5}
        ecs-ec2: {tier: diagram, x: 7, y: 5}
        ecs-ec2-task: {tier: diagram, x: 7, y: 8}
        ecs-alb: {tier: diagram, x: 11, y: 6}
        ecs-image: {tier: diagram, x: 14, y: 2}
      groups:
        - {kind: cloud, provider: aws, label: AWS アカウント, tier: [diagram], x0: 0, y0: -1, x1: 16, y1: 10, nodes: [ecs-service, ecs-scheduler, ecs-fargate, ecs-ec2, ecs-ec2-task, ecs-alb, ecs-image]}
        - {kind: vpc, provider: aws, label: タスクと ALB の VPC, tier: [diagram], x0: 1, y0: 3, x1: 13, y1: 9, nodes: [ecs-fargate, ecs-ec2, ecs-ec2-task, ecs-alb]}
    layout3d:
      tiers:
        - {id: runtime, label: 実行基盤, z: 0, size: [10, 5]}
        - {id: apps, label: アプリ, z: 1, size: [10, 5]}
        - {id: services, label: 独立サービス・制御, z: 0, origin: [12, 0], size: [12, 7]}
        - {id: outside, label: 利用者, z: 0, origin: [-5, 0], size: [3, 3]}
      nodes:
        ecs-service: {tier: services, x: 1, y: 1}
        ecs-scheduler: {tier: services, x: 5, y: 1}
        ecs-fargate: {tier: runtime, x: 2, y: 2}
        ecs-ec2: {tier: runtime, x: 6, y: 2}
        ecs-ec2-task: {tier: apps, x: 6, y: 2}
        ecs-alb: {tier: services, x: 1, y: 5}
        ecs-image: {tier: services, x: 5, y: 5}
      groups:
        - {kind: cloud, provider: aws, label: AWS アカウント, tier: [runtime, apps, services], nodes: [ecs-service, ecs-scheduler, ecs-fargate, ecs-ec2, ecs-ec2-task, ecs-alb, ecs-image]}
