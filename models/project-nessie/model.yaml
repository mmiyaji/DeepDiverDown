name: Project Nessie のバージョン管理カタログ
description: カタログ全体のブランチとコミットを使い、複数の Iceberg テーブルを一貫した状態で参照・公開する流れを追います。
parent:
  model: data-catalog-architecture
  node: nessie
reference:
  objectives:
    - Nessie のコミットと Iceberg テーブル単位のスナップショットを区別する。
    - ブランチ、タグ、コンテンツキーから参照時点を特定する。
    - Iceberg REST 経由の利用における制約を確認する。
  sources:
    - title: Nessie Specification
      url: https://projectnessie.org/develop/spec/
    - title: Configure Nessie with Iceberg REST
      url: https://projectnessie.org/guides/iceberg-rest/
    - title: Nessie CLI Merge
      url: https://projectnessie.org/nessie-0-107-1/generated-docs/cli-help-MergeBranchStatement/
sources:
  - docs/reference-project-nessie.md
evidence:
  - type: doc
    ref: docs/reference-project-nessie.md#§1
tiers:
  - id: clients
    label: クライアント
    z: 2
    size:
      - 10
      - 3
  - id: catalog
    label: バージョン管理カタログ
    z: 1
    size:
      - 12
      - 4
  - id: storage
    label: ストレージ
    z: 0
    size:
      - 10
      - 3
nodes:
  engine:
    label: Iceberg エンジン
    kind: client
    tier: clients
    x: 7
    y: 1
    description: 参照を指定してテーブルを読み書きする。
    evidence:
      - type: doc
        ref: docs/reference-project-nessie.md#§4
  operator:
    label: データ運用者
    kind: actor
    tier: clients
    x: 2
    y: 1
    description: 作業ブランチを作り検証後にマージする。
    evidence:
      - type: doc
        ref: docs/reference-project-nessie.md#§3
  api:
    label: Iceberg REST 接続
    kind: service
    tier: catalog
    x: 8
    y: 1
    description: クライアントの参照と warehouse を選ぶ。
    evidence:
      - type: doc
        ref: docs/reference-project-nessie.md#§4
  refs:
    label: ブランチ・タグ
    kind: service
    tier: catalog
    x: 2
    y: 1
    description: 名前付き参照から Nessie コミットを選ぶ。
    evidence:
      - type: doc
        ref: docs/reference-project-nessie.md#§1
  version-store:
    label: コミット履歴
    kind: db
    tier: catalog
    x: 5
    y: 2
    description: カタログ全体の更新履歴を管理する。
    evidence:
      - type: doc
        ref: docs/reference-project-nessie.md#§1
      - type: doc
        ref: docs/reference-project-nessie.md#§3
  contents:
    label: テーブル状態
    kind: service
    tier: catalog
    x: 10
    y: 2.5
    description: 各キーから対応するテーブルの状態を解決する。
    evidence:
      - type: doc
        ref: docs/reference-project-nessie.md#§2
  files:
    label: Iceberg メタデータ・ファイル
    kind: db
    tier: storage
    x: 7
    y: 1
    description: テーブルメタデータと対応する実ファイルを置く。
    evidence:
      - type: doc
        ref: docs/reference-project-nessie.md#§2
      - type: doc
        ref: docs/reference-project-nessie.md#§4
links:
  - id: branch
    from: operator
    to: refs
    label: 作業ブランチを作成
    evidence:
      - type: doc
        ref: docs/reference-project-nessie.md#§3
  - id: load
    from: engine
    to: api
    label: 参照を指定して読み込む
    evidence:
      - type: doc
        ref: docs/reference-project-nessie.md#§4
  - id: choose-ref
    from: api
    to: refs
    label: ブランチまたはタグを解決
    evidence:
      - type: doc
        ref: docs/reference-project-nessie.md#§4
  - id: select-commit
    from: refs
    to: version-store
    label: 参照先コミットを選ぶ
    evidence:
      - type: doc
        ref: docs/reference-project-nessie.md#§1
  - id: resolve-key
    from: version-store
    to: contents
    label: テーブル状態を解決
    evidence:
      - type: doc
        ref: docs/reference-project-nessie.md#§2
  - id: read-files
    from: engine
    to: files
    label: 解決した状態のファイルを読む
    evidence:
      - type: doc
        ref: docs/reference-project-nessie.md#§4
  - id: write-files
    from: engine
    to: files
    label: 新しいデータファイルを書く
    evidence:
      - type: doc
        ref: docs/reference-project-nessie.md#§3
  - id: work-change
    from: engine
    to: api
    label: 作業ブランチへ更新を送る
    evidence:
      - type: doc
        ref: docs/reference-project-nessie.md#§3
  - id: commit
    from: api
    to: version-store
    label: 作業ブランチに変更を記録
    evidence:
      - type: doc
        ref: docs/reference-project-nessie.md#§3
  - id: merge
    from: operator
    to: version-store
    label: 検証済みの変更を main にマージ
    evidence:
      - type: doc
        ref: docs/reference-project-nessie.md#§3
scenarios:
  - id: publish-review
    label: 二つのテーブルを検証して公開する
    evidence:
      - type: doc
        ref: docs/reference-project-nessie.md#§5
    steps:
      - links:
          - branch
        note: main の同じ時点を基に review を作る。
      - links:
          - write-files
          - work-change
          - commit
        note: review 上で売上と顧客テーブルを更新する。
      - links:
          - load
          - choose-ref
          - select-commit
          - resolve-key
          - read-files
        note: review 上の二つの更新をまとめて検証する。
        read:
          - review-sales
          - review-customers
      - links:
          - merge
        note: 競合を確認し、検証済みの状態を main にマージする。
  - id: read-close
    label: 月次締め時点を再現する
    evidence:
      - type: doc
        ref: docs/reference-project-nessie.md#§5
    steps:
      - links:
          - load
          - choose-ref
          - select-commit
        note: close-jun タグを指定し、締め時点のコミットを選ぶ。
      - links:
          - resolve-key
          - read-files
        note: 同じコミットに属する二つのテーブルの状態を読む。
        read:
          - close-sales
          - close-customers
treeLayout:
  title: 名前付き参照からテーブル状態へ
  unit: テーブル状態
  levels:
    - カタログ
    - 参照
    - キーごとの状態
  note: マージ前の論理的な展開。同一コミットを指す参照があってもファイルは複製されない。
  root:
    id: nessie-root
    label: Nessie カタログ
    kind: meta
    node: refs
    children:
      - id: main-branch
        label: main
        kind: snapshot
        node: version-store
        sub: M1（マージ前）
        children:
          - id: main-sales
            label: sales
            kind: data
            node: contents
            sub: 売上 S1
          - id: main-customers
            label: customers
            kind: data
            node: contents
            sub: 顧客 C1
      - id: review-branch
        label: review
        kind: snapshot
        node: version-store
        sub: R2（検証候補）
        children:
          - id: review-sales
            label: sales
            kind: data
            node: contents
            sub: 売上 S2
          - id: review-customers
            label: customers
            kind: data
            node: contents
            sub: 顧客 C2
      - id: close-tag
        label: close-jun
        kind: snapshot
        node: version-store
        sub: M1（締め時点）
        children:
          - id: close-sales
            label: sales
            kind: data
            node: contents
            sub: 売上 S1
          - id: close-customers
            label: customers
            kind: data
            node: contents
            sub: 顧客 C1
implementations:
  - id: nessie-local
    label: Spark・Nessie・MinIO
    description: 公式のローカル Iceberg REST ガイドに沿って Spark と MinIO を接続し、作業ブランチを試す例。
    sources:
      - {title: Nessie authenticated demo compose, url: https://github.com/projectnessie/nessie/blob/main/docker/catalog-auth-s3/docker-compose.yml}
      - title: Nessie Specification
        url: https://projectnessie.org/develop/spec/
      - title: Configure Nessie with Iceberg REST
        url: https://projectnessie.org/guides/iceberg-rest/
      - title: Getting Started with Nessie and Iceberg REST
        url: https://projectnessie.org/guides/try-nessie/
    nodes:
      nessie-local-host: {label: Docker Compose host, kind: host, tier: clients, x: 12, y: 1, evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§6"}]}
      nessie-local-keycloak: {label: Keycloak OAuth server, kind: service, tier: catalog, x: 12, y: 1, evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§6"}]}
      nessie-local-init: {label: MinIO bucket initializer, kind: worker, tier: storage, x: 12, y: 1, evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§6"}]}
      nessie-local-spark:
        label: Spark SQL
        kind: client
        tier: clients
        x: 7
        y: 1
        description: Iceberg REST クライアントからブランチを選ぶ。
        realizes:
          - engine
        evidence:
          - type: doc
            ref: docs/reference-project-nessie.md#§6
      nessie-local-cli:
        label: 運用者の Nessie CLI
        kind: actor
        tier: clients
        x: 2
        y: 1
        description: ブランチの作成とマージを行う。
        realizes:
          - operator
        evidence:
          - type: doc
            ref: docs/reference-project-nessie.md#§6
      nessie-local-server:
        label: Nessie Server
        kind: service
        tier: catalog
        x: 8
        y: 1
        description: REST 接続、参照とコンテンツキーの解決を担う。
        realizes:
          - api
          - refs
          - contents
        evidence:
          - type: doc
            ref: docs/reference-project-nessie.md#§6
      nessie-local-history:
        label: Nessie インメモリ Version Store
        kind: db
        tier: catalog
        x: 5
        y: 2
        description: 試行用のコミット履歴をプロセス内に保存する。
        realizes:
          - version-store
        evidence:
          - type: doc
            ref: docs/reference-project-nessie.md#§6
      nessie-local-minio:
        label: MinIO（S3 互換）
        kind: db
        tier: storage
        x: 7
        y: 1
        description: warehouse に Iceberg メタデータとデータを置く。
        realizes:
          - files
        evidence:
          - type: doc
            ref: docs/reference-project-nessie.md#§6
      nessie-local-warehouse:
        label: warehouse 設定
        kind: file
        tier: storage
        x: 2
        y: 1
        description: オブジェクトストレージの接続先とテーブルの既定位置を定義する。
        evidence:
          - type: doc
            ref: docs/reference-project-nessie.md#§6
    links:
      - {id: nessie-local-auth, from: nessie-local-spark, to: nessie-local-keycloak, label: "Obtain OAuth token", evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§6"}]}
      - {id: nessie-local-validate, from: nessie-local-server, to: nessie-local-keycloak, label: "Validate authentication", evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§6"}]}
      - {id: nessie-local-create-bucket, from: nessie-local-init, to: nessie-local-minio, label: "Initialize warehouse bucket", evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§6"}]}
      - {id: nessie-local-signed-access, from: nessie-local-spark, to: nessie-local-minio, label: "Read and write signed S3 requests", evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§6"}]}
      - id: nessie-local-bind
        from: nessie-local-warehouse
        to: nessie-local-server
        label: warehouse を選べるように設定
        evidence:
          - type: doc
            ref: docs/reference-project-nessie.md#§6
    layout2d:
      tiers: [{id: local, label: Local Docker Compose host, z: 0, size: [22, 11]}]
      nodes:
        nessie-local-host: {tier: local, x: 2, y: 1}
        nessie-local-spark: {tier: local, x: 6, y: 1}
        nessie-local-cli: {tier: local, x: 10, y: 1}
        nessie-local-server: {tier: local, x: 14, y: 1}
        nessie-local-history: {tier: local, x: 18, y: 1}
        nessie-local-minio: {tier: local, x: 2, y: 5}
        nessie-local-warehouse: {tier: local, x: 6, y: 5}
        nessie-local-keycloak: {tier: local, x: 10, y: 5}
        nessie-local-init: {tier: local, x: 14, y: 5}
      groups:
        - {kind: datacenter, label: Local host, tier: local, nodes: [nessie-local-host, nessie-local-spark, nessie-local-cli, nessie-local-server, nessie-local-history, nessie-local-minio, nessie-local-warehouse, nessie-local-keycloak, nessie-local-init]}
    layout3d:
      tiers:
        - {id: containers, label: Containers and clients, z: 1, size: [20, 6]}
        - {id: host, label: Local host and configuration, z: 0, size: [20, 6]}
      nodes:
        nessie-local-host: {tier: host, x: 2, y: 1}
        nessie-local-spark: {tier: containers, x: 6, y: 1}
        nessie-local-cli: {tier: containers, x: 10, y: 1}
        nessie-local-server: {tier: containers, x: 14, y: 1}
        nessie-local-history: {tier: containers, x: 18, y: 1}
        nessie-local-minio: {tier: containers, x: 2, y: 4}
        nessie-local-warehouse: {tier: host, x: 6, y: 4}
        nessie-local-keycloak: {tier: containers, x: 10, y: 4}
        nessie-local-init: {tier: containers, x: 14, y: 4}
      groups:
        - {kind: datacenter, label: Local host, tier: [containers, host], nodes: [nessie-local-host, nessie-local-spark, nessie-local-cli, nessie-local-server, nessie-local-history, nessie-local-minio, nessie-local-warehouse, nessie-local-keycloak, nessie-local-init]}
  - id: aws-eks-nessie
    label: AWS：EKS・Nessie・RDS for PostgreSQL
    description: EKS の EC2 ノード上に Nessie と Spark を配置し、RDS for PostgreSQL に版を永続化し、Iceberg のデータを S3 へ保存する例。
    sources:
      - {title: Nessie on Kubernetes, url: https://projectnessie.org/guides/kubernetes/}
      - {title: Nessie server configuration, url: https://projectnessie.org/nessie-0-107-4/configuration/}
      - {title: Configure Nessie with Iceberg REST, url: https://projectnessie.org/guides/iceberg-rest/}
      - {title: Spark on Kubernetes, url: https://spark.apache.org/docs/3.5.7/running-on-kubernetes.html}
      - {title: Amazon EKS managed node groups, url: https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html}
      - {title: IAM roles for service accounts, url: https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html}
      - {title: Amazon RDS for PostgreSQL, url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_PostgreSQL.html}
      - {title: AWS shared responsibility, url: https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/shared-responsibility.html}
    tiers:
      - {id: control, label: Kubernetes 管理と運用, z: 2, size: [20, 4]}
      - {id: compute, label: カタログとクエリの実行, z: 1, size: [20, 4]}
      - {id: storage, label: 版とテーブルの保存, z: 0, size: [20, 4]}
    groups:
      - {kind: cloud, label: AWS アカウント, provider: aws, tier: [control, compute, storage], nodes: [aws-nessie-eks, aws-nessie-sts, aws-nessie-ec2, aws-nessie-spark, aws-nessie-server, aws-nessie-rds, aws-nessie-s3]}
      - {kind: cluster, label: EKS クラスタ, tier: compute, nodes: [aws-nessie-ec2, aws-nessie-spark, aws-nessie-server]}
    nodes:
      aws-nessie-eks: {label: "Amazon EKS / Kubernetes API", svc: eks, kind: service, tier: control, x: 3, y: 1.5, description: "Kubernetes のコントロールプレーンと EC2 マネージドノードグループを管理する。", management: {type: shared, scope: "AWS operates EKS control plane; customer configures Kubernetes API and workloads."}, evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§7"}]}
      aws-nessie-sts: {label: "AWS STS", svc: sts, kind: service, tier: control, x: 9, y: 1.5, description: "Nessie が引き受けるロールと、Spark のテーブルアクセス用の短期資格情報を発行する。", management: {type: shared, scope: "AWS operates STS; customer configures role trust and permissions."}, evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§7"}]}
      aws-nessie-cli: {label: "運用者 / Nessie CLI", kind: actor, tier: control, x: 17, y: 1.5, realizes: [operator], description: "到達可能な Nessie の管理 API を使って参照を作成・マージする。", evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§7"}]}
      aws-nessie-spark: {label: "Spark Driver・Executor Pod", kind: worker, tier: compute, x: 4, y: 1.5, realizes: [engine], description: "Iceberg REST でブランチを選び、S3 のデータファイルを読み書きする。", management: {type: customer, scope: "Customer manages Spark jobs and runtime settings."}, evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§7"}]}
      aws-nessie-server: {label: "Nessie Server Pod", kind: service, tier: compute, x: 10, y: 1.5, realizes: [api, refs, contents], description: "Nessie API と Iceberg REST を提供し、ブランチ・タグやテーブル状態を解決する。", management: {type: customer, scope: "Customer manages Nessie deployment and configuration."}, evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§7"}]}
      aws-nessie-ec2: {label: "Amazon EC2 / EKS ノードグループ", svc: ec2, kind: host, tier: compute, x: 16, y: 1.5, description: "Nessie と Spark の Pod を実行する Kubernetes ワーカーノード。", management: {type: shared, scope: "AWS manages node group lifecycle; customer configures nodes and workloads."}, evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§7"}]}
      aws-nessie-s3: {label: "Amazon S3 / Iceberg warehouse", svc: s3, kind: db, tier: storage, x: 4, y: 1.5, realizes: [files], description: "Iceberg のテーブルメタデータ・Manifest・データファイルを保持する。", management: {type: shared, scope: "AWS operates S3; customer manages data and access."}, evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§7"}]}
      aws-nessie-rds: {label: "Amazon RDS for PostgreSQL", svc: rds, kind: db, tier: storage, x: 13, y: 1.5, realizes: [version-store], description: "Nessie の参照・コミット履歴・コンテンツ状態をトランザクション付きで永続化する。", management: {type: shared, scope: "AWS operates RDS infrastructure; customer manages database contents and access."}, evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§7"}]}
    links:
      - {id: aws-nessie-provision, from: aws-nessie-eks, to: aws-nessie-ec2, label: "EC2 ノードグループを管理", evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§7"}]}
      - {id: aws-nessie-deploy, from: aws-nessie-eks, to: aws-nessie-server, label: "Kubernetes が Nessie Pod を配置", evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§7"}]}
      - {id: aws-nessie-allocate-spark, from: aws-nessie-eks, to: aws-nessie-spark, label: "Kubernetes が Spark Pod を配置", evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§7"}]}
      - {id: aws-nessie-history, from: aws-nessie-server, to: aws-nessie-rds, label: "参照・コミット・コンテンツを読み書き", realizes: [select-commit], replace: true, evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§7"}]}
      - {id: aws-nessie-resolve, from: aws-nessie-server, to: aws-nessie-rds, label: "コミット時点のテーブル状態を取得", realizes: [resolve-key], replace: true, evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§7"}]}
      - {id: aws-nessie-persist, from: aws-nessie-server, to: aws-nessie-rds, label: "参照先とコミットを確定", realizes: [commit], replace: true, evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§7"}]}
      - {id: aws-nessie-table-meta, from: aws-nessie-server, to: aws-nessie-s3, label: "Iceberg の表メタデータを読み書き", evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§7"}]}
      - {id: aws-nessie-read-data, from: aws-nessie-spark, to: aws-nessie-s3, label: "対象の Iceberg ファイルを読み取る", realizes: [read-files], replace: true, evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§7"}]}
      - {id: aws-nessie-credentials, from: aws-nessie-server, to: aws-nessie-sts, label: "S3 アクセス用の短期資格情報を取得", evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§7"}]}
      - {id: aws-nessie-vend, from: aws-nessie-server, to: aws-nessie-spark, label: "テーブル用の一時資格情報を返す", evidence: [{type: doc, ref: "docs/reference-project-nessie.md#§7"}]}
    layout2d:
      tiers: [{id: diagram, label: EKS Nessie and AWS services, z: 0, size: [23, 11]}]
      nodes:
        aws-nessie-eks: {tier: diagram, x: 13, y: 1}
        aws-nessie-sts: {tier: diagram, x: 17, y: 1}
        aws-nessie-cli: {tier: diagram, x: 0, y: 5}
        aws-nessie-spark: {tier: diagram, x: 3, y: 6}
        aws-nessie-server: {tier: diagram, x: 7, y: 6}
        aws-nessie-ec2: {tier: diagram, x: 5, y: 3}
        aws-nessie-s3: {tier: diagram, x: 13, y: 6}
        aws-nessie-rds: {tier: diagram, x: 17, y: 6}
