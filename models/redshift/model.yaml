name: Amazon Redshift のクラスター・マネージドストレージアーキテクチャ
description: リーダーノードがクエリを計画し、コンピュートノードとスライスが並列処理してRMSへアクセスする流れです。
reference:
  objectives:
    - リーダーノードとコンピュートノードの役割を区別する。
    - スライスと分散スタイルが並列処理に関係することを理解する。
    - クエリがクライアントから計画、並列実行、集約へ進む流れを追う。
  sources:
    - title: Amazon Redshift provisioned clusters overview
      url: https://docs.aws.amazon.com/redshift/latest/mgmt/overview.html
    - title: Data warehouse system architecture
      url: https://docs.aws.amazon.com/redshift/latest/dg/c_high_level_system_architecture.html
    - title: Architecture components of an Amazon Redshift data warehouse
      url: >-
        https://docs.aws.amazon.com/prescriptive-guidance/latest/query-best-practices-redshift/data-warehouse-arch-components.html
sources:
  - docs/reference-redshift.md
evidence:
  - type: doc
    ref: docs/reference-redshift.md#§1
  - type: doc
    ref: docs/reference-redshift.md#§6
  - type: doc
    ref: docs/reference-redshift.md#§7
tiers:
  - id: edge
    label: クライアントと利用者
    z: 2
    size:
      - 12
      - 3
  - id: cluster
    label: Redshift クラスター
    z: 1
    origin:
      - 1
      - 0
    size:
      - 10
      - 3
  - id: storage
    label: データ保持
    z: 0
    size:
      - 8
      - 3
groups:
  - kind: parallel
    label: コンピュートノードとスライスで並列実行
    tier: cluster
    nodes:
      - compute
      - slice
nodes:
  client:
    label: SQL client
    kind: external
    tier: edge
    x: 0
    'y': 1.5
    description: SQLやBIツールからクエリを送る外部クライアント。
    evidence:
      - type: doc
        ref: docs/reference-redshift.md#§1
  bi:
    label: BI user
    kind: actor
    tier: edge
    x: 10
    'y': 1.5
    description: 集約された分析結果を利用する利用者。
    evidence:
      - type: doc
        ref: docs/reference-redshift.md#§6
  leader:
    label: クエリ計画・結果調整ノード
    kind: worker
    tier: cluster
    x: 1
    'y': 1.5
    description: SQLを解析・計画し、コンピュートノードを調整して結果を集約する。
    evidence:
      - type: doc
        ref: docs/reference-redshift.md#§2
      - type: doc
        ref: docs/reference-redshift.md#§3
  compute:
    parallel: 'N'
    label: 分散計算ノード
    kind: worker
    tier: cluster
    x: 5
    'y': 1.5
    description: リーダーから配布された計画を実行し、中間結果を返す。
    evidence:
      - type: doc
        ref: docs/reference-redshift.md#§2
      - type: doc
        ref: docs/reference-redshift.md#§4
  slice:
    slots: 4
    label: ノード内の並列処理単位
    kind: worker
    tier: cluster
    x: 9
    'y': 1.5
    description: コンピュートノード内でデータと処理を分担する並列実行単位。
    evidence:
      - type: doc
        ref: docs/reference-redshift.md#§4
  database:
    label: 分析データベース
    kind: db
    tier: storage
    x: 1
    'y': 1.5
    description: クラスター内のデータベース論理境界。
    evidence:
      - type: doc
        ref: docs/reference-redshift.md#§2
      - type: doc
        ref: docs/reference-redshift.md#§6
  rms:
    label: 分離された管理ストレージ
    kind: db
    tier: storage
    x: 6
    'y': 1.5
    description: 計算ノードから分離してデータを永続化する。
    evidence:
      - type: doc
        ref: docs/reference-redshift.md#§5
links:
  - id: submit
    from: client
    to: leader
    label: SQLを送信
    evidence:
      - type: doc
        ref: docs/reference-redshift.md#§3
  - id: plan
    from: leader
    to: compute
    label: 実行計画を配布
    evidence:
      - type: doc
        ref: docs/reference-redshift.md#§3
  - id: parallel
    from: compute
    to: slice
    label: スライスで並列実行
    evidence:
      - type: doc
        ref: docs/reference-redshift.md#§4
  - id: read-db
    from: slice
    to: database
    label: データを処理
    evidence:
      - type: doc
        ref: docs/reference-redshift.md#§4
      - type: doc
        ref: docs/reference-redshift.md#§6
  - id: read-rms
    from: database
    to: rms
    label: 管理ストレージを読み書き
    evidence:
      - type: doc
        ref: docs/reference-redshift.md#§5
  - id: intermediate
    from: compute
    to: leader
    label: 中間結果を返す
    evidence:
      - type: doc
        ref: docs/reference-redshift.md#§3
  - id: result
    from: leader
    to: bi
    label: 集約結果を返す
    evidence:
      - type: doc
        ref: docs/reference-redshift.md#§3
      - type: doc
        ref: docs/reference-redshift.md#§6
scenarios:
  - id: query
    label: クエリを並列実行する
    evidence:
      - type: doc
        ref: docs/reference-redshift.md#§2
      - type: doc
        ref: docs/reference-redshift.md#§3
      - type: doc
        ref: docs/reference-redshift.md#§4
      - type: doc
        ref: docs/reference-redshift.md#§6
    steps:
      - links:
          - submit
        note: 受付。クライアントがリーダーノードへSQLを送る。
      - links:
          - plan
        note: 計画。リーダーノードがSQLを解析し、実行計画をコンピュートノードへ配布する。
      - links:
          - parallel
        note: 並列化。コンピュートノード内のスライスが担当範囲を処理する。
      - links:
          - read-db
          - read-rms
        note: 読み取り。スライスがデータベースのデータを処理し、必要に応じてRMSへアクセスする。
      - links:
          - intermediate
          - result
        note: 集約。中間結果をリーダーがまとめ、BI利用者へ返す。
  - id: storage-scale
    label: ストレージを拡張する
    evidence:
      - type: doc
        ref: docs/reference-redshift.md#§5
    steps:
      - links:
          - read-rms
        note: 保持。データをRMSへ保持する。
      - links:
          - parallel
        note: 計算。コンピュート側はクエリの並列処理を担当する。
      - links:
          - result
        note: 独立。コンピュート容量とストレージ容量を別々の観点で扱う。
requirements:
  - id: BR-01
    kind: usecase
    title: 並列分析
    text: リーダーが計画したクエリをコンピュートノードのスライスで並列実行する。
    links:
      - plan
      - parallel
      - intermediate
    evidence:
      - type: doc
        ref: docs/reference-redshift.md#§3
      - type: doc
        ref: docs/reference-redshift.md#§4
  - id: NFR-01
    kind: nfr
    title: 管理ストレージ
    text: データをRMSに保持し、計算とストレージを独立して扱う。
    links:
      - read-rms
    evidence:
      - type: doc
        ref: docs/reference-redshift.md#§5
unknowns:
  - id: UNK-01
    text: 実際のリージョン、ノードタイプ、分散キー、ワークロード設定は未確定。
    refs:
      - leader
      - compute
      - rms
gates:
  maxDrift: 0
  maxHigh: 0
implementations:
  - id: redshift-ra3
    label: Amazon Redshift RA3 のプライベートクラスター
    description: 2 台以上のコンピュートノードを持つプライベート RA3 クラスターに接続し、Amazon S3 から受注をロードする構成。
    sources:
      - title: Amazon Redshift provisioned clusters overview
        url: https://docs.aws.amazon.com/redshift/latest/mgmt/overview.html
      - title: Data warehouse system architecture
        url: https://docs.aws.amazon.com/redshift/latest/dg/c_high_level_system_architecture.html
      - title: Architecture components of an Amazon Redshift data warehouse
        url: >-
          https://docs.aws.amazon.com/prescriptive-guidance/latest/query-best-practices-redshift/data-warehouse-arch-components.html
      - title: VPC 内の Redshift リソース
        url: https://docs.aws.amazon.com/redshift/latest/mgmt/managing-clusters-vpc.html
      - title: Enhanced VPC routing
        url: https://docs.aws.amazon.com/redshift/latest/mgmt/enhanced-vpc-enabling-cluster.html
      - title: Redshift COPY と S3 VPC エンドポイント
        url: https://docs.aws.amazon.com/redshift/latest/mgmt/enhanced-vpc-working-with-endpoints.html
      - title: Redshift RSQL の接続
        url: https://docs.aws.amazon.com/redshift/latest/mgmt/rsql-query-tool-starting-tool-connection.html
    tiers:
      - id: edge
        label: クライアントと利用者
        z: 2
        size:
          - 12
          - 3
      - id: cluster
        label: Redshift クラスター
        z: 1
        origin:
          - 1
          - 0
        size:
          - 10
          - 3
      - id: storage
        label: データ保持
        z: 0
        size:
          - 8
          - 3
      - id: implementation-setup
        label: 実装時の設定・観測
        z: 3
        size:
          - 18
          - 3
    groups:
      - kind: cloud
        label: AWS 分析アカウント
        provider: aws
        tier:
          - cluster
          - storage
          - implementation-setup
      - kind: vpc
        label: プライベート RA3 と S3 ゲートウェイエンドポイント
        tier:
          - cluster
          - implementation-setup
        nodes:
          - example-leader
          - example-compute
          - example-s3-endpoint
    nodes:
      example-client:
        label: VPC 接続済みの RSQL クライアント
        kind: external
        tier: edge
        x: 0
        'y': 1.5
        realizes:
          - client
        description: Redshift クラスターの SQL エンドポイントに接続する。
        evidence:
          - type: doc
            ref: docs/reference-redshift.md#§8
      example-bi:
        label: BI 担当者
        kind: actor
        tier: edge
        x: 10
        'y': 1.5
        realizes:
          - bi
        description: 集計済みの結果を参照する。
        evidence:
          - type: doc
            ref: docs/reference-redshift.md#§8
      example-leader:
        label: RA3 クラスターの Leader node
        kind: worker
        tier: cluster
        x: 1
        'y': 1.5
        realizes:
          - leader
        description: 実行計画を作り分散処理を調整する。
        evidence:
          - type: doc
            ref: docs/reference-redshift.md#§8
        svc: redshift
        management: {type: aws, scope: "AWS がリーダーノードを運用する。利用者は SQL とクラスター設定を操作し、ノードに直接ログインしない。"}
      example-compute:
        label: RA3 コンピュートノードとスライス
        kind: worker
        tier: cluster
        x: 5
        'y': 1.5
        realizes:
          - compute
          - slice
        description: 各ノード内の並列処理単位で計画の一部を実行する。
        evidence:
          - type: doc
            ref: docs/reference-redshift.md#§8
        svc: redshift
        management: {type: aws, scope: "AWS がコンピュートノードを運用する。利用者はノード数やタイプと SQL の設定を指定する。"}
      example-database:
        label: Redshift データベースと Redshift Managed Storage
        kind: table
        tier: storage
        x: 1
        'y': 1.5
        realizes:
          - database
          - rms
        description: 論理データベースのテーブルを管理ストレージ上に保持する。
        evidence:
          - type: doc
            ref: docs/reference-redshift.md#§8
        svc: redshift
        management: {type: shared, scope: "AWS が管理ストレージを運用し、利用者がテーブル、データとアクセス権を管理する。"}
      example-s3:
        label: Amazon S3 の着地ファイル
        kind: file
        tier: implementation-setup
        x: 1
        'y': 1.5
        svc: s3
        description: COPY に渡す受注ファイル。Redshift にアクセス可能な IAM ロールを関連付ける。
        evidence:
          - type: doc
            ref: docs/reference-redshift.md#§8
        management: {type: shared, scope: "AWS が S3 基盤を運用し、利用者がバケット、ファイルと権限を管理する。"}
      example-s3-endpoint:
        label: S3 ゲートウェイ VPC エンドポイント
        kind: gateway
        tier: implementation-setup
        x: 7
        'y': 1.5
        description: 拡張 VPC ルーティングを有効にした RA3 から同じリージョンの S3 に接続する。
        evidence:
          - type: doc
            ref: docs/reference-redshift.md#§8
        svc: vpcendpoint
        management: {type: shared, scope: "AWS が VPC エンドポイント基盤を運用し、利用者がルートとポリシーを設定する。"}
      example-copy-role:
        label: IAM（Redshift COPY 実行ロール）
        svc: iam
        kind: policy
        tier: implementation-setup
        x: 14
        'y': 1.5
        description: RA3 クラスターに関連付け、対象バケットの読み取りを許可する。
        evidence:
          - type: doc
            ref: docs/reference-redshift.md#§8
        management: {type: customer, scope: "利用者が IAM ロールを作成し、S3 読み取り権限を設定する。"}
    links:
      - id: example-s3-connection
        from: example-s3
        to: example-s3-endpoint
        label: COPY 対象のファイルを読み取る
        evidence:
          - type: doc
            ref: docs/reference-redshift.md#§8
      - id: example-copy
        from: example-s3-endpoint
        to: example-compute
        label: VPC 内の COPY 経路で読み込む
      - id: example-copy-store
        from: example-compute
        to: example-database
        label: Redshift の管理テーブルを読み書き
        realizes:
          - read-db
        replace: true
      - id: example-copy-policy
        from: example-copy-role
        to: example-leader
        label: COPY が使う S3 読取権限を付与

    layout2d:
      tiers:
        - {id: diagram, label: RA3 クラスターの構成, z: 0, size: [24, 13]}
      nodes:
        example-client: {tier: diagram, x: 1, y: 2}
        example-bi: {tier: diagram, x: 1, y: 8}
        example-leader: {tier: diagram, x: 7, y: 2}
        example-compute: {tier: diagram, x: 11, y: 5}
        example-s3-endpoint: {tier: diagram, x: 16, y: 2}
        example-copy-role: {tier: diagram, x: 7, y: 10}
        example-s3: {tier: diagram, x: 21, y: 2}
        example-database: {tier: diagram, x: 21, y: 7}
      groups:
        - {kind: cloud, label: AWS 分析アカウント（サービスの論理的所属）, provider: aws, tier: [diagram], x0: 4, y0: -0.5, x1: 23.5, y1: 12, nodes: [example-leader, example-compute, example-s3-endpoint, example-copy-role, example-s3, example-database]}
        - {kind: vpc, label: Redshift の利用者 VPC, provider: aws, tier: [diagram], x0: 4.5, y0: 0, x1: 18.5, y1: 8.5, nodes: [example-leader, example-compute, example-s3-endpoint]}
        - {kind: cluster, label: RA3 クラスター, tier: [diagram], x0: 4.7, y0: 0.3, x1: 13.5, y1: 7.5, nodes: [example-leader, example-compute]}
    layout3d:
      tiers:
        - {id: clients, label: クライアント, kind: origin, z: 0, origin: [-5, 0], size: [3, 7]}
        - {id: cluster, label: RA3 と VPC エンドポイント, z: 0, size: [14, 7]}
        - {id: services, label: 独立した保存と権限, z: 0, origin: [18, 0], size: [12, 7]}
      nodes:
        example-client: {tier: clients, x: 1, y: 1}
        example-bi: {tier: clients, x: 1, y: 5}
        example-leader: {tier: cluster, x: 2, y: 3}
        example-compute: {tier: cluster, x: 6, y: 3}
        example-s3-endpoint: {tier: cluster, x: 11, y: 3}
        example-s3: {tier: services, x: 2, y: 3}
        example-database: {tier: services, x: 6, y: 3}
        example-copy-role: {tier: services, x: 10, y: 3}
      groups:
        - {kind: cloud, label: AWS 分析アカウント（サービスの論理的所属）, provider: aws, tier: [cluster, services], nodes: [example-leader, example-compute, example-s3-endpoint, example-copy-role, example-s3, example-database]}
        - {kind: vpc, label: Redshift の利用者 VPC, provider: aws, tier: [cluster], nodes: [example-leader, example-compute, example-s3-endpoint]}
        - {kind: cluster, label: RA3 クラスター, tier: [cluster], nodes: [example-leader, example-compute]}
