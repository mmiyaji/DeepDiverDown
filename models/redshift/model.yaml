name: Amazon Redshift のクラスター・マネージドストレージアーキテクチャ
description: リーダーノードがクエリを計画し、コンピュートノードとスライスが並列処理してRMSへアクセスする流れです。
reference:
  objectives:
    - リーダーノードとコンピュートノードの役割を区別する。
    - スライスと分散スタイルが並列処理に関係することを理解する。
    - クエリがクライアントから計画、並列実行、集約へ進む流れを追う。
  sources:
    - {title: Amazon Redshift provisioned clusters overview, url: https://docs.aws.amazon.com/redshift/latest/mgmt/overview.html}
    - {title: Data warehouse system architecture, url: https://docs.aws.amazon.com/redshift/latest/dg/c_high_level_system_architecture.html}
    - {title: Architecture components of an Amazon Redshift data warehouse, url: https://docs.aws.amazon.com/prescriptive-guidance/latest/query-best-practices-redshift/data-warehouse-arch-components.html}
sources: [docs/reference-redshift.md]
evidence:
  - {type: doc, ref: docs/reference-redshift.md#§1}
  - {type: doc, ref: docs/reference-redshift.md#§6}
  - {type: doc, ref: docs/reference-redshift.md#§7}
tiers:
  - {id: edge, label: クライアントと利用者, z: 2, size: [12, 3]}
  - {id: cluster, label: Redshift クラスター, z: 1, origin: [1, 0], size: [10, 3]}
  - {id: storage, label: データ保持, z: 0, size: [8, 3]}
nodes:
  client: {label: SQL client, kind: external, tier: edge, x: 0, y: 1.5, description: SQLやBIツールからクエリを送る外部クライアント。, evidence: [{type: doc, ref: docs/reference-redshift.md#§1}]}
  bi: {label: BI user, kind: actor, tier: edge, x: 10, y: 1.5, description: 集約された分析結果を利用する利用者。, evidence: [{type: doc, ref: docs/reference-redshift.md#§6}]}
  leader: {label: Leader node, kind: worker, tier: cluster, x: 1, y: 1.5, description: SQLを解析・計画し、コンピュートノードを調整して結果を集約する。, evidence: [{type: doc, ref: docs/reference-redshift.md#§2}, {type: doc, ref: docs/reference-redshift.md#§3}]}
  compute: {label: Compute node, kind: worker, tier: cluster, x: 5, y: 1.5, description: リーダーから配布された計画を実行し、中間結果を返す。, evidence: [{type: doc, ref: docs/reference-redshift.md#§2}, {type: doc, ref: docs/reference-redshift.md#§4}]}
  slice: {label: Node slices, kind: worker, tier: cluster, x: 9, y: 1.5, description: コンピュートノード内でデータと処理を分担する並列実行単位。, evidence: [{type: doc, ref: docs/reference-redshift.md#§4}]}
  database: {label: Redshift database, kind: db, tier: storage, x: 1, y: 1.5, description: クラスター内のデータベース論理境界。, evidence: [{type: doc, ref: docs/reference-redshift.md#§2}, {type: doc, ref: docs/reference-redshift.md#§6}]}
  rms: {label: Redshift Managed Storage, kind: db, tier: storage, x: 6, y: 1.5, description: コンピュートから分離してデータを保持し、S3を使って拡張する管理ストレージ。, evidence: [{type: doc, ref: docs/reference-redshift.md#§5}]}
links:
  - {id: submit, from: client, to: leader, label: SQLを送信, evidence: [{type: doc, ref: docs/reference-redshift.md#§3}]}
  - {id: plan, from: leader, to: compute, label: 実行計画を配布, evidence: [{type: doc, ref: docs/reference-redshift.md#§3}]}
  - {id: parallel, from: compute, to: slice, label: スライスで並列実行, evidence: [{type: doc, ref: docs/reference-redshift.md#§4}]}
  - {id: read-db, from: slice, to: database, label: データを処理, evidence: [{type: doc, ref: docs/reference-redshift.md#§4}, {type: doc, ref: docs/reference-redshift.md#§6}]}
  - {id: read-rms, from: database, to: rms, label: RMSから読み書き, evidence: [{type: doc, ref: docs/reference-redshift.md#§5}]}
  - {id: intermediate, from: compute, to: leader, label: 中間結果を返す, evidence: [{type: doc, ref: docs/reference-redshift.md#§3}]}
  - {id: result, from: leader, to: bi, label: 集約結果を返す, evidence: [{type: doc, ref: docs/reference-redshift.md#§3}, {type: doc, ref: docs/reference-redshift.md#§6}]}
scenarios:
  - id: query
    label: クエリを並列実行する
    evidence: [{type: doc, ref: docs/reference-redshift.md#§2}, {type: doc, ref: docs/reference-redshift.md#§3}, {type: doc, ref: docs/reference-redshift.md#§4}, {type: doc, ref: docs/reference-redshift.md#§6}]
    steps:
      - {links: [submit], note: 受付。クライアントがリーダーノードへSQLを送る。}
      - {links: [plan], note: 計画。リーダーノードがSQLを解析し、実行計画をコンピュートノードへ配布する。}
      - {links: [parallel], note: 並列化。コンピュートノード内のスライスが担当範囲を処理する。}
      - {links: [read-db, read-rms], note: 読み取り。スライスがデータベースのデータを処理し、必要に応じてRMSへアクセスする。}
      - {links: [intermediate, result], note: 集約。中間結果をリーダーがまとめ、BI利用者へ返す。}
  - id: storage-scale
    label: ストレージを拡張する
    evidence: [{type: doc, ref: docs/reference-redshift.md#§5}]
    steps:
      - {links: [read-rms], note: 保持。データをRMSへ保持する。}
      - {links: [parallel], note: 計算。コンピュート側はクエリの並列処理を担当する。}
      - {links: [result], note: 独立。コンピュート容量とストレージ容量を別々の観点で扱う。}
requirements:
  - {id: BR-01, kind: usecase, title: 並列分析, text: リーダーが計画したクエリをコンピュートノードのスライスで並列実行する。, links: [plan, parallel, intermediate], evidence: [{type: doc, ref: docs/reference-redshift.md#§3}, {type: doc, ref: docs/reference-redshift.md#§4}]}
  - {id: NFR-01, kind: nfr, title: 管理ストレージ, text: データをRMSに保持し、計算とストレージを独立して扱う。, links: [read-rms], evidence: [{type: doc, ref: docs/reference-redshift.md#§5}]}
unknowns: [{id: UNK-01, text: 実際のリージョン、ノードタイプ、分散キー、ワークロード設定は未確定。, refs: [leader, compute, rms]}]
gates: {maxDrift: 0, maxHigh: 0}
