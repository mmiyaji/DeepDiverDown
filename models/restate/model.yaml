name: Restate の耐久実行とジャーナル
description: Restate Server が呼び出しを受け、ステップごとの結果をジャーナルに記録し、障害後に記録を再生してハンドラーを再開する流れを示す。
reference:
  objectives: [ジャーナルと再生で耐久実行が成り立つ仕組みを確認する, Service・Virtual Object・Workflow の違いを確認する, ログの複製とスナップショットの役割を確認する]
  sources:
    - {title: Restate Durable Execution, url: https://docs.restate.dev/concepts/durable_execution}
    - {title: Restate Services, url: https://docs.restate.dev/foundations/services}
    - {title: Restate Clusters, url: https://docs.restate.dev/operate/clusters}
    - {title: Restate GitHub LICENSE, url: https://github.com/restatedev/restate/blob/main/LICENSE}
sources: [docs/reference-restate.md]
evidence: [{type: doc, ref: "docs/reference-restate.md#§1"}, {type: doc, ref: "docs/reference-restate.md#§4"}]
tiers:
  - {id: flow, label: 呼び出し・実行・保存, z: 0, size: [32, 13]}
nodes:
  client: {label: クライアント, kind: client, tier: flow, x: 1, y: 6, description: HTTP などで呼び出しを送る。Kafka やプログラムからの起動もある。, evidence: [{type: doc, ref: "docs/reference-restate.md#§1"}]}
  ingress: {label: HTTP インジェスト, kind: service, tier: flow, x: 6, y: 6, description: 呼び出しを受け付ける。冪等キーで重複した要求は元の結果を返す。, evidence: [{type: doc, ref: "docs/reference-restate.md#§1"}]}
  proc: {label: パーティション処理, kind: service, tier: flow, x: 12, y: 6, description: 呼び出しの進行を追い、ジャーナルを記録し、失敗時に再試行する。内部の部品名は未確認。, evidence: [{type: doc, ref: "docs/reference-restate.md#§1"}]}
  admin: {label: 管理とサービス登録, kind: service, tier: flow, x: 12, y: 1.5, description: サービスのデプロイを検出して登録する。手順は未確認。, evidence: [{type: doc, ref: "docs/reference-restate.md#§5"}]}
  meta: {label: メタデータサーバー, kind: db, tier: flow, x: 12, y: 11, description: クラスタの構成情報を持つ。n 台の障害に耐えるには 2n+1 ノード必要。, evidence: [{type: doc, ref: "docs/reference-restate.md#§3"}]}
  service: {label: SDK サービス, kind: worker, tier: flow, x: 19, y: 1.5, description: SDK を組み込んだ Service・Virtual Object・Workflow のハンドラー。状態を持たなくてよい。, evidence: [{type: doc, ref: "docs/reference-restate.md#§2"}]}
  log: {label: 複製ログ, kind: queue, tier: flow, x: 19, y: 5, description: パーティションごとのログ。書き込みは定足数で複製する。, evidence: [{type: doc, ref: "docs/reference-restate.md#§3"}]}
  state: {label: 実行履歴と状態, kind: db, tier: flow, x: 19, y: 9, description: ジャーナルと Virtual Object・Workflow のキー値状態を保持する。保存形式は未確認。, evidence: [{type: doc, ref: "docs/reference-restate.md#§1"}]}
  ext: {label: 外部 API・DB, kind: external, tier: flow, x: 26, y: 1.5, description: ハンドラーが副作用として呼ぶ先。結果はジャーナルに記録される。, evidence: [{type: doc, ref: "docs/reference-restate.md#§1"}]}
  snap: {label: スナップショット, kind: db, tier: flow, x: 26, y: 9, description: S3 互換の保存先に置く。ログの切り詰めとノード追加に使う。, evidence: [{type: doc, ref: "docs/reference-restate.md#§3"}]}
links:
  - {id: c-ingress, from: client, to: ingress, label: 呼び出しを送信, evidence: [{type: doc, ref: "docs/reference-restate.md#§1"}]}
  - {id: ingress-proc, from: ingress, to: proc, label: 呼び出しを渡す, evidence: [{type: doc, ref: "docs/reference-restate.md#§1"}]}
  - {id: proc-log, from: proc, to: log, label: イベントを追記, evidence: [{type: doc, ref: "docs/reference-restate.md#§3"}]}
  - {id: proc-state, from: proc, to: state, label: 履歴と状態を保存, evidence: [{type: doc, ref: "docs/reference-restate.md#§1"}]}
  - {id: proc-snap, from: proc, to: snap, label: スナップショットを保存, evidence: [{type: doc, ref: "docs/reference-restate.md#§3"}]}
  - {id: proc-invoke, from: proc, to: service, label: ジャーナルと状態を添えて実行を依頼, evidence: [{type: doc, ref: "docs/reference-restate.md#§1"}]}
  - {id: svc-journal, from: service, to: proc, label: ステップの結果を記録, evidence: [{type: doc, ref: "docs/reference-restate.md#§1"}]}
  - {id: svc-ext, from: service, to: ext, label: 副作用を実行, evidence: [{type: doc, ref: "docs/reference-restate.md#§1"}]}
  - {id: admin-svc, from: admin, to: service, label: デプロイを検出, evidence: [{type: doc, ref: "docs/reference-restate.md#§5"}]}
  - {id: meta-proc, from: meta, to: proc, label: 構成情報を提供, evidence: [{type: doc, ref: "docs/reference-restate.md#§3"}]}
scenarios:
  - id: crash-and-resume
    label: ハンドラーが途中で止まり、記録から再開する
    evidence: [{type: doc, ref: "docs/reference-restate.md#§1"}]
    steps:
      - {links: [c-ingress, ingress-proc, proc-invoke], note: 呼び出しを受け、サービスへ実行を依頼する。}
      - {links: [svc-ext, svc-journal, proc-log], note: 副作用を実行し、結果をジャーナルに記録する。ここでサービスが止まる。}
      - {links: [proc-invoke, svc-journal], note: 別のインスタンスへ記録済みのジャーナルを添えて再依頼する。完了済みのステップは再実行せず、続きから進む。}
unknowns:
  - {id: UNK-01, text: パーティション処理の内部部品（Invoker など）と状態の保存形式は取得した資料に記載がなく未確認。, refs: [proc, state]}
  - {id: UNK-02, text: サービス登録（discovery）の手順と SDK とのプロトコルの詳細は未確認。, refs: [admin, service]}
  - {id: UNK-03, text: 版ごとの機能差と Restate Cloud の仕様は未確認。, refs: [proc]}
gates: {maxDrift: 0, maxHigh: 0}
implementations:
  - id: self-hosted-cluster
    label: 自前の Linux 上の Restate クラスタ
    description: Restate Server の worker・log-server・http-ingress・admin の役割を自前ホストで動かし、SDK サービスを別のデプロイに置き、スナップショットを S3 互換ストレージへ保存する例。代表例であり、導入事例ではない。
    sources:
      - {title: Restate Clusters, url: https://docs.restate.dev/operate/clusters}
      - {title: Restate Durable Execution, url: https://docs.restate.dev/concepts/durable_execution}
    tiers:
      - {id: diagram, label: 呼び出し・Restate・保存, z: 0, size: [32, 13]}
    nodes:
      rs-client: {label: クライアント, kind: client, tier: diagram, x: 1, y: 6, realizes: [client], description: HTTP クライアント。, evidence: [{type: doc, ref: "docs/reference-restate.md#§6"}]}
      rs-server: {label: Restate Server ノード群, kind: service, tier: diagram, x: 9, y: 6, realizes: [ingress, proc, log, state, admin], description: worker・log-server・http-ingress・admin の役割を動かし、ジャーナルと状態を保持する。, management: {type: customer, scope: "Customer operates the host, process and configuration."}, evidence: [{type: doc, ref: "docs/reference-restate.md#§6"}]}
      rs-meta: {label: metadata-server ロールのノード, kind: db, tier: diagram, x: 9, y: 11, realizes: [meta], description: クラスタの構成情報を保持する。, management: {type: customer, scope: "Customer operates the host, process and configuration."}, evidence: [{type: doc, ref: "docs/reference-restate.md#§6"}]}
      rs-svc: {label: SDK サービスのデプロイ, kind: worker, tier: diagram, x: 18, y: 2, realizes: [service], description: SDK を組み込んだハンドラー。, management: {type: customer, scope: "Customer operates the host, process and configuration."}, evidence: [{type: doc, ref: "docs/reference-restate.md#§6"}]}
      rs-snap: {label: S3 互換ストレージ, kind: db, tier: diagram, x: 18, y: 9, realizes: [snap], description: スナップショットの保存先。共有ファイルシステムは対象外。, management: {type: customer, scope: "Customer operates the storage and access."}, evidence: [{type: doc, ref: "docs/reference-restate.md#§6"}]}
      rs-ext: {label: 外部 API・DB, kind: external, tier: diagram, x: 26, y: 2, realizes: [ext], description: 副作用の呼び出し先。, evidence: [{type: doc, ref: "docs/reference-restate.md#§6"}]}
    links:
      - {id: rs-c, from: rs-client, to: rs-server, label: 呼び出しを送信, evidence: [{type: doc, ref: "docs/reference-restate.md#§6"}]}
      - {id: rs-inv, from: rs-server, to: rs-svc, label: ジャーナルを添えて実行を依頼, evidence: [{type: doc, ref: "docs/reference-restate.md#§6"}]}
      - {id: rs-j, from: rs-svc, to: rs-server, label: ステップの結果を記録, evidence: [{type: doc, ref: "docs/reference-restate.md#§6"}]}
      - {id: rs-x, from: rs-svc, to: rs-ext, label: 副作用を実行, evidence: [{type: doc, ref: "docs/reference-restate.md#§6"}]}
      - {id: rs-s, from: rs-server, to: rs-snap, label: スナップショットを保存, evidence: [{type: doc, ref: "docs/reference-restate.md#§6"}]}
      - {id: rs-m, from: rs-meta, to: rs-server, label: 構成情報を提供, evidence: [{type: doc, ref: "docs/reference-restate.md#§6"}]}
    groups:
      - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [rs-server, rs-meta, rs-svc, rs-snap]}
    layout2d:
      tiers:
        - {id: diagram, label: 呼び出し・Restate・保存, z: 0, size: [32, 13]}
      nodes:
        rs-client: {tier: diagram, x: 1, y: 6}
        rs-server: {tier: diagram, x: 9, y: 6}
        rs-meta: {tier: diagram, x: 9, y: 11}
        rs-svc: {tier: diagram, x: 18, y: 2}
        rs-snap: {tier: diagram, x: 18, y: 9}
        rs-ext: {tier: diagram, x: 26, y: 2}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [rs-server, rs-meta, rs-svc, rs-snap]}
    layout3d:
      tiers:
        - {id: clients, label: 呼び出し元, z: 0, size: [6, 13]}
        - {id: servers, label: Restate・サービス・保存, z: 0, origin: [8, 0], size: [20, 13]}
        - {id: outside, label: 外部の呼び出し先, z: 0, origin: [30, 0], size: [5, 13]}
      nodes:
        rs-client: {tier: clients, x: 3, y: 6}
        rs-server: {tier: servers, x: 2, y: 6}
        rs-meta: {tier: servers, x: 2, y: 11}
        rs-svc: {tier: servers, x: 11, y: 2}
        rs-snap: {tier: servers, x: 11, y: 9}
        rs-ext: {tier: outside, x: 2, y: 2}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: [servers], nodes: [rs-server, rs-meta, rs-svc, rs-snap]}
