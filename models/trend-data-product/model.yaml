name: データプロダクトの公開と利用
description: 用途ごとのデータ資産、説明、契約と権限申請をまとめて利用者へ提供する。
reference:
  objectives:
    - データ資産とカタログの登録を区別する。
    - 利用契約の確認とアクセス申請を追う。
    - 契約の記述と実際の監視・権限を区別する。
  sources:
    - title: Gartner 2025 Data & Analytics trends
      url: >-
        https://www.gartner.com/en/newsroom/press-releases/2025-03-05-gartner-identifies-top-trends-in-data-and-analytics-for-2025
    - title: Google Cloud data products
      url: https://docs.cloud.google.com/knowledge-catalog/docs/data-products-overview
    - title: Use data products
      url: https://docs.cloud.google.com/knowledge-catalog/docs/use-data-products
sources:
  - docs/reference-trend-data-product.md
evidence:
  - type: doc
    ref: docs/reference-trend-data-product.md#§1
  - type: doc
    ref: docs/reference-trend-data-product.md#§3
tiers:
  - id: flow
    label: 問い合わせと利用
    z: 1
    size:
      - 20
      - 3
  - id: definition
    label: 定義とデータ
    z: 0
    size:
      - 20
      - 3
nodes:
  user:
    label: データ利用者
    kind: actor
    tier: flow
    x: 0
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-trend-data-product.md#§2
  catalog:
    label: データプロダクト
    kind: service
    tier: flow
    x: 4
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-trend-data-product.md#§2
  access:
    label: アクセス申請と承認
    kind: service
    tier: flow
    x: 8
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-trend-data-product.md#§2
  asset:
    label: 提供するデータ資産
    kind: db
    tier: flow
    x: 12
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-trend-data-product.md#§2
  owner:
    label: プロダクト所有者
    kind: actor
    tier: definition
    x: 0
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-trend-data-product.md#§2
  contract:
    label: 説明とデータ契約
    kind: file
    tier: definition
    x: 4
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-trend-data-product.md#§2
links:
  - id: find
    from: user
    to: catalog
    label: 発見して内容を確認
    evidence:
      - type: doc
        ref: docs/reference-trend-data-product.md#§2
  - id: request
    from: catalog
    to: access
    label: アクセスを申請
    evidence:
      - type: doc
        ref: docs/reference-trend-data-product.md#§2
  - id: read
    from: user
    to: asset
    label: 承認後にデータを利用
    evidence:
      - type: doc
        ref: docs/reference-trend-data-product.md#§2
  - id: grant
    from: access
    to: asset
    label: 資産への権限を設定
    evidence:
      - type: doc
        ref: docs/reference-trend-data-product.md#§2
  - id: publish
    from: owner
    to: catalog
    label: 資産を登録
    evidence:
      - type: doc
        ref: docs/reference-trend-data-product.md#§2
  - id: define
    from: owner
    to: contract
    label: 契約を定義
    evidence:
      - type: doc
        ref: docs/reference-trend-data-product.md#§2
  - id: describe
    from: contract
    to: catalog
    label: 条件と説明を公開
    evidence:
      - type: doc
        ref: docs/reference-trend-data-product.md#§2
scenarios:
  - id: main-flow
    label: 処理の流れ
    evidence:
      - type: doc
        ref: docs/reference-trend-data-product.md#§2
    steps:
      - links:
          - publish
          - define
          - describe
        note: 所有者が資産と契約を登録する。
      - links:
          - find
          - request
          - grant
        note: 利用者が内容を確認しアクセスを申請する。
      - links:
          - read
        note: 承認後に権限を使って資産を利用する。
implementations:
  - id: example
    label: Knowledge Catalog と BigQuery
    description: Knowledge Catalog で BigQuery の資産と契約をまとめ、利用者がアクセスを申請する。
    sources:
      - title: Gartner 2025 Data & Analytics trends
        url: >-
          https://www.gartner.com/en/newsroom/press-releases/2025-03-05-gartner-identifies-top-trends-in-data-and-analytics-for-2025
      - title: Google Cloud data products
        url: https://docs.cloud.google.com/knowledge-catalog/docs/data-products-overview
      - title: Use data products
        url: https://docs.cloud.google.com/knowledge-catalog/docs/use-data-products
      - title: Manage data products
        url: https://docs.cloud.google.com/knowledge-catalog/docs/manage-data-products
      - title: Run a query in BigQuery
        url: https://docs.cloud.google.com/bigquery/docs/running-queries
    tiers:
      - id: flow
        label: 問い合わせと利用
        z: 1
        size:
          - 20
          - 3
      - id: definition
        label: 定義とデータ
        z: 0
        size:
          - 20
          - 3
    nodes:
      ex-user:
        label: データ利用者
        kind: actor
        tier: flow
        x: 0
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-trend-data-product.md#§4
        realizes:
          - user
      ex-catalog:
        label: Knowledge Catalog データプロダクト
        kind: service
        tier: flow
        x: 4
        'y': 1.5
        svc: gcp:knowledgecatalog
        evidence:
          - type: doc
            ref: docs/reference-trend-data-product.md#§4
        realizes:
          - catalog
      ex-access:
        label: Knowledge Catalog アクセス申請
        kind: service
        tier: flow
        x: 8
        'y': 1.5
        svc: gcp:knowledgecatalog
        evidence:
          - type: doc
            ref: docs/reference-trend-data-product.md#§4
        realizes:
          - access
      ex-asset:
        label: BigQuery 管理テーブル
        kind: db
        tier: flow
        x: 12
        'y': 1.5
        svc: gcp:bigquery
        evidence:
          - type: doc
            ref: docs/reference-trend-data-product.md#§4
        realizes:
          - asset
      ex-group:
        label: アクセス用 Google グループ
        kind: policy
        tier: definition
        x: 9
        'y': 1.5
        description: 承認された利用者をメンバーに追加する。このグループに対象テーブルの閲覧権限を設定する。
        evidence:
          - type: doc
            ref: docs/reference-trend-data-product.md#§4
      ex-job:
        label: BigQuery クエリジョブ
        kind: service
        tier: flow
        x: 16
        'y': 1.5
        svc: gcp:bigquery
        description: 利用側プロジェクトで起動し、資産 IAM に従って提供側のテーブルを読む。
        evidence:
          - type: doc
            ref: docs/reference-trend-data-product.md#§4
      ex-owner:
        label: プロダクト所有者
        kind: actor
        tier: definition
        x: 0
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-trend-data-product.md#§4
        realizes:
          - owner
      ex-contract:
        label: 契約と説明
        kind: file
        tier: definition
        x: 4
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-trend-data-product.md#§4
        realizes:
          - contract
    links:
      - id: ex-approve
        from: ex-access
        to: ex-group
        label: 承認した利用者をグループに追加
        realizes:
          - grant
        replace: true
        evidence:
          - type: doc
            ref: docs/reference-trend-data-product.md#§4
      - id: ex-asset-iam
        from: ex-group
        to: ex-asset
        label: グループにデータ閲覧権限を設定
        realizes:
          - grant
        replace: true
        evidence:
          - type: doc
            ref: docs/reference-trend-data-product.md#§4
      - id: ex-start-job
        from: ex-user
        to: ex-job
        label: 利用側でクエリジョブを作成
        realizes:
          - read
        replace: true
        evidence:
          - type: doc
            ref: docs/reference-trend-data-product.md#§4
      - id: ex-reading
        from: ex-job
        to: ex-asset
        label: 認可された注文データを読む
        realizes:
          - read
        replace: true
        evidence:
          - type: doc
            ref: docs/reference-trend-data-product.md#§4
    groups:
      - kind: cloud
        provider: gcp
        label: 提供側 Google Cloud プロジェクト
        tier:
          - flow
        nodes:
          - ex-catalog
          - ex-access
          - ex-asset
      - kind: cloud
        provider: gcp
        label: 利用側 Google Cloud プロジェクト
        tier:
          - flow
        nodes:
          - ex-job
      - kind: cloud
        provider: gcp
        label: 提供側 Google Cloud プロジェクト
        tier:
          - definition
        nodes:
          - ex-contract
    layout2d:
      tiers:
        - {id: diagram, label: データプロダクト, z: 0, size: [27, 12]}
      nodes:
        ex-user: {tier: diagram, x: 2, y: 2}
        ex-owner: {tier: diagram, x: 8, y: 2}
        ex-catalog: {tier: diagram, x: 14, y: 2}
        ex-access: {tier: diagram, x: 20, y: 2}
        ex-contract: {tier: diagram, x: 2, y: 6}
        ex-asset: {tier: diagram, x: 8, y: 6}
        ex-group: {tier: diagram, x: 14, y: 6}
        ex-job: {tier: diagram, x: 20, y: 6}
      groups:
        - {kind: cloud, provider: gcp, label: 提供側 Google Cloud プロジェクト, tier: [diagram], nodes: [ex-catalog, ex-access, ex-contract, ex-asset]}
        - {kind: cloud, provider: gcp, label: 利用側 Google Cloud プロジェクト, tier: [diagram], nodes: [ex-job]}
    layout3d:
      tiers:
        - {id: diagram, label: データプロダクト, z: 0, size: [27, 12]}
      nodes:
        ex-user: {tier: diagram, x: 2, y: 2}
        ex-owner: {tier: diagram, x: 8, y: 2}
        ex-catalog: {tier: diagram, x: 14, y: 2}
        ex-access: {tier: diagram, x: 20, y: 2}
        ex-contract: {tier: diagram, x: 2, y: 6}
        ex-asset: {tier: diagram, x: 8, y: 6}
        ex-group: {tier: diagram, x: 14, y: 6}
        ex-job: {tier: diagram, x: 20, y: 6}
      groups:
        - {kind: cloud, provider: gcp, label: 提供側 Google Cloud プロジェクト, tier: [diagram], nodes: [ex-catalog, ex-access, ex-contract, ex-asset]}
        - {kind: cloud, provider: gcp, label: 利用側 Google Cloud プロジェクト, tier: [diagram], nodes: [ex-job]}
