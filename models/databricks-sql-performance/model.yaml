name: Databricks SQL の実行プロファイルとファイル配置
description: SQL Warehouse で実行し、スキャン、シャッフル、キューのどこに時間がかかるかを切り分ける。
parent:
  model: databricks
  node: query
reference:
  objectives:
    - ストレージの配置と、実行コンピュートの選び方を区別する。
    - SQL の実行プロファイルでスキャンとシャッフルを比較する。
  sources:
    - title: SQL Warehouse の種類
      url: https://docs.databricks.com/aws/en/compute/sql-warehouse/warehouse-types
    - title: Photon
      url: https://docs.databricks.com/aws/en/compute/photon
    - title: クエリプロファイル
      url: https://docs.databricks.com/aws/en/sql/user/queries/query-profile
    - title: Liquid clustering
      url: https://docs.databricks.com/aws/en/tables/clustering
    - title: Predictive optimization
      url: https://docs.databricks.com/aws/en/optimizations/predictive-optimization
sources:
  - docs/reference-databricks-sql-performance.md
evidence:
  - type: doc
    ref: docs/reference-databricks-sql-performance.md#§1
tiers:
  - id: flow
    label: 構成と処理の流れ
    z: 0
    size:
      - 14.5
      - 4.5
nodes:
  bi:
    label: 注文集計 SQL
    kind: client
    tier: flow
    x: 0
    'y': 2
    description: 条件付き集計を送信。
    evidence:
      - type: doc
        ref: docs/reference-databricks-sql-performance.md#§1
  warehouse:
    label: SQL 実行の計算資源
    kind: service
    tier: flow
    x: 3
    'y': 2
    description: 処理需要に合わせる実行先。
    evidence:
      - type: doc
        ref: docs/reference-databricks-sql-performance.md#§2
  engine:
    label: 最適化された演算エンジン
    kind: worker
    tier: flow
    x: 6
    'y': 2
    description: 対応するスキャンや結合を処理。
    parallel: 'N'
    evidence:
      - type: doc
        ref: docs/reference-databricks-sql-performance.md#§2
  scan:
    label: 列指向テーブルのデータファイル
    kind: db
    tier: flow
    x: 10
    'y': 0
    description: 配置と統計が読み取りに影響。
    evidence:
      - type: doc
        ref: docs/reference-databricks-sql-performance.md#§4
  shuffle:
    label: 結合・再分配
    kind: worker
    tier: flow
    x: 10
    'y': 4
    description: 結合時に必要なら行を集め直す。
    evidence:
      - type: doc
        ref: docs/reference-databricks-sql-performance.md#§3
  profile:
    label: クエリの演算子プロファイル
    kind: service
    tier: flow
    x: 14
    'y': 2
    description: 演算子の時間やデータ量を確認。
    evidence:
      - type: doc
        ref: docs/reference-databricks-sql-performance.md#§3
  optimizer:
    label: テーブル保守
    kind: worker
    tier: flow
    x: 14
    'y': 0
    description: クラスタリングなどの配置の調整。
    evidence:
      - type: doc
        ref: docs/reference-databricks-sql-performance.md#§4
links:
  - id: submit
    from: bi
    to: warehouse
    label: SQL を発行
    evidence:
      - type: doc
        ref: docs/reference-databricks-sql-performance.md#§1
  - id: execute
    from: warehouse
    to: engine
    label: 実行枠を割り当て
    evidence:
      - type: doc
        ref: docs/reference-databricks-sql-performance.md#§2
  - id: read
    from: engine
    to: scan
    label: 候補ファイルと列を読む
    evidence:
      - type: doc
        ref: docs/reference-databricks-sql-performance.md#§4
  - id: join
    from: engine
    to: shuffle
    label: 結合データの再分配
    evidence:
      - type: doc
        ref: docs/reference-databricks-sql-performance.md#§3
  - id: observe
    from: shuffle
    to: profile
    label: 演算子の指標を確認
    evidence:
      - type: doc
        ref: docs/reference-databricks-sql-performance.md#§3
  - id: scan-profile
    from: scan
    to: profile
    label: スキャンの作業量を確認
    evidence:
      - type: doc
        ref: docs/reference-databricks-sql-performance.md#§3
  - id: maintain
    from: optimizer
    to: scan
    label: 表の配置やファイルを保守
    evidence:
      - type: doc
        ref: docs/reference-databricks-sql-performance.md#§4
scenarios:
  - id: plan
    label: 日付を絞った集計でスキャンを確認
    evidence:
      - type: doc
        ref: docs/reference-databricks-sql-performance.md#§3
    steps:
      - links:
          - submit
          - execute
        note: 同じ条件でクエリを実行し、実行時の条件を揃える。
      - links:
          - read
          - scan-profile
        note: スキャンの作業量をプロファイルで確認する。
      - links:
          - maintain
          - read
        note: 配置の保守後に同条件で再計測し、読んだ量の違いを見る。
  - id: join
    label: 結合の待ちと再分配を調べる
    evidence:
      - type: doc
        ref: docs/reference-databricks-sql-performance.md#§3
    steps:
      - links:
          - submit
          - execute
        note: 複数のテーブルを使う集計を実行する。
      - links:
          - join
          - observe
        note: 再分配が大きい演算子と入力行数を調べ、次に見直す条件を決める。
implementations:
  - id: databricks-sql-serverless
    label: Databricks Serverless SQL のクエリ調査
    description: 注文の管理 Delta テーブルを Serverless SQL Warehouse で読み、Query Profile と履歴を使って改善前後を調べる例。
    sources:
      - title: SQL Warehouse の種類
        url: https://docs.databricks.com/aws/en/compute/sql-warehouse/warehouse-types
      - title: Photon
        url: https://docs.databricks.com/aws/en/compute/photon
      - title: クエリプロファイル
        url: https://docs.databricks.com/aws/en/sql/user/queries/query-profile
      - title: Liquid clustering
        url: https://docs.databricks.com/aws/en/tables/clustering
      - title: Predictive optimization
        url: https://docs.databricks.com/aws/en/optimizations/predictive-optimization
      - title: Query history system table
        url: https://docs.databricks.com/aws/en/admin/system-tables/query-history
      - {title: Databricks deployment architecture, url: https://docs.databricks.com/aws/en/security/network/deployment-architecture/}
      - {title: Unity Catalog managed storage, url: https://docs.databricks.com/aws/en/connect/unity-catalog/cloud-storage/managed-storage}
    tiers:
      - id: flow
        label: 構成と処理の流れ
        z: 0
        size:
          - 14.5
          - 4.5
      - id: implementation-setup
        label: 実装時の設定・観測
        z: 1
        size:
          - 8
          - 3
    nodes:
      example-user: {label: SQL analyst, kind: client, tier: flow, x: -2, y: 9, evidence: [{type: doc, ref: "docs/reference-databricks-sql-performance.md#§5"}]}
      example-serverless: {label: Databricks serverless compute plane, kind: host, tier: flow, x: 11, y: 5, evidence: [{type: doc, ref: "docs/reference-databricks-sql-performance.md#§5"}]}
      example-s3: {label: Customer S3 managed storage, svc: s3, kind: db, tier: flow, x: 22, y: 1, management: {type: shared, scope: "AWS operates S3; customer manages storage and access."}, evidence: [{type: doc, ref: "docs/reference-databricks-sql-performance.md#§5"}]}
      example-iam: {label: IAM storage role, svc: iam, kind: policy, tier: flow, x: 22, y: 5, management: {type: customer, scope: "Customer manages permissions and trust."}, evidence: [{type: doc, ref: "docs/reference-databricks-sql-performance.md#§5"}]}
      example-bi:
        label: Databricks SQL Editor
        kind: client
        tier: flow
        x: 3
        y: 1
        realizes:
          - bi
        description: 条件と集計が明示された注文クエリを実行する。
        evidence:
          - type: doc
            ref: docs/reference-databricks-sql-performance.md#§5
        svc: databricks:sql
      example-warehouse:
        label: Serverless SQL Warehouse と Photon
        kind: service
        tier: flow
        x: 7
        y: 1
        realizes:
          - warehouse
          - engine
          - shuffle
        description: 対応するスキャン・結合を処理し、必要な並列実行と再分配をサービス側で行う。
        evidence:
          - type: doc
            ref: docs/reference-databricks-sql-performance.md#§5
        svc: databricks:sql
      example-scan:
        label: Unity Catalog 管理 Delta テーブル
        kind: db
        tier: flow
        x: 11
        y: 1
        realizes:
          - scan
        description: 注文日の絞り込みに利用できる統計とファイルを持つ。
        evidence:
          - type: doc
            ref: docs/reference-databricks-sql-performance.md#§5
        svc: databricks:delta
      example-profile:
        label: Databricks Query Profile
        kind: service
        tier: flow
        x: 15
        y: 1
        realizes:
          - profile
        description: 時間や読み取り行数などの演算子指標を確認する。
        evidence:
          - type: doc
            ref: docs/reference-databricks-sql-performance.md#§5
        svc: databricks:sql
      example-optimizer:
        label: Liquid Clustering のテーブル設定
        kind: worker
        tier: flow
        x: 3
        y: 5
        realizes:
          - optimizer
        description: 注文日などのアクセス条件を踏まえてクラスタリング方法を選ぶ。
        evidence:
          - type: doc
            ref: docs/reference-databricks-sql-performance.md#§5
        svc: databricks:delta
      example-history:
        label: system.query.history
        kind: service
        tier: flow
        x: 7
        y: 5
        description: 比較対象のクエリ識別子や実行指標を SQL で調べる。
        evidence:
          - type: doc
            ref: docs/reference-databricks-sql-performance.md#§5
    links:
      - {id: example-user-editor, from: example-user, to: example-bi, label: "Run SQL in editor", evidence: [{type: doc, ref: "docs/reference-databricks-sql-performance.md#§5"}]}
      - {id: example-serverless-run, from: example-serverless, to: example-warehouse, label: "Run SQL warehouse", evidence: [{type: doc, ref: "docs/reference-databricks-sql-performance.md#§5"}]}
      - {id: example-managed-files, from: example-scan, to: example-s3, label: "Store Delta table files", evidence: [{type: doc, ref: "docs/reference-databricks-sql-performance.md#§5"}]}
      - {id: example-role-access, from: example-iam, to: example-s3, label: "Authorize storage access", evidence: [{type: doc, ref: "docs/reference-databricks-sql-performance.md#§5"}]}
      - id: example-history-connection
        from: example-history
        to: example-profile
        label: 調査対象の実行を照合
        evidence:
          - type: doc
            ref: docs/reference-databricks-sql-performance.md#§5
    groups:
      - {kind: cloud, provider: databricks, label: Databricks workspace and serverless, tier: flow, nodes: [example-bi, example-warehouse, example-scan, example-profile, example-optimizer, example-history, example-serverless]}
      - {kind: cloud, provider: aws, label: Customer AWS account, tier: flow, nodes: [example-s3, example-iam]}
    layout2d:
      tiers: [{id: diagram, label: SQL and storage, z: 0, size: [27, 12]}]
      nodes:
        example-bi: {tier: diagram, x: 3, y: 1}
        example-warehouse: {tier: diagram, x: 7, y: 1}
        example-scan: {tier: diagram, x: 11, y: 1}
        example-profile: {tier: diagram, x: 15, y: 1}
        example-optimizer: {tier: diagram, x: 3, y: 5}
        example-history: {tier: diagram, x: 7, y: 5}
        example-serverless: {tier: diagram, x: 11, y: 5}
        example-s3: {tier: diagram, x: 22, y: 1}
        example-iam: {tier: diagram, x: 22, y: 5}
        example-user: {tier: diagram, x: 0, y: 9}
      groups:
        - {kind: cloud, provider: databricks, label: Databricks workspace and serverless, tier: diagram, nodes: [example-bi, example-warehouse, example-scan, example-profile, example-optimizer, example-history, example-serverless]}
        - {kind: cloud, provider: aws, label: Customer AWS account, tier: diagram, nodes: [example-s3, example-iam]}
    layout3d:
      tiers:
        - {id: workspace, label: SQL and workspace, z: 1, size: [16, 6]}
        - {id: compute, label: Serverless compute plane, z: 0, size: [16, 6]}
        - {id: customer, label: Customer AWS account, z: 0, origin: [19, 0], size: [8, 3]}
        - {id: user, label: Analyst, kind: origin, z: 0, origin: [-4, 0], size: [2, 3]}
      nodes:
        example-bi: {tier: workspace, x: 2, y: 1}
        example-warehouse: {tier: workspace, x: 6, y: 1}
        example-scan: {tier: workspace, x: 10, y: 1}
        example-profile: {tier: workspace, x: 14, y: 1}
        example-optimizer: {tier: workspace, x: 2, y: 4}
        example-history: {tier: workspace, x: 6, y: 4}
        example-serverless: {tier: compute, x: 6, y: 1.5}
        example-s3: {tier: customer, x: 2, y: 1.5}
        example-iam: {tier: customer, x: 6, y: 1.5}
        example-user: {tier: user, x: 0, y: 1.5}
      groups:
        - {kind: cloud, provider: databricks, label: Databricks workspace and serverless, tier: [workspace, compute], nodes: [example-bi, example-warehouse, example-scan, example-profile, example-optimizer, example-history, example-serverless]}
        - {kind: cloud, provider: aws, label: Customer AWS account, tier: customer, nodes: [example-s3, example-iam]}
