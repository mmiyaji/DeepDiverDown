name: Iceberg REST Catalog の基本アーキテクチャ
description: SQL エンジンが共通 REST API で Iceberg テーブルを解決し、ストレージを読み書きする流れを追います。
reference:
  objectives:
    - REST Catalog API がクライアントとカタログ実装を分離することを理解する。
    - カタログによるテーブル解決とストレージ直接読み取りを区別する。
    - change-based commit と競合解消の役割を説明する。
  sources:
    - {title: Apache Iceberg REST Catalog Spec, url: https://iceberg.apache.org/rest-catalog-spec/}
    - {title: Apache Iceberg REST Catalog Guide, url: https://iceberg.apache.org/docs/latest/rest-catalog/}
sources: [docs/reference-iceberg-rest-catalog.md]
evidence: [{type: doc, ref: docs/reference-iceberg-rest-catalog.md#§1}]
tiers:
  - {id: client, label: クライアント, z: 1, size: [2,3]}
  - {id: service, label: カタログサービス, z: 1, origin: [2,0], size: [11,3]}
  - {id: storage, label: オブジェクトストレージ, z: 0, origin: [1,0], size: [14,3]}
nodes:
  engine: {label: SQL エンジン, kind: service, tier: client, x: 0, y: 1.5, description: REST API でテーブルを解決し、データを読む。, evidence: [{type: doc, ref: docs/reference-iceberg-rest-catalog.md#§1}]}
  api: {label: REST Catalog API, kind: service, tier: service, x: 4, y: 1.5, description: Iceberg Catalog の共通 HTTP API。, evidence: [{type: doc, ref: docs/reference-iceberg-rest-catalog.md#§1}]}
  catalog: {label: Catalog Server, kind: service, tier: service, x: 7, y: 1.5, description: 識別子解決とコミット競合の調停を担う。, evidence: [{type: doc, ref: docs/reference-iceberg-rest-catalog.md#§2}]}
  metadata: {label: Iceberg Metadata, kind: db, tier: storage, x: 10, y: 0.5, description: テーブルメタデータとスナップショットへの参照。, evidence: [{type: doc, ref: docs/reference-iceberg-rest-catalog.md#§3}]}
  data: {label: Manifest / Data Files, kind: db, shape3D: crate, tier: storage, x: 13, y: 1.5, description: カタログが返した場所から読む実体。, evidence: [{type: doc, ref: docs/reference-iceberg-rest-catalog.md#§3}]}
  commit: {label: Change-based Commit, kind: worker, tier: service, x: 10, y: 2.5, description: 変更をサーバー側で検証・競合解消する経路。, evidence: [{type: doc, ref: docs/reference-iceberg-rest-catalog.md#§4},{type: doc, ref: docs/reference-iceberg-rest-catalog.md#§5}]}
links:
  - {id: request, from: engine, to: api, label: テーブル要求, evidence: [{type: doc, ref: docs/reference-iceberg-rest-catalog.md#§1}]}
  - {id: resolve, from: api, to: catalog, label: 識別子を解決, evidence: [{type: doc, ref: docs/reference-iceberg-rest-catalog.md#§2}]}
  - {id: location, from: catalog, to: metadata, label: メタデータ位置を返す, evidence: [{type: doc, ref: docs/reference-iceberg-rest-catalog.md#§2}]}
  - {id: read-meta, from: engine, to: metadata, label: メタデータを読む, evidence: [{type: doc, ref: docs/reference-iceberg-rest-catalog.md#§3}]}
  - {id: read-data, from: metadata, to: data, label: Manifest とデータを読む, evidence: [{type: doc, ref: docs/reference-iceberg-rest-catalog.md#§3}]}
  - {id: commit-request, from: engine, to: commit, label: 変更をコミット, evidence: [{type: doc, ref: docs/reference-iceberg-rest-catalog.md#§4}]}
  - {id: commit-server, from: commit, to: catalog, label: 競合解消して公開, evidence: [{type: doc, ref: docs/reference-iceberg-rest-catalog.md#§4}]}
scenarios:
  - {id: catalog-read-commit, label: カタログ経由で読み書き, evidence: [{type: doc, ref: docs/reference-iceberg-rest-catalog.md#§6}], steps: [{links: [request, resolve, location], note: エンジンが REST API へ問い合わせ、Catalog Server がテーブルを解決する。}, {links: [read-meta, read-data], note: 返されたメタデータ位置から Manifest とデータファイルを読む。}, {links: [commit-request, commit-server], note: 更新は change-based commit としてサーバーに送る。}]}
implementations:
  - id: trino-polaris
    label: Trino・Polaris・RustFS
    description: Polaris の公式 Trino ガイドに沿って、Trino Iceberg コネクタから REST API と S3 互換ストレージへ接続する例。
    sources:
      - title: Apache Iceberg REST Catalog Spec
        url: https://iceberg.apache.org/rest-catalog-spec/
      - title: Getting Started with Apache Polaris and Trino
        url: https://polaris.apache.org/guides/trino/
      - title: Trino Iceberg connector
        url: https://trino.io/docs/current/connector/iceberg.html
    nodes:
      trino-polaris-trino:
        label: Trino Iceberg コネクタ
        kind: service
        tier: client
        x: 0
        y: 1.5
        description: SQL 読み書きを Iceberg Catalog 操作に変換する。
        realizes:
          - engine
        evidence:
          - type: doc
            ref: docs/reference-iceberg-rest-catalog.md#§7
      trino-polaris-polaris:
        label: Polaris Server（Iceberg REST）
        kind: catalog
        tier: service
        x: 7
        y: 1.5
        description: テーブル解決、REST 操作、コミット要求を処理する。
        realizes:
          - api
          - catalog
          - commit
        evidence:
          - type: doc
            ref: docs/reference-iceberg-rest-catalog.md#§7
      trino-polaris-metadata:
        label: RustFS 上の Iceberg メタデータ
        kind: file
        tier: storage
        x: 10
        y: 0.5
        description: スナップショット情報を含むテーブルメタデータを置く。
        realizes:
          - metadata
        evidence:
          - type: doc
            ref: docs/reference-iceberg-rest-catalog.md#§7
      trino-polaris-data:
        label: RustFS の Manifest・データファイル
        kind: file
        tier: storage
        x: 13
        y: 1.5
        description: 同じストレージ上のテーブルファイル。
        realizes:
          - data
        evidence:
          - type: doc
            ref: docs/reference-iceberg-rest-catalog.md#§7
      trino-polaris-config:
        label: polaris.properties
        kind: file
        tier: storage
        x: 3
        y: 1.5
        description: REST URI とストレージエンドポイントを持つ。
        evidence:
          - type: doc
            ref: docs/reference-iceberg-rest-catalog.md#§7
    links:
      - id: trino-polaris-client-config
        from: trino-polaris-config
        to: trino-polaris-trino
        label: カタログ接続と S3 を設定
        evidence:
          - type: doc
            ref: docs/reference-iceberg-rest-catalog.md#§7
