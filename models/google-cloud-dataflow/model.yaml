name: Google Cloud Dataflow のパイプラインアーキテクチャ
description: Pub/Sub の注文イベントを Apache Beam パイプラインで変換・集計し、Dataflow のワーカーから BigQuery へ出力する流れです。
reference:
  objectives:
    - Beam Pipeline と PCollection、変換の関係を読む。
    - Dataflow Runner と分散ワーカーの役割を区別する。
    - 出力とジョブ監視までの実行経路を追う。
  sources:
    - {title: Dataflow documentation, url: https://cloud.google.com/dataflow/docs/overview}
    - {title: Use Apache Beam to build pipelines, url: https://cloud.google.com/dataflow/docs/guides/use-beam}
    - {title: Dataflow monitoring interface, url: https://cloud.google.com/dataflow/docs/guides/using-monitoring-intf}
    - {title: Dataflow product overview, url: https://cloud.google.com/products/dataflow}
sources: [docs/reference-google-cloud-dataflow.md]
evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§1}, {type: doc, ref: docs/reference-google-cloud-dataflow.md#§7}]
tiers:
  - {id: control, label: パイプライン制御, z: 1, size: [22, 3]}
  - {id: data, label: イベント処理, z: 0, size: [22, 3]}
nodes:
  pubsub: {label: 注文イベントの入力, kind: queue, tier: data, x: 0, 'y': 1.5, description: 注文イベントを提供する入力ストリーム。, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§3}]}
  beam: {label: 処理グラフの定義, kind: service, tier: control, x: 0, 'y': 1.5, description: 入力、変換、出力の処理グラフを定義する。, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§2}]}
  collection: {label: 分散データの集合, kind: service, tier: data, x: 4, 'y': 1.5, description: パイプライン内で受け渡す論理的なデータ集合。, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§2}]}
  transform: {label: キー付けと時間窓の集計, kind: worker, tier: data, x: 8, 'y': 1.5, description: 検証・キー付け・ウィンドウ集計を適用する。, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§3}]}
  runner: {label: 処理グラフの実行調整, kind: service, tier: control, x: 5, y: 1.5, description: 処理グラフを実行可能な分散ジョブとして投入する。, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§4}]}
  workers: {parallel: 'N', label: 分散タスクの実行基盤, kind: worker, tier: data, x: 12, 'y': 1.5, description: パイプライン段階を分散実行するワーカー群。, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§4}]}
  bigquery: {label: 分析用テーブル, kind: db, tier: data, x: 18, 'y': 1.5, description: 集計済み注文データを格納する出力先の例。, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§5}]}
  monitoring: {label: ジョブの監視, kind: service, tier: control, x: 12, 'y': 1.5, description: ジョブ状態と段階ごとの指標を可視化する。, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§5}]}
links:
  - {id: define, from: beam, to: runner, label: ジョブを投入, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§4}]}
  - {id: ingest, from: pubsub, to: collection, label: イベントを読む, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§3}]}
  - {id: apply, from: collection, to: transform, label: 変換を適用, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§2}, {type: doc, ref: docs/reference-google-cloud-dataflow.md#§3}]}
  - {id: dispatch, from: runner, to: workers, label: 分散実行, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§4}]}
  - {id: execute, from: transform, to: workers, label: ワーカーで処理, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§4}]}
  - {id: write, from: workers, to: bigquery, label: 集計結果を書き込む, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§5}]}
  - {id: observe, from: runner, to: monitoring, label: ジョブを監視, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§5}]}
scenarios:
  - {id: stream-aggregation, label: 注文イベントの集計, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§6}], steps: [{links: [define], note: Beam Pipeline を定義し、Dataflow Runner にジョブとして投入する。}, {links: [ingest, apply], note: Pub/Sub から注文イベントを読み、PCollection に対して検証・キー付け・集計の変換を適用する。}, {links: [dispatch, execute], note: Runner が処理グラフを Dataflow Workers に分散して実行する。}, {links: [write, observe], note: 集計結果を BigQuery に書き込み、ジョブ状態と指標を Monitoring で確認する。}]}
requirements:
  - {id: BR-01, kind: usecase, title: イベント集計, text: 注文イベントを読み、変換・集計して分析用テーブルへ出力する。, links: [ingest, apply, execute, write], evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§6}]}
  - {id: NFR-01, kind: nfr, title: 実行可視化, text: 分散ジョブの状態と段階ごとの指標を確認できる。, links: [observe], evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§5}]}
unknowns: [{id: UNK-01, text: 実際の Beam SDK 言語、ウィンドウ設定、ワーカー構成、BigQuery スキーマは未確定。, refs: [beam, transform, workers, bigquery]}]
gates: {maxDrift: 0, maxHigh: 0}

implementations:
  - id: gcp
    label: "Pub/Sub → Beam SDK → BigQuery"
    description: "Apache Beam SDK で定義した注文の窓集計を Dataflow に投入する例。Pub/Sub から読み、BigQuery に出力するパイプラインを専用ワーカーサービスアカウントで実行する。"
    sources:
      - {title: Dataflow documentation, url: https://cloud.google.com/dataflow/docs/overview}
      - {title: Use Apache Beam to build pipelines, url: https://cloud.google.com/dataflow/docs/guides/use-beam}
      - {title: Dataflow monitoring interface, url: https://cloud.google.com/dataflow/docs/guides/using-monitoring-intf}
      - {title: Dataflow product overview, url: https://cloud.google.com/products/dataflow}
      - {title: Dataflow security and permissions, url: https://docs.cloud.google.com/dataflow/docs/concepts/security-and-permissions}
      - {title: Beam Programming Guide, url: https://beam.apache.org/documentation/programming-guide/}
    tiers:
      - {id: processing, label: データの処理と保存, z: 0, size: [14, 5]}
      - {id: setup, label: 実行に必要な設定・成果物, z: 1, size: [14, 3]}
    groups:
      - {kind: cloud, label: Google Cloud プロジェクト, provider: gcp, tier: [processing, setup]}
    nodes:
      gcp-pubsub: {label: Pub/Sub サブスクリプション, kind: queue, tier: processing, x: 1, y: 1.15, svc: gcp:pubsub, realizes: [pubsub], description: 注文トピックから Dataflow ジョブへ配信する。, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§8}]}
      gcp-pipeline: {label: Beam SDK の Pipeline・PCollection・Transform, kind: file, tier: processing, x: 1, y: 3.65, realizes: [beam, collection, transform], description: イベント検証、イベント時刻の窓、キーごとの集計を処理グラフとして記述する。, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§8}]}
      gcp-dataflow: {label: Dataflow Runner と管理ワーカー, kind: worker, tier: processing, x: 5, y: 1.15, realizes: [runner, workers], description: Beam グラフをストリーミングジョブとして分散実行する。, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§8}]}
      gcp-bigquery: {label: BigQuery の集計テーブル, kind: table, tier: processing, x: 5, y: 3.65, svc: gcp:bigquery, realizes: [bigquery], description: BigQueryIO でスキーマに合わせて書き込む。, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§8}]}
      gcp-monitor: {label: Dataflow Monitoring, kind: monitor, tier: processing, x: 9, y: 1.15, realizes: [monitoring], description: ステージ指標とジョブの状態を確認する。, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§8}]}
      gcp-identity: {label: ワーカーサービスアカウント, kind: policy, tier: setup, x: 1, y: 1.5, description: Pub/Sub の読み取り、対象 BigQuery への書き込み、実行に必要な権限を割り当てる。, evidence: [{type: doc, ref: docs/reference-google-cloud-dataflow.md#§8}]}
    links:
      - {id: gcp-identity-connection, from: gcp-identity, to: gcp-dataflow, label: ワーカーに権限を付与}
