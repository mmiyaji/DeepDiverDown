name: Azure Data Factory のデータ統合アーキテクチャ
description: トリガーされたパイプラインが注文ファイルをコピーし、Integration Runtime 上の Data Flow で整形してデータレイクへ書き込む流れです。
reference:
  objectives:
    - Pipeline と Activity の依存関係を読む。
    - Linked Service、Dataset、Integration Runtime の役割を区別する。
    - Trigger による起動と Azure Monitor による実行確認を追う。
  sources:
    - title: Introduction to Azure Data Factory
      url: https://learn.microsoft.com/en-us/azure/data-factory/introduction
    - title: Pipelines and activities
      url: https://learn.microsoft.com/en-us/azure/data-factory/concepts-pipelines-activities
    - title: Linked services
      url: https://learn.microsoft.com/en-us/azure/data-factory/concepts-linked-services
    - title: Integration runtime
      url: https://learn.microsoft.com/en-us/azure/data-factory/concepts-integration-runtime
sources:
  - docs/reference-azure-data-factory.md
evidence:
  - type: doc
    ref: docs/reference-azure-data-factory.md#§1
  - type: doc
    ref: docs/reference-azure-data-factory.md#§7
tiers:
  - id: orchestration
    label: 起動と制御
    z: 1
    size:
      - 22
      - 3
  - id: data
    label: データ移動と変換
    z: 0
    size:
      - 22
      - 3
nodes:
  source:
    label: 注文ファイル
    kind: external
    tier: data
    x: 0
    'y': 1.5
    description: 外部ストレージに届く入力データ。
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§1
  trigger:
    label: 定期起動の条件
    kind: service
    tier: orchestration
    x: 0
    'y': 1.5
    description: スケジュールまたはイベントで実行を開始する。
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§5
  pipeline:
    label: データ処理のワークフロー
    kind: service
    tier: orchestration
    x: 4
    'y': 1.5
    description: 複数のアクティビティを一つの作業単位にまとめる。
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§2
  copy:
    label: ファイルのコピー処理
    kind: worker
    tier: data
    x: 5
    'y': 1.5
    description: ソースから取り込み先へデータを移動する。
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§2
  ir:
    label: アクティビティの実行基盤
    kind: worker
    tier: data
    x: 9
    'y': 0
    description: アクティビティと接続先を橋渡しする計算基盤。
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§4
  landing:
    label: 一時配置された注文ファイル
    kind: db
    tier: data
    x: 9
    'y': 2.5
    description: コピー処理の出力と変換処理の入力を保持する。
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§6
  flow:
    label: 列と型の変換処理
    kind: worker
    tier: data
    x: 13
    'y': 1.5
    description: 入力の列、データ型や値を整形する。
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§4
  lake:
    label: 整形済みデータの保存先
    kind: db
    tier: data
    x: 18
    'y': 1.5
    description: 整形済みデータを保持する出力先。
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§6
  monitor:
    label: 処理状態の監視
    kind: service
    tier: orchestration
    x: 13
    'y': 1.5
    description: パイプラインとアクティビティの状態を監視する。
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§5
links:
  - id: trigger-pipeline
    from: trigger
    to: pipeline
    label: パイプラインを起動
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§5
  - id: pipeline-activity
    from: pipeline
    to: copy
    label: 入力・出力定義を解決してコピー
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§2
      - type: doc
        ref: docs/reference-azure-data-factory.md#§3
  - id: read-source
    from: source
    to: copy
    label: 注文ファイルを読む
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§2
  - id: land-raw
    from: copy
    to: landing
    label: 変換前のファイルを配置
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§6
  - id: read-raw
    from: landing
    to: flow
    label: 変換前のファイルを読む
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§6
  - id: copy-ir
    from: copy
    to: ir
    label: 実行基盤へ処理を割り当てる
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§4
  - id: ir-flow
    from: ir
    to: flow
    label: 列と型の変換を実行
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§4
  - id: flow-lake
    from: flow
    to: lake
    label: 整形済みデータを書き込む
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§6
  - id: observe
    from: pipeline
    to: monitor
    label: 実行状態を監視
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§5
scenarios:
  - id: ingestion
    label: 注文ファイルの統合
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§6
    steps:
      - links:
          - trigger-pipeline
        note: Trigger がスケジュールまたはイベントに応じて Pipeline を起動する。
      - links:
          - pipeline-activity
          - read-source
        note: Pipeline が Copy Activity を選び、Linked Service と Dataset で入出力を解決する。
      - links:
          - copy-ir
          - land-raw
        note: Copy Activity が Integration Runtime を使って変換前のファイルを一時配置する。
      - links:
          - ir-flow
          - read-raw
        note: Mapping Data Flow は管理された Spark 上で一時配置ファイルを変換する。
      - links:
          - flow-lake
          - observe
        note: 整形結果を Data Lake に保存し、実行状態を Azure Monitor で確認する。
requirements:
  - id: BR-01
    kind: usecase
    title: 取り込みと整形
    text: 注文ファイルを取り込み、変換してデータレイクへ配置する。
    links:
      - pipeline-activity
      - copy-ir
      - ir-flow
      - flow-lake
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§6
  - id: NFR-01
    kind: nfr
    title: 実行可視化
    text: パイプラインとアクティビティの成功・失敗を監視できる。
    links:
      - observe
    evidence:
      - type: doc
        ref: docs/reference-azure-data-factory.md#§5
unknowns:
  - id: UNK-01
    text: 実際のトリガー周期、接続資格情報、Data Flow の変換規則は未確定。
    refs:
      - trigger
      - pipeline
      - flow
gates:
  maxDrift: 0
  maxHigh: 0
implementations:
  - id: azure
    label: ADF と Azure Data Lake Storage Gen2
    description: Azure Blob Storage の注文ファイルを Azure Integration Runtime でコピーし、変換前と整形済みの領域を分けた ADLS Gen2 に保存する例。
    sources:
      - title: Introduction to Azure Data Factory
        url: https://learn.microsoft.com/en-us/azure/data-factory/introduction
      - title: Pipelines and activities
        url: https://learn.microsoft.com/en-us/azure/data-factory/concepts-pipelines-activities
      - title: Linked services
        url: https://learn.microsoft.com/en-us/azure/data-factory/concepts-linked-services
      - title: Integration runtime
        url: https://learn.microsoft.com/en-us/azure/data-factory/concepts-integration-runtime
      - title: Monitor Azure Data Factory
        url: https://learn.microsoft.com/en-us/azure/data-factory/monitor-data-factory
      - {title: Mapping Data Flow の概要, url: https://learn.microsoft.com/en-us/azure/data-factory/concepts-data-flow-overview}
      - {title: Copy Activity の実行, url: https://learn.microsoft.com/en-us/azure/data-factory/copy-activity-overview}
      - {title: Azure Monitor に ADF のログを送る, url: https://learn.microsoft.com/en-us/azure/data-factory/monitor-configure-diagnostics}
    tiers:
      - id: processing
        label: データの処理と保存
        z: 0
        size:
          - 22
          - 6
      - id: setup
        label: 実行に必要な設定・成果物
        z: 1
        size:
          - 14
          - 3
    groups:
      - kind: cloud
        label: Azure サブスクリプション
        provider: azure
        tier:
          - processing
          - setup
    nodes:
      azure-source:
        label: Azure Blob Storage 入力コンテナー
        kind: db
        tier: processing
        x: 1
        'y': 1.15
        svc: azure:storage
        realizes:
          - source
        description: 注文ファイルの投入元。
        evidence:
          - type: doc
            ref: docs/reference-azure-data-factory.md#§8
      azure-pipeline:
        label: ADF（スケジュールとパイプライン）
        kind: workflow
        svc: azure:datafactory
        tier: processing
        x: 1
        'y': 3.65
        realizes:
          - trigger
          - pipeline
        description: 定期的にコピーを始め、成功後に変換を依存実行する。
        evidence:
          - type: doc
            ref: docs/reference-azure-data-factory.md#§8
      azure-ir:
        label: ADF（Copy Activity・Azure IR）
        kind: worker
        tier: processing
        x: 5
        'y': 1.15
        realizes:
          - ir
          - copy
        description: Microsoft が実行基盤を運用し、利用者は IR と接続・認証を設定する。Blob の入力を ADLS Gen2 の raw パスにコピーする。
        evidence:
          - type: doc
            ref: docs/reference-azure-data-factory.md#§8
        svc: azure:datafactory
      azure-lake:
        label: ADLS Gen2（raw）
        kind: db
        tier: processing
        x: 5
        'y': 3.65
        svc: azure:storage
        realizes:
          - landing
        description: コピーした変換前の注文ファイルを保持する。
        evidence:
          - type: doc
            ref: docs/reference-azure-data-factory.md#§8
      azure-monitor:
        label: Azure Monitor Logs（Log Analytics）
        kind: monitor
        tier: processing
        x: 15
        'y': 4.8
        realizes:
          - monitor
        description: 診断設定で送信した ADF パイプラインとアクティビティの実行ログを確認する。
        evidence:
          - type: doc
            ref: docs/reference-azure-data-factory.md#§8
        svc: azure:monitor
      azure-linked:
        label: Linked Service と Dataset
        kind: catalog
        tier: setup
        x: 1
        'y': 1.5
        description: 入力・出力の接続とパスを宣言し、コピーと変換で参照する。
        evidence:
          - type: doc
            ref: docs/reference-azure-data-factory.md#§8
      azure-spark: {label: ADF（Mapping Data Flow・管理 Spark）, svc: azure:datafactory, kind: worker, tier: processing, x: 11, y: 3.65, realizes: [flow], description: Microsoft 管理の Spark 上で raw を変換する。利用者は Data Flow と計算設定を指定し、内部ホストは直接操作しない。, evidence: [{type: doc, ref: docs/reference-azure-data-factory.md#§8}]}
      azure-curated: {label: ADLS Gen2（curated）, svc: azure:storage, kind: db, tier: processing, x: 17, y: 2, realizes: [lake], description: 分析用に整形したデータを保持する。, evidence: [{type: doc, ref: docs/reference-azure-data-factory.md#§8}]}
    links:
      - {id: azure-after-copy, from: azure-pipeline, to: azure-spark, label: コピー成功後に変換アクティビティを起動, realizes: [ir-flow], replace: true}
      - id: azure-linked-connection
        from: azure-linked
        to: azure-pipeline
        label: 接続・パスの定義を読む

    layout2d:
      tiers:
        - {id: diagram, label: Azure の実装構成, z: 0, size: [23, 12]}
      nodes:
        azure-source: {tier: diagram, x: 2, y: 3}
        azure-ir: {tier: diagram, x: 7, y: 3}
        azure-pipeline: {tier: diagram, x: 7, y: 7}
        azure-linked: {tier: diagram, x: 7, y: 10}
        azure-lake: {tier: diagram, x: 12, y: 3}
        azure-spark: {tier: diagram, x: 17, y: 3}
        azure-curated: {tier: diagram, x: 22, y: 3}
        azure-monitor: {tier: diagram, x: 17, y: 8}
      groups:
        - {kind: cloud, label: Azure サブスクリプション（管理サービスの論理的所属）, provider: azure, tier: [diagram], x0: 0, y0: 0, x1: 24, y1: 12, nodes: [azure-source, azure-ir, azure-pipeline, azure-linked, azure-lake, azure-spark, azure-curated, azure-monitor]}
        - {kind: cluster, label: Data Factory と Azure IR, provider: azure, tier: [diagram], x0: 4.5, y0: 0.7, x1: 9.5, y1: 11.5, nodes: [azure-ir, azure-pipeline, azure-linked]}
    layout3d:
      tiers:
        - {id: adf, label: Data Factory と Azure IR, z: 0, size: [9, 8]}
        - {id: spark, label: 管理 Spark, z: 0, origin: [12, 0], size: [4, 8]}
        - {id: storage, label: Azure Storage, z: 0, origin: [19, 0], size: [5, 11]}
        - {id: logs, label: Azure Monitor, z: 0, origin: [27, 0], size: [4, 5]}
      nodes:
        azure-pipeline: {tier: adf, x: 2, y: 1}
        azure-ir: {tier: adf, x: 6, y: 1}
        azure-linked: {tier: adf, x: 2, y: 5}
        azure-spark: {tier: spark, x: 2, y: 2}
        azure-source: {tier: storage, x: 2, y: 1}
        azure-lake: {tier: storage, x: 2, y: 5}
        azure-curated: {tier: storage, x: 2, y: 9}
        azure-monitor: {tier: logs, x: 2, y: 2}
      groups:
        - {kind: cloud, label: Azure サブスクリプション（管理サービスの論理的所属）, provider: azure, tier: [adf, spark, storage, logs], nodes: [azure-source, azure-ir, azure-pipeline, azure-linked, azure-lake, azure-spark, azure-curated, azure-monitor]}
