blocks:
  - id: detail-map
    title: 時間別 chunk と集計の例
    note: 時間範囲は説明用です。列化と集計の更新は構成やポリシーに依存します。
    hint: 項目を選ぶと説明を表示します。処理の流れに合わせて関連する項目を強調します。
    lanes:
      - id: rows
        label: rowstore
        node: row
      - id: column
        label: columnstore
        node: column
      - id: aggregate
        label: 継続集計
        node: rollup
    items:
      rows:
        - id: r1
          label: 今日
          k: 0
          note: 最近の時間範囲を持つ行指向 chunk の例。
        - id: r2
          label: 昨日
          k: 0
          note: 別の時間範囲を持つ chunk の例。
      column:
        - id: c1
          label: 先週
          k: 2
          note: 列化された古い chunk の例。
      aggregate:
        - id: a1
          label: 1時間平均
          k: 3
          note: 時間幅ごとに集計した結果の例。
