name: Amazon EKS マネージドノードグループ
description: AWS 管理の EKS コントロールプレーンと利用者アカウント内の managed node group を API・デプロイ・置換の順で追います。
reference:
  objectives:
    - EKS が管理するコントロールプレーンと利用者が管理するデータプレーンの境界を区別する。
    - managed node group のノード更新・ドレイン・置換の流れを追う。
    - API 受付からイメージ取得、公開、ノード置換までを同じ順序で説明する。
  sources:
    - {title: EKS Control Plane, url: https://docs.aws.amazon.com/eks/latest/best-practices/control-plane.html}
    - {title: Managed node groups, url: https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html}
    - {title: Update a managed node group, url: https://docs.aws.amazon.com/eks/latest/userguide/update-managed-node-group.html}
sources: [docs/reference-amazon-eks.md]
evidence:
  - {type: doc, ref: docs/reference-amazon-eks.md#§1}
  - {type: doc, ref: docs/reference-amazon-eks.md#§6}
  - {type: doc, ref: docs/reference-amazon-eks.md#§7}
  - {type: doc, ref: docs/reference-amazon-eks.md#§8}
tiers:
  - {id: interface, label: 利用・管理, z: 2, origin: [-1, 0], size: [12, 3]}
  - {id: edge, label: 公開境界, z: 1, origin: [0, 0], size: [12, 3]}
  - {id: control, label: EKS コントロールプレーン, z: 1, origin: [0, 4], size: [12, 3]}
  - {id: data, label: 利用者アカウントのデータプレーン, z: 0, origin: [0, 8], size: [12, 3]}
nodes:
  operator: {label: 運用者, kind: actor, tier: interface, x: 1, y: 1.5, role: ops, evidence: [{type: doc, ref: docs/reference-amazon-eks.md#§4}]}
  api: {label: マネージド制御 API, kind: service, tier: control, x: 3, 'y': 1.5, evidence: [{type: doc, ref: docs/reference-amazon-eks.md#§2}]}
  managed: {label: アプリ用の管理対象ノード群, kind: worker, tier: data, x: 5, 'y': 1.5, description: 実行ノード群を管理し、更新時に順次置換する。, evidence: [{type: doc, ref: docs/reference-amazon-eks.md#§3}]}
  workload: {label: 注文 API の実行単位, kind: service, tier: data, x: 8, 'y': 1.5, evidence: [{type: doc, ref: docs/reference-amazon-eks.md#§4}]}
  lb: {label: アプリ公開・振り分け, kind: lb, tier: edge, x: 9, 'y': 1.5, evidence: [{type: doc, ref: docs/reference-amazon-eks.md#§4}]}
  registry: {label: コンテナイメージの保管, kind: external, tier: edge, x: 3, 'y': 1.5, evidence: [{type: doc, ref: docs/reference-amazon-eks.md#§4}]}
  observer: {label: 実行状態の監視, kind: monitor, tier: interface, x: 7, 'y': 1.5, evidence: [{type: doc, ref: docs/reference-amazon-eks.md#§5}]}
links:
  - {id: submit, from: operator, to: api, label: API で desired state を送る, evidence: [{type: doc, ref: docs/reference-amazon-eks.md#§4}]}
  - {id: schedule, from: api, to: managed, label: Pod をスケジュール, evidence: [{type: doc, ref: docs/reference-amazon-eks.md#§4}]}
  - {id: pull, from: managed, to: registry, label: イメージを取得, evidence: [{type: doc, ref: docs/reference-amazon-eks.md#§4}]}
  - {id: run, from: managed, to: workload, label: Pod を実行, evidence: [{type: doc, ref: docs/reference-amazon-eks.md#§4}]}
  - {id: expose, from: workload, to: lb, label: Service で公開, evidence: [{type: doc, ref: docs/reference-amazon-eks.md#§4}]}
  - {id: replace, from: api, to: managed, label: drain・新ノードへ置換, evidence: [{type: doc, ref: docs/reference-amazon-eks.md#§5}]}
  - {id: observe, from: managed, to: observer, label: 状態を監視, evidence: [{type: doc, ref: docs/reference-amazon-eks.md#§5}]}
scenarios:
  - id: api-deploy-replace
    label: API・デプロイ・ノード置換
    evidence: [{type: doc, ref: docs/reference-amazon-eks.md#§7}]
    steps:
      - {links: [submit], note: 受付。運用者が EKS/Kubernetes API に desired state を送る。}
      - {links: [schedule, pull, run], note: 配置。Pod を managed node group に割り当て、ECR から起動する。}
      - {links: [expose], note: 公開。Service/Load Balancer がワークロードを公開する。}
      - {links: [replace], note: 置換。更新または auto repair がノードを drain し、新ノードへ再配置する。}
requirements:
  - {id: BR-01, kind: usecase, title: マネージド境界を保ったデプロイ, text: EKS API から managed node group 上の Pod へ配備し公開する。, links: [submit, schedule, run, expose], evidence: [{type: doc, ref: docs/reference-amazon-eks.md#§2}, {type: doc, ref: docs/reference-amazon-eks.md#§4}]}
  - {id: NFR-01, kind: nfr, title: ドレイン付き置換, text: ノード更新・障害時に Pod をドレインして新ノードへ置換する。, links: [replace], evidence: [{type: doc, ref: docs/reference-amazon-eks.md#§5}]}
unknowns:
  - {id: UNK-01, text: 実際の AWS リージョン、AZ、ノード数、インスタンスタイプ、PDB、IAM/VPC 設定は未確定。, refs: [managed, workload]}
implementations:
  - id: aws
    label: EKS Managed Node Group と ALB
    description: AWS の EKS クラスタで、プライベートサブネットの Managed Node Group に注文 API を置き、Ingress で公開する例。
    sources:
      - {title: EKS Control Plane, url: https://docs.aws.amazon.com/eks/latest/best-practices/control-plane.html}
      - title: Amazon EKS managed node groups
        url: https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html
      - title: Application Load Balancers on EKS
        url: https://docs.aws.amazon.com/eks/latest/userguide/alb-ingress.html
      - title: CloudWatch Observability EKS add-on
        url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/install-CloudWatch-Observability-EKS-addon.html
    tiers:
      - id: interface
        label: 利用・管理
        z: 2
        origin:
          - -1
          - 0
      - id: edge
        label: 公開境界
        z: 1
        origin:
          - 0
          - 0
      - id: control
        label: EKS コントロールプレーン
        z: 1
        origin:
          - 0
          - 4
      - id: data
        label: 利用者アカウントのデータプレーン
        z: 0
        origin:
          - 0
          - 8
    groups:
      - kind: cloud
        label: AWS のサービス領域（制御プレーンは AWS 管理 VPC）
        provider: aws
        tier:
          - control
          - data
          - edge
          - interface
        nodes:
          - aws-api
          - aws-managed
          - aws-workload
          - aws-lb
          - aws-registry
          - aws-observer
          - aws-controller
      - kind: vpc
        label: 顧客 VPC
        provider: aws
        tier:
          - data
          - edge
        nodes:
          - aws-managed
          - aws-workload
          - aws-lb
          - aws-controller
    nodes:
      aws-operator:
        label: kubectl と IAM の運用ロール
        kind: actor
        tier: interface
        realizes:
          - operator
        description: 権限を割り当てた AWS IAM プリンシパルでクラスタを操作する。
        evidence:
          - type: doc
            ref: docs/reference-amazon-eks.md#§9
      aws-api:
        label: Amazon EKS マネージド制御プレーン
        kind: service
        tier: control
        svc: eks
        realizes:
          - api
        description: AWS 管理 VPC の制御プレーンを AWS が運用する。利用者は公開またはプライベートの Kubernetes API エンドポイントとクラスタ設定を操作するが、制御プレーンのサーバー自体には直接アクセスしない。
        management: {type: aws, scope: 制御プレーンの基盤を AWS が運用。API とクラスタ設定は利用者が権限に応じて操作する。}
        evidence:
          - type: doc
            ref: docs/reference-amazon-eks.md#§9
      aws-managed:
        label: Managed Node Group の EC2
        kind: worker
        tier: data
        svc: ec2
        realizes:
          - managed
        description: アプリ用 EC2 を複数 AZ のプライベートサブネットに配置する。EKS がノードの作成と更新を支援し、利用者は設定と更新の開始を担う。
        management: {type: shared, scope: EKS がノードを作成・更新し、利用者が設定と更新開始を担う。}
        evidence:
          - type: doc
            ref: docs/reference-amazon-eks.md#§9
      aws-workload:
        label: 注文 API Deployment / Pod
        kind: service
        tier: data
        svc: k8s:deployment
        realizes:
          - workload
        description: ALB から Pod の IP をターゲットにできる。
        management: {type: customer, scope: 利用者がアプリと Deployment を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-amazon-eks.md#§9
      aws-lb:
        label: Application Load Balancer
        kind: lb
        tier: edge
        svc: alb
        realizes:
          - lb
        description: Ingress が定義したルールで注文 API への到達経路を提供する。
        management: {type: shared, scope: AWS が基盤を運用し、利用者がルールとネットワークを設定する。}
        evidence:
          - type: doc
            ref: docs/reference-amazon-eks.md#§9
      aws-registry:
        label: Amazon ECR リポジトリ
        kind: external
        tier: edge
        svc: ecr
        realizes:
          - registry
        description: 注文 API のイメージを格納し、ノードが pull する。
        management: {type: shared, scope: AWS が基盤を運用し、利用者がイメージと権限を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-amazon-eks.md#§9
      aws-observer:
        label: CloudWatch Container Insights
        kind: monitor
        tier: interface
        svc: cloudwatch
        realizes:
          - observer
        description: Observability アドオン経由で集める実行状態を表示する。
        management: {type: shared, scope: AWS が基盤を運用し、利用者が収集設定と権限を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-amazon-eks.md#§9
      aws-controller:
        label: AWS Load Balancer Controller
        kind: workflow
        tier: data
        svc: k8s:deployment
        description: Ingress を監視し、ALB とターゲット登録を調整する。
        management: {type: customer, scope: 利用者がコントローラーと IAM 権限を設定・更新する。}
        evidence:
          - type: doc
            ref: docs/reference-amazon-eks.md#§9
    links:
      - id: aws-watch-ingress
        from: aws-api
        to: aws-controller
        label: Ingress を監視
        evidence:
          - type: doc
            ref: docs/reference-amazon-eks.md#§9
      - id: aws-create-load-balancer
        from: aws-controller
        to: aws-lb
        label: ALB とターゲットを調整
        realizes: [expose]
        evidence:
          - type: doc
            ref: docs/reference-amazon-eks.md#§9
      - {id: aws-request, from: aws-lb, to: aws-workload, label: 登録された Pod IP へ HTTP を転送, realizes: [expose], replace: true, evidence: [{type: doc, ref: docs/reference-amazon-eks.md#§9}]}

    layout2d:
      tiers: [{id: diagram, label: 実装構成, z: 0, origin: [-4, 0], size: [21, 11]}]
      nodes:
        aws-operator: {tier: diagram, x: -3, y: 1}
        aws-api: {tier: diagram, x: 2, y: 1}
        aws-managed: {tier: diagram, x: 3, y: 5}
        aws-workload: {tier: diagram, x: 6, y: 7}
        aws-controller: {tier: diagram, x: 6, y: 4}
        aws-lb: {tier: diagram, x: 10, y: 5}
        aws-registry: {tier: diagram, x: 13, y: 2}
        aws-observer: {tier: diagram, x: 14, y: 8}
      groups:
        - {kind: cloud, provider: aws, label: AWS サービス領域（制御プレーンは AWS 管理 VPC）, tier: [diagram], x0: 0, y0: -1, x1: 16, y1: 10, nodes: [aws-api, aws-managed, aws-workload, aws-controller, aws-lb, aws-registry, aws-observer]}
        - {kind: vpc, provider: aws, label: 顧客 VPC, tier: [diagram], x0: 1, y0: 3, x1: 12, y1: 9, nodes: [aws-managed, aws-workload, aws-controller, aws-lb]}
    layout3d:
      tiers:
        - {id: runtime, label: 実行基盤, z: 0, size: [10, 5]}
        - {id: apps, label: アプリ, z: 1, size: [10, 5]}
        - {id: services, label: 独立サービス・制御, z: 0, origin: [12, 0], size: [12, 7]}
        - {id: outside, label: 利用者, z: 0, origin: [-5, 0], size: [3, 3]}
      nodes:
        aws-operator: {tier: outside, x: 1, y: 1}
        aws-managed: {tier: runtime, x: 2, y: 2}
        aws-workload: {tier: apps, x: 2, y: 2}
        aws-controller: {tier: apps, x: 6, y: 2}
        aws-api: {tier: services, x: 1, y: 1}
        aws-lb: {tier: services, x: 5, y: 1}
        aws-registry: {tier: services, x: 1, y: 5}
        aws-observer: {tier: services, x: 5, y: 5}
      groups:
        - {kind: cloud, provider: aws, label: AWS サービス領域（制御プレーンは AWS 管理 VPC）, tier: [runtime, apps, services], nodes: [aws-api, aws-managed, aws-workload, aws-controller, aws-lb, aws-registry, aws-observer]}
