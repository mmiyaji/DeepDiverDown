name: Arize Phoenix による LLM アプリの可観測性
description: OpenTelemetry のトレースを受けて SQL に保存し、画面での調査、評価、データセット、実験、プロンプト管理につなげる。
reference:
  objectives: [トレースの取り込みから保存・画面表示までの流れを確認する, 評価・実験・プロンプト管理が同じデータベースを共有する点を確認する, 自前運用での保存先・認証・保持期間の設定を確認する]
  sources:
    - {title: Phoenix (GitHub), url: https://github.com/Arize-ai/phoenix}
    - {title: Phoenix self-hosting, url: https://arize.com/docs/phoenix/self-hosting}
    - {title: Phoenix architecture, url: https://arize.com/docs/phoenix/self-hosting/architecture}
    - {title: Phoenix configuration, url: https://arize.com/docs/phoenix/self-hosting/configuration}
sources: [docs/reference-arize-phoenix.md]
evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§1}]
tiers:
  - {id: flow, label: 計装・収集・保存・利用, z: 0, size: [34, 13]}
nodes:
  app: {label: LLM アプリ, kind: client, tier: flow, x: 1, y: 5, description: 可観測性の対象になるアプリ。フレームワークや LLM プロバイダーの呼び出しを含む。, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§2}]}
  instr: {label: OpenInference 計装, kind: service, tier: flow, x: 7, y: 5, description: アプリ内でスパンを作る自動計装。OpenTelemetry を土台にし、言語・フレームワークを問わない。, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§2}]}
  collector: {label: トレースコレクター, kind: service, tier: flow, x: 13, y: 5, description: OTLP を受ける。HTTP は 6006 番の /v1/traces、gRPC は 4317 番が既定。, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§3}]}
  auth: {label: 認証・アクセス制御, kind: service, tier: flow, x: 13, y: 1.5, description: OAuth2、LDAP、ローカルアカウントとロールベースの制御。, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§6}]}
  db: {label: SQL データベース, kind: db, tier: flow, x: 19, y: 5, description: プロジェクト、トレース、データセット、実験を保持する。既定は SQLite、本番は PostgreSQL。, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§4}]}
  ui: {label: Web UI（トレース調査）, kind: service, tier: flow, x: 19, y: 1.5, description: トレースとスパンを画面で調べる。コレクターと同じ 6006 番で提供する。, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§3}]}
  evals: {label: 評価, kind: service, tier: flow, x: 25, y: 1.5, description: LLM を使った応答・検索の品質評価。, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§5}]}
  experiments: {label: データセット・実験, kind: service, tier: flow, x: 25, y: 5, description: バージョン付きのデータセットに対し、プロンプト・モデル・検索の変更を比べる。, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§5}]}
  prompts: {label: プロンプト管理・Playground, kind: service, tier: flow, x: 25, y: 9, description: プロンプトのバージョン管理とタグ付け、モデル比較、記録済み呼び出しの再実行。, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§5}]}
  llm: {label: LLM プロバイダー, kind: external, tier: flow, x: 31, y: 5, description: 評価や Playground が呼び出す外部のモデル。, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§5}]}
links:
  - {id: app-instr, from: app, to: instr, label: 呼び出しをスパンとして記録, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§2}]}
  - {id: instr-col, from: instr, to: collector, label: OTLP で送信, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§3}]}
  - {id: col-db, from: collector, to: db, label: トレースを保存, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§4}]}
  - {id: auth-ui, from: auth, to: ui, label: 利用者を認証, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§6}]}
  - {id: db-ui, from: db, to: ui, label: トレースを表示, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§3}]}
  - {id: db-evals, from: db, to: evals, label: トレースを評価対象に渡す, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§5}]}
  - {id: evals-exp, from: evals, to: experiments, label: 評価結果を実験に使う, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§5}]}
  - {id: db-exp, from: db, to: experiments, label: データセットを読み書き, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§5}]}
  - {id: db-prompts, from: db, to: prompts, label: プロンプト・記録済み呼び出しを読む, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§5}]}
  - {id: evals-llm, from: evals, to: llm, label: 判定用のモデルを呼ぶ, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§5}]}
  - {id: prompts-llm, from: prompts, to: llm, label: プロンプトを実行, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§5}]}
scenarios:
  - id: trace-and-inspect
    label: トレースを取り込んで調べ、評価する
    evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§3}]
    steps:
      - {links: [app-instr, instr-col], note: 計装がスパンを作り、OTLP でコレクターへ送る。}
      - {links: [col-db], note: コレクターがトレースを SQL データベースへ保存する。}
      - {links: [db-ui, db-evals, evals-llm], note: 画面で調べ、LLM による評価を実行する。}
requirements:
  - {id: PX-01, kind: usecase, title: 既存の OpenTelemetry 計装でトレースを集める, text: OTLP の HTTP と gRPC を受けるため、OpenTelemetry に対応したアプリから送れる。, links: [instr-col, col-db], evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§3}]}
unknowns:
  - {id: UNK-01, text: コレクター内部の取り込み処理（キュー、バッチ、保存の保証）は取得した資料に記載がなく未確認。, refs: [collector]}
  - {id: UNK-02, text: PHOENIX_ENABLE_AUTH の既定値と、評価・Playground が対応するモデルプロバイダーの一覧は未確認。, refs: [auth, llm]}
  - {id: UNK-03, text: 高負荷時の取り込み性能と、PostgreSQL の複数インスタンス構成での実測は未確認。公式は大量取り込みを Arize AX に案内している。, refs: [db]}
  - {id: UNK-04, text: Phoenix Cloud など公式のマネージド版の構成は取得した資料で確認できず、実装例に含めない。, refs: [collector]}
gates: {maxDrift: 0, maxHigh: 0}
implementations:
  - id: self-hosted-docker
    label: 自前のサーバー上の Phoenix コンテナと PostgreSQL
    description: アプリが OpenInference 計装で Phoenix のコンテナへ OTLP を送り、PostgreSQL に保存する例。評価と Playground は外部の LLM プロバイダーを呼ぶ。代表例であり、導入事例ではない。
    sources:
      - {title: Phoenix self-hosting, url: https://arize.com/docs/phoenix/self-hosting}
      - {title: Phoenix architecture, url: https://arize.com/docs/phoenix/self-hosting/architecture}
      - {title: Phoenix configuration, url: https://arize.com/docs/phoenix/self-hosting/configuration}
    tiers:
      - {id: diagram, label: アプリ・Phoenix・データベース, z: 0, size: [34, 11]}
    nodes:
      px-app: {label: LLM アプリ（OpenInference 計装つき）, kind: client, tier: diagram, x: 1, y: 5, realizes: [app, instr], description: 計装ライブラリを組み込んだアプリ。OTLP で送信する。, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§7}]}
      px-server: {label: Phoenix サーバー（コンテナ）, kind: service, tier: diagram, x: 10, y: 5, realizes: [collector, ui, auth, evals, experiments, prompts], description: Docker Hub のイメージで動かす。6006 番で画面と OTLP HTTP、4317 番で OTLP gRPC を受ける。, management: {type: customer, scope: "Customer operates the host, container, configuration and authentication."}, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§7}]}
      px-db: {label: PostgreSQL, kind: db, tier: diagram, x: 19, y: 5, realizes: [db], description: PHOENIX_SQL_DATABASE_URL で接続する。最小の対応版は 14。, management: {type: customer, scope: "Customer operates the database, backups and access."}, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§7}]}
      px-llm: {label: 外部の LLM プロバイダー, kind: external, tier: diagram, x: 27, y: 5, realizes: [llm], description: 評価や Playground が呼び出すモデル。, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§7}]}
    links:
      - {id: px-send, from: px-app, to: px-server, label: OTLP でスパンを送信, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§7}]}
      - {id: px-store, from: px-server, to: px-db, label: トレース・データセットを保存, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§7}]}
      - {id: px-call, from: px-server, to: px-llm, label: 評価・Playground でモデルを呼ぶ, evidence: [{type: doc, ref: docs/reference-arize-phoenix.md#§7}]}
    groups:
      - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [px-server, px-db]}
    layout2d:
      tiers:
        - {id: diagram, label: アプリ・Phoenix・データベース, z: 0, size: [34, 11]}
      nodes:
        px-app: {tier: diagram, x: 1, y: 5}
        px-server: {tier: diagram, x: 10, y: 5}
        px-db: {tier: diagram, x: 19, y: 5}
        px-llm: {tier: diagram, x: 27, y: 5}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [px-server, px-db]}
    layout3d:
      tiers:
        - {id: clients, label: アプリ, z: 0, size: [6, 11]}
        - {id: servers, label: Phoenix とデータベース, z: 0, origin: [8, 0], size: [14, 11]}
        - {id: external, label: 外部サービス, z: 0, origin: [24, 0], size: [6, 11]}
      nodes:
        px-app: {tier: clients, x: 3, y: 5}
        px-server: {tier: servers, x: 3, y: 5}
        px-db: {tier: servers, x: 10, y: 5}
        px-llm: {tier: external, x: 3, y: 5}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: [servers], nodes: [px-server, px-db]}
