name: Snowflake Horizon Catalog：分類・保護・監査と Iceberg REST
description: 分類した機微列へマスキングを適用し、参照履歴と下流への影響を確認する。外部エンジンは Iceberg REST カタログ経由で表を読む。
parent:
  model: snowflake
  node: metadata
reference:
  objectives:
  - ロールによる利用権限と、タグを使った実行時の保護を区別する。
  - 分類、利用の記録、リネージで確認できる情報を区別する。
  - 外部エンジンが Iceberg REST カタログと一時認証情報で表を読む経路を区別する。
  sources:
  - title: Snowflake Horizon Catalog
    url: https://docs.snowflake.com/en/user-guide/snowflake-horizon
  - title: データガバナンス
    url: https://docs.snowflake.com/en/guides-overview-govern
  - title: タグベースのマスキング
    url: https://docs.snowflake.com/en/user-guide/tag-based-masking-policies
  - title: アクセス履歴
    url: https://docs.snowflake.com/en/user-guide/access-history
  - title: Horizon Catalog の Iceberg REST と外部エンジン
    url: https://docs.snowflake.com/en/user-guide/tables-iceberg-access-using-external-query-engine-snowflake-horizon
  - title: S3 互換ストレージと Horizon Catalog（2026 年 10 月、private preview）
    url: https://www.snowflake.com/en/blog/engineering/s3-compatible-storage-iceberg-horizon-catalog/
sources:
- docs/reference-snowflake-horizon-catalog.md
evidence:
- type: doc
  ref: docs/reference-snowflake-horizon-catalog.md#§1
tiers:
- id: flow
  label: 構成と処理の流れ
  z: 0
  size:
  - 13.5
  - 7.5
nodes:
  owner:
    label: データ管理者
    kind: actor
    tier: flow
    x: 0
    y: 0
    description: 分類結果とタグの付け方を確認。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-horizon-catalog.md#§2
  classify:
    label: 機微データ分類
    kind: service
    tier: flow
    x: 3
    y: 0
    description: 機微情報の候補を分類。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-horizon-catalog.md#§2
  tag:
    label: 列の分類ラベル
    kind: service
    tier: flow
    x: 6
    y: 0
    description: 列に付与する分類メタデータ。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-horizon-catalog.md#§2
  policy:
    label: 列の値を保護するポリシー
    kind: service
    tier: flow
    x: 9
    y: 0
    description: 実行時にロールに従って変換。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-horizon-catalog.md#§3
  analyst:
    label: 分析担当ロール
    kind: actor
    tier: flow
    x: 0
    y: 4
    description: 利用権限のある列をクエリ。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-horizon-catalog.md#§3
  orders:
    label: 注文のメールアドレス列
    kind: db
    tier: flow
    x: 6
    y: 4
    description: 保護対象の列。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-horizon-catalog.md#§1
  mart:
    label: 注文分析ビュー
    kind: db
    tier: flow
    x: 9
    y: 4
    description: 下流の影響調査先。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-horizon-catalog.md#§4
  history:
    label: 列アクセスの監査履歴
    kind: db
    tier: flow
    x: 13
    y: 4
    description: アクセスしたオブジェクト・列を追う。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-horizon-catalog.md#§4
  engine:
    label: 外部エンジン
    kind: client
    tier: flow
    x: 0
    y: 6
    description: Spark、Trino、PyIceberg など Iceberg REST 対応のエンジン。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-horizon-catalog.md#§5
  rest:
    label: Iceberg REST カタログ API
    kind: service
    tier: flow
    x: 4
    y: 6
    description: 表の登録情報と SELECT などの権限を確認し、メタデータの位置と一時認証情報を返す。エンドポイントはアカウントの /polaris/api/catalog。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-horizon-catalog.md#§5
  iceberg:
    label: Snowflake 管理 Iceberg テーブル
    kind: db
    tier: flow
    x: 8
    y: 6
    description: メタデータとデータファイルを外部ボリューム上に持つ。外部エンジンが直接読む。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-horizon-catalog.md#§5
links:
- id: classify
  from: owner
  to: classify
  label: 分類を設定・確認
  evidence:
  - type: doc
    ref: docs/reference-snowflake-horizon-catalog.md#§2
- id: inspect
  from: classify
  to: orders
  label: 列の機微情報を分類
  evidence:
  - type: doc
    ref: docs/reference-snowflake-horizon-catalog.md#§2
- id: assign
  from: tag
  to: orders
  label: 列にタグを付与
  evidence:
  - type: doc
    ref: docs/reference-snowflake-horizon-catalog.md#§2
- id: bind
  from: tag
  to: policy
  label: 型が合うマスキングを関連付け
  evidence:
  - type: doc
    ref: docs/reference-snowflake-horizon-catalog.md#§3
- id: select
  from: analyst
  to: orders
  label: 許可されたロールで参照
  evidence:
  - type: doc
    ref: docs/reference-snowflake-horizon-catalog.md#§3
- id: mask
  from: policy
  to: orders
  label: 許可条件に応じた表示値
  evidence:
  - type: doc
    ref: docs/reference-snowflake-horizon-catalog.md#§3
- id: derive
  from: orders
  to: mart
  label: 注文分析で利用
  evidence:
  - type: doc
    ref: docs/reference-snowflake-horizon-catalog.md#§4
- id: track
  from: mart
  to: history
  label: 使用列の情報を照合
  evidence:
  - type: doc
    ref: docs/reference-snowflake-horizon-catalog.md#§4
- id: audit
  from: owner
  to: history
  label: 利用履歴を確認
  evidence:
  - type: doc
    ref: docs/reference-snowflake-horizon-catalog.md#§4
- id: request
  from: engine
  to: rest
  label: 表を要求
  evidence:
  - type: doc
    ref: docs/reference-snowflake-horizon-catalog.md#§5
- id: resolve
  from: rest
  to: iceberg
  label: 権限と保存場所を解決
  evidence:
  - type: doc
    ref: docs/reference-snowflake-horizon-catalog.md#§5
- id: vend
  from: rest
  to: engine
  label: 一時認証情報を返す
  evidence:
  - type: doc
    ref: docs/reference-snowflake-horizon-catalog.md#§5
- id: read-iceberg
  from: engine
  to: iceberg
  label: メタデータとデータを読む
  evidence:
  - type: doc
    ref: docs/reference-snowflake-horizon-catalog.md#§5
scenarios:
- id: flow
  label: 分類・保護・監査と外部エンジンからの読み取り
  evidence:
  - type: doc
    ref: docs/reference-snowflake-horizon-catalog.md#§2
  steps:
  - links:
    - classify
    - inspect
    note: 対象列の分類結果を確認する。
  - links:
    - assign
    - bind
    note: 保護対象のタグとポリシーを関連付ける。
  - links:
    - select
    - mask
    note: SELECT 権限のある分析担当にも、設定によりマスク済みの値を返す。
  - links:
    - derive
    - track
    - audit
    note: 下流ビューを確認し、アクセス履歴で実際の利用者と参照された列を照合する。
  - links:
    - request
    - resolve
    - vend
    - read-iceberg
    note: 外部エンジンは REST カタログで権限を確認し、一時認証情報でメタデータとデータを読む。
