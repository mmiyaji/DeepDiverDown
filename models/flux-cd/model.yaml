name: Flux CD の GitOps と継続的な照合
description: 利用者が管理する Kubernetes に source-controller と kustomize-controller を配置し、外部 Git の YAML を同じクラスタに反映する例。prune と照合停止は設定に依存する。
reference:
  objectives:
    - 構成要素と実行場所を理解する。
    - 定義から変更の反映までの流れと状態管理を追う。
  sources:
    - title: GitRepository
      url: https://fluxcd.io/flux/components/source/gitrepositories/
    - title: Kustomization
      url: https://fluxcd.io/flux/components/kustomize/kustomizations/
    - title: Flux architecture
      url: https://fluxcd.io/flux/flux-e2e/
sources:
  - docs/reference-flux-cd.md
evidence:
  - type: doc
    ref: docs/reference-flux-cd.md#§1
  - type: doc
    ref: docs/reference-flux-cd.md#§3
  - type: doc
    ref: docs/reference-flux-cd.md#§4
tiers:
  - id: flow
    label: 定義・処理・対象
    z: 1
    size:
      - 24
      - 4
  - id: storage
    label: 状態・補助情報
    z: 0
    size:
      - 24
      - 4
nodes:
  n0:
    label: 変更の保存元
    kind: service
    tier: flow
    x: 0
    'y': 1.5
    description: マニフェストを Git に置く。
    evidence:
      - type: doc
        ref: docs/reference-flux-cd.md#§2
  n1:
    label: ソースの取得
    kind: service
    tier: flow
    x: 5
    'y': 1.5
    description: GitRepository の参照先を取得し変更を監視する。
    evidence:
      - type: doc
        ref: docs/reference-flux-cd.md#§2
  n2:
    label: 取得物
    kind: file
    tier: storage
    x: 8
    'y': 1.5
    description: 取得したリビジョンを tar.gz artifact として公開する。
    evidence:
      - type: doc
        ref: docs/reference-flux-cd.md#§2
  n3:
    label: 構成の照合
    kind: service
    tier: flow
    x: 15
    'y': 1.5
    description: artifact のマニフェストを生成し Kubernetes API に適用、指定間隔で差分を照合する。
    evidence:
      - type: doc
        ref: docs/reference-flux-cd.md#§2
  n4:
    label: 稼働中の構成
    kind: service
    tier: flow
    x: 20
    'y': 1.5
    description: Deployment の目標仕様が更新される。
    evidence:
      - type: doc
        ref: docs/reference-flux-cd.md#§2
links:
  - id: l0
    from: n0
    to: n1
    label: Git リビジョンを取得
    evidence:
      - type: doc
        ref: docs/reference-flux-cd.md#§2
  - id: l1
    from: n1
    to: n2
    label: artifact を生成
    evidence:
      - type: doc
        ref: docs/reference-flux-cd.md#§2
  - id: l2
    from: n2
    to: n3
    label: artifact を取得
    evidence:
      - type: doc
        ref: docs/reference-flux-cd.md#§2
  - id: l3
    from: n3
    to: n4
    label: 構成を適用・照合
    evidence:
      - type: doc
        ref: docs/reference-flux-cd.md#§2
scenarios:
  - id: operation
    label: 定義から反映まで
    evidence:
      - type: doc
        ref: docs/reference-flux-cd.md#§2
    steps:
      - links:
          - l0
        note: Git リビジョンを取得。
      - links:
          - l1
        note: artifact を生成。
      - links:
          - l2
        note: artifact を取得。
      - links:
          - l3
        note: 構成を適用・照合。
implementations:
  - id: example
    label: Kubernetes クラスタ内の Flux
    description: >-
      利用者が管理する Kubernetes に source-controller と kustomize-controller を配置し、外部 Git の YAML を同じクラスタに反映する例。prune
      と照合停止は設定に依存する。
    sources:
      - title: GitRepository
        url: https://fluxcd.io/flux/components/source/gitrepositories/
      - title: Kustomization
        url: https://fluxcd.io/flux/components/kustomize/kustomizations/
      - title: Flux architecture
        url: https://fluxcd.io/flux/flux-e2e/
    tiers:
      - id: flow
        label: 定義・処理・対象
        z: 1
        size:
          - 24
          - 4
      - id: storage
        label: 状態・補助情報
        z: 0
        size:
          - 24
          - 4
    nodes:
      ex-n0:
        label: 外部 Git リポジトリ
        kind: service
        tier: flow
        x: 0
        'y': 1.5
        description: マニフェストを Git に置く。
        realizes:
          - n0
        evidence:
          - type: doc
            ref: docs/reference-flux-cd.md#§4
      ex-n1:
        label: source-controller と GitRepository
        kind: service
        tier: flow
        x: 5
        'y': 1.5
        description: GitRepository の参照先を取得し変更を監視する。
        realizes:
          - n1
        evidence:
          - type: doc
            ref: docs/reference-flux-cd.md#§4
      ex-n2:
        label: リビジョン付き artifact
        kind: file
        tier: storage
        x: 8
        'y': 1.5
        description: 取得したリビジョンを tar.gz artifact として公開する。
        realizes:
          - n2
        evidence:
          - type: doc
            ref: docs/reference-flux-cd.md#§4
      ex-n3:
        label: kustomize-controller と Kustomization
        kind: service
        tier: flow
        x: 15
        'y': 1.5
        description: artifact のマニフェストを生成し Kubernetes API に適用、指定間隔で差分を照合する。
        realizes:
          - n3
        evidence:
          - type: doc
            ref: docs/reference-flux-cd.md#§4
      ex-n4:
        label: Kubernetes API と Deployment
        kind: service
        tier: flow
        x: 20
        'y': 1.5
        description: Deployment の目標仕様が更新される。
        realizes:
          - n4
        evidence:
          - type: doc
            ref: docs/reference-flux-cd.md#§4
    groups:
      - kind: cluster
        label: 利用者管理の Kubernetes クラスタ
        provider: k8s
        tier:
          - flow
          - storage
        nodes:
          - ex-n1
          - ex-n2
          - ex-n3
          - ex-n4
