name: Prometheus と Grafana によるメトリクス監視
description: Prometheus がメトリクスを取得して蓄積し、Grafana と Alertmanager を使って可視化と通知を行う。
reference:
  objectives:
    - 対象から収集・保存・分析までの流れを追う。
    - 通知と運用担当者の役割を区別する。
    - 収集方法と保存・権限の前提を理解する。
  sources:
    - title: Prometheus overview
      url: https://prometheus.io/docs/introduction/overview/
    - title: Grafana support for Prometheus
      url: https://prometheus.io/docs/visualization/grafana/
    - title: Alertmanager
      url: https://prometheus.io/docs/alerting/latest/alertmanager/
sources:
  - docs/reference-monitoring-prometheus.md
evidence:
  - type: doc
    ref: docs/reference-monitoring-prometheus.md#§1
  - type: doc
    ref: docs/reference-monitoring-prometheus.md#§3
tiers:
  - id: flow
    label: 収集と分析
    z: 1
    size:
      - 20
      - 3
  - id: ops
    label: 通知と運用
    z: 0
    size:
      - 14
      - 3
nodes:
  app:
    label: 監視対象
    kind: service
    tier: flow
    x: 0
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  collector:
    label: テレメトリ収集
    kind: service
    tier: flow
    x: 4
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  store:
    label: データの保存と問い合わせ
    kind: db
    tier: flow
    x: 8
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  dashboard:
    label: 監視画面
    kind: service
    tier: flow
    x: 12
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  operator:
    label: 運用担当者
    kind: actor
    tier: ops
    x: 12
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  alert:
    label: アラートと通知
    kind: service
    tier: ops
    x: 8
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
links:
  - id: capture
    from: app
    to: collector
    label: メトリクスを公開
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  - id: ingest
    from: store
    to: collector
    label: 定期的に取得
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  - id: view
    from: store
    to: dashboard
    label: データを検索・表示
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  - id: inspect
    from: operator
    to: dashboard
    label: 状況を確認
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  - id: check
    from: store
    to: alert
    label: 通知条件を評価
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  - id: notify
    from: alert
    to: operator
    label: アラートを通知
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
scenarios:
  - id: monitor
    label: 監視と通知
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
    steps:
      - links:
          - capture
          - ingest
        note: 公開されたメトリクスを Prometheus が取得する。
      - links:
          - view
          - inspect
        note: 時系列データを可視化し確認する。
      - links:
          - check
          - notify
        note: ルールのアラートを Alertmanager が配送する。
implementations:
  - id: example
    label: Prometheus・Grafana・Alertmanager
    description: 監視対象のエンドポイントを Prometheus が取得する構成。各 OSS 部品の配置は別途設計する。
    sources:
      - title: Prometheus overview
        url: https://prometheus.io/docs/introduction/overview/
      - title: Grafana support for Prometheus
        url: https://prometheus.io/docs/visualization/grafana/
      - title: Alertmanager
        url: https://prometheus.io/docs/alerting/latest/alertmanager/
    tiers:
      - id: flow
        label: 収集と分析
        z: 1
        size:
          - 20
          - 3
      - id: ops
        label: 通知と運用
        z: 0
        size:
          - 14
          - 3
    nodes:
      ex-app:
        label: 計装アプリ・監視対象
        kind: service
        tier: flow
        x: 0
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§4
        realizes:
          - app
      ex-collector:
        label: メトリクスエンドポイント
        kind: service
        tier: flow
        x: 4
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§4
        realizes:
          - collector
      ex-store:
        label: Prometheus 取得・時系列保存
        kind: db
        tier: flow
        x: 8
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§4
        realizes:
          - store
      ex-dashboard:
        label: Grafana ダッシュボード
        kind: service
        tier: flow
        x: 12
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§4
        realizes:
          - dashboard
      ex-operator:
        label: 運用担当者
        kind: actor
        tier: ops
        x: 12
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§4
        realizes:
          - operator
      ex-alert:
        label: Prometheus ルールと Alertmanager
        kind: service
        tier: ops
        x: 8
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§4
        realizes:
          - alert
