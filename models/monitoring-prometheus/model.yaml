name: Prometheus と Grafana によるメトリクス監視
description: Prometheus がメトリクスを取得して蓄積し、Grafana と Alertmanager を使って可視化と通知を行う。
reference:
  objectives:
    - 対象から収集・保存・分析までの流れを追う。
    - 通知と運用担当者の役割を区別する。
    - 収集方法と保存・権限の前提を理解する。
  sources:
    - title: Prometheus overview
      url: https://prometheus.io/docs/introduction/overview/
    - title: Grafana support for Prometheus
      url: https://prometheus.io/docs/visualization/grafana/
    - title: Alertmanager
      url: https://prometheus.io/docs/alerting/latest/alertmanager/
sources:
  - docs/reference-monitoring-prometheus.md
evidence:
  - type: doc
    ref: docs/reference-monitoring-prometheus.md#§1
  - type: doc
    ref: docs/reference-monitoring-prometheus.md#§3
tiers:
  - id: flow
    label: 収集と分析
    z: 1
    size:
      - 20
      - 3
  - id: ops
    label: 通知と運用
    z: 0
    size:
      - 14
      - 3
nodes:
  app:
    label: 監視対象
    kind: service
    tier: flow
    x: 0
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  collector:
    label: テレメトリ収集
    kind: service
    tier: flow
    x: 4
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  store:
    label: データの保存と問い合わせ
    kind: db
    tier: flow
    x: 8
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  dashboard:
    label: 監視画面
    kind: service
    tier: flow
    x: 12
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  operator:
    label: 運用担当者
    kind: actor
    tier: ops
    x: 12
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  alert:
    label: アラートと通知
    kind: service
    tier: ops
    x: 8
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
links:
  - id: capture
    from: app
    to: collector
    label: メトリクスを公開
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  - id: ingest
    from: store
    to: collector
    label: 定期的に取得
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  - id: view
    from: store
    to: dashboard
    label: データを検索・表示
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  - id: inspect
    from: operator
    to: dashboard
    label: 状況を確認
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  - id: check
    from: store
    to: alert
    label: 通知条件を評価
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
  - id: notify
    from: alert
    to: operator
    label: アラートを通知
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
scenarios:
  - id: monitor
    label: 監視と通知
    evidence:
      - type: doc
        ref: docs/reference-monitoring-prometheus.md#§2
    steps:
      - links:
          - capture
          - ingest
        note: 公開されたメトリクスを Prometheus が取得する。
      - links:
          - view
          - inspect
        note: 時系列データを可視化し確認する。
      - links:
          - check
          - notify
        note: ルールのアラートを Alertmanager が配送する。
implementations:
  - id: example
    label: Prometheus・Grafana・Alertmanager
    description: 監視対象のエンドポイントを Prometheus が取得する構成。各 OSS 部品の配置は別途設計する。
    sources:
      - title: Prometheus overview
        url: https://prometheus.io/docs/introduction/overview/
      - title: Grafana support for Prometheus
        url: https://prometheus.io/docs/visualization/grafana/
      - title: Alertmanager
        url: https://prometheus.io/docs/alerting/latest/alertmanager/
    tiers:
      - id: flow
        label: 収集と分析
        z: 1
        size:
          - 20
          - 3
      - id: ops
        label: 通知と運用
        z: 0
        size:
          - 14
          - 3
    nodes:
      ex-app-host: {label: 利用者管理のアプリホスト, kind: host, tier: flow, x: 0, y: 2, description: 計装アプリと公開エンドポイントを実行する。, evidence: [{type: doc, ref: docs/reference-monitoring-prometheus.md#§4}]}
      ex-monitor-host: {label: 利用者管理の監視ホスト, kind: host, tier: flow, x: 8, y: 2, description: Prometheus、Grafana、Alertmanager を実行する例。, evidence: [{type: doc, ref: docs/reference-monitoring-prometheus.md#§4}]}
      ex-disk: {label: Prometheus ローカル TSDB ディスク, kind: db, tier: ops, x: 4, y: 2, description: 取得した時系列をローカルに保存する。, evidence: [{type: doc, ref: docs/reference-monitoring-prometheus.md#§4}]}
      ex-app:
        label: 計装アプリ・監視対象
        kind: service
        tier: flow
        x: 0
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§4
        realizes:
          - app
      ex-collector:
        label: メトリクスエンドポイント
        kind: service
        tier: flow
        x: 4
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§4
        realizes:
          - collector
      ex-store:
        label: Prometheus 取得・時系列保存
        kind: db
        tier: flow
        x: 8
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§4
        realizes:
          - store
      ex-dashboard:
        label: Grafana ダッシュボード
        kind: service
        tier: flow
        x: 12
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§4
        realizes:
          - dashboard
      ex-operator:
        label: 運用担当者
        kind: actor
        tier: ops
        x: 12
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§4
        realizes:
          - operator
      ex-alert:
        label: Prometheus ルールと Alertmanager
        kind: service
        tier: ops
        x: 8
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§4
        realizes:
          - alert
    links:
      - {id: ex-host-app, from: ex-app-host, to: ex-app, label: 計装アプリを実行, evidence: [{type: doc, ref: docs/reference-monitoring-prometheus.md#§4}]}
      - {id: ex-host-prom, from: ex-monitor-host, to: ex-store, label: Prometheus を実行, evidence: [{type: doc, ref: docs/reference-monitoring-prometheus.md#§4}]}
      - {id: ex-tsdb, from: ex-store, to: ex-disk, label: 時系列を保存, evidence: [{type: doc, ref: docs/reference-monitoring-prometheus.md#§4}]}

    layout2d:
      tiers: [{id: diagram, label: 実行基盤と監視サービス, z: 0, origin: [-3, 0], size: [26, 15]}]
      nodes:
        ex-app-host: {tier: diagram, x: 1, y: 1}
        ex-app: {tier: diagram, x: 4, y: 1}
        ex-collector: {tier: diagram, x: 7, y: 1}
        ex-monitor-host: {tier: diagram, x: 14, y: 1}
        ex-store: {tier: diagram, x: 17, y: 1}
        ex-disk: {tier: diagram, x: 20, y: 1}
        ex-dashboard: {tier: diagram, x: 14, y: 4}
        ex-alert: {tier: diagram, x: 17, y: 4}
        ex-operator: {tier: diagram, x: -2, y: 1}
      groups:
        - {kind: datacenter, label: アプリホスト, tier: [diagram], x0: -1, y0: 0.5, x1: 10, y1: 11, nodes: [ex-app-host, ex-app, ex-collector]}
        - {kind: datacenter, label: 監視ホスト, tier: [diagram], x0: 11.5, y0: 0.5, x1: 23, y1: 9, nodes: [ex-monitor-host, ex-store, ex-disk, ex-dashboard, ex-alert]}
    layout3d:
      tiers:
        - {id: hosts, label: 実行基盤, z: 0, size: [10, 10]}
        - {id: apps, label: ノード上の処理, z: 1, size: [10, 10]}
        - {id: services, label: 独立サービス・監視ホスト, z: 0, origin: [13, 0], size: [10, 9]}
        - {id: serviceapps, label: 監視ホスト上の処理, z: 1, origin: [13, 0], size: [10, 9]}
        - {id: outside, label: 利用者, z: 0, origin: [-5, 0], size: [4, 4]}
      nodes:
        ex-app-host: {tier: hosts, x: 1, y: 1}
        ex-app: {tier: apps, x: 4, y: 1}
        ex-collector: {tier: apps, x: 7, y: 1}
        ex-monitor-host: {tier: services, x: 1, y: 1}
        ex-store: {tier: serviceapps, x: 4, y: 1}
        ex-disk: {tier: serviceapps, x: 7, y: 1}
        ex-dashboard: {tier: serviceapps, x: 1, y: 4}
        ex-alert: {tier: serviceapps, x: 4, y: 4}
        ex-operator: {tier: outside, x: 1, y: 1}
      groups:
        - {kind: datacenter, label: アプリホスト, tier: [hosts, apps], nodes: [ex-app-host, ex-app, ex-collector]}
        - {kind: datacenter, label: 監視ホスト, tier: [services, serviceapps], nodes: [ex-monitor-host, ex-store, ex-disk, ex-dashboard, ex-alert]}

  - id: aws-managed-prometheus
    label: AWS：EKS・Managed Prometheus・Managed Grafana
    description: EKS 上のアプリを AMP のマネージドスクレイパーで収集し、Grafana と Alertmanager / SNS で監視する例。
    sources:
      - {title: EKS Control Plane, url: https://docs.aws.amazon.com/eks/latest/best-practices/control-plane.html}
      - title: Managed collectors for EKS
        url: https://docs.aws.amazon.com/prometheus/latest/userguide/AMP-collector-how-to.html
      - title: Prometheus data source in Amazon Managed Grafana
        url: https://docs.aws.amazon.com/grafana/latest/userguide/amazon-prometheus-data-source.html
      - title: Prometheus alert manager
        url: https://docs.aws.amazon.com/prometheus/latest/userguide/AMP-alert-manager.html
      - title: EKS managed node groups
        url: https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html
    tiers:
      - id: users
        label: 利用と通知
        z: 2
        size:
          - 16
          - 3
      - id: cluster
        label: EKS の監視対象
        z: 1
        size:
          - 16
          - 3
      - id: services
        label: マネージド監視サービス
        z: 0
        size:
          - 16
          - 3
    groups:
      - kind: cloud
        label: AWS サービス領域（EKS 制御プレーンは AWS 管理 VPC）
        provider: aws
        tier:
          - users
          - cluster
          - services
        nodes:
          - amp-eks
          - amp-ec2
          - amp-app
          - amp-endpoint
          - amp-scraper
          - amp-workspace
          - amp-grafana
          - amp-rules
          - amp-sns
      - kind: cluster
        label: EKS クラスタ
        tier:
          - cluster
        nodes:
          - amp-ec2
          - amp-app
          - amp-endpoint
    nodes:
      amp-operator:
        label: 運用担当者
        kind: actor
        tier: users
        x: 0
        'y': 1.5
        realizes:
          - operator
        description: ダッシュボードと通知を確認する。
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§5
      amp-eks:
        label: Amazon EKS
        svc: eks
        kind: service
        tier: cluster
        x: 0
        'y': 1.5
        description: AWS 管理 VPC で動く Kubernetes 制御プレーン。利用者は Kubernetes API と公開設定を操作するが、制御プレーンサーバーには直接アクセスしない。
        management: {type: aws, scope: AWS が制御プレーン基盤を運用し、利用者は API と公開設定を操作する。}
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§5
      amp-ec2:
        label: EC2 / EKS ノード
        svc: ec2
        kind: host
        tier: cluster
        x: 4
        'y': 1.5
        description: マネージドノードグループでアプリ Pod を実行する。
        management: {type: shared, scope: EKS がノードを作成・更新し、利用者が設定と更新開始を担う。}
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§5
      amp-app:
        label: 計装アプリ Pod
        kind: service
        tier: cluster
        x: 8
        'y': 1.5
        realizes:
          - app
        description: Prometheus 形式のメトリクスを公開するアプリ。
        management: {type: customer, scope: 利用者がアプリと計装を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§5
      amp-endpoint:
        label: アプリの /metrics
        kind: service
        tier: cluster
        x: 12
        'y': 1.5
        realizes:
          - collector
        description: スクレイパーから取得できるエンドポイント。
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§5
      amp-scraper:
        label: AMP マネージドスクレイパー
        svc: amp
        kind: service
        tier: services
        x: 0
        'y': 1.5
        description: EKS の対象を発見しメトリクスを定期収集する。
        management: {type: shared, scope: AWS がスクレイパー基盤を運用し、利用者が収集設定と権限を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§5
      amp-workspace:
        label: Amazon Managed Prometheus
        svc: amp
        kind: db
        tier: services
        x: 4
        'y': 1.5
        realizes:
          - store
        description: ワークスペースにメトリクスを保存し PromQL を提供する。
        management: {type: shared, scope: AWS が基盤を運用し、利用者がデータとアクセスを管理する。}
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§5
      amp-grafana:
        label: Amazon Managed Grafana
        svc: grafana
        kind: service
        tier: services
        x: 8
        'y': 1.5
        realizes:
          - dashboard
        description: Prometheus ワークスペースをデータソースとして設定する。
        management: {type: shared, scope: AWS が基盤を運用し、利用者がデータソースと画面を設定する。}
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§5
      amp-rules:
        label: AMP ルール / Alertmanager
        svc: amp
        kind: service
        tier: services
        x: 12
        'y': 1.5
        realizes:
          - alert
        description: ワークスペースのルールを評価し、設定された通知先に送る。
        management: {type: shared, scope: AWS が基盤を運用し、利用者がルールと通知設定を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§5
      amp-sns:
        label: Amazon SNS
        svc: sns
        kind: service
        tier: users
        x: 8
        'y': 1.5
        description: Alertmanager の通知を受けるトピック。購読を別途構成する。
        management: {type: shared, scope: AWS が基盤を運用し、利用者がトピックと購読を設定する。}
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§5
    links:
      - id: amp-eks-schedule
        from: amp-eks
        to: amp-app
        label: アプリ Pod を配置
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§5
      - id: amp-ec2-run
        from: amp-ec2
        to: amp-app
        label: アプリ Pod を実行
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§5
      - id: amp-pull
        from: amp-scraper
        to: amp-endpoint
        label: メトリクスを取得
        realizes:
          - ingest
        replace: true
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§5
      - id: amp-write
        from: amp-scraper
        to: amp-workspace
        label: 時系列を送信
        realizes:
          - ingest
        replace: true
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§5
      - id: amp-query
        from: amp-grafana
        to: amp-workspace
        label: PromQL で問い合わせ
        realizes:
          - view
        replace: true
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§5
      - id: amp-notify-sns
        from: amp-rules
        to: amp-sns
        label: アラートを発行
        realizes:
          - notify
        replace: true
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§5
      - id: amp-sns-delivery
        from: amp-sns
        to: amp-operator
        label: 購読者に通知
        realizes:
          - notify
        replace: true
        evidence:
          - type: doc
            ref: docs/reference-monitoring-prometheus.md#§5

    layout2d:
      tiers: [{id: diagram, label: 実行基盤と監視サービス, z: 0, origin: [-3, 0], size: [27, 15]}]
      nodes:
        amp-eks: {tier: diagram, x: 1, y: 1}
        amp-ec2: {tier: diagram, x: 4, y: 1}
        amp-app: {tier: diagram, x: 7, y: 1}
        amp-endpoint: {tier: diagram, x: 1, y: 4}
        amp-scraper: {tier: diagram, x: 14, y: 1}
        amp-workspace: {tier: diagram, x: 17, y: 1}
        amp-grafana: {tier: diagram, x: 20, y: 1}
        amp-rules: {tier: diagram, x: 14, y: 4}
        amp-sns: {tier: diagram, x: 17, y: 4}
        amp-operator: {tier: diagram, x: -4, y: 1}
      groups:
        - {kind: cloud, provider: aws, label: AWS サービス領域, tier: [diagram], x0: -1.5, y0: 0, x1: 24, y1: 12, nodes: [amp-eks, amp-ec2, amp-app, amp-endpoint, amp-scraper, amp-workspace, amp-grafana, amp-rules, amp-sns]}
        - {kind: cluster, label: EKS 論理クラスタ（制御プレーンは AWS 管理 VPC）, tier: [diagram], x0: -1, y0: 0.5, x1: 10, y1: 12, nodes: [amp-eks, amp-ec2, amp-app, amp-endpoint]}
    layout3d:
      tiers:
        - {id: hosts, label: 実行基盤, z: 0, size: [10, 10]}
        - {id: apps, label: ノード上の処理, z: 1, size: [10, 10]}
        - {id: services, label: 独立サービス・監視ホスト, z: 0, origin: [13, 0], size: [10, 9]}
        - {id: serviceapps, label: 監視ホスト上の処理, z: 1, origin: [13, 0], size: [10, 9]}
        - {id: outside, label: 利用者, z: 0, origin: [-5, 0], size: [4, 4]}
      nodes:
        amp-eks: {tier: services, x: 8, y: 7}
        amp-ec2: {tier: hosts, x: 4, y: 1}
        amp-app: {tier: apps, x: 7, y: 1}
        amp-endpoint: {tier: apps, x: 1, y: 4}
        amp-scraper: {tier: services, x: 1, y: 1}
        amp-workspace: {tier: services, x: 4, y: 1}
        amp-grafana: {tier: services, x: 7, y: 1}
        amp-rules: {tier: services, x: 1, y: 4}
        amp-sns: {tier: services, x: 4, y: 4}
        amp-operator: {tier: outside, x: 1, y: 1}
      groups:
        - {kind: cloud, provider: aws, label: AWS サービス領域, tier: [hosts, apps, services], nodes: [amp-eks, amp-ec2, amp-app, amp-endpoint, amp-scraper, amp-workspace, amp-grafana, amp-rules, amp-sns]}
