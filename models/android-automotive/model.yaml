name: Android Automotive OS と VHAL
description: 車載アプリから Car Service、VHAL と車両プロパティへ接続する。
reference:
  objectives:
    - Car API、Car Service と VHAL を区別する。
    - 模擬ハードウェアと実車実装を区別する。
  sources:
    - title: Vehicle HAL overview
      url: https://source.android.com/docs/automotive/vhal
    - title: VHAL reference implementation
      url: https://source.android.com/docs/automotive/vhal/reference-implementation
sources:
  - docs/reference-android-automotive.md
evidence:
  - type: doc
    ref: docs/reference-android-automotive.md#§1
  - type: doc
    ref: docs/reference-android-automotive.md#§3
tiers:
  - id: flow
    label: 車載 API と HAL
    z: 1
    size:
      - 20
      - 3
  - id: support
    label: 車両プロパティ
    z: 0
    size:
      - 20
      - 3
nodes:
  app:
    label: 車載アプリ
    kind: service
    tier: flow
    x: 0
    'y': 1.5
    description: 車載 API を呼び出す。
    evidence:
      - type: doc
        ref: docs/reference-android-automotive.md#§2
  service:
    label: 車載サービス
    kind: service
    tier: flow
    x: 4
    'y': 1.5
    description: Car API の呼び出しを処理する。
    evidence:
      - type: doc
        ref: docs/reference-android-automotive.md#§2
  hal:
    label: 車両抽象化 API
    kind: service
    tier: flow
    x: 8
    'y': 1.5
    description: 車両プロパティを抽象化する。
    evidence:
      - type: doc
        ref: docs/reference-android-automotive.md#§2
  hardware:
    label: 模擬車両実装
    kind: service
    tier: flow
    x: 12
    'y': 1.5
    description: 参照実装で模擬値を扱う。
    evidence:
      - type: doc
        ref: docs/reference-android-automotive.md#§2
  properties:
    label: 模擬プロパティ
    kind: db
    tier: support
    x: 12
    'y': 1.5
    description: 実車ではないメモリ内の模擬値。
    evidence:
      - type: doc
        ref: docs/reference-android-automotive.md#§2
links:
  - id: call
    from: app
    to: service
    label: Car API を呼ぶ
    evidence:
      - type: doc
        ref: docs/reference-android-automotive.md#§2
  - id: access
    from: service
    to: hal
    label: 車両プロパティを要求
    evidence:
      - type: doc
        ref: docs/reference-android-automotive.md#§2
  - id: delegate
    from: hal
    to: hardware
    label: 処理を委譲
    evidence:
      - type: doc
        ref: docs/reference-android-automotive.md#§2
  - id: read
    from: hardware
    to: properties
    label: 模擬値を読み書き
    evidence:
      - type: doc
        ref: docs/reference-android-automotive.md#§2
scenarios:
  - id: property
    label: 模擬プロパティへのアクセス
    evidence:
      - type: doc
        ref: docs/reference-android-automotive.md#§2
    steps:
      - links:
          - call
          - access
          - delegate
          - read
        note: アプリが車両プロパティにアクセスする。
implementations:
  - id: example
    label: AOSP VHAL 参照実装
    description: FakeVehicleHardware を用いる参照実装の例。実車のハードウェア接続は OEM の実装による。
    sources:
      - title: Vehicle HAL overview
        url: https://source.android.com/docs/automotive/vhal
      - title: VHAL reference implementation
        url: https://source.android.com/docs/automotive/vhal/reference-implementation
    tiers:
      - id: flow
        label: 車載 API と HAL
        z: 1
        size:
          - 20
          - 3
      - id: support
        label: 車両プロパティ
        z: 0
        size:
          - 20
          - 3
    nodes:
      ex-host: {label: AAOS 実行環境（機種未選定）, kind: host, tier: flow, x: 1, y: 2, description: AAOS と VHAL 参照実装を動かす利用者管理の実行環境。, evidence: [{type: doc, ref: docs/reference-android-automotive.md#§4}]}
      ex-app:
        label: 車載 Android アプリ
        kind: service
        tier: flow
        x: 0
        'y': 1.5
        description: 車載 API を呼び出す。
        realizes:
          - app
        evidence:
          - type: doc
            ref: docs/reference-android-automotive.md#§4
      ex-service:
        label: Android Car Service
        kind: service
        tier: flow
        x: 4
        'y': 1.5
        description: Car API の呼び出しを処理する。
        realizes:
          - service
        evidence:
          - type: doc
            ref: docs/reference-android-automotive.md#§4
      ex-hal:
        label: AIDL Vehicle HAL
        kind: service
        tier: flow
        x: 8
        'y': 1.5
        description: 車両プロパティを抽象化する。
        realizes:
          - hal
        evidence:
          - type: doc
            ref: docs/reference-android-automotive.md#§4
      ex-hardware:
        label: FakeVehicleHardware
        kind: service
        tier: flow
        x: 12
        'y': 1.5
        description: 参照実装で模擬値を扱う。
        realizes:
          - hardware
        evidence:
          - type: doc
            ref: docs/reference-android-automotive.md#§4
      ex-properties:
        label: 模擬車両プロパティ
        kind: db
        tier: support
        x: 12
        'y': 1.5
        description: 実車ではないメモリ内の模擬値。
        realizes:
          - properties
        evidence:
          - type: doc
            ref: docs/reference-android-automotive.md#§4
    links:
      - {id: ex-host-app, from: ex-host, to: ex-app, label: AAOS とアプリを実行, evidence: [{type: doc, ref: docs/reference-android-automotive.md#§4}]}

    layout2d:
      tiers: [{id: diagram, label: ホストと実行環境, z: 0, size: [20, 14]}]
      nodes:
        ex-host: {tier: diagram, x: 2, y: 1}
        ex-service: {tier: diagram, x: 10, y: 2}
        ex-hal: {tier: diagram, x: 13, y: 2}
        ex-hardware: {tier: diagram, x: 16, y: 2}
        ex-properties: {tier: diagram, x: 10, y: 5}
        ex-app: {tier: diagram, x: 13, y: 5}
      groups:
        - {kind: datacenter, label: 利用者の実行ホスト, tier: [diagram], x0: 0, y0: 0, x1: 19, y1: 12, nodes: [ex-host, ex-service, ex-hal, ex-hardware, ex-properties, ex-app]}
        - {kind: cluster, label: AAOS 参照実行環境, tier: [diagram], x0: 8, y0: 1, x1: 19, y1: 11, nodes: [ex-service, ex-hal, ex-hardware, ex-properties, ex-app]}
    layout3d:
      tiers:
        - {id: host, label: 物理ホストとホスト側処理, z: 0, size: [13, 9]}
        - {id: os, label: OS・実行基盤, z: 1, size: [13, 9]}
        - {id: apps, label: アプリ, z: 2, size: [13, 9]}
      nodes:
        ex-host: {tier: host, x: 1, y: 1}
        ex-service: {tier: os, x: 1, y: 1}
        ex-hal: {tier: os, x: 4, y: 1}
        ex-hardware: {tier: os, x: 7, y: 1}
        ex-properties: {tier: os, x: 10, y: 1}
        ex-app: {tier: apps, x: 1, y: 1}
      groups:
        - {kind: datacenter, label: 利用者の実行ホスト, tier: [host, os, apps], nodes: [ex-host, ex-service, ex-hal, ex-hardware, ex-properties, ex-app]}
        - {kind: cluster, label: AAOS 参照実行環境, tier: [os, apps], nodes: [ex-service, ex-hal, ex-hardware, ex-properties, ex-app]}

  - id: aosp-cuttlefish-x86
    label: "Linux 開発ホスト：Android 15 Cuttlefish・模擬 VHAL"
    description: "x86-64 Cuttlefish の AAOS ゲストと Linux ホスト上の模擬 VHAL を gRPC / vsock でつなぐ AOSP ソースの実行構成。"
    sources:
      - {title: "Cuttlefish host requirements", url: https://source.android.com/docs/devices/cuttlefish/get-started}
      - {title: "AOSP Android 15 automotive product", url: https://android.googlesource.com/device/google/cuttlefish/+/refs/tags/android-15.0.0_r7/vsoc_x86_64_only/auto/aosp_cf.mk}
      - {title: "Cuttlefish guest VehicleService", url: https://android.googlesource.com/device/google/cuttlefish/+/refs/tags/android-15.0.0_r7/guest/hals/vehicle/VehicleService.cpp}
      - {title: "Cuttlefish host VHAL proxy", url: https://android.googlesource.com/device/google/cuttlefish/+/refs/tags/android-15.0.0_r7/host/commands/vhal_proxy_server/VhalProxyServer.cpp}
      - {title: "VHAL reference implementation", url: https://source.android.com/docs/automotive/vhal/reference-implementation}
    tiers:
      - {id: guest, label: "AAOS Cuttlefish ゲスト", z: 1, size: [20, 4]}
      - {id: host, label: "Linux 開発ホスト", z: 0, size: [20, 4]}
    groups:
      - {kind: datacenter, label: "AAOS 仮想マシン", provider: onprem, tier: [guest], nodes: [aaos-cf-guest-os, aaos-cf-app, aaos-cf-service, aaos-cf-hal]}
      - {kind: datacenter, label: "Linux x86-64 / KVM", provider: onprem, tier: [host], nodes: [aaos-cf-vm, aaos-cf-proxy, aaos-cf-fake, aaos-cf-values]}
    nodes:
      aaos-cf-guest-os: {label: AAOS ゲスト OS, kind: host, tier: guest, x: 1, y: 3, description: Cuttlefish 仮想マシンでアプリと Car Service を実行する。, evidence: [{type: doc, ref: docs/reference-android-automotive.md#§5}]}
      aaos-cf-app: {label: "AAOS テストアプリ / Car API", kind: client, tier: guest, x: 3, y: 1.5, realizes: [app], description: "許可された車両プロパティを Car API で要求する。", evidence: [{type: doc, ref: "docs/reference-android-automotive.md#§5"}]}
      aaos-cf-service: {label: "Android Car Service", kind: service, tier: guest, x: 8, y: 1.5, realizes: [service], description: "プロパティ要求を権限に従って AIDL VHAL に渡す。", evidence: [{type: doc, ref: "docs/reference-android-automotive.md#§5"}]}
      aaos-cf-hal: {label: "Cuttlefish AIDL VHAL", kind: gateway, tier: guest, x: 13, y: 1.5, realizes: [hal], description: "ゲスト側の DefaultVehicleHal と GRPCVehicleHardware。", evidence: [{type: doc, ref: "docs/reference-android-automotive.md#§5"}]}
      aaos-cf-vm: {label: "Linux ホスト / KVM・Cuttlefish", kind: host, tier: host, x: 3, y: 1.5, description: "仮想化を有効にした開発ホストで AAOS のゲストを起動する。", evidence: [{type: doc, ref: "docs/reference-android-automotive.md#§5"}]}
      aaos-cf-proxy: {label: "vhal_proxy_server", kind: service, tier: host, x: 8, y: 1.5, description: "vsock でゲストからの gRPC を受けるホストプロセス。", evidence: [{type: doc, ref: "docs/reference-android-automotive.md#§5"}]}
      aaos-cf-fake: {label: "FakeVehicleHardware", kind: worker, tier: host, x: 13, y: 1.5, realizes: [hardware], description: "ホストの VHAL proxy に組み込まれた模擬ハードウェア実装。", evidence: [{type: doc, ref: "docs/reference-android-automotive.md#§5"}]}
      aaos-cf-values: {label: "模擬プロパティ / JSON・メモリー", kind: db, tier: host, x: 18, y: 1.5, realizes: [properties], description: "設定からサポートするプロパティを読み、実行中の模擬値をメモリーで保持する。", evidence: [{type: doc, ref: "docs/reference-android-automotive.md#§5"}]}
    links:
      - {id: aaos-cf-guest-app, from: aaos-cf-guest-os, to: aaos-cf-app, label: テストアプリを実行, evidence: [{type: doc, ref: docs/reference-android-automotive.md#§5}]}
      - {id: aaos-cf-launch, from: aaos-cf-vm, to: aaos-cf-proxy, label: "ホスト側プロキシを起動", evidence: [{type: doc, ref: "docs/reference-android-automotive.md#§5"}]}
      - {id: aaos-cf-boot, from: aaos-cf-vm, to: aaos-cf-hal, label: "AAOS ゲストを起動", evidence: [{type: doc, ref: "docs/reference-android-automotive.md#§5"}]}
      - {id: aaos-cf-guest, from: aaos-cf-hal, to: aaos-cf-proxy, label: "gRPC / vsock で要求を転送", realizes: [delegate], replace: true, evidence: [{type: doc, ref: "docs/reference-android-automotive.md#§5"}]}
      - {id: aaos-cf-delegate, from: aaos-cf-proxy, to: aaos-cf-fake, label: "模擬ハードウェアへ要求を委譲", realizes: [delegate], replace: true, evidence: [{type: doc, ref: "docs/reference-android-automotive.md#§5"}]}

    layout2d:
      tiers: [{id: diagram, label: ホストと実行環境, z: 0, size: [20, 14]}]
      nodes:
        aaos-cf-vm: {tier: diagram, x: 2, y: 1}
        aaos-cf-proxy: {tier: diagram, x: 5, y: 1}
        aaos-cf-fake: {tier: diagram, x: 8, y: 1}
        aaos-cf-values: {tier: diagram, x: 2, y: 4}
        aaos-cf-guest-os: {tier: diagram, x: 10, y: 2}
        aaos-cf-service: {tier: diagram, x: 13, y: 2}
        aaos-cf-hal: {tier: diagram, x: 16, y: 2}
        aaos-cf-app: {tier: diagram, x: 10, y: 5}
      groups:
        - {kind: datacenter, label: 利用者の実行ホスト, tier: [diagram], x0: 0, y0: 0, x1: 19, y1: 12, nodes: [aaos-cf-vm, aaos-cf-proxy, aaos-cf-fake, aaos-cf-values, aaos-cf-guest-os, aaos-cf-service, aaos-cf-hal, aaos-cf-app]}
        - {kind: cluster, label: AAOS 仮想マシン, tier: [diagram], x0: 9, y0: 1, x1: 19, y1: 11, nodes: [aaos-cf-guest-os, aaos-cf-service, aaos-cf-hal, aaos-cf-app]}
    layout3d:
      tiers:
        - {id: host, label: 物理ホストとホスト側処理, z: 0, size: [13, 9]}
        - {id: os, label: OS・実行基盤, z: 1, size: [13, 9]}
        - {id: apps, label: アプリ, z: 2, size: [13, 9]}
      nodes:
        aaos-cf-vm: {tier: host, x: 1, y: 1}
        aaos-cf-proxy: {tier: host, x: 4, y: 1}
        aaos-cf-fake: {tier: host, x: 7, y: 1}
        aaos-cf-values: {tier: host, x: 10, y: 1}
        aaos-cf-guest-os: {tier: os, x: 1, y: 1}
        aaos-cf-service: {tier: os, x: 4, y: 1}
        aaos-cf-hal: {tier: os, x: 7, y: 1}
        aaos-cf-app: {tier: apps, x: 1, y: 1}
      groups:
        - {kind: datacenter, label: 利用者の実行ホスト, tier: [host, os, apps], nodes: [aaos-cf-vm, aaos-cf-proxy, aaos-cf-fake, aaos-cf-values, aaos-cf-guest-os, aaos-cf-service, aaos-cf-hal, aaos-cf-app]}
        - {kind: cluster, label: AAOS 仮想マシン, tier: [os, apps], nodes: [aaos-cf-guest-os, aaos-cf-service, aaos-cf-hal, aaos-cf-app]}
