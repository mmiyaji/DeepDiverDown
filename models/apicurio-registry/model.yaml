name: "Apicurio Registry の Avro スキーマ管理と互換性"
description: "Kafka 上の Avro メッセージを正しい writer schema で読み、スキーマ登録時の BACKWARD・FORWARD と履歴全体の検査を比較する。"
reference:
  objectives:
    - メッセージに付くスキーマ ID から実際の writer schema を取得する流れを説明する。
    - Avro の writer schema と reader schema の役割を区別する。
    - BACKWARD、FORWARD、FULL と transitive が検査する組み合わせを説明する。
  sources:
    - title: Apicurio Registry 3.4 Kafka SerDes
      url: >-
        https://www.apicur.io/registry/docs/apicurio-registry/3.4.x/getting-started/assembly-using-kafka-client-serdes.html
    - title: Apicurio Registry 3.4 Schema Compatibility Modes
      url: >-
        https://www.apicur.io/registry/docs/apicurio-registry/3.4.x/getting-started/assembly-registry-compatibility-modes.html
    - title: Apache Avro 1.12 Schema Resolution
      url: https://avro.apache.org/docs/1.12.0/specification/#schema-resolution
    - title: Apicurio Registry 3.2 Concepts Glossary
      url: >-
        https://www.apicur.io/registry/docs/apicurio-registry/3.2.x/getting-started/assembly-registry-concepts-glossary.html
sources: ["docs/reference-apicurio-registry.md"]
evidence:
  - {"type":"doc","ref":"docs/reference-apicurio-registry.md#§1"}
  - {"type":"doc","ref":"docs/reference-apicurio-registry.md#§2"}
  - {"type":"doc","ref":"docs/reference-apicurio-registry.md#§3"}
  - {"type":"doc","ref":"docs/reference-apicurio-registry.md#§4"}
  - {"type":"doc","ref":"docs/reference-apicurio-registry.md#§5"}
  - {"type":"doc","ref":"docs/reference-apicurio-registry.md#§6"}
tiers:
  - {"id":"kafka","label":"Kafka のアプリケーション","z":1,"origin":[0,0],"size":[16,3]}
  - {"id":"registry","label":"Apicurio Registry","z":0,"origin":[2,0],"size":[13,3]}
nodes:
  producer: {"label":"Avro Producer","kind":"actor","tier":"kafka","x":0,"y":1.5,"description":"Order スキーマを使って注文イベントを作る。","evidence":[{"type":"doc","ref":"docs/reference-apicurio-registry.md#§1"}]}
  serialize: {"label":"Avro Serializer","kind":"worker","tier":"kafka","x":4,"y":1.5,"description":"writer schema でエンコードし、レコードに対応するスキーマ ID を付ける。","evidence":[{"type":"doc","ref":"docs/reference-apicurio-registry.md#§2"}]}
  topic: {"label":"注文イベントのトピック","kind":"queue","tier":"kafka","x":8,"y":1.5,"description":"シリアライズしたメッセージとスキーマ参照を保持する。","evidence":[{"type":"doc","ref":"docs/reference-apicurio-registry.md#§2"}]}
  deserialize: {"label":"Avro Deserializer","kind":"worker","tier":"kafka","x":12,"y":1.5,"description":"メッセージの ID から writer schema を決めてレコードを復号する。","evidence":[{"type":"doc","ref":"docs/reference-apicurio-registry.md#§3"}]}
  app: {"label":"Consumer / reader schema","kind":"external","tier":"kafka","x":15,"y":1.5,"description":"この例では v2 の reader schema で注文を読む。","evidence":[{"type":"doc","ref":"docs/reference-apicurio-registry.md#§3"}]}
  submitter: {"label":"スキーマの登録者","kind":"actor","tier":"registry","x":1,"y":1.5,"description":"Order の新バージョンを提案する。","evidence":[{"type":"doc","ref":"docs/reference-apicurio-registry.md#§4"}]}
  policy: {"label":"互換性ルール","kind":"service","tier":"registry","x":6,"y":1.5,"description":"指定した方向と履歴の範囲で登録候補を検査する。","evidence":[{"type":"doc","ref":"docs/reference-apicurio-registry.md#§4"}]}
  versions: {"label":"Order のバージョンと内容 ID","kind":"db","tier":"registry","x":11,"y":1.5,"description":"スキーマのバージョンと対応するスキーマ内容を保持する。","evidence":[{"type":"doc","ref":"docs/reference-apicurio-registry.md#§2"}]}
links:
  - {"id":"make","from":"producer","to":"serialize","label":"v1 で注文を作る","evidence":[{"type":"doc","ref":"docs/reference-apicurio-registry.md#§2"}]}
  - {"id":"writer-id","from":"versions","to":"serialize","label":"writer schema の ID を解決する","evidence":[{"type":"doc","ref":"docs/reference-apicurio-registry.md#§2"}]}
  - {"id":"write","from":"serialize","to":"topic","label":"ID と Avro データを送る","evidence":[{"type":"doc","ref":"docs/reference-apicurio-registry.md#§2"}]}
  - {"id":"consume","from":"topic","to":"deserialize","label":"過去のメッセージを取得する","evidence":[{"type":"doc","ref":"docs/reference-apicurio-registry.md#§3"}]}
  - {"id":"by-id","from":"deserialize","to":"versions","label":"レコードの ID で writer schema を特定","evidence":[{"type":"doc","ref":"docs/reference-apicurio-registry.md#§3"}]}
  - {"id":"resolve","from":"deserialize","to":"app","label":"reader schema に解決する","evidence":[{"type":"doc","ref":"docs/reference-apicurio-registry.md#§3"}]}
  - {"id":"propose","from":"submitter","to":"policy","label":"新バージョンを提案する","evidence":[{"type":"doc","ref":"docs/reference-apicurio-registry.md#§4"}]}
  - {"id":"check","from":"policy","to":"versions","label":"比較対象と互換性を検査する","evidence":[{"type":"doc","ref":"docs/reference-apicurio-registry.md#§4"}]}
scenarios:
  - id: read-history
    label: v2 の Consumer が v1 の注文を読む
    visual: decode
    evidence:
      - type: doc
        ref: docs/reference-apicurio-registry.md#§3
    steps:
      - links:
          - make
          - writer-id
          - write
        note: v1 の writer schema で id=42 をエンコードし、v1 の内容を指す ID を Kafka レコードに付ける。
        blocks:
          registered:
            - id: v1
              label: v1 · id
              k: 0
            - id: v2
              label: v2 · currency = JPY
              k: 1
          topic:
            - id: old-message
              label: v1 の ID + Avro
              k: 0
          consumer: []
        highlight:
          - old-message
      - links:
          - consume
          - by-id
        note: v2 を使う下流も、メッセージが持つ ID で v1 の writer schema を取得する。
        highlight:
          - v1
          - old-message
      - links:
          - resolve
        note: v1 で読み取った id を v2 に解決する。v1 にない currency は v2 の既定値 JPY になる。
        blocks:
          registered:
            - id: v1
              label: v1 · id
              k: 0
            - id: v2
              label: v2 · currency = JPY
              k: 1
          topic:
            - id: old-message
              label: v1 の ID + Avro
              k: 0
          consumer:
            - id: value
              label: "#42 · JPY"
              k: 1
              from:
                - old-message
        highlight:
          - value
  - id: check-versions
    label: 新スキーマを最新と履歴全体で比較する
    visual: rules
    evidence:
      - type: doc
        ref: docs/reference-apicurio-registry.md#§5
    steps:
      - links:
          - propose
          - check
        note: v2 は currency に既定値を付けて追加する。新読者は旧データを読め、旧読者は新フィールドを無視して読める。
        highlight:
          - v1
          - v2
      - links:
          - propose
          - check
        note: 既定値を外した v3 を提案する。v2 の writer が currency を書くため、v3 の reader は v2 データを読める。
        blocks:
          history:
            - id: v1
              label: v1 · id
              k: 0
            - id: v2
              label: v2 · currency = JPY
              k: 1
          proposed:
            - id: v3
              label: v3 · currency 必須
              k: 2
          result:
            - id: pass
              label: BACKWARD · 通過
              k: 1
        highlight:
          - v2
          - v3
          - pass
      - links:
          - check
        note: BACKWARD_TRANSITIVE では v1 も比較する。v1 データには currency がなく、v3 の reader に既定値がないため拒否される。
        blocks:
          history:
            - id: v1
              label: v1 · id
              k: 0
            - id: v2
              label: v2 · currency = JPY
              k: 1
          proposed:
            - id: v3
              label: v3 · currency 必須
              k: 2
          result:
            - id: fail
              label: BACKWARD_TRANSITIVE · 拒否
              k: 2
        highlight:
          - v1
          - v3
          - fail
requirements:
  - {"id":"BR-01","kind":"rule","title":"古いイベントの読み取りを維持","text":"Kafka に残る各レコードを、書き込みに使ったスキーマで解釈できる。","links":["consume","by-id","resolve"],"evidence":[{"type":"doc","ref":"docs/reference-apicurio-registry.md#§3"}]}
  - {"id":"BR-02","kind":"rule","title":"登録時に運用上の互換性を検査","text":"更新順序と再読対象の履歴に必要な範囲で互換性を確認する。","links":["propose","check"],"evidence":[{"type":"doc","ref":"docs/reference-apicurio-registry.md#§5"}]}
unknowns:
  - {"id":"UNK-01","text":"実環境の ID の種別・配置、比較対象のバージョン、保持中の Kafka 履歴、互換性ルールの設定は未確認。","refs":["topic","versions","policy"]}
implementations:
  - id: apicurio-postgres
    label: Kafka・Apicurio Registry・PostgreSQL
    description: Kafka Java クライアント用の Avro SerDes と、PostgreSQL を使う Apicurio Registry を分けて配置する例。
    sources:
      - title: Apicurio Registry 3.4 Kafka SerDes
        url: https://www.apicur.io/registry/docs/apicurio-registry/3.4.x/getting-started/assembly-using-kafka-client-serdes.html
      - title: Apicurio Registry 3.4 Schema Compatibility Modes
        url: https://www.apicur.io/registry/docs/apicurio-registry/3.4.x/getting-started/assembly-registry-compatibility-modes.html
      - title: Apicurio Registry Docker Deployment
        url: https://www.apicur.io/registry/docs/apicurio-registry/3.4.x/getting-started/assembly-installing-registry-docker.html
    nodes:
      apicurio-postgres-writer:
        label: Java Kafka Producer（Avro Serializer）
        kind: actor
        tier: kafka
        x: 2
        y: 1.5
        description: Registry からスキーマを解決し、Avro データと参照 ID を送る。
        realizes:
          - producer
          - serialize
        evidence:
          - type: doc
            ref: docs/reference-apicurio-registry.md#§7
      apicurio-postgres-kafka:
        label: Apache Kafka の注文トピック
        kind: queue
        tier: kafka
        x: 8
        y: 1.5
        description: Avro メッセージを保持する。
        realizes:
          - topic
        evidence:
          - type: doc
            ref: docs/reference-apicurio-registry.md#§7
      apicurio-postgres-reader:
        label: Java Kafka Consumer（Avro Deserializer）
        kind: worker
        tier: kafka
        x: 10
        y: 1.5
        description: スキーマ参照を解決し、読取側スキーマで展開する。
        realizes:
          - deserialize
          - app
        evidence:
          - type: doc
            ref: docs/reference-apicurio-registry.md#§7
      apicurio-postgres-publisher:
        label: スキーマ登録用 REST クライアント
        kind: actor
        tier: registry
        x: 1
        y: 1.5
        description: 変更候補を登録 API へ送る。
        realizes:
          - submitter
        evidence:
          - type: doc
            ref: docs/reference-apicurio-registry.md#§7
      apicurio-postgres-registry:
        label: Apicurio Registry Server
        kind: catalog
        tier: registry
        x: 5
        y: 1.5
        description: 互換性を評価してバージョンと内容 ID を解決する。
        realizes:
          - policy
          - versions
        evidence:
          - type: doc
            ref: docs/reference-apicurio-registry.md#§7
      apicurio-postgres-postgres:
        label: PostgreSQL（Registry の SQL ストレージ）
        kind: service
        tier: registry
        x: 10
        y: 1.5
        description: スキーマ本文とレジストリの永続状態を保持する。
        evidence:
          - type: doc
            ref: docs/reference-apicurio-registry.md#§7
    links:
      - id: apicurio-postgres-persist
        from: apicurio-postgres-registry
        to: apicurio-postgres-postgres
        label: スキーマと対応する識別情報を保存
        evidence:
          - type: doc
            ref: docs/reference-apicurio-registry.md#§7
gates: {maxDrift: 0, maxHigh: 0}
blocks:
  - id: decode
    title: Kafka レコードの ID で v1 を取得する
    note: 図では contentId を使い、読み手が v2 の reader schema を指定する構成を想定。
    legend:
      "0": v1 の内容
      "1": v2 のフィールド
    lanes:
      - id: registered
        label: Registry
        node: versions
      - id: topic
        label: Kafka 履歴
        node: topic
      - id: consumer
        label: v2 Consumer
        node: app
    items:
      registered:
        - id: v1
          label: v1 · id
          k: 0
        - id: v2
          label: v2 · currency = JPY
          k: 1
      topic: []
      consumer: []
  - id: rules
    title: 最新バージョンと履歴全体の互換性検査
    note: v1 と v2 がともに比較対象として有効な場合の例。
    legend:
      "0": v1
      "1": v2 または通過
      "2": v3 または拒否
    lanes:
      - id: history
        label: 登録済みの版
        node: versions
      - id: proposed
        label: 登録候補
        node: submitter
      - id: result
        label: 検査結果
        node: policy
    items:
      history:
        - id: v1
          label: v1 · id
          k: 0
        - id: v2
          label: v2 · currency = JPY
          k: 1
      proposed: []
      result: []
