name: Apicurio Registry の基本アーキテクチャ
description: REST API・Web コンソール・ルール・グループ/アーティファクト/バージョン・ストレージ・SerDes クライアントの役割と、スキーマの登録と取得の流れ。
reference:
  objectives:
    - REST API、Web コンソール、Confluent 互換 API、SerDes クライアントの入口を区別する。
    - グループ、アーティファクト、バージョン、コンテンツ、ID の関係を説明する。
    - ルールが新しいバージョンの受け入れ前に働くことと、ストレージの選択肢（H2・PostgreSQL・KafkaSQL）を説明する。
  sources:
    - title: Introduction to Apicurio Registry
      url: https://www.apicur.io/registry/docs/apicurio-registry/3.4.x/getting-started/assembly-intro-to-the-registry.html
    - title: Apicurio Registry concepts and glossary
      url: https://www.apicur.io/registry/docs/apicurio-registry/3.4.x/getting-started/assembly-registry-concepts-glossary.html
    - title: Apicurio Registry content rules
      url: https://www.apicur.io/registry/docs/apicurio-registry/3.4.x/getting-started/assembly-intro-to-registry-rules.html
    - title: Installing Apicurio Registry storage on OpenShift
      url: https://www.apicur.io/registry/docs/apicurio-registry/3.4.x/getting-started/assembly-installing-registry-storage-openshift.html
    - title: Deploying Apicurio Registry for high availability
      url: https://www.apicur.io/registry/docs/apicurio-registry/3.4.x/getting-started/assembly-registry-high-availability.html
sources:
  - docs/reference-apicurio-registry.md
evidence:
  - { type: doc, ref: "docs/reference-apicurio-registry.md#§1" }
  - { type: doc, ref: "docs/reference-apicurio-registry.md#§2" }
  - { type: doc, ref: "docs/reference-apicurio-registry.md#§3" }
  - { type: doc, ref: "docs/reference-apicurio-registry.md#§4" }
  - { type: doc, ref: "docs/reference-apicurio-registry.md#§5" }
  - { type: doc, ref: "docs/reference-apicurio-registry.md#§6" }
  - { type: doc, ref: "docs/reference-apicurio-registry.md#§7" }
tiers:
  - id: flow
    label: スキーマの登録と取得
    z: 0
    size: [24, 7]
nodes:
  admin:
    label: 登録担当
    kind: actor
    tier: flow
    x: 0
    'y': 0.8
    description: Web コンソール、CLI、REST API、Maven プラグインのいずれかを使ってスキーマや API 定義を登録する。Registry のルールも設定する。
    evidence:
      - { type: doc, ref: "docs/reference-apicurio-registry.md#§2" }
  clients:
    label: Kafka クライアント（SerDes）
    kind: client
    tier: flow
    x: 0
    'y': 4.5
    replicas: 2
    description: Producer と Consumer の中で SerDes が Registry の API を呼び、ID に対応するスキーマを取得する。
    evidence:
      - { type: doc, ref: "docs/reference-apicurio-registry.md#§2" }
  ui:
    label: Web コンソール
    kind: service
    tier: flow
    x: 5
    'y': 0
    replicas: 2
    description: スキーマの閲覧・検索・追加とルールの設定。バックエンドとは別のコンポーネント。
    evidence:
      - { type: doc, ref: "docs/reference-apicurio-registry.md#§2" }
      - { type: doc, ref: "docs/reference-apicurio-registry.md#§6" }
  api:
    label: Core Registry API v3（/apis/registry/v3）
    kind: service
    tier: flow
    x: 5
    'y': 2.4
    replicas: 2
    description: グループ、アーティファクト、バージョン、ルール、検索、管理を扱う REST API。ステートレスで水平に増やせる。
    evidence:
      - { type: doc, ref: "docs/reference-apicurio-registry.md#§2" }
      - { type: doc, ref: "docs/reference-apicurio-registry.md#§6" }
  ccompat:
    label: Confluent 互換 API（/apis/ccompat/v7）
    kind: service
    tier: flow
    x: 5
    'y': 4.8
    replicas: 2
    description: subject を既定グループのアーティファクトとして扱う。Confluent のクライアントが URL を変えるだけで使える。
    evidence:
      - { type: doc, ref: "docs/reference-apicurio-registry.md#§2" }
  rules:
    label: ルール（グローバル・グループ・アーティファクト）
    kind: policy
    tier: flow
    x: 11
    'y': 1
    replicas: 2
    description: 新しいバージョンを受け入れる前に VALIDITY・COMPATIBILITY・INTEGRITY・GOVERNANCE を検査する。
    evidence:
      - { type: doc, ref: "docs/reference-apicurio-registry.md#§4" }
  model:
    label: グループ・アーティファクト・バージョン
    kind: catalog
    tier: flow
    x: 11
    'y': 3.8
    replicas: 2
    description: groupId と artifactId で決まるアーティファクトと、不変のバージョン、contentId、globalId を管理する。
    evidence:
      - { type: doc, ref: "docs/reference-apicurio-registry.md#§3" }
  storage:
    label: ストレージ（PostgreSQL・KafkaSQL など）
    kind: db
    tier: flow
    x: 17
    'y': 3.8
    replicas: 2
    description: バージョン、コンテンツ、ルールを永続化する。apicurio.storage.kind で選ぶ。組み込み H2 は開発・テスト用。
    evidence:
      - { type: doc, ref: "docs/reference-apicurio-registry.md#§5" }
links:
  - id: register
    from: admin
    to: api
    label: スキーマを登録する
    evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§2" }]
  - id: console
    from: ui
    to: api
    label: 同じ API を呼ぶ
    evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§2" }]
  - id: fetch
    from: clients
    to: api
    label: ID でスキーマを取得する
    evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§2" }]
  - id: check
    from: api
    to: rules
    label: 新しいバージョンを検査する
    evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§4" }]
  - id: write
    from: api
    to: model
    label: バージョンを読み書きする
    evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§3" }]
  - id: map-subject
    from: ccompat
    to: model
    label: subject をアーティファクトに対応させる
    evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§2" }]
  - id: persist
    from: model
    to: storage
    label: 永続化する
    evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§5" }]
scenarios:
  - id: register-version
    label: 新しいバージョンを登録する
    evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§4" }]
    steps:
      - links: [register]
        note: 登録担当が REST API（または Web コンソール、CLI、Maven プラグイン）で新しいバージョンを送る。
      - links: [check]
        note: 適用範囲はアーティファクト、グループ、グローバルの順。違反すると HTTP 400 で拒否される。
      - links: [write, persist]
        note: ルールを通ったバージョンが追加され、ストレージに保存される。既存のバージョンは変更しない。
  - id: resolve-schema
    label: Consumer が ID でスキーマを取得する
    evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§2" }]
    steps:
      - links: [fetch]
        note: Kafka のレコードに付いた contentId（または globalId）で、SerDes が API に問い合わせる。
      - links: [write, persist]
        note: Registry が ID に対応するバージョンの内容をストレージから読んで返す。
requirements:
  - id: BR-01
    kind: rule
    title: 登録前にルールを通す
    text: 新しいバージョンは、設定されたルールを通ったときだけ追加される。登録済みのバージョンは再検査されない。
    links: [register, check]
    evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§4" }]
  - id: BR-02
    kind: rule
    title: バージョンの内容は変更しない
    text: 内容は不変で、同じ内容のバージョンは contentId を共有する。変更は新しいバージョンの追加で表す。
    links: [write, persist]
    evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§3" }]
unknowns:
  - id: UNK-01
    text: ルールの保存先（テーブルやトピック上の表現）は、確認した公式資料では説明されていない。図ではストレージが保持するものとして描く。
    refs: [rules, storage]
  - id: UNK-02
    text: 実装例の台数、ノードサイズ、ネットワーク経路、PostgreSQL の置き場所（クラスター内外）、Operator と Registry のバージョンの組み合わせは資料で指定されていない。
    refs: [api, storage]
gates: { maxDrift: 0, maxHigh: 0 }
implementations:
  - id: apicurio-k8s-postgres
    label: オンプレミス Kubernetes・Operator・PostgreSQL
    description: 利用者のデータセンターの Kubernetes に Apicurio Registry Operator を置き、app と ui を展開し、PostgreSQL をストレージにする構成例。
    sources:
      - title: Deploying Apicurio Registry using the Operator
        url: https://www.apicur.io/registry/docs/apicurio-registry/3.4.x/getting-started/assembly-deploying-registry-operator.html
      - title: Deploying Apicurio Registry for high availability
        url: https://www.apicur.io/registry/docs/apicurio-registry/3.4.x/getting-started/assembly-registry-high-availability.html
      - title: Installing Apicurio Registry storage on OpenShift
        url: https://www.apicur.io/registry/docs/apicurio-registry/3.4.x/getting-started/assembly-installing-registry-storage-openshift.html
      - title: Introduction to Apicurio Registry
        url: https://www.apicur.io/registry/docs/apicurio-registry/3.4.x/getting-started/assembly-intro-to-the-registry.html
    tiers:
      - { id: entry, label: 利用者, kind: origin, z: 2, size: [20, 4] }
      - { id: cluster, label: Kubernetes クラスター, z: 1, size: [20, 8] }
      - { id: data, label: データストア, z: 0, size: [20, 4] }
    nodes:
      apicurio-k8s-admin:
        label: 登録担当（クラスター外のクライアント）
        kind: actor
        tier: entry
        x: 2
        'y': 1.5
        realizes: [admin]
        description: Web UI、CLI、REST、Maven プラグインのいずれかでスキーマを登録する。
        evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§7" }]
      apicurio-k8s-clients:
        label: Kafka クライアント（クラスター外のアプリ）
        kind: client
        tier: entry
        x: 8
        'y': 1.5
        realizes: [clients]
        description: SerDes を組み込んだ Producer / Consumer。Registry の URL を apicurio.registry.url に設定する。
        evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§7" }]
      apicurio-k8s-ingress:
        label: Ingress（app と ui の host）
        kind: gateway
        tier: cluster
        x: 2
        'y': 4
        svc: k8s:ingress
        description: Operator が ingress.host から HTTP の Ingress を作る。TLS は利用者が別に用意する。
        evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§7" }]
        management: { type: customer, scope: 利用者が Ingress コントローラーと TLS を運用する。 }
      apicurio-k8s-cr:
        label: ApicurioRegistry3 リソース
        kind: file
        tier: cluster
        x: 2
        'y': 1
        description: "spec.app と spec.ui に replicas、ingress、storage（type: postgresql、sql.dataSource）を書く。"
        evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§7" }]
        management: { type: customer, scope: 利用者が CR を管理する。 }
      apicurio-k8s-operator:
        label: Apicurio Registry Operator
        kind: scheduler
        tier: cluster
        x: 6
        'y': 1
        svc: k8s:deployment
        description: CR に従って app と ui の Deployment、Ingress、NetworkPolicy、PodDisruptionBudget などを作る。
        evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§7" }]
        management: { type: customer, scope: 利用者が Operator を導入し、更新する。 }
      apicurio-k8s-app:
        label: Registry app Pods
        kind: service
        tier: cluster
        x: 8
        'y': 4
        svc: k8s:deployment
        replicas: 3
        realizes: [api, ccompat, rules, model]
        description: REST API、Confluent 互換 API、ルール判定、バージョン管理を担う。app.replicas で台数を決める。
        evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§7" }]
        management: { type: customer, scope: 利用者が台数、ルール、認証を管理する。 }
      apicurio-k8s-ui:
        label: Registry ui Pods
        kind: service
        tier: cluster
        x: 12
        'y': 1
        svc: k8s:deployment
        replicas: 2
        realizes: [ui]
        description: Web コンソール。app とは別の Deployment で、ui.replicas で台数を決める。
        evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§7" }]
        management: { type: customer, scope: 利用者が台数を管理する。 }
      apicurio-k8s-secret:
        label: Secret（DB パスワード）
        kind: file
        tier: cluster
        x: 12
        'y': 4
        description: sql.dataSource.password が name と key で参照する。
        evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§7" }]
        management: { type: customer, scope: 利用者が Secret を作成し、保護する。 }
      apicurio-k8s-postgres:
        label: PostgreSQL（利用者が用意）
        kind: db
        tier: data
        x: 8
        'y': 1.5
        svc: onprem:db
        replicas: 2
        realizes: [storage]
        description: バージョン、コンテンツ、ルールを保存する。複数レプリカの app には、DB のレプリケーションとフェイルオーバーが要る。
        evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§7" }]
        management: { type: customer, scope: 利用者が DB の運用、バックアップ、フェイルオーバーを管理する。 }
    links:
      - id: apicurio-k8s-admin-ingress
        from: apicurio-k8s-admin
        to: apicurio-k8s-ingress
        label: 登録を送る
        realizes: [register]
        replace: true
      - id: apicurio-k8s-clients-ingress
        from: apicurio-k8s-clients
        to: apicurio-k8s-ingress
        label: ID でスキーマを要求
        realizes: [fetch]
        replace: true
      - id: apicurio-k8s-ingress-app
        from: apicurio-k8s-ingress
        to: apicurio-k8s-app
        label: HTTP を中継
        realizes: [register, fetch]
        replace: true
      - id: apicurio-k8s-cr-operator
        from: apicurio-k8s-cr
        to: apicurio-k8s-operator
        label: 望ましい構成を渡す
        evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§7" }]
      - id: apicurio-k8s-operator-app
        from: apicurio-k8s-operator
        to: apicurio-k8s-app
        label: Deployment を作成・管理
        evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§7" }]
      - id: apicurio-k8s-operator-ui
        from: apicurio-k8s-operator
        to: apicurio-k8s-ui
        label: Deployment を作成・管理
        evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§7" }]
      - id: apicurio-k8s-secret-app
        from: apicurio-k8s-secret
        to: apicurio-k8s-app
        label: DB パスワードを渡す
        evidence: [{ type: doc, ref: "docs/reference-apicurio-registry.md#§7" }]
    groups:
      - kind: datacenter
        label: 利用者のデータセンター
        provider: onprem
        tier: [cluster, data]
        nodes: [apicurio-k8s-ingress, apicurio-k8s-cr, apicurio-k8s-operator, apicurio-k8s-app, apicurio-k8s-ui, apicurio-k8s-secret, apicurio-k8s-postgres]
      - kind: cluster
        label: Kubernetes クラスター
        provider: k8s
        tier: [cluster]
        nodes: [apicurio-k8s-ingress, apicurio-k8s-cr, apicurio-k8s-operator, apicurio-k8s-app, apicurio-k8s-ui, apicurio-k8s-secret]
    layout2d:
      tiers:
        - { id: diagram, label: オンプレミスの Apicurio Registry, z: 0, size: [28, 13] }
      nodes:
        apicurio-k8s-admin: { tier: diagram, x: 1, y: 3 }
        apicurio-k8s-clients: { tier: diagram, x: 1, y: 8 }
        apicurio-k8s-ingress: { tier: diagram, x: 8, y: 5.5 }
        apicurio-k8s-cr: { tier: diagram, x: 8, y: 1.5 }
        apicurio-k8s-operator: { tier: diagram, x: 12.5, y: 1.5 }
        apicurio-k8s-app: { tier: diagram, x: 12.5, y: 5.5 }
        apicurio-k8s-ui: { tier: diagram, x: 17, y: 1.5 }
        apicurio-k8s-secret: { tier: diagram, x: 17, y: 5.5 }
        apicurio-k8s-postgres: { tier: diagram, x: 23, y: 5.5 }
      groups:
        - { kind: datacenter, label: 利用者のデータセンター, provider: onprem, tier: [diagram], x0: 5.5, y0: -0.6, x1: 26.5, y1: 9.5, nodes: [apicurio-k8s-ingress, apicurio-k8s-cr, apicurio-k8s-operator, apicurio-k8s-app, apicurio-k8s-ui, apicurio-k8s-secret, apicurio-k8s-postgres] }
        - { kind: cluster, label: Kubernetes クラスター, provider: k8s, tier: [diagram], x0: 6.2, y0: 0.4, x1: 20.2, y1: 8.8, nodes: [apicurio-k8s-ingress, apicurio-k8s-cr, apicurio-k8s-operator, apicurio-k8s-app, apicurio-k8s-ui, apicurio-k8s-secret] }
    layout3d:
      tiers:
        - { id: zone0, label: 利用者（クラスター外）, kind: origin, z: 0, origin: [-6, 0], size: [4, 7] }
        - { id: zone1, label: クラスターの制御と入口, z: 0, size: [5, 10] }
        - { id: zone2, label: Registry の Pod, z: 0, origin: [7, 0], size: [5, 10] }
        - { id: zone3, label: データストア, z: 0, origin: [14, 0], size: [5, 6] }
      nodes:
        apicurio-k8s-admin: { tier: zone0, x: 2, y: 1.5 }
        apicurio-k8s-clients: { tier: zone0, x: 2, y: 5 }
        apicurio-k8s-cr: { tier: zone1, x: 2, y: 1 }
        apicurio-k8s-operator: { tier: zone1, x: 2, y: 4 }
        apicurio-k8s-ingress: { tier: zone1, x: 2, y: 7.5 }
        apicurio-k8s-app: { tier: zone2, x: 2, y: 4 }
        apicurio-k8s-ui: { tier: zone2, x: 2, y: 1 }
        apicurio-k8s-secret: { tier: zone2, x: 2, y: 7.5 }
        apicurio-k8s-postgres: { tier: zone3, x: 2, y: 3 }
      groups:
        - { kind: datacenter, label: 利用者のデータセンター, provider: onprem, tier: [zone1, zone2, zone3], nodes: [apicurio-k8s-ingress, apicurio-k8s-cr, apicurio-k8s-operator, apicurio-k8s-app, apicurio-k8s-ui, apicurio-k8s-secret, apicurio-k8s-postgres] }
        - { kind: cluster, label: Kubernetes クラスター, provider: k8s, tier: [zone1, zone2], nodes: [apicurio-k8s-ingress, apicurio-k8s-cr, apicurio-k8s-operator, apicurio-k8s-app, apicurio-k8s-ui, apicurio-k8s-secret] }
