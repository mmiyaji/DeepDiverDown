        url: https://www.apicur.io/registry/docs/apicurio-registry/3.4.x/getting-started/assembly-registry-compatibility-modes.html
      - title: Apicurio Registry Docker Deployment
        url: https://www.apicur.io/registry/docs/apicurio-registry/3.4.x/getting-started/assembly-installing-registry-docker.html
    nodes:
      apicurio-postgres-client-host:
        label: 自前 Linux クライアントホスト
        kind: host
        tier: kafka
        x: 3
        y: 0
        description: Producer と Consumer の Java アプリを実行する。
        evidence: [{type: doc, ref: docs/reference-apicurio-registry.md#§7}]
      apicurio-postgres-kafka-host:
        label: 自前 Kafka ブローカーホスト群
        kind: host
        tier: kafka
        x: 8
        y: 0
        description: 利用者が Kafka ブローカーとトピックを運用する。
        evidence: [{type: doc, ref: docs/reference-apicurio-registry.md#§7}]
      apicurio-postgres-registry-host:
        label: 自前 Docker 実行ホスト
        kind: host
        tier: registry
        x: 6
        y: 0
        description: Registry と PostgreSQL コンテナーを運用する。
        evidence: [{type: doc, ref: docs/reference-apicurio-registry.md#§7}]
      apicurio-postgres-writer:
        label: Java Kafka Producer（Avro Serializer）
        kind: actor
        tier: kafka
        x: 2
        y: 1.5
        description: Registry からスキーマを解決し、Avro データと参照 ID を送る。
        realizes:
          - producer
          - serialize
        evidence:
          - type: doc
            ref: docs/reference-apicurio-registry.md#§7
      apicurio-postgres-kafka:
        label: Apache Kafka の注文トピック
        kind: queue
        tier: kafka
        x: 8
        y: 1.5
        description: Avro メッセージを保持する。
        realizes:
          - topic
        evidence:
          - type: doc
            ref: docs/reference-apicurio-registry.md#§7
      apicurio-postgres-reader:
        label: Java Kafka Consumer（Avro Deserializer）
        kind: worker
        tier: kafka
        x: 10
        y: 1.5
        description: スキーマ参照を解決し、読取側スキーマで展開する。
        realizes:
          - deserialize
          - app
        evidence:
          - type: doc
            ref: docs/reference-apicurio-registry.md#§7
      apicurio-postgres-publisher:
        label: スキーマ登録用 REST クライアント
        kind: actor
        tier: registry
        x: 1
        y: 1.5
        description: 変更候補を登録 API へ送る。
        realizes:
          - submitter
        evidence:
          - type: doc
            ref: docs/reference-apicurio-registry.md#§7
      apicurio-postgres-registry:
        label: Apicurio Registry Server
        kind: catalog
        tier: registry
        x: 5
        y: 1.5
        description: 互換性を評価してバージョンと内容 ID を解決する。
        realizes:
          - policy
          - versions
        evidence:
          - type: doc
            ref: docs/reference-apicurio-registry.md#§7
      apicurio-postgres-postgres:
        label: PostgreSQL（Registry の SQL ストレージ）
        kind: service
        tier: registry
        x: 10
        y: 1.5
        description: スキーマ本文とレジストリの永続状態を保持する。
        evidence:
          - type: doc
            ref: docs/reference-apicurio-registry.md#§7
    links:
      - {id: apicurio-postgres-client-writer, from: apicurio-postgres-client-host, to: apicurio-postgres-writer, label: Producer を実行}
      - {id: apicurio-postgres-client-reader, from: apicurio-postgres-client-host, to: apicurio-postgres-reader, label: Consumer を実行}
