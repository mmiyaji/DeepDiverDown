name: "Databricks OpenSharing（Delta Sharing）の接続と失効"
description: "Unity Catalog の共有オブジェクトから、Databricks と外部クライアントに注文集計を提供する。"
parent: {"model":"databricks","node":"sharing"}
reference:
  objectives:
    - "Share、Recipient、Provider の役割を確認する。"
    - "Databricks-to-Databricks と Databricks-to-Open の認証・利用経路を区別する。"
  sources:
    - {"title":"OpenSharing の概念","url":"https://docs.databricks.com/aws/en/opensharing"}
    - {"title":"OpenSharing の SQL リファレンス","url":"https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-sharing"}
sources: ["docs/reference-databricks-open-sharing.md"]
evidence: [{"type":"doc","ref":"docs/reference-databricks-open-sharing.md#§1"}]
tiers:
  - {"id":"flow","label":"構成と処理の流れ","z":0,"size":[13.5,4.5]}
nodes:
  owner: {"label":"提供側管理者","kind":"actor","tier":"flow","x":0,"y":0,"description":"公開データを選ぶ。","evidence":[{"type":"doc","ref":"docs/reference-databricks-open-sharing.md#§1"}]}
  table: {"label":"注文集計テーブル","kind":"db","tier":"flow","x":0,"y":4,"description":"提供する資産。","evidence":[{"type":"doc","ref":"docs/reference-databricks-open-sharing.md#§1"}]}
  share: {"label":"Share／Recipient","kind":"service","tier":"flow","x":5,"y":2,"description":"提供対象と受領者。","evidence":[{"type":"doc","ref":"docs/reference-databricks-open-sharing.md#§1"}]}
  dbcatalog: {"label":"受領側のカタログ","kind":"service","tier":"flow","x":9,"y":0,"description":"Databricks-to-Databricks 経路。","evidence":[{"type":"doc","ref":"docs/reference-databricks-open-sharing.md#§2"}]}
  databricks: {"label":"受領側の SQL","kind":"client","tier":"flow","x":13,"y":0,"description":"カタログを経由して読む。","evidence":[{"type":"doc","ref":"docs/reference-databricks-open-sharing.md#§2"}]}
  endpoint: {"label":"OpenSharing の接続口","kind":"service","tier":"flow","x":9,"y":4,"description":"外部クライアント用のプロトコル。","evidence":[{"type":"doc","ref":"docs/reference-databricks-open-sharing.md#§3"}]}
  outside: {"label":"外部分析クライアント","kind":"client","tier":"flow","x":13,"y":4,"description":"公開された読み取り経路を使う。","evidence":[{"type":"doc","ref":"docs/reference-databricks-open-sharing.md#§3"}]}
  revoke: {"label":"失効","kind":"service","tier":"flow","x":5,"y":0,"description":"受領者への許可を取り消す。","evidence":[{"type":"doc","ref":"docs/reference-databricks-open-sharing.md#§4"}]}
links:
  - {"id":"publish","from":"owner","to":"share","label":"受領者への提供を設定","evidence":[{"type":"doc","ref":"docs/reference-databricks-open-sharing.md#§1"}]}
  - {"id":"include","from":"table","to":"share","label":"対象の集計を登録","evidence":[{"type":"doc","ref":"docs/reference-databricks-open-sharing.md#§1"}]}
  - {"id":"catalog","from":"share","to":"dbcatalog","label":"受領側カタログを作成","evidence":[{"type":"doc","ref":"docs/reference-databricks-open-sharing.md#§2"}]}
  - {"id":"db-read","from":"databricks","to":"dbcatalog","label":"受領カタログから参照","evidence":[{"type":"doc","ref":"docs/reference-databricks-open-sharing.md#§2"}]}
  - {"id":"api","from":"share","to":"endpoint","label":"対応する共有を公開","evidence":[{"type":"doc","ref":"docs/reference-databricks-open-sharing.md#§3"}]}
  - {"id":"open-read","from":"outside","to":"endpoint","label":"認証しクライアントで取得","evidence":[{"type":"doc","ref":"docs/reference-databricks-open-sharing.md#§3"}]}
  - {"id":"cancel","from":"owner","to":"revoke","label":"許可の取り消しを実行","evidence":[{"type":"doc","ref":"docs/reference-databricks-open-sharing.md#§4"}]}
  - {"id":"deny","from":"revoke","to":"share","label":"以後の共有アクセスを止める","evidence":[{"type":"doc","ref":"docs/reference-databricks-open-sharing.md#§4"}]}
scenarios:
  - id: protocols
    label: "Databricks 内と外部クライアントで読み方を比較"
    evidence: [{"type":"doc","ref":"docs/reference-databricks-open-sharing.md#§1"}]
    steps:
      - {"links":["publish","include"],"note":"共有対象と受領者を指定する。"}
      - {"links":["catalog","db-read"],"note":"Unity Catalog 対応の受領側から共有用カタログを経由して参照する。"}
      - {"links":["api","open-read"],"note":"外部クライアントは構成された認証方式でプロトコルに接続する。"}
  - id: revocation
    label: "受領者へのアクセスを取り消す"
    evidence: [{"type":"doc","ref":"docs/reference-databricks-open-sharing.md#§4"}]
    steps:
      - {"links":["open-read"],"note":"現在の公開対象と受領者を確認する。"}
      - {"links":["cancel","deny"],"note":"受領者が今後取得できる範囲を取り消す。取得済みデータは契約上の手続きで扱う。"}
