name: Snowflake Optima：メタデータ・索引と実行計画
description: 問い合わせ履歴を用いる索引・式のメタデータ・実行計画の改善を区別して追う。
parent:
  model: snowflake-optimization-internals
  node: metadata
reference:
  objectives:
    - 問い合わせ履歴を用いる索引・式のメタデータ・実行計画の改善を区別して追う。
    - SQL を実行し、ワークロードと実行シグナルを観測する。
    - 式のメタデータ、検索用の索引、計画改善をそれぞれ判断する。
  sources:
    - title: Optima Metadata
      url: https://www.snowflake.com/en/blog/engineering/snowflake-optima-metadata-query-pruning/
    - title: Optima Planning
      url: https://www.snowflake.com/en/blog/engineering/snowflake-optima-planning-query-performance/
    - title: Optima の現行仕様
      url: https://docs.snowflake.com/en/user-guide/snowflake-optima
    - title: Optima Indexing の事例
      url: https://www.snowflake.com/en/blog/engineering/snowflake-optima-query-spike-optimization/
sources:
  - docs/reference-snowflake-optima-internals.md
evidence:
  - type: doc
    ref: docs/reference-snowflake-optima-internals.md#§1
  - type: doc
    ref: docs/reference-snowflake-optima-internals.md#§4
tiers:
  - id: input
    label: SQL
    z: 3
    size:
      - 23
      - 4
  - id: process
    label: 履歴と自動最適化
    z: 2
    size:
      - 23
      - 4
  - id: compute
    label: 読み取りと演算
