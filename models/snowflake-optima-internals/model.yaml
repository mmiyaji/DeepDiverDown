        ref: docs/reference-snowflake-optima-internals.md#§2
  - id: extra
    from: metadata
    to: prune
    label: 式向け統計を参照
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optima-internals.md#§2
  - id: lookup
    from: index
    to: prune
    label: 索引を参照
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optima-internals.md#§2
  - id: select
    from: prune
    to: plan
    label: 対象区画を絞る
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optima-internals.md#§2
  - id: scan
    from: table
    to: plan
    label: 対象区画を読む
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optima-internals.md#§2
scenarios:
  - id: flow
    label: データと処理の流れ
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optima-internals.md#§3
    steps:
      - links:
