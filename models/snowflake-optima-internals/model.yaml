name: Snowflake Optima：区画の読み取りと再配置
description: 問い合わせ履歴から作る追加メタデータ・索引・計画改善と、クラスタリングキーに沿った区画の再配置（Classic と Optima の違い）を 1 つの図で追う。
parent:
  model: snowflake
  node: biwh
reference:
  objectives:
  - 式向けメタデータ、検索用の索引、計画改善を区別する。
  - 通常の区画統計と Optima の追加情報が、読む区画の絞り込みにどう使われるかを追う。
  - Automatic Clustering の Classic と Optima Clustering の違いを区別する。
  sources:
  - title: Optima Metadata
    url: https://www.snowflake.com/en/blog/engineering/snowflake-optima-metadata-query-pruning/
  - title: Optima Planning
    url: https://www.snowflake.com/en/blog/engineering/snowflake-optima-planning-query-performance/
  - title: Optima の現行仕様
    url: https://docs.snowflake.com/en/user-guide/snowflake-optima
  - title: Optima Indexing の事例
    url: https://www.snowflake.com/en/blog/engineering/snowflake-optima-query-spike-optimization/
  - title: Automatic Clustering at Snowflake（2024 年の内部構造）
    url: https://www.snowflake.com/en/blog/engineering/automatic-clustering-at-snowflake/
  - title: Automatic Clustering の仕様と費用
    url: https://docs.snowflake.com/en/user-guide/tables-auto-reclustering
  - title: Optima Clustering の発表
    url: https://www.snowflake.com/en/blog/engineering/introducing-snowflake-optima-clustering/
  - title: SYSTEM$CLUSTERING_INFORMATION
    url: https://docs.snowflake.com/en/sql-reference/functions/system_clustering_information
