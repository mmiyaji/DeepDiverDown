        ref: docs/reference-snowflake-optima-internals.md#§2
  history:
    label: 利用傾向
    kind: db
    tier: process
    x: 0
    'y': 1.5
    description: 過去のクエリや実行の傾向を分析する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optima-internals.md#§2
  metadata:
    label: 式向けメタデータ
    kind: service
    tier: process
    x: 5.2
    'y': 1.5
    description: 頻出する式に合わせて追加の区画メタデータを生成し、不要な区画の判定に使う。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optima-internals.md#§2
  index:
    label: 検索用の索引
    kind: service
    tier: process
    x: 10.4
    'y': 1.5
    description: 選択性の高い反復検索を検出し、Search Optimization Service を基盤とした索引を自動管理する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optima-internals.md#§2
  planning:
    label: 実行計画の改善
    kind: service
    tier: process
    x: 15.600000000000001
    'y': 1.5
    description: 過去の実行シグナルを使い、繰り返されるワークロードの計画選択を改善する。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optima-internals.md#§2
  stats:
    label: 通常の区画統計
    kind: file
    tier: data
    x: 0
    'y': 1.5
    description: 区画の列統計を使って読み取り対象を絞る。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optima-internals.md#§2
  prune:
    label: 候補の選択
    kind: worker
    tier: compute
    x: 0
    'y': 1.5
    description: 通常統計と利用可能な追加メタデータや索引を使い、不要な区画を読み飛ばす。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optima-internals.md#§2
  plan:
    label: 実行計画と演算
    kind: worker
    tier: compute
    x: 5.2
    'y': 1.5
    description: 選ばれた計画に従って対象区画を読み、演算結果を返す。
    evidence:
      - type: doc
        ref: docs/reference-snowflake-optima-internals.md#§2
