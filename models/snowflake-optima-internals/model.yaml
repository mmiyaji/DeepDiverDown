    label: 問い合わせ
    kind: client
    tier: input
    x: 0
    y: 1.5
    description: SQL を実行し結果と実行プロファイルを確認する。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-optima-internals.md#§2
  history:
    label: 利用傾向
    kind: db
    tier: process
    x: 0
    y: 1.5
    description: 過去のクエリや実行の傾向を分析する。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-optima-internals.md#§2
  metadata:
    label: 式向けメタデータ
    kind: service
    tier: process
    x: 5.2
    y: 1.5
    description: 頻出する式に合わせて追加の区画メタデータを生成し、不要な区画の判定に使う。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-optima-internals.md#§2
  index:
    label: 検索用の索引
    kind: service
    tier: process
    x: 10.4
    y: 1.5
    description: 選択性の高い反復検索を検出し、Search Optimization Service を基盤とした索引を自動管理する。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-optima-internals.md#§2
  planning:
    label: 実行計画の改善
    kind: service
    tier: process
    x: 15.600000000000001
    y: 1.5
    description: 過去の実行シグナルを使い、繰り返されるワークロードの計画選択を改善する。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-optima-internals.md#§2
  prune:
    label: 候補の選択
    kind: worker
    tier: compute
    x: 0
    y: 1.5
    description: 区画の列統計と、利用可能な式向けメタデータ・索引を使い、不要な区画を読み飛ばす。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-optima-internals.md#§2
  plan:
    label: 実行計画と演算
    kind: worker
    tier: compute
    x: 5.2
    y: 1.5
    description: 選ばれた計画に従って対象区画を読み、演算結果を返す。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-optima-internals.md#§2
  table:
    label: 区画データ
    kind: db
    tier: data
    x: 5.2
    y: 1.5
    description: テーブルのデータは micro-partition として管理され、区画ごとの列統計（最小値・最大値など）を持つ。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-optima-internals.md#§2
  key:
    label: クラスタリングキー
    kind: file
    tier: input
    x: 5.2
    y: 1.5
    description: 列や式で区画の並べ方を指定する。キーの自動選択（AUTO）は 2026 年 10 月の発表時点で private preview。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-optima-internals.md#§2
  classic:
    label: Classic の再配置
    kind: worker
    tier: compute
    x: 10.4
    y: 1.5
    description: 区画の重なり（width・depth とレベル）で対象を選び、バッチを読んでソートし、新しい区画を作る。コミット直前に並行 DML を確認し、競合した実行はロールバックする。2024 年の公開記事に基づく。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-optima-internals.md#§3
  optc:
    label: Optima Clustering
    kind: worker
    tier: compute
    x: 15.6
    y: 1.5
    description: 新しいデータを速く再配置し、重要なデータを優先する。キーは列全体で最大 1 KB。内部の選択・競合制御は未公開。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-optima-internals.md#§3
