name: Microsoft Fabric OneLake catalog の発見とガバナンス
description: Fabric のアイテムを探し、リネージや認定の状態を確認し、ワークスペースとデータアクセスの権限を管理する流れを追います。
parent:
  model: microsoft-fabric
  node: catalog
reference:
  objectives:
    - Explore、Govern、Secure の役割を区別する。
    - アイテムの発見、リネージ、利用申請を追う。
    - ワークスペースの権限と OneLake の実データに適用される権限の関係を説明する。
  sources:
    - title: OneLake Catalog Overview
      url: https://learn.microsoft.com/en-us/fabric/governance/onelake-catalog-overview
    - title: OneLake Catalog Item Details
      url: https://learn.microsoft.com/en-us/fabric/governance/onelake-catalog-item-details
    - title: Govern Your Fabric Data
      url: https://learn.microsoft.com/en-us/fabric/governance/onelake-catalog-govern
    - title: Secure Your Fabric Data
      url: https://learn.microsoft.com/en-us/fabric/governance/secure-your-data
    - title: Discovery Admin Settings
      url: https://learn.microsoft.com/en-us/fabric/admin/service-admin-portal-discovery
    - title: Read Data Secured with OneLake Security
      url: https://learn.microsoft.com/en-us/fabric/onelake/security/read-secured-data
    - title: What's New in Fabric
      url: https://learn.microsoft.com/fabric/fundamentals/whats-new
    - title: Microsoft Data Governance Strategy Update
      url: >-
        https://learn.microsoft.com/partner-center/announcements/2026-november#update-on-the-microsoft-data-governance-strategy
sources:
  - docs/reference-fabric-onelake-catalog.md
evidence:
  - type: doc
    ref: docs/reference-fabric-onelake-catalog.md#§1
tiers:
  - id: people
    label: 利用者・管理者
    z: 2
    size:
      - 15
      - 3
  - id: catalog
    label: カタログの利用・運用
    z: 1
    size:
      - 15
      - 4
  - id: fabric
    label: ワークスペースの資産とクエリ
    z: 0
    size:
      - 15
      - 3
nodes:
  consumer:
    label: データ利用者
    kind: actor
    tier: people
    x: 3
    'y': 1
    description: 資産を発見し、必要に応じてアクセスを申請する。
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§2
  admin:
    label: 管理者・所有者
    kind: actor
    tier: people
    x: 10
    'y': 1
    description: 資産の認定やドメイン、利用権限を管理する。
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§3
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§4
  explore:
    label: 資産の発見
    kind: service
    tier: catalog
    x: 3
    'y': 1
    description: アイテムの検索と詳細を表示する。
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§2
  govern:
    label: ガバナンス状態の管理
    kind: service
    tier: catalog
    x: 7
    'y': 1
    description: 資産のガバナンス状態を把握し、組織の設定にアクセスする。
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§3
  secure:
    label: アクセス権限の管理
    kind: service
    tier: catalog
    x: 11
    'y': 1
    description: ワークスペースと資産に設定した認可ロールを表示・管理する。
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§4
  items:
    label: 分析アセット
    kind: external
    tier: fabric
    x: 3
    'y': 1
    description: レポート、セマンティックモデル、レイクハウスなど。
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§2
  workspaces:
    label: ドメイン・ワークスペース
    kind: external
    tier: fabric
    x: 7
    'y': 1
    description: 資産を整理し、ワークスペースロールを適用する。
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§3
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§4
  roles:
    label: データアクセスロール
    kind: service
    tier: fabric
    x: 11
    'y': 1
    description: 行・列などの権限範囲を定義する。
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§4
  engine:
    label: 対応クエリエンジン
    kind: service
    tier: fabric
    x: 13
    'y': 2
    description: 利用者の実効権限に基づいて行・列を制御する。
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§4
links:
  - id: search
    from: consumer
    to: explore
    label: アイテムを検索
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§2
  - id: metadata
    from: explore
    to: items
    label: 詳細・認定・リネージを表示
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§2
  - id: request
    from: consumer
    to: explore
    label: 発見可能なアイテムの利用を申請
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§2
  - id: monitor
    from: admin
    to: govern
    label: 管理状態・推奨アクションを確認
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§3
  - id: domains
    from: govern
    to: workspaces
    label: ドメイン・管理設定を確認
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§3
  - id: review
    from: admin
    to: secure
    label: 権限と役割をレビュー
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§4
  - id: workspace-role
    from: secure
    to: workspaces
    label: ワークスペースの役割を確認
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§4
  - id: configure
    from: secure
    to: roles
    label: 対象のデータロールを設定
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§4
  - id: query
    from: consumer
    to: engine
    label: 対応エンジンにクエリを送る
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§4
  - id: authorize
    from: engine
    to: roles
    label: 利用者の実効権限を評価
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§4
  - id: read
    from: engine
    to: items
    label: 許可された行・列を返す
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§4
scenarios:
  - id: discover-report
    label: 認定済みレポートの上流を確認する
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§5
    steps:
      - links:
          - monitor
          - domains
        note: 管理者が資産を整理するドメインとガバナンスの状態を確認する。
      - links:
          - search
          - metadata
        note: 利用者が候補のレポートを探し、認定と上流を確認する。
      - links:
          - request
        note: 利用権限がない発見可能な資産を申請する。
  - id: query-secured
    label: 制限付きのデータを読む
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§5
    steps:
      - links:
          - review
          - workspace-role
          - configure
        note: 管理者がワークスペースの権限を点検し、必要な範囲のデータロールを設定する。
      - links:
          - query
          - authorize
          - read
        note: 利用者の権限に従い、対応エンジンが行・列を制限してデータを返す。
requirements:
  - id: R-01
    kind: rule
    title: 利用者の権限をクエリに適用すること
    text: データに適用する制限を利用者ごとに評価し、許可された行と列を返す。
    links:
      - configure
      - authorize
      - read
    evidence:
      - type: doc
        ref: docs/reference-fabric-onelake-catalog.md#§4
implementations:
  - id: fabric-managed
    label: OneLake・SQL 分析エンドポイント
    description: OneLake catalog を使い、Fabric の Lakehouse と関連レポートを検索し、クエリ時に細かな権限を適用する例。
    sources:
      - {title: Fabric licenses and capacity, url: https://learn.microsoft.com/en-us/fabric/enterprise/licenses}
      - {title: OneLake overview, url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-overview}
      - title: OneLake Catalog Overview
        url: https://learn.microsoft.com/en-us/fabric/governance/onelake-catalog-overview
      - title: OneLake Catalog Item Details
        url: https://learn.microsoft.com/en-us/fabric/governance/onelake-catalog-item-details
      - title: Secure Your Fabric Data
        url: https://learn.microsoft.com/en-us/fabric/governance/secure-your-data
      - title: Read Data Secured with OneLake Security
        url: https://learn.microsoft.com/en-us/fabric/onelake/security/read-secured-data
      - title: OneLake security overview
        url: https://learn.microsoft.com/en-us/fabric/onelake/security/fabric-onelake-security
      - title: SQL analytics endpoint for a lakehouse
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sql-analytics-endpoint
      - title: OneLake Security for SQL analytics endpoints
        url: https://learn.microsoft.com/en-us/fabric/onelake/security/sql-analytics-endpoint-onelake-security
    nodes:
      fabric-managed-capacity: {label: Fabric capacity, svc: "fabric:platform", kind: service, tier: fabric, x: 13, y: 5, evidence: [{type: doc, ref: "docs/reference-fabric-onelake-catalog.md#§6"}]}
      fabric-managed-storage: {label: OneLake managed storage, svc: "fabric:platform", kind: db, tier: fabric, x: 17, y: 5, evidence: [{type: doc, ref: "docs/reference-fabric-onelake-catalog.md#§6"}]}
      fabric-managed-reader:
        label: レポートを探す分析担当者
        kind: actor
        tier: fabric
        x: 0
        y: 1
        description: 認定、上流、利用条件を確認する。
        realizes:
          - consumer
        evidence:
          - type: doc
            ref: docs/reference-fabric-onelake-catalog.md#§6
      fabric-managed-admin:
        label: Fabric ワークスペース管理者
        kind: actor
        tier: fabric
        x: 0
        y: 5
        description: 資産の認定とユーザーの権限を設定する。
        realizes:
          - admin
        evidence:
          - type: doc
            ref: docs/reference-fabric-onelake-catalog.md#§6
      fabric-managed-catalog:
        svc: fabric:platform
        label: OneLake catalog（Explore・Govern・Secure）
        kind: catalog
        tier: fabric
        x: 5
        y: 1
        description: 発見、運用状況、ロール管理を統合した入口。
        realizes:
          - explore
          - govern
          - secure
        evidence:
          - type: doc
            ref: docs/reference-fabric-onelake-catalog.md#§6
      fabric-managed-items:
        label: Power BI レポート
        kind: external
        tier: fabric
        x: 9
        y: 1
        description: カタログから探す分析アイテム。
        realizes:
          - items
        evidence:
          - type: doc
            ref: docs/reference-fabric-onelake-catalog.md#§6
      fabric-managed-delta:
        label: OneLake の Lakehouse Delta テーブル
        kind: table
        tier: fabric
        x: 13
        y: 1
        description: Fabric ワークスペースの Lakehouse に属し、OneLake にデータファイルと Delta ログを保持する。
        realizes: [items]
        evidence: [{type: doc, ref: "docs/reference-fabric-onelake-catalog.md#§6"}]
      fabric-managed-workspace:
        label: Fabric ドメイン・ワークスペース
        kind: external
        tier: fabric
        x: 17
        y: 1
        description: アイテムの整理とワークスペースロールの範囲。
        realizes:
          - workspaces
        evidence:
          - type: doc
            ref: docs/reference-fabric-onelake-catalog.md#§6
      fabric-managed-roles:
        label: OneLake Security
        kind: policy
        tier: fabric
        x: 5
        y: 5
        description: テーブルの行・列のアクセスを Entra ID に結び付ける。
        realizes:
          - roles
        evidence:
          - type: doc
            ref: docs/reference-fabric-onelake-catalog.md#§6
      fabric-managed-sql:
        svc: fabric:platform
        label: SQL 分析エンドポイント
        kind: service
        tier: fabric
        x: 9
        y: 5
        description: ユーザー ID の実効権限でクエリを実行する。
        realizes:
          - engine
        evidence:
          - type: doc
            ref: docs/reference-fabric-onelake-catalog.md#§6
      fabric-managed-identity:
        label: Microsoft Entra ID
        kind: service
        svc: azure:entra
        tier: fabric
        x: 23
        y: 2
        description: 利用者・グループの ID を認証する。
        evidence:
          - type: doc
            ref: docs/reference-fabric-onelake-catalog.md#§6
    links:
      - {id: fabric-managed-capacity-sql, from: fabric-managed-capacity, to: fabric-managed-sql, label: "Provide SQL compute capacity", evidence: [{type: doc, ref: "docs/reference-fabric-onelake-catalog.md#§6"}]}
      - {id: fabric-managed-storage-table, from: fabric-managed-delta, to: fabric-managed-storage, label: "Store Delta files", evidence: [{type: doc, ref: "docs/reference-fabric-onelake-catalog.md#§6"}]}
      - {id: fabric-managed-read-delta, from: fabric-managed-sql, to: fabric-managed-delta, label: "認可された Lakehouse テーブルを読む", evidence: [{type: doc, ref: "docs/reference-fabric-onelake-catalog.md#§6"}]}
      - id: fabric-managed-resolve-user
        from: fabric-managed-identity
        to: fabric-managed-sql
        label: クエリ実行ユーザーを識別
        evidence:
          - type: doc
            ref: docs/reference-fabric-onelake-catalog.md#§6
    groups:
      - {kind: cloud, provider: fabric, label: Fabric tenant and workspace, tier: fabric, nodes: [fabric-managed-catalog, fabric-managed-items, fabric-managed-delta, fabric-managed-workspace, fabric-managed-roles, fabric-managed-sql, fabric-managed-capacity, fabric-managed-storage]}
      - {kind: cloud, provider: azure, label: Microsoft Entra tenant, tier: fabric, nodes: [fabric-managed-identity]}
    layout2d:
      tiers: [{id: diagram, label: Fabric and identity, z: 0, size: [28, 13]}]
      nodes:
        fabric-managed-catalog: {tier: diagram, x: 5, y: 1}
        fabric-managed-items: {tier: diagram, x: 9, y: 1}
        fabric-managed-delta: {tier: diagram, x: 13, y: 1}
        fabric-managed-workspace: {tier: diagram, x: 17, y: 1}
        fabric-managed-roles: {tier: diagram, x: 5, y: 5}
        fabric-managed-sql: {tier: diagram, x: 9, y: 5}
        fabric-managed-capacity: {tier: diagram, x: 13, y: 5}
        fabric-managed-storage: {tier: diagram, x: 17, y: 5}
        fabric-managed-identity: {tier: diagram, x: 23, y: 2}
        fabric-managed-reader: {tier: diagram, x: 0, y: 1}
        fabric-managed-admin: {tier: diagram, x: 0, y: 5}
      groups:
        - {kind: cloud, provider: fabric, label: Fabric tenant and workspace, tier: diagram, nodes: [fabric-managed-catalog, fabric-managed-items, fabric-managed-delta, fabric-managed-workspace, fabric-managed-roles, fabric-managed-sql, fabric-managed-capacity, fabric-managed-storage]}
        - {kind: cloud, provider: azure, label: Microsoft Entra tenant, tier: diagram, nodes: [fabric-managed-identity]}
    layout3d:
      tiers:
        - {id: fabric, label: Fabric tenant and managed services, z: 0, size: [18, 6]}
