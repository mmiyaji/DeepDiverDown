        fabric-managed-sql: {tier: fabric, x: 6, y: 4}
        fabric-managed-capacity: {tier: fabric, x: 10, y: 4}
        fabric-managed-storage: {tier: fabric, x: 14, y: 4}
        fabric-managed-identity: {tier: entra, x: 1, y: 1.5}
        fabric-managed-reader: {tier: users, x: 0, y: 1.5}
        fabric-managed-admin: {tier: users, x: 2, y: 1.5}
      groups:
