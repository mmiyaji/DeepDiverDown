name: Apache Ignite の基本アーキテクチャ（2.18 系）
description: Ignite 2.18 のサーバーノード上のパーティション化キャッシュ、バックアップ、ネイティブ永続化、SQL、データと計算のコロケーションを示す。Ignite 3 は対象外。
reference:
  objectives: [PARTITIONED と REPLICATED の違いを確認する, ネイティブ永続化の WAL とチェックポイントの流れを確認する, コロケーションで SQL と計算がデータの近くで動く仕組みを確認する]
  sources:
    - {title: Data Partitioning (2.18), url: https://ignite.apache.org/docs/ignite2/latest/data-modeling/data-partitioning}
    - {title: Native Persistence (2.18), url: https://ignite.apache.org/docs/ignite2/latest/persistence/native-persistence}
    - {title: Affinity Colocation (2.18), url: https://ignite.apache.org/docs/ignite2/latest/data-modeling/affinity-collocation}
    - {title: Colocating Computations With Data (2.18), url: https://ignite.apache.org/docs/ignite2/latest/distributed-computing/collocated-computations}
    - {title: Ignite 2 SQL (2.18), url: https://ignite.apache.org/docs/ignite2/latest/SQL/sql-introduction}
    - {title: Apache Ignite 3 docs, url: https://ignite.apache.org/docs/ignite3/latest/}
    - {title: Persistence Tuning, url: https://ignite.apache.org/docs/latest/perf-and-troubleshooting/persistence-tuning}
    - {title: General Performance Tips, url: https://ignite.apache.org/docs/latest/perf-and-troubleshooting/general-perf-tips}
    - {title: Network Configuration, url: https://ignite.apache.org/docs/latest/clustering/network-configuration}
sources: [docs/reference-apache-ignite.md]
evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§1}, {type: doc, ref: docs/reference-apache-ignite.md#§7}]
tiers:
  - {id: flow, label: クライアント・サーバーノード・ディスク, z: 0, size: [28, 11]}
nodes:
  client: {label: アプリケーション, kind: client, tier: flow, x: 1, y: 5.5, description: JDBC・ODBC またはネイティブ API で SQL とキャッシュ操作を発行する。, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§5}]}
  affinity: {label: アフィニティ関数, kind: service, tier: flow, x: 8, y: 5.5, description: キーをパーティション（既定 0〜1023）へ、パーティションをノードへ対応付ける。既定は rendezvous hashing。, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§2}]}
  sql: {label: SQL エンジン, kind: service, tier: flow, x: 8, y: 1.5, description: 既定は H2、Calcite ベースも有効にできる。map クエリを各ノードで実行し、reduce で結合する。, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§5}]}
  compute: {label: コロケーション計算, kind: service, tier: flow, x: 8, y: 9.5, description: affinityRun / affinityCall で、キーまたはパーティションを持つノードにタスクを送る。, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§6}]}
  partitioned: {label: PARTITIONED キャッシュ, kind: db, tier: flow, x: 15, y: 3, description: パーティションを全サーバーに分割して置く。バックアップは任意で、既定は無効。, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§2}, {type: doc, ref: docs/reference-apache-ignite.md#§3}]}
  replicated: {label: REPLICATED キャッシュ, kind: db, tier: flow, x: 15, y: 8, description: 全ノードが全データを持つ。小さく更新の少ないデータ向け。, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§2}]}
  wal: {label: WAL, kind: db, tier: flow, x: 22, y: 3, description: 更新を先に追記する。モードは FSYNC、LOG_ONLY（既定）、BACKGROUND、NONE。, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§4}]}
  partfiles: {label: パーティションファイル, kind: db, tier: flow, x: 22, y: 8, description: パーティションごとに 1 ファイル。チェックポイントがダーティページを書き込む。, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§4}]}
links:
  - {id: request, from: client, to: affinity, label: キャッシュ操作, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§2}]}
  - {id: query, from: client, to: sql, label: SQL を発行, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§5}]}
  - {id: submit, from: client, to: compute, label: 計算を送信, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§6}]}
  - {id: route-part, from: affinity, to: partitioned, label: 担当ノードへ振り分け, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§2}]}
  - {id: map-part, from: sql, to: partitioned, label: map クエリを実行, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§5}]}
  - {id: map-repl, from: sql, to: replicated, label: ローカルデータを検索, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§5}]}
  - {id: run-colo, from: compute, to: partitioned, label: データを持つノードで実行, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§6}]}
  - {id: log-wal, from: partitioned, to: wal, label: 更新を追記, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§4}]}
  - {id: log-wal-r, from: replicated, to: wal, label: 更新を追記, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§4}]}
  - {id: checkpoint, from: wal, to: partfiles, label: チェックポイントで反映, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§4}]}
scenarios:
  - id: colocated-sql
    label: コロケーションしたテーブルを SQL で検索する
    evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§6}]
    steps:
      - {links: [query, map-part], note: SQL が map クエリに分かれ、データを持つノードで実行される。}
      - {links: [run-colo], note: 同じアフィニティキーのデータは同じノードにあるため、結合や計算が 1 ノードで完結する。}
  - id: persist-write
    label: 永続化を有効にして書き込む
    evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§4}]
    steps:
      - {links: [request, route-part], note: キーからパーティションと主ノードが決まる。}
      - {links: [log-wal, checkpoint], note: 更新を WAL に追記し、チェックポイントでパーティションファイルへ反映する。}
requirements:
  - {id: IG-01, kind: usecase, title: データと計算を同じノードに置く, text: アフィニティキーでデータを同じパーティションに集め、計算をそのノードへ送る。, links: [submit, run-colo, map-part], evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§6}]}
unknowns:
  - {id: UNK-01, text: Ignite 3 の Raft、スキーマ駆動テーブル、compute の仕様と Ignite 2 からの移行は今回取得した資料になく未確認。, refs: [partitioned]}
  - {id: UNK-02, text: 分散 JOIN の挙動とリバランスの詳細は取得範囲になく未確認。, refs: [sql]}
  - {id: UNK-03, text: 具体的なノード台数の目安、帯域とファイアウォールの要件、容量計画の指針は公式資料で確認できず未確認。, refs: [partitioned]}
gates: {maxDrift: 0, maxHigh: 0}
implementations:
  - id: onprem-cluster
    label: 自前のサーバー群で動かす Ignite 2.18 クラスタ
    description: アプリケーションが複数の Ignite サーバーノードに接続し、各ノードのローカルディスクに永続化する構成の例。公式資料は物理マシン 1 台につき 1 ノードの複数台クラスタ、ノード間の探索用ポート（既定 47500）と通信用ポート（既定 47100）の疎通、データと WAL を別ドライブに置くこと（例はデータが SSD、WAL が HDD）を述べる。具体的な台数、帯域、ディスク容量は未確認。代表例であり、導入事例ではない。
    sources:
      - {title: Data Partitioning (2.18), url: https://ignite.apache.org/docs/ignite2/latest/data-modeling/data-partitioning}
      - {title: Native Persistence (2.18), url: https://ignite.apache.org/docs/ignite2/latest/persistence/native-persistence}
    tiers:
      - {id: diagram, label: アプリケーション・Ignite ノード・ディスク, z: 0, size: [28, 11]}
    nodes:
      ig-app: {label: アプリケーション, kind: client, tier: diagram, x: 1, y: 5.5, realizes: [client], description: JDBC・ネイティブ API で接続する。, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§8}]}
      ig-node: {label: Ignite サーバーノード, kind: service, tier: diagram, x: 9, y: 5.5, realizes: [affinity, sql, compute, partitioned, replicated], description: アフィニティ、SQL、コロケーション計算、キャッシュを 1 つの JVM プロセスで担う。ノード台数は未確認。, management: {type: customer, scope: "Customer operates the nodes, configuration and upgrades."}, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§8}]}
      ig-wal: {label: ローカルディスクの WAL, kind: db, tier: diagram, x: 18, y: 3, realizes: [wal], description: 既定の保存先は IGNITE_WORK_DIR 配下。データとは別のドライブに置くことが勧められ、例では HDD。, management: {type: customer, scope: "Customer operates the disks."}, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§8}]}
      ig-files: {label: ローカルディスクのパーティションファイル, kind: db, tier: diagram, x: 18, y: 8, realizes: [partfiles], description: パーティションごとのファイル。WAL とは別のドライブに置くことが勧められ、例では SSD。, management: {type: customer, scope: "Customer operates the disks."}, evidence: [{type: doc, ref: docs/reference-apache-ignite.md#§8}]}
    links: []
    groups:
      - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [ig-node, ig-wal, ig-files]}
    layout2d:
      tiers:
        - {id: diagram, label: アプリケーション・Ignite ノード・ディスク, z: 0, size: [28, 11]}
      nodes:
        ig-app: {tier: diagram, x: 1, y: 5.5}
        ig-node: {tier: diagram, x: 9, y: 5.5}
        ig-wal: {tier: diagram, x: 18, y: 3}
        ig-files: {tier: diagram, x: 18, y: 8}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [ig-node, ig-wal, ig-files]}
    layout3d:
      tiers:
        - {id: clients, label: クライアント, z: 0, size: [6, 11]}
        - {id: cluster, label: Ignite ノード, z: 0, origin: [8, 0], size: [8, 11]}
        - {id: disk, label: ディスク, z: 0, origin: [18, 0], size: [8, 11]}
      nodes:
        ig-app: {tier: clients, x: 3, y: 5.5}
        ig-node: {tier: cluster, x: 4, y: 5.5}
        ig-wal: {tier: disk, x: 4, y: 3}
        ig-files: {tier: disk, x: 4, y: 8}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: [cluster, disk], nodes: [ig-node, ig-wal, ig-files]}
