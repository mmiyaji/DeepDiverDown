    groups:
      - {kind: datacenter, provider: onprem, label: 利用者管理の Kafka・Connect 環境（構成例）, tier: [input], nodes: [ex-kafka-host, ex-connect-host, ex-topic, ex-connect]}
      - kind: cloud
        label: Snowflake アカウント（論理範囲）
        provider: snowflake
        tier:
          - process
          - compute
          - data
        nodes:
          - ex-pipe
          - ex-pipe-config
          - ex-reject
          - ex-writer
          - ex-metadata
          - ex-data
          - ex-read
