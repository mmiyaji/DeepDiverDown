        realizes:
          - topic
      ex-connect:
        label: Kafka Connect と Snowflake Connector v4
        kind: worker
        tier: input
        x: 10.4
        'y': 1.5
        description: トピックを購読し、Snowpipe Streaming を使って対象表に送信する。
        evidence:
          - type: doc
            ref: docs/reference-snowflake-kafka-iceberg-streaming.md#§5
        realizes:
          - connect
      ex-pipe:
        label: Snowpipe Streaming
        kind: service
        tier: process
        x: 0
        'y': 1.5
        description: 受信し PIPE の定義に従って検証や対応する変換を行う。
        evidence:
          - type: doc
            ref: docs/reference-snowflake-kafka-iceberg-streaming.md#§5
        realizes:
          - pipe
        svc: snowflake:streaming
      ex-pipe-config:
        label: 名前付き PIPE 定義
        kind: file
        provider: snowflake
        tier: process
        x: 6
        'y': 3
        description: 取り込み先とサーバー側の検証・変換を指定する利用者管理の設定。
        evidence: [{type: doc, ref: docs/reference-snowflake-kafka-iceberg-streaming.md#§5}]
      ex-reject:
        label: Snowflake のエラーテーブル
        kind: db
        tier: data
        x: 0
        'y': 1.5
        description: 対象の Iceberg テーブルで ERROR_LOGGING を有効にして、サーバー側の解析・変換で拒否された行とエラーを保持する。
        evidence:
          - type: doc
            ref: docs/reference-snowflake-kafka-iceberg-streaming.md#§5
        realizes:
          - reject
      ex-writer:
        label: Snowflake 管理 Iceberg の書き込み
        kind: worker
        tier: compute
        x: 0
        'y': 1.5
        description: 受信データから Iceberg 互換のデータファイルとメタデータを作る。
        evidence:
          - type: doc
            ref: docs/reference-snowflake-kafka-iceberg-streaming.md#§5
        realizes:
