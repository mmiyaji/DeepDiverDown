    label: Snowflake の実装例
    description: >-
      既存の Kafka と Kafka Connect を利用者が運用し、Snowflake Connector v4 から Snowflake 管理 Iceberg テーブルへ取り込む公式記事の構成。Snowflake
      が取り込みと管理表のファイル・メタデータを保守する。Kafka や Connect の基盤は既存環境であり所在を推測しない。
