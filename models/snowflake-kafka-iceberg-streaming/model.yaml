        realizes:
          - metadata
      ex-data:
        label: 管理 Iceberg の Parquet
        kind: file
        tier: data
        x: 10.4
        'y': 1.5
        description: Parquet データを保持し、管理テーブルの compaction がファイル配置を保守する。
        evidence:
          - type: doc
            ref: docs/reference-snowflake-kafka-iceberg-streaming.md#§5
        realizes:
          - data
      ex-read:
        label: SQL クエリ実行（Warehouse）
        svc: snowflake:warehouse
        kind: service
        tier: data
        x: 15.600000000000001
        'y': 1.5
        description: 取り込んだテーブルを SQL で直接問い合わせる。
        evidence:
          - type: doc
            ref: docs/reference-snowflake-kafka-iceberg-streaming.md#§5
        realizes:
          - read
      ex-kafka-host:
        label: 自前 Kafka ホスト
        kind: host
        tier: input
        x: 5.2
        'y': 3.5
        description: 利用者が Kafka ブローカーとログを運用する Linux ホスト。
        evidence: [{type: doc, ref: docs/reference-snowflake-kafka-iceberg-streaming.md#§5}]
      ex-connect-host:
        label: 自前 Connect ホスト
        kind: host
        tier: input
        x: 10.4
        'y': 3.5
        description: 利用者が Kafka Connect ワーカーと Snowflake Connector v4 を運用する Linux ホスト。
        evidence: [{type: doc, ref: docs/reference-snowflake-kafka-iceberg-streaming.md#§5}]
      ex-sql-client:
        label: SQL 利用者
        kind: client
        tier: input
        x: 16
        'y': 3.5
        description: Snowflake に認証し、Warehouse へ SQL クエリを送る。
        evidence: [{type: doc, ref: docs/reference-snowflake-kafka-iceberg-streaming.md#§5}]
    links:
      - {id: ex-pipe-definition, from: ex-pipe-config, to: ex-pipe, label: PIPE を設定}
      - {id: ex-kafka-run, from: ex-kafka-host, to: ex-topic, label: Kafka トピックを提供, evidence: [{type: doc, ref: docs/reference-snowflake-kafka-iceberg-streaming.md#§5}]}
