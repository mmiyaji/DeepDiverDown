name: DataHub のメタデータ基盤
description: ソースから集めたメタデータを検索・リネージに活用し、所有者とデータ契約の検証結果へたどる流れを追います。
parent:
  model: data-catalog-architecture
  node: datahub
reference:
  objectives:
    - Entity、URN、Aspect の役割を区別する。
    - 取り込み、メタデータ保存、検索・関係の参照を追う。
    - データ契約の記録と assertion の実行条件を説明する。
  sources:
    - title: DataHub Architecture Overview
      url: https://docs.datahub.com/docs/architecture/architecture/
    - title: Metadata Ingestion Architecture
      url: https://docs.datahub.com/docs/architecture/metadata-ingestion
    - title: The Metadata Model
      url: https://docs.datahub.com/docs/metadata-modeling/metadata-model
    - title: About DataHub Lineage
      url: https://docs.datahub.com/docs/features/feature-guides/lineage
    - title: Access Policies
      url: https://docs.datahub.com/docs/authorization/access-policies-guide
    - title: Domains
      url: https://docs.datahub.com/docs/domains
    - title: Data Contract Metamodel
      url: https://archive.docs.datahub.com/docs/1.8.0/generated/metamodel/entities/datacontract
    - title: DataHub Cloud Observe Assertions
      url: https://docs.datahub.com/docs/managed-datahub/observe/assertions
sources:
  - docs/reference-datahub.md
evidence:
  - type: doc
    ref: docs/reference-datahub.md#§1
tiers:
  - id: people
    label: 利用者と接続元
    z: 2
    size:
      - 13
      - 3
  - id: datahub
    label: メタデータ処理と検索画面
    z: 1
    size:
      - 13
      - 4
  - id: stores
    label: 保存・検索
    z: 0
    size:
      - 13
      - 3
nodes:
  source:
    label: ウェアハウス・変換基盤
    kind: external
    tier: people
    x: 1
    y: 1
    description: Dataset、スキーマ、リネージの取り込み元。
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§1
  test:
    label: 品質・鮮度の検証器
    kind: worker
    tier: people
    x: 5
    y: 1
    description: 例の assertion を実行し結果を送る外部ツール。
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§5
  user:
    label: 利用者・所有者
    kind: actor
    tier: people
    x: 10
    y: 1
    description: 資産の検索、契約結果の確認やメタデータの編集を行う。
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§3
      - type: doc
        ref: docs/reference-datahub.md#§4
      - type: doc
        ref: docs/reference-datahub.md#§5
  ingest:
    label: 取り込みコネクタ
    kind: worker
    tier: datahub
    x: 1
    y: 1
    description: 抽出結果を Metadata Change Proposal として送る。
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§2
  gms:
    label: メタデータ API
    kind: service
    tier: datahub
    x: 5
    y: 1
    description: Entity と Aspect を受け付け、検索・関係 API を提供する。
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§1
      - type: doc
        ref: docs/reference-datahub.md#§2
  portal:
    label: 検索・資産 UI
    kind: service
    tier: datahub
    x: 10
    y: 1
    description: 所有者、タグ、リネージ、検証結果を表示する。
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§3
      - type: doc
        ref: docs/reference-datahub.md#§4
      - type: doc
        ref: docs/reference-datahub.md#§5
  meta-store:
    label: メタデータ保存
    kind: db
    tier: stores
    x: 5
    y: 1
    description: スキーマ、所有者などのバージョン付き Aspect を保存する。
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§2
  index:
    label: 検索・関係の索引
    kind: db
    tier: stores
    x: 10
    y: 1
    description: 資産の検索と関係の参照を支える。
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§2
      - type: doc
        ref: docs/reference-datahub.md#§3
links:
  - id: collect
    from: source
    to: ingest
    label: スキーマ・依存関係を抽出
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§2
  - id: proposal
    from: ingest
    to: gms
    label: HTTP で MCP を送信
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§2
  - id: store
    from: gms
    to: meta-store
    label: Aspect を保存
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§2
  - id: index-update
    from: gms
    to: index
    label: 検索・関係に反映
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§2
  - id: search
    from: user
    to: portal
    label: 資産・所有者を検索
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§3
  - id: edit
    from: user
    to: portal
    label: 許可範囲でタグや説明を編集
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§4
  - id: lookup
    from: portal
    to: gms
    label: メタデータ・関係を照会
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§3
  - id: impact
    from: gms
    to: index
    label: 下流の依存関係をたどる
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§3
  - id: report
    from: test
    to: gms
    label: assertion の実行結果を登録
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§5
  - id: result
    from: portal
    to: gms
    label: 契約と assertion 結果を確認
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§5
scenarios:
  - id: impact-analysis
    label: 列変更の影響を調べる
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§6
    steps:
      - links:
          - collect
          - proposal
          - store
          - index-update
        note: ソースのスキーマと依存関係を取り込み、検索できるようにする。
      - links:
          - search
          - lookup
          - impact
        note: 列を使う下流資産と連絡すべき所有者を確認する。
      - links:
          - edit
        note: 許可された担当者が影響を受ける資産の説明を更新する。
  - id: freshness
    label: 鮮度契約を検証する
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§6
    steps:
      - links:
          - report
        note: 外部チェックが鮮度の assertion を実行して結果を送る。
      - links:
          - search
          - result
        note: 利用者は期待値と最近の実行結果を確認する。
requirements:
  - id: R-01
    kind: rule
    title: 検証結果を追跡できること
    text: 契約に紐づく検証の結果を、利用者が対象資産から確認できる。
    links:
      - report
      - result
    evidence:
      - type: doc
        ref: docs/reference-datahub.md#§5
implementations:
  - id: datahub-compose
    label: DataHub の Docker Compose
    description: DataHub を自己管理し、MySQL、Elasticsearch、イベントブローカーをコンテナで分ける例。
    sources:
      - title: Metadata Ingestion Architecture
        url: https://docs.datahub.com/docs/architecture/metadata-ingestion
      - title: The Metadata Model
        url: https://docs.datahub.com/docs/metadata-modeling/metadata-model
      - title: Data Contract Metamodel
        url: https://archive.docs.datahub.com/docs/1.8.0/generated/metamodel/entities/datacontract
      - title: DataHub Docker Container Architecture
        url: https://archive.docs.datahub.com/docs/1.2.0/architecture/docker-containers
    nodes:
      datahub-compose-consumer: {label: Metadata change consumer, kind: worker, tier: datahub, x: 14, y: 3, evidence: [{type: doc, ref: "docs/reference-datahub.md#§7"}]}
      datahub-compose-host: {label: Docker Compose host, kind: host, tier: datahub, x: 14, y: 1, evidence: [{type: doc, ref: "docs/reference-datahub.md#§7"}]}
      datahub-compose-warehouse:
        label: Snowflake のデータセット
        kind: external
        svc: snowflake:platform
        tier: people
        x: 1
        y: 1
        description: スキーマのメタデータを提供する。
        realizes:
          - source
        evidence:
          - type: doc
            ref: docs/reference-datahub.md#§7
      datahub-compose-dbt:
        label: dbt モデル
        kind: file
        tier: people
        x: 5
        y: 1
        description: 変換定義と依存関係を提供する。
        evidence:
          - type: doc
            ref: docs/reference-datahub.md#§7
      datahub-compose-assertions:
        label: dbt テスト結果
        kind: worker
        tier: people
        x: 9
        y: 1
        description: 既存のテスト結果を assertion として取り込む。
        realizes:
          - test
        evidence:
          - type: doc
            ref: docs/reference-datahub.md#§7
      datahub-compose-user:
        label: 分析担当者・資産所有者
        kind: actor
        tier: people
        x: 13
        y: 1
        description: ブラウザーで資産と検証結果を確認する。
        realizes:
          - user
        evidence:
          - type: doc
            ref: docs/reference-datahub.md#§7
      datahub-compose-cli:
        label: DataHub Ingestion CLI
        kind: worker
        tier: datahub
        x: 1
        y: 1
        description: ソースのレシピを実行し HTTP で GMS に送る。
        realizes:
          - ingest
        evidence:
          - type: doc
            ref: docs/reference-datahub.md#§7
      datahub-compose-gms:
        label: datahub-gms
        kind: service
        tier: datahub
        x: 5
        y: 1
        description: Entity、Aspect、関係を扱う。
        realizes:
          - gms
        evidence:
          - type: doc
            ref: docs/reference-datahub.md#§7
      datahub-compose-ui:
        label: datahub-frontend-react
        kind: catalog
        tier: datahub
        x: 10
        y: 1
        description: 検索と資産詳細・リネージを提供する。
        realizes:
          - portal
        evidence:
          - type: doc
            ref: docs/reference-datahub.md#§7
      datahub-compose-mysql:
        label: MySQL
        kind: db
        tier: stores
        x: 5
        y: 1
        description: バージョン付き Aspect を保存する。
        realizes:
          - meta-store
        evidence:
          - type: doc
            ref: docs/reference-datahub.md#§7
      datahub-compose-search:
        label: Elasticsearch
        kind: db
        tier: stores
        x: 10
        y: 1
        description: 検索と関係クエリを支える。
        realizes:
          - index
        evidence:
          - type: doc
            ref: docs/reference-datahub.md#§7
      datahub-compose-kafka:
        label: Kafka ブローカー
        kind: service
        tier: stores
        x: 1
        y: 1
        description: メタデータ変更や索引更新の処理を支える。
        evidence:
          - type: doc
            ref: docs/reference-datahub.md#§7
    links:
      - {id: datahub-compose-consumer-index, from: datahub-compose-consumer, to: datahub-compose-search, label: "Update search index", evidence: [{type: doc, ref: "docs/reference-datahub.md#§7"}]}
      - id: datahub-compose-dbt-ingest
        from: datahub-compose-dbt
        to: datahub-compose-cli
        label: dbt の変換定義を取り込む
        evidence:
          - type: doc
            ref: docs/reference-datahub.md#§7
      - id: datahub-compose-metadata-change
        from: datahub-compose-gms
        to: datahub-compose-kafka
        label: メタデータ変更を送る
        evidence:
          - type: doc
            ref: docs/reference-datahub.md#§7
      - id: datahub-compose-index-change
        from: datahub-compose-kafka
        to: datahub-compose-consumer
        label: 変更イベントを受信
        evidence:
          - type: doc
            ref: docs/reference-datahub.md#§7
    groups:
      - kind: cloud
        provider: snowflake
        label: Snowflake
        tier: [people]
        nodes: [datahub-compose-warehouse]
      - {kind: datacenter, label: 自前 Linux ホスト（Docker Compose）, provider: onprem, nodes: [datahub-compose-host, datahub-compose-cli, datahub-compose-gms, datahub-compose-ui, datahub-compose-mysql, datahub-compose-search, datahub-compose-kafka, datahub-compose-consumer, datahub-compose-dbt, datahub-compose-assertions]}


    layout2d:
