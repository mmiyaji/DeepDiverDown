  - id: aws-eks-datahub
    label: "Amazon EKS 上の DataHub・RDS・MSK・OpenSearch"
    description: "DataHub を Helm で EKS の EC2 ノード上に展開する。RDS に Aspect を保持し、MSK の変更イベントを処理して OpenSearch の索引を更新する。"
    sources:
      - {title: "DataHub の AWS デプロイ", url: https://docs.datahub.com/docs/deploy/aws}
      - {title: "DataHub の Kubernetes デプロイ", url: https://docs.datahub.com/docs/deploy/kubernetes}
      - {title: "DataHub dbt コネクター", url: https://docs.datahub.com/docs/generated/ingestion/sources/dbt}
      - {title: "EKS マネージドノードグループ", url: https://docs.aws.amazon.com/eks/latest/userguide/create-managed-node-group.html}
      - {title: AWS shared responsibility, url: https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/shared-responsibility.html}
      - {title: EKS managed node groups, url: https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html}
    tiers:
      - {id: entry, label: 投入元, kind: origin, z: 1, origin: [-5, 0], size: [3, 4]}
      - {id: runtime, label: 管理と実行, z: 1, size: [17, 7]}
      - {id: data, label: データと復旧, z: 0, size: [17, 5]}
    groups:
      - {kind: cloud, label: "AWS アカウント", provider: aws, tier: [runtime, data], nodes: [aws-eks-datahub-eks, aws-eks-datahub-nodes, aws-eks-datahub-ingest, aws-eks-datahub-frontend, aws-eks-datahub-gms, aws-eks-datahub-indexer, aws-eks-datahub-registry, aws-eks-datahub-db, aws-eks-datahub-msk, aws-eks-datahub-index]}
      - {kind: cluster, label: "Amazon EKS クラスター", provider: k8s, tier: [runtime], nodes: [aws-eks-datahub-eks, aws-eks-datahub-nodes, aws-eks-datahub-ingest, aws-eks-datahub-frontend, aws-eks-datahub-gms, aws-eks-datahub-indexer, aws-eks-datahub-registry]}
      - {kind: namespace, label: "DataHub 名前空間", provider: k8s, tier: [runtime], nodes: [aws-eks-datahub-ingest, aws-eks-datahub-frontend, aws-eks-datahub-gms, aws-eks-datahub-indexer, aws-eks-datahub-registry]}
      - {kind: vpc, label: "保存先サービスの接続先", provider: aws, tier: [data], nodes: [aws-eks-datahub-db, aws-eks-datahub-msk, aws-eks-datahub-index]}
    nodes:
      aws-eks-datahub-source: {label: "既存のウェアハウス", kind: external, tier: entry, x: 1, y: 0.6, realizes: [source], description: "テーブルとスキーマのメタデータを供給する。", evidence: [{type: doc, ref: docs/reference-datahub.md#§8}]}
      aws-eks-datahub-test: {label: "外部 dbt Core 実行基盤", kind: external, tier: entry, x: 1, y: 2.1, realizes: [test], description: "契約を含むビルド結果のアーティファクトを出力する。", evidence: [{type: doc, ref: docs/reference-datahub.md#§8}]}
      aws-eks-datahub-user: {label: "利用者・データ所有者", kind: actor, tier: entry, x: 1, y: 3.5, realizes: [user], description: "検索、影響確認、所有者の更新を行う。", evidence: [{type: doc, ref: docs/reference-datahub.md#§8}]}
      aws-eks-datahub-eks: {label: "EKS Kubernetes API", kind: service, tier: runtime, x: 1, y: 0.5, svc: eks, description: "Helm のリソースを適用する。", management: {type: shared, scope: "AWS operates EKS control plane; customer manages Kubernetes API configuration and workloads."}, evidence: [{type: doc, ref: docs/reference-datahub.md#§8}]}
      aws-eks-datahub-nodes: {label: "EKS の EC2 ノード", kind: host, tier: runtime, x: 1, y: 3.1, svc: ec2, description: "DataHub の Pod と取り込み Job を稼働させる。", management: {type: shared, scope: "AWS operates service infrastructure; customer configures resources, data and permissions."}, evidence: [{type: doc, ref: docs/reference-datahub.md#§8}]}
