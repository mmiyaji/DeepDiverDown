      aws-eks-datahub-frontend: {label: "DataHub Frontend", kind: service, tier: runtime, x: 5.5, y: 4.9, realizes: [portal], description: "認証した利用者に検索と資産編集の UI を提供する。", management: {type: customer, scope: "Customer manages deployment, code and access."}, evidence: [{type: doc, ref: docs/reference-datahub.md#§8}]}
      aws-eks-datahub-gms: {label: "DataHub GMS", kind: service, tier: runtime, x: 10.3, y: 1.3, realizes: [gms], description: "Aspect、アセット、リネージをアプリケーション API で受け付ける。", management: {type: customer, scope: "Customer manages deployment, code and access."}, evidence: [{type: doc, ref: docs/reference-datahub.md#§8}]}
