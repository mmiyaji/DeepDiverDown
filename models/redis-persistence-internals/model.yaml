blocks:
  - id: structure
    title: RDB と AOF のファイル構成
    note: Redis 7 以降のマルチパート AOF の概念例です。実際のファイル数・書き込みタイミングは設定と状態で異なります。
    hint: 項目を選ぶと説明を表示します。処理の流れに合わせて関連する項目を強調します。
    lanes:
      - id: mem
        label: メモリ内
        node: parent
      - id: rdb
        label: RDB
        node: rdb
      - id: aof
        label: AOF
        node: base
    items:
      mem:
        - id: state
          label: データセット
          k: 0
          note: Redis がメモリ上で扱う現在の状態。
      rdb:
        - id: snap
          label: snapshot
          k: 1
          note: 保存時点のスナップショット。
      aof:
        - id: base
          label: base
          k: 2
          note: 書き直し時点の基礎データ。
        - id: increment
          label: incremental
          k: 3
          note: base 後の更新を保持するファイル。
        - id: manifest
          label: manifest
          k: 4
          note: 利用する AOF ファイルの一覧。
