name: Redis：RDB・マルチパート AOF と復旧
description: fork と copy-on-write、RDB、Redis 7 以降の AOF base・incremental・manifest、再起動時の復旧を追う。
parent:
  model: redis
  node: persist
reference:
  objectives:
    - データの格納とアクセスの仕組みを理解する。
    - 物理構造と運用・障害時の前提を区別する。
  sources:
    - title: Redis persistence
      url: https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/
    - title: Redis replication
      url: https://redis.io/docs/latest/operate/oss_and_stack/management/replication/
    - title: INFO
      url: https://redis.io/docs/latest/commands/info/
sources:
  - docs/reference-redis-persistence-internals.md
evidence:
  - type: doc
    ref: docs/reference-redis-persistence-internals.md#§1
  - type: doc
    ref: docs/reference-redis-persistence-internals.md#§3
  - type: doc
    ref: docs/reference-redis-persistence-internals.md#§5
tiers:
  - id: access
    label: 操作と処理
    z: 1
    size:
      - 24
      - 4
  - id: disk
    label: データと保存
    z: 0
    size:
      - 24
      - 4
nodes:
  client:
    label: 書き込み
    kind: client
    tier: access
    x: 0
