  parent:
    label: Redis のデータセット
    kind: db
    tier: access
    x: 5
    'y': 1.5
    description: メモリ内の状態を更新する。
    evidence:
      - type: doc
        ref: docs/reference-redis-persistence-internals.md#§2
  fork:
    label: バックグラウンド保存
    kind: service
    tier: access
    x: 10
    'y': 1.5
    description: 子プロセスを使った RDB 保存・AOF 書き直し。
    evidence:
      - type: doc
        ref: docs/reference-redis-persistence-internals.md#§2
  rdb:
    label: RDB スナップショット
    kind: file
    tier: disk
    x: 4
    'y': 1.5
    description: ある時点のデータセットを保存する。
    evidence:
      - type: doc
        ref: docs/reference-redis-persistence-internals.md#§2
  base:
    label: AOF base
    kind: file
    tier: disk
    x: 9
    'y': 1.5
    description: AOF 書き直し時点の基礎データ。
    evidence:
      - type: doc
        ref: docs/reference-redis-persistence-internals.md#§2
  incr:
    label: AOF incremental
    kind: file
    tier: disk
    x: 14
    'y': 1.5
    description: base 後の書き込みを追記する。
    evidence:
      - type: doc
        ref: docs/reference-redis-persistence-internals.md#§2
  manifest:
    label: AOF manifest
    kind: file
    tier: disk
    x: 19
    'y': 1.5
    description: 有効な base と incremental ファイルを管理する。
    evidence:
      - type: doc
        ref: docs/reference-redis-persistence-internals.md#§2
links:
