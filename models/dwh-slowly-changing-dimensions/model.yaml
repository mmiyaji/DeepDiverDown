        aws-secret: {tier: services, x: 22, y: 1}
        aws-rds: {tier: services, x: 26, y: 1}
        aws-ecr: {tier: services, x: 2, y: 4}
        example-change: {tier: services, x: 6, y: 4}
        example-ingest: {tier: services, x: 10, y: 4}
        example-current: {tier: services, x: 14, y: 4}
        example-history: {tier: services, x: 18, y: 4}
        example-event: {tier: services, x: 22, y: 4}
        example-fact: {tier: services, x: 26, y: 4}
        example-analytics: {tier: services, x: 2, y: 7}
        example-check: {tier: services, x: 6, y: 7}
      groups:
        - {kind: cloud, provider: aws, label: AWS account, tier: [task, fargate, services], nodes: [aws-schedule, aws-ecs, aws-fargate, aws-job, aws-secret, aws-rds, aws-ecr, example-change, example-ingest, example-current, example-history, example-event, example-fact, example-analytics, example-check]}
        - {kind: cluster, label: Fargate task, tier: [task, fargate], nodes: [aws-fargate, aws-job]}
        - {kind: cluster, label: RDS PostgreSQL database, tier: services, nodes: [aws-rds, example-change, example-ingest, example-current, example-history, example-event, example-fact, example-analytics]}
