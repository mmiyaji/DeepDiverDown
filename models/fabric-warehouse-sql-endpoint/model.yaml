-warehouse-sql-endpoint.md#§6}]}, i-cap: {svc: fabric:platform, label: Fabric 容量, kind: scheduler, tier: flow, x: 14, 'y': 0.5, realizes: [cap], description: ワークスペースを割り当てる。, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§6}]}, i-delta: {svc: fabric:lakehouse, label: OneLake, kind: db, tier: flow, x: 19, 'y': 4, realizes: [delta], description: Delta Parquet とログを保持する。, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§6}]}, i-lh: {svc: fabric:lakehouse, label: Lakehouse Tables, kind: table, tier: flow, x: 19, 'y': 8, realizes: [lh], description: Spark ノートブックが書く。, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§6}]}, i-sync: {svc: fabric:platform, label: SQL メタデータ同期, kind: worker, tier: flow, x: 14, 'y': 8, realizes: [sync], description: Microsoft 管理の自動同期。, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§6}]}}, links: [], groups: [{kind: cloud, provider: fabric, label: Fabric テナント・ワークスペース, tier: [flow], nodes: [i-tds, i-sec, i-wh, i-sqlep, i-engine, i-cap, i-delta, i-lh, i-sync]}], layout2d: {tiers: [{id: diagram, label: SQL の経路, z: 0, size: [28, 14]}], nodes: {i-client: {tier: diagram, x: 2, 'y': 6}, i-tds: {tier: diagram, x: 6, 'y': 6}, i-sec: {tier: diagram, x: 6, 'y': 2.5}, i-wh: {tier: diagram, x: 11, 'y': 3.5}, i-sqlep: {tier: diagram, x: 11, 'y': 8.5}, i-engine: {tier: diagram, x: 16, 'y': 6}, i-cap: {tier: diagram, x: 16, 'y': 2.5}, i-delta: {tier: diagram, x: 21, 'y': 6}, i-lh: {tier: diagram, x: 21, 'y': 10}, i-sync: {tier: diagram, x: 16, 'y': 10}}, groups: [{kind: cloud, label: Fabric テナント・ワークスペース, provider: fabric, tier: [diagram], x0: 4.4, y0: 1.1, x1: 22.6, y1: 11.4, nodes: [i-tds, i-sec, i-wh, i-sqlep, i-engine, i-cap, i-delta, i-lh, i-sync]}]}, layout3d: {tiers: [{id: fabric, label: Fabric テナント・ワークスペース, z: 0, origin: [0, 0], size: [24, 11]}], nodes: {i-client: {tier: fabric, x: 2, 'y': 4.5}, i-tds: {tier: fabric, x: 6, 'y': 4.5}, i-sec: {t