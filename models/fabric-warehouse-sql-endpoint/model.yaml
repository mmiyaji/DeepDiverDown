name: Microsoft Fabric：Warehouse と SQL 分析エンドポイント
description: Warehouse と Lakehouse の SQL 分析エンドポイントが同じ SQL エンジンで動き、書き込みの可否とメタデータ同期が異なることを追う。
parent:
  model: microsoft-fabric
  node: warehouse
reference:
  objectives: [Warehouse と SQL 分析エンドポイントの書き込み可否を区別する。, Spark が書いた Delta テーブルが SQL から見えるまでの同期を追う。, SQL の権限と容量の消費がどこで効くかを説明する。]
  sources: [{title: Microsoft Learn · Fabric Data Warehouse, url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-warehousing}, {title: Microsoft Learn · SQL analytics endpoint, url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sql-analytics-endpoint}, {title: Microsoft Learn · SQL analytics endpoint metadata sync, url: https://learn.microsoft.com/en-us/fabric/data-engineering/sql-analytics-endpoint-metadata-sync}, {title: Microsoft Learn · Fabric licenses and capacity, url: https://learn.microsoft.com/en-us/fabric/enterprise/licenses}]
sources:
  - docs/reference-fabric-warehouse-sql-endpoint.md
evidence:
  - {type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§1}
  - {type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§2}
tiers:
  - {id: flow, label: SQL の経路, z: 0, size: [24, 10]}
nodes:
  client: {label: T-SQL クライアント（SSMS・アプリ）, kind: client, tier: flow, x: 0, 'y': 4, description: TDS で接続して T-SQL を送る。, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§2}]}
  tds: {label: SQL エンドポイント（TDS 接続）, kind: gateway, tier: flow, x: 4, 'y': 4, description: 接続を受け、Warehouse か SQL 分析エンドポイントへ振り分ける。, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§2}]}
  sec: {label: SQL 権限・OneLake セキュリティ, kind: policy, tier: flow, x: 4, 'y': 0.5, description: SQL の粒度の権限は SQL 分析エンドポイント経由の読み取りにだけ効く。Spark など他の経路はワークスペースのロールなどで制御する。, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§5}]}
  wh: {label: Warehouse, kind: service, tier: flow, x: 9, 'y': 1.5, description: DDL と DML、マルチテーブルの ACID トランザクションを使える。COPY INTO・CTAS・パイプラインで取り込む。, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§3}]}
  sqlep: {label: SQL 分析エンドポイント（読み取り専用）, kind: service, tier: flow, x: 9, 'y': 6.5, description: Delta テーブルを T-SQL で読む。ビュー、関数、ストアドプロシージャは作れるが、データは変更できない。, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§4}]}
  engine: {label: 分散クエリエンジン（共通）, kind: worker, tier: flow, x: 14, 'y': 4, description: Warehouse と SQL 分析エンドポイントが共有する SQL エンジン。, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§3}]}
  cap: {label: 容量（CU）, kind: scheduler, tier: flow, x: 14, 'y': 0.5, description: クエリの計算が容量の CU を消費する。, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§5}]}
  delta: {label: OneLake の Delta テーブル, kind: db, tier: flow, x: 19, 'y': 4, description: Warehouse のデータも Lakehouse のデータも Delta Parquet とトランザクションログで保存される。, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§3}]}
  lh: {label: Lakehouse Tables（Spark が更新）, kind: table, tier: flow, x: 19, 'y': 8, description: Spark が Delta テーブルを書く。Tables の外に置いたテーブルは SQL 分析エンドポイントに出ない。, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§4}]}
  sync: {label: メタデータ同期, kind: worker, tier: flow, x: 14, 'y': 8, description: Delta の変更を検出して SQL 側のテーブル定義と統計を更新する。手動で更新を起動する方法もある。同期の遅延の長さは未確認。, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§4}]}
links:
  - {id: connect, from: client, to: tds, label: T-SQL を送る, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§2}]}
  - {id: route-wh, from: tds, to: wh, label: 読み書きを渡す, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§3}]}
  - {id: route-ep, from: tds, to: sqlep, label: 読み取りを渡す, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§4}]}
  - {id: run-wh, from: wh, to: engine, label: クエリを実行, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§3}]}
  - {id: run-ep, from: sqlep, to: engine, label: クエリを実行, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§4}]}
  - {id: read-delta, from: engine, to: delta, label: Delta を読む, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§3}]}
  - {id: write-delta, from: engine, to: delta, label: DML の結果を Delta で書く, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§3}]}
  - {id: spark-write, from: lh, to: delta, label: Delta を書く, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§4}]}
  - {id: detect, from: delta, to: sync, label: 変更を検出, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§4}]}
  - {id: update-meta, from: sync, to: sqlep, label: SQL のテーブル定義を更新, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§4}]}
  - {id: authz, from: sec, to: tds, label: 権限を評価, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§5}]}
  - {id: meter, from: cap, to: engine, label: CU を割り当て, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§5}]}
scenarios:
  - {id: tsql-write, label: T-SQL で Warehouse を更新する, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§1}], steps: [{links: [connect, authz, route-wh], note: クライアントが TDS で接続し、権限を評価して Warehouse に渡す。}, {links: [run-wh, meter, write-delta], note: エンジンが容量の CU を使って実行し、結果を Delta で OneLake に書く。}]}
  - {id: spark-then-sql, label: Spark の更新を SQL で読む, evidence: [{type: doc, ref: docs/reference-fabric-warehouse-sql-endpoint.md#§1}], steps: [{links: [spark-write, detect, update-meta], note: Spark が書いた Delta の変更を同期が検出し、SQL 分析エンドポイントの定義を更新する。}, {links: [connect, authz, route-ep, run-ep, read-delta], note: T-SQL で読む。データの変更は Spark 側で行う。}]}
unknowns:
  - {id: sync-latency, text: メタデータ同期の遅延の目安は取得した資料で未確認。, refs: [detect, update-meta]}
  - {id: replicate, text: Warehouse のデータが OneLake の Files へ自動複製される範囲と形式は資料の記述が簡潔で、詳細は未確認。, refs: [write-delta]}
  - {id: perf, text: 分散クエリエンジンの性能・スケールの実測値は未確認。提供元の説明は自己申告である。, refs: [run-wh]}
