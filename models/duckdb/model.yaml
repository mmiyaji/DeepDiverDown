      - {kind: cluster, label: 単一 Fargate タスク内の Python プロセス, tier: runtime, nodes: [aws-python, aws-engine]}
    nodes:
      aws-operator: {label: タスク実行者, kind: client, tier: runtime, x: 0, y: 3, description: タスク定義と実行ネットワークを指定して ECS の RunTask を呼び出す。, evidence: [{type: doc, ref: docs/reference-duckdb.md#§8}]}
      aws-task-role: {label: ECS タスク IAM ロール, svc: iam, kind: policy, tier: storage, x: 14, y: 3, description: DuckDB の credential_chain が使用する S3 読み取り権限を設定する。, management: {type: customer, scope: "利用者が IAM ロールと S3 権限を管理する。"}, evidence: [{type: doc, ref: docs/reference-duckdb.md#§8}]}
      aws-ecs: {label: "Amazon ECS（スタンドアロンタスク）", svc: ecs, kind: service, tier: runtime, x: 2, y: 1.5, description: "指定したタスク定義を AWS Fargate 上で起動する。", management: {type: shared, scope: "AWS が ECS 基盤を運用し、利用者がタスク定義を指定する。"}, evidence: [{type: doc, ref: docs/reference-duckdb.md#§8}]}
      aws-fargate: {label: "AWS Fargate（実行環境）", svc: fargate, kind: host, tier: runtime, x: 8, y: 1.5, description: "分析用コンテナを起動する。", management: {type: shared, scope: "AWS が Fargate 基盤を運用し、利用者がタスクとネットワークを設定する。"}, evidence: [{type: doc, ref: docs/reference-duckdb.md#§8}]}
      aws-python: {label: "Python スクリプト", kind: client, tier: runtime, x: 14, y: 1.5, realizes: [query], description: "DuckDB 接続に分析 SQL と EXPLAIN ANALYZE を渡す。", management: {type: customer, scope: "利用者が Python アプリと SQL を管理する。"}, evidence: [{type: doc, ref: docs/reference-duckdb.md#§8}]}
      aws-engine: {label: "DuckDB（Python と同じプロセス）", kind: worker, tier: runtime, x: 20, y: 1.5, realizes: [optimizer, scan, project, profile], description: "httpfs で Parquet を読み、絞り込み・投影・計測を実行する。", management: {type: customer, scope: "利用者が DuckDB と拡張、アプリ設定を管理する。"}, evidence: [{type: doc, ref: docs/reference-duckdb.md#§8}]}
      aws-ecr: {label: "Amazon ECR（Python と DuckDB のイメージ）", svc: ecr, kind: db, tier: storage, x: 8, y: 1.5, description: "固定した DuckDB と拡張を含むコンテナイメージを保持する。", management: {type: shared, scope: "AWS が ECR 基盤を運用し、利用者がイメージと権限を管理する。"}, evidence: [{type: doc, ref: docs/reference-duckdb.md#§8}]}
      aws-s3: {label: "Amazon S3（orders.parquet）", svc: s3, kind: db, tier: storage, x: 20, y: 1.5, realizes: [footer, groups, columns], description: "列チャンクとフッターを持つ Parquet オブジェクトを保持する。", management: {type: shared, scope: "AWS が S3 基盤を運用し、利用者がオブジェクトと権限を管理する。"}, evidence: [{type: doc, ref: docs/reference-duckdb.md#§8}]}
