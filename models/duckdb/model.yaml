name: DuckDB の基本アーキテクチャ
description: アプリのプロセスに組み込む分析 SQL エンジン。クライアント API、解析と最適化、ベクトル化実行、ストレージ、外部ファイルの関係を追う。
reference:
  objectives: [組み込み型で、アプリと同じプロセスで動くことを説明する。, SQL が解析・最適化・実行を通って結果になる流れを追う。, データベースファイルと外部ファイル（Parquet・S3）の使い分けを区別する。]
  sources:
  - {title: Why DuckDB, url: 'https://duckdb.org/why_duckdb'}
  - {title: DuckDB Internals Overview, url: 'https://duckdb.org/docs/2.0/internals/overview.html'}
  - {title: DuckDB Concurrency, url: 'https://duckdb.org/docs/2.0/connect/concurrency.html'}
  - {title: DuckDB Python API, url: 'https://duckdb.org/docs/2.0/clients/python/overview.html'}
  - {title: DuckDB Storage Format, url: 'https://duckdb.org/docs/2.0/internals/storage.html'}
  - {title: DuckDB Core Extensions, url: 'https://duckdb.org/docs/2.0/core_extensions/overview.html'}
  - {title: DuckDB HTTP(S) Support, url: 'https://duckdb.org/docs/2.0/core_extensions/httpfs/https.html'}
  - {title: DuckDB S3 API Support, url: 'https://duckdb.org/docs/2.0/core_extensions/httpfs/s3api.html'}
  - {title: Memory Management in DuckDB, url: 'https://duckdb.org/2024/07/09/memory-management.html'}
sources: [docs/reference-duckdb.md]
evidence:
- {type: doc, ref: docs/reference-duckdb.md#§1}
- {type: doc, ref: docs/reference-duckdb.md#§2}
- {type: doc, ref: docs/reference-duckdb.md#§3}
- {type: doc, ref: docs/reference-duckdb.md#§4}
- {type: doc, ref: docs/reference-duckdb.md#§5}
- {type: doc, ref: docs/reference-duckdb.md#§6}
- {type: doc, ref: docs/reference-duckdb.md#§7}
- {type: doc, ref: docs/reference-duckdb.md#§8}
- {type: doc, ref: docs/reference-duckdb.md#§9}
tiers:
- id: host
  label: アプリケーションのプロセス
  z: 1
  size: [3, 6]
  origin: [0, 0]
- id: engine
  label: DuckDB エンジン（同じプロセス）
  z: 1
  origin: [3, 0]
  size: [20, 7]
- id: data
  label: 保存先と外部ファイル
  z: 0
  origin: [3, 0]
  size: [20, 3]
nodes:
  app:
    label: アプリケーション
    kind: client
    tier: host
    x: 1
    y: 3
    description: Python などのプロセス。DuckDB をライブラリとして組み込む。
    evidence:
    - {type: doc, ref: docs/reference-duckdb.md#§2}
  clientapi:
    label: クライアント API
    kind: service
    tier: engine
    x: 3
    y: 1.5
    description: 言語ごとのクライアント。接続を開き SQL を発行する。
    evidence:
    - {type: doc, ref: docs/reference-duckdb.md#§2}
  parser:
    label: パーサーとバインダー
    kind: service
    tier: engine
    x: 8
    y: 1.5
    description: SQL を構文の木にし、カタログで表・列・型を解決する。
    evidence:
    - {type: doc, ref: docs/reference-duckdb.md#§3}
  planner:
    label: 論理プランナーとオプティマイザ
    kind: service
    tier: engine
    x: 13
    y: 1.5
    description: 論理演算子の木を作り、フィルタのプッシュダウンや結合順の最適化を行う。
    evidence:
    - {type: doc, ref: docs/reference-duckdb.md#§3}
  physical:
    label: 物理演算子の実行
    kind: worker
    tier: engine
    x: 18
    y: 1.5
    description: プッシュ型のベクトル化モデルで DataChunk を流す。マルチスレッドで並列化する。
    evidence:
    - {type: doc, ref: docs/reference-duckdb.md#§4}
    parallel: N
  buffer:
    label: バッファマネージャー
    kind: cache
    tier: engine
    x: 13
    y: 4.5
    description: 永続ストレージのページをキャッシュし、中間結果とメモリ上限を共有する。
    evidence:
    - {type: doc, ref: docs/reference-duckdb.md#§5}
  ext:
    label: 拡張（parquet・httpfs）
    kind: service
    tier: engine
    x: 18
    y: 4.5
    description: Parquet の読み取りと HTTP(S)・S3 のアクセスを提供する。
    evidence:
    - {type: doc, ref: docs/reference-duckdb.md#§6}
  dbfile:
    label: データベースファイル
    kind: db
    tier: data
    x: 8
    y: 1.5
    description: 単一ファイル。行グループとブロックで構成する。
    evidence:
    - {type: doc, ref: docs/reference-duckdb.md#§5}
  wal:
    label: WAL
    kind: file
    tier: data
    x: 13
    y: 1.5
    description: 書き込みを先に記録し、checkpoint でデータベースファイルへ反映する。
    evidence:
    - {type: doc, ref: docs/reference-duckdb.md#§5}
  remote:
    label: 外部ファイル（Parquet・CSV・S3）
    kind: db
    tier: data
    x: 18
    y: 1.5
    description: ローカルや S3 のファイル。直接検索できる。
    evidence:
    - {type: doc, ref: docs/reference-duckdb.md#§6}
links:
- id: call
  from: app
  to: clientapi
  label: SQL を発行
  evidence:
  - {type: doc, ref: docs/reference-duckdb.md#§2}
- id: parse
  from: clientapi
  to: parser
  label: SQL 文を渡す
  evidence:
  - {type: doc, ref: docs/reference-duckdb.md#§3}
- id: plan
  from: parser
  to: planner
  label: バインド結果から計画を作る
  evidence:
  - {type: doc, ref: docs/reference-duckdb.md#§3}
- id: exec
  from: planner
  to: physical
  label: 物理計画へ変換して実行
  evidence:
  - {type: doc, ref: docs/reference-duckdb.md#§4}
- id: result
  from: physical
  to: app
  label: 結果を返す
  evidence:
  - {type: doc, ref: docs/reference-duckdb.md#§2}
- id: read
  from: dbfile
  to: buffer
  label: ブロックを読み込む
  evidence:
  - {type: doc, ref: docs/reference-duckdb.md#§5}
- id: supply
  from: buffer
  to: physical
  label: テーブルのデータを供給
  evidence:
  - {type: doc, ref: docs/reference-duckdb.md#§5}
- id: log
  from: physical
  to: wal
  label: 変更を記録
  evidence:
  - {type: doc, ref: docs/reference-duckdb.md#§5}
- id: checkpoint
  from: wal
  to: dbfile
  label: checkpoint で反映
  evidence:
  - {type: doc, ref: docs/reference-duckdb.md#§5}
- id: load
  from: ext
  to: physical
  label: 外部ファイルのスキャンを提供
  evidence:
  - {type: doc, ref: docs/reference-duckdb.md#§6}
- id: extread
  from: remote
  to: ext
  label: 必要な範囲だけ読む
  evidence:
  - {type: doc, ref: docs/reference-duckdb.md#§6}
scenarios:
- id: local
  label: データベースファイルへの問い合わせ
  evidence:
  - {type: doc, ref: docs/reference-duckdb.md#§5}
  steps:
  - links: [call, parse, plan, exec]
    note: SQL を解析・最適化し、物理計画を実行する。
  - links: [read, supply]
    note: ブロックをバッファマネージャー経由で読み、実行エンジンへ渡す。
  - links: [result]
    note: 結果をアプリへ返す。
- id: s3
  label: S3 の Parquet を検索
  evidence:
  - {type: doc, ref: docs/reference-duckdb.md#§6}
  steps:
  - links: [call, parse, plan, exec]
    note: 同じ流れで SQL を計画・実行する。
  - links: [load, extread]
    note: httpfs が Parquet のメタデータと Range リクエストで、必要な部分だけを読む。
  - links: [result]
    note: 結果を返す。
- id: write
  label: 書き込みと checkpoint
  evidence:
  - {type: doc, ref: docs/reference-duckdb.md#§5}
  steps:
  - links: [call, parse, plan, exec]
    note: 更新文を計画・実行する。
  - links: [log, checkpoint]
    note: 変更を WAL に記録し、checkpoint でデータベースファイルへ反映する。
unknowns:
- id: UNK-01
  text: パイプラインへの分割やスレッドの割り当てなど、実行エンジンの内部実装は公式資料で確認できていない。
  refs: [physical]
- id: UNK-02
  text: S3 の取得量と応答時間は、ファイルの構成・ネットワーク・設定に依存し、一般には示せない。
  refs: [remote, ext]
gates: {maxDrift: 0, maxHigh: 0}
implementations:
- id: python-local
  label: Python に組み込む DuckDB（ローカル）
  description: Python プロセス内の DuckDB が、ローカルのデータベースファイルと Parquet を使う例。
  sources:
  - {title: DuckDB Python API, url: 'https://duckdb.org/docs/2.0/clients/python/overview.html'}
  - {title: DuckDB Concurrency, url: 'https://duckdb.org/docs/2.0/connect/concurrency.html'}
  - {title: DuckDB Parquet Overview, url: 'https://duckdb.org/docs/2.0/data/parquet/overview.html'}
  tiers:
  - id: processing
    label: データの処理と保存
    z: 0
    size: [14, 5]
  groups:
    - {kind: datacenter, label: 利用者の PC / サーバー, provider: onprem, tier: [processing], nodes: [local-host, local-engine, local-db, local-parquet]}
  nodes:
    local-host:
      label: 自前 Python 実行ホスト
      kind: host
      tier: processing
      x: 3
      y: 0
      description: 利用者が Python プロセスとローカルファイルシステムを管理する。
      evidence:
      - {type: doc, ref: docs/reference-duckdb.md#§8}
    local-python:
      label: Python プログラムと duckdb パッケージ
      kind: client
      tier: processing
      x: 1
      y: 1.15
      realizes: [app, clientapi]
      description: duckdb.connect でデータベースファイルを開き、SQL を実行する。
      evidence:
      - {type: doc, ref: docs/reference-duckdb.md#§8}
    local-engine:
      label: 同じプロセスの DuckDB エンジン
      kind: worker
      tier: processing
      x: 1
      y: 3.65
      realizes: [parser, planner, physical, buffer, ext]
      description: 解析・最適化・実行・キャッシュを同じプロセスで行う。
      evidence:
      - {type: doc, ref: docs/reference-duckdb.md#§8}
    local-db:
      label: ローカルの analytics.duckdb と WAL
      kind: db
      tier: processing
      x: 5
      y: 1.15
      realizes: [dbfile, wal]
      description: 1 つのプロセスだけが書き込む。
      evidence:
      - {type: doc, ref: docs/reference-duckdb.md#§8}
    local-parquet:
      label: ローカルの orders.parquet
      kind: file
      tier: processing
      x: 5
      y: 3.65
      realizes: [remote]
      description: read_parquet で直接読む。
      evidence:
      - {type: doc, ref: docs/reference-duckdb.md#§8}
  links:
  - {id: local-host-python, from: local-host, to: local-python, label: Python を実行}
  - {id: local-host-files, from: local-host, to: local-db, label: ローカルファイルを提供}
  layout2d:
    tiers:
    - id: diagram
      label: 実装構成
      z: 0
      size: [27, 19]
    nodes:
      local-host: {tier: diagram, x: 2, y: 2}
      local-python: {tier: diagram, x: 2, y: 5}
      local-engine: {tier: diagram, x: 2, y: 8}
      local-db: {tier: diagram, x: 2, y: 11}
      local-parquet: {tier: diagram, x: 2, y: 14}
    groups:
    - kind: datacenter
      label: 利用者の PC / サーバー
      provider: onprem
      tier: [diagram]
      x0: -0.8
      y0: -0.8
      x1: 4.8
      y1: 17.8
      nodes: [local-host, local-python, local-engine, local-db, local-parquet]
    - kind: nodegroup
      label: 自前ホスト
      tier: [diagram]
      x0: 0
      y0: 0
      x1: 4
      y1: 17
      nodes: [local-host, local-python, local-engine, local-db, local-parquet]
  layout3d:
    tiers:
    - id: zone0
      label: 自前ホスト
      z: 0
      origin: [0, 0]
      size: [5, 17]
    nodes:
      local-host: {tier: zone0, x: 2, y: 1}
      local-python: {tier: zone0, x: 2, y: 4}
      local-engine: {tier: zone0, x: 2, y: 7}
      local-db: {tier: zone0, x: 2, y: 10}
      local-parquet: {tier: zone0, x: 2, y: 13}
    groups:
    - kind: datacenter
      label: 利用者の PC / サーバー
      provider: onprem
      tier: [zone0]
      nodes: [local-host, local-python, local-engine, local-db, local-parquet]
    - kind: nodegroup
      label: 自前ホスト
      tier: [zone0]
      nodes: [local-host, local-python, local-engine, local-db, local-parquet]
- id: aws-fargate-duckdb
  label: AWS（DuckDB on Fargate・Amazon S3）
  description: ECS の Fargate タスク内で Python と DuckDB を実行し、S3 の Parquet を httpfs で部分的に読む例。
  sources:
  - {title: DuckDB S3 API Support, url: 'https://duckdb.org/docs/1.5/core_extensions/httpfs/s3api'}
  - {title: DuckDB AWS extension, url: 'https://duckdb.org/docs/extensions/aws'}
  - {title: AWS SDK のコンテナ認証プロバイダー, url: 'https://docs.aws.amazon.com/sdkref/latest/guide/feature-container-credentials.html'}
  - {title: ECS タスク IAM ロール, url: 'https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-iam-roles.html'}
  - {title: ECS の Fargate タスク定義, url: 'https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-tasks-services.html'}
  tiers:
  - id: runtime
    label: ECS タスクの実行
    z: 1
    size: [23, 4]
  - id: storage
    label: 入力ファイルと実行イメージ
    z: 0
    size: [23, 4]
  groups:
  - kind: cloud
    provider: aws
    label: AWS アカウント
    tier: [runtime, storage]
    nodes: [aws-ecs, aws-fargate, aws-python, aws-engine, aws-ecr, aws-s3, aws-task-role, aws-memdb]
  - kind: cluster
    label: 単一 Fargate タスク内の Python プロセス
    tier: runtime
    nodes: [aws-python, aws-engine, aws-memdb]
  nodes:
    aws-operator:
      label: タスク実行者
      kind: client
      tier: runtime
      x: 0
      y: 3
      description: タスク定義と実行ネットワークを指定して ECS の RunTask を呼び出す。
      evidence:
      - {type: doc, ref: docs/reference-duckdb.md#§9}
    aws-task-role:
      label: ECS タスク IAM ロール
      svc: iam
      kind: policy
      tier: storage
      x: 14
      y: 3
      description: DuckDB の credential_chain が使用する S3 読み取り権限を設定する。
      management: {type: customer, scope: 利用者が IAM ロールと S3 権限を管理する。}
      evidence:
      - {type: doc, ref: docs/reference-duckdb.md#§9}
    aws-ecs:
      label: Amazon ECS（スタンドアロンタスク）
      svc: ecs
      kind: service
      tier: runtime
      x: 2
      y: 1.5
      description: 指定したタスク定義を AWS Fargate 上で起動する。
      management: {type: shared, scope: AWS が ECS 基盤を運用し、利用者がタスク定義を指定する。}
      evidence:
      - {type: doc, ref: docs/reference-duckdb.md#§9}
    aws-fargate:
      label: AWS Fargate（実行環境）
      svc: fargate
      kind: host
      tier: runtime
      x: 8
      y: 1.5
      description: 分析用コンテナを起動する。
      management: {type: shared, scope: AWS が Fargate 基盤を運用し、利用者がタスクとネットワークを設定する。}
      evidence:
      - {type: doc, ref: docs/reference-duckdb.md#§9}
    aws-python:
      label: Python スクリプト
      kind: client
      tier: runtime
      x: 14
      y: 1.5
      realizes: [app, clientapi]
      description: DuckDB 接続に分析 SQL と EXPLAIN ANALYZE を渡す。クライアント API は duckdb パッケージ。
      management: {type: customer, scope: 利用者が Python アプリと SQL を管理する。}
      evidence:
      - {type: doc, ref: docs/reference-duckdb.md#§9}
    aws-engine:
      label: DuckDB（Python と同じプロセス）
      kind: worker
      tier: runtime
      x: 20
      y: 1.5
      realizes: [parser, planner, physical, buffer, ext]
      description: httpfs で Parquet を読み、絞り込み・投影・計測を実行する。
      management: {type: customer, scope: 利用者が DuckDB と拡張、アプリ設定を管理する。}
      evidence:
      - {type: doc, ref: docs/reference-duckdb.md#§9}
    aws-ecr:
      label: Amazon ECR（Python と DuckDB のイメージ）
      svc: ecr
      kind: db
      tier: storage
      x: 8
      y: 1.5
      description: 固定した DuckDB と拡張を含むコンテナイメージを保持する。
      management: {type: shared, scope: AWS が ECR 基盤を運用し、利用者がイメージと権限を管理する。}
      evidence:
      - {type: doc, ref: docs/reference-duckdb.md#§9}
    aws-s3:
      label: Amazon S3（orders.parquet）
      svc: s3
      kind: db
      tier: storage
      x: 20
      y: 1.5
      realizes: [remote]
      description: 列チャンクとフッターを持つ Parquet オブジェクトを保持する。
      management: {type: shared, scope: AWS が S3 基盤を運用し、利用者がオブジェクトと権限を管理する。}
      evidence:
      - {type: doc, ref: docs/reference-duckdb.md#§9}
    aws-memdb:
      label: インメモリのデータベース（永続ファイルなし）
      kind: db
      tier: runtime
      x: 14
      y: 3.5
      realizes: [dbfile, wal]
      description: duckdb.connect を引数なしで呼ぶ例。永続のデータベースファイルと WAL は持たない。
      management: {type: customer, scope: 利用者が接続の設定を管理する。}
      evidence:
      - {type: doc, ref: docs/reference-duckdb.md#§9}
  links:
  - {id: aws-submit, from: aws-operator, to: aws-ecs, label: RunTask を呼び出す}
  - {id: aws-role, from: aws-task-role, to: aws-engine, label: S3 読み取り権限を付与}
  - {id: aws-start, from: aws-ecs, to: aws-fargate, label: ECS タスクを起動}
  - {id: aws-run, from: aws-fargate, to: aws-python, label: 分析用コンテナを実行}
  - {id: aws-image, from: aws-fargate, to: aws-ecr, label: 起動時にイメージを取得}
  - id: aws-read-range
    from: aws-engine
    to: aws-s3
    label: 必要な範囲を HTTP Range GET で読む
    realizes: [extread]
    replace: true
  layout2d:
    tiers:
    - id: diagram
      label: 実装構成
      z: 0
      size: [27, 16]
    nodes:
      aws-operator: {tier: diagram, x: 2, y: 2}
      aws-fargate: {tier: diagram, x: 8, y: 2}
      aws-python: {tier: diagram, x: 8, y: 5}
      aws-engine: {tier: diagram, x: 8, y: 8}
      aws-ecs: {tier: diagram, x: 14, y: 2}
      aws-task-role: {tier: diagram, x: 14, y: 5}
      aws-ecr: {tier: diagram, x: 20, y: 2}
      aws-s3: {tier: diagram, x: 20, y: 5}
      aws-memdb: {tier: diagram, x: 8, y: 11}
    groups:
    - kind: vpc
      provider: aws
      label: Fargate タスクの利用者 VPC
      tier: [diagram]
      x0: 6
      y0: 0
      x1: 10
      y1: 14
      nodes: [aws-fargate, aws-python, aws-engine, aws-memdb]
    - kind: cloud
      provider: aws
      label: AWS アカウント
      tier: [diagram]
      x0: 6
      y0: 0
      x1: 26
      y1: 15
      nodes: [aws-fargate, aws-python, aws-engine, aws-ecs, aws-task-role, aws-ecr, aws-s3, aws-memdb]
    - kind: nodegroup
      label: Fargate タスク
      tier: [diagram]
      x0: 6
      y0: 0
      x1: 10
      y1: 14
      nodes: [aws-fargate, aws-python, aws-engine, aws-memdb]
  layout3d:
    tiers:
    - id: zone0
      label: 運用者
      z: 0
      origin: [0, 0]
      size: [5, 4]
    - id: zone1
      label: Fargate タスク
      z: 0
      origin: [7, 0]
      size: [5, 12]
    - id: zone2
      label: ECS と IAM
      z: 0
      origin: [14, 0]
      size: [5, 6]
    - id: zone3
      label: ECR と S3
      z: 0
      origin: [21, 0]
      size: [5, 6]
    nodes:
      aws-operator: {tier: zone0, x: 2, y: 1}
