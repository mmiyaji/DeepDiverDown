        aws-eks-airbyte-worker: {tier: zone2, x: 2, y: 10}
        aws-eks-airbyte-destination: {tier: zone2, x: 2, y: 13}
        aws-eks-airbyte-metadata: {tier: zone3, x: 2, y: 1}
        aws-eks-airbyte-warehouse: {tier: zone3, x: 2, y: 4}
