name: Airbyte の基本アーキテクチャ
description: Source Connector が受注 API を読み、Sync Job と Destination Connector を経て倉庫へ書き、State で増分同期を再開する流れ。
reference:
  objectives: [Connection と Connector の役割を区別する, Full Refresh と Incremental・cursor・State の関係を理解する, コミット済み State から再開する流れを追う]
  sources:
    - {title: Airbyte Protocol, url: https://docs.airbyte.com/platform/understanding-airbyte/airbyte-protocol}
    - {title: Connections and streams, url: https://docs.airbyte.com/platform/using-airbyte/getting-started/set-up-a-connection}
    - {title: Sync Modes, url: https://docs.airbyte.com/platform/using-airbyte/core-concepts/sync-modes}
    - {title: Incremental Sync, url: https://docs.airbyte.com/platform/connector-development/connector-builder-ui/incremental-sync}
sources: [docs/reference-airbyte.md]
evidence: [{type: doc, ref: docs/reference-airbyte.md#§1}]
tiers:
  - {id: flow, label: 同期データの流れ, z: 0, origin: [0,0], size: [16,4]}
  - {id: control, label: 同期制御, z: 1, origin: [0,0], size: [16,4]}
nodes:
  source: {label: 受注 API, kind: external, tier: flow, x: 1, y: 2, evidence: [{type: doc, ref: docs/reference-airbyte.md#§1}, {type: doc, ref: docs/reference-airbyte.md#§2}]}
  sourceConnector: {label: Source Connector, kind: worker, tier: flow, x: 4, y: 2, evidence: [{type: doc, ref: docs/reference-airbyte.md#§2}]}
  syncJob: {label: Sync Job, kind: service, tier: flow, x: 7, y: 2, evidence: [{type: doc, ref: docs/reference-airbyte.md#§3}]}
  destinationConnector: {label: Destination Connector, kind: worker, tier: flow, x: 10, y: 2, evidence: [{type: doc, ref: docs/reference-airbyte.md#§3}]}
  warehouse: {label: 分析用ウェアハウス, kind: db, tier: flow, x: 13, y: 2, evidence: [{type: doc, ref: docs/reference-airbyte.md#§3}]}
  connection: {label: Connection 設定, kind: service, tier: control, x: 5, y: 2, evidence: [{type: doc, ref: docs/reference-airbyte.md#§1}, {type: doc, ref: docs/reference-airbyte.md#§5}]}
  state: {label: State / cursor, kind: db, tier: control, x: 11, y: 2, evidence: [{type: doc, ref: docs/reference-airbyte.md#§4}, {type: doc, ref: docs/reference-airbyte.md#§5}]}
links:
  - {id: configure, from: connection, to: syncJob, label: 同期を設定・起動, evidence: [{type: doc, ref: docs/reference-airbyte.md#§1}]}
  - {id: read, from: source, to: sourceConnector, label: Stream を読む, evidence: [{type: doc, ref: docs/reference-airbyte.md#§2}]}
  - {id: execute, from: sourceConnector, to: syncJob, label: レコードと State, evidence: [{type: doc, ref: docs/reference-airbyte.md#§3}, {type: doc, ref: docs/reference-airbyte.md#§4}]}
  - {id: write, from: syncJob, to: destinationConnector, label: レコードを渡す, evidence: [{type: doc, ref: docs/reference-airbyte.md#§3}]}
  - {id: commit, from: destinationConnector, to: warehouse, label: Destination にコミット, evidence: [{type: doc, ref: docs/reference-airbyte.md#§3}, {type: doc, ref: docs/reference-airbyte.md#§4}]}
  - {id: checkpoint, from: destinationConnector, to: state, label: コミット済み State, evidence: [{type: doc, ref: docs/reference-airbyte.md#§4}]}
  - {id: resume, from: state, to: sourceConnector, label: cursor から再開, evidence: [{type: doc, ref: docs/reference-airbyte.md#§4}, {type: doc, ref: docs/reference-airbyte.md#§5}]}
scenarios:
  - id: incremental
    label: 初回と増分同期
    evidence: [{type: doc, ref: docs/reference-airbyte.md#§1}, {type: doc, ref: docs/reference-airbyte.md#§2}, {type: doc, ref: docs/reference-airbyte.md#§3}, {type: doc, ref: docs/reference-airbyte.md#§4}, {type: doc, ref: docs/reference-airbyte.md#§5}]
    steps:
      - {links: [configure], note: Connection で Source・Destination・Stream を結ぶ。}
      - {links: [read, execute], note: Source Connector が初回は全件、以後は cursor 以降を読む。}
      - {links: [write, commit], note: Destination Connector が選択方式でウェアハウスへコミットする。}
      - {links: [checkpoint, resume], note: コミット済み State から次回の同期を再開する。}
  - id: failure-resume
    label: 途中失敗後の再開
    evidence: [{type: doc, ref: docs/reference-airbyte.md#§4}]
    steps:
      - {links: [execute], note: Source が出力中に同期が停止する。}
      - {links: [checkpoint], note: Destination がコミットした範囲だけを確定する。}
      - {links: [resume], note: 次回は確定済み State から再取得する。}
requirements:
  - {id: BR-01, kind: usecase, title: 受注 Stream を増分複製, text: State / cursor を使って新規・変更レコードを届ける。, links: [read, execute, commit, resume], evidence: [{type: doc, ref: docs/reference-airbyte.md#§2}]}
  - {id: NFR-01, kind: nfr, title: 未コミットデータを飛ばさない, text: State は Destination のコミット確認後に進める。, links: [commit, checkpoint, resume], evidence: [{type: doc, ref: docs/reference-airbyte.md#§4}]}
unknowns: [{id: UNK-01, text: 具体的な実行間隔と内部サービス配置は確定していない。, refs: [configure]}]
gates: {maxDrift: 0, maxHigh: 0}
