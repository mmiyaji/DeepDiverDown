        - {kind: cloud, label: AWS アカウント, provider: aws, tier: [diagram], x0: 6, y0: 0, x1: 30, y1: 18, nodes: [aws-eks-airbyte-eks, aws-eks-airbyte-ec2, aws-eks-airbyte-server, aws-eks-airbyte-source-pod, aws-eks-airbyte-worker, aws-eks-airbyte-destination, aws-eks-airbyte-metadata, aws-eks-airbyte-warehouse, aws-eks-airbyte-s3]}
        - {kind: cluster, label: "EKS ノードと Airbyte", tier: [diagram], x0: 13, y0: 0, x1: 17, y1: 18, nodes: [aws-eks-airbyte-ec2, aws-eks-airbyte-server, aws-eks-airbyte-source-pod, aws-eks-airbyte-worker, aws-eks-airbyte-destination]}
