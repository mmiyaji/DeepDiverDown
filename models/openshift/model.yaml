name: OpenShift の基本アーキテクチャ
description: プロジェクト内の注文 API を Deployment として投入し、Service・Route で公開し、worker 障害後の再調整を追います。
reference:
  objectives:
    - OpenShift の API、Controller、Scheduler、Route の役割を区別する。
    - 注文 API を Deployment から Pod にし、Service と Route で公開する流れを追う。
    - worker 障害後の再調整が環境条件に依存することを理解する。
  sources:
    - {title: OpenShift Container Platform 4.21 Building applications, url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/building_applications/index"}
    - {title: Kubernetes Deployments, url: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"}
    - {title: Kubernetes Cluster Architecture, url: "https://kubernetes.io/docs/concepts/architecture/"}
sources: [docs/reference-openshift.md]
evidence:
  - {type: doc, ref: "docs/reference-openshift.md#§1"}
  - {type: doc, ref: "docs/reference-openshift.md#§2"}
  - {type: doc, ref: "docs/reference-openshift.md#§3"}
  - {type: doc, ref: "docs/reference-openshift.md#§4"}
  - {type: doc, ref: "docs/reference-openshift.md#§5"}
  - {type: doc, ref: "docs/reference-openshift.md#§6"}
tiers:
  - {id: client, label: 利用者, kind: origin, z: 1, origin: [-4, 0], size: [2.5, 3]}
  - {id: control, label: OpenShift 制御, z: 1, size: [8, 3]}
  - {id: worker, label: ワーカーノード, z: 0, size: [8, 3]}
  - {id: edge, label: 外部公開, z: 0, origin: [9, 0], size: [3, 3]}
nodes:
  oc:
    {label: 構成の投入クライアント, kind: client, tier: client, x: 0, 'y': 1.5, description: プロジェクトを選択し注文 API の Deployment を送る。, evidence: [{type: doc, ref: docs/reference-openshift.md#§2}]}
  api:
    {label: クラスタ管理 API, kind: service, tier: control, x: 0, 'y': 1.5, description: プロジェクト内のリソース操作を受け付ける API 入口。, evidence: [{type: doc, ref: docs/reference-openshift.md#§2}]}
  controller:
    {label: レプリカ調整・配置先の決定, kind: service, tier: control, x: 4, 'y': 1.5, description: Deployment の差分を調整し、Pod の配置を決める制御部品群。, evidence: [{type: doc, ref: docs/reference-openshift.md#§3}, {type: doc, ref: docs/reference-openshift.md#§5}]}
  kubelet:
    {label: ノード実行エージェント, kind: worker, tier: worker, x: 1, 'y': 1.5, description: ノード上で割り当てられた注文 API Pod を起動する。, evidence: [{type: doc, ref: docs/reference-openshift.md#§3}]}
  order-api:
    {label: 注文 API の実行単位, kind: service, tier: worker, x: 5, 'y': 1.5, description: Deployment の Pod テンプレートから起動される注文 API。, evidence: [{type: doc, ref: docs/reference-openshift.md#§3}, {type: doc, ref: docs/reference-openshift.md#§4}]}
  service:
    {label: 注文 API の内部公開, kind: lb, tier: edge, x: 0.5, 'y': 1.5, description: 注文 API Pod への内部エンドポイント。, evidence: [{type: doc, ref: docs/reference-openshift.md#§4}]}
  route:
    {label: 外部公開ルート, kind: lb, tier: edge, x: 2.2, 'y': 1.5, description: Service をホスト名で外部公開する入口。DNS は別途構成する。, evidence: [{type: doc, ref: docs/reference-openshift.md#§4}]}
links:
  - {id: apply, from: oc, to: api, label: Deployment を適用, evidence: [{type: doc, ref: "docs/reference-openshift.md#§2"}]}
  - {id: reconcile, from: api, to: controller, label: 状態を調整, evidence: [{type: doc, ref: "docs/reference-openshift.md#§3"}]}
  - {id: schedule, from: controller, to: kubelet, label: Pod を配置, evidence: [{type: doc, ref: "docs/reference-openshift.md#§3"}]}
  - {id: start, from: kubelet, to: order-api, label: Pod を起動, evidence: [{type: doc, ref: "docs/reference-openshift.md#§3"}]}
  - {id: service-route, from: route, to: service, label: Service を公開, evidence: [{type: doc, ref: "docs/reference-openshift.md#§4"}]}
  - {id: route-pod, from: service, to: order-api, label: Pod へ転送, evidence: [{type: doc, ref: "docs/reference-openshift.md#§4"}]}
  - {id: worker-loss, from: kubelet, to: api, label: ノードの状態とハートビート, evidence: [{type: doc, ref: "docs/reference-openshift.md#§5"}]}
scenarios:
  - id: deploy-order-api
    label: OpenShift に注文 API を公開
    evidence: [{type: doc, ref: "docs/reference-openshift.md#§2"}, {type: doc, ref: "docs/reference-openshift.md#§4"}]
    steps:
      - {links: [apply], note: "oc 利用者がプロジェクト内へ注文 API の Deployment を適用する。"}
      - {links: [reconcile, schedule, start], note: "API と制御部品が状態を調整し、worker の kubelet が注文 API Pod を起動する。"}
      - {links: [service-route, route-pod], note: "Service を Route でホスト名公開し、外部リクエストを Pod へ転送する。"}
  - id: worker-loss
    label: worker 障害後の再調整
    evidence: [{type: doc, ref: "docs/reference-openshift.md#§5"}]
    steps:
      - {links: [worker-loss], note: "制御プレーンが注文 API を実行するノードのハートビート途絶を検知し、望ましい状態との差分を認識する。"}
      - {links: [reconcile, schedule, start], note: "Controller と Scheduler が再配置を試みる。残存ノード・リソース・条件に依存する。"}
implementations:
  - id: ocp
    label: OpenShift と Ingress Controller
    description: vSphere に用意した RHCOS VM で OpenShift を自主管理し、入口を TCP ロードバランサーに分ける例。
    sources:
      - title: OpenShift Ingress and load balancing
        url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/ingress_and_load_balancing/index
      - title: OpenShift Networking Operators
        url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/networking_operators/index
      - {title: "OpenShift の vSphere ユーザー管理インフラ", url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/installing_on_vmware_vsphere/user-provisioned-infrastructure}
    tiers:
      - id: client
        label: 利用者
        kind: origin
        z: 1
        origin:
          - -4
          - 0
      - id: control
        label: OpenShift 制御
        z: 1
      - id: worker
        label: ワーカーノード
        z: 0
      - id: edge
        label: 外部公開
        z: 0
        origin:
          - 9
          - 0
    groups:
      - kind: cluster
        label: OpenShift クラスタ
        provider: k8s
        tier:
          - control
          - worker
          - edge
        nodes:
          - ocp-api
          - ocp-kubelet
          - ocp-order-api
          - ocp-service
          - ocp-route
    nodes:
      ocp-oc:
        label: oc CLI
        kind: client
        tier: client
        realizes:
          - oc
        description: 注文 API のマニフェストを適用する。
        evidence:
          - type: doc
            ref: docs/reference-openshift.md#§7
      ocp-api:
        label: vSphere 上の RHCOS 制御 VM
        kind: worker
        tier: control
        svc: onprem:vm
        realizes:
          - api
          - controller
        description: API・調整・スケジューリングと etcd を実行し、etcd のクラスタ状態は各制御 VM の永続ディスクに保持する。
        management: {type: customer, scope: 利用者がこの例の設定と運用を担う。}
        evidence:
          - type: doc
            ref: docs/reference-openshift.md#§7
      ocp-kubelet:
        label: vSphere 上の RHCOS worker（kubelet・CRI-O）
        kind: worker
        tier: worker
        svc: onprem:vm
        realizes:
          - kubelet
        description: Pod の割り当てを取得しコンテナを動かす。
        management: {type: customer, scope: 利用者がこの例の設定と運用を担う。}
        evidence:
          - type: doc
            ref: docs/reference-openshift.md#§7
      ocp-order-api:
        label: 注文 API Deployment / Pod
        kind: service
        tier: worker
        svc: k8s:deployment
        realizes:
          - order-api
        description: 同一の注文 API を複数レプリカで実行する。
        management: {type: customer, scope: 利用者がこの例の設定と運用を担う。}
        evidence:
          - type: doc
            ref: docs/reference-openshift.md#§7
      ocp-service:
        label: 注文 API の ClusterIP Service
        kind: lb
        tier: edge
        svc: k8s:service
        realizes:
          - service
        description: Route の参照先を定義する。
        management: {type: customer, scope: 利用者がこの例の設定と運用を担う。}
        evidence:
          - type: doc
            ref: docs/reference-openshift.md#§7
      ocp-route:
        label: TLS Route と HAProxy Router
        kind: lb
        tier: edge
        realizes:
          - route
        description: worker 上の HAProxy Router が Route のホスト名を受け、Service の Pod エンドポイントへ送る。
        management: {type: customer, scope: 利用者がこの例の設定と運用を担う。}
        evidence:
          - type: doc
            ref: docs/reference-openshift.md#§7
      ocp-dns:
        label: apps ドメインのワイルドカード DNS
        kind: service
        tier: edge
        description: apps ワイルドカードを Ingress 用ロードバランサーに解決する。
        management: {type: customer, scope: 利用者がこの例の設定と運用を担う。}
        evidence:
          - type: doc
            ref: docs/reference-openshift.md#§7
      ocp-api-lb: {label: "API 用 L4 ロードバランサー", kind: lb, tier: client, svc: onprem:lb, description: "6443 を正常な OpenShift API サーバーに転送する。", evidence: [{type: doc, ref: docs/reference-openshift.md#§7}]}
      ocp-ingress-lb: {label: "アプリ用 L4 ロードバランサー", kind: lb, tier: edge, svc: onprem:lb, description: "80 と 443 を Ingress Router が動くノードへ転送する。", evidence: [{type: doc, ref: docs/reference-openshift.md#§7}]}
    links:
      - {id: ocp-submit, from: ocp-oc, to: ocp-api-lb, label: クラスタ API に接続, realizes: [apply], replace: true}
      - {id: ocp-api-forward, from: ocp-api-lb, to: ocp-api, label: 正常な API サーバーへ転送, realizes: [apply], replace: true}
      - {id: ocp-run-router, from: ocp-kubelet, to: ocp-route, label: Router Pod を実行, evidence: [{type: doc, ref: docs/reference-openshift.md#§7}]}
      - {id: ocp-external, from: ocp-ingress-lb, to: ocp-route, label: HTTP と HTTPS を Router に中継, realizes: [route-pod], replace: true}
      - {id: ocp-router-pod, from: ocp-route, to: ocp-order-api, label: Service が選んだ Pod エンドポイントへ転送, realizes: [route-pod], replace: true}
      - id: ocp-resolve-router
        from: ocp-dns
        to: ocp-ingress-lb
        label: 公開ホスト名を解決
        evidence:
          - type: doc
            ref: docs/reference-openshift.md#§7

    layout2d:
      tiers: [{id: diagram, label: 自主管理環境, z: 0, origin: [-4, 0], size: [22, 11]}]
      nodes:
        ocp-oc: {tier: diagram, x: -3, y: 1}
        ocp-api-lb: {tier: diagram, x: 2, y: 1}
        ocp-api: {tier: diagram, x: 6, y: 1}
        ocp-kubelet: {tier: diagram, x: 6, y: 5}
        ocp-order-api: {tier: diagram, x: 6, y: 8}
        ocp-service: {tier: diagram, x: 10, y: 8}
        ocp-route: {tier: diagram, x: 10, y: 5}
        ocp-ingress-lb: {tier: diagram, x: 14, y: 5}
        ocp-dns: {tier: diagram, x: 14, y: 1}
      groups:
        - {kind: datacenter, label: 利用者の環境, tier: [diagram], x0: 0, y0: -1, x1: 16, y1: 10, nodes: [ocp-api, ocp-kubelet, ocp-order-api, ocp-service, ocp-route, ocp-api-lb, ocp-ingress-lb, ocp-dns]}
        - {kind: cluster, provider: k8s, label: OpenShift クラスタ, tier: [diagram], x0: 4, y0: -0.5, x1: 12, y1: 9.5, nodes: [ocp-api, ocp-kubelet, ocp-order-api, ocp-service, ocp-route]}
    layout3d:
      tiers:
        - {id: nodes, label: 制御・実行ノード, z: 0, size: [10, 4]}
        - {id: apps, label: ノード上のアプリ・データ, z: 1, size: [10, 4]}
        - {id: external, label: クラスタ外のサービス, z: 0, origin: [12, 0], size: [8, 7]}
        - {id: outside, label: 利用者, z: 0, origin: [-5, 0], size: [3, 3]}
      nodes:
        ocp-oc: {tier: outside, x: 1, y: 1}
        ocp-api: {tier: nodes, x: 2, y: 2}
        ocp-kubelet: {tier: nodes, x: 6, y: 2}
        ocp-order-api: {tier: apps, x: 6, y: 2}
        ocp-route: {tier: apps, x: 6, y: 3.5}
        ocp-service: {tier: apps, x: 9, y: 2}
        ocp-api-lb: {tier: external, x: 1, y: 1}
        ocp-ingress-lb: {tier: external, x: 5, y: 1}
        ocp-dns: {tier: external, x: 1, y: 5}
      groups:
        - {kind: datacenter, label: 利用者の環境, tier: [nodes, apps, external], nodes: [ocp-api, ocp-kubelet, ocp-order-api, ocp-service, ocp-route, ocp-api-lb, ocp-ingress-lb, ocp-dns]}
        - {kind: cluster, provider: k8s, label: OpenShift クラスタ, tier: [nodes, apps], nodes: [ocp-api, ocp-kubelet, ocp-order-api, ocp-service, ocp-route]}
