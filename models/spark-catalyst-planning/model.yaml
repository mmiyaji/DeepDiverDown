name: Spark SQL：Catalyst と実行計画
description: SQL の解析、名前解決、ルール最適化、物理計画、Stage と Task への変換を追う。
reference:
  objectives:
    - SQL の解析、名前解決、ルール最適化、物理計画、Stage と Task への変換を追う。
    - EXTENDED は parsed / analyzed / optimized / physical plan を表示する。
    - EXPLAIN は実行後の AQE 最終計画や実際のタスク時間を単独で保証しない。
  sources:
    - title: Spark EXPLAIN
      url: https://spark.apache.org/docs/4.3.0/sql-ref-syntax-qry-explain.html
    - title: Spark SQL 性能
      url: https://spark.apache.org/docs/4.3.0/sql-performance-tuning.html
    - title: Spark Cluster Mode
      url: https://spark.apache.org/docs/4.3.0/cluster-overview.html
sources:
  - docs/reference-spark-catalyst-planning.md
evidence:
  - type: doc
    ref: docs/reference-spark-catalyst-planning.md#§1
tiers:
  - id: flow
    label: 処理の流れ
    z: 0
    size:
      - 21
      - 8
nodes:
  query:
    label: SQL / DataFrame
    kind: client
    tier: flow
    x: 1
    'y': 1.5
    description: 利用者がクエリを組み立て、action により実行を要求する。
    evidence:
      - type: doc
        ref: docs/reference-spark-catalyst-planning.md#§2
  parsed:
    label: 未解決の論理計画
    kind: file
    tier: flow
    x: 6
    'y': 1.5
    description: SQL パーサーなどが解析した時点では表名・列名は未解決。
    evidence:
      - type: doc
        ref: docs/reference-spark-catalyst-planning.md#§2
  analyzed:
    label: 名前と型の解決
    kind: service
    tier: flow
    x: 11
    'y': 1.5
    description: Analyzer がカタログを用いて表・列・型を解決する。
    evidence:
      - type: doc
        ref: docs/reference-spark-catalyst-planning.md#§2
  optimized:
    label: 論理最適化
    kind: service
    tier: flow
    x: 16
    'y': 1.5
    description: Catalyst のルールが論理計画を変換する。選択可能な計画は統計の品質に影響される。
    evidence:
      - type: doc
        ref: docs/reference-spark-catalyst-planning.md#§2
  physical:
    label: 物理計画と codegen
    kind: service
    tier: flow
    x: 1
    'y': 5
    description: Scan、Exchange、Join などを選び、対応箇所で生成コードを使う。すべての演算が codegen 対象とは限らない。
    evidence:
      - type: doc
        ref: docs/reference-spark-catalyst-planning.md#§2
  tasks:
    label: Stage / Task
    kind: worker
    tier: flow
    x: 6
    'y': 5
    description: shuffle などの境界に従って実行段階を作り Executor が task を処理する。
    evidence:
      - type: doc
        ref: docs/reference-spark-catalyst-planning.md#§2
  input:
    label: 入力データ
    kind: db
    tier: flow
    x: 11
    'y': 5
    description: データソースやカタログが実データとメタデータを提供する。
    evidence:
      - type: doc
        ref: docs/reference-spark-catalyst-planning.md#§2
links:
  - id: parse
    from: query
    to: parsed
    label: クエリを解析
    evidence:
      - type: doc
        ref: docs/reference-spark-catalyst-planning.md#§3
  - id: resolve
    from: parsed
    to: analyzed
    label: 名前と型を解決
    evidence:
      - type: doc
        ref: docs/reference-spark-catalyst-planning.md#§3
  - id: rewrite
    from: analyzed
    to: optimized
    label: 論理計画を最適化
    evidence:
      - type: doc
        ref: docs/reference-spark-catalyst-planning.md#§3
  - id: plan
    from: optimized
    to: physical
    label: 物理演算子を選択
    evidence:
      - type: doc
        ref: docs/reference-spark-catalyst-planning.md#§3
  - id: execute
    from: physical
    to: tasks
    label: Stage と Task を実行
    evidence:
      - type: doc
        ref: docs/reference-spark-catalyst-planning.md#§3
  - id: read
    from: input
    to: tasks
    label: データを読み取る
    evidence:
      - type: doc
        ref: docs/reference-spark-catalyst-planning.md#§3
  - id: catalog
    from: input
    to: analyzed
    label: 表と列を参照
    evidence:
      - type: doc
        ref: docs/reference-spark-catalyst-planning.md#§3
scenarios:
  - id: flow
    label: 処理の流れ
    steps:
      - links:
          - parse
        note: クエリを解析。
      - links:
          - resolve
        note: 名前と型を解決。
      - links:
          - rewrite
        note: 論理計画を最適化。
      - links:
          - plan
        note: 物理演算子を選択。
      - links:
          - execute
        note: Stage と Task を実行。
      - links:
          - read
        note: データを読み取る。
      - links:
          - catalog
        note: 表と列を参照。
implementations:
  - id: spark-standalone
    label: 自己管理 Spark Standalone の代表構成
    description: Spark Standalone のホスト、Driver、Executor と入力・出力を使う概念的な代表例。製品・プラグイン・バージョンの互換性および実機動作は別途確認する。
    sources:
      - title: Spark EXPLAIN
        url: https://spark.apache.org/docs/4.3.0/sql-ref-syntax-qry-explain.html
      - title: Spark SQL 性能
        url: https://spark.apache.org/docs/4.3.0/sql-performance-tuning.html
      - title: Spark Standalone Mode
        url: https://spark.apache.org/docs/4.3.0/spark-standalone.html
    tiers:
      - id: runtime
        label: 自己管理環境
        z: 0
        size:
          - 24
          - 11
    groups:
      - kind: cluster
        label: Spark Standalone クラスター
        tier:
          - runtime
        nodes:
          - ex-cluster
          - ex-parsed
          - ex-analyzed
          - ex-optimized
          - ex-physical
          - ex-tasks
    nodes:
      ex-query:
        label: SQL / DataFrame
        kind: client
        tier: runtime
        x: 2
        'y': 2
        realizes:
          - query
        description: 利用者がクエリを組み立て、action により実行を要求する。
        evidence:
          - type: doc
            ref: docs/reference-spark-catalyst-planning.md#§4
      ex-parsed:
        label: Driver：未解決の論理計画
        kind: file
        tier: runtime
        x: 7
        'y': 2
        realizes:
          - parsed
        description: SQL パーサーなどが解析した時点では表名・列名は未解決。
        evidence:
          - type: doc
            ref: docs/reference-spark-catalyst-planning.md#§4
      ex-analyzed:
        label: Driver：名前と型の解決
        kind: service
        tier: runtime
        x: 12
        'y': 2
        realizes:
          - analyzed
        description: Analyzer がカタログを用いて表・列・型を解決する。
        evidence:
          - type: doc
            ref: docs/reference-spark-catalyst-planning.md#§4
      ex-optimized:
        label: Driver：論理最適化
        kind: service
        tier: runtime
        x: 17
        'y': 2
        realizes:
          - optimized
        description: Catalyst のルールが論理計画を変換する。選択可能な計画は統計の品質に影響される。
        evidence:
          - type: doc
            ref: docs/reference-spark-catalyst-planning.md#§4
      ex-physical:
        label: Driver：物理計画と codegen
        kind: service
        tier: runtime
        x: 2
        'y': 6
        realizes:
          - physical
        description: Scan、Exchange、Join などを選び、対応箇所で生成コードを使う。すべての演算が codegen 対象とは限らない。
        evidence:
          - type: doc
            ref: docs/reference-spark-catalyst-planning.md#§4
      ex-tasks:
        label: Executor：Stage / Task
        kind: worker
        tier: runtime
        x: 7
        'y': 6
        realizes:
          - tasks
        description: shuffle などの境界に従って実行段階を作り Executor が task を処理する。
        evidence:
          - type: doc
            ref: docs/reference-spark-catalyst-planning.md#§4
      ex-input:
        label: 入力データ
        kind: db
        tier: runtime
        x: 12
        'y': 6
        realizes:
          - input
        description: データソースやカタログが実データとメタデータを提供する。
        evidence:
          - type: doc
            ref: docs/reference-spark-catalyst-planning.md#§4
      ex-cluster:
        label: Spark Standalone の Master / Worker
        kind: host
        tier: runtime
        x: 2
        'y': 9
        description: 自己管理するホスト上で Spark Standalone クラスターの資源を管理し Driver と Executor を動かす。
        evidence:
          - type: doc
            ref: docs/reference-spark-catalyst-planning.md#§4
    links:
      - id: ex-start
        from: ex-cluster
        to: ex-tasks
        label: Executor の実行資源を割り当て
    layout2d:
      tiers:
