name: Spark：メモリ・spill とファイル書き込み
description: Executor の execution / storage メモリ、spill、partition と出力ファイルの関係を追う。
reference:
  objectives:
    - Executor の execution / storage メモリ、spill、partition と出力ファイルの関係を追う。
    - Spark の unified memory の概念と、JVM heap、off-heap、Python / native メモリ、コンテナー overhead を分けて考える。
    - 小ファイルは単に partition 数だけで決まらない。
  sources:
    - title: Spark Tuning
      url: https://spark.apache.org/docs/4.3.0/tuning.html
    - title: Spark Configuration
      url: https://spark.apache.org/docs/4.3.0/configuration.html
    - title: Iceberg Spark Writes
      url: https://iceberg.apache.org/docs/latest/spark-writes/
sources:
  - docs/reference-spark-memory-spill-write.md
evidence:
  - type: doc
    ref: docs/reference-spark-memory-spill-write.md#§1
tiers:
  - id: flow
    label: 処理の流れ
    z: 0
    size:
      - 21
      - 8
nodes:
  input:
    label: 読み取り partition
    kind: db
    tier: flow
    x: 1
    'y': 1.5
    description: 入力サイズとファイルの配置から task が入力を読む。
    evidence:
      - type: doc
        ref: docs/reference-spark-memory-spill-write.md#§2
  task:
    label: Executor の処理 task
    kind: worker
    tier: flow
    x: 6
    'y': 1.5
    description: sort、join、集約のため execution メモリを使う。
    evidence:
      - type: doc
        ref: docs/reference-spark-memory-spill-write.md#§2
  memory:
    label: Execution / Storage 領域
    kind: db
    tier: flow
    x: 11
    'y': 1.5
    description: 計算用と cache 用のメモリを管理する。cache の保護領域もある。
    evidence:
      - type: doc
        ref: docs/reference-spark-memory-spill-write.md#§2
  spill:
    label: ローカルディスクへの spill
    kind: file
    tier: flow
    x: 16
    'y': 1.5
    description: 必要に応じ中間データを退避し、後で読み戻す。
    evidence:
      - type: doc
        ref: docs/reference-spark-memory-spill-write.md#§2
  exchange:
    label: 書き込み前の分配
    kind: service
    tier: flow
    x: 1
    'y': 5
    description: partition と分布に応じ shuffle や sort を行う。
    evidence:
      - type: doc
        ref: docs/reference-spark-memory-spill-write.md#§2
  writer:
    label: 並列 writer
    kind: worker
    tier: flow
    x: 6
    'y': 5
    description: task が出力ファイルを書き、ファイル数やサイズは分配や表 partition に影響される。
    evidence:
      - type: doc
        ref: docs/reference-spark-memory-spill-write.md#§2
  files:
    label: 出力ファイルと表
    kind: db
    tier: flow
    x: 11
    'y': 5
    description: Iceberg 等では commit とファイルの後処理を管理する。
    evidence:
      - type: doc
        ref: docs/reference-spark-memory-spill-write.md#§2
links:
  - id: read
    from: input
    to: task
    label: 入力を読む
    evidence:
      - type: doc
        ref: docs/reference-spark-memory-spill-write.md#§3
  - id: allocate
    from: task
    to: memory
    label: 作業メモリを利用
    evidence:
      - type: doc
        ref: docs/reference-spark-memory-spill-write.md#§3
  - id: spill
    from: memory
    to: spill
    label: 圧力時に退避
    evidence:
      - type: doc
        ref: docs/reference-spark-memory-spill-write.md#§3
  - id: restore
    from: spill
    to: task
    label: 中間データを読み戻す
    evidence:
      - type: doc
        ref: docs/reference-spark-memory-spill-write.md#§3
  - id: partition
    from: task
    to: exchange
    label: 書き込み先に分配
    evidence:
      - type: doc
        ref: docs/reference-spark-memory-spill-write.md#§3
  - id: write
    from: exchange
    to: writer
    label: task がファイルを作成
    evidence:
      - type: doc
        ref: docs/reference-spark-memory-spill-write.md#§3
  - id: persist
    from: writer
    to: files
    label: 出力ファイルを保存
    evidence:
      - type: doc
        ref: docs/reference-spark-memory-spill-write.md#§3
scenarios:
  - id: flow
    label: 処理の流れ
    steps:
      - links:
          - read
        note: 入力を読む。
      - links:
          - allocate
        note: 作業メモリを利用。
      - links:
          - spill
        note: 圧力時に退避。
      - links:
          - restore
        note: 中間データを読み戻す。
      - links:
          - partition
        note: 書き込み先に分配。
      - links:
          - write
        note: task がファイルを作成。
      - links:
          - persist
        note: 出力ファイルを保存。
