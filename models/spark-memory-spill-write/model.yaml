blocks:
  - id: memory
    title: メモリと spill（概念例）
    note: JVM 内のメモリとディスク退避を区別する。実際のサイズは設定と workload に依存する。
    lanes:
      - id: memory
        label: Executor メモリ
        node: memory
      - id: disk
        label: ローカルディスク
        node: spill
      - id: out
        label: 出力
        node: files
    items:
      memory:
        - id: exec
          label: execution
          k: 0
        - id: cache
          label: storage / cache
          k: 1
      disk:
        - id: spill
          label: spill
          k: 2
          note: sort や集約の中間データの退避例。
      out:
        - id: file
          label: データファイル
          k: 3
          note: spill と最終出力は別のファイル。
