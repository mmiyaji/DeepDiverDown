name: dbt MetricFlow とセマンティック層
description: 売上指標の定義から SQL 生成、分析基盤での実行、BI への結果返却を追う。
reference:
  objectives:
    - 指標・次元・結合の定義と SQL 生成を区別する。
    - ローカル MetricFlow とサービス層・API の提供条件を区別する。
  sources:
    - title: dbt Semantic Layer architecture
      url: https://docs.getdbt.com/docs/use-dbt-semantic-layer/sl-architecture
    - title: About MetricFlow
      url: https://docs.getdbt.com/docs/build/about-metricflow
sources:
  - docs/reference-dbt-metricflow.md
evidence:
  - type: doc
    ref: docs/reference-dbt-metricflow.md#§1
  - type: doc
    ref: docs/reference-dbt-metricflow.md#§3
tiers:
  - id: access
    label: 分析と問い合わせ
    z: 2
    size:
      - 12
      - 3
  - id: definition
    label: 指標の定義と計画
    z: 1
    size:
      - 12
      - 3
  - id: data
    label: SQL の実行
    z: 0
    size:
      - 12
      - 3
nodes:
  user:
    label: 利用者・分析アプリ
    kind: actor
    tier: access
    x: 0
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-dbt-metricflow.md#§2
  request:
    label: 指標の問い合わせ
    kind: service
    tier: access
    x: 4
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-dbt-metricflow.md#§2
  model:
    label: 指標と次元の定義
    kind: file
    tier: definition
    x: 0
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-dbt-metricflow.md#§2
  planner:
    label: 指標の計画と SQL 生成
    kind: service
    tier: definition
    x: 4
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-dbt-metricflow.md#§2
  gateway:
    label: 問合せの実行窓口
    kind: service
    tier: data
    x: 0
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-dbt-metricflow.md#§2
  warehouse:
    label: 分析エンジンと表
    kind: db
    tier: data
    x: 4
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-dbt-metricflow.md#§2
  result:
    label: 指標の結果
    kind: file
    tier: data
    x: 8
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-dbt-metricflow.md#§2
links:
  - id: ask
    from: user
    to: request
    label: 売上を期間別に要求
    evidence:
      - type: doc
        ref: docs/reference-dbt-metricflow.md#§2
  - id: define
    from: model
    to: planner
    label: 指標と結合の定義を参照
    evidence:
      - type: doc
        ref: docs/reference-dbt-metricflow.md#§2
  - id: plan
    from: request
    to: planner
    label: 指標の計画を要求
    evidence:
      - type: doc
        ref: docs/reference-dbt-metricflow.md#§2
  - id: execute
    from: planner
    to: gateway
    label: 生成 SQL を渡す
    evidence:
      - type: doc
        ref: docs/reference-dbt-metricflow.md#§2
  - id: query
    from: gateway
    to: warehouse
    label: SQL を実行
    evidence:
      - type: doc
        ref: docs/reference-dbt-metricflow.md#§2
  - id: output
    from: warehouse
    to: result
    label: 集計値を返す
    evidence:
      - type: doc
        ref: docs/reference-dbt-metricflow.md#§2
  - id: reply
    from: result
    to: user
    label: 結果を表示
    evidence:
      - type: doc
        ref: docs/reference-dbt-metricflow.md#§2
scenarios:
  - id: metric
    label: 期間別売上を集計
    evidence:
      - type: doc
        ref: docs/reference-dbt-metricflow.md#§2
    steps:
      - links:
          - ask
          - plan
          - define
        note: 指標と対象期間を受け、定義を参照する。
      - links:
          - execute
          - query
        note: 生成 SQL を分析エンジンで実行する。
      - links:
          - output
          - reply
        note: 集計値を利用者に返す。
implementations:
  - id: dbt
    label: dbt Semantic Layer の構成例
    description: dbt Semantic Layer のサービスと MetricFlow を使う例。サービス層と API の利用条件を確認する。
    sources:
      - title: dbt Semantic Layer architecture
        url: https://docs.getdbt.com/docs/use-dbt-semantic-layer/sl-architecture
      - title: About MetricFlow
        url: https://docs.getdbt.com/docs/build/about-metricflow
    tiers:
      - id: access
        label: 分析と問い合わせ
        z: 2
        size:
          - 12
          - 3
      - id: definition
        label: 指標の定義と計画
        z: 1
        size:
          - 12
          - 3
      - id: data
        label: SQL の実行
        z: 0
        size:
          - 12
          - 3
    nodes:
      example-user:
        label: BI・分析アプリ
        kind: actor
        tier: access
        x: 0
        'y': 1
        evidence:
          - type: doc
            ref: docs/reference-dbt-metricflow.md#§3
        realizes:
          - user
      example-request:
        label: Semantic Layer API
        kind: service
        tier: access
        x: 4
        'y': 1
        evidence:
          - type: doc
            ref: docs/reference-dbt-metricflow.md#§3
        realizes:
          - request
      example-model:
        label: dbt 指標・セマンティックモデル
        kind: file
        tier: definition
        x: 0
        'y': 1
        evidence:
          - type: doc
            ref: docs/reference-dbt-metricflow.md#§3
        realizes:
          - model
      example-planner:
        label: MetricFlow
        kind: service
        tier: definition
        x: 4
        'y': 1
        evidence:
          - type: doc
            ref: docs/reference-dbt-metricflow.md#§3
        realizes:
          - planner
      example-gateway:
        label: dbt Gateway
        kind: service
        tier: data
        x: 0
        'y': 1
        evidence:
          - type: doc
            ref: docs/reference-dbt-metricflow.md#§3
        realizes:
          - gateway
      example-warehouse:
        label: データプラットフォーム
        kind: db
        tier: data
        x: 4
        'y': 1
        evidence:
          - type: doc
            ref: docs/reference-dbt-metricflow.md#§3
        realizes:
          - warehouse
      example-result:
        label: 期間別の売上集計
        kind: file
        tier: data
        x: 8
        'y': 1
        evidence:
          - type: doc
            ref: docs/reference-dbt-metricflow.md#§3
        realizes:
          - result
      example-auth:
        label: 利用者・接続の認可設定
        kind: service
        tier: access
        x: 8
        'y': 1
        evidence:
          - type: doc
            ref: docs/reference-dbt-metricflow.md#§3
    links:
      - id: auth-ex
        from: example-auth
        to: example-request
        label: 接続を認可
