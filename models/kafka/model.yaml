name: Apache Kafka の基本アーキテクチャ
description: 追記型の分散ログが、Producer の書き込みを受け、Broker 間で複製し、Consumer Group に読まれるまでを追うリファレンスです。
reference:
  objectives:
    - Topic、パーティション、Broker、Controller の役割を区別する。
    - 書き込み、複製、ACK、読み出し、オフセットの保存を順に追う。
    - Broker 障害でパーティションのリーダーが切り替わる流れを理解する。
  sources:
    - {"title": "Apache Kafka Design","url": "https://kafka.apache.org/44/design/design/"}
    - {"title": "Apache Kafka Protocol","url": "https://kafka.apache.org/44/design/protocol/"}
    - {"title": "KRaft","url": "https://kafka.apache.org/44/operations/kraft/"}
    - {"title": "Producer Configs","url": "https://kafka.apache.org/44/configuration/producer-configs/"}
sources: [docs/reference-kafka.md]
evidence: [{"type": "doc","ref": "docs/reference-kafka.md#§1"}]
tiers:
  - {"id": "producer","label": "書き込み側","kind": "origin","z": 0,"origin": [-5,0],"size": [2.5,9]}
  - {"id": "brokers","label": "Kafka クラスタ","z": 0,"size": [8,9]}
  - {"id": "consumers","label": "読み出し側 · 同じ Consumer Group","kind": "origin","z": 0,"origin": [10,0],"size": [3,9]}
  - {"id": "metadata","label": "メタデータ管理","z": 1,"origin": [2,0],"size": [4,2]}
nodes:
  producer:
    {"label": "Producer","kind": "client","tier": "producer","x": 0.5,"y": 2,"description": "Topic にイベントを書き込む。対象パーティションのリーダーに接続する。","evidence": [{"type": "doc","ref": "docs/reference-kafka.md#§2"}]}
  controller:
    {"label": "KRaft Controller","kind": "service","tier": "metadata","x": 1.5,"y": 0.5,"description": "メタデータ管理とパーティションのリーダー選出。図は Controller の役割を1点で表す。","evidence": [{"type": "doc","ref": "docs/reference-kafka.md#§1"},{"type": "doc","ref": "docs/reference-kafka.md#§6"}]}
  broker-1:
    {"label": "Broker 1 · P0 リーダー","kind": "db","tier": "brokers","x": 3,"y": 1.5,"description": "開始時に P0 のリーダーを担当し、他のパーティションのレプリカも保持する。","evidence": [{"type": "doc","ref": "docs/reference-kafka.md#§1"},{"type": "doc","ref": "docs/reference-kafka.md#§3"}]}
  broker-2:
    {"label": "Broker 2 · P1 リーダー","kind": "db","tier": "brokers","x": 3,"y": 4.5,"description": "開始時に P1 のリーダーを担当する。図では Group Coordinator も担当し、障害例で P0 のリーダーを引き継ぐ。","evidence": [{"type": "doc","ref": "docs/reference-kafka.md#§1"},{"type": "doc","ref": "docs/reference-kafka.md#§5"},{"type": "doc","ref": "docs/reference-kafka.md#§6"}]}
  broker-3:
    {"label": "Broker 3 · P2 リーダー","kind": "db","tier": "brokers","x": 3,"y": 7.5,"description": "開始時に P2 のリーダーを担当する。図の障害例では稼働を継続し、P0 のフォロワーとして追随する。","evidence": [{"type": "doc","ref": "docs/reference-kafka.md#§1"},{"type": "doc","ref": "docs/reference-kafka.md#§3"},{"type": "doc","ref": "docs/reference-kafka.md#§6"}]}
  consumer-1:
    {"label": "Consumer 1","kind": "client","tier": "consumers","x": 0.5,"y": 2.5,"description": "同じ Consumer Group の一員。例では P0 と P1 を担当する。","evidence": [{"type": "doc","ref": "docs/reference-kafka.md#§4"},{"type": "doc","ref": "docs/reference-kafka.md#§5"}]}
  consumer-2:
    {"label": "Consumer 2","kind": "client","tier": "consumers","x": 0.5,"y": 7.5,"description": "同じ Consumer Group の一員。例では P2 を担当する。","evidence": [{"type": "doc","ref": "docs/reference-kafka.md#§4"}]}
links:
  - {"id": "produce","from": "producer","to": "broker-1","label": "P0 に追記","evidence": [{"type": "doc","ref": "docs/reference-kafka.md#§2"}]}
  - {"id": "replicate-2","from": "broker-1","to": "broker-2","label": "P0 の複製データ","evidence": [{"type": "doc","ref": "docs/reference-kafka.md#§3"}]}
  - {"id": "replicate-3","from": "broker-1","to": "broker-3","label": "P0 の複製データ","evidence": [{"type": "doc","ref": "docs/reference-kafka.md#§3"}]}
  - {"id": "ack","from": "broker-1","to": "producer","label": "書き込み成功応答","evidence": [{"type": "doc","ref": "docs/reference-kafka.md#§3"}]}
  - {"id": "read-p0","from": "broker-1","to": "consumer-1","label": "P0 の取得結果","evidence": [{"type": "doc","ref": "docs/reference-kafka.md#§4"}]}
  - {"id": "read-p1","from": "broker-2","to": "consumer-1","label": "P1 の取得結果","evidence": [{"type": "doc","ref": "docs/reference-kafka.md#§4"}]}
  - {"id": "read-p2","from": "broker-3","to": "consumer-2","label": "P2 の取得結果","evidence": [{"type": "doc","ref": "docs/reference-kafka.md#§4"}]}
  - {"id": "commit","from": "consumer-1","to": "broker-2","label": "オフセットをコミット","evidence": [{"type": "doc","ref": "docs/reference-kafka.md#§5"}]}
  - {"id": "elect","from": "controller","to": "broker-2","label": "Broker 2 を P0 リーダーに選出","evidence": [{"type": "doc","ref": "docs/reference-kafka.md#§6"}]}
  - {"id": "retry","from": "producer","to": "broker-2","label": "新リーダーに P0 を再送","evidence": [{"type": "doc","ref": "docs/reference-kafka.md#§6"}]}
  - {"id": "replicate-after","from": "broker-2","to": "broker-3","label": "新リーダーから P0 を複製","evidence": [{"type": "doc","ref": "docs/reference-kafka.md#§6"}]}
scenarios:
  - id: kafka-normal
    label: 書き込みから消費まで
    evidence: [{"type": "doc","ref": "docs/reference-kafka.md#§2"},{"type": "doc","ref": "docs/reference-kafka.md#§3"},{"type": "doc","ref": "docs/reference-kafka.md#§4"},{"type": "doc","ref": "docs/reference-kafka.md#§5"}]
    steps:
      - {"links": ["produce"],"note": "追記。Producer は P0 のリーダーをメタデータから調べ、Broker 1 にイベントを送る。"}
      - {"links": ["replicate-2","replicate-3"],"note": "複製。フォロワーの Broker 2 と 3 が、リーダーから P0 の新しいログを取り込む。"}
      - {"links": ["ack"],"note": "応答。acks=all の例では、最小 ISR 数を満たし、ISR が追記を確認すると成功応答が返る。"}
      - {"links": ["read-p0","read-p1","read-p2"],"note": "消費。Consumer 1 が P0 と P1、Consumer 2 が P2 を取りに行く。図は取得したデータの流れ。"}
      - {"links": ["commit"],"note": "進捗を保存。Consumer 1 が Group Coordinator に次に読む位置をコミットする。"}
      - {"links": ["read-p0"],"note": "再読込。ログに残っている範囲なら、Consumer は位置を戻してイベントを読み直せる。"}
  - id: kafka-failover
    label: Broker 障害とリーダー切り替え
    evidence: [{"type": "doc","ref": "docs/reference-kafka.md#§6"}]
    steps:
      - {"links": ["produce"],"note": "障害。P0 のリーダーだった Broker 1 が停止する。図は停止直前の書き込み経路を示す。"}
      - {"links": ["elect"],"note": "選出。KRaft Controller が ISR に残る Broker 2 を P0 の新リーダーに選出する。"}
      - {"links": ["retry","replicate-after"],"note": "再開。Producer はメタデータを更新して Broker 2 に再送し、Broker 3 が新リーダーからログを取得する。"}
