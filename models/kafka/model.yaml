        kraft-broker-hosts: {tier: diagram, x: 7, y: 5}
        kraft-b1: {tier: diagram, x: 13, y: 5}
        kraft-b2: {tier: diagram, x: 19, y: 5}
        kraft-b3: {tier: diagram, x: 19, y: 9}
      groups:
        - {kind: datacenter, provider: onprem, label: 利用者管理の Kafka 実行環境, tier: [diagram], nodes: [kraft-topic, kraft-controller-hosts, kraft-controllers, kraft-broker-hosts, kraft-b1, kraft-b2, kraft-b3]}
        - {kind: cluster, label: 分離 KRaft コントローラー群, tier: [diagram], nodes: [kraft-controller-hosts, kraft-controllers]}
        - {kind: cluster, label: Broker ホスト群, tier: [diagram], nodes: [kraft-broker-hosts, kraft-b1, kraft-b2, kraft-b3]}
    layout3d:
      tiers:
        - {id: diagram, label: 自前 Kafka 構成, z: 0, size: [25, 13]}
      nodes:
        kraft-producer: {tier: diagram, x: 1, y: 1}
        kraft-c1: {tier: diagram, x: 1, y: 5}
        kraft-c2: {tier: diagram, x: 1, y: 9}
        kraft-topic: {tier: diagram, x: 7, y: 1}
        kraft-controller-hosts: {tier: diagram, x: 13, y: 1}
        kraft-controllers: {tier: diagram, x: 19, y: 1}
        kraft-broker-hosts: {tier: diagram, x: 7, y: 5}
        kraft-b1: {tier: diagram, x: 13, y: 5}
        kraft-b2: {tier: diagram, x: 19, y: 5}
        kraft-b3: {tier: diagram, x: 19, y: 9}
      groups:
        - {kind: datacenter, provider: onprem, label: 利用者管理の Kafka 実行環境, tier: [diagram], nodes: [kraft-topic, kraft-controller-hosts, kraft-controllers, kraft-broker-hosts, kraft-b1, kraft-b2, kraft-b3]}
        - {kind: cluster, label: 分離 KRaft コントローラー群, tier: [diagram], nodes: [kraft-controller-hosts, kraft-controllers]}
        - {kind: cluster, label: Broker ホスト群, tier: [diagram], nodes: [kraft-broker-hosts, kraft-b1, kraft-b2, kraft-b3]}
  - id: aws-msk-ecs
    label: AWS（Amazon MSK と ECS on Fargate）
    description: MSK Provisioned の Standard ブローカーを使い、送信・購読アプリを ECS サービスとして Fargate で実行する例。
    sources:
      - {title: MSK Provisioned クラスターの作成, url: https://docs.aws.amazon.com/msk/latest/developerguide/create-cluster-console.html}
      - {title: Amazon MSK と KRaft, url: https://docs.aws.amazon.com/msk/latest/developerguide/metadata-management.html}
      - {title: Amazon MSK の IAM アクセス制御, url: https://docs.aws.amazon.com/msk/latest/developerguide/iam-access-control.html}
      - {title: Amazon ECS のサービス定義, url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service_definition_parameters.html}
      - {title: Amazon ECS の IAM ロール, url: https://docs.aws.amazon.com/AmazonECS/latest/bestpracticesguide/security-iam-roles.html}
    tiers:
      - {id: runtime, label: イベントの送信・複製・購読, z: 0, size: [19, 9]}
      - {id: operations, label: メタデータ管理とアプリの配置, z: 1, size: [19, 3]}
    groups:
      - {kind: cloud, label: AWS アカウント, provider: aws, tier: [runtime, operations]}
      - {kind: vpc, label: アプリとブローカーの VPC, tier: runtime, nodes: [aws-producer, aws-b1, aws-b2, aws-b3, aws-consumer-1, aws-consumer-2]}
      - {kind: cluster, label: MSK Provisioned（論理的な所属）, tier: [runtime, operations], nodes: [aws-b1, aws-b2, aws-b3, aws-controller]}
    nodes:
      aws-producer: {label: Fargate タスク（Producer）, svc: fargate, kind: worker, tier: runtime, x: 1, y: 1.6, realizes: [producer], description: Java Producer が IAM 認証でブローカーに接続し、注文イベントを送る。, management: {type: shared, scope: "AWS が Fargate 基盤を運用し、利用者がアプリ、タスク設定と権限を管理する。"}, evidence: [{type: doc, ref: docs/reference-kafka.md#§10}]}
      aws-b1: {label: MSK Standard ブローカー 1, svc: msk, kind: db, tier: runtime, x: 7, y: 1.6, realizes: [broker-1], description: 例では P0 のリーダー。P0 への追記に応答する。, management: {type: shared, scope: "AWS が Kafka 基盤を運用し、利用者がトピック、アクセス権と設定を管理する。"}, evidence: [{type: doc, ref: docs/reference-kafka.md#§10}]}
      aws-b2: {label: MSK Standard ブローカー 2, svc: msk, kind: db, tier: runtime, x: 7, y: 4.5, realizes: [broker-2], description: 例では P1 のリーダーで、P0 リーダーの切り替え先。, management: {type: shared, scope: "AWS が Kafka 基盤を運用し、利用者がトピック、アクセス権と設定を管理する。"}, evidence: [{type: doc, ref: docs/reference-kafka.md#§10}]}
      aws-b3: {label: MSK Standard ブローカー 3, svc: msk, kind: db, tier: runtime, x: 7, y: 7.4, realizes: [broker-3], description: 例では P2 のリーダー。P0 の複製も保持する。, management: {type: shared, scope: "AWS が Kafka 基盤を運用し、利用者がトピック、アクセス権と設定を管理する。"}, evidence: [{type: doc, ref: docs/reference-kafka.md#§10}]}
      aws-consumer-1: {label: Fargate タスク（Consumer 1）, svc: fargate, kind: worker, tier: runtime, x: 14, y: 2.6, realizes: [consumer-1], description: 同じ購読サービスのタスクとして起動し、割り当てられたパーティションを読む。, management: {type: shared, scope: "AWS が Fargate 基盤を運用し、利用者がアプリ、タスク設定と権限を管理する。"}, evidence: [{type: doc, ref: docs/reference-kafka.md#§10}]}
      aws-consumer-2: {label: Fargate タスク（Consumer 2）, svc: fargate, kind: worker, tier: runtime, x: 14, y: 7.4, realizes: [consumer-2], description: Consumer 1 と同じ group.id で、別のパーティションを担当する。, management: {type: shared, scope: "AWS が Fargate 基盤を運用し、利用者がアプリ、タスク設定と権限を管理する。"}, evidence: [{type: doc, ref: docs/reference-kafka.md#§10}]}
      aws-controller: {label: MSK 管理の KRaft コントローラー群, svc: msk, kind: service, tier: operations, x: 7, y: 1.5, realizes: [controller], description: クラスターのメタデータを管理する。配置は模式図。, management: {type: shared, scope: "AWS が Kafka 基盤を運用し、利用者がトピック、アクセス権と設定を管理する。"}, evidence: [{type: doc, ref: docs/reference-kafka.md#§10}]}
      aws-ecs: {label: Amazon ECS（送信・購読サービス）, svc: ecs, kind: service, tier: operations, x: 12, y: 1.5, description: 別々のサービスで Producer と Consumer の Fargate タスクを起動し、指定数を維持する。, management: {type: shared, scope: "AWS がサービス基盤を運用し、利用者が設定と保存内容を管理する。"}, evidence: [{type: doc, ref: docs/reference-kafka.md#§10}]}
      aws-ecr: {label: Amazon ECR（アプリイメージ）, svc: ecr, kind: db, tier: operations, x: 17, y: 1.5, description: Producer と Consumer のコンテナイメージを保持する。Fargate がタスク起動時に取得する。, management: {type: shared, scope: "AWS がサービス基盤を運用し、利用者が設定と保存内容を管理する。"}, evidence: [{type: doc, ref: docs/reference-kafka.md#§10}]}
