name: Apache Kafka の基本アーキテクチャ
description: 追記型の分散ログが、Producer の書き込みを受け、Broker 間で複製し、Consumer Group に読まれるまでの主要な部品を示す。
reference:
  objectives:
    - Topic、パーティション、Broker、KRaft Controller の役割を区別する。
    - 書き込み、複製、読み出し、offset の保存、ログの保存先を順に追う。
    - Broker 障害でパーティションのリーダーが切り替わる流れを理解する。
  sources:
    - title: Apache Kafka Design
      url: https://kafka.apache.org/44/design/design/
    - title: Apache Kafka Protocol
      url: https://kafka.apache.org/44/design/protocol/
    - title: KRaft
      url: https://kafka.apache.org/44/operations/kraft/
    - title: Producer Configs
      url: https://kafka.apache.org/44/configuration/producer-configs/
    - title: Consumer Configs
      url: https://kafka.apache.org/44/configuration/consumer-configs/
sources:
  - docs/reference-kafka.md
evidence:
  - type: doc
    ref: docs/reference-kafka.md#§1
tiers:
  - id: producer
    label: 書き込み側
    kind: origin
    z: 0
    origin:
      - -5
      - 0
    size:
      - 2.5
      - 9
  - id: brokers
    label: Kafka クラスタ
    z: 0
    size:
      - 8
      - 9
  - id: consumers
    label: 読み出し側 · 同じ Consumer Group
    kind: origin
    z: 0
    origin:
      - 10
      - 0
    size:
      - 3
      - 9
  - id: metadata
    label: メタデータ管理
    z: 1
    origin:
      - 2
      - 0
    size:
      - 4
      - 2
nodes:
  producer:
    label: イベント送信元
    kind: client
    tier: producer
    x: 0.5
    'y': 2
    description: Topic にイベントを書き込む。対象パーティションのリーダーに接続する。
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§3
  controller:
    label: クラスターのメタデータ管理
    kind: service
    tier: metadata
    x: 1.5
    'y': 0.5
    description: Topic、パーティションの割り当て、リーダーと ISR のメタデータを Raft で複製して管理する。重要な環境では専用ノードで 3 台か 5 台。
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§5
      - type: doc
        ref: docs/reference-kafka.md#§7
    replicas: 3
  broker-1:
    label: ログノード 1 · P0 リーダー
    kind: db
    tier: brokers
    x: 3
    'y': 1.5
    description: 開始時に P0 のリーダーを担当し、他のパーティションのレプリカも保持する。
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§2
      - type: doc
        ref: docs/reference-kafka.md#§7
  broker-2:
    label: ログノード 2 · P1 リーダー
    kind: db
    tier: brokers
    x: 3
    'y': 4.5
    description: 開始時に P1 のリーダーを担当する。図では Group Coordinator も担当し、障害例で P0 のリーダーを引き継ぐ。
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§2
      - type: doc
        ref: docs/reference-kafka.md#§4
      - type: doc
        ref: docs/reference-kafka.md#§7
  broker-3:
    label: ログノード 3 · P2 リーダー
    kind: db
    tier: brokers
    x: 3
    'y': 7.5
    description: 開始時に P2 のリーダーを担当する。図の障害例では稼働を継続し、P0 のフォロワーとして追随する。
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§2
      - type: doc
        ref: docs/reference-kafka.md#§7
  storage:
    label: 各 Broker のログ保存領域
    kind: db
    tier: brokers
    x: 6.5
    'y': 4.5
    replicas: 3
    description: パーティションのログをセグメントファイルとして保持する（log.dirs）。保持設定に従って古いセグメントから消える。
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§6
  consumer-1:
    label: 購読プロセス 1
    kind: client
    tier: consumers
    x: 0.5
    'y': 2.5
    description: 同じ Consumer Group の一員。例では P0 と P1 を担当する。
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§4
  consumer-2:
    label: 購読プロセス 2
    kind: client
    tier: consumers
    x: 0.5
    'y': 7.5
    description: 同じ Consumer Group の一員。例では P2 を担当する。
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§4
links:
  - id: produce
    from: producer
    to: broker-1
    label: P0 に追記
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§3
  - id: append
    from: broker-1
    to: storage
    label: セグメントに保存
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§6
  - id: replicate-2
    from: broker-1
    to: broker-2
    label: P0 の複製データ
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§2
      - type: doc
        ref: docs/reference-kafka.md#§7
  - id: replicate-3
    from: broker-1
    to: broker-3
    label: P0 の複製データ
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§2
      - type: doc
        ref: docs/reference-kafka.md#§7
  - id: ack
    from: broker-1
    to: producer
    label: 書き込み成功応答
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§3
  - id: read-p0
    from: broker-1
    to: consumer-1
    label: P0 の取得結果
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§4
  - id: read-p1
    from: broker-2
    to: consumer-1
    label: P1 の取得結果
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§4
  - id: read-p2
    from: broker-3
    to: consumer-2
    label: P2 の取得結果
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§4
  - id: commit
    from: consumer-1
    to: broker-2
    label: offset をコミット
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§4
  - id: elect
    from: controller
    to: broker-2
    label: Broker 2 を P0 リーダーに選出
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§5
      - type: doc
        ref: docs/reference-kafka.md#§7
  - id: retry
    from: producer
    to: broker-2
    label: 新リーダーに P0 を再送
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§7
  - id: replicate-after
    from: broker-2
    to: broker-3
    label: 新リーダーから P0 を複製
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§7
scenarios:
  - id: kafka-normal
    label: 書き込みから消費まで
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§3
      - type: doc
        ref: docs/reference-kafka.md#§4
      - type: doc
        ref: docs/reference-kafka.md#§6
    steps:
      - links:
          - produce
          - append
        note: 追記。Producer は P0 のリーダーをメタデータから調べ、Broker 1 に送る。Broker はログ保存領域のセグメントに追記する。
      - links:
          - replicate-2
          - replicate-3
        note: 複製。フォロワーの Broker 2 と 3 が、リーダーから P0 の新しいログを取り込む。
      - links:
          - ack
        note: 応答。acks=all の例では、最小 ISR 数を満たし、ISR が追記を確認すると成功応答が返る。
      - links:
          - read-p0
          - read-p1
          - read-p2
        note: 消費。Consumer 1 が P0 と P1、Consumer 2 が P2 を取りに行く。図は取得したデータの流れ。
      - links:
          - commit
        note: 進捗を保存。Consumer 1 が Group Coordinator に次に読む位置をコミットする。
  - id: kafka-failover
    label: Broker 障害とリーダー切り替え
    evidence:
      - type: doc
        ref: docs/reference-kafka.md#§7
    steps:
      - links:
          - produce
        note: 障害。P0 のリーダーだった Broker 1 が停止する。図は停止直前の書き込み経路を示す。
      - links:
          - elect
        note: 選出。KRaft Controller が ISR に残る Broker 2 を P0 の新リーダーに選出する。
      - links:
          - retry
          - replicate-after
        note: 再開。Producer はメタデータを更新して Broker 2 に再送し、Broker 3 が新リーダーからログを取得する。
unknowns:
  - id: UNK-01
    text: MSK のレプリカの AZ 間配置の既定とストレージの種類は、確認した資料の範囲では扱っていない。
    refs:
      - aws-b1
  - id: UNK-02
    text: MSK 管理の Controller の台数と配置は不明。図の Controller の台数は KRaft の資料の推奨（3 または 5）に基づく例。
    refs:
      - controller
gates:
  maxDrift: 0
  maxHigh: 3
implementations:
  - id: kraft
    label: 分離 KRaft クォーラムの Kafka
    description: Kafka のデータブローカー群と KRaft コントローラー群を別プロセスにする例。図の P0・P1・P2 は注文トピックの分割で、トピック設定とコンシューマーグループは別に管理する。
    sources:
      - title: Apache Kafka Design
        url: https://kafka.apache.org/44/design/design/
      - title: Apache Kafka Protocol
        url: https://kafka.apache.org/44/design/protocol/
      - title: KRaft
        url: https://kafka.apache.org/44/operations/kraft/
      - title: Producer Configs
        url: https://kafka.apache.org/44/configuration/producer-configs/
    tiers:
      - id: processing
        label: データの処理と保存
        z: 0
        size:
          - 16
          - 5
      - id: setup
        label: 実行に必要な設定・成果物
        z: 1
        size:
          - 14
          - 3
    nodes:
      kraft-broker-hosts:
        label: 利用者管理 Linux ブローカーホスト群
        kind: host
        tier: setup
        x: 5
        'y': 1.5
        description: 3 台の Linux ホスト上で各 Kafka Broker プロセスを運用しログ用ディスクを管理する。
        evidence:
          - type: doc
            ref: docs/reference-kafka.md#§8
      kraft-controller-hosts:
        label: 利用者管理 Linux コントローラーホスト群
        kind: host
        tier: setup
        x: 10
        'y': 1.5
        description: ブローカーと分離したホストで KRaft コントローラープロセスを運用する。
        evidence:
          - type: doc
            ref: docs/reference-kafka.md#§8
      kraft-producer:
        label: KafkaProducer
        kind: client
        tier: processing
        x: 1
        'y': 1.15
        realizes:
          - producer
        description: 注文キーに基づく対象パーティションへレコードを送る。
        evidence:
          - type: doc
            ref: docs/reference-kafka.md#§8
      kraft-controllers:
        label: KRaft コントローラー群
        kind: service
        tier: processing
        x: 1
        'y': 3.65
        realizes:
          - controller
        description: 専用プロセスでメタデータログのクォーラムを構成する。
        evidence:
          - type: doc
            ref: docs/reference-kafka.md#§8
      kraft-b1:
        svc: oss:kafka
        label: Kafka Broker 1
        kind: db
        tier: processing
        x: 5
        'y': 1.15
        realizes:
          - broker-1
        description: P0 の最初のリーダーを担当する。
        evidence:
          - type: doc
            ref: docs/reference-kafka.md#§8
      kraft-b2:
        svc: oss:kafka
        label: Kafka Broker 2
        kind: db
        tier: processing
        x: 5
        'y': 3.65
        realizes:
          - broker-2
        description: P1 のリーダーと P0 のフォロワーとして開始する。
        evidence:
          - type: doc
            ref: docs/reference-kafka.md#§8
      kraft-b3:
        svc: oss:kafka
        label: Kafka Broker 3
        kind: db
        tier: processing
        x: 9
        'y': 1.15
        realizes:
          - broker-3
        description: P2 のリーダーと P0 のフォロワーとして開始する。
        evidence:
          - type: doc
            ref: docs/reference-kafka.md#§8
      kraft-c1:
        label: KafkaConsumer 1
        kind: client
        tier: processing
        x: 9
        'y': 3.65
        realizes:
          - consumer-1
        description: 同じ group.id でパーティションを分担する。
        evidence:
          - type: doc
            ref: docs/reference-kafka.md#§8
      kraft-c2:
        label: KafkaConsumer 2
        kind: client
        tier: processing
        x: 13
        'y': 1.15
        realizes:
          - consumer-2
        description: グループ内で割り当てられた分割を読む。
        evidence:
          - type: doc
            ref: docs/reference-kafka.md#§8
      kraft-topic:
        label: orders のトピック設定
        kind: file
        tier: setup
        x: 1
        'y': 1.5
        description: この例では 3 パーティション・複製係数 3 とし、書き込み時の確認は acks と min.insync.replicas の組み合わせで決まる。
        evidence:
          - type: doc
            ref: docs/reference-kafka.md#§8
      kraft-logdirs:
        label: Broker ホストのローカルディスク（log.dirs）
        kind: db
        tier: processing
        x: 9
        'y': 2.4
        realizes:
          - storage
        description: パーティションのログをセグメントファイルとして保存する。
        evidence:
          - type: doc
            ref: docs/reference-kafka.md#§8
