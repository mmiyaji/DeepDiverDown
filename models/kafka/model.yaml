implementations:
  - id: kraft
    label: "分離 KRaft クォーラムの Kafka"
    description: "Kafka のデータブローカー群と KRaft コントローラー群を別プロセスにする例。図の P0・P1・P2 は注文トピックの分割で、トピック設定とコンシューマーグループは別に管理する。"
    sources:
      - {title: Apache Kafka Design, url: https://kafka.apache.org/44/design/design/}
      - {title: Apache Kafka Protocol, url: https://kafka.apache.org/44/design/protocol/}
      - {title: KRaft, url: https://kafka.apache.org/44/operations/kraft/}
      - {title: Producer Configs, url: https://kafka.apache.org/44/configuration/producer-configs/}
    tiers:
      - {id: processing, label: データの処理と保存, z: 0, size: [16, 5]}
      - {id: setup, label: 実行に必要な設定・成果物, z: 1, size: [14, 3]}
    nodes:
      kraft-producer: {label: KafkaProducer, kind: client, tier: processing, x: 1, y: 1.15, realizes: [producer], description: 注文キーに基づく対象パーティションへレコードを送る。, evidence: [{type: doc, ref: docs/reference-kafka.md#§9}]}
      kraft-controllers: {label: KRaft コントローラー群, kind: service, tier: processing, x: 1, y: 3.65, realizes: [controller], description: 専用プロセスでメタデータログのクォーラムを構成する。, evidence: [{type: doc, ref: docs/reference-kafka.md#§9}]}
      kraft-b1: {label: Kafka Broker 1, kind: db, tier: processing, x: 5, y: 1.15, realizes: [broker-1], description: P0 の最初のリーダーを担当する。, evidence: [{type: doc, ref: docs/reference-kafka.md#§9}]}
      kraft-b2: {label: Kafka Broker 2, kind: db, tier: processing, x: 5, y: 3.65, realizes: [broker-2], description: P1 のリーダーと P0 のフォロワーとして開始する。, evidence: [{type: doc, ref: docs/reference-kafka.md#§9}]}
      kraft-b3: {label: Kafka Broker 3, kind: db, tier: processing, x: 9, y: 1.15, realizes: [broker-3], description: P2 のリーダーと P0 のフォロワーとして開始する。, evidence: [{type: doc, ref: docs/reference-kafka.md#§9}]}
      kraft-c1: {label: KafkaConsumer 1, kind: client, tier: processing, x: 9, y: 3.65, realizes: [consumer-1], description: 同じ group.id でパーティションを分担する。, evidence: [{type: doc, ref: docs/reference-kafka.md#§9}]}
      kraft-c2: {label: KafkaConsumer 2, kind: client, tier: processing, x: 13, y: 1.15, realizes: [consumer-2], description: グループ内で割り当てられた分割を読む。, evidence: [{type: doc, ref: docs/reference-kafka.md#§9}]}
      kraft-topic: {label: orders のトピック設定, kind: file, tier: setup, x: 1, y: 1.5, description: この例では 3 パーティション・複製係数 3 とし、書き込み時の確認は acks と min.insync.replicas の組み合わせで決まる。, evidence: [{type: doc, ref: docs/reference-kafka.md#§9}]}
    links:
      - {id: kraft-topic-connection, from: kraft-topic, to: kraft-controllers, label: トピック設定を管理}
