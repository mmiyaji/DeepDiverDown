name: Microsoft Fabric：Direct Lake と Power BI
description: Direct Lake のセマンティックモデルが、OneLake の Delta テーブルから必要な列だけをメモリに読み、更新はフレーミングで参照を替えることを追う。
parent:
  model: microsoft-fabric
  node: semantic
reference:
  objectives: [Import と Direct Lake で更新が何を複製するかを区別する。, Direct Lake on OneLake と on SQL の違い（DirectQuery へのフォールバック）を説明する。, 容量のガードレールが効く点を説明する。]
  sources: [{title: Microsoft Learn · Direct Lake overview, url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview}, {title: Microsoft Learn · OneLake, url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-overview}, {title: Microsoft Learn · SQL analytics endpoint, url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sql-analytics-endpoint}, {title: Microsoft Learn · Fabric licenses and capacity, url: https://learn.microsoft.com/en-us/fabric/enterprise/licenses}, {title: Microsoft Learn · How Direct Lake works, url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-how-it-works}]
sources:
  - docs/reference-fabric-direct-lake.md
evidence:
  - {type: doc, ref: docs/reference-fabric-direct-lake.md#§1}
  - {type: doc, ref: docs/reference-fabric-direct-lake.md#§2}
tiers:
  - {id: flow, label: Direct Lake の読み取り, z: 0, size: [22, 10]}
nodes:
  report: {label: Power BI レポート, kind: client, tier: flow, x: 0, 'y': 4, description: 視覚エフェクトの操作ごとに DAX クエリをセマンティックモデルへ送る。, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§2}]}
  model: {label: セマンティックモデル（Direct Lake テーブル）, kind: table, tier: flow, x: 4, 'y': 4, description: テーブルの格納モードが Direct Lake。指標とリレーションを定義する。, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§2}]}
  vertipaq: {label: VertiPaq エンジン, kind: worker, tier: flow, x: 8, 'y': 4, description: Direct Lake と Import の DAX クエリを処理する。DirectQuery は元のデータ源へクエリを渡す。, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§3}]}
  guard: {label: 容量のガードレール, kind: policy, tier: flow, x: 8, 'y': 0.5, description: SKU ごとに Parquet ファイル数、行グループ数、行数、メモリの上限がある。, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§5}]}
  mem: {label: メモリ上の列データ, kind: cache, tier: flow, x: 13, 'y': 1.5, description: クエリに必要な列だけを読み込む。モデル全体がメモリに収まる必要はない。, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§3}]}
  delta: {label: OneLake の Delta テーブルとログ, kind: db, tier: flow, x: 17, 'y': 4, description: Lakehouse・Warehouse・ミラーリングなどが書いた Delta Parquet。, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§3}]}
  frame: {label: フレーミング（参照ファイルの更新）, kind: worker, tier: flow, x: 13, 'y': 7.5, description: 最新の Delta ログを調べ、参照するファイルを更新する。データの複製は行わず、数秒で終わる。自動更新を有効にすると変更に追従する。, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§4}]}
  sqlep: {label: SQL 分析エンドポイント（on SQL のみ）, kind: service, tier: flow, x: 4, 'y': 8, description: Direct Lake on SQL では、テーブルとビューの検出と権限確認に使う。on OneLake は使わない。, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§4}]}
  dq: {label: DirectQuery フォールバック（on SQL のみ）, kind: worker, tier: flow, x: 8, 'y': 8, description: データを Delta から直接読めない場合（SQL ビュー、SQL の行レベルセキュリティ、ガードレール超過）に、SQL 分析エンドポイントへクエリを渡す。Direct Lake on OneLake はフォールバックせず、ガードレール超過では失敗する。, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§4}]}
links:
  - {id: query, from: report, to: model, label: DAX クエリを送る, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§2}]}
  - {id: eval, from: model, to: vertipaq, label: クエリを評価, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§3}]}
  - {id: load, from: delta, to: mem, label: 必要な列を読み込む, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§3}]}
  - {id: serve, from: mem, to: vertipaq, label: 列データを供給, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§3}]}
  - {id: result, from: vertipaq, to: report, label: 結果を返す, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§3}]}
  - {id: reframe, from: frame, to: delta, label: 最新のログを確認, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§4}]}
  - {id: update-ref, from: frame, to: model, label: 参照ファイルを更新, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§4}]}
  - {id: resolve, from: sqlep, to: model, label: テーブルと権限を解決, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§4}]}
  - {id: fallback, from: vertipaq, to: dq, label: 条件に当たると切り替え, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§4}]}
  - {id: dq-run, from: dq, to: sqlep, label: SQL に変換して実行, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§4}]}
  - {id: check, from: guard, to: vertipaq, label: 上限超過を判定, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§5}]}
scenarios:
  - {id: query, label: レポートの操作に応答する, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§1}], steps: [{links: [query, eval, check], note: DAX クエリが VertiPaq に届き、容量のガードレールが評価される。}, {links: [load, serve, result], note: 必要な列を OneLake から読み込み、結果をレポートに返す。}]}
  - {id: refresh, label: Delta の更新を反映する, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§1}], steps: [{links: [reframe, update-ref], note: フレーミングが最新の Delta ログを確認し、モデルの参照ファイルを更新する。以降の読み込みは新しいファイルを使う。}]}
  - {id: fallback, label: on SQL で DirectQuery に切り替わる, evidence: [{type: doc, ref: docs/reference-fabric-direct-lake.md#§1}], steps: [{links: [resolve, fallback, dq-run], note: SQL ビューなどで Delta を直接読めないとき、SQL 分析エンドポイントにクエリを渡す。応答は遅くなる。}]}
unknowns:
  - {id: ga, text: Direct Lake on OneLake 自体の GA・Preview の区別は取得した概要で未確認。同じ資料で、Direct Lake on OneLake の計算テーブルと計算列は Preview と記される（2026 年 11 月時点）。, refs: [eval]}
  - {id: perf, text: Import に匹敵するクエリ性能は提供元の説明であり、自己申告。実測値は未確認。, refs: [load]}
  - {id: transcode, text: 列の読み込み（トランスコード）の内部手順は取得資料では参照のみで、未確認。, refs: [load]}
