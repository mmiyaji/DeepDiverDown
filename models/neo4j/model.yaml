name: Neo4j のプロパティグラフとネイティブのグラフ保存
description: Cypher の問い合わせがノード・リレーションシップのレコードを読み、書き込みがトランザクションログに残り、クラスタで primary と secondary に配られる流れを示す。
reference:
  objectives: [プロパティグラフと Cypher の関係を確認する, ノード・リレーションシップのレコードとトランザクションログの役割を区別する, primary と secondary、Community と Enterprise の違いを確認する]
  sources:
    - {title: Neo4j Operations Manual, url: https://neo4j.com/docs/operations-manual/current/introduction/}
    - {title: Store formats, url: https://neo4j.com/docs/operations-manual/current/database-internals/store-formats/}
    - {title: Transaction logs, url: https://neo4j.com/docs/operations-manual/current/database-internals/transaction-logs/}
    - {title: Clustering introduction, url: https://neo4j.com/docs/operations-manual/current/clustering/introduction/}
sources: [docs/reference-neo4j.md]
evidence: [{type: doc, ref: docs/reference-neo4j.md#§1}]
tiers:
  - {id: flow, label: クエリ・保存・クラスタ, z: 0, size: [30, 12]}
nodes:
  client: {label: クライアント（ドライバー・Browser）, kind: client, tier: flow, x: 1, y: 5.5, description: Cypher を送って結果を受け取る。, evidence: [{type: doc, ref: docs/reference-neo4j.md#§2}]}
  cypher: {label: Cypher クエリ, kind: service, tier: flow, x: 7, y: 5.5, description: 宣言型の問い合わせ言語。現在の資料は Cypher 25 を扱う。, evidence: [{type: doc, ref: docs/reference-neo4j.md#§2}]}
  propgraph: {label: プロパティグラフ, kind: db, tier: flow, x: 13, y: 1.5, description: ラベル付きノード、タイプと向きを持つリレーションシップ、双方のプロパティ。, evidence: [{type: doc, ref: docs/reference-neo4j.md#§2}]}
  store: {label: ノード・リレーションシップのレコード, kind: db, tier: flow, x: 13, y: 5.5, description: リレーションシップをノードと並べて保存する。block 形式は block.x1.db などのファイルで構成する。レコード間のポインタの詳細は未確認。, evidence: [{type: doc, ref: docs/reference-neo4j.md#§3}]}
  txlog: {label: トランザクションログ, kind: db, tier: flow, x: 13, y: 9.5, description: データ・インデックス・制約の書き込みを記録する。チェックポイント後にストアへ反映済みの分を削除できる。, evidence: [{type: doc, ref: docs/reference-neo4j.md#§4}]}
  primary: {label: primary（ライター）, kind: service, tier: flow, x: 20, y: 3.5, description: 書き込みを処理し、他の primary へ同期複製してからコミットする。Raft ログを共有する。, evidence: [{type: doc, ref: docs/reference-neo4j.md#§5}]}
  secondary: {label: secondary, kind: service, tier: flow, x: 26, y: 3.5, description: トランザクションログを非同期で受け、読み取りを担う。遅れることがある。, evidence: [{type: doc, ref: docs/reference-neo4j.md#§5}]}
  edition: {label: Community と Enterprise, kind: service, tier: flow, x: 23, y: 8.5, description: クラスタ、オンラインバックアップ、block 形式は Enterprise。Community は単一インスタンス向けで aligned 形式が既定。, evidence: [{type: doc, ref: docs/reference-neo4j.md#§6}]}
links:
  - {id: run, from: client, to: cypher, label: Cypher を実行, evidence: [{type: doc, ref: docs/reference-neo4j.md#§2}]}
  - {id: match, from: cypher, to: propgraph, label: パターンを照合, evidence: [{type: doc, ref: docs/reference-neo4j.md#§2}]}
  - {id: read-store, from: propgraph, to: store, label: レコードとして保存, evidence: [{type: doc, ref: docs/reference-neo4j.md#§3}]}
  - {id: log-write, from: cypher, to: txlog, label: 書き込みを記録, evidence: [{type: doc, ref: docs/reference-neo4j.md#§4}]}
  - {id: checkpoint, from: txlog, to: store, label: チェックポイントで反映, evidence: [{type: doc, ref: docs/reference-neo4j.md#§4}]}
  - {id: replicate, from: primary, to: secondary, label: ログを非同期に配布, evidence: [{type: doc, ref: docs/reference-neo4j.md#§5}]}
  - {id: ee-cluster, from: edition, to: primary, label: クラスタは Enterprise, evidence: [{type: doc, ref: docs/reference-neo4j.md#§6}]}
scenarios:
  - id: write-tx
    label: 書き込みをコミットしてクラスタへ配る
    evidence: [{type: doc, ref: docs/reference-neo4j.md#§5}]
    steps:
      - {links: [run, log-write], note: Cypher の書き込みをトランザクションログに記録する。}
      - {links: [checkpoint], note: チェックポイントでストアのファイルへ反映する。}
      - {links: [replicate], note: 他の primary へ同期複製し、secondary へはログを非同期に配る。}
requirements:
  - {id: NJ-01, kind: usecase, title: 読み取りを secondary へ分ける, text: 書き込みは primary のライターに集め、読み取りは secondary でも処理する。, links: [replicate], evidence: [{type: doc, ref: docs/reference-neo4j.md#§5}]}
unknowns:
  - {id: UNK-01, text: ノード・リレーションシップ・プロパティの各レコードの構造とポインタ（リレーションシップチェーン）は取得した資料に記載がなく未確認。, refs: [store]}
  - {id: UNK-02, text: Raft の選挙とログ複製の手順、Community での複数データベースの可否は未確認。, refs: [primary, edition]}
gates: {maxDrift: 0, maxHigh: 0}
implementations:
  - id: enterprise-cluster-onprem
    label: 自前サーバーの Enterprise クラスタ
    description: 3 台の primary と 1 台の secondary を自前のサーバーで動かし、ドライバーから接続する例。代表例であり、導入事例ではない。
    sources:
      - {title: Clustering introduction, url: https://neo4j.com/docs/operations-manual/current/clustering/introduction/}
      - {title: Store formats, url: https://neo4j.com/docs/operations-manual/current/database-internals/store-formats/}
      - {title: Transaction logs, url: https://neo4j.com/docs/operations-manual/current/database-internals/transaction-logs/}
    tiers:
      - {id: diagram, label: ドライバーとクラスタ, z: 0, size: [28, 12]}
    nodes:
      nj-driver: {label: アプリケーション（Neo4j ドライバー）, kind: client, tier: diagram, x: 1, y: 5.5, realizes: [client], description: 書き込みはライターへ、読み取りは secondary などへ送る。ルーティング設定は未確認。, evidence: [{type: doc, ref: docs/reference-neo4j.md#§7}]}
      nj-writer: {svc: 'oss:neo4j', label: Neo4j サーバー A（primary・ライター）, kind: service, tier: diagram, x: 10, y: 2.5, realizes: [cypher, propgraph, store, txlog, primary, edition], description: Cypher を処理し、ストアとトランザクションログを持つ。他の primary へ同期複製する。, management: {type: customer, scope: "Customer operates the servers, Neo4j configuration and storage."}, evidence: [{type: doc, ref: docs/reference-neo4j.md#§7}]}
      nj-follower: {svc: 'oss:neo4j', label: Neo4j サーバー B・C（primary）, kind: service, tier: diagram, x: 10, y: 8.5, realizes: [primary, store, txlog], description: ライターの書き込みを同期複製して受ける。過半数が動けば書き込みを続けられる。, management: {type: customer, scope: "Customer operates the servers, Neo4j configuration and storage."}, evidence: [{type: doc, ref: docs/reference-neo4j.md#§7}]}
      nj-secondary: {svc: 'oss:neo4j', label: Neo4j サーバー D（secondary）, kind: service, tier: diagram, x: 20, y: 5.5, realizes: [secondary, store, txlog], description: ログ配布を非同期で受け、読み取りを処理する。, management: {type: customer, scope: "Customer operates the servers, Neo4j configuration and storage."}, evidence: [{type: doc, ref: docs/reference-neo4j.md#§7}]}
    links:
      - {id: nj-write, from: nj-driver, to: nj-writer, label: 書き込み, evidence: [{type: doc, ref: docs/reference-neo4j.md#§7}]}
      - {id: nj-sync, from: nj-writer, to: nj-follower, label: 同期複製, evidence: [{type: doc, ref: docs/reference-neo4j.md#§7}]}
      - {id: nj-ship, from: nj-writer, to: nj-secondary, label: ログを非同期に配布, evidence: [{type: doc, ref: docs/reference-neo4j.md#§7}]}
      - {id: nj-read, from: nj-secondary, to: nj-driver, label: 読み取り結果, evidence: [{type: doc, ref: docs/reference-neo4j.md#§7}]}
    groups:
      - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [nj-writer, nj-follower, nj-secondary]}
    layout2d:
      tiers:
        - {id: diagram, label: ドライバーとクラスタ, z: 0, size: [28, 12]}
      nodes:
        nj-driver: {tier: diagram, x: 1, y: 5.5}
        nj-writer: {tier: diagram, x: 10, y: 2.5}
        nj-follower: {tier: diagram, x: 10, y: 8.5}
        nj-secondary: {tier: diagram, x: 20, y: 5.5}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [nj-writer, nj-follower, nj-secondary]}
    layout3d:
      tiers:
        - {id: client, label: クライアント, z: 0, size: [6, 12]}
        - {id: cluster, label: Neo4j クラスタ, z: 0, origin: [8, 0], size: [18, 12]}
      nodes:
        nj-driver: {tier: client, x: 3, y: 5.5}
        nj-writer: {tier: cluster, x: 4, y: 2.5}
        nj-follower: {tier: cluster, x: 4, y: 8.5}
        nj-secondary: {tier: cluster, x: 13, y: 5.5}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: [cluster], nodes: [nj-writer, nj-follower, nj-secondary]}
