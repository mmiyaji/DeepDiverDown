name: Snowflake：クエリ性能とウェアハウス
description: 同時実行の待ち行列、区画の絞り込み、検索用構造、結果とデータのキャッシュ、追加並列化を分けて調べる。
parent:
  model: snowflake
  node: biwh
reference:
  objectives:
  - 並行実行と一つのクエリ内部のスキャン量を別々に計測する。
  - 結果再利用、ウェアハウスのデータキャッシュ、実行時の経路を比較する。
  - 任意の最適化（検索用構造、Optima、QAS）の適用条件と維持費を確認する。
  sources:
  - title: マイクロパーティション
    url: https://docs.snowflake.com/en/user-guide/tables-clustering-micropartitions
  - title: マルチクラスターウェアハウス
    url: https://docs.snowflake.com/en/user-guide/warehouses-multicluster
  - title: 永続化されたクエリ結果
    url: https://docs.snowflake.com/en/user-guide/querying-persisted-results
  - title: クエリ性能の最適化
    url: https://docs.snowflake.com/en/user-guide/performance-query-options
  - title: Query Profile とクエリの調査
    url: https://docs.snowflake.com/en/user-guide/ui-snowsight-activity
  - title: Top-K pruning
    url: https://docs.snowflake.com/en/user-guide/querying-top-k-pruning-optimization
  - title: Snowflake Optima Metadata
    url: https://www.snowflake.com/en/blog/engineering/snowflake-optima-metadata-query-pruning/
  - title: Search optimization
    url: https://docs.snowflake.com/en/user-guide/search-optimization-service
  - title: Optima
    url: https://docs.snowflake.com/en/user-guide/snowflake-optima
  - title: Query Acceleration Service
    url: https://docs.snowflake.com/en/user-guide/query-acceleration-service
  - title: Warehouse cache
    url: https://docs.snowflake.com/en/user-guide/performance-query-warehouse-cache
sources:
- docs/reference-snowflake-query-performance.md
evidence:
- type: doc
  ref: docs/reference-snowflake-query-performance.md#§1
tiers:
- id: flow
  label: 構成と処理の流れ
  z: 0
  size:
  - 15
  - 6
nodes:
  bi:
    label: BI クエリ
    kind: client
    tier: flow
    x: 0
    y: 2
    description: 注文日別売上を集計する。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-query-performance.md#§1
  control:
    label: クエリ受付と計画
    kind: service
    tier: flow
    x: 3
    y: 2
    description: 条件と区画メタデータで計画し、結果再利用を判断する。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-query-performance.md#§1
  queue:
    label: 実行待ち行列
    kind: queue
    tier: flow
    x: 6
    y: 0
    description: 同時実行の空きを待つ。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-query-performance.md#§2
  clusters:
    label: ウェアハウスの実行資源
    kind: worker
    tier: flow
    x: 9
    y: 0
    description: 区画の読み取り、結合、集計、並べ替えを実行する。動的 pruning と Top-K pruning は実行時に働く。
    parallel: N
    evidence:
    - type: doc
      ref: docs/reference-snowflake-query-performance.md#§2
    drill: snowflake-aggregation-placement
  metadata:
    label: 区画メタデータ
    kind: db
    tier: flow
    x: 9.5
    y: 3
    description: 列の最小値・最大値など。範囲が合わない区画を除外する。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-query-performance.md#§3
    drill: snowflake-optima-internals
  micro:
    label: 列指向のストレージ区画
    kind: db
    tier: flow
    x: 14.5
    y: 2.5
    description: 候補となる列データを読む。
    partitions: 4
    evidence:
    - type: doc
      ref: docs/reference-snowflake-query-performance.md#§3
  result:
    label: 永続化済み結果
    kind: cache
    tier: flow
    x: 6
    y: 5
    description: 対象の実行結果を再利用できる。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-query-performance.md#§4
  search:
    label: 検索用の補助構造
    kind: db
    tier: flow
    x: 12
    y: 0
    description: Search Optimization の永続化された access path。値が含まれ得る区画の候補を絞る。任意で追加費用がある。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-query-performance.md#§3
  optima:
    label: 式ごとの追加統計
    kind: db
    tier: flow
    x: 9
    y: 5
    description: Optima Metadata が頻出する式の統計を生成する。Gen2 standard warehouse と Adaptive Warehouse が対象。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-query-performance.md#§3
  whcache:
    label: ウェアハウスのデータキャッシュ
    kind: cache
    tier: flow
    x: 6
    y: 3
    description: 稼働中のウェアハウスの後続クエリで使える表データ。停止時に破棄される。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-query-performance.md#§4
  qas:
    label: Query Acceleration Service
    kind: service
    tier: flow
    x: 13
    y: 5
    description: 有効化と対象条件を満たす場合、処理の一部を共有計算資源にオフロードする。Enterprise Edition 以上。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-query-performance.md#§3
  profile:
    label: Query Profile
    kind: service
    tier: flow
    x: 3
    y: 5
    description: 待ち、読み取った区画数、演算子ごとの行数や spill を調べる。
    evidence:
    - type: doc
      ref: docs/reference-snowflake-query-performance.md#§1
links:
- id: submit
  from: bi
  to: control
  label: 集計 SQL
  evidence:
  - type: doc
    ref: docs/reference-snowflake-query-performance.md#§1
- id: wait
  from: control
  to: queue
  label: 実行枠を待つ
  evidence:
  - type: doc
    ref: docs/reference-snowflake-query-performance.md#§2
- id: allocate
  from: queue
  to: clusters
  label: 空いたクラスターで実行
  evidence:
  - type: doc
    ref: docs/reference-snowflake-query-performance.md#§2
- id: bounds
  from: control
  to: metadata
  label: 候補の範囲を調べる
  evidence:
  - type: doc
    ref: docs/reference-snowflake-query-performance.md#§3
- id: scan
  from: clusters
  to: micro
  label: 残った区画の列を読む
  evidence:
  - type: doc
    ref: docs/reference-snowflake-query-performance.md#§3
- id: reuse
  from: control
  to: result
  label: 条件を満たす結果を参照
  evidence:
  - type: doc
    ref: docs/reference-snowflake-query-performance.md#§4
- id: return
  from: clusters
  to: bi
  label: 集計を返す
  evidence:
  - type: doc
    ref: docs/reference-snowflake-query-performance.md#§2
- id: cached
  from: result
  to: bi
  label: 保存済み結果を返す
  evidence:
  - type: doc
    ref: docs/reference-snowflake-query-performance.md#§4
- id: index
  from: search
  to: control
  label: 検索パスを参照
  evidence:
  - type: doc
    ref: docs/reference-snowflake-query-performance.md#§3
- id: expr
  from: optima
  to: control
  label: 式の統計を参照
  evidence:
  - type: doc
    ref: docs/reference-snowflake-query-performance.md#§3
- id: warm
  from: whcache
  to: clusters
  label: キャッシュ済みデータを読む
  evidence:
  - type: doc
    ref: docs/reference-snowflake-query-performance.md#§4
- id: accel
  from: clusters
  to: qas
  label: 対象処理をオフロード
  evidence:
  - type: doc
    ref: docs/reference-snowflake-query-performance.md#§3
- id: observe
  from: clusters
  to: profile
  label: 実行の実績を確認
  evidence:
  - type: doc
    ref: docs/reference-snowflake-query-performance.md#§1
scenarios:
- id: pruning
  label: 条件で絞り、実行し、結果を再利用する
  visual: grid
  evidence:
  - type: doc
    ref: docs/reference-snowflake-query-performance.md#§3
  steps:
  - links:
    - submit
    - bounds
    note: 1月25日以降の注文を指定し、日付の範囲が重ならない区画を除外する。
    prune:
    - row:p1
    - row:p2
  - links:
    - index
    - expr
    note: 対象の検索条件や式では、検索用の補助構造と追加統計でさらに候補を絞れる場合がある。
  - links:
    - wait
    - allocate
    note: クエリを実行できるクラスターに割り当てる。同時要求が多いと実行枠の空きを待つ。
  - links:
    - scan
    - warm
    note: 残った区画から必要列を読む。稼働中のウェアハウスのキャッシュにあれば使う。
    read:
    - row:p3
    - row:p4
  - links:
    - accel
    note: QAS が有効で対象のクエリなら、処理の一部を共有計算資源へオフロードする。
  - links:
    - return
    - observe
    note: 集計を返し、Query Profile で読んだ区画数と spill を確認する。
  - links:
    - reuse
    - cached
    note: 再利用条件を満たす同じ要求は実行せず、保存済みの結果を返す。
grid:
  title: 日付条件による区画の除外
  rowLabel: 区画の日付範囲
  colLabel: 列
  unit: ' 単位'
  node: micro
  rows:
  - id: p1
    label: 1/01〜1/07
  - id: p2
    label: 1/08〜1/14
  - id: p3
    label: 1/24〜1/27
  - id: p4
    label: 1/28〜1/31
  cols:
  - id: date
    label: 注文日
  - id: amount
    label: 金額
  values:
  - - 3
    - 8
  - - 3
    - 8
  - - 3
    - 8
  - - 3
    - 8
  note: 数値は例示。日付範囲が一部でも重なる 1/24〜1/27 は候補に残る。
