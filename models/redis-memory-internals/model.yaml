        evidence:
          - type: doc
            ref: docs/reference-redis-memory-internals.md#§4
      ex-keyspace:
        label: キー空間の検索
        kind: service
        tier: access
        x: 5
        'y': 1.5
        description: キーから対象の値を参照する。
        realizes:
          - keyspace
        evidence:
          - type: doc
            ref: docs/reference-redis-memory-internals.md#§4
      ex-value:
        label: 型と内部エンコーディング
        kind: db
        tier: data
        x: 5
        'y': 1.5
        description: 型とエンコーディングに従って値を保持する。
        realizes:
          - value
        evidence:
          - type: doc
            ref: docs/reference-redis-memory-internals.md#§4
      ex-compact:
        label: コンパクトな表現
        kind: db
        tier: data
        x: 10
        'y': 1.5
        description: 小さい集合等に listpack や intset 等を使用する場合がある。
        realizes:
          - compact
        evidence:
          - type: doc
            ref: docs/reference-redis-memory-internals.md#§4
      ex-expanded:
        label: 要素数に応じた表現
        kind: db
        tier: data
        x: 15
