          - data
        nodes:
          - ex-request
          - ex-keyspace
          - ex-value
          - ex-compact
          - ex-expanded
          - ex-expiry
          - ex-result
blocks:
  - id: structure
    title: キーと内部表現の例
    note: 表現は概念例であり、Redis の版、設定、要素数・値により変わります。
    hint: 項目を選ぶと説明を表示します。処理の流れに合わせて関連する項目を強調します。
    lanes:
      - id: keys
        label: キー空間
        node: keyspace
      - id: enc
        label: 値の内部表現
        node: value
    items:
      keys:
        - id: k1
          label: user:1
          k: 0
          note: キーは値への参照を持つ。
        - id: k2
          label: scores
          k: 1
          note: 別の値を識別するキーの例。
      enc:
        - id: listpack
          label: listpack
          k: 2
          note: 小さい集合型のコンパクト表現の例。
        - id: intset
          label: intset
          k: 3
          note: 整数のみの小さい Set などで使われる表現。
        - id: table
          label: 別の表現
          k: 4
          note: 閾値、型、版により別の表現を使う。
