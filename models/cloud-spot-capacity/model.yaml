name: スポット容量と中断への対応
description: クラウドの余剰容量を利用し、予告・チェックポイント・代替容量と再試行で中断に備える。
reference:
  objectives:
    - 余剰容量と通常容量の違いを理解する。
    - 中断通知と進捗の保存・再開を追う。
    - 各クラウドの事前通知と容量の制約を確認する。
  sources:
    - title: AWS Spot interruption notice
      url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/spot-instance-termination-notices.html
    - title: AWS EC2 rebalance recommendations
      url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/rebalance-recommendations.html
    - title: Azure Spot eviction
      url: https://learn.microsoft.com/en-us/azure/architecture/guide/spot/spot-eviction
    - title: Google Cloud Spot VMs
      url: https://docs.cloud.google.com/compute/docs/instances/spot
    - title: OCI preemptible instances
      url: https://docs.oracle.com/en-us/iaas/Content/Compute/Concepts/preemptible.htm
    - title: EC2 Auto Scaling Capacity Rebalancing
      url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-capacity-rebalancing.html
sources:
  - docs/reference-cloud-spot-capacity.md
evidence:
  - type: doc
    ref: docs/reference-cloud-spot-capacity.md#§1
  - type: doc
    ref: docs/reference-cloud-spot-capacity.md#§3
tiers:
  - id: compute
    label: ワークロードと容量
    z: 1
    size:
      - 20
      - 3
  - id: control
    label: 容量管理と復旧
    z: 0
    size:
      - 20
      - 3
nodes:
  work:
    label: 中断可能なワークロード
    kind: service
    tier: compute
    x: 0
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-cloud-spot-capacity.md#§2
  spot:
    label: 中断可能な計算容量
    kind: service
    tier: compute
    x: 4
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-cloud-spot-capacity.md#§2
  standard:
    label: 通常の計算容量
    kind: service
    tier: compute
    x: 8
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-cloud-spot-capacity.md#§2
  checkpoint:
    label: 永続的な処理進捗
    kind: db
    tier: compute
    x: 12
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-cloud-spot-capacity.md#§2
  manager:
    label: 容量の選択と補充
    kind: service
    tier: control
    x: 0
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-cloud-spot-capacity.md#§2
  notice:
    label: 中断の通知
    kind: service
    tier: control
    x: 4
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-cloud-spot-capacity.md#§2
  recovery:
    label: 停止・再開の制御
    kind: service
    tier: control
    x: 8
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-cloud-spot-capacity.md#§2
links:
  - id: run
    from: work
    to: spot
    label: 処理を実行
    evidence:
      - type: doc
        ref: docs/reference-cloud-spot-capacity.md#§2
  - id: alternate
    from: work
    to: standard
    label: 必要に応じて実行
    evidence:
      - type: doc
        ref: docs/reference-cloud-spot-capacity.md#§2
  - id: save
    from: work
    to: checkpoint
    label: 進捗を保存
    evidence:
      - type: doc
        ref: docs/reference-cloud-spot-capacity.md#§2
  - id: notice
    from: spot
    to: notice
    label: 中断を通知
    evidence:
      - type: doc
        ref: docs/reference-cloud-spot-capacity.md#§2
  - id: handle
    from: notice
    to: recovery
    label: 停止処理を開始
    evidence:
      - type: doc
        ref: docs/reference-cloud-spot-capacity.md#§2
  - id: restore
    from: checkpoint
    to: recovery
    label: 進捗を読み戻す
    evidence:
      - type: doc
        ref: docs/reference-cloud-spot-capacity.md#§2
  - id: resume
    from: recovery
    to: work
    label: 処理を再開
    evidence:
      - type: doc
        ref: docs/reference-cloud-spot-capacity.md#§2
  - id: supply
    from: manager
    to: spot
    label: 容量を確保
    evidence:
      - type: doc
        ref: docs/reference-cloud-spot-capacity.md#§2
  - id: supply-standard
    from: manager
    to: standard
    label: 通常容量を確保
    evidence:
      - type: doc
        ref: docs/reference-cloud-spot-capacity.md#§2
scenarios:
  - id: main
    label: 容量管理と復旧
    evidence:
      - type: doc
        ref: docs/reference-cloud-spot-capacity.md#§2
    steps:
      - links:
          - supply
          - supply-standard
          - run
          - alternate
        note: 通常容量と中断可能な容量を組み合わせる。
      - links:
          - save
          - notice
          - handle
        note: 通知を受け停止処理を試み、進捗を永続化する。
      - links:
          - restore
          - resume
        note: 代替容量で保存した進捗から再開する。
implementations:
  - id: example
    label: AWS EC2 Spot と Auto Scaling
    description: 複数タイプの Spot と On-Demand を混合し、アプリが S3 に進捗を保存する例。
    sources:
      - title: AWS Spot interruption notice
        url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/spot-instance-termination-notices.html
      - title: AWS EC2 rebalance recommendations
        url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/rebalance-recommendations.html
      - title: Azure Spot eviction
        url: https://learn.microsoft.com/en-us/azure/architecture/guide/spot/spot-eviction
      - title: Google Cloud Spot VMs
        url: https://docs.cloud.google.com/compute/docs/instances/spot
      - title: OCI preemptible instances
        url: https://docs.oracle.com/en-us/iaas/Content/Compute/Concepts/preemptible.htm
      - title: EC2 Auto Scaling Capacity Rebalancing
        url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-capacity-rebalancing.html
      - {title: EC2 Auto Scaling の混合インスタンスポリシー, url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-mixed-instances-groups.html}
      - {title: EC2 Spot の進捗保存, url: https://docs.aws.amazon.com/pdfs/whitepapers/latest/cost-optimization-leveraging-ec2-spot-instances/cost-optimization-leveraging-ec2-spot-instances.pdf}
    tiers:
      - id: compute
        label: ワークロードと容量
        z: 1
        size:
          - 20
          - 3
      - id: control
        label: 容量管理と復旧
        z: 0
        size:
          - 20
          - 3
    nodes:
      ex-work:
        label: EC2 上の処理アプリ
        kind: service
        tier: compute
        x: 0
        'y': 1.5
        description: 起動テンプレートの EC2 上で実行し、S3 に定期的に進捗を保存する。
        management: {type: customer, scope: "利用者がアプリ、起動時の配備とチェックポイント処理を管理する。"}
        evidence:
          - type: doc
            ref: docs/reference-cloud-spot-capacity.md#§4
        realizes:
          - work
      ex-spot:
        label: EC2 Spot
        kind: service
        tier: compute
        x: 4
        'y': 1.5
        svc: ec2
        management: {type: shared, scope: "AWS が物理基盤と Spot 容量の割り当て・回収を担い、利用者がインスタンス設定とゲスト OS を管理する。"}
        evidence:
          - type: doc
            ref: docs/reference-cloud-spot-capacity.md#§4
        realizes:
          - spot
      ex-standard:
        label: EC2 On-Demand
        kind: service
        tier: compute
        x: 8
        'y': 1.5
        svc: ec2
        management: {type: shared, scope: "AWS が物理基盤を運用し、利用者がインスタンス設定とゲスト OS を管理する。"}
        evidence:
          - type: doc
            ref: docs/reference-cloud-spot-capacity.md#§4
        realizes:
          - standard
      ex-checkpoint:
        label: S3 進捗オブジェクト
        kind: db
        tier: compute
        x: 12
        'y': 1.5
        svc: s3
        management: {type: shared, scope: "AWS が S3 サービスを運用し、利用者がバケット設定、権限と進捗データを管理する。"}
        evidence:
          - type: doc
            ref: docs/reference-cloud-spot-capacity.md#§4
        realizes:
          - checkpoint
      ex-manager:
        label: EC2 Auto Scaling（混合インスタンスグループ）
        kind: service
        tier: control
        x: 0
        'y': 1.5
        svc: autoscaling
        description: 複数 AZ と機種から混合グループを起動し、容量リバランスを有効にする。
        management: {type: shared, scope: "AWS が Auto Scaling サービスを運用し、利用者が API でグループ、起動テンプレート、混合ポリシーとリバランスを設定する。AWS の内部サービスには直接アクセスしない。"}
        evidence:
          - type: doc
            ref: docs/reference-cloud-spot-capacity.md#§4
        realizes:
          - manager
      ex-notice:
        label: EC2 IMDSv2（Spot 中断通知）
        kind: service
        tier: control
        x: 4
        'y': 1.5
        svc: ec2
        description: Spot インスタンス上の処理が IMDSv2 の instance-action をポーリングする。
        management: {type: shared, scope: "AWS がインスタンスメタデータを提供し、利用者が IMDSv2 の利用設定とポーリング処理を管理する。"}
        evidence:
          - type: doc
            ref: docs/reference-cloud-spot-capacity.md#§4
        realizes:
          - notice
      ex-recovery:
        label: アプリの停止・再開処理
        kind: service
        tier: control
        x: 8
        'y': 1.5
        description: Spot 側では停止処理を実行し、代替 EC2 のアプリ起動時に S3 の進捗を読み戻す。
        management: {type: customer, scope: "利用者が停止処理、保存済み進捗の読み戻しと再実行を実装・運用する。"}
        evidence:
          - type: doc
            ref: docs/reference-cloud-spot-capacity.md#§4
        realizes:
          - recovery
      ex-role: {label: "IAM（EC2 インスタンスロール）", svc: iam, kind: policy, tier: control, x: 14, y: 1.5, description: "アプリが対象の S3 進捗オブジェクトを読み書きできるようにする。", management: {type: shared, scope: "AWS が IAM を提供し、利用者がロールの信頼関係と権限を設定する。"}, evidence: [{type: doc, ref: docs/reference-cloud-spot-capacity.md#§4}]}
    links:
      - {id: ex-checkpoint-role, from: ex-role, to: ex-work, label: S3 の進捗を読み書きする権限を付与}
    groups:
      - kind: cloud
        provider: aws
        label: AWS アカウント
        tier:
          - compute
        nodes:
          - ex-work
          - ex-spot
          - ex-standard
          - ex-checkpoint
      - kind: cloud
        provider: aws
        label: AWS アカウント
        tier:
          - control
        nodes:
          - ex-manager
          - ex-notice
          - ex-recovery
          - ex-role
      - {kind: vpc, label: EC2 を実行する VPC, tier: [compute, control], nodes: [ex-work, ex-spot, ex-standard, ex-notice, ex-recovery]}
    layout2d:
      tiers:
        - {id: diagram, label: AWS の実装構成, z: 0, size: [19, 11]}
      nodes:
        ex-manager: {tier: diagram, x: 3, y: 1}
        ex-role: {tier: diagram, x: 9, y: 1}
        ex-work: {tier: diagram, x: 3, y: 4}
        ex-recovery: {tier: diagram, x: 7, y: 4}
        ex-notice: {tier: diagram, x: 3, y: 7}
        ex-spot: {tier: diagram, x: 3, y: 10}
        ex-standard: {tier: diagram, x: 7, y: 10}
        ex-checkpoint: {tier: diagram, x: 14, y: 7}
      groups:
        - {kind: cloud, provider: aws, label: AWS アカウント, tier: [diagram], nodes: [ex-manager, ex-role, ex-work, ex-recovery, ex-notice, ex-spot, ex-standard, ex-checkpoint]}
        - {kind: vpc, label: EC2 を実行する VPC, tier: [diagram], nodes: [ex-work, ex-recovery, ex-notice, ex-spot, ex-standard]}
    layout3d:
      tiers:
        - {id: infrastructure, label: EC2 と独立した AWS サービス, z: 0, size: [19, 8]}
        - {id: application, label: EC2 のゲスト上の処理, z: 1, size: [19, 8]}
      nodes:
        ex-manager: {tier: infrastructure, x: 2, y: 1}
        ex-role: {tier: infrastructure, x: 8, y: 1}
        ex-spot: {tier: infrastructure, x: 3, y: 5}
        ex-standard: {tier: infrastructure, x: 7, y: 5}
        ex-checkpoint: {tier: infrastructure, x: 14, y: 5}
        ex-work: {tier: application, x: 3, y: 5}
        ex-notice: {tier: infrastructure, x: 5, y: 5}
        ex-recovery: {tier: application, x: 7, y: 5}
      groups:
        - {kind: cloud, provider: aws, label: AWS アカウント, tier: [infrastructure, application], nodes: [ex-manager, ex-role, ex-work, ex-recovery, ex-notice, ex-spot, ex-standard, ex-checkpoint]}
        - {kind: vpc, label: EC2 を実行する VPC, tier: [infrastructure, application], nodes: [ex-work, ex-recovery, ex-notice, ex-spot, ex-standard]}
