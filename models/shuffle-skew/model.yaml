implementations:
  - id: spark-aqe
    label: "Spark SQL Adaptive Query Execution"
    description: "Spark SQL で受注明細と顧客マスタを結合する例。Adaptive Query Execution が対象の結合で偏ったシャッフル分割を分けられる場合を示す。"
    sources:
      - {title: Apache Spark · Shuffle operations, url: https://spark.apache.org/docs/latest/rdd-programming-guide.html#shuffle-operations}
      - {title: Apache Spark · Performance Tuning, url: https://spark.apache.org/docs/latest/sql-performance-tuning.html#optimizing-skew-join}
      - {title: Google Cloud · Query plan and timeline, url: https://cloud.google.com/bigquery/docs/query-plan-explanation}
      - {title: Spark Standalone Mode, url: https://spark.apache.org/docs/latest/spark-standalone.html}
      - {title: HDFS Architecture, url: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HdfsDesign.html}
      - {title: Spark Web UI, url: https://spark.apache.org/docs/latest/web-ui.html}
    tiers:
      - {id: processing, label: データの処理と保存, z: 0, size: [14, 5]}
