      - {"blocks": {"m1":[],"m2":[],"m3":[],"r1":[{"id":"m1-1","label":"C-0412","k":0},{"id":"m1-6","label":"C-0128","k":0},{"id":"m2-1","label":"C-0412","k":0},{"id":"m2-6","label":"C-0128","k":0},{"id":"m3-1","label":"C-0412","k":0},{"id":"m3-6","label":"C-0128","k":0}],"r2":[{"id":"m1-0","label":"C-0001","k":1},{"id":"m1-2","label":"C-0001","k":1},{"id":"m1-5","label":"C-0001","k":1},{"id":"m1-7","label":"C-0001","k":1},{"id":"m2-0","label":"C-0001","k":1},{"id":"m2-2","label":"C-0001","k":1},{"id":"m2-5","label":"C-0001","k":1},{"id":"m2-7","label":"C-0001","k":1},{"id":"m3-0","label":"C-0001","k":1},{"id":"m3-2","label":"C-0001","k":1},{"id":"m3-5","label":"C-0001","k":1},{"id":"m3-7","label":"C-0001","k":1}],"r3":[{"id":"m1-3","label":"C-0233","k":2},{"id":"m2-3","label":"C-0233","k":2},{"id":"m3-3","label":"C-0233","k":2}],"r4":[{"id":"m1-4","label":"C-0907","k":3},{"id":"m2-4","label":"C-0907","k":3},{"id":"m3-4","label":"C-0907","k":3}]}, "highlight": ["p07"], "links": ["exchange", "exchange-hot"], "note": "両側の同じ customer_id が同じ結合タスクに届くようにデータを振り分ける。"}
      - {"blocks": {"m1":[],"m2":[],"m3":[],"r1":[{"id":"m1-1","label":"C-0412","k":0},{"id":"m1-6","label":"C-0128","k":0},{"id":"m2-1","label":"C-0412","k":0},{"id":"m2-6","label":"C-0128","k":0},{"id":"m3-1","label":"C-0412","k":0},{"id":"m3-6","label":"C-0128","k":0}],"r2":[{"id":"m1-0","label":"C-0001","k":1},{"id":"m1-2","label":"C-0001","k":1},{"id":"m1-5","label":"C-0001","k":1},{"id":"m1-7","label":"C-0001","k":1},{"id":"m2-0","label":"C-0001","k":1},{"id":"m2-2","label":"C-0001","k":1},{"id":"m2-5","label":"C-0001","k":1},{"id":"m2-7","label":"C-0001","k":1},{"id":"m3-0","label":"C-0001","k":1},{"id":"m3-2","label":"C-0001","k":1},{"id":"m3-5","label":"C-0001","k":1},{"id":"m3-7","label":"C-0001","k":1}],"r3":[{"id":"m1-3","label":"C-0233","k":2},{"id":"m2-3","label":"C-0233","k":2},{"id":"m3-3","label":"C-0233","k":2}],"r4":[{"id":"m1-4","label":"C-0907","k":3},{"id":"m2-4","label":"C-0907","k":3},{"id":"m3-4","label":"C-0907","k":3}]}, "lanes": {"r2":{"sub":"C-0001 が集中（12 個）","tone":"new"}}, "highlight": ["p07","m1-0","m1-2","m1-5","m1-7","m2-0","m2-2","m2-5","m2-7","m3-0","m3-2","m3-5","m3-7"], "links": ["inspect", "inspect-hot"], "note": "特定の顧客に明細が偏った場合は、タスクごとの処理量や時間のばらつきを調べる。"}
      - {"links": ["write", "write-hot"], "note": "結合結果に顧客属性を付けて利用側へ渡す。"}
  - id: split-skew
    label: 偏ったパーティションを分割する（AQE）
    evidence: [{type: doc, ref: "docs/reference-shuffle-skew.md#§3"}]
    steps:
      - {highlight: [p07], links: [exchange, exchange-hot], note: "シャッフル後、パーティション 7 だけが中央値の約 13 倍の 1,920 MB になる。"}
      - {highlight: [p07a, p07b, p07c, p07d], bars: [{id: p00, label: "パーティション 0", short: "P0", value: 150, node: join}, {id: p01, label: "パーティション 1", short: "P1", value: 132, node: join}, {id: p02, label: "パーティション 2", short: "P2", value: 171, node: join}, {id: p03, label: "パーティション 3", short: "P3", value: 118, node: join}, {id: p04, label: "パーティション 4", short: "P4", value: 160, node: join}, {id: p05, label: "パーティション 5", short: "P5", value: 144, node: join}, {id: p06, label: "パーティション 6", short: "P6", value: 126, node: join}, {id: p07a, label: "パーティション 7-1（分割）", short: "P7-1", value: 480, node: hot, from: [p07], description: "AQE が偏ったパーティションを分割した片割れ。対向側（顧客マスタ）の該当部分は各タスクに複製される。"}, {id: p07b, label: "パーティション 7-2（分割）", short: "P7-2", value: 480, node: hot, from: [p07], description: "AQE が偏ったパーティションを分割した片割れ。対向側（顧客マスタ）の該当部分は各タスクに複製される。"}, {id: p07c, label: "パーティション 7-3（分割）", short: "P7-3", value: 480, node: hot, from: [p07], description: "AQE が偏ったパーティションを分割した片割れ。対向側（顧客マスタ）の該当部分は各タスクに複製される。"}, {id: p07d, label: "パーティション 7-4（分割）", short: "P7-4", value: 480, node: hot, from: [p07], description: "AQE が偏ったパーティションを分割した片割れ。対向側（顧客マスタ）の該当部分は各タスクに複製される。"}, {id: p08, label: "パーティション 8", short: "P8", value: 138, node: join}, {id: p09, label: "パーティション 9", short: "P9", value: 165, node: join}, {id: p10, label: "パーティション 10", short: "P10", value: 121, node: join}, {id: p11, label: "パーティション 11", short: "P11", value: 149, node: join}], links: [inspect-hot], note: "AQE が偏りを検出し、パーティション 7 を 4 つに分割して別々のタスクで結合する。対向側の該当部分は各タスクに複製する。"}
      - {links: [write, write-hot], note: "最長タスクが短くなり、ステージ全体の完了が早まる。"}
