,"note":"手元の顧客マスタと結合した明細。シャッフルは起きない。"},{"id":"j-o6","label":"結合 6","k":5,"from":["o6"],"note":"手元の顧客マスタと結合した明細。シャッフルは起きない。"},{"id":"d1-w3","label":"顧客 A","k":2,"from":["d1"],"note":"各 Worker に複製された顧客マスタ"},{"id":"d2-w3","label":"顧客 B","k":2,"from":["d2"],"note":"各 Worker に複製された顧客マスタ"}]},"links":["write"],"note":"各 Worker が手元で結合する。偏った顧客がいても、明細は元の Worker に分散したまま処理できる。"}]}
distribution:
  title: シャッフル後のパーティションごとのデータ量
