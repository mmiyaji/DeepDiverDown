name: NebulaGraph の基本アーキテクチャ
description: graphd・metad・storaged の 3 サービスに分かれた分散グラフ DB で、スペースのパーティションごとに Raft で複製し、各 storaged が RocksDB に保存する流れを示す。
reference:
  objectives: [graphd・metad・storaged の役割を区別する, スペース・パーティション・Raft グループ・RocksDB の関係を確認する, nGQL と openCypher の互換範囲を確認する]
  sources:
    - {title: NebulaGraph Architecture overview, url: https://docs.nebula-graph.io/3.8.0/1.introduction/3.nebula-graph-architecture/1.architecture-overview/}
    - {title: NebulaGraph Storage Service, url: https://docs.nebula-graph.io/3.8.0/1.introduction/3.nebula-graph-architecture/4.storage-service/}
    - {title: NebulaGraph Meta Service, url: https://docs.nebula-graph.io/3.8.0/1.introduction/3.nebula-graph-architecture/2.meta-service/}
    - {title: NebulaGraph CREATE SPACE, url: https://docs.nebula-graph.io/3.8.0/3.ngql-guide/9.space-statements/1.create-space/}
    - {title: nGQL overview, url: https://docs.nebula-graph.io/3.8.0/3.ngql-guide/1.nGQL-overview/1.overview/}
sources: [docs/reference-nebulagraph.md]
evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§1}]
tiers:
  - {id: flow, label: クライアント・3 サービス・データ, z: 0, size: [28, 11]}
nodes:
  client: {label: クライアント（nGQL）, kind: client, tier: flow, x: 1, y: 5.5, description: nGQL の文を graphd に送る。openCypher の一部（MATCH など）も使える。, evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§7}]}
  graphd: {label: Graph Service（graphd）, kind: service, tier: flow, x: 7, y: 5.5, description: Parser、Validator、Planner、Executor の順に問い合わせを処理する。, evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§2}]}
  metad: {label: Meta Service（metad）, kind: service, tier: flow, x: 13, y: 1.5, description: スキーマ、権限、パーティションの位置を管理する。metad 同士は Raft で複製し、リーダーだけが応答する。, evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§3}]}
  storaged: {label: Storage Service（storaged）, kind: service, tier: flow, x: 13, y: 7.5, description: 分散 KVStore。グラフ操作を KV 操作に変換してパーティションを読み書きする。, evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§6}]}
  space: {label: スペース（グラフ空間）, kind: db, tier: flow, x: 19, y: 1.5, description: 分離されたデータの単位。partition_num・replica_factor・vid_type は作成後に変更できない。, evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§4}]}
  partition: {label: パーティション, kind: db, tier: flow, x: 19, y: 5.5, description: 頂点 ID の剰余によるハッシュで割り当てる。エッジは out-key と in-key の 2 つで保存する。, evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§4}]}
  raft: {label: パーティションごとの Raft グループ, kind: service, tier: flow, x: 19, y: 9.5, description: リーダーが読み書きを受け、書き込みは過半数のレプリカが Raft-wal を受け取ると成功する。, evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§5}]}
  rocksdb: {label: RocksDB, kind: db, tier: flow, x: 25, y: 7.5, description: storaged のローカルストレージエンジン。data_path のパスごとにインスタンスができる。, evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§6}]}
links:
  - {id: send-query, from: client, to: graphd, label: nGQL を送信, evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§7}]}
  - {id: get-meta, from: graphd, to: metad, label: スキーマ・位置を取得, evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§3}]}
  - {id: rw-data, from: graphd, to: storaged, label: データを読み書き, evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§2}]}
  - {id: hold-space, from: metad, to: space, label: スペースを管理, evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§3}]}
  - {id: split, from: space, to: partition, label: ハッシュで分割, evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§4}]}
  - {id: replicate, from: partition, to: raft, label: レプリカを複製, evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§5}]}
  - {id: store-kv, from: raft, to: rocksdb, label: 各レプリカが保存, evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§6}]}
scenarios:
  - id: write-vertex
    label: 頂点を書き込む
    evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§5}]
    steps:
      - {links: [send-query, get-meta], note: graphd が nGQL を解析し、metad のスキーマと照合する。}
      - {links: [rw-data, replicate], note: 対象パーティションのリーダーへ書き込み、過半数のレプリカが Raft-wal を受け取ると成功とする。}
      - {links: [store-kv], note: 各レプリカが RocksDB に保存する。}
requirements:
  - {id: NG-01, kind: usecase, title: 問い合わせとストレージを分けて拡張する, text: graphd と storaged は別プロセスで、それぞれ独立に増減できる。, links: [send-query, rw-data], evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§1}]}
unknowns:
  - {id: UNK-01, text: graphd が状態を持たないかどうか、graphd の既定ポートは今回取得した資料で未確認。, refs: [graphd]}
  - {id: UNK-02, text: Learner レプリカの扱いは今回取得した資料になく未確認。, refs: [raft]}
gates: {maxDrift: 0, maxHigh: 0}
implementations:
  - id: self-managed-onprem
    label: 自前のサーバーで動かす 3 サービス構成
    description: graphd、metad、storaged を自前のサーバーで動かす例。代表例であり、導入事例ではない。
    sources:
      - {title: NebulaGraph Architecture overview, url: https://docs.nebula-graph.io/3.8.0/1.introduction/3.nebula-graph-architecture/1.architecture-overview/}
      - {title: NebulaGraph Meta Service, url: https://docs.nebula-graph.io/3.8.0/1.introduction/3.nebula-graph-architecture/2.meta-service/}
      - {title: NebulaGraph Storage Service, url: https://docs.nebula-graph.io/3.8.0/1.introduction/3.nebula-graph-architecture/4.storage-service/}
    tiers:
      - {id: diagram, label: クライアント・3 サービス, z: 0, size: [28, 11]}
    nodes:
      ng-client: {label: アプリ（nGQL クライアント）, kind: client, tier: diagram, x: 1, y: 5.5, realizes: [client], description: nGQL の文を graphd に送る。, evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§8}]}
      ng-graphd: {label: nebula-graphd, kind: service, tier: diagram, x: 8, y: 5.5, realizes: [graphd], description: 問い合わせを解析・実行する。, management: {type: customer, scope: "Customer operates the graphd processes."}, evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§8}]}
      ng-metad: {label: nebula-metad（3 台推奨）, kind: service, tier: diagram, x: 15, y: 1.5, realizes: [metad, space], description: 別マシン 3 台で Raft クラスターを組む。, management: {type: customer, scope: "Customer operates the metad cluster."}, evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§8}]}
      ng-storaged: {label: nebula-storaged と RocksDB, kind: db, tier: diagram, x: 21, y: 7.5, realizes: [storaged, partition, raft, rocksdb], description: パーティションの各レプリカを Raft で複製し、RocksDB に保存する。, management: {type: customer, scope: "Customer operates the storaged nodes and disks."}, evidence: [{type: doc, ref: docs/reference-nebulagraph.md#§8}]}
    links: []
    groups:
      - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [ng-graphd, ng-metad, ng-storaged]}
    layout2d:
      tiers:
        - {id: diagram, label: クライアント・3 サービス, z: 0, size: [28, 11]}
      nodes:
        ng-client: {tier: diagram, x: 1, y: 5.5}
        ng-graphd: {tier: diagram, x: 8, y: 5.5}
        ng-metad: {tier: diagram, x: 15, y: 1.5}
        ng-storaged: {tier: diagram, x: 21, y: 7.5}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [ng-graphd, ng-metad, ng-storaged]}
    layout3d:
      tiers:
        - {id: client, label: クライアント, z: 0, size: [6, 11]}
        - {id: servers, label: サーバー群, z: 0, origin: [8, 0], size: [20, 11]}
      nodes:
        ng-client: {tier: client, x: 3, y: 5.5}
        ng-graphd: {tier: servers, x: 3, y: 5.5}
        ng-metad: {tier: servers, x: 10, y: 1.5}
        ng-storaged: {tier: servers, x: 16, y: 7.5}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: servers, nodes: [ng-graphd, ng-metad, ng-storaged]}
