name: Redpanda の Kafka 互換ログ基盤
description: Kafka API で接続するクライアントを、コアごとにスレッドを固定したブローカーが受け、パーティションごとの Raft グループで複製してログに追記し、古いセグメントをオブジェクトストレージへ退避するまでの主要な部品を示す。
reference:
  objectives: [Kafka API 互換のブローカーとクライアントの関係を確認する, パーティションごとの Raft グループとコントローラーの役割を区別する, ローカルログと階層型ストレージの分担を確認する, ライセンスの区分と制約を確認する]
  sources:
    - {title: Redpanda architecture, url: https://docs.redpanda.com/current/get-started/architecture/}
    - {title: Tiered Storage, url: https://docs.redpanda.com/current/manage/tiered-storage/}
    - {title: Redpanda Licenses and Enterprise Features, url: https://docs.redpanda.com/current/get-started/licensing/overview/}
    - {title: Licensing, url: https://docs.redpanda.com/current/get-started/licensing/}
    - {title: Business Source License（リポジトリの licenses/bsl.md）, url: https://github.com/redpanda-data/redpanda/blob/dev/licenses/bsl.md}
sources: [docs/reference-redpanda.md]
evidence: [{type: doc, ref: docs/reference-redpanda.md#§1}]
tiers:
  - {id: flow, label: クライアント・ブローカー・ストレージ, z: 0, size: [28, 12]}
nodes:
  client: {label: Kafka クライアント, kind: client, tier: flow, x: 1, y: 5, description: Kafka API で Topic に書き込み、読み出す。Producer と Consumer は分離され、Consumer は非同期に読む。, evidence: [{type: doc, ref: docs/reference-redpanda.md#§2}]}
  console: {label: Redpanda Console, kind: client, tier: flow, x: 1, y: 9.5, description: 管理用の Web UI。認証・認可（RBAC）などの一部機能はエンタープライズ版のライセンスキーが要る。, evidence: [{type: doc, ref: docs/reference-redpanda.md#§7}]}
  cores: {label: ブローカー（コアごとのスレッド）, kind: service, tier: flow, x: 8, y: 5, description: Seastar でアプリケーションのスレッドを CPU コアに固定し、スレッド間はメッセージ渡しで通信する。コンテキストスイッチとロックを減らす設計。, evidence: [{type: doc, ref: docs/reference-redpanda.md#§2}]}
  controller: {label: コントローラー（Raft）, kind: service, tier: flow, x: 8, y: 1.5, description: Topic やユーザーの作成などのメタデータ変更を、全ブローカーを含む Raft グループのコントローラーパーティションで処理する。スナップショットは既定で有効。, evidence: [{type: doc, ref: docs/reference-redpanda.md#§4}]}
  leader: {label: パーティションのリーダー, kind: service, tier: flow, x: 15, y: 5, description: パーティションごとに 1 つの Raft グループがあり、選出されたリーダーが書き込みを受ける。acks=all ではレプリカの過半数が書いた時点で応答する。, evidence: [{type: doc, ref: docs/reference-redpanda.md#§3}]}
  follower: {label: フォロワー（レプリカ）, kind: service, tier: flow, x: 22, y: 1.5, description: リーダーのログを取り込む。2f+1 台で f 台の障害に耐える。, evidence: [{type: doc, ref: docs/reference-redpanda.md#§3}]}
  log: {label: ローカルログ（セグメント）, kind: db, tier: flow, x: 22, y: 5, description: イベントをディスク上のログファイルに追記する。同じキーは同じパーティションに入り、順序はパーティション内で保証される。, evidence: [{type: doc, ref: docs/reference-redpanda.md#§5}]}
  tiered: {label: 階層型ストレージ（オブジェクトストレージ）, kind: db, tier: flow, x: 15, y: 9.5, description: ログセグメントを S3・GCS・Azure Blob などへ退避する。古いオフセットは同じ Kafka API で読める。エンタープライズ機能。, evidence: [{type: doc, ref: docs/reference-redpanda.md#§6}]}
links:
  - {id: c-api, from: client, to: cores, label: Kafka API で送受信, evidence: [{type: doc, ref: docs/reference-redpanda.md#§2}]}
  - {id: console-api, from: console, to: cores, label: 管理操作を送信, evidence: [{type: doc, ref: docs/reference-redpanda.md#§7}]}
  - {id: route, from: cores, to: leader, label: 担当パーティションへ渡す, evidence: [{type: doc, ref: docs/reference-redpanda.md#§3}]}
  - {id: meta, from: cores, to: controller, label: メタデータ変更を依頼, evidence: [{type: doc, ref: docs/reference-redpanda.md#§4}]}
  - {id: assign, from: controller, to: leader, label: 構成を反映, evidence: [{type: doc, ref: docs/reference-redpanda.md#§4}]}
  - {id: repl, from: leader, to: follower, label: Raft で複製, evidence: [{type: doc, ref: docs/reference-redpanda.md#§3}]}
  - {id: repl-ack, from: follower, to: leader, label: 書き込みを応答, evidence: [{type: doc, ref: docs/reference-redpanda.md#§3}]}
  - {id: append, from: leader, to: log, label: 追記, evidence: [{type: doc, ref: docs/reference-redpanda.md#§5}]}
  - {id: upload, from: leader, to: tiered, label: セグメントを退避, evidence: [{type: doc, ref: docs/reference-redpanda.md#§6}]}
  - {id: remote-read, from: tiered, to: cores, label: 古いオフセットを取得, evidence: [{type: doc, ref: docs/reference-redpanda.md#§6}]}
scenarios:
  - id: write-replicate-tier
    label: 書き込み・複製・退避
    evidence: [{type: doc, ref: docs/reference-redpanda.md#§3}]
    steps:
      - {links: [c-api, route], note: クライアントが Kafka API で送り、担当コアがパーティションのリーダーへ渡す。}
      - {links: [repl, repl-ack, append], note: リーダーが Raft でフォロワーへ複製し、ログに追記する。acks=all では過半数の書き込みで応答する。}
      - {links: [upload], note: 階層型ストレージを有効にした Topic では、リーダーが読み出し可能な範囲のセグメントを順次アップロードする。}
  - id: read-old-offset
    label: 古いオフセットの読み出し
    evidence: [{type: doc, ref: docs/reference-redpanda.md#§6}]
    steps:
      - {links: [c-api], note: 古いオフセットを要求する。}
      - {links: [remote-read], note: ローカルに無いデータをオブジェクトストレージから取得し、ローカルキャッシュに置く。}
requirements:
  - {id: RP-01, kind: usecase, title: Kafka API のクライアントから使う, text: Producer と Consumer は Kafka API で接続する。個別のクライアント・ツールごとの互換範囲は未確認。, links: [c-api], evidence: [{type: doc, ref: docs/reference-redpanda.md#§2}]}
unknowns:
  - {id: UNK-01, text: 取得した資料に Schema Registry と HTTP Proxy の記載が無く、構成と配置は未確認。, refs: [cores]}
  - {id: UNK-02, text: fsync の方針と書き込み確認の既定値は、取得した資料に記載が無く未確認。, refs: [log, leader]}
  - {id: UNK-03, text: Community Edition License と Business Source License 1.1 の関係、および版ごとの適用は未確認。, refs: [cores]}
  - {id: UNK-04, text: マネージド版（Redpanda Cloud）の構成は取得した資料で扱っておらず未確認。, refs: [cores]}
gates: {maxDrift: 0, maxHigh: 0}
implementations:
  - id: onprem-cluster
    label: 自前の Linux 上の 3 ブローカー構成
    description: ブローカー群がコントローラーとパーティションの Raft グループを兼ね、ログをローカルディスクに置き、階層型ストレージ用のオブジェクトストレージは稼働環境の外にある例。図は 2 台に省略している。代表例であり、導入事例ではない。
    sources:
      - {title: Redpanda architecture, url: https://docs.redpanda.com/current/get-started/architecture/}
      - {title: Tiered Storage, url: https://docs.redpanda.com/current/manage/tiered-storage/}
    tiers:
      - {id: diagram, label: クライアント・Redpanda・ストレージ, z: 0, size: [28, 12]}
    nodes:
      rp-client: {label: Kafka クライアント, kind: client, tier: diagram, x: 1, y: 4, realizes: [client], description: Kafka API を使うアプリケーション。, evidence: [{type: doc, ref: docs/reference-redpanda.md#§8}]}
      rp-console: {label: Redpanda Console, kind: client, tier: diagram, x: 1, y: 8.5, realizes: [console], description: 管理用の Web UI。, evidence: [{type: doc, ref: docs/reference-redpanda.md#§8}]}
      rp-b1: {label: Redpanda ブローカー 1, kind: service, tier: diagram, x: 9, y: 4, realizes: [cores, controller, leader], description: コアごとのスレッドで要求を処理し、コントローラーと担当パーティションのリーダーを兼ねる。, management: {type: customer, scope: "Customer operates the host, Redpanda process and configuration."}, evidence: [{type: doc, ref: docs/reference-redpanda.md#§8}]}
      rp-b2: {label: Redpanda ブローカー 2, kind: service, tier: diagram, x: 17, y: 1.5, realizes: [follower], description: リーダーから Raft でログを受けるフォロワー。, management: {type: customer, scope: "Customer operates the host, Redpanda process and configuration."}, evidence: [{type: doc, ref: docs/reference-redpanda.md#§8}]}
      rp-disk: {label: ローカルディスク（ログ）, kind: db, tier: diagram, x: 17, y: 5.5, realizes: [log], description: パーティションのログセグメントを置く。, management: {type: customer, scope: "Customer operates the disk and backups."}, evidence: [{type: doc, ref: docs/reference-redpanda.md#§8}]}
      rp-store: {label: オブジェクトストレージ, kind: external, tier: diagram, x: 17, y: 9.5, realizes: [tiered], description: S3・GCS・Azure Blob などのバケット。バケットとクレデンシャルをクラスター設定で指定する。, evidence: [{type: doc, ref: docs/reference-redpanda.md#§8}]}
    links:
      - {id: rp-api, from: rp-client, to: rp-b1, label: Kafka API で送受信, evidence: [{type: doc, ref: docs/reference-redpanda.md#§8}]}
      - {id: rp-admin, from: rp-console, to: rp-b1, label: 管理操作を送信, evidence: [{type: doc, ref: docs/reference-redpanda.md#§8}]}
      - {id: rp-repl, from: rp-b1, to: rp-b2, label: Raft で複製, evidence: [{type: doc, ref: docs/reference-redpanda.md#§8}]}
      - {id: rp-save, from: rp-b1, to: rp-disk, label: ログに追記, evidence: [{type: doc, ref: docs/reference-redpanda.md#§8}]}
      - {id: rp-tier, from: rp-b1, to: rp-store, label: セグメントを退避, evidence: [{type: doc, ref: docs/reference-redpanda.md#§8}]}
    groups:
      - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [rp-b1, rp-b2, rp-disk]}
    layout2d:
      tiers:
        - {id: diagram, label: クライアント・Redpanda・ストレージ, z: 0, size: [28, 12]}
      nodes:
        rp-client: {tier: diagram, x: 1, y: 4}
        rp-console: {tier: diagram, x: 1, y: 8.5}
        rp-b1: {tier: diagram, x: 9, y: 4}
        rp-b2: {tier: diagram, x: 17, y: 1.5}
        rp-disk: {tier: diagram, x: 17, y: 5.5}
        rp-store: {tier: diagram, x: 17, y: 9.5}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [rp-b1, rp-b2, rp-disk]}
    layout3d:
      tiers:
        - {id: clients, label: クライアント, z: 0, size: [6, 12]}
