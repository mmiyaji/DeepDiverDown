  source:
    label: 取り込みアダプター
    kind: worker
    shape3D: plug
    tier: flow
    x: 4
    'y': 1.5
    description: 既存データと後続の変更を業務データベースから取り込む。
    evidence:
      - type: doc
        ref: docs/reference-kafka-connect.md#§1
      - type: doc
        ref: docs/reference-kafka-connect.md#§2
      - type: doc
        ref: docs/reference-kafka-connect.md#§3
      - type: doc
        ref: docs/reference-kafka-connect.md#§7
  kafka:
    label: 変更イベントのログ
    kind: queue
    tier: flow
    x: 8
    'y': 1.5
    description: 受注データのイベントを保持し、出力アダプターの読み取りに応じる。
    evidence:
      - type: doc
        ref: docs/reference-kafka-connect.md#§3
  sink:
    label: 出力アダプター
    kind: worker
    shape3D: plug
    tier: flow
    x: 12
    'y': 1.5
    description: イベントログを購読し、対象を保存先へ書き込む。
    evidence:
      - type: doc
        ref: docs/reference-kafka-connect.md#§1
      - type: doc
        ref: docs/reference-kafka-connect.md#§4
      - type: doc
        ref: docs/reference-kafka-connect.md#§7
  destination:
    label: 保存先（オブジェクトストレージ）
    kind: db
    shape3D: crate
    tier: flow
    x: 16
    'y': 1.5
    description: 受注イベントを下流の処理や分析用に保存する例。
    evidence:
      - type: doc
        ref: docs/reference-kafka-connect.md#§4
  worker:
    label: タスク実行基盤
    kind: service
    tier: operation
    x: 1
    'y': 1.5
    description: アダプターのタスクを起動し、実行を分担する。
    evidence:
      - type: doc
        ref: docs/reference-kafka-connect.md#§1
      - type: doc
        ref: docs/reference-kafka-connect.md#§6
  offsets:
    label: 再開位置の保存領域
    kind: db
    tier: operation
    x: 7
    'y': 1.5
    description: 入力元の位置と下流の購読位置を模式的に表す。
    evidence:
      - type: doc
        ref: docs/reference-kafka-connect.md#§5
      - type: doc
        ref: docs/reference-kafka-connect.md#§6
links:
  - id: start-source
    from: worker
    to: source
    label: 取り込みタスクを起動
    evidence:
      - type: doc
        ref: docs/reference-kafka-connect.md#§1
  - id: start-sink
    from: worker
    to: sink
    label: 出力タスクを起動
    evidence:
      - type: doc
        ref: docs/reference-kafka-connect.md#§1
  - id: capture
    from: database
    to: source
    label: スナップショット・変更取得
    evidence:
      - type: doc
        ref: docs/reference-kafka-connect.md#§2
  - id: publish
    from: source
    to: kafka
    label: イベントを発行
    evidence:
      - type: doc
        ref: docs/reference-kafka-connect.md#§3
  - id: fetch
    from: kafka
    to: sink
    label: 取得したイベント
    evidence:
      - type: doc
        ref: docs/reference-kafka-connect.md#§4
  - id: write
    from: sink
    to: destination
    label: 保存先に書き込む
    evidence:
      - type: doc
        ref: docs/reference-kafka-connect.md#§4
  - id: source-offset
    from: source
    to: offsets
    label: 入力元の読み取り位置を保存
    evidence:
      - type: doc
        ref: docs/reference-kafka-connect.md#§5
  - id: sink-offset
    from: sink
    to: offsets
    label: 次に読むイベントの位置を保存
    evidence:
      - type: doc
        ref: docs/reference-kafka-connect.md#§5
  - id: resume
    from: offsets
    to: sink
    label: 保存した位置を読み戻して購読を再開
    evidence:
      - type: doc
        ref: docs/reference-kafka-connect.md#§5
scenarios:
  - id: delivery
    label: 外部DBから保存先まで
    evidence:
      - type: doc
        ref: docs/reference-kafka-connect.md#§1
      - type: doc
        ref: docs/reference-kafka-connect.md#§2
      - type: doc
        ref: docs/reference-kafka-connect.md#§3
      - type: doc
        ref: docs/reference-kafka-connect.md#§4
      - type: doc
        ref: docs/reference-kafka-connect.md#§5
    steps:
      - links:
          - start-source
          - start-sink
        note: 起動。Connect Worker が Source Task と Sink Task を実行する。
      - links:
          - capture
        note: 取り込み。初回は受注テーブルのスナップショットを取り、その後は PostgreSQL の変更ログを読む例。
      - links:
          - publish
          - source-offset
        note: 発行。Source Task が受注イベントを Kafka Topic に送り、ソース側の読み取り位置を記録する。
      - links:
          - fetch
        note: 取得。Sink Task が Kafka Topic を購読し、自分の進捗に従ってイベントを取りに行く。
      - links:
          - write
        note: 保存。Sink Task が受注イベントをオブジェクトストレージへ書き込む。
      - links:
          - sink-offset
        note: 進捗を保存。Sink 側は次に読む Kafka の位置を Consumer Group のオフセットとしてコミットする。
  - id: sink-restart
    label: Sink Task の再開
    evidence:
      - type: doc
        ref: docs/reference-kafka-connect.md#§1
      - type: doc
        ref: docs/reference-kafka-connect.md#§4
      - type: doc
        ref: docs/reference-kafka-connect.md#§5
    steps:
      - links:
          - start-sink
          - resume
        note: 再開。Sink Task が再起動すると、コミット済みの位置を参照する。
      - links:
          - fetch
          - write
        note: 再取得。保存済みでも進捗が未コミットだった範囲は、再び取得・処理される場合がある。
      - links:
          - sink-offset
        note: 進捗をコミット。再処理時に重複を防げるかは、コネクターと出力方式に依存する。
