"note":"11 月のパーティションのデータファイル"},{"id":"m05r","label":"2026-05（復元）","k":2,"from":["m05"],"note":"復元して一時的に読めるようにしたコピー"}],"ia":[{"id":"m08","label":"2026-08","k":1,"note":"08 月のパーティションのデータファイル"},{"id":"m09","label":"2026-09","k":1,"note":"09 月のパーティションのデータファイル"}],"arc":[{"id":"m05","label":"2026-05","k":3,"note":"05 月のパーティションのデータファイル"},{"id":"m06","label":"2026-06","k":3,"note":"06 月のパーティションのデータファイル"},{"id":"m07","label":"2026-07","k":3,"note":"07 月のパーティションのデータファイル"}]},"highlight":["m05r"],"lanes":{"arc":{"sub":"復元に数時間かかることがある"}},"links":["list-data"],"note":"5 月の監査で古いデータが必要になったら、アーカイブから復元して一時的なコピーを読む。クエリが触れる範囲を誤って移すと、読み取りが失敗する。"}]}
