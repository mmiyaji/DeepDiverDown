name: データレイクハウスの基本アーキテクチャ（Apache Iceberg 例）
description: 計算、Catalog、Iceberg のメタデータ、オブジェクトストレージ上のデータを分離して追うリファレンスです。
reference:
  objectives:
    - 計算エンジン、Catalog、snapshot/manifest、データファイルの役割を区別する。
    - Iceberg の metadata tree から必要なデータファイルを選ぶ流れを理解する。
    - 書き込みコミットでテーブルの snapshot が切り替わることを追う。
  sources:
    - title: Databricks Reference Architectures
      url: https://docs.databricks.com/aws/en/lakehouse-architecture/reference
    - title: Apache Iceberg Terms
      url: https://iceberg.apache.org/terms/
    - title: Apache Iceberg Java API
      url: https://iceberg.apache.org/docs/latest/api/
sources:
  - docs/reference-data-lakehouse.md
evidence:
  - type: doc
    ref: docs/reference-data-lakehouse.md#§1
tiers:
  - id: lakehouse
    label: 計算・Catalog・データとメタデータ
    kind: origin
    z: 0
    size:
      - 18
      - 3
nodes:
  engine:
    label: Compute Engine
    kind: service
    tier: lakehouse
    x: 0
    'y': 1.5
    description: ETL とクエリを実行し、テーブルを読み書きする。
    evidence:
      - type: doc
        ref: docs/reference-data-lakehouse.md#§2
  catalog:
    label: Catalog
    kind: service
    tier: lakehouse
    x: 4
    'y': 0.8
    description: テーブル名、場所、スキーマを解決する入口。
    evidence:
      - type: doc
        ref: docs/reference-data-lakehouse.md#§3
  snapshot:
    label: Iceberg Snapshot
    kind: db
    tier: lakehouse
    x: 8
    'y': 1.5
    description: ある時点のテーブル状態を指す。
    evidence:
      - type: doc
        ref: docs/reference-data-lakehouse.md#§4
  manifests:
    label: Manifest List / Files
    kind: db
    tier: lakehouse
    x: 12
    'y': 1.5
    description: Snapshot を構成するデータファイルと統計を列挙する。
    evidence:
      - type: doc
        ref: docs/reference-data-lakehouse.md#§4
  data:
    label: Data Files
    kind: db
    tier: lakehouse
    x: 16
    'y': 1.5
    description: オブジェクトストレージに置かれたテーブル行データ。
    evidence:
      - type: doc
        ref: docs/reference-data-lakehouse.md#§2
  metadata:
    label: Table Metadata
    kind: db
    tier: lakehouse
    x: 16
    'y': 2.7
    description: スキーマ、snapshot、manifest への参照を保持する。
    evidence:
      - type: doc
        ref: docs/reference-data-lakehouse.md#§4
links:
  - id: resolve
    from: engine
    to: catalog
    label: テーブルを解決
    evidence:
      - type: doc
        ref: docs/reference-data-lakehouse.md#§3
  - id: commit
    from: engine
    to: snapshot
    label: 新しい snapshot をコミット
    evidence:
      - type: doc
        ref: docs/reference-data-lakehouse.md#§5
  - id: index
    from: snapshot
    to: manifests
    label: manifest を参照
    evidence:
      - type: doc
        ref: docs/reference-data-lakehouse.md#§4
  - id: list-data
    from: manifests
    to: data
    label: 必要なデータファイルを選択
    evidence:
      - type: doc
        ref: docs/reference-data-lakehouse.md#§4
  - id: write-data
    from: engine
    to: data
    label: データファイルを書き込む
    evidence:
      - type: doc
        ref: docs/reference-data-lakehouse.md#§5
  - id: write-meta
    from: engine
    to: metadata
    label: テーブルメタデータを更新
    evidence:
      - type: doc
        ref: docs/reference-data-lakehouse.md#§5
scenarios:
  - id: iceberg-read-write
    label: Iceberg テーブルの書き込みと読み出し
    evidence:
      - type: doc
        ref: docs/reference-data-lakehouse.md#§1
      - type: doc
        ref: docs/reference-data-lakehouse.md#§6
    steps:
      - links:
          - resolve
          - write-data
          - write-meta
        note: 計算エンジンが Catalog でテーブルを解決し、データとメタデータを書き込む。
      - links:
          - commit
          - index
        note: コミットで新しい snapshot が manifest を参照する。
      - links:
          - list-data
        note: 読み手は manifest の情報から必要なデータファイルだけを選ぶ。
  - id: tiering
    label: 古いデータを安い保存先へ移す
    visual: tiers
    evidence:
      - type: doc
        ref: docs/reference-data-lakehouse.md#§7
    steps:
      - blocks:
          std:
            - id: m05
              label: 2026-05
              k: 0
              note: 05 月のパーティションのデータファイル
            - id: m06
              label: 2026-06
              k: 0
              note: 06 月のパーティションのデータファイル
            - id: m07
              label: 2026-07
              k: 0
              note: 07 月のパーティションのデータファイル
            - id: m08
              label: 2026-08
              k: 0
              note: 08 月のパーティションのデータファイル
            - id: m09
              label: 2026-09
              k: 0
              note: 09 月のパーティションのデータファイル
            - id: m10
              label: 2026-10
              k: 0
              note: 10 月のパーティションのデータファイル
            - id: m11
              label: 2026-11
              k: 0
              note: 11 月のパーティションのデータファイル
          ia: []
          arc: []
        links:
          - write-data
        note: 書いたばかりのデータファイルはすべて Standard にある。
      - blocks:
          std:
            - id: m09
              label: 2026-09
              k: 0
              note: 09 月のパーティションのデータファイル
            - id: m10
              label: 2026-10
              k: 0
              note: 10 月のパーティションのデータファイル
            - id: m11
              label: 2026-11
              k: 0
              note: 11 月のパーティションのデータファイル
          ia:
            - id: m05
              label: 2026-05
              k: 1
              note: 05 月のパーティションのデータファイル
            - id: m06
              label: 2026-06
              k: 1
              note: 06 月のパーティションのデータファイル
            - id: m07
              label: 2026-07
              k: 1
              note: 07 月のパーティションのデータファイル
            - id: m08
              label: 2026-08
              k: 1
              note: 08 月のパーティションのデータファイル
          arc: []
        links:
          - list-data
        note: ライフサイクルルールで、作成から 90 日を過ぎたファイルを低頻度アクセスへ移す。
      - blocks:
          std:
            - id: m10
              label: 2026-10
              k: 0
              note: 10 月のパーティションのデータファイル
            - id: m11
              label: 2026-11
              k: 0
              note: 11 月のパーティションのデータファイル
          ia:
            - id: m08
              label: 2026-08
              k: 1
              note: 08 月のパーティションのデータファイル
            - id: m09
              label: 2026-09
              k: 1
              note: 09 月のパーティションのデータファイル
          arc:
            - id: m05
              label: 2026-05
              k: 3
              note: 05 月のパーティションのデータファイル
            - id: m06
              label: 2026-06
              k: 3
              note: 06 月のパーティションのデータファイル
            - id: m07
              label: 2026-07
              k: 3
              note: 07 月のパーティションのデータファイル
        links:
          - list-data
        note: さらに 180 日を過ぎたファイルをアーカイブへ移す。保存料金は下がるが、そのままでは読めない。
      - blocks:
          std:
            - id: m10
              label: 2026-10
              k: 0
              note: 10 月のパーティションのデータファイル
            - id: m11
              label: 2026-11
              k: 0
              note: 11 月のパーティションのデータファイル
            - id: m05r
              label: 2026-05（復元）
              k: 2
              from:
                - m05
              note: 復元して一時的に読めるようにしたコピー
          ia:
            - id: m08
              label: 2026-08
              k: 1
              note: 08 月のパーティションのデータファイル
            - id: m09
              label: 2026-09
              k: 1
              note: 09 月のパーティションのデータファイル
          arc:
            - id: m05
              label: 2026-05
              k: 3
              note: 05 月のパーティションのデータファイル
            - id: m06
              label: 2026-06
              k: 3
              note: 06 月のパーティションのデータファイル
            - id: m07
              label: 2026-07
              k: 3
              note: 07 月のパーティションのデータファイル
        highlight:
          - m05r
        lanes:
          arc:
            sub: 復元に数時間かかることがある
        links:
          - list-data
        note: 5 月の監査で古いデータが必要になったら、アーカイブから復元して一時的なコピーを読む。クエリが触れる範囲を誤って移すと、読み取りが失敗する。
blocks:
  - id: tiers
    title: ストレージ階層の移動
    legend:
      '0': Standard
      '1': 低頻度アクセス
      '2': 復元したコピー
      '3': アーカイブ
    note: 月ごとのパーティションをライフサイクルルールで移す例（日数は説明用）。
    lanes:
      - id: std
        label: Standard
        sub: すぐ読める・保存は高い
        node: data
      - id: ia
        label: 低頻度アクセス
        sub: 取り出し料金あり
        node: data
      - id: arc
        label: アーカイブ
        sub: 読む前に復元が必要
        node: data
    items:
      std:
        - id: m05
          label: 2026-05
          k: 0
          note: 05 月のパーティションのデータファイル
        - id: m06
          label: 2026-06
          k: 0
          note: 06 月のパーティションのデータファイル
        - id: m07
          label: 2026-07
          k: 0
          note: 07 月のパーティションのデータファイル
        - id: m08
          label: 2026-08
          k: 0
          note: 08 月のパーティションのデータファイル
        - id: m09
          label: 2026-09
          k: 0
          note: 09 月のパーティションのデータファイル
        - id: m10
          label: 2026-10
          k: 0
          note: 10 月のパーティションのデータファイル
        - id: m11
          label: 2026-11
          k: 0
          note: 11 月のパーティションのデータファイル
      ia: []
      arc: []
implementations:
  - id: aws-athena
    label: Amazon Athena・Glue・S3 の Iceberg
    description: Athena エンジン v3 のワークグループで、S3 の入力を Iceberg に書き込み、Glue Data Catalog で解決して検索する例。
    sources:
      - title: Apache Iceberg Terms
        url: https://iceberg.apache.org/terms/
      - title: Query Apache Iceberg tables
        url: https://docs.aws.amazon.com/athena/latest/ug/querying-iceberg.html
      - title: Create Iceberg tables
        url: https://docs.aws.amazon.com/athena/latest/ug/querying-iceberg-creating-tables.html
      - title: Athena のワークグループ
        url: https://docs.aws.amazon.com/athena/latest/ug/creating-workgroups.html
      - title: Athena の Iceberg 更新
        url: https://docs.aws.amazon.com/athena/latest/ug/querying-iceberg-updating-iceberg-table-data.html
      - title: S3 Lifecycle transition considerations
        url: >-
          https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html
      - {title: Athena serverless resilience, url: https://docs.aws.amazon.com/athena/latest/ug/security-resilience.html}
      - {title: AWS shared responsibility, url: https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/shared-responsibility.html}
    tiers:
      - {id: lakehouse, label: Athena と Iceberg テーブル, z: 0, size: [18, 4]}
      - {id: access, label: SQL の投入・アクセス管理・結果, z: 1, size: [18, 4]}
    nodes:
      aws-athena-bucket: {label: Amazon S3 table bucket, svc: s3, kind: db, tier: lakehouse, x: 18, y: 1.5, management: {type: shared, scope: "AWS operates S3; customer manages data and permissions."}, evidence: [{type: doc, ref: "docs/reference-data-lakehouse.md#§8"}]}
      aws-athena-athena:
        label: Athena ワークグループ（v3）
        kind: service
        tier: lakehouse
        x: 0
        'y': 1.5
        description: Iceberg v2 のテーブル解決と SQL 読み書きを担う。
        svc: athena
        realizes:
          - engine
        management: {type: shared, scope: "AWS operates serverless query infrastructure; customer manages queries and workgroup settings."}
        evidence:
          - type: doc
            ref: docs/reference-data-lakehouse.md#§8
      aws-athena-glue:
        label: AWS Glue Data Catalog
        kind: catalog
        tier: lakehouse
        x: 4
        'y': 0.8
        description: 現在のテーブルメタデータを指し、楽観的ロックを適用する。
        svc: glue
        realizes:
          - catalog
        management: {type: shared, scope: "AWS operates Glue; customer manages catalog content and access."}
        evidence:
          - type: doc
            ref: docs/reference-data-lakehouse.md#§8
      aws-athena-metadata:
        label: S3 の Iceberg メタデータと Snapshot
        kind: file
        tier: lakehouse
        x: 8
        'y': 1.5
        description: テーブル定義とスナップショットをファイルに保持する。
        realizes:
          - snapshot
          - metadata
        management: {type: customer, scope: "Customer manages table metadata and retention."}
        evidence:
          - type: doc
            ref: docs/reference-data-lakehouse.md#§8
        svc: s3
      aws-athena-manifest:
        label: S3 の Manifest List と Manifest
        kind: file
        tier: lakehouse
        x: 12
        'y': 1.5
        description: 対象スナップショットのファイルと統計を格納する。
        realizes:
          - manifests
        management: {type: customer, scope: "Customer manages table metadata and retention."}
        evidence:
          - type: doc
            ref: docs/reference-data-lakehouse.md#§8
        svc: s3
      aws-athena-data:
        label: S3 の Parquet ファイル
        kind: file
        tier: lakehouse
        x: 16
        'y': 1.5
        description: テーブルの行データを保存する。
        realizes:
          - data
        management: {type: customer, scope: "Customer manages table data and retention."}
        evidence:
          - type: doc
            ref: docs/reference-data-lakehouse.md#§8
        svc: s3
      aws-athena-lifecycle:
        label: S3 Lifecycle ルール
        kind: policy
        tier: lakehouse
        x: 14
        'y': 0.15
        description: データの利用頻度に応じて対象オブジェクトの保存クラスを変える。
        management: {type: customer, scope: "Customer configures lifecycle policy."}
        evidence:
          - type: doc
            ref: docs/reference-data-lakehouse.md#§8
      aws-athena-client: {label: Athena の SQL 利用者, kind: actor, tier: access, x: 1, y: 1.5, description: Athena のコンソールから取り込みや検索の SQL を送る。, evidence: [{type: doc, ref: docs/reference-data-lakehouse.md#§8}]}
      aws-athena-input: {label: S3 の入力 Parquet, kind: db, svc: s3, tier: access, x: 6, y: 1.5, description: Glue に登録した入力テーブルの元ファイルを保持する。, management: {type: shared, scope: "AWS operates S3; customer manages input data and access."}, evidence: [{type: doc, ref: docs/reference-data-lakehouse.md#§8}]}
      aws-athena-permissions: {label: IAM の利用権限, kind: policy, svc: iam, tier: access, x: 11, y: 1.5, description: 操作ごとにワークグループと Glue・S3 への権限を設定する。, management: {type: customer, scope: "Customer configures IAM permissions."}, evidence: [{type: doc, ref: docs/reference-data-lakehouse.md#§8}]}
      aws-athena-results: {label: S3 のクエリ結果, kind: db, svc: s3, tier: access, x: 16, y: 1.5, description: ワークグループで指定した結果保存先。Iceberg テーブルの LOCATION とは異なる。, management: {type: shared, scope: "AWS operates S3; customer manages results and access."}, evidence: [{type: doc, ref: docs/reference-data-lakehouse.md#§8}]}
    links:
      - {id: aws-athena-bucket-files, from: aws-athena-bucket, to: aws-athena-data, label: "Store table files", evidence: [{type: doc, ref: "docs/reference-data-lakehouse.md#§8"}]}
      - {id: aws-athena-submit, from: aws-athena-client, to: aws-athena-athena, label: INSERT または SELECT を実行, evidence: [{type: doc, ref: docs/reference-data-lakehouse.md#§8}]}
      - {id: aws-athena-input-scan, from: aws-athena-input, to: aws-athena-athena, label: 取り込み元の Parquet を読む, evidence: [{type: doc, ref: docs/reference-data-lakehouse.md#§8}]}
      - {id: aws-athena-authorize, from: aws-athena-permissions, to: aws-athena-athena, label: クエリとテーブル操作を許可, evidence: [{type: doc, ref: docs/reference-data-lakehouse.md#§8}]}
      - {id: aws-athena-save-result, from: aws-athena-athena, to: aws-athena-results, label: SELECT の結果を書き出す, evidence: [{type: doc, ref: docs/reference-data-lakehouse.md#§8}]}
      - {id: aws-athena-read-result, from: aws-athena-results, to: aws-athena-client, label: 許可された結果を取得, evidence: [{type: doc, ref: docs/reference-data-lakehouse.md#§8}]}
      - id: aws-athena-locate
        from: aws-athena-glue
        to: aws-athena-metadata
        label: 現行メタデータの場所を解決
        evidence:
          - type: doc
            ref: docs/reference-data-lakehouse.md#§8
      - id: aws-athena-tiering
        from: aws-athena-lifecycle
        to: aws-athena-data
        label: 対象ファイルのストレージクラスを移行
        evidence:
          - type: doc
            ref: docs/reference-data-lakehouse.md#§8
    groups:
      - {kind: cloud, provider: aws, label: AWS account, tier: [lakehouse, access], nodes: [aws-athena-athena, aws-athena-glue, aws-athena-input, aws-athena-bucket, aws-athena-metadata, aws-athena-manifest, aws-athena-data, aws-athena-lifecycle, aws-athena-permissions, aws-athena-results]}
    layout2d:
      tiers: [{id: diagram, label: Athena and storage, z: 0, size: [26, 12]}]
      nodes:
        aws-athena-client: {tier: diagram, x: 2, y: 1}
        aws-athena-athena: {tier: diagram, x: 6, y: 1}
        aws-athena-glue: {tier: diagram, x: 10, y: 1}
        aws-athena-input: {tier: diagram, x: 14, y: 1}
        aws-athena-bucket: {tier: diagram, x: 18, y: 1}
        aws-athena-metadata: {tier: diagram, x: 22, y: 1}
        aws-athena-manifest: {tier: diagram, x: 2, y: 5}
        aws-athena-data: {tier: diagram, x: 6, y: 5}
        aws-athena-lifecycle: {tier: diagram, x: 10, y: 5}
        aws-athena-permissions: {tier: diagram, x: 14, y: 5}
        aws-athena-results: {tier: diagram, x: 18, y: 5}
      groups:
        - {kind: cloud, provider: aws, label: AWS account, tier: diagram, nodes: [aws-athena-athena, aws-athena-glue, aws-athena-input, aws-athena-bucket, aws-athena-metadata, aws-athena-manifest, aws-athena-data, aws-athena-lifecycle, aws-athena-permissions, aws-athena-results]}
    layout3d:
      tiers:
        - {id: services, label: AWS managed services and data, z: 0, size: [24, 6]}
        - {id: outside, label: SQL user, kind: origin, z: 0, origin: [-4, 0], size: [2, 3]}
      nodes:
        aws-athena-client: {tier: outside, x: 0, y: 1.5}
        aws-athena-athena: {tier: services, x: 2, y: 1}
        aws-athena-glue: {tier: services, x: 6, y: 1}
        aws-athena-input: {tier: services, x: 10, y: 1}
        aws-athena-bucket: {tier: services, x: 14, y: 1}
        aws-athena-metadata: {tier: services, x: 18, y: 1}
        aws-athena-manifest: {tier: services, x: 2, y: 4}
        aws-athena-data: {tier: services, x: 6, y: 4}
        aws-athena-lifecycle: {tier: services, x: 10, y: 4}
        aws-athena-permissions: {tier: services, x: 14, y: 4}
        aws-athena-results: {tier: services, x: 18, y: 4}
      groups:
        - {kind: cloud, provider: aws, label: AWS account, tier: services, nodes: [aws-athena-athena, aws-athena-glue, aws-athena-input, aws-athena-bucket, aws-athena-metadata, aws-athena-manifest, aws-athena-data, aws-athena-lifecycle, aws-athena-permissions, aws-athena-results]}
