name: Databricks Delta：Liquid Clustering・Deletion Vector・ファイル読み飛ばし
description: Delta 管理テーブルで、キーによる再配置、行の論理削除、統計と実行時キーによる読み飛ばしを、Delta ログを軸に追う。図は公開情報に基づく論理モデル。2026 年 11 月時点。
parent: {model: databricks, node: storage}
reference:
  objectives:
    - キー設定と既存ファイルの再配置を区別する。
    - Deletion Vector が Parquet を書き換えずに行を無効にし、PURGE と VACUUM が別段階であることを追う。
    - ファイル統計と JOIN の実行時キーによる読み飛ばしを、Delta ログからたどる。
  sources:
    - {title: "Liquid clustering", url: https://docs.databricks.com/aws/en/tables/clustering}
    - {title: "Delta clustered table protocol", url: https://github.com/delta-io/delta/blob/master/PROTOCOL.md#clustered-table}
    - {title: "Deletion vectors", url: https://docs.databricks.com/aws/en/tables/features/deletion-vectors}
    - {title: "Delta Lake protocol: Deletion Vectors", url: https://github.com/delta-io/delta/blob/master/PROTOCOL.md#deletion-vectors}
    - {title: "Data skipping", url: https://docs.databricks.com/aws/en/tables/data-skipping}
    - {title: "Dynamic file pruning", url: https://docs.databricks.com/aws/en/optimizations/dynamic-file-pruning}
    - {title: "Predictive optimization", url: https://docs.databricks.com/aws/en/optimizations/predictive-optimization}
    - {title: "Optimize data file layout", url: https://docs.databricks.com/aws/en/tables/operations/optimize}
    - {title: "Delta protocol compatibility", url: https://docs.databricks.com/aws/en/delta/feature-compatibility}
    - {title: "Managed storage", url: https://docs.databricks.com/aws/en/connect/unity-catalog/cloud-storage/managed-storage}
    - {title: "Liquid Clustering のデータ配置とファイル統計", url: https://www.databricks.com/blog/debunking-8-data-layout-myths-why-liquid-clustering-outperforms-partitioning}
sources: [docs/reference-databricks-liquid-clustering-internals.md]
evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§8"}, {type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§1"}, {type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§3"}, {type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§4"}]
tiers:
  - {id: control, label: キー選択と SQL の発行, z: 2, size: [22, 4]}
  - {id: compute, label: 保守と検索, z: 1, size: [22, 4]}
  - {id: storage, label: Delta ログと Parquet ファイル, z: 0, size: [22, 4]}
nodes:
  operator: {label: 利用者の SQL, kind: client, tier: control, x: 0, 'y': 1.5, description: CLUSTER BY の設定、OPTIMIZE、DELETE / UPDATE / MERGE、条件付き検索を発行する。, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  workload: {label: クエリ履歴と AUTO のキー選択, kind: service, tier: control, x: 8, 'y': 1.5, description: CLUSTER BY AUTO は検索条件などの傾向を分析する。Predictive Optimization と条件を要し、キーが選ばれない場合もある。, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  optimize: {label: 再配置・書き換えの実行, kind: worker, tier: compute, x: 0, 'y': 1.5, description: OPTIMIZE は対象ファイルをクラスタリング列に沿って再編成する。通常は増分で、FULL は既存の配置も見直す。REORG TABLE APPLY PURGE は Deletion Vector を適用して書き換える。, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  query: {label: ファイル統計による読み飛ばし, kind: worker, tier: compute, x: 8, 'y': 1.5, description: クエリ条件とファイルごとの最小値・最大値から候補を絞る。範囲が重なるファイルは候補に残る。, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  dfp: {label: JOIN の実行時キーによる絞り込み, kind: worker, tier: compute, x: 15, 'y': 1.5, description: 小さい側の結果から得た JOIN キーを、大きい側のファイル統計と照合して読み飛ばす（Dynamic File Pruning）。適用はクエリ形状と条件による。, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  oldfiles: {label: 変更前の Parquet ファイル, kind: db, tier: storage, x: 0, 'y': 1.5, description: 現行スナップショットの Parquet ファイル。キー変更だけでは書き換わらない。, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  newfiles: {label: 再配置後の Parquet ファイル, kind: db, tier: storage, x: 5, 'y': 1.5, description: OPTIMIZE や PURGE が書き出す Parquet。キーの局所性に沿って値域がそろう。, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  dv: {label: Deletion Vector, kind: file, tier: storage, x: 10, 'y': 1.5, description: Parquet を書き換えず、無効にした行の位置だけを記録する。読み取り時に除外する。, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  log: {label: Delta ログ（版・統計・clustering 設定）, kind: db, tier: storage, x: 16, 'y': 1.5, description: add / remove と DV の参照、ファイル統計、domainMetadata の delta.clustering を保持する。クラスタリングされた add に clusteringProvider を記録する。, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
links:
  - {id: manual, from: operator, to: log, label: クラスタリング列を記録, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  - {id: trend, from: workload, to: log, label: AUTO で選んだキーを記録, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  - {id: launch, from: operator, to: optimize, label: OPTIMIZE を指示, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  - {id: read, from: oldfiles, to: optimize, label: 対象ファイルを読む, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  - {id: write, from: optimize, to: newfiles, label: 新しいファイルを書く, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  - {id: commit, from: optimize, to: log, label: add / remove をコミット, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  - {id: mutate, from: operator, to: dv, label: DELETE / UPDATE / MERGE, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  - {id: dvlog, from: dv, to: log, label: DV の参照をコミット, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  - {id: purge, from: dv, to: optimize, label: REORG PURGE で DV を適用, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  - {id: snapshot, from: log, to: query, label: 有効ファイルと統計を取得, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  - {id: mask, from: dv, to: query, label: 無効な行を除外, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  - {id: dfpstats, from: log, to: dfp, label: ファイル統計を渡す, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  - {id: dfpskip, from: dfp, to: query, label: 一致しないファイルを除外, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
  - {id: scan, from: newfiles, to: query, label: 候補ファイルを読む, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§2"}]}
scenarios:
  - id: recluster
    label: 増分の配置とコミット
    visual: layout
    evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§3"}]
    steps:
      - {links: [manual], note: クラスタリング列を Delta ログに記録する。, highlight: [policy, logitem]}
      - {links: [launch, read], note: OPTIMIZE が対象ファイルを読む。, highlight: [old1, old2]}
      - {links: [write, commit], note: 新ファイルを書き、add / remove をコミットして表の状態を更新する。, highlight: [new1, new2, logitem]}
      - {links: [snapshot, scan], note: 後続の検索が現行スナップショットと統計で候補を絞る。, highlight: [new1, new2, statitem]}
  - id: key-change
    label: キー変更と既存ファイル
    visual: layout
    evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§4"}]
    steps:
      - {links: [manual], note: 新しいキーを設定するが、既存ファイルは書き換えない。, highlight: [policy, old1, old2]}
      - {links: [launch, read], note: 通常の増分 OPTIMIZE と FULL の対象範囲を区別する。, highlight: [old1, old2]}
      - {links: [write, commit], note: 必要に応じ FULL で現在のキーに合わせて再編成する。, highlight: [new1, new2, logitem]}
  - id: delete-vector
    label: 行の削除と Deletion Vector
    visual: layout
    evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§5"}]
    steps:
      - {links: [mutate, dvlog], note: DELETE で無効な行の位置を DV に記録し、add の参照をコミットする。, highlight: [dvitem, logitem]}
      - {links: [snapshot, mask], note: 読み手はスナップショットのファイルを読み、DV の行を除く。, highlight: [new1, dvitem]}
      - {links: [purge, write, commit], note: REORG PURGE が DV を適用して書き換える。旧ファイルの物理削除は VACUUM と保持期間による。, highlight: [new1, logitem]}
  - id: runtime-pruning
    label: JOIN の実行時キーで絞る
    visual: layout
    evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§6"}]
    steps:
      - {links: [snapshot, dfpstats], note: 大きい側のファイル統計を取得する。, highlight: [statitem]}
      - {links: [dfpskip, scan], note: 小さい側から得たキーに合わないファイルを除き、残りを読む。, highlight: [new1, new2]}
unknowns:
  - {id: unverified, text: 実環境のファイル数・読み飛ばし率・保守費用は未検証。Dynamic File Pruning の適用条件の最新版は未確認。, refs: [dfp, optimize]}
blocks:
  - id: layout
    title: 配置と Delta ログの例
    note: 値域・ファイル名は説明用。再配置の前後が同じスナップショットで同時に有効という意味ではない。
    hint: シナリオのステップに合わせ、設定・旧ファイル・新ファイル・DV とログの役割を確認できる。
    lanes:
      - {id: settings, label: 設定, node: operator}
      - {id: old, label: 再配置前, node: oldfiles}
      - {id: new, label: 再配置後, node: newfiles}
      - {id: dvl, label: 行の無効化, node: dv}
      - {id: meta, label: 表のメタデータ, node: log}
    items:
      settings:
        - {id: policy, label: CLUSTER BY (日付), k: 0, note: 表のクラスタリング列。キー変更だけでは既存ファイルは書き換わらない。}
      old:
        - {id: old1, label: '旧 A：1/01〜1/28', k: 1, note: 値域が広い例。}
        - {id: old2, label: '旧 B：1/02〜1/31', k: 1, note: 値域が重複する例。}
      new:
        - {id: new1, label: '新 C：1/01〜1/14', k: 2, note: 再配置後、範囲を絞ったファイルの例。}
        - {id: new2, label: '新 D：1/15〜1/31', k: 3, note: 範囲が異なる再配置後ファイルの例。}
      dvl:
        - {id: dvitem, label: '新 C の 3・7 行目', k: 4, note: 無効にした行の位置。Parquet 自体は変わらない。}
      meta:
        - {id: logitem, label: add / remove / DV 参照, k: 5, note: Delta ログがスナップショットの有効ファイルを表す。}
        - {id: statitem, label: min / max, k: 6, note: 条件とファイル統計を比較し読み飛ばす。}
implementations:
  - id: aws
    label: AWS 上の管理 Delta テーブルと Serverless
    description: Unity Catalog 管理 Delta テーブルの Parquet・DV・ログを顧客 AWS アカウントの S3 に置き、検索は SQL Warehouse、Predictive Optimization の保守は Databricks のサーバーレス Jobs で実行する例。公式資料を組み合わせた構成例で、動作検証済みの導入事例ではない。
    sources:
      - {title: "Liquid clustering", url: https://docs.databricks.com/aws/en/tables/clustering}
      - {title: "Delta clustered table protocol", url: https://github.com/delta-io/delta/blob/master/PROTOCOL.md#clustered-table}
      - {title: "Deletion vectors", url: https://docs.databricks.com/aws/en/tables/features/deletion-vectors}
      - {title: "Delta Lake protocol: Deletion Vectors", url: https://github.com/delta-io/delta/blob/master/PROTOCOL.md#deletion-vectors}
      - {title: "Data skipping", url: https://docs.databricks.com/aws/en/tables/data-skipping}
      - {title: "Dynamic file pruning", url: https://docs.databricks.com/aws/en/optimizations/dynamic-file-pruning}
      - {title: "Predictive optimization", url: https://docs.databricks.com/aws/en/optimizations/predictive-optimization}
      - {title: "Optimize data file layout", url: https://docs.databricks.com/aws/en/tables/operations/optimize}
      - {title: "Delta protocol compatibility", url: https://docs.databricks.com/aws/en/delta/feature-compatibility}
      - {title: "Managed storage", url: https://docs.databricks.com/aws/en/connect/unity-catalog/cloud-storage/managed-storage}
      - {title: "Liquid Clustering のデータ配置とファイル統計", url: https://www.databricks.com/blog/debunking-8-data-layout-myths-why-liquid-clustering-outperforms-partitioning}
    tiers:
      - {id: control, label: キー選択と SQL の発行, z: 2, size: [22, 4]}
      - {id: compute, label: 保守と検索, z: 1, size: [22, 4]}
      - {id: storage, label: Delta ログと Parquet ファイル, z: 0, size: [22, 4]}
    nodes:
      ex-operator: {label: 利用者の SQL（SQL Editor・ジョブ）, kind: client, tier: control, x: 0, 'y': 1.5, realizes: [operator], description: CLUSTER BY、OPTIMIZE、DML、検索を発行する。, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§7"}]}
      ex-workload: {label: 自動 Liquid Clustering, kind: service, tier: control, x: 8, 'y': 1.5, realizes: [workload], description: 対象の管理テーブルで検索傾向から AUTO のキーを選ぶ。Predictive Optimization を要する。, svc: databricks:delta, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§7"}]}
      ex-optimize: {label: Serverless Jobs の OPTIMIZE・REORG, kind: worker, tier: compute, x: 0, 'y': 1.5, realizes: [optimize], description: Predictive Optimization の保守は serverless jobs compute で実行する。手動実行は対応する計算環境を選ぶ。, svc: databricks:platform, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§7"}]}
      ex-query: {label: SQL Warehouse の data skipping, kind: worker, tier: compute, x: 8, 'y': 1.5, realizes: [query], description: Delta ログのファイル統計で候補を絞る。, svc: databricks:sql, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§7"}]}
      ex-dfp: {label: Dynamic File Pruning, kind: worker, tier: compute, x: 15, 'y': 1.5, realizes: [dfp], description: JOIN の実行時キーで大きい側のファイルを絞る。適用条件を満たす場合に働く。, svc: databricks:sql, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§7"}]}
      ex-oldfiles: {label: S3 の旧 Parquet ファイル, kind: db, tier: storage, x: 0, 'y': 1.5, realizes: [oldfiles], description: 現行スナップショットの Parquet ファイル。, svc: aws:s3, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§7"}]}
      ex-newfiles: {label: S3 の新 Parquet ファイル, kind: db, tier: storage, x: 5, 'y': 1.5, realizes: [newfiles], description: OPTIMIZE や PURGE が書き出す Parquet。, svc: aws:s3, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§7"}]}
      ex-dv: {label: S3 の Deletion Vector, kind: file, tier: storage, x: 10, 'y': 1.5, realizes: [dv], description: 無効な行の位置を記録するファイル。, svc: aws:s3, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§7"}]}
      ex-log: {label: S3 の Delta transaction log, kind: db, tier: storage, x: 16, 'y': 1.5, realizes: [log], description: 版・統計・clustering 設定・DV の参照を保持する。, svc: aws:s3, evidence: [{type: doc, ref: "docs/reference-databricks-liquid-clustering-internals.md#§7"}]}
    groups:
      - {kind: cloud, provider: databricks, label: Databricks 管理・サーバーレス計算（論理範囲）, tier: [control, compute], nodes: [ex-workload, ex-optimize, ex-query, ex-dfp]}
      - {kind: cloud, provider: aws, label: 顧客 AWS アカウント：S3 管理ストレージ, tier: storage, nodes: [ex-oldfiles, ex-newfiles, ex-dv, ex-log]}
