name: "LSM ツリーのフラッシュとコンパクション"
description: 書き込みが MemTable から SSTable へフラッシュされ、コンパクションで階層を下りながらまとめ直される流れを追います。
reference:
  objectives:
    - WAL と MemTable による速い書き込みと、フラッシュで SSTable ができる流れを説明する。
    - L0 の重なり、レベル型コンパクションで階層を下りながらマージする理由を理解する。
    - 読み取りが MemTable と各階層を順に確認する流れと、書き込み増幅の費用を説明する。
  sources:
    - {title: RocksDB Wiki - Compaction, url: "https://github.com/facebook/rocksdb/wiki/Compaction"}
    - {title: Apache Cassandra - Compaction, url: "https://cassandra.apache.org/doc/latest/cassandra/managing/operating/compaction/index.html"}
sources: [docs/reference-lsm-compaction.md]
evidence: [{"type":"doc","ref":"docs/reference-lsm-compaction.md#§1"}]
tiers:
  - {id: app, label: アプリケーション, z: 2, size: [12, 3]}
  - {id: mem, label: メモリ, z: 1, size: [12, 3]}
  - {id: disk, label: ディスク, z: 0, size: [12, 3]}
nodes:
  client: {label: キー値を書き読むアプリ, kind: client, tier: app, x: 0, 'y': 1.5, description: キーを書き込み・読み取る。, evidence: [{type: doc, ref: docs/reference-lsm-compaction.md#§2}]}
  wal: {label: WAL, kind: db, tier: disk, x: 0, y: 1.5, description: 書き込みを先に追記する耐久化用のログ。, evidence: [{"type":"doc","ref":"docs/reference-lsm-compaction.md#§2"}]}
  memtable: {label: MemTable, kind: cache, tier: mem, x: 4, y: 1.5, description: メモリ上のキー順の表。, evidence: [{"type":"doc","ref":"docs/reference-lsm-compaction.md#§2"}]}
  l0: {label: L0 SSTables, kind: db, tier: disk, x: 4, y: 1.5, partitions: 2, description: フラッシュでできた SSTable。キー範囲が重なる。, evidence: [{"type":"doc","ref":"docs/reference-lsm-compaction.md#§3"}]}
  l1: {label: L1, kind: db, tier: disk, x: 8, y: 1.5, partitions: 3, description: キー範囲が重ならない SSTable の階層。, evidence: [{"type":"doc","ref":"docs/reference-lsm-compaction.md#§4"}]}
  l2: {label: L2, kind: db, tier: disk, x: 12, y: 1.5, partitions: 4, description: さらに大きい下の階層。, evidence: [{"type":"doc","ref":"docs/reference-lsm-compaction.md#§4"}]}
links:
  - {id: write-wal, from: client, to: wal, label: ログに追記, evidence: [{"type":"doc","ref":"docs/reference-lsm-compaction.md#§2"}]}
  - {id: write-mem, from: client, to: memtable, label: MemTable に入れる, evidence: [{"type":"doc","ref":"docs/reference-lsm-compaction.md#§2"}]}
  - {id: flush, from: memtable, to: l0, label: フラッシュ, evidence: [{"type":"doc","ref":"docs/reference-lsm-compaction.md#§3"}]}
  - {id: compact-01, from: l0, to: l1, label: L0 → L1 コンパクション, evidence: [{"type":"doc","ref":"docs/reference-lsm-compaction.md#§4"}]}
  - {id: compact-12, from: l1, to: l2, label: L1 → L2 コンパクション, evidence: [{"type":"doc","ref":"docs/reference-lsm-compaction.md#§4"}]}
  - {id: read-mem, from: client, to: memtable, label: まず MemTable, evidence: [{"type":"doc","ref":"docs/reference-lsm-compaction.md#§5"}]}
  - {id: read-l0, from: client, to: l0, label: L0 を新しい順に, evidence: [{"type":"doc","ref":"docs/reference-lsm-compaction.md#§5"}]}
  - {id: read-l1, from: client, to: l1, label: 範囲が合う 1 ファイル, evidence: [{"type":"doc","ref":"docs/reference-lsm-compaction.md#§5"}]}
scenarios:
  - {"id":"flush-compact","label":"書き込みからフラッシュ・コンパクションまで","visual":"lsm","evidence":[{"type":"doc","ref":"docs/reference-lsm-compaction.md#§6"}],"steps":[{"blocks":{"mem":[{"id":"w1","label":"put k7","k":4,"note":"MemTable に入った書き込み"},{"id":"w2","label":"put k2","k":4,"note":"MemTable に入った書き込み"},{"id":"w3","label":"put k9","k":4,"note":"MemTable に入った書き込み"},{"id":"w4","label":"put k4","k":4,"note":"MemTable に入った書き込み"}],"l0":[],"l1":[{"id":"l1a","label":"L1 k1〜k5","k":2},{"id":"l1b","label":"L1 k6〜k9","k":2}],"l2":[{"id":"l2a","label":"L2 k1〜k3","k":3},{"id":"l2b","label":"L2 k4〜k6","k":3},{"id":"l2c","label":"L2 k7〜k9","k":3}]},"highlight":["w1","w2","w3","w4"],"links":["write-wal","write-mem"],"note":"書き込みは WAL に追記し、MemTable に入れる。ディスク上の既存ファイルは書き換えない。"},{"blocks":{"mem":[],"l0":[{"id":"sst1","label":"SST a（k2〜k9）","k":0,"from":["w1","w2","w3","w4"],"note":"フラッシュで書いた SSTable。キー順に並び、不変。"}],"l1":[{"id":"l1a","label":"L1 k1〜k5","k":2},{"id":"l1b","label":"L1 k6〜k9","k":2}],"l2":[{"id":"l2a","label":"L2 k1〜k3","k":3},{"id":"l2b","label":"L2 k4〜k6","k":3},{"id":"l2c","label":"L2 k7〜k9","k":3}]},"highlight":["sst1"],"links":["flush"],"note":"MemTable が一定サイズに達すると、キー順の SSTable としてフラッシュする。"},{"blocks":{"mem":[{"id":"w5","label":"put k3","k":4},{"id":"w6","label":"put k7","k":4},{"id":"w7","label":"put k8","k":4},{"id":"w8","label":"put k1","k":4}],"l0":[{"id":"sst1","label":"SST a（k2〜k9）","k":0,"from":["w1","w2","w3","w4"],"note":"フラッシュで書いた SSTable。キー順に並び、不変。"}],"l1":[{"id":"l1a","label":"L1 k1〜k5","k":2},{"id":"l1b","label":"L1 k6〜k9","k":2}],"l2":[{"id":"l2a","label":"L2 k1〜k3","k":3},{"id":"l2b","label":"L2 k4〜k6","k":3},{"id":"l2c","label":"L2 k7〜k9","k":3}]},"highlight":["w5","w6","w7","w8"],"links":["write-wal","write-mem"],"note":"次の書き込みが新しい MemTable に入る。k7 は SST a にもあるが、既存ファイルは書き換えず、新しい値として別に持つ。"},{"blocks":{"mem":[],"l0":[{"id":"sst1","label":"SST a（k2〜k9）","k":0,"from":["w1","w2","w3","w4"],"note":"フラッシュで書いた SSTable。キー順に並び、不変。"},{"id":"sst2","label":"SST b（k1〜k8）","k":0,"from":["w5","w6","w7","w8"],"note":"2 つ目の SSTable。a とキー範囲が重なる。"}],"l1":[{"id":"l1a","label":"L1 k1〜k5","k":2},{"id":"l1b","label":"L1 k6〜k9","k":2}],"l2":[{"id":"l2a","label":"L2 k1〜k3","k":3},{"id":"l2b","label":"L2 k4〜k6","k":3},{"id":"l2c","label":"L2 k7〜k9","k":3}]},"highlight":["sst2"],"links":["flush"],"note":"次の MemTable もフラッシュする。L0 の SSTable はキー範囲が重なるので、読み取りで確認するファイルが増えていく。"},{"blocks":{"mem":[],"l0":[],"l1":[{"id":"l1c","label":"L1 k1〜k5 新","k":2,"from":["sst1","sst2","l1a"],"note":"L0 と重なる L1 のファイルをマージして書き直した。同じキーの古い値は消える。"},{"id":"l1d","label":"L1 k6〜k9 新","k":2,"from":["l1b"]}],"l2":[{"id":"l2a","label":"L2 k1〜k3","k":3},{"id":"l2b","label":"L2 k4〜k6","k":3},{"id":"l2c","label":"L2 k7〜k9","k":3}]},"highlight":["l1c","l1d"],"links":["compact-01"],"note":"L0 → L1 コンパクション：重なる SSTable と L1 のファイルを読み、キー順にマージして書き直す。同じキーの古い値と削除の印はここで消える。"},{"blocks":{"mem":[],"l0":[],"l1":[{"id":"l1d","label":"L1 k6〜k9 新","k":2,"from":["l1b"]}],"l2":[{"id":"l2d","label":"L2 k1〜k5 新","k":3,"from":["l1c","l2a","l2b"]},{"id":"l2c","label":"L2 k7〜k9","k":3}]},"highlight":["l2d"],"links":["compact-12"],"note":"L1 が大きくなると L2 へ。下の階層ほど大きく、同じデータを何度も書き直す（書き込み増幅）。"}]}
  - {"id":"lsm-read","label":"キーを探す","visual":"lsm","evidence":[{"type":"doc","ref":"docs/reference-lsm-compaction.md#§5"}],"steps":[{"blocks":{"mem":[{"id":"w5","label":"put k3","k":4}],"l0":[{"id":"sst1","label":"SST a（k2〜k9）","k":0,"from":["w1","w2","w3","w4"],"note":"フラッシュで書いた SSTable。キー順に並び、不変。"},{"id":"sst2","label":"SST b（k1〜k8）","k":0,"from":["w5","w6","w7","w8"],"note":"2 つ目の SSTable。a とキー範囲が重なる。"}],"l1":[{"id":"l1a","label":"L1 k1〜k5","k":2},{"id":"l1b","label":"L1 k6〜k9","k":2}],"l2":[{"id":"l2a","label":"L2 k1〜k3","k":3},{"id":"l2b","label":"L2 k4〜k6","k":3},{"id":"l2c","label":"L2 k7〜k9","k":3}]},"highlight":["w5"],"links":["read-mem"],"note":"k4 を探す。まず MemTable を見る（無い）。"},{"blocks":{"mem":[{"id":"w5","label":"put k3","k":4}],"l0":[{"id":"sst1","label":"SST a（k2〜k9）","k":0,"from":["w1","w2","w3","w4"],"note":"フラッシュで書いた SSTable。キー順に並び、不変。"},{"id":"sst2","label":"SST b（k1〜k8）","k":0,"from":["w5","w6","w7","w8"],"note":"2 つ目の SSTable。a とキー範囲が重なる。"}],"l1":[{"id":"l1a","label":"L1 k1〜k5","k":2},{"id":"l1b","label":"L1 k6〜k9","k":2}],"l2":[{"id":"l2a","label":"L2 k1〜k3","k":3},{"id":"l2b","label":"L2 k4〜k6","k":3},{"id":"l2c","label":"L2 k7〜k9","k":3}]},"highlight":["sst1","sst2"],"links":["read-l0"],"note":"L0 は範囲が重なるので、新しい順にすべて確認する。ブルームフィルターで「確実に無い」ファイルは読み飛ばす。"},{"blocks":{"mem":[{"id":"w5","label":"put k3","k":4}],"l0":[{"id":"sst1","label":"SST a（k2〜k9）","k":0,"from":["w1","w2","w3","w4"],"note":"フラッシュで書いた SSTable。キー順に並び、不変。"},{"id":"sst2","label":"SST b（k1〜k8）","k":0,"from":["w5","w6","w7","w8"],"note":"2 つ目の SSTable。a とキー範囲が重なる。"}],"l1":[{"id":"l1a","label":"L1 k1〜k5","k":2},{"id":"l1b","label":"L1 k6〜k9","k":2}],"l2":[{"id":"l2a","label":"L2 k1〜k3","k":3},{"id":"l2b","label":"L2 k4〜k6","k":3},{"id":"l2c","label":"L2 k7〜k9","k":3}]},"highlight":["l1a"],"links":["read-l1"],"note":"L1 以下は範囲が重ならないので、k4 を含む 1 ファイルだけを確認すればよい。"}]}
requirements:
  - {id: LSM-01, kind: nfr, title: コンパクションの費用を見積もる, text: 書き込み増幅とディスク I/O を見込んで、コンパクション方式と階層サイズを決める。, links: [compact-01, compact-12], evidence: [{"type":"doc","ref":"docs/reference-lsm-compaction.md#§4"}]}
unknowns:
  - {id: UNK-01, text: 実際のエンジン、コンパクション方式（レベル型・サイズ階層型）、階層の数とサイズは未確定。, refs: [l0, l1, l2]}
gates: {maxDrift: 0, maxHigh: 0}
blocks: [{"id":"lsm","title":"LSM ツリーの階層","legend":{"0":"L0 の SSTable","2":"L1","3":"L2","4":"書き込み（MemTable）"},"note":"キーと階層の数は説明用。","lanes":[{"id":"mem","label":"MemTable","sub":"メモリ","node":"memtable"},{"id":"l0","label":"L0","sub":"範囲が重なる","node":"l0"},{"id":"l1","label":"L1","sub":"範囲が重ならない","node":"l1"},{"id":"l2","label":"L2","sub":"いちばん大きい","node":"l2"}],"items":{"mem":[],"l0":[],"l1":[{"id":"l1a","label":"L1 k1〜k5","k":2},{"id":"l1b","label":"L1 k6〜k9","k":2}],"l2":[{"id":"l2a","label":"L2 k1〜k3","k":3},{"id":"l2b","label":"L2 k4〜k6","k":3},{"id":"l2c","label":"L2 k7〜k9","k":3}]}}]

implementations:
  - id: rocksdb-level
    label: "RocksDB の leveled compaction"
    description: "ローカルの永続ディレクトリーに RocksDB を組み込み、列ファミリーの leveled compaction を使う例。キーの世代は LSM 木に保存され、名前や状態は RocksDB の設定とファイル配置に現れる。"
    sources:
      - {title: RocksDB Wiki - Compaction, url: https://github.com/facebook/rocksdb/wiki/Compaction}
      - {title: Apache Cassandra - Compaction, url: https://cassandra.apache.org/doc/latest/cassandra/managing/operating/compaction/index.html}
      - {title: RocksDB Leveled Compaction, url: https://github.com/meta/rocksdb/wiki/Leveled-Compaction}
      - {title: RocksDB MANIFEST, url: https://github.com/meta/rocksdb/wiki/MANIFEST}
    tiers:
      - {id: processing, label: データの処理と保存, z: 0, size: [14, 5]}
      - {id: setup, label: 実行に必要な設定・成果物, z: 1, size: [14, 3]}
    nodes:
      rocksdb-level-host: {label: 自前 Linux 実行ホスト, kind: host, tier: processing, x: 3, y: 0, description: 利用者がアプリプロセスとローカルファイルシステムを管理する。, evidence: [{type: doc, ref: docs/reference-lsm-compaction.md#§7}]}
      rocksdb-level-app: {label: RocksDB を組み込むアプリプロセス, kind: client, tier: processing, x: 1, y: 1.15, realizes: [client], description: Get と Put によりキー・値を読み書きする。, evidence: [{type: doc, ref: docs/reference-lsm-compaction.md#§7}]}
      rocksdb-level-memory: {label: RocksDB の共有 WAL と列ファミリーの MemTable, kind: worker, tier: processing, x: 1, y: 3.65, realizes: [wal, memtable], description: 書き込みのログをディスクへ残し、読み取り可能な作業状態を MemTable に持つ。, evidence: [{type: doc, ref: docs/reference-lsm-compaction.md#§7}]}
      rocksdb-level-sst: {label: RocksDB DB パスの SST ファイル群, kind: file, tier: processing, x: 5, y: 1.15, realizes: [l0, l1, l2], description: L0 はキー範囲が重なり得る。上位レベルでは同じレベルのファイルを重ならないキー範囲に整理する。, evidence: [{type: doc, ref: docs/reference-lsm-compaction.md#§7}]}
      rocksdb-level-manifest: {label: RocksDB MANIFEST, kind: file, tier: setup, x: 1, y: 1.5, description: 各レベルを構成するファイルの変更を記録し、復旧時に現在の版を組み立てる。, evidence: [{type: doc, ref: docs/reference-lsm-compaction.md#§7}]}
    links:
      - {id: rocksdb-level-host-run, from: rocksdb-level-host, to: rocksdb-level-app, label: アプリを実行}
      - {id: rocksdb-level-host-disk, from: rocksdb-level-host, to: rocksdb-level-sst, label: DB ディレクトリを提供}
      - {id: rocksdb-level-manifest-connection, from: rocksdb-level-manifest, to: rocksdb-level-sst, label: レベル内のファイル構成を記録}
    layout2d:
      tiers:
        - {id: diagram, label: 実装構成, z: 0, size: [29, 19]}
      nodes:
        rocksdb-level-host: {tier: diagram, x: 2, y: 2}
        rocksdb-level-app: {tier: diagram, x: 2, y: 5}
        rocksdb-level-memory: {tier: diagram, x: 2, y: 8}
        rocksdb-level-sst: {tier: diagram, x: 2, y: 11}
        rocksdb-level-manifest: {tier: diagram, x: 2, y: 14}
      groups:
        - {kind: nodegroup, label: "自前 Linux ホスト", tier: [diagram], x0: 0, y0: 0, x1: 4, y1: 18, nodes: [rocksdb-level-host, rocksdb-level-app, rocksdb-level-memory, rocksdb-level-sst, rocksdb-level-manifest]}
    layout3d:
      tiers:
        - {id: zone0, label: "自前 Linux ホスト", z: 0, origin: [0, 0], size: [5, 15]}
      nodes:
        rocksdb-level-host: {tier: zone0, x: 2, y: 1}
        rocksdb-level-app: {tier: zone0, x: 2, y: 4}
        rocksdb-level-memory: {tier: zone0, x: 2, y: 7}
        rocksdb-level-sst: {tier: zone0, x: 2, y: 10}
        rocksdb-level-manifest: {tier: zone0, x: 2, y: 13}
      groups:
        - {kind: nodegroup, label: "自前 Linux ホスト", tier: [zone0], nodes: [rocksdb-level-host, rocksdb-level-app, rocksdb-level-memory, rocksdb-level-sst, rocksdb-level-manifest]}
  - id: aws-ec2-rocksdb
    label: AWS（RocksDB on EC2・Amazon EBS）
    description: EC2 のアプリに組み込んだ RocksDB がメモリ上の MemTable と EBS 上のファイルを使う例。
    sources:
      - {title: RocksDB Leveled Compaction, url: https://github.com/facebook/rocksdb/wiki/Leveled-Compaction}
      - {title: RocksDB Write Ahead Log, url: https://github.com/facebook/rocksdb/wiki/Write-Ahead-Log-%28WAL%29}
      - {title: Amazon EBS ボリュームのアタッチ, url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-attaching-volume.html}
    tiers:
      - {id: process, label: EC2 上のプロセスとメモリ, z: 1, size: [20, 4]}
      - {id: storage, label: 同一 AZ の EBS ボリューム, z: 0, size: [22, 5]}
    groups:
      - {kind: cloud, provider: aws, label: AWS アカウント, tier: [process, storage], nodes: [aws-ec2, aws-app, aws-mem, aws-ebs, aws-wal, aws-l0, aws-l1, aws-l2]}
      - {kind: cluster, label: 単一 EC2 インスタンス, tier: process, nodes: [aws-ec2, aws-app, aws-mem]}
      - {kind: cluster, label: EBS 上の RocksDB データディレクトリ, tier: storage, nodes: [aws-wal, aws-l0, aws-l1, aws-l2]}
    nodes:
      aws-ec2: {label: "Amazon EC2（Linux）", svc: ec2, kind: host, tier: process, x: 2, y: 1.5, description: "アプリのプロセスとアドレス空間を持つ。", management: {type: shared, scope: "AWS が EC2 基盤を運用し、利用者が OS とアプリを管理する。"}, evidence: [{type: doc, ref: docs/reference-lsm-compaction.md#§8}]}
      aws-app: {label: "RocksDB を組み込んだアプリ", kind: service, tier: process, x: 8, y: 1.5, realizes: [client], description: "プロセス内で RocksDB API を呼び、レベル型コンパクションを使う。", management: {type: customer, scope: "利用者がアプリと RocksDB 設定を管理する。"}, evidence: [{type: doc, ref: docs/reference-lsm-compaction.md#§8}]}
      aws-mem: {label: "RocksDB MemTable（プロセスメモリ）", kind: cache, tier: process, x: 15, y: 1.5, realizes: [memtable], description: "アクティブおよびフラッシュ待ちの MemTable をメモリに持つ。", management: {type: customer, scope: "利用者がアプリのメモリと DB 設定を管理する。"}, evidence: [{type: doc, ref: docs/reference-lsm-compaction.md#§8}]}
      aws-ebs: {label: "Amazon EBS（データボリューム）", svc: ebs, kind: db, tier: storage, x: 2, y: 1.5, description: "Linux のファイルシステムを置くブロックデバイス。", management: {type: shared, scope: "AWS が EBS 基盤を運用し、利用者がボリュームとバックアップを管理する。"}, evidence: [{type: doc, ref: docs/reference-lsm-compaction.md#§8}]}
      aws-wal: {label: "共有 WAL と MANIFEST のファイル", kind: file, tier: storage, x: 7, y: 1.5, realizes: [wal], description: "DB の更新を WAL に追記し、MANIFEST で SST の構成を記録する。", management: {type: customer, scope: "利用者が WAL と復旧方針を管理する。"}, evidence: [{type: doc, ref: docs/reference-lsm-compaction.md#§8}]}
      aws-l0: {label: "L0 の SST ファイル", kind: file, tier: storage, x: 11, y: 3.5, realizes: [l0], description: "MemTable のフラッシュで作る。", management: {type: customer, scope: "利用者が DB データとバックアップを管理する。"}, evidence: [{type: doc, ref: docs/reference-lsm-compaction.md#§8}]}
      aws-l1: {label: "L1 の SST ファイル", kind: file, tier: storage, x: 15, y: 3.5, realizes: [l1], description: "L0 と重なる範囲をまとめる。", management: {type: customer, scope: "利用者が DB データとバックアップを管理する。"}, evidence: [{type: doc, ref: docs/reference-lsm-compaction.md#§8}]}
      aws-l2: {label: "L2 の SST ファイル", kind: file, tier: storage, x: 19, y: 3.5, realizes: [l2], description: "L1 と重なる範囲をまとめる。", management: {type: customer, scope: "利用者が DB データとバックアップを管理する。"}, evidence: [{type: doc, ref: docs/reference-lsm-compaction.md#§8}]}
    links:
      - {id: aws-run, from: aws-ec2, to: aws-app, label: アプリを起動}
      - {id: aws-attach, from: aws-ec2, to: aws-ebs, label: EBS をマウント}

