name: DWH の集約テーブルとセマンティックレイヤー
description: 受注明細から日次の集約を作り、指標が使える粒度と遅れて到着した明細の更新範囲を確認する。
parent:
  model: dwh-design-patterns
  node: aggregates
reference:
  objectives:
    - 事前集約で残す粒度と、明細に戻る条件を定義する。
    - 割合やユニーク件数の再集計条件を確認する。
  sources:
    - title: Kimball Group の集約ファクトと加法性
      url: >-
        https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/
    - title: dbt Semantic Layer の構成
      url: https://docs.getdbt.com/docs/use-dbt-semantic-layer/sl-architecture
sources:
  - docs/reference-dwh-aggregate-tables.md
evidence:
  - type: doc
    ref: docs/reference-dwh-aggregate-tables.md#§1
tiers:
  - id: flow
    label: 構成と処理の流れ
    z: 0
    size:
      - 16.5
      - 4.5
nodes:
  late:
    label: 遅延した注文イベント
    kind: external
    tier: flow
    x: 0
    'y': 3
    description: 発生した日付に後から届く。
    evidence:
      - type: doc
        ref: docs/reference-dwh-aggregate-tables.md#§3
  fact:
    label: 受注明細ファクト
    kind: db
    tier: flow
    x: 4
    'y': 3
    description: 指標の計算に使える最小粒度。
    evidence:
      - type: doc
        ref: docs/reference-dwh-aggregate-tables.md#§1
  refresh:
    label: 増分集計・再生成
    kind: worker
    tier: flow
    x: 7
    'y': 0
    description: 影響範囲だけを計算し直す。
    evidence:
      - type: doc
        ref: docs/reference-dwh-aggregate-tables.md#§3
  aggregate:
    label: 日・カテゴリ・通貨の集約
    kind: db
    tier: flow
    x: 11
    'y': 0
    description: 売上と数量などを保持。
    evidence:
      - type: doc
        ref: docs/reference-dwh-aggregate-tables.md#§1
  metrics:
    label: 指標定義と経路選択
    kind: service
    tier: flow
    x: 12
    'y': 4
    description: 集約が使える指標とディメンションを定義。
    evidence:
      - type: doc
        ref: docs/reference-dwh-aggregate-tables.md#§2
  bi:
    label: BI／日次レポート
    kind: client
    tier: flow
    x: 16
    'y': 4
    description: 同じ指標定義で集計を読む。
    evidence:
      - type: doc
        ref: docs/reference-dwh-aggregate-tables.md#§2
links:
  - id: arrive
    from: late
    to: fact
    label: 明細を補正
    evidence:
      - type: doc
        ref: docs/reference-dwh-aggregate-tables.md#§3
  - id: build
    from: fact
    to: refresh
    label: 対象の明細を再計算
    evidence:
      - type: doc
        ref: docs/reference-dwh-aggregate-tables.md#§3
  - id: publish
    from: refresh
    to: aggregate
    label: 該当日の集約を置き換え
    evidence:
      - type: doc
        ref: docs/reference-dwh-aggregate-tables.md#§3
  - id: rollup
    from: aggregate
    to: metrics
    label: 日次売上などに使う
    evidence:
      - type: doc
        ref: docs/reference-dwh-aggregate-tables.md#§2
  - id: atomic
    from: fact
    to: metrics
    label: 購入者を明細で重複排除
    evidence:
      - type: doc
        ref: docs/reference-dwh-aggregate-tables.md#§2
  - id: read
    from: metrics
    to: bi
    label: 指標と鮮度を表示
    evidence:
      - type: doc
        ref: docs/reference-dwh-aggregate-tables.md#§2
scenarios:
  - id: route
    label: 日次売上と購入者数で経路を選ぶ
    evidence:
      - type: doc
        ref: docs/reference-dwh-aggregate-tables.md#§2
    steps:
      - links:
          - rollup
          - read
        note: 日別・カテゴリ別の売上は集約表から返す。
      - links:
          - atomic
          - read
        note: 全カテゴリの購入者数は明細からユニークな顧客を数える。
  - id: late-update
    label: 遅延注文で該当日を再集計
    evidence:
      - type: doc
        ref: docs/reference-dwh-aggregate-tables.md#§3
    steps:
      - links:
          - arrive
        note: 注文発生日より後に明細が到着する。
      - links:
          - build
          - publish
        note: 影響した日・カテゴリ・通貨の集約を再生成する。
      - links:
          - rollup
          - read
        note: 再計算後の売上と更新時刻を公開する。
implementations:
  - id: bq-aggregate
    label: BigQuery の日次集約と再計算
    description: Cloud Storage の補正入力を BigQuery にロードし、明細の反映後、影響日だけをスケジュールされた GoogleSQL ジョブで再計算する例。
    sources:
      - title: Kimball Group の集約ファクトと加法性
        url: >-
          https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/
      - title: dbt Semantic Layer の構成
        url: https://docs.getdbt.com/docs/use-dbt-semantic-layer/sl-architecture
      - title: BigQuery パーティション表
        url: https://docs.cloud.google.com/bigquery/docs/creating-partitioned-tables
      - title: BigQuery スケジュールされたクエリ
        url: https://docs.cloud.google.com/bigquery/docs/scheduling-queries
      - title: BigQuery 論理ビュー
        url: https://docs.cloud.google.com/bigquery/docs/views-intro
      - {title: "Cloud Storage からの CSV ロード", url: https://docs.cloud.google.com/bigquery/docs/loading-data-cloud-storage-csv}
      - {title: "BigQuery の複数ステートメント トランザクション", url: https://docs.cloud.google.com/bigquery/docs/transactions}
      - {title: "BigQuery の JOBS ビュー", url: https://docs.cloud.google.com/bigquery/docs/information-schema-jobs}
    tiers:
      - id: flow
        label: 構成と処理の流れ
        z: 0
        size:
          - 16.5
          - 4.5
      - id: implementation-setup
        label: Cloud Storage と BigQuery ジョブ
        z: 1
        size:
          - 26
          - 6
    nodes:
      example-files: {label: "Cloud Storage（後着明細・訂正の CSV）", svc: gcp:gcs, kind: file, tier: implementation-setup, x: 1, y: 1.5, description: "業務システムまたは検証用のバッチ CSV を保持する。", evidence: [{type: doc, ref: docs/reference-dwh-aggregate-tables.md#§4}]}
      example-load-job: {label: "BigQuery（CSV ロードジョブ）", svc: gcp:bigquery, kind: worker, tier: implementation-setup, x: 6, y: 1.5, description: "同じロケーションの Cloud Storage から BigQuery の入力表へロードする。", evidence: [{type: doc, ref: docs/reference-dwh-aggregate-tables.md#§4}]}
      example-scheduler: {label: "BigQuery（スケジュールされたクエリ）", svc: gcp:bigquery, kind: scheduler, tier: implementation-setup, x: 11, y: 1.5, description: "Data Transfer Service でサービスアカウントの GoogleSQL ジョブを起動する。", evidence: [{type: doc, ref: docs/reference-dwh-aggregate-tables.md#§4}]}
      example-correction: {label: "landing.order_corrections", svc: gcp:bigquery, kind: table, tier: implementation-setup, x: 16, y: 1.5, description: "後着明細の更新と対象注文日をバッチ ID 付きで受け取る。", evidence: [{type: doc, ref: docs/reference-dwh-aggregate-tables.md#§4}]}
      example-apply: {label: "BigQuery（明細補正ジョブ）", svc: gcp:bigquery, kind: workflow, tier: implementation-setup, x: 21, y: 1.5, description: "変更をファクトに反映し、影響日を同じトランザクションで記録する。", evidence: [{type: doc, ref: docs/reference-dwh-aggregate-tables.md#§4}]}
      example-late:
        label: 補正対象日の記録
        kind: table
        tier: flow
        x: 0
        'y': 3
        realizes:
          - late
        description: 遅く到着した明細から再計算日を記録する。
        evidence:
          - type: doc
            ref: docs/reference-dwh-aggregate-tables.md#§4
        svc: gcp:bigquery
      example-fact:
        label: sales.fact_order_line
        kind: table
        tier: flow
        x: 4
        'y': 3
        realizes:
          - fact
        description: 注文日をパーティション列にした明細表。
        evidence:
          - type: doc
            ref: docs/reference-dwh-aggregate-tables.md#§4
        svc: gcp:bigquery
      example-refresh:
        label: BigQuery（対象日の集約更新ジョブ）
        kind: workflow
        tier: flow
        x: 7
        'y': 0
        realizes:
          - refresh
        description: 対象日のファクトを再集計し、影響日の集約行だけを置き換える。
        evidence:
          - type: doc
            ref: docs/reference-dwh-aggregate-tables.md#§4
        svc: gcp:bigquery
      example-aggregate:
        label: sales.daily_category_currency
        kind: table
        tier: flow
        x: 11
        'y': 0
        realizes:
          - aggregate
        description: 注文日・カテゴリ・通貨の粒度に数量と金額を保存する。
        evidence:
          - type: doc
            ref: docs/reference-dwh-aggregate-tables.md#§4
        svc: gcp:bigquery
      example-metrics:
        label: 集約用と明細用の SQL ビュー
        kind: table
        tier: flow
        x: 12
        'y': 4
        realizes:
          - metrics
        description: ロールアップ可否でデータ源を選び、購入者数は明細から重複排除する。
        evidence:
          - type: doc
            ref: docs/reference-dwh-aggregate-tables.md#§4
        svc: gcp:bigquery
      example-bi:
        label: BigQuery Studio の日次売上・購入者レポート
        svc: gcp:bigquery
        kind: client
        tier: flow
        x: 16
        'y': 4
        realizes:
          - bi
        description: 登録済みの指標と元データの基準時刻を確認する。
        evidence:
          - type: doc
            ref: docs/reference-dwh-aggregate-tables.md#§4
      example-audit:
        label: 更新履歴テーブル
        svc: gcp:bigquery
        kind: monitor
        tier: implementation-setup
        x: 1
        'y': 4.3
        description: 対象日、明細の読み取り時点、再計算の完了時刻を保存して鮮度表示に使う。
        evidence:
          - type: doc
            ref: docs/reference-dwh-aggregate-tables.md#§4
    links:
      - {id: example-bq-files, from: example-files, to: example-load-job, label: CSV ファイルを読み込む}
      - {id: example-bq-load, from: example-load-job, to: example-correction, label: BigQuery の入力表に書き込む}
      - {id: example-bq-run, from: example-scheduler, to: example-refresh, label: スケジュールから GoogleSQL ジョブを起動}
      - {id: example-bq-correct, from: example-correction, to: example-apply, label: 対象バッチの後着明細を読む}
      - {id: example-bq-apply, from: example-apply, to: example-fact, label: 対象明細を追加・訂正}
      - {id: example-bq-queue, from: example-apply, to: example-late, label: 補正対象日を記録}
      - id: example-audit-connection
        from: example-refresh
        to: example-audit
        label: 計算の完了時刻を記録
        evidence:
          - type: doc
            ref: docs/reference-dwh-aggregate-tables.md#§4
      - {id: example-bq-apply-run, from: example-scheduler, to: example-apply, label: 明細補正 SQL をスケジュール}
    groups:
      - {kind: cloud, provider: gcp, label: Google Cloud プロジェクト, tier: [flow, implementation-setup]}
    layout2d:
      tiers:
        - {id: platform, label: Google Cloud プロジェクト, z: 0, size: [26, 13]}
      nodes:
        example-files: {tier: platform, x: 2, y: 2}
        example-load-job: {tier: platform, x: 8, y: 2}
        example-correction: {tier: platform, x: 14, y: 2}
        example-scheduler: {tier: platform, x: 20, y: 2}
        example-apply: {tier: platform, x: 2, y: 6}
        example-late: {tier: platform, x: 8, y: 6}
        example-fact: {tier: platform, x: 14, y: 6}
        example-refresh: {tier: platform, x: 20, y: 6}
        example-aggregate: {tier: platform, x: 2, y: 10}
        example-metrics: {tier: platform, x: 8, y: 10}
        example-bi: {tier: platform, x: 14, y: 10}
        example-audit: {tier: platform, x: 20, y: 10}
      groups:
        - {kind: cloud, provider: gcp, label: Google Cloud プロジェクト（サービスの論理的所属）, tier: [platform], nodes: [example-files, example-load-job, example-correction, example-scheduler, example-apply, example-late, example-fact, example-refresh, example-aggregate, example-metrics, example-bi, example-audit]}
    layout3d:
      tiers:
        - {id: platform, label: Google Cloud のサービスとデータ, z: 0, size: [26, 13]}
      nodes:
        example-files: {tier: platform, x: 2, y: 2}
        example-load-job: {tier: platform, x: 8, y: 2}
        example-correction: {tier: platform, x: 14, y: 2}
        example-scheduler: {tier: platform, x: 20, y: 2}
        example-apply: {tier: platform, x: 2, y: 6}
        example-late: {tier: platform, x: 8, y: 6}
        example-fact: {tier: platform, x: 14, y: 6}
        example-refresh: {tier: platform, x: 20, y: 6}
        example-aggregate: {tier: platform, x: 2, y: 10}
        example-metrics: {tier: platform, x: 8, y: 10}
        example-bi: {tier: platform, x: 14, y: 10}
        example-audit: {tier: platform, x: 20, y: 10}
      groups:
        - {kind: cloud, provider: gcp, label: Google Cloud プロジェクト（サービスの論理的所属）, tier: [platform], nodes: [example-files, example-load-job, example-correction, example-scheduler, example-apply, example-late, example-fact, example-refresh, example-aggregate, example-metrics, example-bi, example-audit]}
