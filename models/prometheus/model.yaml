name: Prometheus の基本アーキテクチャ
description: ターゲットからのスクレイプ、ローカル TSDB への保存、PromQL による問い合わせ、ルールと Alertmanager による警告までの流れを示す。
reference:
  objectives: [スクレイプで集める pull 型の流れを確認する, 保存・ルール・問い合わせの役割を区別する, 警告と可視化の接続先を確認する]
  sources:
    - {title: Prometheus Overview, url: https://prometheus.io/docs/introduction/overview/}
    - {title: Data model, url: https://prometheus.io/docs/concepts/data_model/}
    - {title: Storage, url: https://prometheus.io/docs/prometheus/latest/storage/}
sources: [docs/reference-prometheus.md]
evidence: [{type: doc, ref: docs/reference-prometheus.md#§1}]
tiers:
  - {id: flow, label: 収集・保存・利用, z: 0, size: [32, 12]}
nodes:
  sd: {label: サービスディスカバリー・静的設定, kind: service, tier: flow, x: 1, y: 1, description: スクレイプ対象のターゲットを決める。, evidence: [{type: doc, ref: docs/reference-prometheus.md#§2}]}
  targets: {label: アプリと Exporter, kind: client, tier: flow, x: 1, y: 5, description: クライアントライブラリで計装したアプリと、他のサービスのメトリクスを公開する Exporter。, evidence: [{type: doc, ref: docs/reference-prometheus.md#§2}]}
  pushgw: {label: Pushgateway, kind: service, tier: flow, x: 1, y: 9, description: 短命ジョブが送ったメトリクスを受け、サーバーのスクレイプに渡す。, evidence: [{type: doc, ref: docs/reference-prometheus.md#§2}]}
  scrape: {label: スクレイプ（取得）, kind: service, tier: flow, x: 9, y: 5, description: ターゲットから HTTP でメトリクスを取得する。取得間隔は未確認。, evidence: [{type: doc, ref: docs/reference-prometheus.md#§2}]}
  tsdb: {label: ローカル TSDB, kind: db, tier: flow, x: 16, y: 5, description: 2 時間単位のブロックと WAL でサンプルを保存する。保持期間の既定は 15 日。, evidence: [{type: doc, ref: docs/reference-prometheus.md#§4}, {type: doc, ref: docs/reference-prometheus.md#§3}]}
  rules: {label: ルール評価, kind: service, tier: flow, x: 16, y: 1, description: 保存データから新しい系列（Recording）や警告（Alerting）を作る。, evidence: [{type: doc, ref: docs/reference-prometheus.md#§6}]}
  remote: {label: リモートストレージ, kind: db, tier: flow, x: 16, y: 9, description: Remote Write でサンプルを送り、Remote Read で読み戻す。接続先は未確認。, evidence: [{type: doc, ref: docs/reference-prometheus.md#§5}]}
  promql: {label: PromQL・HTTP API, kind: service, tier: flow, x: 23, y: 5, description: 保存データへの問い合わせを受ける。, evidence: [{type: doc, ref: docs/reference-prometheus.md#§2}]}
  alertmgr: {label: Alertmanager, kind: service, tier: flow, x: 23, y: 1, description: サーバーが生成した警告を処理する。通知先の設定は未確認。, evidence: [{type: doc, ref: docs/reference-prometheus.md#§6}]}
  grafana: {label: Grafana など, kind: client, tier: flow, x: 30, y: 5, description: PromQL で問い合わせ、結果を可視化する。, evidence: [{type: doc, ref: docs/reference-prometheus.md#§2}]}
links:
  - {id: discover, from: sd, to: scrape, label: ターゲットを通知, evidence: [{type: doc, ref: docs/reference-prometheus.md#§2}]}
  - {id: pull-targets, from: scrape, to: targets, label: HTTP で取得, evidence: [{type: doc, ref: docs/reference-prometheus.md#§2}]}
  - {id: pull-pushgw, from: scrape, to: pushgw, label: HTTP で取得, evidence: [{type: doc, ref: docs/reference-prometheus.md#§2}]}
  - {id: store, from: scrape, to: tsdb, label: サンプルを保存, evidence: [{type: doc, ref: docs/reference-prometheus.md#§4}]}
  - {id: eval, from: tsdb, to: rules, label: ルールを評価, evidence: [{type: doc, ref: docs/reference-prometheus.md#§6}]}
  - {id: record, from: rules, to: tsdb, label: 新しい系列を保存, evidence: [{type: doc, ref: docs/reference-prometheus.md#§6}]}
  - {id: alert, from: rules, to: alertmgr, label: 警告を送信, evidence: [{type: doc, ref: docs/reference-prometheus.md#§6}]}
  - {id: remote-write, from: tsdb, to: remote, label: Remote Write, evidence: [{type: doc, ref: docs/reference-prometheus.md#§5}]}
  - {id: query-read, from: tsdb, to: promql, label: 系列を読み出し, evidence: [{type: doc, ref: docs/reference-prometheus.md#§2}]}
  - {id: visualize, from: promql, to: grafana, label: 問い合わせ結果を返す, evidence: [{type: doc, ref: docs/reference-prometheus.md#§2}]}
scenarios:
  - id: scrape-and-query
    label: スクレイプしてダッシュボードに表示する
    evidence: [{type: doc, ref: docs/reference-prometheus.md#§2}]
    steps:
      - {links: [discover, pull-targets], note: ターゲットを決め、HTTP でメトリクスを取得する。}
      - {links: [store], note: サンプルをローカル TSDB に保存する。}
      - {links: [query-read, visualize], note: Grafana が PromQL で問い合わせて表示する。}
  - id: alerting
    label: ルールから警告を出す
    evidence: [{type: doc, ref: docs/reference-prometheus.md#§6}]
    steps:
      - {links: [eval, alert], note: 保存データに対してルールを評価し、警告を Alertmanager へ送る。}
requirements:
  - {id: PM-01, kind: usecase, title: ターゲットから pull でメトリクスを集める, text: サーバーが HTTP でターゲットと Pushgateway を取得し、ローカルに保存する。, links: [discover, pull-targets, pull-pushgw, store], evidence: [{type: doc, ref: docs/reference-prometheus.md#§2}]}
unknowns:
  - {id: UNK-01, text: スクレイプ間隔、ルールの評価間隔、Alertmanager の通知先の詳細は今回の取得範囲になく未確認。, refs: [scrape, rules, alertmgr]}
  - {id: UNK-02, text: リモートストレージの具体的な接続先製品は未確認。, refs: [remote]}
gates: {maxDrift: 0, maxHigh: 0}
implementations:
  - id: onprem-single
    label: 自前のサーバー上の Prometheus・Alertmanager・Grafana
    description: 1 台の Prometheus サーバーが Exporter と Pushgateway をスクレイプし、Alertmanager と Grafana と連携する自前構成の例。代表例であり、導入事例ではない。
    sources:
      - {title: Prometheus Overview, url: https://prometheus.io/docs/introduction/overview/}
      - {title: Storage, url: https://prometheus.io/docs/prometheus/latest/storage/}
    tiers:
      - {id: diagram, label: 収集・保存・利用, z: 0, size: [24, 12]}
    nodes:
      pm-targets: {label: アプリと Exporter, kind: client, tier: diagram, x: 1, y: 3, realizes: [targets], description: /metrics を HTTP で公開する。, evidence: [{type: doc, ref: docs/reference-prometheus.md#§7}]}
      pm-pushgw: {label: Pushgateway, kind: service, tier: diagram, x: 1, y: 8, realizes: [pushgw], description: 短命ジョブのメトリクスを受ける。, management: {type: customer, scope: "Customer operates the Pushgateway."}, evidence: [{type: doc, ref: docs/reference-prometheus.md#§7}]}
      pm-server: {label: Prometheus サーバー, kind: service, tier: diagram, x: 10, y: 5.5, realizes: [sd, scrape, tsdb, rules, promql, remote], description: スクレイプ、ローカル TSDB への保存、ルール評価、PromQL の応答を 1 つのプロセスで行う。, management: {type: customer, scope: "Customer operates the server, disks and configuration."}, evidence: [{type: doc, ref: docs/reference-prometheus.md#§7}]}
      pm-alert: {label: Alertmanager, kind: service, tier: diagram, x: 19, y: 2, realizes: [alertmgr], description: 警告を受けて処理する。, management: {type: customer, scope: "Customer operates Alertmanager."}, evidence: [{type: doc, ref: docs/reference-prometheus.md#§7}]}
      pm-grafana: {label: Grafana, kind: client, tier: diagram, x: 19, y: 9, realizes: [grafana], description: PromQL で問い合わせて可視化する。, management: {type: customer, scope: "Customer operates Grafana."}, evidence: [{type: doc, ref: docs/reference-prometheus.md#§7}]}
    groups:
      - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [pm-targets, pm-pushgw, pm-server, pm-alert, pm-grafana]}
    layout2d:
      tiers:
        - {id: diagram, label: 収集・保存・利用, z: 0, size: [24, 12]}
      nodes:
        pm-targets: {tier: diagram, x: 1, y: 3}
        pm-pushgw: {tier: diagram, x: 1, y: 8}
        pm-server: {tier: diagram, x: 10, y: 5.5}
        pm-alert: {tier: diagram, x: 19, y: 2}
        pm-grafana: {tier: diagram, x: 19, y: 9}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [pm-targets, pm-pushgw, pm-server, pm-alert, pm-grafana]}
    layout3d:
      tiers:
        - {id: sources, label: 供給元, z: 0, size: [6, 12]}
        - {id: server, label: Prometheus, z: 0, origin: [8, 0], size: [6, 12]}
        - {id: usage, label: 警告と可視化, z: 0, origin: [16, 0], size: [6, 12]}
      nodes:
        pm-targets: {tier: sources, x: 3, y: 3}
        pm-pushgw: {tier: sources, x: 3, y: 8}
        pm-server: {tier: server, x: 3, y: 5.5}
        pm-alert: {tier: usage, x: 3, y: 2}
        pm-grafana: {tier: usage, x: 3, y: 9}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: [sources, server, usage], nodes: [pm-targets, pm-pushgw, pm-server, pm-alert, pm-grafana]}
