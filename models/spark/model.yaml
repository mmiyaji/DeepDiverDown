name: Apache Spark の基本アーキテクチャ
description: Driver と Executor の役割を見ながら、バッチアプリケーションの投入、並列実行、Shuffle、出力、再計算を順に学ぶリファレンスです。Executor の数と配置は説明用です。
reference:
  objectives:
    - Driver、Cluster Manager、Executor の役割を区別する。
    - バッチ処理の投入から結果保存までを追う。
    - Shuffle とパーティション再計算が必要になる場面を理解する。
  sources:
    - {title: Apache Spark Cluster Mode Overview, url: "https://spark.apache.org/docs/latest/cluster-overview.html"}
    - {title: Submitting Applications, url: "https://spark.apache.org/docs/latest/submitting-applications.html"}
    - {title: RDD Programming Guide, url: "https://spark.apache.org/docs/latest/rdd-programming-guide.html"}
    - {title: Job Scheduling, url: "https://spark.apache.org/docs/latest/job-scheduling.html"}
sources: [docs/reference-spark.md]
evidence: [{type: doc, ref: "docs/reference-spark.md#§1"}]
tiers:
  - {id: entry, label: 投入元, kind: origin, z: 1, origin: [-4, 0], size: [2.5, 2]}
  - {id: control, label: 実行制御と資源管理, z: 1, size: [10, 3]}
  - {id: workers, label: ワーカーノード上の実行プロセス, z: 0, size: [10, 4]}
  - {id: storage, label: 外部ストレージ, z: 0, origin: [12, 0], size: [2.5, 4]}
groups:
  - {kind: parallel, label: Executor を並列に実行（数は設定による）, tier: workers, nodes: [executor-a, executor-b]}
nodes:
  submitter: {label: アプリケーションの投入元, kind: client, tier: entry, x: 0, 'y': 1, description: 注文集計のプログラムと実行時設定を渡す。, evidence: [{type: doc, ref: docs/reference-spark.md#§2}]}
  driver: {label: ジョブの調整プロセス, kind: service, tier: control, x: 1, 'y': 1.5, description: 処理の段階を組み立て、実行担当へタスクを割り当てる。, evidence: [{type: doc, ref: docs/reference-spark.md#§2}, {type: doc, ref: docs/reference-spark.md#§4}]}
  manager: {label: クラスター資源管理, kind: service, tier: control, x: 7, 'y': 1.5, description: 実行プロセスのために各ホストの CPU とメモリーを割り当てる。, evidence: [{type: doc, ref: docs/reference-spark.md#§3}]}
  executor-a: {slots: 4, label: タスク実行担当 A, kind: worker, tier: workers, x: 2, 'y': 2, description: 担当データを読み、他の実行担当と中間データを交換する。, evidence: [{type: doc, ref: docs/reference-spark.md#§3}]}
  executor-b: {slots: 4, label: タスク実行担当 B, kind: worker, tier: workers, x: 7, 'y': 2, description: 別の分割を読み、再分配先のタスクを実行する。, evidence: [{type: doc, ref: docs/reference-spark.md#§3}, {type: doc, ref: docs/reference-spark.md#§4}]}
  input: {partitions: 6, label: 入力データ, kind: db, tier: storage, x: 0.5, y: 0, description: 入力分割ごとにタスクが読む、共有された元データ。, evidence: [{type: doc, ref: docs/reference-spark.md#§5}]}
  output:
    {label: 集計結果, kind: db, tier: storage, x: 0.5, y: 3.5, description: このシナリオでは集計結果をファイルに保存する。, evidence: [{type: doc, ref: "docs/reference-spark.md#§6"}]}
links:
  - {id: submit, from: submitter, to: driver, label: アプリケーション投入, evidence: [{type: doc, ref: docs/reference-spark.md#§2}]}
  - {id: allocate, from: driver, to: manager, label: 実行資源を要求, evidence: [{type: doc, ref: docs/reference-spark.md#§3}]}
  - {id: start-a, from: manager, to: executor-a, label: 実行プロセスを配置, evidence: [{type: doc, ref: docs/reference-spark.md#§3}]}
  - {id: start-b, from: manager, to: executor-b, label: 実行プロセスを配置, evidence: [{type: doc, ref: docs/reference-spark.md#§3}]}
  - {id: task-a, from: driver, to: executor-a, label: 処理単位を割り当て, evidence: [{type: doc, ref: docs/reference-spark.md#§4}]}
  - {id: task-b, from: driver, to: executor-b, label: 処理単位を割り当て, evidence: [{type: doc, ref: docs/reference-spark.md#§4}, {type: doc, ref: docs/reference-spark.md#§7}]}
  - {id: read-a, from: input, to: executor-a, label: 担当データを読み込み, evidence: [{type: doc, ref: docs/reference-spark.md#§5}]}
  - {id: read-b, from: input, to: executor-b, label: 担当データを読み込み, evidence: [{type: doc, ref: docs/reference-spark.md#§5}, {type: doc, ref: docs/reference-spark.md#§7}]}
  - {id: shuffle, from: executor-a, to: executor-b, label: 中間データを転送, evidence: [{type: doc, ref: docs/reference-spark.md#§5}]}
  - {id: write-a, from: executor-a, to: output, label: 集計結果を保存, evidence: [{type: doc, ref: docs/reference-spark.md#§6}]}
  - {id: write-b, from: executor-b, to: output, label: 集計結果を保存, evidence: [{type: doc, ref: docs/reference-spark.md#§6}]}
scenarios:
  - id: spark-batch
    label: Spark バッチ処理の流れ
    evidence: [{type: doc, ref: "docs/reference-spark.md#§1"}]
    steps:
      - {links: [submit], note: "投入。spark-submit からアプリケーションを開始し、Driver がメインプログラムを実行する。"}
      - {links: [allocate, start-a, start-b], note: "資源を確保。Cluster Manager が資源を割り当て、ワーカーノード上に Executor を配置する。"}
      - {links: [task-a, task-b], note: "処理を分割。アクションを契機に Job が実行される。Driver は Stage ごとに Task を Executor に割り当てる。"}
      - {links: [read-a, read-b], note: "並列に読み込む。Executor は外部ストレージから自分の Task が担当するデータを読む。"}
      - {links: [shuffle], note: "Shuffle。例の groupBy では同じキーをまとめるために再分配する。図は下流 Task が別の Executor からブロックを取得する一例。"}
      - {links: [write-a, write-b], note: "出力。集計を終えた Task が外部ストレージに結果を書き込む。"}
  - id: spark-recompute
    label: パーティション喪失からの再計算
    evidence: [{type: doc, ref: "docs/reference-spark.md#§7"}]
    steps:
      - {links: [task-b], note: "Executor A で担当していたパーティションが失われた例。Driver が必要な処理を別の Executor に割り当てる。"}
      - {links: [read-b], note: "Executor B が必要な入力を読み直し、依存関係をたどって失われたパーティションを再計算する。"}

implementations:
  - id: standalone
    label: "Spark Standalone と HDFS"
    description: "Spark Standalone のクラスターに売上集計を投入し、HDFS を入力・出力で共用する例。Driver は cluster モードで Worker 上に起動し、タスクは各 Executor で動く。"
    sources:
      - {title: Apache Spark Cluster Mode Overview, url: https://spark.apache.org/docs/latest/cluster-overview.html}
      - {title: Submitting Applications, url: https://spark.apache.org/docs/latest/submitting-applications.html}
      - {title: RDD Programming Guide, url: https://spark.apache.org/docs/latest/rdd-programming-guide.html}
      - {title: Job Scheduling, url: https://spark.apache.org/docs/latest/job-scheduling.html}
      - {title: Spark Standalone Mode, url: https://spark.apache.org/docs/latest/spark-standalone.html}
    tiers:
      - {id: processing, label: データの処理と保存, z: 0, size: [14, 5]}
      - {id: setup, label: 実行に必要な設定・成果物, z: 1, size: [14, 3]}
    nodes:
      standalone-submit: {label: spark-submit, kind: actor, tier: processing, x: 1, y: 1.15, realizes: [submitter], description: アプリケーション JAR を cluster モードで投入する。, evidence: [{type: doc, ref: docs/reference-spark.md#§8}]}
      standalone-master: {label: Standalone Master, kind: service, tier: processing, x: 1, y: 3.65, realizes: [manager], description: Worker 登録と Executor の資源割当を担う。, evidence: [{type: doc, ref: docs/reference-spark.md#§8}]}
      standalone-driver: {label: Worker 上の Driver JVM, kind: worker, tier: processing, x: 5, y: 1.15, realizes: [driver], description: ジョブをステージに分けてタスクを割り当てる。, evidence: [{type: doc, ref: docs/reference-spark.md#§8}]}
      standalone-host-a: {label: Worker A 上の Executor JVM, kind: worker, tier: processing, x: 5, y: 3.65, realizes: [executor-a], description: Worker A のローカルディスクをシャッフルに使う。, evidence: [{type: doc, ref: docs/reference-spark.md#§8}]}
      standalone-host-b: {label: Worker B 上の Executor JVM, kind: worker, tier: processing, x: 9, y: 1.15, realizes: [executor-b], description: Worker B で独立したタスクを実行する。, evidence: [{type: doc, ref: docs/reference-spark.md#§8}]}
      standalone-files: {label: HDFS 上の入力・出力パス, kind: db, tier: processing, x: 9, y: 3.65, realizes: [input, output], description: 入力と集計結果を異なる HDFS パスで保持する。, evidence: [{type: doc, ref: docs/reference-spark.md#§8}]}
      standalone-jar: {label: アプリケーション JAR, kind: file, tier: setup, x: 1, y: 1.5, description: 注文集計のコードをパッケージ化し、投入時に指定する。, evidence: [{type: doc, ref: docs/reference-spark.md#§8}]}
    links:
      - {id: standalone-jar-connection, from: standalone-jar, to: standalone-submit, label: 配布する JAR を指定}
