name: Apache Spark の基本アーキテクチャ
description: Driver と Executor の役割を見ながら、バッチアプリケーションの投入、並列実行、Shuffle、出力、再計算を順に学ぶリファレンスです。Executor の数と配置は説明用です。
reference:
  objectives:
    - Driver、Cluster Manager、Executor の役割を区別する。
    - バッチ処理の投入から結果保存までを追う。
    - Shuffle とパーティション再計算が必要になる場面を理解する。
  sources:
    - {title: Apache Spark Cluster Mode Overview, url: "https://spark.apache.org/docs/latest/cluster-overview.html"}
    - {title: Submitting Applications, url: "https://spark.apache.org/docs/latest/submitting-applications.html"}
    - {title: RDD Programming Guide, url: "https://spark.apache.org/docs/latest/rdd-programming-guide.html"}
    - {title: Job Scheduling, url: "https://spark.apache.org/docs/latest/job-scheduling.html"}
sources: [docs/reference-spark.md]
evidence: [{type: doc, ref: "docs/reference-spark.md#§1"}]
tiers:
  - {id: entry, label: 投入元, kind: origin, z: 1, origin: [-4, 0], size: [2.5, 2]}
  - {id: control, label: 実行制御と資源管理, z: 1, size: [10, 3]}
  - {id: workers, label: ワーカーノード上の実行プロセス, z: 0, size: [10, 4]}
  - {id: storage, label: 外部ストレージ, z: 0, origin: [12, 0], size: [2.5, 4]}
groups:
  - {kind: parallel, label: Executor を並列に実行（数は設定による）, tier: workers, nodes: [executor-a, executor-b]}
nodes:
  submitter: {label: アプリケーションの投入元, kind: client, tier: entry, x: 0, 'y': 1, description: 注文集計のプログラムと実行時設定を渡す。, evidence: [{type: doc, ref: docs/reference-spark.md#§2}]}
  driver: {label: ジョブの調整プロセス, kind: service, tier: control, x: 1, 'y': 1.5, description: 処理の段階を組み立て、実行担当へタスクを割り当てる。, evidence: [{type: doc, ref: docs/reference-spark.md#§2}, {type: doc, ref: docs/reference-spark.md#§4}]}
  manager: {label: クラスター資源管理, kind: service, tier: control, x: 7, 'y': 1.5, description: 実行プロセスのために各ホストの CPU とメモリーを割り当てる。, evidence: [{type: doc, ref: docs/reference-spark.md#§3}]}
  executor-a: {slots: 4, label: タスク実行担当 A, kind: worker, tier: workers, x: 2, 'y': 2, description: 担当データを読み、他の実行担当と中間データを交換する。, evidence: [{type: doc, ref: docs/reference-spark.md#§3}]}
  executor-b: {slots: 4, label: タスク実行担当 B, kind: worker, tier: workers, x: 7, 'y': 2, description: 別の分割を読み、再分配先のタスクを実行する。, evidence: [{type: doc, ref: docs/reference-spark.md#§3}, {type: doc, ref: docs/reference-spark.md#§4}]}
  input: {partitions: 6, label: 入力データ, kind: db, tier: storage, x: 0.5, y: 0, description: 入力分割ごとにタスクが読む、共有された元データ。, evidence: [{type: doc, ref: docs/reference-spark.md#§5}]}
  output:
    {label: 集計結果, kind: db, tier: storage, x: 0.5, y: 3.5, description: このシナリオでは集計結果をファイルに保存する。, evidence: [{type: doc, ref: "docs/reference-spark.md#§6"}]}
links:
  - {id: submit, from: submitter, to: driver, label: アプリケーション投入, evidence: [{type: doc, ref: docs/reference-spark.md#§2}]}
  - {id: allocate, from: driver, to: manager, label: 実行資源を要求, evidence: [{type: doc, ref: docs/reference-spark.md#§3}]}
  - {id: start-a, from: manager, to: executor-a, label: 実行プロセスを配置, evidence: [{type: doc, ref: docs/reference-spark.md#§3}]}
  - {id: start-b, from: manager, to: executor-b, label: 実行プロセスを配置, evidence: [{type: doc, ref: docs/reference-spark.md#§3}]}
  - {id: task-a, from: driver, to: executor-a, label: 処理単位を割り当て, evidence: [{type: doc, ref: docs/reference-spark.md#§4}]}
  - {id: task-b, from: driver, to: executor-b, label: 処理単位を割り当て, evidence: [{type: doc, ref: docs/reference-spark.md#§4}, {type: doc, ref: docs/reference-spark.md#§7}]}
  - {id: read-a, from: input, to: executor-a, label: 担当データを読み込み, evidence: [{type: doc, ref: docs/reference-spark.md#§5}]}
  - {id: read-b, from: input, to: executor-b, label: 担当データを読み込み, evidence: [{type: doc, ref: docs/reference-spark.md#§5}, {type: doc, ref: docs/reference-spark.md#§7}]}
  - {id: shuffle, from: executor-a, to: executor-b, label: 中間データを転送, evidence: [{type: doc, ref: docs/reference-spark.md#§5}]}
  - {id: write-a, from: executor-a, to: output, label: 集計結果を保存, evidence: [{type: doc, ref: docs/reference-spark.md#§6}]}
  - {id: write-b, from: executor-b, to: output, label: 集計結果を保存, evidence: [{type: doc, ref: docs/reference-spark.md#§6}]}
scenarios:
  - id: spark-batch
    label: Spark バッチ処理の流れ
    evidence: [{type: doc, ref: "docs/reference-spark.md#§1"}]
    steps:
      - {links: [submit], note: "投入。spark-submit からアプリケーションを開始し、Driver がメインプログラムを実行する。"}
      - {links: [allocate, start-a, start-b], note: "資源を確保。Cluster Manager が資源を割り当て、ワーカーノード上に Executor を配置する。"}
      - {links: [task-a, task-b], note: "処理を分割。アクションを契機に Job が実行される。Driver は Stage ごとに Task を Executor に割り当てる。"}
      - {links: [read-a, read-b], note: "並列に読み込む。Executor は外部ストレージから自分の Task が担当するデータを読む。"}
      - {links: [shuffle], note: "Shuffle。例の groupBy では同じキーをまとめるために再分配する。図は下流 Task が別の Executor からブロックを取得する一例。"}
      - {links: [write-a, write-b], note: "出力。集計を終えた Task が外部ストレージに結果を書き込む。"}
  - id: spark-recompute
    label: パーティション喪失からの再計算
    evidence: [{type: doc, ref: "docs/reference-spark.md#§7"}]
    steps:
      - {links: [task-b], note: "Executor A で担当していたパーティションが失われた例。Driver が必要な処理を別の Executor に割り当てる。"}
      - {links: [read-b], note: "Executor B が必要な入力を読み直し、依存関係をたどって失われたパーティションを再計算する。"}

implementations:
  - id: standalone
    label: "Spark Standalone と HDFS"
    description: "Spark Standalone のクラスターに売上集計を投入し、HDFS を入力・出力で共用する例。Driver は cluster モードで Worker 上に起動し、タスクは各 Executor で動く。"
    sources:
      - {title: Apache Spark Cluster Mode Overview, url: https://spark.apache.org/docs/latest/cluster-overview.html}
      - {title: Submitting Applications, url: https://spark.apache.org/docs/latest/submitting-applications.html}
      - {title: RDD Programming Guide, url: https://spark.apache.org/docs/latest/rdd-programming-guide.html}
      - {title: Job Scheduling, url: https://spark.apache.org/docs/latest/job-scheduling.html}
      - {title: Spark Standalone Mode, url: https://spark.apache.org/docs/latest/spark-standalone.html}
      - {title: HDFS Architecture, url: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HdfsDesign.html}
    tiers:
      - {id: processing, label: データの処理と保存, z: 0, size: [14, 5]}
      - {id: setup, label: 実行に必要な設定・成果物, z: 1, size: [14, 3]}
    groups:
      - {kind: cluster, label: 自前運用の Spark Standalone クラスター, tier: [processing], nodes: [standalone-master, standalone-driver, standalone-host-a, standalone-host-b]}
    nodes:
      standalone-master-host: {label: Master 用 Linux ホスト, kind: host, tier: processing, x: 1, y: 0, description: 利用者が OS と Spark Master を運用する。, evidence: [{type: doc, ref: docs/reference-spark.md#§8}]}
      standalone-worker-host-a: {label: Worker A の Linux ホスト, kind: host, tier: processing, x: 5, y: 0, description: Worker と Driver・Executor の JVM を実行する。, evidence: [{type: doc, ref: docs/reference-spark.md#§8}]}
      standalone-worker-host-b: {label: Worker B の Linux ホスト, kind: host, tier: processing, x: 9, y: 0, description: Worker と Executor JVM を実行する。, evidence: [{type: doc, ref: docs/reference-spark.md#§8}]}
      standalone-hdfs-host: {label: 自前 HDFS クラスター, kind: host, tier: processing, x: 13, y: 0, description: 利用者が NameNode と複数 DataNode を運用する。個々のノードの配置は省略。, evidence: [{type: doc, ref: docs/reference-spark.md#§8}]}
      standalone-submit: {label: spark-submit, kind: actor, tier: processing, x: 1, y: 1.15, realizes: [submitter], description: アプリケーション JAR を cluster モードで投入する。, evidence: [{type: doc, ref: docs/reference-spark.md#§8}]}
      standalone-master: {label: Standalone Master, kind: service, tier: processing, x: 1, y: 3.65, realizes: [manager], description: Worker 登録と Executor の資源割当を担う。, evidence: [{type: doc, ref: docs/reference-spark.md#§8}]}
      standalone-driver: {label: Worker 上の Driver JVM, kind: worker, tier: processing, x: 5, y: 1.15, realizes: [driver], description: ジョブをステージに分けてタスクを割り当てる。, evidence: [{type: doc, ref: docs/reference-spark.md#§8}]}
      standalone-host-a: {label: Worker A 上の Executor JVM, kind: worker, tier: processing, x: 5, y: 3.65, realizes: [executor-a], description: Worker A のローカルディスクをシャッフルに使う。, evidence: [{type: doc, ref: docs/reference-spark.md#§8}]}
      standalone-host-b: {label: Worker B 上の Executor JVM, kind: worker, tier: processing, x: 9, y: 1.15, realizes: [executor-b], description: Worker B で独立したタスクを実行する。, evidence: [{type: doc, ref: docs/reference-spark.md#§8}]}
      standalone-files: {label: HDFS 上の入力・出力パス, kind: db, tier: processing, x: 9, y: 3.65, realizes: [input, output], description: 入力と集計結果を異なる HDFS パスで保持する。, evidence: [{type: doc, ref: docs/reference-spark.md#§8}]}
      standalone-jar: {label: アプリケーション JAR, kind: file, tier: setup, x: 1, y: 1.5, description: 注文集計のコードをパッケージ化し、投入時に指定する。, evidence: [{type: doc, ref: docs/reference-spark.md#§8}]}
    links:
      - {id: standalone-master-runtime, from: standalone-master-host, to: standalone-master, label: Master を実行}
      - {id: standalone-worker-a-driver, from: standalone-worker-host-a, to: standalone-driver, label: Driver を実行}
      - {id: standalone-worker-a-executor, from: standalone-worker-host-a, to: standalone-host-a, label: Executor を実行}
      - {id: standalone-worker-b-executor, from: standalone-worker-host-b, to: standalone-host-b, label: Executor を実行}
      - {id: standalone-hdfs-runtime, from: standalone-hdfs-host, to: standalone-files, label: 入出力パスを提供}
      - {id: standalone-jar-connection, from: standalone-jar, to: standalone-submit, label: 配布する JAR を指定}

    layout2d:
      tiers:
        - {id: diagram, label: 自前運用の実装構成, z: 0, size: [23, 12]}
      nodes:
        standalone-submit: {tier: diagram, x: 1, y: 1}
        standalone-jar: {tier: diagram, x: 1, y: 5}
        standalone-master-host: {tier: diagram, x: 6, y: 3}
        standalone-master: {tier: diagram, x: 6, y: 6}
        standalone-worker-host-a: {tier: diagram, x: 11, y: 2}
        standalone-driver: {tier: diagram, x: 11, y: 5}
        standalone-host-a: {tier: diagram, x: 11, y: 8}
        standalone-worker-host-b: {tier: diagram, x: 16, y: 3}
        standalone-host-b: {tier: diagram, x: 16, y: 6}
        standalone-hdfs-host: {tier: diagram, x: 21, y: 3}
        standalone-files: {tier: diagram, x: 21, y: 6}
      groups:
        - {kind: cluster, label: Spark Standalone クラスター, tier: [diagram], x0: 4, y0: 0, x1: 18, y1: 10, nodes: [standalone-master-host, standalone-master, standalone-worker-host-a, standalone-driver, standalone-host-a, standalone-worker-host-b, standalone-host-b]}
        - {kind: cluster, label: HDFS クラスター, tier: [diagram], x0: 19, y0: 1, x1: 23, y1: 8, nodes: [standalone-hdfs-host, standalone-files]}
    layout3d:
      tiers:
        - {id: input, label: ジョブ投入, kind: origin, z: 0, origin: [-5, 0], size: [3, 5]}
        - {id: hosts, label: 自前 Linux ホスト, z: 0, size: [14, 5]}
        - {id: processes, label: Spark プロセス, z: 1, size: [14, 5]}
        - {id: hdfs, label: HDFS, z: 0, origin: [17, 0], size: [7, 5]}
      nodes:
        standalone-submit: {tier: input, x: 1, y: 1}
        standalone-jar: {tier: input, x: 1, y: 4}
        standalone-master-host: {tier: hosts, x: 1, y: 2}
        standalone-worker-host-a: {tier: hosts, x: 6, y: 2}
        standalone-worker-host-b: {tier: hosts, x: 11, y: 2}
        standalone-master: {tier: processes, x: 1, y: 2}
        standalone-driver: {tier: processes, x: 6, y: 1}
        standalone-host-a: {tier: processes, x: 6, y: 4}
        standalone-host-b: {tier: processes, x: 11, y: 2}
        standalone-hdfs-host: {tier: hdfs, x: 1, y: 2}
        standalone-files: {tier: hdfs, x: 5, y: 2}
      groups:
        - {kind: cluster, label: Spark Standalone クラスター, tier: [hosts, processes], nodes: [standalone-master-host, standalone-master, standalone-worker-host-a, standalone-driver, standalone-host-a, standalone-worker-host-b, standalone-host-b]}
        - {kind: cluster, label: HDFS クラスター, tier: [hdfs], nodes: [standalone-hdfs-host, standalone-files]}

  - id: aws-emr-eks
    label: "Amazon EMR on EKS と S3"
    description: "Amazon EMR の StartJobRun で EKS 上の Spark バッチ処理を動かし、S3 の注文データを集計する例。"
    sources:
      - {title: "EMR on EKS のジョブ投入", url: https://docs.aws.amazon.com/emr/latest/EMR-on-EKS-DevelopmentGuide/getting-started.html}
      - {title: "仮想クラスターと Pod のスケジューリング", url: https://docs.aws.amazon.com/emr/latest/EMR-on-EKS-DevelopmentGuide/emr-eks-how.html}
      - {title: "ジョブ投入用 Pod", url: https://docs.aws.amazon.com/emr/latest/EMR-on-EKS-DevelopmentGuide/emr-eks-job-submitter.html}
    tiers:
      - {id: entry, label: 投入元, kind: origin, z: 1, origin: [-5, 0], size: [3, 4]}
      - {id: runtime, label: 管理と実行, z: 1, size: [17, 7]}
      - {id: data, label: データと復旧, z: 0, size: [17, 5]}
    groups:
      - {kind: cloud, label: "AWS アカウント", provider: aws, tier: [runtime, data], nodes: [aws-emr-eks-emr, aws-emr-eks-scheduler, aws-emr-eks-submitter, aws-emr-eks-driver, aws-emr-eks-worker-a, aws-emr-eks-worker-b, aws-emr-eks-capacity, aws-emr-eks-source, aws-emr-eks-target]}
      - {kind: cluster, label: "Amazon EKS クラスター", provider: k8s, tier: [runtime], nodes: [aws-emr-eks-scheduler, aws-emr-eks-submitter, aws-emr-eks-driver, aws-emr-eks-worker-a, aws-emr-eks-worker-b, aws-emr-eks-capacity]}
      - {kind: namespace, label: "EMR に登録した名前空間", provider: k8s, tier: [runtime], nodes: [aws-emr-eks-submitter, aws-emr-eks-driver, aws-emr-eks-worker-a, aws-emr-eks-worker-b]}
    nodes:
      aws-emr-eks-cli: {label: "AWS CLI", kind: client, tier: entry, x: 1, y: 1.5, realizes: [submitter], description: "仮想クラスター ID、実行ロール、アプリケーションの場所を指定する。", evidence: [{type: doc, ref: docs/reference-spark.md#§9}]}
      aws-emr-eks-emr: {label: "EMR ジョブ API", kind: service, tier: runtime, x: 1, y: 1.5, svc: emr, description: "StartJobRun を受け、登録済みの名前空間へ投入用 Pod を配置する。", management: {type: aws, scope: "AWS がジョブ API の基盤を運用し、利用者がジョブと仮想クラスターを指定する。"}, evidence: [{type: doc, ref: docs/reference-spark.md#§9}]}
      aws-emr-eks-submitter: {label: "ジョブ投入用 Pod", kind: worker, tier: runtime, x: 5, y: 2.6, description: "Spark Driver Pod を起動する。", management: {type: shared, scope: "EMR が投入用 Pod を作成し、利用者がジョブ実行ロールと設定を指定する。"}, evidence: [{type: doc, ref: docs/reference-spark.md#§9}]}
      aws-emr-eks-scheduler: {label: "EKS のスケジューラー", kind: scheduler, tier: runtime, x: 10, y: 0.5, svc: eks, realizes: [manager], description: "Pod を EKS のノードへ割り当てる。", management: {type: shared, scope: "AWS が EKS 制御プレーンを運用し、利用者が Kubernetes API と設定を操作する。"}, evidence: [{type: doc, ref: docs/reference-spark.md#§9}]}
      aws-emr-eks-driver: {label: "Spark Driver Pod", kind: service, tier: runtime, x: 5, y: 4.5, realizes: [driver], description: "実行計画を作り、Executor Pod とタスクを手配する。", management: {type: customer, scope: "利用者がジョブコードと実行設定を管理する。"}, evidence: [{type: doc, ref: docs/reference-spark.md#§9}]}
      aws-emr-eks-worker-a: {label: "Executor Pod A", kind: worker, tier: runtime, x: 10, y: 4.5, realizes: [executor-a], slots: 4, description: "入力分割を担当し、中間データを再分配する。", management: {type: customer, scope: "利用者がジョブコードと実行設定を管理する。"}, evidence: [{type: doc, ref: docs/reference-spark.md#§9}]}
      aws-emr-eks-worker-b: {label: "Executor Pod B", kind: worker, tier: runtime, x: 14, y: 4.5, realizes: [executor-b], slots: 4, description: "再分配されたデータを処理する。", management: {type: customer, scope: "利用者がジョブコードと実行設定を管理する。"}, evidence: [{type: doc, ref: docs/reference-spark.md#§9}]}
      aws-emr-eks-capacity: {label: "EKS の EC2 ノード", kind: host, svc: ec2, tier: runtime, x: 14, y: 0.5, description: "ジョブ投入用 Pod、Driver Pod、Executor Pod を稼働させる。", management: {type: shared, scope: "AWS が EC2 基盤を運用し、利用者がノードグループと設定を管理する。"}, evidence: [{type: doc, ref: docs/reference-spark.md#§9}]}
      aws-emr-eks-source: {label: "S3 入力データ", kind: db, tier: data, x: 8, y: 1.5, svc: s3, realizes: [input], description: "受注データを入力用プレフィックスに保持する。", management: {type: shared, scope: "AWS が S3 基盤を運用し、利用者がデータとアクセス権を管理する。"}, evidence: [{type: doc, ref: docs/reference-spark.md#§9}]}
      aws-emr-eks-target: {label: "S3 集計結果", kind: db, tier: data, x: 14, y: 1.5, svc: s3, realizes: [output], description: "集計結果を出力用プレフィックスに保存する。", management: {type: shared, scope: "AWS が S3 基盤を運用し、利用者がデータとアクセス権を管理する。"}, evidence: [{type: doc, ref: docs/reference-spark.md#§9}]}
    links:
      - {id: aws-emr-eks-request, from: aws-emr-eks-cli, to: aws-emr-eks-emr, label: "StartJobRun を呼び出す", realizes: [submit], replace: true, evidence: [{type: doc, ref: docs/reference-spark.md#§9}]}
      - {id: aws-emr-eks-submit-pod, from: aws-emr-eks-emr, to: aws-emr-eks-submitter, label: "ジョブ投入用 Pod を配置", realizes: [submit], replace: true, evidence: [{type: doc, ref: docs/reference-spark.md#§9}]}
      - {id: aws-emr-eks-start-driver, from: aws-emr-eks-submitter, to: aws-emr-eks-driver, label: "Driver Pod を起動", realizes: [submit], replace: true, evidence: [{type: doc, ref: docs/reference-spark.md#§9}]}
      - {id: aws-emr-eks-bind, from: aws-emr-eks-scheduler, to: aws-emr-eks-capacity, label: "EC2 ノードに Pod を割り当て", evidence: [{type: doc, ref: docs/reference-spark.md#§9}]}

    layout2d:
      tiers:
        - {id: diagram, label: EMR on EKS の構成, z: 0, size: [27, 13]}
