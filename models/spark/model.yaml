        aws-emr-eks-driver: {tier: diagram, x: 16, y: 8}
        aws-emr-eks-worker-a: {tier: diagram, x: 21, y: 7}
        aws-emr-eks-worker-b: {tier: diagram, x: 21, y: 10}
        aws-emr-eks-source: {tier: diagram, x: 26, y: 4}
        aws-emr-eks-target: {tier: diagram, x: 26, y: 9}
