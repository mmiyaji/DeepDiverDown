name: Fivetran の基本アーキテクチャ
description: Connector が基幹 DB を初回同期し、cursor を使う増分同期でウェアハウスへロードし、必要なら後段変換を実行する流れ。
reference:
  objectives:
    - Source・Connection・Destination の役割を区別する
    - Initial sync と Incremental sync・cursor の関係を理解する
    - ロード後の変換と再同期を区別する
  sources:
    - title: Get Started with Fivetran
      url: https://fivetran.com/docs/getting-started/quickstart
    - title: Sync Overview
      url: https://fivetran.com/docs/core-concepts/syncoverview
    - title: Fivetran Glossary
      url: https://fivetran.com/docs/getting-started/glossary
    - title: Supported Destinations
      url: https://fivetran.com/docs/destinations
sources:
  - docs/reference-fivetran.md
evidence:
  - type: doc
    ref: docs/reference-fivetran.md#§1
tiers:
  - id: flow
    label: Fivetran データフロー
    z: 0
    origin:
      - 0
      - 0
    size:
      - 16
      - 4
  - id: operation
    label: 同期運用
    z: 1
    origin:
      - 0
      - 0
    size:
      - 16
      - 4
nodes:
  source:
    label: 基幹 DB
    kind: external
    tier: flow
    x: 1
    'y': 2
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§1
      - type: doc
        ref: docs/reference-fivetran.md#§2
  connector:
    label: 取り込み接続
    kind: worker
    tier: flow
    x: 4
    'y': 2
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§1
      - type: doc
        ref: docs/reference-fivetran.md#§3
  initial:
    label: 履歴の初回同期
    kind: service
    tier: flow
    x: 7
    'y': 2
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§2
  incremental:
    label: 更新分の同期
    kind: service
    tier: flow
    x: 10
    'y': 2
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§3
  destination:
    label: 分析用ウェアハウス
    kind: db
    tier: flow
    x: 13
    'y': 2
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§1
      - type: doc
        ref: docs/reference-fivetran.md#§4
  cursor:
    label: 同期の進捗位置
    kind: db
    tier: operation
    x: 6
    'y': 2
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§3
  transform:
    label: ロード後の SQL 変換
    kind: service
    tier: operation
    x: 12
    'y': 2
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§5
links:
  - id: extract
    from: source
    to: connector
    label: データを抽出
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§1
  - id: historical
    from: connector
    to: initial
    label: 履歴を初回同期
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§2
  - id: changes
    from: connector
    to: incremental
    label: 追加・変更を抽出
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§3
  - id: position
    from: incremental
    to: cursor
    label: 成功位置を記録
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§3
  - id: load
    from: initial
    to: destination
    label: 履歴をロード
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§2
      - type: doc
        ref: docs/reference-fivetran.md#§4
  - id: load-incremental
    from: incremental
    to: destination
    label: 増分をロード
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§3
      - type: doc
        ref: docs/reference-fivetran.md#§4
  - id: transform-link
    from: destination
    to: transform
    label: ロード後に変換
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§5
  - id: resume
    from: cursor
    to: incremental
    label: 次回の増分境界
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§3
scenarios:
  - id: initial-to-incremental
    label: 初回同期から増分同期へ
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§1
      - type: doc
        ref: docs/reference-fivetran.md#§2
      - type: doc
        ref: docs/reference-fivetran.md#§3
      - type: doc
        ref: docs/reference-fivetran.md#§4
      - type: doc
        ref: docs/reference-fivetran.md#§5
    steps:
      - links:
          - extract
          - historical
        note: Source と Destination を設定し履歴を Initial sync する。
      - links:
          - load
        note: 履歴データを Destination にロードする。
      - links:
          - changes
          - position
        note: 成功後は追加・変更だけを取り cursor を更新する。
      - links:
          - load-incremental
          - transform-link
        note: 増分をロードし必要なら Destination 上で変換する。
  - id: failed-sync
    label: 失敗と再同期の判断
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§5
    steps:
      - links:
          - changes
          - load-incremental
        note: 同期が失敗した場合は、Destination へ反映済みの範囲を確認する。
      - links:
          - position
        note: 接続状態とエラーを確認する。
      - links:
          - historical
          - load
        note: 整合性修復が必要なら再同期を検討する。
requirements:
  - id: BR-01
    kind: usecase
    title: 受注データを履歴から継続同期
    text: Initial sync 後は cursor を使って更新する。
    links:
      - historical
      - load
      - changes
      - position
      - load-incremental
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§2
  - id: NFR-01
    kind: nfr
    title: 失敗と再同期を区別
    text: 通常の増分同期と整合性修復を混同しない。
    links:
      - position
      - historical
      - load
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§5
unknowns:
  - id: UNK-01
    text: Connector 種別・同期間隔・Destination 製品名は確定していない。
    refs:
      - extract
      - load-incremental
gates:
  maxDrift: 0
  maxHigh: 0
implementations:
  - id: postgres-snowflake
    label: RDS PostgreSQL → Fivetran SaaS → Snowflake
    description: RDS PostgreSQL から Fivetran の SaaS 接続で Snowflake に同期し、Snowflake Warehouse で変換する例。
    sources:
      - title: Get Started with Fivetran
        url: https://fivetran.com/docs/getting-started/quickstart
      - title: Sync Overview
        url: https://fivetran.com/docs/core-concepts/syncoverview
      - title: Fivetran Glossary
        url: https://fivetran.com/docs/getting-started/glossary
      - title: Supported Destinations
        url: https://fivetran.com/docs/destinations
      - title: Fivetran PostgreSQL Connector
        url: https://fivetran.com/docs/connectors/databases/postgresql
      - title: Fivetran Snowflake destination
        url: https://fivetran.com/docs/destinations/snowflake
      - title: Fivetran Transformations for dbt
        url: https://fivetran.com/docs/transformations/dbt
      - title: PostgreSQL setup guide
        url: https://fivetran.com/docs/connectors/databases/postgresql/setup-guide
      - title: Snowflake destination setup
        url: https://fivetran.com/docs/destinations/snowflake/setup-guide
    tiers:
      - id: setup
        label: 接続と変換の設定
        z: 1
        size:
          - 25
          - 3
      - id: processing
        label: 同期と分析
        z: 0
        size:
          - 25
          - 3
    nodes:
      postgres-snowflake-runner:
        label: Fivetran のホスト型 dbt 実行
        kind: worker
        tier: processing
        x: 4
        y: 0
        description: Fivetran が dbt を実行し、生成した SQL を Snowflake へ送る。
        evidence: [{type: doc, ref: docs/reference-fivetran.md#§6}]
      postgres-snowflake-pg:
        label: Amazon RDS for PostgreSQL
        kind: db
        tier: processing
        x: 0
        'y': 1.5
        realizes:
          - source
        description: RDS の PostgreSQL が注文テーブルと変更を提供する。
        evidence:
          - type: doc
            ref: docs/reference-fivetran.md#§6
        svc: rds
        management: {type: shared, scope: "AWS が RDS 基盤を運用し、利用者が DB・レプリケーションと権限を設定する。"}
      postgres-snowflake-connection:
        label: Fivetran SaaS / PostgreSQL 接続
        kind: service
        tier: processing
        x: 4
        'y': 1.5
        realizes:
          - connector
          - initial
          - incremental
          - cursor
        description: Fivetran が接続を運用し、初回・増分同期と進捗を管理する。
        evidence:
          - type: doc
            ref: docs/reference-fivetran.md#§6
      postgres-snowflake-snowflake:
        svc: snowflake:platform
        label: Snowflake / RAW テーブル
        kind: db
        tier: processing
        x: 8
        'y': 1.5
        realizes:
          - destination
        description: 同期されたデータを RAW テーブルとして保持する。
        evidence:
          - type: doc
            ref: docs/reference-fivetran.md#§6
      postgres-snowflake-publication:
        label: PostgreSQL の論理レプリケーション設定
        kind: policy
        tier: setup
        x: 0
        'y': 1.5
        description: 同期テーブルを公開し、コネクターが対象の変更を受け取れるようにする。
        evidence:
          - type: doc
            ref: docs/reference-fivetran.md#§6
      postgres-snowflake-dbt:
        label: Git の dbt プロジェクト
        kind: file
        tier: setup
        x: 12
        'y': 1.5
        description: 同期後に変換を実行する場合のモデル定義を保持する。
        evidence:
          - type: doc
            ref: docs/reference-fivetran.md#§6
      postgres-snowflake-warehouse:
        label: Snowflake / 実行 Warehouse
        svc: snowflake:warehouse
        kind: service
        tier: processing
        x: 12
        'y': 1.5
        description: ロードと SQL 変換の処理能力を提供する。
        realizes:
          - transform
        evidence:
          - type: doc
            ref: docs/reference-fivetran.md#§6
    links:
      - id: postgres-snowflake-publication-connection
        from: postgres-snowflake-publication
        to: postgres-snowflake-pg
        label: 公開テーブルとスロットを設定
      - id: postgres-snowflake-dbt-connection
        from: postgres-snowflake-dbt
        to: postgres-snowflake-runner
        label: dbt プロジェクトを読み込む
      - {id: postgres-snowflake-runner-sql, from: postgres-snowflake-runner, to: postgres-snowflake-warehouse, label: 変換 SQL を実行}
      - {id: postgres-snowflake-runner-trigger, from: postgres-snowflake-connection, to: postgres-snowflake-runner, label: 同期後に変換を起動}
      - id: postgres-snowflake-load-compute
        from: postgres-snowflake-connection
        to: postgres-snowflake-warehouse
        label: ロード用 Warehouse を利用
        evidence:
          - type: doc
            ref: docs/reference-fivetran.md#§6
    groups:
      - kind: cloud
        provider: aws
        label: AWS アカウント
        tier:
          - processing
        nodes:
          - postgres-snowflake-pg
      - kind: cloud
        label: Fivetran SaaS
        tier:
          - processing
        nodes:
          - postgres-snowflake-connection
          - postgres-snowflake-runner
      - kind: cloud
        provider: snowflake
        label: Snowflake アカウント
        tier:
          - processing
        nodes:
          - postgres-snowflake-snowflake
          - postgres-snowflake-warehouse

    layout2d:
      tiers:
        - {id: diagram, label: サービス別の実装構成, z: 0, size: [22, 12]}
      nodes:
        postgres-snowflake-pg: {tier: diagram, x: 2, y: 3}
        postgres-snowflake-publication: {tier: diagram, x: 2, y: 7}
        postgres-snowflake-connection: {tier: diagram, x: 8, y: 3}
        postgres-snowflake-runner: {tier: diagram, x: 8, y: 7}
        postgres-snowflake-dbt: {tier: diagram, x: 14, y: 10}
        postgres-snowflake-snowflake: {tier: diagram, x: 18, y: 3}
        postgres-snowflake-warehouse: {tier: diagram, x: 18, y: 7}
      groups:
        - {kind: cloud, label: AWS アカウント, provider: aws, tier: [diagram], x0: 0, y0: 0, x1: 4, y1: 9, nodes: [postgres-snowflake-pg, postgres-snowflake-publication]}
        - {kind: cloud, label: Fivetran SaaS, tier: [diagram], x0: 6, y0: 0, x1: 10, y1: 9, nodes: [postgres-snowflake-connection, postgres-snowflake-runner]}
        - {kind: cloud, label: Snowflake アカウント, provider: snowflake, tier: [diagram], x0: 16, y0: 0, x1: 20, y1: 9, nodes: [postgres-snowflake-snowflake, postgres-snowflake-warehouse]}
    layout3d:
      tiers:
        - {id: aws, label: AWS, z: 0, size: [5, 7]}
        - {id: fivetran, label: Fivetran SaaS, z: 0, origin: [8, 0], size: [5, 7]}
        - {id: git, label: Git, z: 0, origin: [15, 0], size: [4, 7]}
        - {id: snowflake, label: Snowflake, z: 0, origin: [22, 0], size: [5, 7]}
      nodes:
        postgres-snowflake-pg: {tier: aws, x: 2, y: 2}
        postgres-snowflake-publication: {tier: aws, x: 2, y: 5}
        postgres-snowflake-connection: {tier: fivetran, x: 2, y: 2}
        postgres-snowflake-runner: {tier: fivetran, x: 2, y: 5}
        postgres-snowflake-dbt: {tier: git, x: 2, y: 3}
        postgres-snowflake-snowflake: {tier: snowflake, x: 2, y: 2}
        postgres-snowflake-warehouse: {tier: snowflake, x: 2, y: 5}
      groups:
        - {kind: cloud, label: AWS アカウント, provider: aws, tier: [aws], nodes: [postgres-snowflake-pg, postgres-snowflake-publication]}
        - {kind: cloud, label: Fivetran SaaS, tier: [fivetran], nodes: [postgres-snowflake-connection, postgres-snowflake-runner]}
        - {kind: cloud, label: Snowflake アカウント, provider: snowflake, tier: [snowflake], nodes: [postgres-snowflake-snowflake, postgres-snowflake-warehouse]}
