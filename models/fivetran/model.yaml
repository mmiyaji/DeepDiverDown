name: Fivetran の基本アーキテクチャ
description: Connector が基幹 DB を初回同期し、cursor を使う増分同期でウェアハウスへロードし、必要なら後段変換を実行する流れ。
reference:
  objectives:
    - Source・Connection・Destination の役割を区別する
    - Initial sync と Incremental sync・cursor の関係を理解する
    - ロード後の変換と再同期を区別する
  sources:
    - title: Get Started with Fivetran
      url: https://fivetran.com/docs/getting-started/quickstart
    - title: Sync Overview
      url: https://fivetran.com/docs/core-concepts/syncoverview
    - title: Fivetran Glossary
      url: https://fivetran.com/docs/getting-started/glossary
    - title: Supported Destinations
      url: https://fivetran.com/docs/destinations
sources:
  - docs/reference-fivetran.md
evidence:
  - type: doc
    ref: docs/reference-fivetran.md#§1
tiers:
  - id: flow
    label: Fivetran データフロー
    z: 0
    origin:
      - 0
      - 0
    size:
      - 16
      - 4
  - id: operation
    label: 同期運用
    z: 1
    origin:
      - 0
      - 0
    size:
      - 16
      - 4
nodes:
  source:
    label: 基幹 DB
    kind: external
    tier: flow
    x: 1
    'y': 2
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§1
      - type: doc
        ref: docs/reference-fivetran.md#§2
  connector:
    label: 取り込み接続
    kind: worker
    tier: flow
    x: 4
    'y': 2
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§1
      - type: doc
        ref: docs/reference-fivetran.md#§3
  initial:
    label: 履歴の初回同期
    kind: service
    tier: flow
    x: 7
    'y': 2
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§2
  incremental:
    drill: fivetran-postgresql-cdc
    label: 更新分の同期
    kind: service
    tier: flow
    x: 10
    'y': 2
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§3
  destination:
    label: 分析用ウェアハウス
    kind: db
    tier: flow
    x: 13
    'y': 2
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§1
      - type: doc
        ref: docs/reference-fivetran.md#§4
  cursor:
    label: 同期の進捗位置
    kind: db
    tier: operation
    x: 6
    'y': 2
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§3
  transform:
    drill: fivetran-dbt-integrated-scheduling
    label: ロード後の SQL 変換
    kind: service
    tier: operation
    x: 12
    'y': 2
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§5
links:
  - id: extract
    from: source
    to: connector
    label: データを抽出
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§1
  - id: historical
    from: connector
    to: initial
    label: 履歴を初回同期
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§2
  - id: changes
    from: connector
    to: incremental
    label: 追加・変更を抽出
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§3
  - id: position
    from: incremental
    to: cursor
    label: 成功位置を記録
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§3
  - id: load
    from: initial
    to: destination
    label: 履歴をロード
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§2
      - type: doc
        ref: docs/reference-fivetran.md#§4
  - id: load-incremental
    from: incremental
    to: destination
    label: 増分をロード
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§3
      - type: doc
        ref: docs/reference-fivetran.md#§4
  - id: transform-link
    from: destination
    to: transform
    label: ロード後に変換
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§5
  - id: resume
    from: cursor
    to: incremental
    label: 次回の増分境界
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§3
scenarios:
  - id: initial-to-incremental
    label: 初回同期から増分同期へ
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§1
      - type: doc
        ref: docs/reference-fivetran.md#§2
      - type: doc
        ref: docs/reference-fivetran.md#§3
      - type: doc
        ref: docs/reference-fivetran.md#§4
      - type: doc
        ref: docs/reference-fivetran.md#§5
    steps:
      - links:
          - extract
          - historical
        note: Source と Destination を設定し履歴を Initial sync する。
      - links:
          - load
        note: 履歴データを Destination にロードする。
      - links:
          - changes
          - position
        note: 成功後は追加・変更だけを取り cursor を更新する。
      - links:
          - load-incremental
          - transform-link
        note: 増分をロードし必要なら Destination 上で変換する。
  - id: failed-sync
    label: 失敗と再同期の判断
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§5
    steps:
      - links:
          - changes
          - load-incremental
        note: 同期が失敗した場合は、Destination へ反映済みの範囲を確認する。
      - links:
          - position
        note: 接続状態とエラーを確認する。
      - links:
          - historical
          - load
        note: 整合性修復が必要なら再同期を検討する。
requirements:
  - id: BR-01
    kind: usecase
    title: 受注データを履歴から継続同期
    text: Initial sync 後は cursor を使って更新する。
    links:
      - historical
      - load
      - changes
      - position
      - load-incremental
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§2
  - id: NFR-01
    kind: nfr
    title: 失敗と再同期を区別
    text: 通常の増分同期と整合性修復を混同しない。
    links:
      - position
      - historical
      - load
    evidence:
      - type: doc
        ref: docs/reference-fivetran.md#§5
unknowns:
  - id: UNK-01
    text: Connector 種別・同期間隔・Destination 製品名は確定していない。
    refs:
      - extract
      - load-incremental
gates:
  maxDrift: 0
  maxHigh: 0
implementations:
  - id: postgres-snowflake
    label: "RDS for PostgreSQL・Fivetran SaaS・Snowflake"
    description: "Amazon RDS for PostgreSQL から Snowflake に注文データを同期する。Fivetran が GitHub.com の dbt プロジェクトを取得し、Snowflake でマートを作る例。"
    sources:
      - {title: "PostgreSQL Connector Setup Guide", url: https://fivetran.com/docs/connectors/databases/postgresql/setup-guide}
      - {title: "Amazon RDS for PostgreSQL · Logical replication", url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/PostgreSQL.Concepts.General.FeatureSupport.LogicalReplication.html}
      - {title: "Snowflake Destination Setup Guide", url: https://fivetran.com/docs/destinations/snowflake/setup-guide}
      - {title: "Fivetran Transformations for dbt", url: https://fivetran.com/docs/transformations/dbt}
      - {title: "Transformations for dbt Setup Guide", url: https://fivetran.com/docs/transformations/dbt/setup-guide}
      - {title: "GitHub Docs · Managing deploy keys", url: https://docs.github.com/en/authentication/connecting-to-github-with-ssh/managing-deploy-keys}
    tiers:
      - {id: aws, label: "利用者の AWS アカウント", z: 0, origin: [0, 0], size: [6, 9]}
      - {id: fivetran, label: "Fivetran の接続とジョブ", z: 0, origin: [10, 0], size: [9, 9]}
      - {id: snowflake, label: "Snowflake のデータと実行", z: 0, origin: [22, 0], size: [12, 9]}
      - {id: github, label: "dbt プロジェクトの保管", z: 0, origin: [10, -8], size: [9, 5]}
    nodes:
      postgres-snowflake-pg:
        label: "Amazon RDS for PostgreSQL"
        kind: db
        svc: rds
        tier: aws
        x: 3
        y: 3
        realizes: [source]
        description: "主インスタンスの注文テーブルを初回同期の入力にし、変更を WAL に記録する。"
        management: {type: shared, scope: "AWS が RDS の基盤を運用する。利用者がテーブル・論理レプリケーション・TLS・ソース権限を設定する。"}
        evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]
      postgres-snowflake-publication:
        label: "Publication とスロット"
        kind: policy
        provider: aws
        tier: aws
        x: 3
        y: 6.5
        description: "Publication で対象テーブルを選び、pgoutput の論理レプリケーションスロットを使う。"
        management: {type: customer, scope: "利用者が RDS 上の publication とスロットを設定する。"}
        evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]
      postgres-snowflake-connection:
        label: "PostgreSQL 接続"
        kind: service
        svc: fivetran:platform
        tier: fivetran
        x: 3.5
        y: 2.5
        realizes: [connector, initial, incremental]
        description: "Fivetran が初回・増分同期と進捗を管理する。RDS に TLS で接続し、Snowflake では専用ユーザーのキーペア認証を使う。"
        evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]
      postgres-snowflake-cursor:
        label: "同期の進捗位置"
        kind: db
        provider: fivetran
        tier: fivetran
        x: 7
        y: 5.2
        realizes: [cursor]
        description: "増分同期を再開する WAL の位置を記録する。Fivetran の内部の保存先は未確認。"
        evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]
      postgres-snowflake-runner:
        label: "ホスト型 dbt ジョブ"
        kind: worker
        provider: fivetran
        tier: fivetran
        x: 2.2
        y: 6.5
        description: "Fivetran が dbt CLI の実行環境を用意する。取得したプロジェクトを使い、生成された SQL を Snowflake に送る。"
        evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]
      postgres-snowflake-snowflake:
        label: "Snowflake の RAW テーブル"
        kind: table
        provider: snowflake
        tier: snowflake
        x: 3
        y: 2.5
        realizes: [destination]
        description: "同期された注文データを保持する。"
        evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]
      postgres-snowflake-warehouse:
        label: "Snowflake Warehouse"
        kind: service
        svc: snowflake:warehouse
        tier: snowflake
        x: 3
        y: 6.5
        realizes: [transform]
        description: "同じ例のロードと SQL 変換で使う計算資源。"
        evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]
      postgres-snowflake-mart:
        label: "注文マート"
        kind: table
        provider: snowflake
        tier: snowflake
        x: 8.5
        y: 6.5
        description: "dbt モデルが生成する分析用の出力テーブル。"
        evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]
      postgres-snowflake-role:
        label: "Snowflake ユーザーとロール"
        kind: policy
        provider: snowflake
        tier: snowflake
        x: 8.5
        y: 2.5
        description: "専用サービスユーザーの公開鍵とロールを Snowflake 内に設定する。ロールに Warehouse 利用権限と対象スキーマの権限を与える。"
        evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]
      postgres-snowflake-git:
        label: "GitHub.com"
        kind: service
        svc: github:platform
        tier: github
        x: 2
        y: 2
        description: "Fivetran の公開鍵を読み取り専用の Deploy key として対象リポジトリに登録する。"
        evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]
      postgres-snowflake-dbt:
        label: "dbt プロジェクト"
        kind: file
        provider: github
        tier: github
        x: 6.5
        y: 2
        description: "注文マートのモデルを含む GitHub.com のリポジトリ。利用者がコードとリポジトリへのアクセスを管理する。"
        evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]
    links:
      - {id: postgres-snowflake-publication-pg, from: postgres-snowflake-publication, to: postgres-snowflake-pg, label: "公開テーブルとスロットを設定", evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]}
      - {id: postgres-snowflake-rds-request, from: postgres-snowflake-connection, to: postgres-snowflake-pg, label: "TLS で接続して注文データを読む", evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]}
      - {id: postgres-snowflake-history, from: postgres-snowflake-pg, to: postgres-snowflake-connection, label: "選択テーブルの履歴を渡す", realizes: [extract, historical], replace: true, evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]}
      - {id: postgres-snowflake-changes, from: postgres-snowflake-pg, to: postgres-snowflake-connection, label: "WAL の変更を渡す", realizes: [changes], replace: true, evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]}
      - {id: postgres-snowflake-save-cursor, from: postgres-snowflake-connection, to: postgres-snowflake-cursor, label: "同期の進捗を記録", realizes: [position], replace: true, evidence: [{type: doc, ref: "docs/reference-fivetran.md#§3"}]}
      - {id: postgres-snowflake-resume-cursor, from: postgres-snowflake-cursor, to: postgres-snowflake-connection, label: "次回の増分開始位置を渡す", realizes: [resume], replace: true, evidence: [{type: doc, ref: "docs/reference-fivetran.md#§3"}]}
      - {id: postgres-snowflake-load-auth, from: postgres-snowflake-connection, to: postgres-snowflake-role, label: "専用ユーザーのキーペアで認証", evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]}
      - {id: postgres-snowflake-load-compute, from: postgres-snowflake-connection, to: postgres-snowflake-warehouse, label: "Warehouse を使ってロード", realizes: [load, load-incremental], replace: true, evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]}
      - {id: postgres-snowflake-load-data, from: postgres-snowflake-warehouse, to: postgres-snowflake-snowflake, label: "RAW テーブルに反映", realizes: [load, load-incremental], replace: true, evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]}
      - {id: postgres-snowflake-runner-trigger, from: postgres-snowflake-connection, to: postgres-snowflake-runner, label: "関連する同期の成功後にジョブを起動", realizes: [transform-link], replace: true, evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]}
      - {id: postgres-snowflake-git-fetch, from: postgres-snowflake-runner, to: postgres-snowflake-git, label: "Deploy key でプロジェクトを取得", evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]}
      - {id: postgres-snowflake-git-repo, from: postgres-snowflake-git, to: postgres-snowflake-dbt, label: "対象リポジトリの読み取りを許可", evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]}
      - {id: postgres-snowflake-runner-sql, from: postgres-snowflake-runner, to: postgres-snowflake-warehouse, label: "dbt が生成した SQL を送る", realizes: [transform-link], replace: true, evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]}
      - {id: postgres-snowflake-read-raw, from: postgres-snowflake-snowflake, to: postgres-snowflake-warehouse, label: "RAW テーブルを読む", realizes: [transform-link], replace: true, evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]}
      - {id: postgres-snowflake-write-mart, from: postgres-snowflake-warehouse, to: postgres-snowflake-mart, label: "注文マートを作成", realizes: [transform-link], replace: true, evidence: [{type: doc, ref: "docs/reference-fivetran.md#§6"}]}
    groups:
      - {kind: cloud, provider: aws, label: "AWS アカウント", tier: [aws], nodes: [postgres-snowflake-pg, postgres-snowflake-publication]}
      - {kind: cloud, provider: fivetran, label: "Fivetran SaaS", tier: [fivetran], nodes: [postgres-snowflake-connection, postgres-snowflake-runner, postgres-snowflake-cursor]}
      - {kind: cloud, provider: snowflake, label: "Snowflake アカウント", tier: [snowflake], nodes: [postgres-snowflake-snowflake, postgres-snowflake-warehouse, postgres-snowflake-mart, postgres-snowflake-role]}
      - {kind: cloud, provider: github, label: "GitHub.com", tier: [github], nodes: [postgres-snowflake-git, postgres-snowflake-dbt]}
    layout2d:
      tiers:
        - {id: diagram, label: "RDS から Snowflake への同期と変換", z: 0, size: [36, 16]}
      nodes:
        postgres-snowflake-pg: {tier: diagram, x: 3.5, y: 3.2}
        postgres-snowflake-publication: {tier: diagram, x: 3.5, y: 7.3}
        postgres-snowflake-connection: {tier: diagram, x: 10.8, y: 3.2}
        postgres-snowflake-runner: {tier: diagram, x: 10.8, y: 7.3}
        postgres-snowflake-cursor: {tier: diagram, x: 15.5, y: 7.3}
        postgres-snowflake-snowflake: {tier: diagram, x: 22, y: 3.2}
        postgres-snowflake-warehouse: {tier: diagram, x: 22, y: 7.3}
        postgres-snowflake-mart: {tier: diagram, x: 29.5, y: 7.3}
        postgres-snowflake-role: {tier: diagram, x: 29.5, y: 3.2}
        postgres-snowflake-git: {tier: diagram, x: 10.3, y: 12.7}
        postgres-snowflake-dbt: {tier: diagram, x: 16, y: 12.7}
      groups:
        - {kind: cloud, provider: aws, label: "AWS アカウント", tier: [diagram], x0: 0.2, y0: 0.6, x1: 6.9, y1: 9.6, nodes: [postgres-snowflake-pg, postgres-snowflake-publication]}
        - {kind: cloud, provider: fivetran, label: "Fivetran SaaS", tier: [diagram], x0: 8.2, y0: 0.6, x1: 17.6, y1: 9.6, nodes: [postgres-snowflake-connection, postgres-snowflake-runner, postgres-snowflake-cursor]}
        - {kind: cloud, provider: snowflake, label: "Snowflake アカウント", tier: [diagram], x0: 18, y0: 0.6, x1: 33.6, y1: 9.6, nodes: [postgres-snowflake-snowflake, postgres-snowflake-warehouse, postgres-snowflake-mart, postgres-snowflake-role]}
        - {kind: cloud, provider: github, label: "GitHub.com", tier: [diagram], x0: 7.3, y0: 10.7, x1: 19, y1: 15.1, nodes: [postgres-snowflake-git, postgres-snowflake-dbt]}
    layout3d:
      tiers:
        - {id: aws, label: "利用者の AWS アカウント", z: 0, origin: [0, 0], size: [6, 9]}
        - {id: fivetran, label: "Fivetran の接続とジョブ", z: 0, origin: [10, 0], size: [9, 9]}
        - {id: snowflake, label: "Snowflake のデータと実行", z: 0, origin: [22, 0], size: [12, 9]}
        - {id: github, label: "dbt プロジェクトの保管", z: 0, origin: [10, -8], size: [9, 5]}
      nodes:
        postgres-snowflake-pg: {tier: aws, x: 3, y: 3}
        postgres-snowflake-publication: {tier: aws, x: 3, y: 6.5}
        postgres-snowflake-connection: {tier: fivetran, x: 3.5, y: 2.5}
        postgres-snowflake-runner: {tier: fivetran, x: 2.2, y: 6.5}
        postgres-snowflake-cursor: {tier: fivetran, x: 7, y: 5.2}
        postgres-snowflake-snowflake: {tier: snowflake, x: 3, y: 2.5}
        postgres-snowflake-warehouse: {tier: snowflake, x: 3, y: 6.5}
        postgres-snowflake-mart: {tier: snowflake, x: 8.5, y: 6.5}
        postgres-snowflake-role: {tier: snowflake, x: 8.5, y: 2.5}
        postgres-snowflake-git: {tier: github, x: 2, y: 2}
        postgres-snowflake-dbt: {tier: github, x: 6.5, y: 2}
      groups:
        - {kind: cloud, provider: aws, label: "AWS アカウント", tier: [aws], nodes: [postgres-snowflake-pg, postgres-snowflake-publication]}
        - {kind: cloud, provider: fivetran, label: "Fivetran SaaS", tier: [fivetran], nodes: [postgres-snowflake-connection, postgres-snowflake-runner, postgres-snowflake-cursor]}
        - {kind: cloud, provider: snowflake, label: "Snowflake アカウント", tier: [snowflake], nodes: [postgres-snowflake-snowflake, postgres-snowflake-warehouse, postgres-snowflake-mart, postgres-snowflake-role]}
        - {kind: cloud, provider: github, label: "GitHub.com", tier: [github], nodes: [postgres-snowflake-git, postgres-snowflake-dbt]}
