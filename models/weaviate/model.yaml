name: Weaviate のベクトル検索とシャード
description: コレクションのオブジェクトをシャードに分け、各シャードがベクトル索引・転置索引・オブジェクトストアを持つ。メタデータは Raft、データは複製係数で複製する。
reference:
  objectives: [コレクション・シャード・3 種類の保存先の関係を確認する, メタデータの合意とデータ複製の違いを確認する, ベクトル化モジュールと検索の流れを確認する]
  sources:
    - {title: Weaviate data structure, url: https://docs.weaviate.io/weaviate/concepts/data}
    - {title: Weaviate replication architecture, url: https://docs.weaviate.io/weaviate/concepts/replication-architecture}
    - {title: Weaviate vector index, url: https://docs.weaviate.io/weaviate/concepts/vector-index}
    - {title: Weaviate (GitHub), url: https://github.com/weaviate/weaviate}
    - {title: Weaviate deployment, url: https://docs.weaviate.io/deploy}
    - {title: Weaviate vector quantization, url: https://docs.weaviate.io/weaviate/concepts/vector-quantization}
    - {title: Weaviate PQ compression, url: https://docs.weaviate.io/weaviate/configuration/compression/pq-compression}
    - {title: Weaviate BQ compression, url: https://docs.weaviate.io/weaviate/configuration/compression/bq-compression}
    - {title: Weaviate SQ compression, url: https://docs.weaviate.io/weaviate/configuration/compression/sq-compression}
    - {title: Weaviate RQ compression, url: https://docs.weaviate.io/weaviate/configuration/compression/rq-compression}
sources: [docs/reference-weaviate.md]
evidence: [{type: doc, ref: docs/reference-weaviate.md#§1}, {type: doc, ref: docs/reference-weaviate.md#§6}]
tiers:
  - {id: flow, label: 利用・メタデータ・シャード, z: 0, size: [29, 12]}
nodes:
  client: {label: クライアント, kind: client, tier: flow, x: 1, y: 5, description: REST・gRPC・GraphQL のいずれかで接続する。, evidence: [{type: doc, ref: docs/reference-weaviate.md#§2}]}
  api: {label: API とクエリ処理, kind: service, tier: flow, x: 7, y: 5, description: 受けたノードが、データを持たないノードへの要求を内部で転送する。ベクトル検索とキーワード検索（BM25）を組み合わせたハイブリッド検索を扱う。, evidence: [{type: doc, ref: docs/reference-weaviate.md#§2}]}
  vectorizer: {label: ベクトル化モジュール, kind: service, tier: flow, x: 7, y: 1.5, description: 外部サービスの API またはローカル推論コンテナでテキストなどをベクトルにする。利用者が用意したベクトルの取り込みも可能。, evidence: [{type: doc, ref: docs/reference-weaviate.md#§2}]}
  collection: {label: コレクション, kind: db, tier: flow, x: 13, y: 5, description: スキーマを共有するオブジェクトの集合。ベクトライザー、索引、複製の設定を持ち、名前付きベクトルを複数持てる。, evidence: [{type: doc, ref: docs/reference-weaviate.md#§3}]}
  raft: {label: メタデータの合意（Raft）, kind: service, tier: flow, x: 13, y: 1.5, description: v1.25 以降、コレクション定義とテナントの状態をリーダー経由の Raft で確定し、全ノードへ複製する。, evidence: [{type: doc, ref: docs/reference-weaviate.md#§4}]}
  shard: {label: シャード, kind: db, tier: flow, x: 19, y: 5, description: コレクションのデータの分割単位。マルチテナントではテナントごとに 1 シャードで、専用の索引を持つ。, evidence: [{type: doc, ref: docs/reference-weaviate.md#§3}]}
  replication: {label: データ複製（リーダーレス）, kind: service, tier: flow, x: 19, y: 9.5, description: 複製係数ぶんのレプリカへ書く。一貫性レベル ONE・QUORUM・ALL を書き込みと読み取りで選ぶ。, evidence: [{type: doc, ref: docs/reference-weaviate.md#§4}]}
  vindex: {label: ベクトル索引, kind: db, tier: flow, x: 25, y: 2, description: HNSW、flat、dynamic から選ぶ。HNSW はメモリ上のグラフで、PQ・SQ・BQ・RQ の量子化でメモリを減らせる（flat は BQ と RQ のみ）。, evidence: [{type: doc, ref: docs/reference-weaviate.md#§5}]}
  inverted: {label: 転置索引, kind: db, tier: flow, x: 25, y: 5.5, description: BM25 のキーワード検索とフィルター用の索引。, evidence: [{type: doc, ref: docs/reference-weaviate.md#§3}]}
  objstore: {label: オブジェクトストア, kind: db, tier: flow, x: 25, y: 9, description: オブジェクトのプロパティ、メタデータ、ベクトルを保持する。, evidence: [{type: doc, ref: docs/reference-weaviate.md#§3}]}
links:
  - {id: c-api, from: client, to: api, label: 登録・検索を要求, evidence: [{type: doc, ref: docs/reference-weaviate.md#§2}]}
  - {id: api-vec, from: api, to: vectorizer, label: ベクトル化を依頼, evidence: [{type: doc, ref: docs/reference-weaviate.md#§2}]}
  - {id: vec-coll, from: vectorizer, to: collection, label: ベクトルを付けて登録, evidence: [{type: doc, ref: docs/reference-weaviate.md#§2}]}
  - {id: api-coll, from: api, to: collection, label: 検索・取得を実行, evidence: [{type: doc, ref: docs/reference-weaviate.md#§2}]}
  - {id: coll-raft, from: collection, to: raft, label: 定義の変更を合意, evidence: [{type: doc, ref: docs/reference-weaviate.md#§4}]}
  - {id: coll-shard, from: collection, to: shard, label: シャードに分割, evidence: [{type: doc, ref: docs/reference-weaviate.md#§3}]}
  - {id: shard-repl, from: shard, to: replication, label: レプリカへ書く, evidence: [{type: doc, ref: docs/reference-weaviate.md#§4}]}
  - {id: shard-vi, from: shard, to: vindex, label: ベクトルを索引化, evidence: [{type: doc, ref: docs/reference-weaviate.md#§5}]}
  - {id: shard-inv, from: shard, to: inverted, label: プロパティを索引化, evidence: [{type: doc, ref: docs/reference-weaviate.md#§3}]}
  - {id: shard-obj, from: shard, to: objstore, label: オブジェクトを保存, evidence: [{type: doc, ref: docs/reference-weaviate.md#§3}]}
scenarios:
  - id: ingest-and-search
    label: 登録して検索する
    evidence: [{type: doc, ref: docs/reference-weaviate.md#§2}]
    steps:
      - {links: [c-api, api-vec, vec-coll], note: オブジェクトをベクトル化してコレクションへ登録する。}
      - {links: [coll-shard, shard-obj, shard-vi, shard-inv], note: シャードがオブジェクト、ベクトル索引、転置索引へ書く。}
      - {links: [shard-repl], note: 複製係数が 1 を超えると、ほかのノードのレプリカへ書く。}
      - {links: [api-coll], note: 検索はベクトル索引と転置索引を使う。}
unknowns:
  - {id: UNK-01, text: 保存の内部形式（LSM など）は取得した資料に記載がなく未確認。, refs: [objstore, inverted]}
  - {id: UNK-02, text: ハイブリッド検索の結果の統合方法とフィルター付き検索の実装は取得した資料に記載がなく未確認。, refs: [api, vindex]}
  - {id: UNK-03, text: 非同期複製の伝播の仕組みと read repair の動作は取得した資料に記載がなく未確認。, refs: [replication]}
  - {id: UNK-04, text: 永続ボリュームの設定、バックアップ、認証・RBAC の詳細は取得した資料に記載がなく未確認。, refs: [objstore]}
  - {id: UNK-05, text: PQ・BQ・SQ が導入された版番号は取得した資料に記載がなく未確認。, refs: [vindex]}
gates: {maxDrift: 0, maxHigh: 0}
implementations:
  - id: onprem-cluster
    label: 自前のサーバーの Kubernetes 上の 3 ノード
    description: 自前の Kubernetes クラスタに Helm チャートで Weaviate を 3 ノード配置し、複製係数 2 のコレクションを持つ例。ベクトル化はローカル推論コンテナ。図はノード 2 台に省略している。代表例であり、導入事例や動作検証済みの構成ではない。
    sources:
      - {title: Weaviate deployment, url: https://docs.weaviate.io/deploy}
      - {title: Weaviate replication architecture, url: https://docs.weaviate.io/weaviate/concepts/replication-architecture}
      - {title: Weaviate (GitHub), url: https://github.com/weaviate/weaviate}
    tiers:
      - {id: diagram, label: クライアント・Weaviate・ストレージ, z: 0, size: [29, 11]}
    nodes:
      wv-client: {label: クライアント, kind: client, tier: diagram, x: 1, y: 5, realizes: [client], description: 公式クライアントライブラリで REST・gRPC を使う。, evidence: [{type: doc, ref: docs/reference-weaviate.md#§7}]}
      wv-infer: {label: ローカル推論コンテナ, kind: worker, tier: diagram, x: 9, y: 1.5, realizes: [vectorizer], description: ベクトル化モジュールが呼ぶ推論コンテナ。モデルは固定しない。, management: {type: customer, scope: "Customer operates the container and model."}, evidence: [{type: doc, ref: docs/reference-weaviate.md#§7}]}
      wv-node-a: {label: Weaviate ノード A, kind: service, tier: diagram, x: 9, y: 5, realizes: [api, collection, raft, shard, vindex, inverted, objstore], description: API を受け、シャードの索引とオブジェクトを持つ。Raft でメタデータの合意に加わる。, management: {type: customer, scope: "Customer operates the cluster, Helm values, upgrades and access."}, evidence: [{type: doc, ref: docs/reference-weaviate.md#§7}]}
      wv-node-b: {label: Weaviate ノード B（レプリカ）, kind: service, tier: diagram, x: 17, y: 2, realizes: [replication], description: 同じシャードのレプリカを持つ。リーダーなしで書き込みを受ける。, management: {type: customer, scope: "Customer operates the cluster, Helm values, upgrades and access."}, evidence: [{type: doc, ref: docs/reference-weaviate.md#§7}]}
      wv-disk: {label: ノードのディスク, kind: db, tier: diagram, x: 17, y: 8, description: シャードのデータを置く。永続ボリュームの設定は未確認。, management: {type: customer, scope: "Customer operates the disk and backups."}, evidence: [{type: doc, ref: docs/reference-weaviate.md#§7}]}
    links:
      - {id: wv-req, from: wv-client, to: wv-node-a, label: 登録・検索を要求, evidence: [{type: doc, ref: docs/reference-weaviate.md#§7}]}
      - {id: wv-embed, from: wv-node-a, to: wv-infer, label: ベクトル化を依頼, evidence: [{type: doc, ref: docs/reference-weaviate.md#§7}]}
      - {id: wv-repl, from: wv-node-a, to: wv-node-b, label: レプリカへ書く, evidence: [{type: doc, ref: docs/reference-weaviate.md#§7}]}
      - {id: wv-save, from: wv-node-a, to: wv-disk, label: シャードを保存, evidence: [{type: doc, ref: docs/reference-weaviate.md#§7}]}
    groups:
      - {kind: datacenter, label: 自前のサーバー群（Kubernetes）, provider: onprem, tier: diagram, nodes: [wv-infer, wv-node-a, wv-node-b, wv-disk]}
    layout2d:
      tiers:
        - {id: diagram, label: クライアント・Weaviate・ストレージ, z: 0, size: [29, 11]}
      nodes:
        wv-client: {tier: diagram, x: 1, y: 5}
        wv-infer: {tier: diagram, x: 9, y: 1.5}
        wv-node-a: {tier: diagram, x: 9, y: 5}
        wv-node-b: {tier: diagram, x: 17, y: 2}
        wv-disk: {tier: diagram, x: 17, y: 8}
      groups:
        - {kind: datacenter, label: 自前のサーバー群（Kubernetes）, provider: onprem, tier: diagram, nodes: [wv-infer, wv-node-a, wv-node-b, wv-disk]}
    layout3d:
      tiers:
        - {id: clients, label: クライアント, z: 0, size: [6, 11]}
        - {id: servers, label: Weaviate とディスク, z: 0, origin: [8, 0], size: [20, 11]}
      nodes:
        wv-client: {tier: clients, x: 3, y: 5}
        wv-infer: {tier: servers, x: 3, y: 1.5}
        wv-node-a: {tier: servers, x: 3, y: 5}
        wv-node-b: {tier: servers, x: 10, y: 2}
        wv-disk: {tier: servers, x: 10, y: 8}
      groups:
        - {kind: datacenter, label: 自前のサーバー群（Kubernetes）, provider: onprem, tier: [servers], nodes: [wv-infer, wv-node-a, wv-node-b, wv-disk]}
