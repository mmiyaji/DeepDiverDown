name: "Cilium と Hubble の通信ポリシーと観測"
description: "注文 API に対する許可と拒否を、Kubernetes NetworkPolicy の定義、Cilium の適用、Hubble の観測から確認します。"
reference:
  objectives:
    - "Kubernetes NetworkPolicy の選択対象と許可元を読む。"
    - "Cilium が適用した判定を Hubble で確認する。"
    - "ネットワークの転送判定とアプリケーションの成功を区別する。"
  sources:
    - {title: "Kubernetes Network Policies", url: "https://kubernetes.io/docs/concepts/services-networking/network-policies/"}
    - {title: "Introduction to Cilium & Hubble", url: "https://docs.cilium.io/en/stable/overview/intro/"}
    - {title: "Network Observability with Hubble", url: "https://docs.cilium.io/en/stable/observability/hubble/"}
    - {title: "Inspecting Network Flows with the CLI", url: "https://docs.cilium.io/en/stable/observability/hubble/hubble-cli/"}
sources: [docs/reference-cilium-hubble.md]
evidence: [{type: doc, ref: "docs/reference-cilium-hubble.md#§1"}]
tiers:
  - {id: "traffic", label: "Kubernetes ワークロード", z: 1, size: [17,7]}
  - {id: "observe", label: "フローの観測", z: 0, size: [17,4]}
nodes:
  checkout: {label: チェックアウトの実行単位, kind: client, tier: traffic, x: 0, 'y': 1.5, description: 注文 API の TCP 8080 に接続することを許可された Pod。, evidence: [{type: doc, ref: docs/reference-cilium-hubble.md#§2}]}
  report: {label: 集計処理の実行単位, kind: client, tier: traffic, x: 0, 'y': 5, description: 同じ注文 API に接続を試みるが、許可元のセレクターに一致しない。, evidence: [{type: doc, ref: docs/reference-cilium-hubble.md#§2}]}
  policy: {label: 注文 API の着信ポリシー, kind: policy, tier: traffic, x: 6, 'y': 5, description: 注文 API Pod への TCP 8080 をチェックアウト Pod から許可する。, evidence: [{type: doc, ref: docs/reference-cilium-hubble.md#§2}]}
  datapath: {label: ノードのパケット転送・判定, kind: service, tier: traffic, x: 6, 'y': 1.5, description: 対象 Pod の Ingress で、ポリシーに基づいてパケットを転送または破棄する。, evidence: [{type: doc, ref: docs/reference-cilium-hubble.md#§3}]}
  order: {label: 注文 API の実行単位, kind: service, tier: traffic, x: 12, 'y': 1.5, description: NetworkPolicy の対象となる Pod。, evidence: [{type: doc, ref: docs/reference-cilium-hubble.md#§2}]}
  hubble: {label: ノードのフロー観測, kind: monitor, tier: observe, x: 4, 'y': 1.5, description: Cilium のネットワークイベントをフローとして扱う。, evidence: [{type: doc, ref: docs/reference-cilium-hubble.md#§4}]}
  relay: {label: 複数ノードの観測集約, kind: monitor, tier: observe, x: 9, 'y': 1.5, description: ノードの Hubble API を集約し、クラスタ全体のフローを参照できるようにする。, evidence: [{type: doc, ref: docs/reference-cilium-hubble.md#§4}]}
  cli: {label: フロー確認クライアント, kind: client, tier: observe, x: 14, 'y': 1.5, description: フローを送信元・送信先や verdict で絞り込む。, evidence: [{type: doc, ref: docs/reference-cilium-hubble.md#§5}]}
links:
  - {id: "allow-attempt", from: "checkout", to: "datapath", label: "注文 API の TCP 8080 に接続", evidence: [{type: doc, ref: "docs/reference-cilium-hubble.md#§2"}]}
  - {id: "deny-attempt", from: "report", to: "datapath", label: "注文 API の TCP 8080 に接続", evidence: [{type: doc, ref: "docs/reference-cilium-hubble.md#§2"}]}
  - {id: "enforce", from: "policy", to: "datapath", label: "Ingress 許可条件を適用", evidence: [{type: doc, ref: "docs/reference-cilium-hubble.md#§3"}]}
  - {id: "forward", from: "datapath", to: "order", label: "許可されたパケットを転送", evidence: [{type: doc, ref: "docs/reference-cilium-hubble.md#§3"}]}
  - {id: "flow", from: "datapath", to: "hubble", label: "フローイベントを観測", evidence: [{type: doc, ref: "docs/reference-cilium-hubble.md#§4"}]}
  - {id: "aggregate", from: "hubble", to: "relay", label: "ノードのフローを集約", evidence: [{type: doc, ref: "docs/reference-cilium-hubble.md#§4"}]}
  - {id: "inspect", from: "relay", to: "cli", label: "絞り込んだフローを表示", evidence: [{type: doc, ref: "docs/reference-cilium-hubble.md#§5"}]}
scenarios:
  - id: allowed-flow
    label: "チェックアウト Pod からの通信を許可"
    evidence: [{type: doc, ref: "docs/reference-cilium-hubble.md#§2"}, {type: doc, ref: "docs/reference-cilium-hubble.md#§3"}, {type: doc, ref: "docs/reference-cilium-hubble.md#§5"}]
    steps:
      - {links: ["allow-attempt","enforce"], note: "チェックアウト Pod が注文 API の TCP 8080 に接続する。送信元ラベルとポートが許可条件に一致する。"}
      - {links: ["forward","flow","aggregate","inspect"], note: "パケットを転送する。Hubble で例の転送イベントを FORWARDED として確認する。"}
  - id: denied-flow
    label: "集計 Pod からの通信を拒否"
    evidence: [{type: doc, ref: "docs/reference-cilium-hubble.md#§2"}, {type: doc, ref: "docs/reference-cilium-hubble.md#§3"}, {type: doc, ref: "docs/reference-cilium-hubble.md#§5"}]
    steps:
      - {links: ["deny-attempt","enforce"], note: "集計 Pod が同じ宛先に接続を試みる。この送信元を許可するルールがない。"}
      - {links: ["flow","aggregate","inspect"], note: "Cilium がパケットを破棄する。Hubble で宛先 Pod と DROPPED を絞り込み、Policy denied の理由を確認する。"}
implementations:
  - id: cilium
    label: Kubernetes の Cilium Agent と Hubble Relay
    description: Amazon EKS の EC2 ノード上で AWS VPC CNI と Cilium を併用し、Hubble Relay からフローを確認する例。
    sources:
      - {title: EKS Control Plane, url: https://docs.aws.amazon.com/eks/latest/best-practices/control-plane.html}
      - title: Hubble Observability Setup
        url: https://docs.cilium.io/en/stable/observability/hubble/setup/index.html
      - title: Hubble Architecture
        url: https://docs.cilium.io/en/stable/observability/hubble/
      - title: Kubernetes Network Policies
        url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
      - title: Cilium と AWS VPC CNI のチェイン
        url: https://docs.cilium.io/en/stable/installation/cni-chaining-aws-cni/
      - title: EKS のマネージドノードグループ
        url: https://docs.aws.amazon.com/eks/latest/userguide/create-managed-node-group.html
    tiers:
      - id: traffic
        label: Kubernetes ワークロード
        z: 1
      - id: observe
        label: フローの観測
        z: 0
      - {id: infra, label: Amazon EKS の制御とノード, z: 2, size: [16, 4]}
    groups:
      - {kind: cloud, label: AWS サービス領域（制御プレーンは AWS 管理 VPC）, provider: aws, tier: [infra, traffic, observe], nodes: [cilium-eks, cilium-ec2, cilium-aws-cni, cilium-checkout, cilium-report, cilium-policy, cilium-datapath, cilium-order, cilium-relay]}
      - kind: cluster
        label: Cilium を使う Kubernetes クラスタ
        provider: k8s
        tier:
          - traffic
          - observe
          - infra
        nodes:
          - cilium-checkout
          - cilium-report
          - cilium-policy
          - cilium-datapath
          - cilium-order
          - cilium-relay
          - cilium-eks
          - cilium-ec2
          - cilium-aws-cni
    nodes:
      cilium-checkout:
        label: checkout Deployment の Pod
        kind: client
        tier: traffic
        svc: k8s:deployment
        realizes:
          - checkout
        description: ポリシーで許可する Pod ラベルを付ける。
        evidence:
          - type: doc
            ref: docs/reference-cilium-hubble.md#§6
      cilium-report:
        label: report Deployment の Pod
        kind: client
        tier: traffic
        svc: k8s:deployment
        realizes:
          - report
        description: 許可条件を満たさない Pod の比較例。
        evidence:
          - type: doc
            ref: docs/reference-cilium-hubble.md#§6
      cilium-policy:
        label: NetworkPolicy マニフェスト
        kind: policy
        tier: traffic
        realizes:
          - policy
        description: 注文 API Pod を選び、許可する送信元と TCP 8080 を定義する。
        management: {type: customer, scope: 利用者が NetworkPolicy を設定する。}
        evidence:
          - type: doc
            ref: docs/reference-cilium-hubble.md#§6
      cilium-datapath:
        label: Cilium Agent DaemonSet / eBPF / Hubble
        kind: worker
        tier: traffic
        svc: k8s:daemonset
        realizes:
          - datapath
          - hubble
        description: ノード上で eBPF を使って転送・判定し、Agent 内の Hubble がフローを公開する。
        management: {type: customer, scope: 利用者が Cilium とポリシー設定を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-cilium-hubble.md#§6
      cilium-order:
        label: order-api Deployment の Pod
        kind: service
        tier: traffic
        svc: k8s:deployment
        realizes:
          - order
        description: ポリシーの対象 Pod で TCP 8080 を待ち受ける。
        evidence:
          - type: doc
            ref: docs/reference-cilium-hubble.md#§6
      cilium-relay:
        label: Hubble Relay Deployment
        kind: monitor
        tier: observe
        svc: k8s:deployment
        realizes:
          - relay
        description: 各ノードの Hubble をまとめて読み出す。
        management: {type: customer, scope: 利用者が Hubble Relay を管理する。}
        evidence:
          - type: doc
            ref: docs/reference-cilium-hubble.md#§6
      cilium-cli:
        label: hubble CLI
        kind: client
        tier: observe
        realizes:
          - cli
        description: ローカルから Relay へ接続して verdict を確認する。
        evidence:
          - type: doc
            ref: docs/reference-cilium-hubble.md#§6
      cilium-port-forward:
        label: kubectl による Relay の port-forward
        kind: client
        tier: observe
        description: 検証用に API 経由で Relay のポートへ接続する。
        evidence:
          - type: doc
            ref: docs/reference-cilium-hubble.md#§6
      cilium-eks: {label: EKS Kubernetes API, svc: eks, kind: service, tier: infra, x: 1, y: 1.5, description: 利用者の NetworkPolicy とワークロードの定義を受け付ける。, management: {type: aws, scope: AWS が制御プレーン基盤を運用し、利用者が API と公開設定を操作する。}, evidence: [{type: doc, ref: docs/reference-cilium-hubble.md#§6}]}
      cilium-ec2: {label: EKS の EC2 ノード, svc: ec2, kind: host, tier: infra, x: 6, y: 1.5, description: アプリの Pod・AWS VPC CNI・Cilium Agent を実行する。, management: {type: shared, scope: EKS がノード管理を支援し、利用者が設定と更新開始を担う。}, evidence: [{type: doc, ref: docs/reference-cilium-hubble.md#§6}]}
      cilium-aws-cni: {label: AWS VPC CNI の aws-node, svc: 'k8s:daemonset', kind: worker, tier: infra, x: 12, y: 1.5, description: Pod の IP アドレスと基本ネットワークを管理する。, management: {type: shared, scope: AWS がアドオンを提供し、利用者が構成と更新を管理する。}, evidence: [{type: doc, ref: docs/reference-cilium-hubble.md#§6}]}
    links:
      - {id: cilium-schedule, from: cilium-eks, to: cilium-ec2, label: Pod を EC2 ノードへ配置, evidence: [{type: doc, ref: docs/reference-cilium-hubble.md#§6}]}
      - {id: cilium-chain, from: cilium-aws-cni, to: cilium-datapath, label: Pod のネットワークに Cilium の eBPF を適用, evidence: [{type: doc, ref: docs/reference-cilium-hubble.md#§6}]}
      - id: cilium-local-connection
        from: cilium-cli
        to: cilium-port-forward
        label: 転送されたローカルポートへ接続
        evidence:
          - type: doc
            ref: docs/reference-cilium-hubble.md#§6
      - id: cilium-relay-service
        from: cilium-port-forward
        to: cilium-relay
        label: Relay に中継
        evidence:
          - type: doc
            ref: docs/reference-cilium-hubble.md#§6

    layout2d:
      tiers: [{id: diagram, label: クラスタと外部の接続, z: 0, origin: [-4, 0], size: [31, 14]}]
      nodes:
        cilium-cli: {tier: diagram, x: -3, y: 1}
        cilium-port-forward: {tier: diagram, x: -3, y: 4}
        cilium-eks: {tier: diagram, x: 2, y: 1}
        cilium-ec2: {tier: diagram, x: 2, y: 4}
        cilium-aws-cni: {tier: diagram, x: 2, y: 7}
        cilium-datapath: {tier: diagram, x: 5, y: 4}
        cilium-relay: {tier: diagram, x: 5, y: 7}
        cilium-policy: {tier: diagram, x: 8, y: 1}
        cilium-checkout: {tier: diagram, x: 8, y: 4}
        cilium-report: {tier: diagram, x: 8, y: 7}
        cilium-order: {tier: diagram, x: 8, y: 10}
      groups:
        - {kind: cloud, provider: aws, label: AWS サービス領域, tier: [diagram], x0: 0, y0: -1, x1: 11, y1: 12, nodes: [cilium-eks, cilium-ec2, cilium-aws-cni, cilium-datapath, cilium-relay, cilium-policy, cilium-checkout, cilium-report, cilium-order]}
        - {kind: cluster, label: EKS クラスタ（論理）, tier: [diagram], x0: 0.5, y0: 0, x1: 10.5, y1: 11.5, nodes: [cilium-eks, cilium-ec2, cilium-aws-cni, cilium-datapath, cilium-relay, cilium-policy, cilium-checkout, cilium-report, cilium-order]}
        - {kind: vpc, provider: aws, label: 顧客 VPC のノード, tier: [diagram], x0: 0.6, y0: 3, x1: 10, y1: 11, nodes: [cilium-ec2, cilium-aws-cni, cilium-datapath, cilium-relay, cilium-checkout, cilium-report, cilium-order]}
    layout3d:
      tiers:
        - {id: nodes, label: 顧客 EC2 ノード, z: 0, size: [11, 10]}
        - {id: pods, label: ノード上の Pod・設定, z: 1, size: [11, 10]}
        - {id: control, label: AWS 管理制御プレーン, z: 0, origin: [14, 0], size: [8, 4]}
        - {id: outside, label: 外部の利用者・サービス, z: 0, origin: [25, 0], size: [8, 4]}
      nodes:
        cilium-eks: {tier: control, x: 1, y: 1}
        cilium-ec2: {tier: nodes, x: 1, y: 2}
        cilium-aws-cni: {tier: pods, x: 1, y: 1}
        cilium-datapath: {tier: pods, x: 4, y: 1}
        cilium-relay: {tier: pods, x: 7, y: 1}
        cilium-policy: {tier: pods, x: 1, y: 4}
        cilium-checkout: {tier: pods, x: 4, y: 4}
        cilium-report: {tier: pods, x: 7, y: 4}
        cilium-order: {tier: pods, x: 1, y: 7}
        cilium-cli: {tier: outside, x: 1, y: 1}
        cilium-port-forward: {tier: outside, x: 4, y: 1}
      groups:
        - {kind: cloud, provider: aws, label: AWS サービス領域, tier: [nodes, pods, control], nodes: [cilium-eks, cilium-ec2, cilium-aws-cni, cilium-datapath, cilium-relay, cilium-policy, cilium-checkout, cilium-report, cilium-order]}
