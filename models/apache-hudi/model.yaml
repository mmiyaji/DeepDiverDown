name: Apache Hudi の基本アーキテクチャ
description: 更新イベントを Hudi のタイムラインへ取り込み、Copy-on-Write と Merge-on-Read を比較します。
reference:
  objectives:
    - Hudi のコミットタイムラインと増分クエリの関係を理解する。
    - Copy-on-Write と Merge-on-Read の書き込み・読み取り特性を比較する。
    - Snapshot、Incremental、Read Optimized の各クエリの違いを説明する。
  sources:
    - {title: Apache Hudi Concepts, url: https://hudi.apache.org/docs/concepts/}
sources: [docs/reference-apache-hudi.md]
evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§1}]
tiers:
  - {id: ingest, label: 取り込み, z: 1, size: [17,3]}
  - {id: storage, label: Hudi テーブル, z: 0, origin: [2,0], size: [15,3]}
nodes:
  cdc: {label: CDC / 更新イベント, kind: external, tier: ingest, x: 0, y: 1.5, description: 挿入・更新・削除の変更を届ける。, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§1}]}
  timeline: {label: Hudi Timeline, kind: queue, tier: storage, x: 3, y: 1.5, description: コミットの履歴と変更の境界を管理する。, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§1}]}
  cow: {label: Copy-on-Write Base Files, kind: db, shape3D: crate, tier: storage, x: 6, y: 0.5, description: 更新時にベース列ファイルを書き換える経路。, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§2}]}
  mor: {label: Merge-on-Read Log Files, kind: db, tier: storage, x: 6, y: 2.5, description: 更新をログへ追記し、読み取り時にマージする経路。, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§3}]}
  compact: {label: Compactor, kind: worker, tier: storage, x: 9, y: 2.5, description: MoR のログをベースファイルへ反映する。, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§3}]}
  query: {label: Query Engine, kind: service, tier: ingest, x: 12, y: 1.5, description: Snapshot・Incremental・Read Optimized を実行する。, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§4}]}
  output: {label: 分析結果, kind: external, tier: ingest, x: 15, y: 1.5, description: 下流分析や BI が受け取る結果。, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§4}]}
links:
  - {id: ingest, from: cdc, to: timeline, label: 更新をコミット, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§1}]}
  - {id: cow-write, from: timeline, to: cow, label: ベースファイルを書き換え, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§2}]}
  - {id: mor-write, from: timeline, to: mor, label: ログへ追記, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§3}]}
  - {id: compact, from: mor, to: compact, label: コンパクション, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§3}]}
  - {id: snapshot, from: cow, to: query, label: Snapshot を読む, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§4}]}
  - {id: merge-read, from: mor, to: query, label: ベースとログをマージして読む, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§3}]}
  - {id: incremental, from: timeline, to: query, label: コミット以降を読む, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§4}]}
  - {id: deliver, from: query, to: output, label: 結果を渡す, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§4}]}
scenarios:
  - {id: upsert-cdc, label: CDC 更新を取り込む, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§5}], steps: [{links: [ingest], note: CDC の更新イベントをコミットとして取り込む。}, {links: [cow-write, snapshot], note: CoW ではベースファイルを書き換え、Snapshot query で読む。}, {links: [mor-write, merge-read, compact], note: MoR ではログへ追記し、読み取り時マージまたはコンパクション後のベースを使う。}, {links: [incremental, deliver], note: タイムライン以降の変更または結果を下流へ渡す。}]}
  - {"id":"update-cow-mor","label":"1 件の更新を CoW と MoR で書く","visual":"cow-mor","evidence":[{"type":"doc","ref":"docs/reference-apache-hudi.md#§2"},{"type":"doc","ref":"docs/reference-apache-hudi.md#§3"}],"steps":[{"blocks":{"ev":[{"id":"u1","label":"更新 #42","k":4,"note":"注文 42 の更新イベント"}],"cow":[{"id":"f1","label":"base v1","k":0,"note":"CoW のベースファイル（Parquet）"}],"morb":[{"id":"g1","label":"base v1","k":0,"note":"MoR のベースファイル（Parquet）"}],"morl":[]},"links":["ingest"],"note":"注文 42 の更新イベントが届く。"},{"blocks":{"ev":[],"cow":[{"id":"f2","label":"base v2","k":2,"from":["f1","u1"],"note":"更新を反映して丸ごと書き直したベースファイル"}],"morb":[{"id":"g1","label":"base v1","k":0,"note":"MoR のベースファイル（Parquet）"}],"morl":[{"id":"l1","label":"log #42","k":4,"from":["u1"],"note":"MoR のログファイル（Avro）に追記した更新"}]},"highlight":["f2","l1"],"links":["cow-write","mor-write"],"note":"CoW は更新を含むベースファイルを丸ごと書き直す（書き込みが重い）。MoR はログファイルに追記するだけ（書き込みが軽い）。"},{"blocks":{"ev":[],"cow":[{"id":"f2","label":"base v2","k":2,"from":["f1","u1"],"note":"更新を反映して丸ごと書き直したベースファイル"}],"morb":[{"id":"g1","label":"base v1","k":0,"note":"MoR のベースファイル（Parquet）"}],"morl":[{"id":"l1","label":"log #42","k":4,"from":["u1"],"note":"MoR のログファイル（Avro）に追記した更新"}]},"highlight":["f2","g1","l1"],"links":["snapshot","merge-read"],"note":"読み取りでは、CoW はベースファイルだけを読む。MoR はベースとログを読み、マージしてから返す（読み取りが重い）。"},{"blocks":{"ev":[],"cow":[{"id":"f2","label":"base v2","k":2,"from":["f1","u1"],"note":"更新を反映して丸ごと書き直したベースファイル"}],"morb":[{"id":"g2","label":"base v2","k":2,"from":["g1","l1"],"note":"コンパクションでログを取り込んだ新しいベースファイル"}],"morl":[]},"highlight":["g2"],"links":["compact"],"note":"MoR のコンパクションがログをベースファイルに取り込み、読み取り時のマージを減らす。"}]}
