name: Apache Hudi の基本アーキテクチャ
description: 更新イベントを Hudi のタイムラインへ取り込み、Copy-on-Write と Merge-on-Read を比較します。
reference:
  objectives:
    - Hudi のコミットタイムラインと増分クエリの関係を理解する。
    - Copy-on-Write と Merge-on-Read の書き込み・読み取り特性を比較する。
    - Snapshot、Incremental、Read Optimized の各クエリの違いを説明する。
  sources:
    - {title: Apache Hudi Concepts, url: https://hudi.apache.org/docs/concepts/}
sources: [docs/reference-apache-hudi.md]
evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§1}]
tiers:
  - {id: ingest, label: 取り込み, z: 1, size: [17,3]}
  - {id: storage, label: Hudi テーブル, z: 0, origin: [2,0], size: [15,3]}
nodes:
  cdc: {label: CDC / 更新イベント, kind: external, tier: ingest, x: 0, y: 1.5, description: 挿入・更新・削除の変更を届ける。, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§1}]}
  timeline: {label: Hudi Timeline, kind: queue, tier: storage, x: 3, y: 1.5, description: コミットの履歴と変更の境界を管理する。, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§1}]}
  cow: {label: Copy-on-Write Base Files, kind: db, shape3D: crate, tier: storage, x: 6, y: 0.5, description: 更新時にベース列ファイルを書き換える経路。, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§2}]}
  mor: {label: Merge-on-Read Log Files, kind: db, tier: storage, x: 6, y: 2.5, description: 更新をログへ追記し、読み取り時にマージする経路。, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§3}]}
  compact: {label: Compactor, kind: worker, tier: storage, x: 9, y: 2.5, description: MoR のログをベースファイルへ反映する。, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§3}]}
  query: {label: Query Engine, kind: service, tier: ingest, x: 12, y: 1.5, description: Snapshot・Incremental・Read Optimized を実行する。, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§4}]}
  output: {label: 分析結果, kind: external, tier: ingest, x: 15, y: 1.5, description: 下流分析や BI が受け取る結果。, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§4}]}
links:
  - {id: ingest, from: cdc, to: timeline, label: 更新をコミット, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§1}]}
  - {id: cow-write, from: timeline, to: cow, label: ベースファイルを書き換え, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§2}]}
  - {id: mor-write, from: timeline, to: mor, label: ログへ追記, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§3}]}
  - {id: compact, from: mor, to: compact, label: コンパクション, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§3}]}
  - {id: snapshot, from: cow, to: query, label: Snapshot を読む, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§4}]}
  - {id: merge-read, from: mor, to: query, label: ベースとログをマージして読む, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§3}]}
  - {id: incremental, from: timeline, to: query, label: コミット以降を読む, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§4}]}
  - {id: deliver, from: query, to: output, label: 結果を渡す, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§4}]}
scenarios:
  - {id: upsert-cdc, label: CDC 更新を取り込む, evidence: [{type: doc, ref: docs/reference-apache-hudi.md#§5}], steps: [{links: [ingest], note: CDC の更新イベントをコミットとして取り込む。}, {links: [cow-write, snapshot], note: CoW ではベースファイルを書き換え、Snapshot query で読む。}, {links: [mor-write, merge-read, compact], note: MoR ではログへ追記し、読み取り時マージまたはコンパクション後のベースを使う。}, {links: [incremental, deliver], note: タイムライン以降の変更または結果を下流へ渡す。}]}
  - {"id":"update-cow-mor","label":"1 件の更新を CoW と MoR で書く","visual":"cow-mor","evidence":[{"type":"doc","ref":"docs/reference-apache-hudi.md#§2"},{"type":"doc","ref":"docs/reference-apache-hudi.md#§3"}],"steps":[{"blocks":{"ev":[{"id":"u1","label":"更新 #42","k":4,"note":"注文 42 の更新イベント"}],"cow":[{"id":"f1","label":"base v1","k":0,"note":"CoW のベースファイル（Parquet）"}],"morb":[{"id":"g1","label":"base v1","k":0,"note":"MoR のベースファイル（Parquet）"}],"morl":[]},"links":["ingest"],"note":"注文 42 の更新イベントが届く。"},{"blocks":{"ev":[],"cow":[{"id":"f2","label":"base v2","k":2,"from":["f1","u1"],"note":"更新を反映して丸ごと書き直したベースファイル"}],"morb":[{"id":"g1","label":"base v1","k":0,"note":"MoR のベースファイル（Parquet）"}],"morl":[{"id":"l1","label":"log #42","k":4,"from":["u1"],"note":"MoR のログファイル（Avro）に追記した更新"}]},"highlight":["f2","l1"],"links":["cow-write","mor-write"],"note":"CoW は更新を含むベースファイルを丸ごと書き直す（書き込みが重い）。MoR はログファイルに追記するだけ（書き込みが軽い）。"},{"blocks":{"ev":[],"cow":[{"id":"f2","label":"base v2","k":2,"from":["f1","u1"],"note":"更新を反映して丸ごと書き直したベースファイル"}],"morb":[{"id":"g1","label":"base v1","k":0,"note":"MoR のベースファイル（Parquet）"}],"morl":[{"id":"l1","label":"log #42","k":4,"from":["u1"],"note":"MoR のログファイル（Avro）に追記した更新"}]},"highlight":["f2","g1","l1"],"links":["snapshot","merge-read"],"note":"読み取りでは、CoW はベースファイルだけを読む。MoR はベースとログを読み、マージしてから返す（読み取りが重い）。"},{"blocks":{"ev":[],"cow":[{"id":"f2","label":"base v2","k":2,"from":["f1","u1"],"note":"更新を反映して丸ごと書き直したベースファイル"}],"morb":[{"id":"g2","label":"base v2","k":2,"from":["g1","l1"],"note":"コンパクションでログを取り込んだ新しいベースファイル"}],"morl":[]},"highlight":["g2"],"links":["compact"],"note":"MoR のコンパクションがログをベースファイルに取り込み、読み取り時のマージを減らす。"}]}
blocks: [{"id":"cow-mor","title":"Copy-on-Write と Merge-on-Read の更新","legend":{"0":"ベースファイル","2":"書き直したベースファイル","4":"更新・ログ"},"note":"1 件の更新がどこにどう書かれるかを比べる。","lanes":[{"id":"ev","label":"更新イベント","node":"cdc"},{"id":"cow","label":"CoW テーブル","sub":"ベースファイル","node":"cow"},{"id":"morb","label":"MoR テーブル","sub":"ベースファイル","node":"mor"},{"id":"morl","label":"MoR テーブル","sub":"ログファイル","node":"mor"}],"items":{"ev":[{"id":"u1","label":"更新 #42","k":4,"note":"注文 42 の更新イベント"}],"cow":[{"id":"f1","label":"base v1","k":0,"note":"CoW のベースファイル（Parquet）"}],"morb":[{"id":"g1","label":"base v1","k":0,"note":"MoR のベースファイル（Parquet）"}],"morl":[]}}]
implementations:
  - id: hudi-spark
    label: Hudi Streamer・Kafka・Spark
    description: Hudi の Docker デモをもとに、Kafka の変更を Spark 上の Hudi Streamer で取り込み、表の配置を比較する例。
    sources:
      - title: Apache Hudi Concepts
        url: https://hudi.apache.org/docs/concepts/
      - title: Hudi Streamer Deployment
        url: https://hudi.apache.org/docs/deployment/
      - title: Hudi Compaction
        url: https://hudi.apache.org/docs/compaction/
      - {title: Hudi Docker Demo, url: https://hudi.apache.org/docs/docker_demo/}
    nodes:
      hudi-spark-host: {label: "Docker Compose host", kind: host, tier: ingest, x: 2, y: 0, evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§6"}]}
      hudi-spark-master: {label: "Spark master", kind: scheduler, tier: ingest, x: 2, y: 0, evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§6"}]}
      hudi-spark-worker: {label: "Spark worker", kind: host, tier: ingest, x: 2, y: 0, evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§6"}]}
      hudi-spark-hdfs: {label: "HDFS NameNode / DataNode", kind: service, tier: ingest, x: 2, y: 0, evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§6"}]}
      hudi-spark-kafka:
        label: Kafka の注文更新トピック
        kind: external
        tier: ingest
        x: 0
        y: 1.5
        description: Hudi Streamer が読む変更を保持する。
        realizes:
          - cdc
        evidence:
          - type: doc
            ref: docs/reference-apache-hudi.md#§6
      hudi-spark-timeline:
        label: Hudi のタイムライン（`.hoodie`）
        kind: file
        tier: storage
        x: 3
        y: 1.5
        description: コミットとテーブル保守の状態を記録する。
        realizes:
          - timeline
        evidence:
          - type: doc
            ref: docs/reference-apache-hudi.md#§6
      hudi-spark-cow:
        label: 分散ファイルシステムの COW テーブル
        kind: table
        tier: storage
        x: 6
        y: 0.5
        description: 更新済みベースファイルを置く。
        realizes:
          - cow
        evidence:
          - type: doc
            ref: docs/reference-apache-hudi.md#§6
      hudi-spark-mor:
        label: 分散ファイルシステムの MOR テーブル
        kind: table
        tier: storage
        x: 6
        y: 2.5
        description: 更新ログとベースファイルを維持する。
        realizes:
          - mor
        evidence:
          - type: doc
            ref: docs/reference-apache-hudi.md#§6
      hudi-spark-compact:
        label: Hudi Streamer の非同期コンパクション
        kind: worker
        tier: storage
        x: 9
        y: 2.5
        description: MOR の変更ログをベースファイルへ統合する。
        realizes:
          - compact
        evidence:
          - type: doc
            ref: docs/reference-apache-hudi.md#§6
      hudi-spark-spark:
        label: Spark SQL
        kind: service
        tier: ingest
        x: 12
        y: 1.5
        description: Hudi のテーブルを読む。
        realizes:
          - query
        evidence:
          - type: doc
            ref: docs/reference-apache-hudi.md#§6
      hudi-spark-output:
        label: Spark SQL の集計結果
        kind: external
        tier: ingest
        x: 15
        y: 1.5
        description: 読み取り後のデータを利用者へ返す。
        realizes:
          - output
        evidence:
          - type: doc
            ref: docs/reference-apache-hudi.md#§6
      hudi-spark-ingestion:
        label: Hudi Streamer（Spark）
        kind: service
        tier: ingest
        x: 4
        y: 2.4
        description: Kafka から取り込み、キーで更新を適用する。
        evidence:
          - type: doc
            ref: docs/reference-apache-hudi.md#§6
    links:
      - {id: hudi-spark-allocate, from: hudi-spark-master, to: hudi-spark-worker, label: "Allocate executors", evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§6"}]}
      - {id: hudi-spark-run-ingestion, from: hudi-spark-worker, to: hudi-spark-ingestion, label: "Run Streamer", evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§6"}]}
      - {id: hudi-spark-run-query, from: hudi-spark-worker, to: hudi-spark-spark, label: "Run query", evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§6"}]}
      - {id: hudi-spark-write-storage, from: hudi-spark-ingestion, to: hudi-spark-hdfs, label: "Write HDFS table", evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§6"}]}
      - {id: hudi-spark-read-storage, from: hudi-spark-spark, to: hudi-spark-hdfs, label: "Read HDFS table", evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§6"}]}
      - id: hudi-spark-ingest
        from: hudi-spark-kafka
        to: hudi-spark-ingestion
        label: 変更を読み取る
        evidence:
          - type: doc
            ref: docs/reference-apache-hudi.md#§6
      - id: hudi-spark-publish
        from: hudi-spark-ingestion
        to: hudi-spark-timeline
        label: 書き込みをコミットする
        evidence:
          - type: doc
            ref: docs/reference-apache-hudi.md#§6
    groups:
      - {kind: datacenter, label: Docker Compose host, provider: onprem, tier: [processes, host], nodes: [hudi-spark-host, hudi-spark-master, hudi-spark-worker, hudi-spark-hdfs, hudi-spark-timeline, hudi-spark-cow, hudi-spark-mor, hudi-spark-compact, hudi-spark-spark, hudi-spark-ingestion]}
    layout2d:
      tiers: [{id: local, label: Local execution, z: 0, size: [24, 14]}]
      nodes:
        hudi-spark-host: {tier: local, x: 2, y: 1}
        hudi-spark-master: {tier: local, x: 6, y: 1}
        hudi-spark-worker: {tier: local, x: 10, y: 1}
        hudi-spark-hdfs: {tier: local, x: 14, y: 1}
        hudi-spark-kafka: {tier: local, x: 18, y: 1}
        hudi-spark-timeline: {tier: local, x: 2, y: 5}
        hudi-spark-cow: {tier: local, x: 6, y: 5}
        hudi-spark-mor: {tier: local, x: 10, y: 5}
        hudi-spark-compact: {tier: local, x: 14, y: 5}
        hudi-spark-spark: {tier: local, x: 18, y: 5}
        hudi-spark-output: {tier: local, x: 2, y: 9}
        hudi-spark-ingestion: {tier: local, x: 6, y: 9}
      groups:
        - {kind: datacenter, label: Local host, tier: local, nodes: [hudi-spark-host, hudi-spark-master, hudi-spark-worker, hudi-spark-hdfs, hudi-spark-kafka, hudi-spark-timeline, hudi-spark-cow, hudi-spark-mor, hudi-spark-compact, hudi-spark-spark, hudi-spark-output, hudi-spark-ingestion]}
    layout3d:
      tiers:
        - {id: processes, label: Processes and jobs, z: 1, size: [24, 6]}
        - {id: host, label: Local host and files, z: 0, size: [24, 6]}
      nodes:
        hudi-spark-host: {tier: host, x: 2, y: 1}
        hudi-spark-master: {tier: processes, x: 6, y: 1}
        hudi-spark-worker: {tier: processes, x: 10, y: 1}
        hudi-spark-hdfs: {tier: processes, x: 14, y: 1}
        hudi-spark-kafka: {tier: processes, x: 18, y: 1}
        hudi-spark-timeline: {tier: host, x: 2, y: 4}
        hudi-spark-cow: {tier: host, x: 6, y: 4}
        hudi-spark-mor: {tier: host, x: 10, y: 4}
        hudi-spark-compact: {tier: processes, x: 14, y: 4}
        hudi-spark-spark: {tier: processes, x: 18, y: 4}
        hudi-spark-output: {tier: processes, x: 2, y: 7}
        hudi-spark-ingestion: {tier: processes, x: 6, y: 7}
      groups:
        - {kind: datacenter, label: Local host, tier: [processes, host], nodes: [hudi-spark-host, hudi-spark-master, hudi-spark-worker, hudi-spark-hdfs, hudi-spark-kafka, hudi-spark-timeline, hudi-spark-cow, hudi-spark-mor, hudi-spark-compact, hudi-spark-spark, hudi-spark-output, hudi-spark-ingestion]}
  - id: aws-emr-ec2
    label: "AWS：EMR on EC2 / Spark・Hudi"
    description: "EMR on EC2 の Hudi Streamer が Amazon MSK から更新を読み、S3 の Hudi テーブルを書き、Glue Data Catalog に同期する例。"
    sources:
      - {title: "How Hudi works on Amazon EMR", url: https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-hudi-how-it-works.html}
      - {title: "Apache Hudi Streamer", url: https://hudi.apache.org/docs/deployment/}
      - {title: "Apache Hudi Compaction", url: https://hudi.apache.org/docs/compaction/}
      - {title: "Amazon MSK", url: https://docs.aws.amazon.com/msk/latest/developerguide/what-is-msk.html}
      - {title: "Amazon EMR クラスタの構成", url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-overview.html}
      - {title: "AWS shared responsibility", url: https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/shared-responsibility.html}
    tiers:
      - {id: management, label: クラスタ管理とテーブル登録, z: 2, size: [20, 4]}
      - {id: compute, label: ジョブの実行, z: 1, size: [20, 4]}
      - {id: storage, label: テーブルの永続ストレージ, z: 0, size: [20, 4]}
    groups:
      - {kind: cloud, label: AWS アカウント, provider: aws, tier: [management, compute, storage], nodes: [aws-emr-control, aws-emr-host, aws-emr-msk, aws-emr-glue, aws-emr-streamer, aws-emr-compact, aws-emr-query, aws-emr-s3, aws-emr-cow, aws-emr-mor]}
      - {kind: cluster, label: EMR on EC2 クラスタ, tier: compute, nodes: [aws-emr-host, aws-emr-streamer, aws-emr-compact, aws-emr-query]}
    nodes:
      aws-emr-control: {label: "Amazon EMR", svc: emr, kind: service, tier: management, x: 2, y: 1.5, description: "EC2 クラスタを作成・管理し、ジョブ投入用の step を受け付ける。", management: {type: shared, scope: "AWS は EMR サービスを運用し、利用者はクラスタとステップを設定する。"}, evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§7"}]}
      aws-emr-host: {label: "Amazon EC2 / YARN", svc: ec2, kind: host, tier: compute, x: 17, y: 1.5, description: "EMR の EC2 ノードで YARN がアプリケーションの実行リソースを割り当てる。", management: {type: shared, scope: "AWS は EC2 基盤を運用し、利用者はクラスタ、ゲスト OS とソフトウェアを管理する。"}, evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§7"}]}
      aws-emr-msk: {label: "Amazon MSK / 更新トピック", svc: msk, kind: queue, tier: management, x: 8, y: 1.5, realizes: [cdc], description: "上流が生成した注文の更新イベントを Kafka トピックに保持する。", management: {type: shared, scope: "AWS は MSK 基盤を運用し、利用者はトピック、データとアクセス権限を管理する。"}, evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§7"}]}
      aws-emr-glue: {label: "AWS Glue Data Catalog", svc: glue, kind: catalog, tier: management, x: 15, y: 1.5, description: "Hive metastore としてテーブル名・スキーマ・保存先を保持する。", management: {type: shared, scope: "AWS は Glue カタログ基盤を運用し、利用者は表定義とアクセス権限を管理する。"}, evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§7"}]}
      aws-emr-streamer: {label: "Spark / Hudi Streamer", kind: worker, tier: compute, x: 4, y: 1.5, description: "MSK の更新を読み、Hudi テーブルに upsert してコミットする。", management: {type: customer, scope: "利用者がジョブ、入力と Hudi の設定を管理する。"}, evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§7"}]}
      aws-emr-compact: {label: "Hudi Compactor", kind: worker, tier: compute, x: 8, y: 2.8, realizes: [compact], description: "MoR ストリームの書き込みと同じ Spark アプリケーションで非同期にログとベースファイルを統合する。", management: {type: customer, scope: "利用者がコンパクションの設定と運用を管理する。"}, evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§7"}]}
      aws-emr-query: {label: "Spark SQL / Hudi", kind: worker, tier: compute, x: 12, y: 1.5, realizes: [query], description: "カタログまたは S3 のテーブルパスを使い、クエリ方式に応じてタイムライン、ベースファイル、ログを読む。", management: {type: customer, scope: "利用者が Spark ジョブとクエリを管理する。"}, evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§7"}]}
      aws-emr-output: {label: "下流の分析利用者", kind: external, tier: compute, x: 22, y: 1.5, realizes: [output], description: "Spark の読み取りや集計の結果を受け取る。", evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§7"}]}
      aws-emr-s3: {label: "Amazon S3 / .hoodie", svc: s3, kind: db, tier: storage, x: 3, y: 1.5, realizes: [timeline], description: "CoW と MoR の別テーブルプレフィックスに、それぞれのタイムラインを保持する。", management: {type: shared, scope: "AWS は S3 基盤を運用し、利用者はデータとアクセス権限を管理する。"}, evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§7"}]}
      aws-emr-cow: {label: "CoW / ベースファイル", kind: file, tier: storage, x: 9, y: 1.5, realizes: [cow], description: "CoW の S3 プレフィックスに更新後の Parquet を書く。", management: {type: customer, scope: "利用者がテーブルのデータと保持方針を管理する。"}, evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§7"}]}
      aws-emr-mor: {label: "MoR / ベースと更新ログ", kind: file, tier: storage, x: 15, y: 1.5, realizes: [mor], description: "MoR の S3 プレフィックスにベースと差分ログを置く。", management: {type: customer, scope: "利用者がテーブルのデータと保持方針を管理する。"}, evidence: [{type: doc, ref: "docs/reference-apache-hudi.md#§7"}]}
    links:
