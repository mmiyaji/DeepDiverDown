          - example-stage
      - kind: cloud
        provider: snowflake
        label: Snowflake
        tier:
          - raw
        nodes:
          - example-order-hub
          - example-customer-hub
          - example-order-customer
          - example-order-sat
      - kind: cloud
        provider: snowflake
        label: Snowflake
        tier:
          - delivery
        nodes:
          - example-business
          - example-mart
      - kind: cloud
        provider: snowflake
        label: Snowflake
        tier:
          - implementation-setup
        nodes:
          - example-task
