name: Data Vault の履歴管理とマート設計
description: 注文の業務キー・関係・属性履歴を Raw Vault に保持し、Business Vault の業務ルールを経てマートを作る設計パターンです。
parent:
  model: dwh-design-patterns
  node: vault
reference:
  objectives:
    - Hub、Link、Satellite に保持するデータの違いを理解する。
    - 取込時刻と業務上の時刻を意識して変更履歴をたどる。
    - Raw Vault から Business Vault の派生値とマートを作る流れを追う。
  sources:
    - title: Data Vault 2.0 Introduction
      url: https://datavaultalliance.com/engineering/data-vault-2-0-an-introduction/
    - title: 'Data Vault Alliance: Data Vault, Data Mesh, and Polysemes'
      url: https://datavaultalliance.com/architecture-data/data-vault-data-mesh-and-polysemes/
    - title: 'Data Vault Alliance: Building a Real-Time Data Vault'
      url: https://datavaultalliance.com/engineering/building-a-real-time-data-vault-in-snowflake/
    - title: 'Data Vault Alliance: Centralized Architecture vs Decentralized Architecture'
      url: https://datavaultalliance.com/strategy-operating/centralized-vs-decentralized-architecture/
sources:
  - docs/reference-dwh-data-vault.md
evidence:
  - type: doc
    ref: docs/reference-dwh-data-vault.md#§1
tiers:
  - id: intake
    label: 業務システムと取込
    z: 2
    size:
      - 16
      - 4
    kind: origin
  - id: raw
    label: Raw Vault
    z: 1
    size:
      - 17
      - 4
  - id: delivery
    label: Business Vault と Information Mart
    z: 0
    size:
      - 17
      - 4
nodes:
  orders:
    label: 注文・顧客データ
    kind: db
    tier: intake
    x: 2
    'y': 1.5
    description: 例の注文番号、顧客番号、注文状態と変更時刻を含む。
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§1
  stage:
    label: ステージング
    kind: worker
    tier: intake
    x: 7
    'y': 1.5
    description: 入力を取り込み、取込時刻とレコードの出所を付ける。
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§2
  order-hub:
    label: 注文 Hub
    kind: db
    tier: raw
    x: 0
    'y': 1.5
    description: 同じ意味と粒度の注文業務キーを一意に持つ。
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§3
  customer-hub:
    label: 顧客 Hub
    kind: db
    tier: raw
    x: 4
    'y': 1.5
    description: 同じ意味と粒度の顧客業務キーを一意に持つ。
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§3
  order-customer:
    label: 注文・顧客 Link
    kind: db
    tier: raw
    x: 8
    'y': 1.5
    description: 注文 Hub と顧客 Hub の間の関連を保持する。
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§3
  order-sat:
    label: 注文 Satellite
    kind: db
    tier: raw
    x: 12
    'y': 1.5
    description: 注文 Hub に紐付く状態コードなどの属性履歴を保持する。
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§4
  business:
    label: Business Vault
    kind: db
    tier: delivery
    x: 6
    'y': 1.5
    description: 状態コードを分析用の出荷済み区分に変換する。
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§5
  mart:
    label: 注文 Information Mart
    kind: db
    tier: delivery
    x: 12
    'y': 1.5
    description: 注文明細を使う分析とは別に、1注文1行の状態マートを提供する。
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§6
links:
  - id: ingest
    from: orders
    to: stage
    label: 注文変更を取り込む
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§2
  - id: order-id
    from: stage
    to: order-hub
    label: 注文業務キーを登録
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§3
  - id: customer-id
    from: stage
    to: customer-hub
    label: 顧客業務キーを登録
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§3
  - id: relation
    from: stage
    to: order-customer
    label: 注文と顧客の関連を登録
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§3
  - id: link-order
    from: order-customer
    to: order-hub
    label: 注文 Hub を参照
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§3
  - id: link-customer
    from: order-customer
    to: customer-hub
    label: 顧客 Hub を参照
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§3
  - id: capture
    from: stage
    to: order-sat
    label: 変更した属性を追記
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§4
  - id: parent-key
    from: order-sat
    to: order-hub
    label: 親の注文 Hub を参照
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§4
  - id: derive
    from: order-sat
    to: business
    label: 状態履歴に業務ルールを適用
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§5
  - id: publish-order
    from: business
    to: mart
    label: 出荷済み区分を提供
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§6
  - id: publish-customer
    from: order-customer
    to: mart
    label: 注文と顧客の関連を利用
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§6
scenarios:
  - id: capture-order
    label: 注文の識別子・関連・状態履歴を保存
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§2
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§3
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§4
    steps:
      - links:
          - ingest
        note: 注文 O-101、顧客 C-15、注文状態 P を取り込み、出所と取込時刻を付ける。
      - links:
          - order-id
          - customer-id
          - relation
          - link-order
          - link-customer
        note: 注文・顧客の業務キーを Hub に登録し、O-101 と C-15 の組を Link に保存する。
      - links:
          - capture
          - parent-key
        note: 注文状態 P を Satellite に保存する。後で状態 S を受信したら、同じ注文キーに新しい履歴行を追記する。
  - id: derive-mart
    label: 出荷済みの業務ルールを変えてマートを再構築
    evidence:
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§4
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§5
      - type: doc
        ref: docs/reference-dwh-data-vault.md#§6
    steps:
      - links:
          - capture
          - parent-key
        note: Raw Vault の注文 Satellite で、O-101 は出荷済み S、O-102 は返品済み R が最新の状態として記録されている。
      - links:
          - derive
        note: Business Vault の出荷処理済み区分に返品済み R を含める。元の状態コードを読み、O-102 の区分も再計算する。
      - links:
          - publish-order
          - publish-customer
        note: 派生区分と顧客との関係を使って注文ごとにマートの行を生成する。O-101 と O-102 が出荷処理済みとして集計される。
implementations:
