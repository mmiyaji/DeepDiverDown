        ex-rbac: {tier: diagram, x: 8, y: 8.6}
        ex-table: {tier: diagram, x: 21, y: 12.4}
        ex-warehouse: {tier: diagram, x: 12.7, y: 12.4}
        ex-query: {tier: diagram, x: 1, y: 12.4}
      groups:
        - {kind: cloud, provider: snowflake, label: "Snowflake アカウント（論理範囲）", tier: [diagram], x0: 4.1, y0: 0.15, x1: 28, y1: 14.9, nodes: [ex-ingress, ex-assign, ex-buffer, ex-job, ex-cluster, ex-pipe, ex-rbac, ex-table, ex-warehouse]}
    layout3d:
