name: "データ配置と並列性：パーティショニングとシャーディング"
description: "注文データを order_date の時間パーティションと customer_id のハッシュシャードへ配置し、書き込み・読み出し・タスク並列化の違いを追うリファレンスです。"
reference:
  objectives:
    - "時間パーティション、ファイル／テーブル保存単位、ハッシュシャードを区別する。"
    - "order_date と customer_id から書き込み・読み出し先を決める流れを説明する。"
    - "選択的検索、全体集計のタスク分割、ホットスポットと偏りのトレードオフを理解する。"
  sources:
    - {title: "PostgreSQL Table Partitioning", url: "https://www.postgresql.org/docs/current/ddl-partitioning.html"}
    - {title: "Apache Iceberg Partitioning", url: "https://iceberg.apache.org/docs/latest/partitioning/"}
    - {title: "Amazon DynamoDB Partitions", url: "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.Partitions.html"}
    - {title: "DynamoDB Partition Key Design", url: "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-design.html"}
    - {title: "Trino・Tasks と Splits", url: "https://trino.io/docs/current/overview/concepts.html#split"}
sources: ["docs/reference-partitioning-sharding.md"]
evidence: [{type: "doc", ref: "docs/reference-partitioning-sharding.md#§1"}]
tiers:
  - {id: "ingress", label: "注文受付", kind: "origin", z: 1, origin: [-5, 0], size: [2.5, 4]}
  - {id: "routing", label: "キー計算とルーティング", z: 1, size: [5, 4]}
  - {id: "storage", label: "時間パーティション内の保存", z: 0, size: [10, 6]}
  - {id: "compute", label: "読み出しタスク", z: 1, origin: [10, 0], size: [3.5, 6]}
nodes:
  order-api:
    {label: "注文 API", kind: "service", tier: "ingress", x: 0, y: 2, description: "order_date と customer_id を含む注文を受け、論理的な orders へ書き込む。", evidence: [{type: "doc", ref: "docs/reference-partitioning-sharding.md#§4"}, {type: "doc", ref: "docs/reference-partitioning-sharding.md#§7"}]}
  partition-router:
    {label: "パーティション／シャードルーター", kind: "service", tier: "routing", x: 1, y: 2, description: "order_date で時間パーティションを選び、customer_id のハッシュでシャードを選ぶ。", evidence: [{type: "doc", ref: "docs/reference-partitioning-sharding.md#§3"}, {type: "doc", ref: "docs/reference-partitioning-sharding.md#§4"}]}
  orders-table:
    {label: "論理 orders テーブル", kind: "db", tier: "storage", x: 0, y: 1, description: "利用者からは1つに見える注文表。物理パーティションの親となる論理単位。", evidence: [{type: "doc", ref: "docs/reference-partitioning-sharding.md#§1"}, {type: "doc", ref: "docs/reference-partitioning-sharding.md#§2"}]}
  time-partition:
    {label: "order_date 時間パーティション", kind: "db", tier: "storage", x: 3, y: 1, description: "order_date の月・日などの範囲で分けた表またはファイル群。期間検索と保持期限管理の単位。", evidence: [{type: "doc", ref: "docs/reference-partitioning-sharding.md#§2"}, {type: "doc", ref: "docs/reference-partitioning-sharding.md#§4"}]}
  hash-shard-a:
    {label: "customer_id ハッシュシャード A", kind: "db", tier: "storage", x: 6, y: 1, description: "時間パーティション内で hash(customer_id) の一部を担当する保存先の例。", evidence: [{type: "doc", ref: "docs/reference-partitioning-sharding.md#§3"}, {type: "doc", ref: "docs/reference-partitioning-sharding.md#§6"}]}
  hash-shard-b:
    {label: "customer_id ハッシュシャード B", kind: "db", tier: "storage", x: 6, y: 4, description: "同じ論理的な時間範囲の別ハッシュ値を担当する保存先の例。", evidence: [{type: "doc", ref: "docs/reference-partitioning-sharding.md#§3"}, {type: "doc", ref: "docs/reference-partitioning-sharding.md#§6"}]}
  query-worker:
    {label: "並列クエリタスク", kind: "worker", tier: "compute", x: 0, y: 3, description: "複数パーティション・シャードを読む部分タスクを実行し、部分集計をマージする。", evidence: [{type: "doc", ref: "docs/reference-partitioning-sharding.md#§5"}, {type: "doc", ref: "docs/reference-partitioning-sharding.md#§7"}]}
links:
  - {id: "route-write", from: "order-api", to: "partition-router", label: "注文を書き込む", evidence: [{type: "doc", ref: "docs/reference-partitioning-sharding.md#§4"}]}
  - {id: "logical-write", from: "partition-router", to: "orders-table", label: "論理 orders へルーティング", evidence: [{type: "doc", ref: "docs/reference-partitioning-sharding.md#§4"}]}
  - {id: "time-route", from: "orders-table", to: "time-partition", label: "order_date で範囲選択", evidence: [{type: "doc", ref: "docs/reference-partitioning-sharding.md#§2"}, {type: "doc", ref: "docs/reference-partitioning-sharding.md#§4"}]}
  - {id: "hash-route-a", from: "time-partition", to: "hash-shard-a", label: "customer_id のハッシュ", evidence: [{type: "doc", ref: "docs/reference-partitioning-sharding.md#§3"}]}
  - {id: "hash-route-b", from: "time-partition", to: "hash-shard-b", label: "customer_id のハッシュ", evidence: [{type: "doc", ref: "docs/reference-partitioning-sharding.md#§3"}]}
  - {id: "selective-read", from: "hash-shard-a", to: "query-worker", label: "顧客検索の対象を読む", evidence: [{type: "doc", ref: "docs/reference-partitioning-sharding.md#§5"}]}
  - {id: "parallel-read", from: "hash-shard-b", to: "query-worker", label: "集計タスクを並列実行", evidence: [{type: "doc", ref: "docs/reference-partitioning-sharding.md#§5"}, {type: "doc", ref: "docs/reference-partitioning-sharding.md#§7"}]}
  - {id: "merge", from: "query-worker", to: "orders-table", label: "部分結果をマージ", evidence: [{type: "doc", ref: "docs/reference-partitioning-sharding.md#§5"}]}
scenarios:
  - id: "order-routing"
    label: "注文の書き込みと顧客検索"
    evidence: [{type: "doc", ref: "docs/reference-partitioning-sharding.md#§7"}]
    steps:
      - {links: ["route-write"], note: "注文 API が order_date と customer_id を含む注文をルーターへ渡す。"}
      - {links: ["logical-write", "time-route"], note: "ルーターが論理 orders から当日の時間パーティションを選ぶ。"}
      - {links: ["hash-route-a", "hash-route-b"], note: "customer_id のハッシュで担当シャードを決め、書き込みを分散する。"}
      - {links: ["selective-read"], note: "顧客別検索では同じキーから候補シャードを絞って読む。"}
  - id: "parallel-aggregation"
    label: "月次集計のタスク並列化"
    evidence: [{type: "doc", ref: "docs/reference-partitioning-sharding.md#§5"}, {type: "doc", ref: "docs/reference-partitioning-sharding.md#§7"}]
    steps:
      - {links: ["time-route"], note: "対象期間の時間パーティションを列挙する。"}
      - {links: ["parallel-read"], note: "複数シャードを部分タスクへ分け、並列に読み出す。"}
      - {links: ["merge"], note: "部分集計をマージし、ホットシャードや欠落をメトリクスで確認する。"}
  - {"id":"add-node","label":"ノードを追加してスロットを移す","visual":"reshard","evidence":[{"type":"doc","ref":"docs/reference-partitioning-sharding.md#§8"}],"steps":[{"blocks":{"a":[{"id":"s0","label":"slot 0","k":0,"note":"ハッシュスロット 0。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s1","label":"slot 1","k":1,"note":"ハッシュスロット 1。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s2","label":"slot 2","k":2,"note":"ハッシュスロット 2。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s3","label":"slot 3","k":3,"note":"ハッシュスロット 3。customer_id のハッシュでどれかのスロットに入る。"}],"b":[{"id":"s4","label":"slot 4","k":0,"note":"ハッシュスロット 4。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s5","label":"slot 5","k":1,"note":"ハッシュスロット 5。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s6","label":"slot 6","k":2,"note":"ハッシュスロット 6。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s7","label":"slot 7","k":3,"note":"ハッシュスロット 7。customer_id のハッシュでどれかのスロットに入る。"}],"c":[{"id":"s8","label":"slot 8","k":0,"note":"ハッシュスロット 8。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s9","label":"slot 9","k":1,"note":"ハッシュスロット 9。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s10","label":"slot 10","k":2,"note":"ハッシュスロット 10。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s11","label":"slot 11","k":3,"note":"ハッシュスロット 11。customer_id のハッシュでどれかのスロットに入る。"}]},"links":["hash-route-a","hash-route-b"],"note":"12 のスロットを 3 ノードに 4 つずつ置いている。書き込みはキーのハッシュでスロット、スロットでノードが決まる。"},{"blocks":{"a":[{"id":"s0","label":"slot 0","k":0,"note":"ハッシュスロット 0。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s1","label":"slot 1","k":1,"note":"ハッシュスロット 1。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s2","label":"slot 2","k":2,"note":"ハッシュスロット 2。customer_id のハッシュでどれかのスロットに入る。"}],"b":[{"id":"s4","label":"slot 4","k":0,"note":"ハッシュスロット 4。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s5","label":"slot 5","k":1,"note":"ハッシュスロット 5。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s6","label":"slot 6","k":2,"note":"ハッシュスロット 6。customer_id のハッシュでどれかのスロットに入る。"}],"c":[{"id":"s8","label":"slot 8","k":0,"note":"ハッシュスロット 8。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s9","label":"slot 9","k":1,"note":"ハッシュスロット 9。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s10","label":"slot 10","k":2,"note":"ハッシュスロット 10。customer_id のハッシュでどれかのスロットに入る。"}],"d":[{"id":"s3","label":"slot 3","k":3,"note":"ハッシュスロット 3。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s7","label":"slot 7","k":3,"note":"ハッシュスロット 7。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s11","label":"slot 11","k":3,"note":"ハッシュスロット 11。customer_id のハッシュでどれかのスロットに入る。"}]},"highlight":["s3","s7","s11"],"lanes":{"d":{"tone":"new","sub":"追加"}},"links":["hash-route-b","merge"],"note":"ノード D を足すと、各ノードからスロットを 1 つずつ移すだけで均等になる。移るのは全体の 1/4。hash mod N で置いていたら、大半のキーが移動していた。"}]}
gates: {maxDrift: 0, maxHigh: 0}
blocks: [{"id":"reshard","title":"ノード追加とスロットの移動","legend":{},"note":"12 スロットを 3 ノードに配置した例。","lanes":[{"id":"a","label":"ノード A","node":"hash-shard-a"},{"id":"b","label":"ノード B","node":"hash-shard-b"},{"id":"c","label":"ノード C","node":"hash-shard-b"},{"id":"d","label":"ノード D","node":"hash-shard-b","optional":true}],"items":{"a":[{"id":"s0","label":"slot 0","k":0,"note":"ハッシュスロット 0。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s1","label":"slot 1","k":1,"note":"ハッシュスロット 1。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s2","label":"slot 2","k":2,"note":"ハッシュスロット 2。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s3","label":"slot 3","k":3,"note":"ハッシュスロット 3。customer_id のハッシュでどれかのスロットに入る。"}],"b":[{"id":"s4","label":"slot 4","k":0,"note":"ハッシュスロット 4。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s5","label":"slot 5","k":1,"note":"ハッシュスロット 5。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s6","label":"slot 6","k":2,"note":"ハッシュスロット 6。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s7","label":"slot 7","k":3,"note":"ハッシュスロット 7。customer_id のハッシュでどれかのスロットに入る。"}],"c":[{"id":"s8","label":"slot 8","k":0,"note":"ハッシュスロット 8。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s9","label":"slot 9","k":1,"note":"ハッシュスロット 9。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s10","label":"slot 10","k":2,"note":"ハッシュスロット 10。customer_id のハッシュでどれかのスロットに入る。"},{"id":"s11","label":"slot 11","k":3,"note":"ハッシュスロット 11。customer_id のハッシュでどれかのスロットに入る。"}]}}]

implementations:
  - id: clickhouse-cluster
    label: "ClickHouse Distributed と各シャードの MergeTree"
    description: "ClickHouse の Distributed 表から、顧客のハッシュで二つのデータシャードへ振り分ける例。各シャードのローカル表では注文日を月で分割する。"
    sources:
      - {title: PostgreSQL Table Partitioning, url: https://www.postgresql.org/docs/current/ddl-partitioning.html}
      - {title: Apache Iceberg Partitioning, url: https://iceberg.apache.org/docs/latest/partitioning/}
      - {title: Amazon DynamoDB Partitions, url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.Partitions.html}
      - {title: DynamoDB Partition Key Design, url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-design.html}
      - {title: Trino・Tasks と Splits, url: https://trino.io/docs/current/overview/concepts.html#split}
      - {title: ClickHouse の Debian・Ubuntu 導入, url: https://clickhouse.com/docs/get-started/setup/self-managed/debian-ubuntu}
      - {title: ClickHouse Distributed table engine, url: https://clickhouse.com/docs/reference/engines/table-engines/special/distributed}
      - {title: ClickHouse MergeTree table engine, url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/mergetree}
    tiers:
      - {id: processing, label: データの処理と保存, z: 0, size: [14, 5]}
      - {id: setup, label: 実行に必要な設定・成果物, z: 1, size: [14, 3]}
    nodes:
      clickhouse-cluster-host-coordinator: {label: 自前 Linux 調整ホスト, kind: host, tier: processing, x: 1, y: 0, description: Distributed 表を備えた ClickHouse Server を運用する。, evidence: [{type: doc, ref: docs/reference-partitioning-sharding.md#§9}]}
      clickhouse-cluster-host-a: {label: 自前 Linux シャード A, kind: host, tier: processing, x: 5, y: 0, description: シャード A の ClickHouse とローカルディスクを運用する。, evidence: [{type: doc, ref: docs/reference-partitioning-sharding.md#§9}]}
      clickhouse-cluster-host-b: {label: 自前 Linux シャード B, kind: host, tier: processing, x: 9, y: 0, description: シャード B の ClickHouse とローカルディスクを運用する。, evidence: [{type: doc, ref: docs/reference-partitioning-sharding.md#§9}]}
      clickhouse-cluster-app: {label: 注文 API の ClickHouse クライアント, kind: client, tier: processing, x: 1, y: 1.15, realizes: [order-api], description: 顧客 ID と注文日を持つレコードを投入する。, evidence: [{type: doc, ref: docs/reference-partitioning-sharding.md#§9}]}
      clickhouse-cluster-dist: {label: ClickHouse の Distributed 表と調整ノード, kind: service, tier: processing, x: 1, y: 3.65, realizes: [partition-router, orders-table], description: ハッシュを使って行を分配し、検索時はシャードの部分結果を集める。, evidence: [{type: doc, ref: docs/reference-partitioning-sharding.md#§9}]}
      clickhouse-cluster-a: {label: シャード A のローカル MergeTree 表, kind: db, tier: processing, x: 5, y: 1.15, realizes: [time-partition, hash-shard-a], description: 担当顧客の注文を持ち、その中を注文日の月で分ける。, evidence: [{type: doc, ref: docs/reference-partitioning-sharding.md#§9}]}
      clickhouse-cluster-b: {label: シャード B のローカル MergeTree 表, kind: db, tier: processing, x: 5, y: 3.65, realizes: [time-partition, hash-shard-b], description: 同じパーティション式で別の顧客集合を持つ。, evidence: [{type: doc, ref: docs/reference-partitioning-sharding.md#§9}]}
      clickhouse-cluster-workers: {label: 各シャードでの読取と部分集計, kind: worker, tier: processing, x: 9, y: 1.15, realizes: [query-worker], description: 条件に合うパートを読み、集約の中間状態を送り返す。, evidence: [{type: doc, ref: docs/reference-partitioning-sharding.md#§9}]}
      clickhouse-cluster-config: {label: remote_servers とシャード式の設定, kind: policy, tier: setup, x: 1, y: 1.5, description: シャードの接続先と重み、顧客キーを使う分配式を定義する。選択的読取ではシャード除外が利用可能な述語と設定を確認する。, evidence: [{type: doc, ref: docs/reference-partitioning-sharding.md#§9}]}
    links:
      - {id: clickhouse-cluster-host-router, from: clickhouse-cluster-host-coordinator, to: clickhouse-cluster-dist, label: Distributed 表を実行}
      - {id: clickhouse-cluster-host-shard-a, from: clickhouse-cluster-host-a, to: clickhouse-cluster-a, label: シャード A を実行・保存}
      - {id: clickhouse-cluster-host-shard-b, from: clickhouse-cluster-host-b, to: clickhouse-cluster-b, label: シャード B を実行・保存}
      - {id: clickhouse-cluster-config-connection, from: clickhouse-cluster-config, to: clickhouse-cluster-dist, label: 分配先とシャード式を設定}
    layout2d:
      tiers:
        - {id: diagram, label: 自前 ClickHouse クラスター, z: 0, size: [24, 12]}
      nodes:
        clickhouse-cluster-app: {tier: diagram, x: 1, y: 2}
        clickhouse-cluster-host-coordinator: {tier: diagram, x: 7, y: 2}
        clickhouse-cluster-dist: {tier: diagram, x: 7, y: 6}
        clickhouse-cluster-config: {tier: diagram, x: 7, y: 10}
        clickhouse-cluster-host-a: {tier: diagram, x: 13, y: 2}
        clickhouse-cluster-a: {tier: diagram, x: 13, y: 6}
        clickhouse-cluster-host-b: {tier: diagram, x: 19, y: 2}
        clickhouse-cluster-b: {tier: diagram, x: 19, y: 6}
        clickhouse-cluster-workers: {tier: diagram, x: 16, y: 10}
      groups:
        - {kind: cluster, label: 自前 ClickHouse クラスター, tier: [diagram], x0: 4, y0: -0.5, x1: 22.5, y1: 11.6, nodes: [clickhouse-cluster-host-coordinator, clickhouse-cluster-dist, clickhouse-cluster-config, clickhouse-cluster-host-a, clickhouse-cluster-a, clickhouse-cluster-host-b, clickhouse-cluster-b, clickhouse-cluster-workers]}
    layout3d:
      tiers:
        - {id: client, label: 注文 API, kind: origin, z: 0, origin: [-5, 0], size: [3, 5]}
        - {id: hosts, label: 自前 Linux ホスト, z: 0, size: [16, 5]}
        - {id: apps, label: ClickHouse とローカル表, z: 1, size: [16, 5]}
      nodes:
        clickhouse-cluster-app: {tier: client, x: 1, y: 2}
        clickhouse-cluster-host-coordinator: {tier: hosts, x: 2, y: 2}
        clickhouse-cluster-host-a: {tier: hosts, x: 7, y: 2}
        clickhouse-cluster-host-b: {tier: hosts, x: 12, y: 2}
        clickhouse-cluster-dist: {tier: apps, x: 2, y: 1}
        clickhouse-cluster-config: {tier: apps, x: 2, y: 4}
        clickhouse-cluster-a: {tier: apps, x: 7, y: 2}
        clickhouse-cluster-b: {tier: apps, x: 12, y: 2}
        clickhouse-cluster-workers: {tier: apps, x: 9, y: 4}
      groups:
        - {kind: cluster, label: 自前 ClickHouse クラスター, tier: [hosts, apps], nodes: [clickhouse-cluster-host-coordinator, clickhouse-cluster-dist, clickhouse-cluster-config, clickhouse-cluster-host-a, clickhouse-cluster-a, clickhouse-cluster-host-b, clickhouse-cluster-b, clickhouse-cluster-workers]}
  - id: aws-ec2-shards
    label: AWS（ClickHouse on EC2・Amazon EBS）
    description: EC2 上の ClickHouse が顧客のハッシュでシャードへ配分し、各シャードの MergeTree が注文月でパーティション化する例。
    sources:
      - {title: ClickHouse Distributed, url: https://clickhouse.com/docs/reference/engines/table-engines/special/distributed}
      - {title: ClickHouse MergeTree, url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/mergetree}
      - {title: ClickHouse の Debian・Ubuntu 導入, url: https://clickhouse.com/docs/get-started/setup/self-managed/debian-ubuntu}
      - {title: Amazon EBS ボリュームのアタッチ, url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-attaching-volume.html}
    tiers:
      - {id: entry, label: 注文 API, kind: origin, z: 1, size: [5, 3]}
      - {id: compute, label: ClickHouse の調整ノードとシャード, z: 1, size: [20, 7]}
      - {id: disk, label: シャード固有の永続ストレージ, z: 0, size: [20, 7]}
    groups:
      - {kind: cloud, label: AWS アカウント, provider: aws, tier: [compute, disk]}
      - {kind: vpc, label: ClickHouse ノードの VPC, tier: compute, nodes: [aws-coordinator, aws-a, aws-b]}
    nodes:
      aws-client: {label: 注文 API の ClickHouse クライアント, kind: client, tier: entry, x: 2, y: 1.5, realizes: [order-api], description: 接続を許可された環境から Distributed 表を利用する。, evidence: [{type: doc, ref: docs/reference-partitioning-sharding.md#§10}]}
