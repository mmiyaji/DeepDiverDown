name: Graphiti の時間を扱う知識グラフ
description: エピソードから実体と関係を抽出し、時間情報付きグラフを更新・検索する。
reference:
  objectives:
    - エピソードから実体と関係を抽出し、時間情報付きグラフを更新・検索する。
    - 機能配置と実装上の担い手を区別する。
    - 保存先、権限、運用上の制約を確認する。
  sources:
    - title: Graphiti quickstart
      url: https://github.com/getzep/graphiti/blob/main/examples/quickstart/README.md
    - title: Graphiti
      url: https://github.com/getzep/graphiti
sources:
  - docs/reference-graphiti.md
evidence:
  - type: doc
    ref: docs/reference-graphiti.md#§1
  - type: doc
    ref: docs/reference-graphiti.md#§3
tiers:
  - id: flow
    label: データ処理と利用
    z: 1
    size:
      - 20
      - 3
  - id: support
    label: 保存・設定・補助
    z: 0
    size:
      - 16
      - 3
nodes:
  client:
    label: 利用アプリ
    kind: actor
    tier: flow
    x: 0
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-graphiti.md#§2
  ingest:
    label: エピソードの取り込み
    kind: service
    tier: flow
    x: 4
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-graphiti.md#§2
  graph:
    label: 時間情報付きグラフ
    kind: db
    tier: flow
    x: 8
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-graphiti.md#§2
  search:
    label: グラフの検索
    kind: service
    tier: flow
    x: 12
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-graphiti.md#§2
  result:
    label: 検索結果の利用
    kind: actor
    tier: flow
    x: 16
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-graphiti.md#§2
  model:
    label: 抽出・埋め込みモデル
    kind: service
    tier: support
    x: 4
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-graphiti.md#§2
links:
  - id: submit
    from: client
    to: ingest
    label: エピソードを渡す
    evidence:
      - type: doc
        ref: docs/reference-graphiti.md#§2
  - id: extract
    from: model
    to: ingest
    label: 実体と関係を抽出
    evidence:
      - type: doc
        ref: docs/reference-graphiti.md#§2
  - id: save
    from: ingest
    to: graph
    label: 事実と時間情報を保存
    evidence:
      - type: doc
        ref: docs/reference-graphiti.md#§2
  - id: query
    from: graph
    to: search
    label: 事実を検索
    evidence:
      - type: doc
        ref: docs/reference-graphiti.md#§2
  - id: use
    from: search
    to: result
    label: 関連する事実を返す
    evidence:
      - type: doc
        ref: docs/reference-graphiti.md#§2
  - id: search-request
    from: client
    to: search
    label: グラフを検索
    evidence:
      - type: doc
        ref: docs/reference-graphiti.md#§2
scenarios:
  - id: main
    label: 構成と処理を追う
    evidence:
      - type: doc
        ref: docs/reference-graphiti.md#§2
    steps:
      - links:
          - submit
        note: エピソードを渡す。
      - links:
          - extract
        note: 実体と関係を抽出。
      - links:
          - save
        note: 事実と時間情報を保存。
      - links:
          - query
        note: 事実を検索。
      - links:
          - use
        note: 関連する事実を返す。
      - links:
          - search-request
        note: グラフを検索。
implementations:
  - id: example
    label: Graphiti の時間を扱う知識グラフの構成例
    description: Graphiti の Python クライアントから Neo4j に接続し、エピソードを取り込み検索する公式 quickstart の例。LLM と埋め込みの提供先は別途設定する。
    sources:
      - title: Graphiti quickstart
        url: https://github.com/getzep/graphiti/blob/main/examples/quickstart/README.md
      - title: Graphiti
        url: https://github.com/getzep/graphiti
    tiers:
      - id: flow
        label: データ処理と利用
        z: 1
        size:
          - 20
          - 3
      - id: support
        label: 保存・設定・補助
        z: 0
        size:
          - 16
          - 3
    nodes:
      ex-host: {label: Python アプリ実行ホスト, kind: host, tier: support, x: 1, y: 2, description: Graphiti を組み込んだ Python アプリを実行する。, evidence: [{type: doc, ref: docs/reference-graphiti.md#§4}]}
      ex-db-host: {label: Neo4j ホスト, kind: host, tier: support, x: 9, y: 2, description: 利用者が Neo4j と永続ボリュームを管理する。, evidence: [{type: doc, ref: docs/reference-graphiti.md#§4}]}
      ex-client:
        label: Python 利用アプリ
        kind: actor
        tier: flow
        x: 0
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-graphiti.md#§4
        realizes:
          - client
      ex-ingest:
        label: Graphiti エピソード取り込み
        kind: service
        tier: flow
        x: 4
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-graphiti.md#§4
        realizes:
          - ingest
      ex-graph:
        label: Neo4j グラフ
        kind: db
        tier: flow
        x: 8
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-graphiti.md#§4
        realizes:
          - graph
      ex-search:
        label: Graphiti 検索
        kind: service
        tier: flow
        x: 12
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-graphiti.md#§4
        realizes:
          - search
      ex-result:
        label: 分析・エージェント
        kind: actor
        tier: flow
        x: 16
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-graphiti.md#§4
        realizes:
          - result
      ex-model:
        label: 設定された LLM・埋め込み
        kind: service
        tier: support
        x: 4
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-graphiti.md#§4
        realizes:
          - model
    links:
      - {id: ex-run-app, from: ex-host, to: ex-ingest, label: Graphiti を実行, evidence: [{type: doc, ref: docs/reference-graphiti.md#§4}]}
      - {id: ex-run-db, from: ex-db-host, to: ex-graph, label: Neo4j を実行・保存, evidence: [{type: doc, ref: docs/reference-graphiti.md#§4}]}

    layout2d:
      tiers: [{id: diagram, label: 実行・保存と外部接続, z: 0, origin: [-4, 0], size: [30, 13]}]
      nodes:
        ex-host: {tier: diagram, x: 1, y: 1}
        ex-client: {tier: diagram, x: 4, y: 1}
        ex-ingest: {tier: diagram, x: 7, y: 1}
        ex-search: {tier: diagram, x: 1, y: 4}
        ex-db-host: {tier: diagram, x: 13, y: 1}
        ex-graph: {tier: diagram, x: 16, y: 1}
        ex-model: {tier: diagram, x: 22, y: 1}
        ex-result: {tier: diagram, x: 25, y: 1}
      groups:
        - {kind: datacenter, label: Graphiti アプリホスト, tier: [diagram], x0: -1, y0: 0.5, x1: 9.5, y1: 9.5, nodes: [ex-host, ex-client, ex-ingest, ex-search]}
        - {kind: datacenter, label: Neo4j ホスト, tier: [diagram], x0: 11, y0: 0, x1: 20, y1: 7, nodes: [ex-db-host, ex-graph]}
    layout3d:
      tiers:
        - {id: host, label: 顧客実行基盤, z: 0, size: [10, 8]}
        - {id: apps, label: 実行基盤上の処理, z: 1, size: [10, 8]}
        - {id: dbhost, label: 独立サービス・DB, z: 0, origin: [13, 0], size: [10, 7]}
        - {id: db, label: DB データ, z: 1, origin: [13, 0], size: [10, 7]}
        - {id: external, label: 外部モデル・利用者, z: 0, origin: [26, 0], size: [8, 5]}
      nodes:
        ex-host: {tier: host, x: 1, y: 1}
        ex-client: {tier: apps, x: 4, y: 1}
        ex-ingest: {tier: apps, x: 7, y: 1}
        ex-search: {tier: apps, x: 1, y: 4}
        ex-db-host: {tier: dbhost, x: 1, y: 1}
        ex-graph: {tier: db, x: 4, y: 1}
        ex-model: {tier: external, x: 1, y: 1}
        ex-result: {tier: external, x: 4, y: 1}
      groups:
        - {kind: datacenter, label: Graphiti アプリホスト, tier: [host, apps], nodes: [ex-host, ex-client, ex-ingest, ex-search]}
        - {kind: datacenter, label: Neo4j ホスト, tier: [dbhost, db], nodes: [ex-db-host, ex-graph]}

  - id: aws-ec2-neo4j
    label: "AWS：EC2・Neo4j・EBS"
    description: "EC2 上の Graphiti アプリが Neo4j Community Edition を使用し、グラフを EBS に永続化する例。"
    sources:
      - {title: "Graphiti Neo4j quickstart", url: https://github.com/getzep/graphiti/blob/main/examples/quickstart/README.md}
      - {title: "Graphiti license and requirements", url: https://github.com/getzep/graphiti/blob/main/pyproject.toml}
      - {title: "Neo4j Docker volumes", url: https://neo4j.com/docs/operations-manual/current/docker/mounting-volumes/}
      - {title: "Neo4j licensing", url: https://neo4j.com/open-source-project/}
      - {title: "Amazon EBS persistent block storage", url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/storage_ebs.html}
    tiers:
      - {id: external, label: "外部の推論と利用", z: 2, size: [20, 4]}
      - {id: compute, label: "EC2 インスタンス", z: 1, size: [20, 4]}
      - {id: storage, label: "永続ストレージ", z: 0, size: [20, 4]}
    groups:
      - {kind: cloud, label: "AWS アカウント", provider: aws, tier: [compute, storage], nodes: [aws-graphiti-host, aws-graphiti-app, aws-graphiti-lib, aws-graphiti-neo4j, aws-graphiti-ebs]}
    nodes:
      aws-graphiti-model: {label: "OpenAI API / LLM・埋め込み", kind: external, tier: external, x: 4, y: 1.5, realizes: [model], description: "抽出用 LLM と意味検索用の埋め込みを提供する外部 API。", evidence: [{type: doc, ref: "docs/reference-graphiti.md#§5"}]}
      aws-graphiti-result: {label: "分析・エージェント", kind: external, tier: external, x: 15, y: 1.5, realizes: [result], description: "アプリから関連する事実を受け取る。", evidence: [{type: doc, ref: "docs/reference-graphiti.md#§5"}]}
      aws-graphiti-host: {label: "Amazon EC2 / Linux", svc: ec2, kind: host, tier: compute, x: 2, y: 1.5, description: "Python アプリと Neo4j コンテナを同じ EC2 で実行する。", management: {type: customer, scope: 利用者が OS とアプリ・DB を管理する。}, evidence: [{type: doc, ref: "docs/reference-graphiti.md#§5"}]}
      aws-graphiti-app: {label: "Python 利用アプリ", kind: service, tier: compute, x: 7, y: 1.5, realizes: [client], description: "エピソードや検索条件を Graphiti に渡す。", evidence: [{type: doc, ref: "docs/reference-graphiti.md#§5"}]}
      aws-graphiti-lib: {label: "Graphiti / Python ライブラリ", kind: worker, tier: compute, x: 12, y: 1.5, realizes: [ingest, search], description: "外部モデルで抽出と埋め込みを行い、Neo4j でグラフを更新・検索する。", evidence: [{type: doc, ref: "docs/reference-graphiti.md#§5"}]}
      aws-graphiti-neo4j: {label: "Neo4j Community Edition", kind: db, tier: compute, x: 17, y: 1.5, realizes: [graph], description: "Graphiti が Bolt で接続するセルフホストのグラフ DB。", evidence: [{type: doc, ref: "docs/reference-graphiti.md#§5"}]}
      aws-graphiti-ebs: {label: "Amazon EBS / Neo4j データ", svc: ebs, kind: db, tier: storage, x: 15, y: 1.5, description: "EC2 にアタッチしたデータボリュームを Neo4j コンテナの /data に割り当てる。", management: {type: shared, scope: AWS が基盤を運用し、利用者がデータとバックアップを管理する。}, evidence: [{type: doc, ref: "docs/reference-graphiti.md#§5"}]}
    links:
      - {id: aws-graphiti-run, from: aws-graphiti-host, to: aws-graphiti-app, label: "Python アプリを起動", evidence: [{type: doc, ref: "docs/reference-graphiti.md#§5"}]}
      - {id: aws-graphiti-container, from: aws-graphiti-host, to: aws-graphiti-neo4j, label: "Neo4j コンテナを実行", evidence: [{type: doc, ref: "docs/reference-graphiti.md#§5"}]}
      - {id: aws-graphiti-infer, from: aws-graphiti-lib, to: aws-graphiti-model, label: "実体・関係抽出と埋め込みを要求", realizes: [extract], replace: true, evidence: [{type: doc, ref: "docs/reference-graphiti.md#§5"}]}
      - {id: aws-graphiti-volume, from: aws-graphiti-neo4j, to: aws-graphiti-ebs, label: "グラフと索引を永続化", evidence: [{type: doc, ref: "docs/reference-graphiti.md#§5"}]}

    layout2d:
      tiers: [{id: diagram, label: 実行・保存と外部接続, z: 0, origin: [-4, 0], size: [30, 13]}]
      nodes:
        aws-graphiti-host: {tier: diagram, x: 1, y: 1}
        aws-graphiti-app: {tier: diagram, x: 4, y: 1}
        aws-graphiti-lib: {tier: diagram, x: 7, y: 1}
        aws-graphiti-neo4j: {tier: diagram, x: 1, y: 4}
        aws-graphiti-ebs: {tier: diagram, x: 4, y: 4}
        aws-graphiti-model: {tier: diagram, x: 22, y: 1}
        aws-graphiti-result: {tier: diagram, x: 25, y: 1}
      groups:
        - {kind: cloud, provider: aws, label: AWS サービス領域, tier: [diagram], x0: -1.5, y0: 0, x1: 10, y1: 10, nodes: [aws-graphiti-host, aws-graphiti-app, aws-graphiti-lib, aws-graphiti-neo4j, aws-graphiti-ebs]}
        - {kind: datacenter, label: 顧客 EC2 と EBS, tier: [diagram], x0: -1, y0: 0.5, x1: 9.5, y1: 9.5, nodes: [aws-graphiti-host, aws-graphiti-app, aws-graphiti-lib, aws-graphiti-neo4j, aws-graphiti-ebs]}
    layout3d:
      tiers:
        - {id: host, label: 顧客実行基盤, z: 0, size: [10, 8]}
        - {id: apps, label: 実行基盤上の処理, z: 1, size: [10, 8]}
        - {id: dbhost, label: 独立サービス・DB, z: 0, origin: [13, 0], size: [10, 7]}
        - {id: db, label: DB データ, z: 1, origin: [13, 0], size: [10, 7]}
        - {id: external, label: 外部モデル・利用者, z: 0, origin: [26, 0], size: [8, 5]}
      nodes:
        aws-graphiti-host: {tier: host, x: 1, y: 1}
        aws-graphiti-app: {tier: apps, x: 4, y: 1}
        aws-graphiti-lib: {tier: apps, x: 7, y: 1}
        aws-graphiti-neo4j: {tier: apps, x: 1, y: 4}
        aws-graphiti-ebs: {tier: apps, x: 4, y: 4}
        aws-graphiti-model: {tier: external, x: 1, y: 1}
        aws-graphiti-result: {tier: external, x: 4, y: 1}
      groups:
        - {kind: cloud, provider: aws, label: AWS サービス領域, tier: [host, apps, dbhost], nodes: [aws-graphiti-host, aws-graphiti-app, aws-graphiti-lib, aws-graphiti-neo4j, aws-graphiti-ebs]}
