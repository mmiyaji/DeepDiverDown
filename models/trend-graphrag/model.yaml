name: GraphRAG による文書の検索と回答
description: 文書から実体と関係を抽出し、グラフと関連文書を使って回答する。
reference:
  objectives:
    - 文書からグラフと索引を作る流れを追う。
    - グラフ検索と回答生成を区別する。
    - 出典・権限・回答の正確性を評価する。
  sources:
    - title: Gartner 2026 Data & Analytics trends
      url: >-
        https://www.gartner.com/en/newsroom/press-releases/2026-06-16-gartner-identifies-the-top-trends-for-data-and-analytics
    - title: Microsoft GraphRAG
      url: https://microsoft.github.io/graphrag/
    - title: GraphRAG indexing
      url: https://microsoft.github.io/graphrag/index/overview/
sources:
  - docs/reference-trend-graphrag.md
evidence:
  - type: doc
    ref: docs/reference-trend-graphrag.md#§1
  - type: doc
    ref: docs/reference-trend-graphrag.md#§3
tiers:
  - id: flow
    label: 問い合わせと利用
    z: 1
    size:
      - 20
      - 3
  - id: definition
    label: 定義とデータ
    z: 0
    size:
      - 20
      - 3
nodes:
  user:
    label: 質問者
    kind: actor
    tier: flow
    x: 0
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-trend-graphrag.md#§2
  search:
    label: グラフと文書の検索
    kind: service
    tier: flow
    x: 4
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-trend-graphrag.md#§2
  answer:
    label: 文脈を基に回答生成
    kind: service
    tier: flow
    x: 8
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-trend-graphrag.md#§2
  documents:
    label: 元文書
    kind: file
    tier: definition
    x: 0
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-trend-graphrag.md#§2
  indexer:
    label: 実体・関係の抽出
    kind: service
    tier: definition
    x: 4
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-trend-graphrag.md#§2
  index:
    label: グラフ・要約と索引
    kind: db
    tier: definition
    x: 8
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-trend-graphrag.md#§2
  model:
    label: 生成モデル
    kind: service
    tier: definition
    x: 12
    'y': 1.5
    evidence:
      - type: doc
        ref: docs/reference-trend-graphrag.md#§2
links:
  - id: build
    from: documents
    to: indexer
    label: 文書を取り込む
    evidence:
      - type: doc
        ref: docs/reference-trend-graphrag.md#§2
  - id: index
    from: indexer
    to: index
    label: 実体と関係を索引化
    evidence:
      - type: doc
        ref: docs/reference-trend-graphrag.md#§2
  - id: ask
    from: user
    to: search
    label: 質問を送る
    evidence:
      - type: doc
        ref: docs/reference-trend-graphrag.md#§2
  - id: lookup
    from: index
    to: search
    label: 関連情報を検索
    evidence:
      - type: doc
        ref: docs/reference-trend-graphrag.md#§2
  - id: context
    from: search
    to: answer
    label: 検索文脈を渡す
    evidence:
      - type: doc
        ref: docs/reference-trend-graphrag.md#§2
  - id: generate
    from: model
    to: answer
    label: 回答を生成
    evidence:
      - type: doc
        ref: docs/reference-trend-graphrag.md#§2
  - id: reply
    from: answer
    to: user
    label: 出典と回答を返す
    evidence:
      - type: doc
        ref: docs/reference-trend-graphrag.md#§2
scenarios:
  - id: main-flow
    label: 処理の流れ
    evidence:
      - type: doc
        ref: docs/reference-trend-graphrag.md#§2
    steps:
      - links:
          - build
          - index
        note: 文書からグラフと検索索引を構築する。
      - links:
          - ask
          - lookup
          - context
        note: 質問に関係する情報を索引から集める。
      - links:
          - generate
          - reply
        note: 取得した文脈を基に回答を生成する。
implementations:
  - id: example
    label: Microsoft GraphRAG Local Search
    description: Microsoft GraphRAG の索引処理と Local Search を用いる。モデル提供者と実行環境は別途設定する。
    sources:
      - title: Gartner 2026 Data & Analytics trends
        url: >-
          https://www.gartner.com/en/newsroom/press-releases/2026-06-16-gartner-identifies-the-top-trends-for-data-and-analytics
      - title: Microsoft GraphRAG
        url: https://microsoft.github.io/graphrag/
      - title: GraphRAG indexing
        url: https://microsoft.github.io/graphrag/index/overview/
    tiers:
      - id: flow
        label: 問い合わせと利用
        z: 1
        size:
          - 20
          - 3
      - id: definition
        label: 定義とデータ
        z: 0
        size:
          - 20
          - 3
    nodes:
      ex-host:
        label: 利用者が運用する実行ホスト
        kind: host
        tier: flow
        x: 2
        y: 1.5
        description: GraphRAG と Python の導入・実行・更新は利用者が行う。
        evidence: [{type: doc, ref: docs/reference-trend-graphrag.md#§4}]
      ex-user:
        label: 質問者
        kind: actor
        tier: flow
        x: 0
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-trend-graphrag.md#§4
        realizes:
          - user
      ex-search:
        label: GraphRAG Local Search
        kind: service
        tier: flow
        x: 4
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-trend-graphrag.md#§4
        realizes:
          - search
      ex-answer:
        label: 回答の生成
        kind: service
        tier: flow
        x: 8
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-trend-graphrag.md#§4
        realizes:
          - answer
      ex-documents:
        label: 元文書
        kind: file
        tier: definition
        x: 0
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-trend-graphrag.md#§4
        realizes:
          - documents
      ex-indexer:
        label: GraphRAG 索引処理
        kind: service
        tier: definition
        x: 4
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-trend-graphrag.md#§4
        realizes:
          - indexer
      ex-index:
        label: Parquet とベクトル索引
        kind: db
        tier: definition
        x: 8
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-trend-graphrag.md#§4
        realizes:
          - index
      ex-model:
        label: 設定した生成モデル
        kind: service
        tier: definition
        x: 12
        'y': 1.5
        evidence:
          - type: doc
            ref: docs/reference-trend-graphrag.md#§4
        realizes:
          - model
    links:
      - {id: ex-run-index, from: ex-host, to: ex-indexer, label: 索引処理を実行}
      - {id: ex-run-query, from: ex-host, to: ex-search, label: Local Search を実行}

    layout2d:
      tiers: [{id: diagram, label: 実行環境と外部サービス, z: 0, origin: [-4, 0], size: [26, 18]}]
      nodes:
        ex-host: {tier: diagram, x: 6, y: 1}
        ex-user: {tier: diagram, x: 1, y: 1}
        ex-search: {tier: diagram, x: 16, y: 1}
        ex-answer: {tier: diagram, x: 21, y: 1}
        ex-documents: {tier: diagram, x: 1, y: 5}
        ex-indexer: {tier: diagram, x: 11, y: 1}
        ex-index: {tier: diagram, x: 6, y: 5}
        ex-model: {tier: diagram, x: 11, y: 5}
      groups:
        - {kind: datacenter, label: 利用者の実行ホスト, tier: [diagram], nodes: [ex-host, ex-indexer, ex-search, ex-answer]}
    layout3d:
      tiers:
        - {id: base, label: 実行基盤と独立サービス, z: 0, size: [26, 18]}
        - {id: app, label: ホスト上の処理, z: 1, size: [26, 18]}
      nodes:
        ex-host: {tier: base, x: 6, y: 1}
        ex-user: {tier: base, x: 1, y: 1}
        ex-search: {tier: app, x: 16, y: 1}
        ex-answer: {tier: app, x: 21, y: 1}
        ex-documents: {tier: base, x: 1, y: 5}
        ex-indexer: {tier: app, x: 11, y: 1}
        ex-index: {tier: base, x: 6, y: 5}
        ex-model: {tier: base, x: 11, y: 5}
      groups:
        - {kind: datacenter, label: 利用者の実行ホスト, tier: [base, app], nodes: [ex-host, ex-indexer, ex-search, ex-answer]}

  - id: azure-vm-graphrag
    label: Azure（GraphRAG on VM・Blob・Cosmos DB）
    description: Azure Linux VM の GraphRAG が Blob Storage と Cosmos DB を使い、Azure OpenAI で索引と回答を生成する例。
    sources:
      - title: GraphRAG 詳細設定
        url: https://microsoft.github.io/graphrag/config/yaml/
      - title: GraphRAG を始める
        url: https://microsoft.github.io/graphrag/get_started/
      - title: GraphRAG Local Search
        url: https://microsoft.github.io/graphrag/query/local_search/
      - title: Azure 仮想マシン
        url: https://learn.microsoft.com/azure/virtual-machines/overview
      - title: Azure Cosmos DB for NoSQL のベクトル検索
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
    tiers:
      - id: entry
        label: 質問者
        z: 0
        size:
          - 4
          - 4
      - id: compute
        label: GraphRAG 実行
        z: 1
        size:
          - 18
          - 5
      - id: storage
        label: 入力・索引・モデル API
        z: 0
        size:
          - 23
          - 4
    groups:
      - kind: cloud
        provider: azure
        label: Azure サブスクリプション
        tier:
          - compute
          - storage
        nodes:
          - azure-vm
          - azure-indexer
          - azure-query
          - azure-documents
          - azure-artifacts
          - azure-cosmos
          - azure-model
      - kind: cluster
        label: GraphRAG を実行する Linux VM
        tier: compute
        nodes:
          - azure-vm
          - azure-indexer
          - azure-query
    nodes:
      azure-user:
        label: 質問者（GraphRAG CLI）
        kind: actor
        tier: entry
        x: 1
        'y': 1.5
        realizes:
          - user
        description: 許可された VM セッションから Local Search を実行する。
        evidence:
          - type: doc
            ref: docs/reference-trend-graphrag.md#§5
      azure-vm:
        label: Azure Virtual Machines（Linux）
        svc: azure:vm
        kind: host
        tier: compute
        x: 2
        'y': 2.6
        description: 運用者が GraphRAG と Python の依存関係を導入・保守する。
        evidence:
          - type: doc
            ref: docs/reference-trend-graphrag.md#§5
      azure-indexer:
        label: Microsoft GraphRAG（index）
        kind: worker
        tier: compute
        x: 8
        'y': 1.3
        realizes:
          - indexer
        description: 文書を分割し、モデルで抽出した実体と関係や埋め込みを保存する。
        evidence:
          - type: doc
            ref: docs/reference-trend-graphrag.md#§5
      azure-query:
        label: Microsoft GraphRAG（Local Search）
        kind: service
        tier: compute
        x: 14
        'y': 3.8
        realizes:
          - search
          - answer
        description: 質問の関連情報を集め、モデルで根拠を付き合わせた回答を生成する。
        evidence:
          - type: doc
            ref: docs/reference-trend-graphrag.md#§5
      azure-documents:
        label: Azure Blob Storage（原本文書）
        svc: azure:storage
        kind: db
        tier: storage
        x: 2
        'y': 1.5
        realizes:
          - documents
        description: 索引入力用コンテナーに文書を保持する。
        evidence:
          - type: doc
            ref: docs/reference-trend-graphrag.md#§5
      azure-artifacts:
        label: Azure Blob Storage（Parquet 索引）
        svc: azure:storage
        kind: db
        tier: storage
        x: 8
        'y': 1.5
        realizes:
          - index
        description: 実体・関係・コミュニティ要約などの索引成果物を保持する。
        evidence:
          - type: doc
            ref: docs/reference-trend-graphrag.md#§5
      azure-cosmos:
        label: Azure Cosmos DB（ベクトル索引）
        svc: azure:cosmos
        kind: db
        tier: storage
        x: 14
        'y': 1.5
        realizes:
          - index
        description: GraphRAG が検索する埋め込みを保持する。
        evidence:
          - type: doc
            ref: docs/reference-trend-graphrag.md#§5
      azure-model:
        label: Azure OpenAI（チャット・埋め込み）
        kind: service
        tier: storage
        x: 20
        'y': 1.5
        realizes:
          - model
        description: 抽出と回答生成に使うチャットモデル、および埋め込みモデルを提供する。
        evidence:
          - type: doc
            ref: docs/reference-trend-graphrag.md#§5
        svc: azure:openai
    links:
      - id: azure-run-index
        from: azure-vm
        to: azure-indexer
        label: 索引コマンドを実行
      - id: azure-run-query
        from: azure-vm
        to: azure-query
        label: 検索コマンドを実行
      - id: azure-extract
        from: azure-indexer
        to: azure-model
        label: 実体抽出と埋め込みを要求
      - id: azure-embed
        from: azure-query
        to: azure-model
        label: 質問の埋め込みを要求
      - id: azure-index-parquet
        from: azure-indexer
        to: azure-artifacts
        label: 実体・関係などを Parquet に保存
        realizes:
          - index
        replace: true
      - id: azure-index-vectors
        from: azure-indexer
        to: azure-cosmos
        label: 埋め込みをベクトル索引に保存
        realizes:
          - index
        replace: true
      - id: azure-read-parquet
        from: azure-artifacts
        to: azure-query
        label: 関連するグラフ文脈を読む
        realizes:
          - lookup
        replace: true
      - id: azure-read-vectors
        from: azure-cosmos
        to: azure-query
        label: 類似の実体を検索
        realizes:
          - lookup
        replace: true
    layout2d:
      tiers: [{id: diagram, label: 実行環境と外部サービス, z: 0, origin: [-4, 0], size: [26, 18]}]
      nodes:
        azure-user: {tier: diagram, x: 1, y: 1}
        azure-vm: {tier: diagram, x: 6, y: 1}
        azure-indexer: {tier: diagram, x: 11, y: 1}
        azure-query: {tier: diagram, x: 16, y: 1}
        azure-documents: {tier: diagram, x: 21, y: 1}
        azure-artifacts: {tier: diagram, x: 1, y: 5}
        azure-cosmos: {tier: diagram, x: 6, y: 5}
        azure-model: {tier: diagram, x: 11, y: 5}
      groups:
        - {kind: cloud, provider: azure, label: Azure サブスクリプション, tier: [diagram], nodes: [azure-vm, azure-indexer, azure-query, azure-documents, azure-artifacts, azure-cosmos, azure-model]}
        - {kind: datacenter, label: GraphRAG Linux VM, tier: [diagram], nodes: [azure-vm, azure-indexer, azure-query]}
    layout3d:
      tiers:
        - {id: base, label: 実行基盤と独立サービス, z: 0, size: [26, 18]}
        - {id: app, label: ホスト上の処理, z: 1, size: [26, 18]}
      nodes:
        azure-user: {tier: base, x: 1, y: 1}
        azure-vm: {tier: base, x: 6, y: 1}
        azure-indexer: {tier: app, x: 11, y: 1}
        azure-query: {tier: app, x: 16, y: 1}
        azure-documents: {tier: base, x: 21, y: 1}
        azure-artifacts: {tier: base, x: 1, y: 5}
        azure-cosmos: {tier: base, x: 6, y: 5}
        azure-model: {tier: base, x: 11, y: 5}
      groups:
        - {kind: cloud, provider: azure, label: Azure サブスクリプション, tier: [base, app], nodes: [azure-vm, azure-indexer, azure-query, azure-documents, azure-artifacts, azure-cosmos, azure-model]}
        - {kind: datacenter, label: GraphRAG Linux VM, tier: [base, app], nodes: [azure-vm, azure-indexer, azure-query]}
