      aws-parts: {label: "EBS 上の MergeTree のデータパート", kind: file, tier: storage, x: 12, y: 1.5, realizes: [partition, parts, granules], description: "月別パート、各パートの列ファイル、疎主インデックスとマークを保持する。", management: {type: customer, scope: "利用者がデータ、権限と復旧を管理する。"}, evidence: [{type: doc, ref: docs/reference-clickhouse-mergetree.md#§7}]}
