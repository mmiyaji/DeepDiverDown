        - {id: process, label: ClickHouse Server, z: 1, size: [12, 5]}
      nodes:
        aws-client: {tier: client, x: 1, y: 2}
        aws-ec2: {tier: platform, x: 2, y: 2}
        aws-ebs: {tier: platform, x: 7, y: 2}
        aws-parts: {tier: platform, x: 11, y: 2}
        aws-server: {tier: process, x: 2, y: 2}
        aws-merge: {tier: process, x: 7, y: 2}
      groups:
        - {kind: cloud, label: AWS アカウント, provider: aws, tier: [platform, process], nodes: [aws-ec2, aws-server, aws-merge, aws-ebs, aws-parts]}
