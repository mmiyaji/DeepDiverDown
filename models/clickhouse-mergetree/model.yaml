name: "ClickHouse：MergeTree のパートと疎インデックス"
parent:
  model: clickhouse
  node: granules
description: "直近 7 日の注文を例に、月パーティションと疎主インデックスで読む範囲を絞り、バックグラウンドマージでパートが置き換わる流れを追う。"
reference:
  objectives:
    - パーティション、パート、グラニュール、マークの関係を説明する。
    - パートの候補選択と疎主インデックスによるグラニュールの絞り込みを追う。
    - パートのマージが物理配置とクエリ結果に与える影響を説明する。
  sources:
    - title: ClickHouse MergeTree table engine
      url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/mergetree
    - title: ClickHouse EXPLAIN
      url: https://clickhouse.com/docs/reference/statements/explain
    - title: ClickHouse system.parts
      url: https://clickhouse.com/docs/operations/system-tables/parts
sources: ["docs/reference-clickhouse-mergetree.md"]
evidence:
  - {"type":"doc","ref":"docs/reference-clickhouse-mergetree.md#§1"}
  - {"type":"doc","ref":"docs/reference-clickhouse-mergetree.md#§2"}
  - {"type":"doc","ref":"docs/reference-clickhouse-mergetree.md#§3"}
  - {"type":"doc","ref":"docs/reference-clickhouse-mergetree.md#§4"}
  - {"type":"doc","ref":"docs/reference-clickhouse-mergetree.md#§5"}
  - {"type":"doc","ref":"docs/reference-clickhouse-mergetree.md#§6"}
tiers:
  - {"id":"engine","label":"書き込みとクエリ","z":1,"origin":[0,0],"size":[15,3]}
  - {"id":"storage","label":"MergeTree の保存単位","z":0,"origin":[0,0],"size":[15,3]}
nodes:
  insert: {label: 注文データの取り込み元, kind: actor, tier: engine, x: 1, 'y': 1.5, description: 注文のバッチを書き込む。, evidence: [{type: doc, ref: docs/reference-clickhouse-mergetree.md#§2}]}
  planner: {label: SQL の読取計画, kind: service, tier: engine, x: 5, 'y': 1.5, description: 日付と顧客の述語から候補範囲を計画する。, evidence: [{type: doc, ref: docs/reference-clickhouse-mergetree.md#§3}, {type: doc, ref: docs/reference-clickhouse-mergetree.md#§5}]}
  scan: {label: 候補範囲の列スキャン, kind: worker, tier: engine, x: 9, 'y': 1.5, description: 候補グラニュールの必要列を読み、行の述語を評価する。, evidence: [{type: doc, ref: docs/reference-clickhouse-mergetree.md#§3}]}
  result: {"label":"注文別の金額","kind":"external","tier":"engine","x":14,"y":1.5,"description":"条件を満たす注文の order_id と amount を返す。","evidence":[{"type":"doc","ref":"docs/reference-clickhouse-mergetree.md#§1"}]}
  partition: {label: 月パーティション, kind: db, tier: storage, x: 1, y: 1.5, description: パートを注文日の月によって分ける。, evidence: [{type: doc, ref: docs/reference-clickhouse-mergetree.md#§2}]}
  parts: {"label":"データパート","kind":"db","tier":"storage","x":5,"y":1.5,"description":"並べ替え済みの列データとインデックスを備えた不変の単位。","evidence":[{"type":"doc","ref":"docs/reference-clickhouse-mergetree.md#§2"}]}
  granules: {"label":"疎主インデックスとマーク","kind":"segment","tier":"storage","x":9,"y":1.5,"description":"グラニュール境界のキーと列データ上の位置を使い、読む範囲を決める。","evidence":[{"type":"doc","ref":"docs/reference-clickhouse-mergetree.md#§3"}]}
  merger: {label: 同じパーティション内のデータ統合, kind: worker, tier: storage, x: 14, 'y': 1.5, description: 同じパーティションの選択されたパートを新しいパートにまとめる。, evidence: [{type: doc, ref: docs/reference-clickhouse-mergetree.md#§4}]}
links:
  - {"id":"store","from":"insert","to":"partition","label":"月ごとに行を振り分ける","evidence":[{"type":"doc","ref":"docs/reference-clickhouse-mergetree.md#§2"}]}
  - {"id":"sort","from":"partition","to":"parts","label":"ソート済みパートを作る","evidence":[{"type":"doc","ref":"docs/reference-clickhouse-mergetree.md#§2"}]}
  - {"id":"partition-prune","from":"planner","to":"partition","label":"対象月の候補を選ぶ","evidence":[{"type":"doc","ref":"docs/reference-clickhouse-mergetree.md#§3"}]}
  - {"id":"index-prune","from":"planner","to":"granules","label":"疎インデックスを探索する","evidence":[{"type":"doc","ref":"docs/reference-clickhouse-mergetree.md#§3"}]}
  - {"id":"read","from":"granules","to":"scan","label":"候補の列データを読む","evidence":[{"type":"doc","ref":"docs/reference-clickhouse-mergetree.md#§3"}]}
  - {"id":"return","from":"scan","to":"result","label":"条件を満たす行を返す","evidence":[{"type":"doc","ref":"docs/reference-clickhouse-mergetree.md#§3"}]}
  - {"id":"pick","from":"parts","to":"merger","label":"同じ月のパートを選ぶ","evidence":[{"type":"doc","ref":"docs/reference-clickhouse-mergetree.md#§4"}]}
  - {"id":"replace","from":"merger","to":"parts","label":"新しいパートを有効にする","evidence":[{"type":"doc","ref":"docs/reference-clickhouse-mergetree.md#§4"}]}
scenarios:
  - id: query-week
    label: 直近 7 日から顧客 42 を探す
    visual: tree
    evidence:
      - type: doc
        ref: docs/reference-clickhouse-mergetree.md#§3
    steps:
      - links:
          - partition-prune
        note: 1 月 25 日から 2 月 1 日未満のため、12 月と 2 月の枝を除外する。
        prune:
          - dec
          - feb
      - links:
          - index-prune
        note: 1 月の各パートで疎主インデックスを調べ、対象の日付と顧客を含み得るグラニュールを残す。
        prune:
          - a-older
          - b-other
      - links:
          - read
          - return
        note: マークで列データの読み取り位置を決め、候補の行に日付と顧客の条件を適用する。
        read:
          - a-match
          - b-match
  - id: merge-parts
    label: 1 月の二つのパートをマージする
    visual: merge
    evidence:
      - type: doc
        ref: docs/reference-clickhouse-mergetree.md#§4
    steps:
      - links:
          - store
          - sort
        note: 1 月への二つの INSERT で、独立して並べ替えた A と B ができる。
        highlight:
          - part-a
          - part-b
      - links:
          - pick
        note: バックグラウンドタスクが同じ月の A と B を選ぶ。2 月の C は別のパーティションに属する。
        highlight:
          - part-a
          - part-b
      - links:
          - replace
        note: 二つの入力をキー順にマージし、新しいパート M のグラニュール境界と索引を作る。
        blocks:
          january:
            - id: part-m
              label: パート M
              k: 2
              from:
                - part-a
                - part-b
          february:
            - id: part-c
              label: パート C
              k: 1
        highlight:
          - part-m
requirements:
  - {"id":"BR-01","kind":"usecase","title":"対象期間の注文を返す","text":"日付と顧客の条件を満たす注文だけを返す。","links":["read","return"],"evidence":[{"type":"doc","ref":"docs/reference-clickhouse-mergetree.md#§3"}]}
  - {"id":"BR-02","kind":"rule","title":"同じ月で物理配置を整理","text":"選択されたパートを同じ月の中でまとめ、注文行を保持する。","links":["pick","replace"],"evidence":[{"type":"doc","ref":"docs/reference-clickhouse-mergetree.md#§4"}]}
unknowns:
  - {"id":"UNK-01","text":"実環境のパート数、グラニュール境界、索引による除外数、マージの時期は未確認。","refs":["parts","granules","merger"]}
gates: {maxDrift: 0, maxHigh: 0}
treeLayout:
  title: 月パーティションからグラニュールまで
  levels:
    - テーブル
    - 月
    - パート
    - 候補グラニュール
  note: 説明用の配置。各葉はグラニュールの例。
  root:
    id: orders
    label: orders
    kind: meta
    node: partition
    children:
      - id: dec
        label: 2025-12
        kind: snapshot
        node: partition
        children:
          - id: dec-part
            label: パート D
            kind: manifest
            node: parts
            children:
              - id: dec-granule
                label: 期間外
                kind: data
                node: granules
      - id: jan
        label: 2026-01
        kind: snapshot
        node: partition
        children:
          - id: a
            label: パート A
            kind: manifest
            node: parts
            children:
              - id: a-older
                label: 期間外
                kind: data
                node: granules
                description: 先頭キーは (42, 2026-01-01)。次のグラニュールの先頭は (42, 2026-01-20) で、期間より前にある。
              - id: a-match
                label: 顧客 42 の候補
                kind: data
                node: granules
                description: 先頭キーは (42, 2026-01-20)。対象期間に重なる可能性がある。
          - id: b
            label: パート B
            kind: manifest
            node: parts
            children:
              - id: b-match
                label: 顧客 42 の候補
                kind: data
                node: granules
                description: 先頭キーは (42, 2026-01-25)。顧客 42 と対象期間に合う行を含む。
              - id: b-other
                label: 顧客範囲外
                kind: data
                node: granules
                description: 先頭キーは (43, 2026-01-01)。顧客 42 はソート順でこの境界より前にある。
      - id: feb
        label: 2026-02
        kind: snapshot
        node: partition
        children:
          - id: feb-part
            label: パート C
            kind: manifest
            node: parts
            children:
              - id: feb-granule
                label: 期間外
                kind: data
                node: granules
  unit: 図中のグラニュール
blocks:
  id: merge
  title: 月パーティション内のバックグラウンドマージ
  note: 塊は説明用のデータパート。
  legend:
    "0": 1 月の入力
    "1": 2 月のパート
    "2": 1 月の出力
  lanes:
    - id: january
      label: 2026-01
      node: parts
    - id: february
      label: 2026-02
      node: partition
  items:
    january:
      - id: part-a
        label: パート A
        k: 0
      - id: part-b
        label: パート B
        k: 0
    february:
      - id: part-c
        label: パート C
        k: 1

implementations:
  - id: mergetree
    label: "単一 ClickHouse サーバーの MergeTree"
    description: "架空の注文を `PARTITION BY toYYYYMM(order_date)` と `ORDER BY (customer_id, order_date)` の MergeTree に格納する例。クライアントとサーバー、およびディスク上の物理部品を分けて示す。"
    sources:
      - {title: ClickHouse の Debian・Ubuntu 導入, url: https://clickhouse.com/docs/get-started/setup/self-managed/debian-ubuntu}
      - {title: ClickHouse MergeTree table engine, url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/mergetree}
      - {title: ClickHouse EXPLAIN, url: https://clickhouse.com/docs/reference/statements/explain}
      - {title: ClickHouse system.parts, url: https://clickhouse.com/docs/operations/system-tables/parts}
    tiers:
      - {id: processing, label: データの処理と保存, z: 0, size: [14, 5]}
      - {id: setup, label: 実行に必要な設定・成果物, z: 1, size: [14, 3]}
    nodes:
      mergetree-host: {label: 自前 Linux サーバー, kind: host, tier: processing, x: 3, y: 0, description: 利用者が ClickHouse Server とローカルファイルシステムを運用する。, evidence: [{type: doc, ref: docs/reference-clickhouse-mergetree.md#§6}]}
      mergetree-insert: {label: clickhouse-client から INSERT, kind: client, tier: processing, x: 1, y: 1.15, realizes: [insert], description: バッチ単位で注文を投入する。, evidence: [{type: doc, ref: docs/reference-clickhouse-mergetree.md#§6}]}
      mergetree-server: {label: ClickHouse Server の SELECT と MergeTree 読取, kind: service, tier: processing, x: 1, y: 3.65, realizes: [planner, scan], description: 疎索引を調べて読み取り候補を絞る。, evidence: [{type: doc, ref: docs/reference-clickhouse-mergetree.md#§6}]}
      mergetree-data: {label: MergeTree の月別パートとマーク, kind: db, tier: processing, x: 5, y: 1.15, realizes: [partition, parts, granules], description: 各パートに列データ、疎主索引とマークを持つ。, evidence: [{type: doc, ref: docs/reference-clickhouse-mergetree.md#§6}]}
      mergetree-merge: {label: MergeTree のバックグラウンドマージ, kind: worker, tier: processing, x: 5, y: 3.65, realizes: [merger], description: 同一パーティションの入力パートを統合する。, evidence: [{type: doc, ref: docs/reference-clickhouse-mergetree.md#§6}]}
      mergetree-result: {label: clickhouse-client の注文結果, kind: external, tier: processing, x: 9, y: 1.15, realizes: [result], description: 条件に合う行を表示する。, evidence: [{type: doc, ref: docs/reference-clickhouse-mergetree.md#§6}]}
      mergetree-system: {label: system.parts, kind: table, tier: setup, x: 1, y: 1.5, description: active、rows、marks などを調べられるシステムテーブル。, evidence: [{type: doc, ref: docs/reference-clickhouse-mergetree.md#§6}]}
    links:
      - {id: mergetree-host-run, from: mergetree-host, to: mergetree-server, label: ClickHouse を実行}
      - {id: mergetree-host-storage, from: mergetree-host, to: mergetree-data, label: データディレクトリを提供}
      - {id: mergetree-system-connection, from: mergetree-system, to: mergetree-server, label: パートの状態を観測}
    layout2d:
      tiers:
        - {id: diagram, label: 自前 ClickHouse, z: 0, size: [20, 12]}
      nodes:
        mergetree-insert: {tier: diagram, x: 2, y: 2}
        mergetree-result: {tier: diagram, x: 2, y: 8}
        mergetree-host: {tier: diagram, x: 8, y: 2}
        mergetree-server: {tier: diagram, x: 8, y: 6}
        mergetree-merge: {tier: diagram, x: 13, y: 6}
        mergetree-data: {tier: diagram, x: 17, y: 3}
        mergetree-system: {tier: diagram, x: 13, y: 10}
      groups:
        - {kind: nodegroup, label: 自前 Linux サーバー, tier: [diagram], x0: 5.3, y0: -0.5, x1: 19.5, y1: 11.7, nodes: [mergetree-host, mergetree-server, mergetree-merge, mergetree-data, mergetree-system]}
    layout3d:
      tiers:
        - {id: clients, label: クライアント, kind: origin, z: 0, origin: [-5, 0], size: [3, 7]}
