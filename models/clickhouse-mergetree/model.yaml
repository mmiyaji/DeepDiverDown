      aws-ec2: {label: "Amazon EC2（Linux）", svc: ec2, kind: host, tier: process, x: 2, y: 2, description: "利用者管理の ClickHouse Server を実行する。", management: {type: shared, scope: "AWS が EC2 の物理基盤を運用し、利用者が OS とインスタンスを管理する。"}, evidence: [{type: doc, ref: docs/reference-clickhouse-mergetree.md#§7}]}
