name: OpenMetadata のメタデータ基盤
description: 収集したメタデータに分類・所有者・列リネージを付け、データ契約の検証に活用する流れを追います。
parent:
  model: data-catalog-architecture
  node: openmetadata
reference:
  objectives:
    - コネクタ、OpenMetadata Server、メタデータ DB、検索エンジンの役割を説明する。
    - 用語集、分類タグ、所有者を使った資産発見を追う。
    - データ契約の定義、検証結果、カタログ権限の関係を区別する。
  sources:
    - title: Docker Deployment Architecture
      url: https://docs.open-metadata.org/v1.12.x/deployment/docker
    - title: System and Components
      url: https://docs.open-metadata.org/v1.12.x/developers/architecture/code-layout
    - title: Data Discovery
      url: https://docs.open-metadata.org/v1.12.x/how-to-guides/data-discovery/discover
    - title: Data Governance
      url: https://docs.open-metadata.org/v1.12.x/how-to-guides/data-governance
    - title: Column-Level Lineage
      url: https://docs.open-metadata.org/v1.12.x/how-to-guides/data-lineage/column
    - title: Roles and Policies
      url: https://docs.open-metadata.org/v1.12.x/how-to-guides/admin-guide/roles-policies/authorization
    - title: Creating Data Contracts
      url: https://docs.open-metadata.org/v1.12.x/how-to-guides/data-contracts/spec
    - title: Data Contracts API
      url: https://docs.open-metadata.org/v1.12.x/api-reference/data-contracts
sources:
  - docs/reference-openmetadata.md
evidence:
  - type: doc
    ref: docs/reference-openmetadata.md#§1
tiers:
  - id: external
    label: 接続元・利用者
    z: 2
    size:
      - 13
      - 3
  - id: service
    label: メタデータ管理・検索
    z: 1
    size:
      - 13
      - 4
  - id: stores
    label: メタデータと検索
    z: 0
    size:
      - 13
      - 3
nodes:
  source:
    label: データベース・BI
    kind: external
    tier: external
    x: 1
    'y': 1
    description: スキーマ、クエリ、ダッシュボードの取り込み元。
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§1
      - type: doc
        ref: docs/reference-openmetadata.md#§3
  steward:
    label: データ担当者
    kind: actor
    tier: external
    x: 6
    'y': 1
    description: タグ・所有者・契約をキュレーションする。
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§2
      - type: doc
        ref: docs/reference-openmetadata.md#§4
      - type: doc
        ref: docs/reference-openmetadata.md#§5
  consumer:
    label: データ利用者
    kind: actor
    tier: external
    x: 10
    'y': 1
    description: 資産を探して下流の影響を確認する。
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§2
  ingest:
    label: メタデータ・リネージ収集
    kind: worker
    tier: service
    x: 1
    'y': 1
    description: 外部ソースから必要な情報を抽出する。
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§1
      - type: doc
        ref: docs/reference-openmetadata.md#§3
  api:
    label: メタデータ API
    kind: service
    tier: service
    x: 5
    'y': 1
    description: メタデータ API と操作の認可を提供する。
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§1
      - type: doc
        ref: docs/reference-openmetadata.md#§4
  contracts:
    label: データ契約・検証
    kind: worker
    tier: service
    x: 8
    'y': 2.5
    description: スキーマなどの契約条件を管理し、検証結果を記録する。
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§5
  portal:
    label: 検索・リネージ画面
    kind: service
    tier: service
    x: 11
    'y': 1
    description: 資産、所有者、分類タグや関連列を表示する。
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§2
      - type: doc
        ref: docs/reference-openmetadata.md#§3
  db:
    label: メタデータ DB
    kind: db
    tier: stores
    x: 5
    'y': 1
    description: カタログの資産・関係を保存する。
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§1
  index:
    label: 検索エンジン
    kind: db
    tier: stores
    x: 10
    'y': 1
    description: メタデータを検索可能にする索引。
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§1
links:
  - id: extract
    from: source
    to: ingest
    label: メタデータと関係を抽出
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§1
  - id: ingest-api
    from: ingest
    to: api
    label: 資産・リネージを登録
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§3
  - id: save
    from: api
    to: db
    label: カタログに保存
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§1
  - id: index-assets
    from: api
    to: index
    label: 索引を更新
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§1
  - id: enrich
    from: steward
    to: portal
    label: 所有者・分類を設定
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§2
  - id: authorize
    from: portal
    to: api
    label: 操作を認可
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§4
  - id: search
    from: consumer
    to: portal
    label: 所有者や分類で資産を検索
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§2
  - id: trace
    from: portal
    to: api
    label: 列の下流をたどる
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§3
  - id: define
    from: steward
    to: contracts
    label: 契約条件を定義し検証を実行
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§5
  - id: validate
    from: contracts
    to: api
    label: 最新のメタデータを検証
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§5
  - id: result
    from: portal
    to: contracts
    label: 検証結果を確認
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§5
scenarios:
  - id: pii-impact
    label: 個人情報を含む列の影響を調べる
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§6
    steps:
      - links:
          - extract
          - ingest-api
          - save
          - index-assets
        note: テーブルとダッシュボードのスキーマ・依存関係を収集する。
      - links:
          - enrich
          - authorize
        note: データ担当者が顧客のメール列に分類タグを付け、所有者を登録する。
      - links:
          - search
          - trace
        note: 列を利用する下流レポートと連絡先を確認する。
  - id: verify-contract
    label: 公開テーブルの契約を検証する
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§6
    steps:
      - links:
          - define
        note: 必須列と型を契約に登録する。
      - links:
          - validate
        note: 検証器が最新のメタデータと契約条件を照合する。
      - links:
          - result
        note: データ担当者が検証結果を確認する。
requirements:
  - id: R-01
    kind: rule
    title: 分類タグの編集権限
    text: 機密性を示す分類タグの変更を許可された担当者に限定する。
    links:
      - enrich
      - authorize
    evidence:
      - type: doc
        ref: docs/reference-openmetadata.md#§4
implementations:
  - id: openmetadata-compose
    label: OpenMetadata の Docker Compose
    description: OpenMetadata Server、取り込み用 Airflow、PostgreSQL、Elasticsearch を分け、BigQuery と Looker を収集対象にする例。
    sources:
      - title: Docker Deployment Architecture
        url: https://docs.open-metadata.org/v1.12.x/deployment/docker
      - title: Data Contracts API
        url: https://docs.open-metadata.org/v1.12.x/api-reference/data-contracts
      - title: OpenMetadata Docker Quickstart
        url: https://docs.open-metadata.org/v1.12.x/quick-start/local-docker-deployment
      - title: BigQuery コネクタ
        url: https://docs.open-metadata.org/v2.0.x/connectors/database/bigquery
      - title: Looker コネクタ
        url: https://docs.open-metadata.org/v2.0.x/connectors/dashboard/looker
      - title: OpenMetadata のリネージ取り込み
        url: https://docs.open-metadata.org/v2.0.x/connectors/ingestion/lineage
    nodes:
      openmetadata-compose-host: {label: Docker Compose host, kind: host, tier: service, x: 14, y: 1, evidence: [{type: doc, ref: "docs/reference-openmetadata.md#§7"}]}
      openmetadata-compose-bigquery:
        label: BigQuery
        kind: external
        tier: external
        x: 1
        'y': 1
        description: テーブルとリネージ用のクエリログを提供する。
        svc: gcp:bigquery
        realizes:
          - source
        evidence:
          - type: doc
            ref: docs/reference-openmetadata.md#§7
      openmetadata-compose-steward:
        label: データスチュワード
        kind: actor
        tier: external
        x: 6
        'y': 1
        description: 分類や契約を担当する。
        realizes:
          - steward
        evidence:
          - type: doc
            ref: docs/reference-openmetadata.md#§7
      openmetadata-compose-looker:
        label: Looker ダッシュボード
        kind: external
        tier: external
        x: 3.8
        'y': 1
        description: Looker コネクタがダッシュボード・チャートを API から取得する。
        realizes:
          - source
        evidence:
          - type: doc
            ref: docs/reference-openmetadata.md#§7
      openmetadata-compose-lookml:
        label: GitHub の LookML ファイル
        kind: file
        tier: external
        x: 3.8
        'y': 2.7
        description: 対応する LookML View と、その参照先テーブルのリネージを収集するために使用する。
        evidence:
          - type: doc
            ref: docs/reference-openmetadata.md#§7
      openmetadata-compose-reader:
        label: カタログ利用者
        kind: actor
        tier: external
        x: 10
        'y': 1
        description: 資産と依存関係を検索する。
        realizes:
          - consumer
        evidence:
          - type: doc
            ref: docs/reference-openmetadata.md#§7
      openmetadata-compose-ingestion:
        label: OpenMetadata Ingestion コンテナ
        kind: worker
        tier: service
        x: 1
        'y': 1
        description: BigQuery のスキーマ・クエリログと Looker のメタデータを、別のコネクタで収集する。
        realizes:
          - ingest
        evidence:
          - type: doc
            ref: docs/reference-openmetadata.md#§7
      openmetadata-compose-server:
        label: OpenMetadata Server（API・Web）
        kind: catalog
        tier: service
        x: 7
        'y': 1
        description: API と検索画面、契約の取得・検証を提供する。
        realizes:
          - api
          - portal
          - contracts
        evidence:
          - type: doc
            ref: docs/reference-openmetadata.md#§7
      openmetadata-compose-postgres:
        label: PostgreSQL
        kind: db
        tier: stores
        x: 5
        'y': 1
        description: カタログのエンティティと関係を保持する。
        realizes:
          - db
        evidence:
          - type: doc
            ref: docs/reference-openmetadata.md#§7
      openmetadata-compose-search:
        label: Elasticsearch
        kind: db
        tier: stores
        x: 10
        'y': 1
        description: カタログを索引化する。
        realizes:
          - index
        evidence:
          - type: doc
            ref: docs/reference-openmetadata.md#§7
      openmetadata-compose-airflow:
        label: Airflow スケジューラー
        kind: workflow
        tier: service
        x: 3.8
        'y': 2.6
        description: 収集ワークフローを起動する。
        evidence:
          - type: doc
            ref: docs/reference-openmetadata.md#§7
    links:
      - id: openmetadata-compose-looker-api
        from: openmetadata-compose-looker
        to: openmetadata-compose-ingestion
        label: ダッシュボードのメタデータを収集
        realizes:
          - extract
        evidence:
          - type: doc
            ref: docs/reference-openmetadata.md#§7
      - id: openmetadata-compose-lookml-source
        from: openmetadata-compose-lookml
        to: openmetadata-compose-ingestion
        label: View と参照先テーブルの情報を収集
        realizes:
          - extract
        evidence:
          - type: doc
            ref: docs/reference-openmetadata.md#§7
      - id: openmetadata-compose-dashboard-upstream
        from: openmetadata-compose-bigquery
        to: openmetadata-compose-looker
        label: レポートが参照するテーブル
        evidence:
          - type: doc
            ref: docs/reference-openmetadata.md#§7
      - id: openmetadata-compose-schedule
        from: openmetadata-compose-airflow
        to: openmetadata-compose-ingestion
        label: 収集ワークフローを定期実行
        evidence:
          - type: doc
            ref: docs/reference-openmetadata.md#§7
    groups:
      - kind: cloud
        provider: gcp
        label: Google Cloud サービス
        tier:
          - external
        nodes:
          - openmetadata-compose-bigquery


    layout2d:
      tiers: [{id: diagram, label: Local containers and sources, z: 0, size: [31, 14]}]
      nodes:
        openmetadata-compose-host: {tier: diagram, x: 3, y: 2}
        openmetadata-compose-ingestion: {tier: diagram, x: 7, y: 2}
        openmetadata-compose-server: {tier: diagram, x: 11, y: 2}
        openmetadata-compose-postgres: {tier: diagram, x: 15, y: 2}
        openmetadata-compose-search: {tier: diagram, x: 3, y: 6}
        openmetadata-compose-airflow: {tier: diagram, x: 7, y: 6}
        openmetadata-compose-bigquery: {tier: diagram, x: 22, y: 1}
        openmetadata-compose-steward: {tier: diagram, x: 26, y: 1}
        openmetadata-compose-looker: {tier: diagram, x: 22, y: 4}
        openmetadata-compose-lookml: {tier: diagram, x: 26, y: 4}
        openmetadata-compose-reader: {tier: diagram, x: 22, y: 7}
      groups:
        - {kind: datacenter, label: Docker Compose host, tier: diagram, nodes: [openmetadata-compose-host, openmetadata-compose-ingestion, openmetadata-compose-server, openmetadata-compose-postgres, openmetadata-compose-search, openmetadata-compose-airflow]}
        - {kind: cloud, provider: gcp, label: External data platform, tier: diagram, nodes: [openmetadata-compose-bigquery]}
    layout3d:
      tiers:
        - {id: containers, label: Containers, z: 1, size: [16, 6]}
        - {id: host, label: Docker host, z: 0, size: [16, 6]}
        - {id: outside, label: Sources and users, kind: origin, z: 0, origin: [20, 0], size: [16, 6]}
      nodes:
        openmetadata-compose-host: {tier: host, x: 2, y: 1}
        openmetadata-compose-ingestion: {tier: containers, x: 6, y: 1}
        openmetadata-compose-server: {tier: containers, x: 10, y: 1}
        openmetadata-compose-postgres: {tier: containers, x: 14, y: 1}
        openmetadata-compose-search: {tier: containers, x: 2, y: 4}
        openmetadata-compose-airflow: {tier: containers, x: 6, y: 4}
        openmetadata-compose-bigquery: {tier: outside, x: 2, y: 1}
        openmetadata-compose-steward: {tier: outside, x: 6, y: 1}
        openmetadata-compose-looker: {tier: outside, x: 10, y: 1}
        openmetadata-compose-lookml: {tier: outside, x: 14, y: 1}
        openmetadata-compose-reader: {tier: outside, x: 2, y: 4}
      groups:
        - {kind: datacenter, label: Docker Compose host, tier: [containers, host], nodes: [openmetadata-compose-host, openmetadata-compose-ingestion, openmetadata-compose-server, openmetadata-compose-postgres, openmetadata-compose-search, openmetadata-compose-airflow]}
        - {kind: cloud, provider: gcp, label: External data platform, tier: outside, nodes: [openmetadata-compose-bigquery]}

  - id: aws-eks-openmetadata
    label: "Amazon EKS 上の OpenMetadata・RDS・OpenSearch"
    description: "Helm で OpenMetadata と OMJob Operator を EKS に展開する。取り込みは Kubernetes ジョブで動き、RDS と OpenSearch をクラスター外の依存先として使う。"
    sources:
      - {title: "OpenMetadata の AWS EKS デプロイ", url: https://docs.open-metadata.org/v2.1.x/deployment/kubernetes/eks}
      - {title: "OpenMetadata の Kubernetes Orchestrator", url: https://docs.open-metadata.org/v1.12.x/deployment/ingestion/kubernetes}
      - {title: "OpenMetadata のデータ契約 API", url: https://docs.open-metadata.org/v1.12.x/api-reference/data-contracts}
      - {title: "OpenMetadata の Kubernetes アップグレード", url: https://docs.open-metadata.org/v1.12.x/deployment/upgrade/kubernetes}
      - {title: "EKS マネージドノードグループ", url: https://docs.aws.amazon.com/eks/latest/userguide/create-managed-node-group.html}
      - {title: AWS shared responsibility, url: https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/shared-responsibility.html}
      - {title: EKS managed node groups, url: https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html}
    tiers:
      - {id: entry, label: 投入元, kind: origin, z: 1, origin: [-5, 0], size: [3, 4]}
      - {id: runtime, label: 管理と実行, z: 1, size: [17, 7]}
      - {id: data, label: データと復旧, z: 0, size: [17, 5]}
    groups:
      - {kind: cloud, label: "AWS アカウント", provider: aws, tier: [runtime, data], nodes: [aws-eks-openmetadata-eks, aws-eks-openmetadata-nodes, aws-eks-openmetadata-operator, aws-eks-openmetadata-ingest, aws-eks-openmetadata-server, aws-eks-openmetadata-quality, aws-eks-openmetadata-db, aws-eks-openmetadata-search]}
      - {kind: cluster, label: "Amazon EKS クラスター", provider: k8s, tier: [runtime], nodes: [aws-eks-openmetadata-eks, aws-eks-openmetadata-nodes, aws-eks-openmetadata-operator, aws-eks-openmetadata-ingest, aws-eks-openmetadata-server, aws-eks-openmetadata-quality]}
      - {kind: namespace, label: "OpenMetadata 名前空間", provider: k8s, tier: [runtime], nodes: [aws-eks-openmetadata-operator, aws-eks-openmetadata-ingest, aws-eks-openmetadata-server, aws-eks-openmetadata-quality]}
      - {kind: vpc, label: "RDS と OpenSearch の接続先", provider: aws, tier: [data], nodes: [aws-eks-openmetadata-db, aws-eks-openmetadata-search]}
    nodes:
      aws-eks-openmetadata-source: {label: "収集対象データベース・BI", kind: external, tier: entry, x: 1, y: 0.6, realizes: [source], description: "コネクターが許可されたカタログ情報とリネージを読み取る。", evidence: [{type: doc, ref: docs/reference-openmetadata.md#§8}]}
      aws-eks-openmetadata-steward: {label: "データ担当者", kind: actor, tier: entry, x: 1, y: 2, realizes: [steward], description: "説明、分類、契約を管理する。", evidence: [{type: doc, ref: docs/reference-openmetadata.md#§8}]}
      aws-eks-openmetadata-consumer: {label: "データ利用者", kind: actor, tier: entry, x: 1, y: 3.4, realizes: [consumer], description: "検索とリネージを見る。", evidence: [{type: doc, ref: docs/reference-openmetadata.md#§8}]}
      aws-eks-openmetadata-eks: {label: "EKS Kubernetes API", kind: service, tier: runtime, x: 1, y: 0.6, svc: eks, description: "Helm が展開するワークロードを受け入れる。", management: {type: shared, scope: "AWS operates EKS control plane; customer manages Kubernetes API configuration and workloads."}, evidence: [{type: doc, ref: docs/reference-openmetadata.md#§8}]}
      aws-eks-openmetadata-nodes: {label: "EKS の EC2 ノード", kind: host, tier: runtime, x: 1, y: 4.8, svc: ec2, description: "サーバー、Operator、収集 Job の Pod を実行する。", management: {type: shared, scope: "AWS operates service infrastructure; customer configures resources, data and permissions."}, evidence: [{type: doc, ref: docs/reference-openmetadata.md#§8}]}
      aws-eks-openmetadata-operator: {label: "OMJob Operator", kind: scheduler, tier: runtime, x: 6, y: 0.6, description: "OpenMetadata が作成した OMJob を監視して Kubernetes Job を管理する。", management: {type: customer, scope: "Customer manages deployment, code and access."}, evidence: [{type: doc, ref: docs/reference-openmetadata.md#§8}]}
      aws-eks-openmetadata-ingest: {label: "OpenMetadata 収集 Job", kind: worker, tier: runtime, x: 6, y: 4.8, realizes: [ingest], description: "対象コネクターを実行し、収集結果を API に送る。", management: {type: customer, scope: "Customer manages deployment, code and access."}, evidence: [{type: doc, ref: docs/reference-openmetadata.md#§8}]}
      aws-eks-openmetadata-server: {label: "OpenMetadata Server API・UI", kind: service, tier: runtime, x: 11, y: 4.8, realizes: [api, portal, contracts], description: "UI を提供し、メタデータ操作と契約の定義・検証要求を受け付ける。", management: {type: customer, scope: "Customer manages deployment, code and access."}, evidence: [{type: doc, ref: docs/reference-openmetadata.md#§8}]}
