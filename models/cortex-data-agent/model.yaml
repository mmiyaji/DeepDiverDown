name: Snowflake Cortex Agents の分析と文書検索
description: Cortex Agent が指標と文書を扱い、認可と実行結果を確認する構成例。
reference:
  objectives:
    - 指標の問い合わせと文書検索の責務を区別する。
    - 認証・権限と回答の出典を追う。
    - エージェントの実行を観測し評価する。
  sources:
    - title: 公式資料 1
      url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents
    - title: 公式資料 2
      url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-search/cortex-search-agents
sources:
  - docs/reference-cortex-data-agent.md
evidence:
  - type: doc
    ref: docs/reference-cortex-data-agent.md#§1
tiers:
  - id: access
    label: 利用と調整
    z: 2
    size:
      - 12
      - 3
  - id: data
    label: 指標と文書
    z: 1
    size:
      - 14
      - 3
  - id: ops
    label: 運用と評価
    z: 0
    size:
      - 12
      - 3
nodes:
  question:
    label: 利用者
    kind: actor
    tier: access
    x: 0
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  agent:
    label: Cortex Agent
    kind: service
    tier: access
    x: 4
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  identity:
    label: 利用者の権限
    kind: service
    tier: access
    x: 8
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  metrics:
    label: Cortex Analyst
    kind: service
    tier: data
    x: 0
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  warehouse:
    label: Snowflake の分析テーブル
    kind: db
    tier: data
    x: 4
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  search:
    label: Cortex Search
    kind: service
    tier: data
    x: 8
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  documents:
    label: 検索対象の文書
    kind: db
    tier: data
    x: 12
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  trace:
    label: 実行の観測
    kind: service
    tier: ops
    x: 4
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  review:
    label: 評価担当
    kind: actor
    tier: ops
    x: 8
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
links:
  - id: ask
    from: question
    to: agent
    label: 売上と返品理由を質問
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  - id: authorize
    from: agent
    to: identity
    label: 利用権限を確認
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  - id: query
    from: agent
    to: metrics
    label: 対象期間の指標を取得
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  - id: read
    from: metrics
    to: warehouse
    label: 注文と返品を集計
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  - id: retrieve
    from: agent
    to: search
    label: 関連文書を検索
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  - id: lookup
    from: search
    to: documents
    label: 出典と本文を取得
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  - id: record
    from: agent
    to: trace
    label: 実行と結果を記録
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  - id: evaluate
    from: review
    to: trace
    label: 実行を評価
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  - id: answer
    from: agent
    to: question
    label: 数値と出典を回答
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
scenarios:
  - id: answer
    label: 売上と返品理由を調べる
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
    steps:
      - links:
          - ask
          - authorize
        note: 質問を受け、利用者の権限を確認する。
      - links:
          - query
          - read
        note: 指標の定義に基づいて対象期間を集計する。
      - links:
          - retrieve
          - lookup
        note: 権限のある文書から関連する出典を取得する。
      - links:
          - record
          - answer
        note: 実行を記録し、数値と出典を付けて回答する。
      - links:
          - evaluate
        note: 数値と出典を評価する。
implementations:
  - id: example
    label: Snowflake の実装例
    description: Snowsight で Cortex Agent を使い、Cortex Analyst が売上 SQL を、Cortex Search が公開範囲を限定した文書検索を担う例。
    sources:
      - title: Cortex Agents
        url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents
      - title: Cortex Search のエージェント連携
        url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-search/cortex-search-agents
      - title: Cortex Agent のツール設定
        url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents-manage
      - title: Cortex Agent の認証と権限
        url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents-setup
      - title: Cortex Search の所有者権限
        url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-search/query-cortex-search-service
      - title: Cortex Agent のリクエスト監視
        url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents-monitor
    tiers:
      - id: access
        label: 利用と調整
        z: 2
        size:
          - 12
          - 3
      - id: data
        label: 指標と文書
        z: 1
        size:
          - 17
          - 6
      - id: ops
        label: 運用と評価
        z: 0
        size:
          - 14
          - 3
    nodes:
      ex-question:
        label: Snowsight の分析利用者
        kind: actor
        tier: access
        x: 0
        'y': 1
        evidence:
          - type: doc
            ref: docs/reference-cortex-data-agent.md#§3
        realizes:
          - question
      ex-agent:
        svc: snowflake:cortex
        label: Cortex Agent
        kind: service
        tier: access
        x: 4
        'y': 1
        description: Snowflake が管理するモデル実行で、指標と文書検索のツールを調整する。
        evidence:
          - type: doc
            ref: docs/reference-cortex-data-agent.md#§3
        realizes:
          - agent
      ex-identity:
        label: Snowflake のセッションロール
        kind: service
        tier: access
        x: 8
        'y': 1
        description: Agent と Analyst のデータベースロール、対象ツールへの権限を分けて付与する。
        evidence:
          - type: doc
            ref: docs/reference-cortex-data-agent.md#§3
        realizes:
          - identity
      ex-metrics:
        svc: snowflake:cortex
        label: Cortex Analyst
        kind: service
        tier: data
        x: 0
        'y': 1
        evidence:
          - type: doc
            ref: docs/reference-cortex-data-agent.md#§3
        realizes:
          - metrics
      ex-warehouse:
        svc: snowflake:database
        label: Snowflake の分析テーブル
        kind: db
        tier: data
        x: 4
        'y': 1
        evidence:
          - type: doc
            ref: docs/reference-cortex-data-agent.md#§3
        realizes:
          - warehouse
      ex-search:
        svc: snowflake:cortex
        label: Cortex Search
        kind: service
        tier: data
        x: 8
        'y': 1
        evidence:
          - type: doc
            ref: docs/reference-cortex-data-agent.md#§3
        realizes:
          - search
      ex-documents:
        svc: snowflake:database
        label: 検索公開範囲の文書テーブル
        kind: db
        tier: data
        x: 12
        'y': 1
        evidence:
          - type: doc
            ref: docs/reference-cortex-data-agent.md#§3
        realizes:
          - documents
      ex-trace:
        label: AI_OBSERVABILITY_EVENTS
        kind: db
        tier: ops
        x: 4
        'y': 1
        description: Snowflake の Agent 監視イベント。閲覧ロールと、マスキング前のイベント閲覧権限を個別に設定する。
        evidence:
          - type: doc
            ref: docs/reference-cortex-data-agent.md#§3
        realizes:
          - trace
      ex-review:
        label: 評価担当
        kind: actor
        tier: ops
        x: 8
        'y': 1
        evidence:
          - type: doc
            ref: docs/reference-cortex-data-agent.md#§3
        realizes:
          - review
      ex-logpolicy:
        label: ログの記録・保持方針
        kind: file
        tier: ops
        x: 12
        'y': 1
        evidence:
          - type: doc
            ref: docs/reference-cortex-data-agent.md#§3
      ex-semantic-view: {label: 売上指標の Semantic View, kind: table, tier: data, x: 0, y: 4.5, description: Cortex Analyst が参照する指標・次元の定義を保持する。, evidence: [{type: doc, ref: docs/reference-cortex-data-agent.md#§3}]}
      ex-sql-compute: {label: Analyst SQL 用 Warehouse, kind: worker, svc: 'snowflake:warehouse', tier: data, x: 4, y: 4.5, description: 生成した SQL を設定された Warehouse で実行する。, evidence: [{type: doc, ref: docs/reference-cortex-data-agent.md#§3}]}
      ex-index-compute: {label: Search 索引更新用 Warehouse, kind: worker, svc: 'snowflake:warehouse', tier: data, x: 12, y: 4.5, description: Cortex Search の索引構築に使うソースクエリを実行する。, evidence: [{type: doc, ref: docs/reference-cortex-data-agent.md#§3}]}
    links:
      - {id: ex-metric-definition, from: ex-semantic-view, to: ex-metrics, label: 売上指標の定義を読む, evidence: [{type: doc, ref: docs/reference-cortex-data-agent.md#§3}]}
      - {id: ex-submit-sql, from: ex-metrics, to: ex-sql-compute, label: 生成した SQL を実行, realizes: [read], replace: true, evidence: [{type: doc, ref: docs/reference-cortex-data-agent.md#§3}]}
      - {id: ex-select, from: ex-sql-compute, to: ex-warehouse, label: セッションロールの権限で分析テーブルを読む, realizes: [read], replace: true, evidence: [{type: doc, ref: docs/reference-cortex-data-agent.md#§3}]}
      - {id: ex-build-index, from: ex-index-compute, to: ex-search, label: 対象文書から索引を更新, evidence: [{type: doc, ref: docs/reference-cortex-data-agent.md#§3}]}
      - id: ex-record-policy
        from: ex-logpolicy
        to: ex-trace
        label: 記録方針を適用
    groups:
      - kind: cloud
        provider: snowflake
        label: Snowflake
        tier:
          - access
        nodes:
          - ex-agent
          - ex-identity
      - kind: cloud
        provider: snowflake
        label: Snowflake
        tier:
          - data
        nodes:
          - ex-metrics
          - ex-warehouse
          - ex-search
          - ex-documents
          - ex-semantic-view
          - ex-sql-compute
          - ex-index-compute
      - {kind: cloud, provider: snowflake, label: Snowflake, tier: [ops], nodes: [ex-trace]}

    layout2d:
      tiers: [{id: diagram, label: エージェントとデータ, z: 0, origin: [-4, 0], size: [30, 15]}]
      nodes:
        ex-agent: {tier: diagram, x: 1, y: 1}
        ex-identity: {tier: diagram, x: 4, y: 1}
        ex-metrics: {tier: diagram, x: 7, y: 1}
        ex-warehouse: {tier: diagram, x: 1, y: 4}
        ex-search: {tier: diagram, x: 4, y: 4}
        ex-documents: {tier: diagram, x: 7, y: 4}
        ex-trace: {tier: diagram, x: 1, y: 7}
        ex-semantic-view: {tier: diagram, x: 4, y: 7}
        ex-sql-compute: {tier: diagram, x: 7, y: 7}
        ex-index-compute: {tier: diagram, x: 1, y: 10}
        ex-question: {tier: diagram, x: -3, y: 1}
        ex-review: {tier: diagram, x: -1, y: 1}
        ex-logpolicy: {tier: diagram, x: 3, y: 1}
      groups:
        - {kind: cloud, provider: snowflake, label: Snowflake アカウント, tier: [diagram], x0: 0, y0: 0, x1: 12, y1: 13, nodes: [ex-agent, ex-identity, ex-metrics, ex-warehouse, ex-search, ex-documents, ex-trace, ex-semantic-view, ex-sql-compute, ex-index-compute]}
    layout3d:
      tiers:
        - {id: host, label: 実行基盤・公開サービス, z: 0, size: [12, 12]}
        - {id: apps, label: ホスト上の処理, z: 1, size: [12, 12]}
        - {id: other, label: 独立したツール・データ, z: 0, origin: [15, 0], size: [10, 10]}
        - {id: user, label: 利用者, z: 0, origin: [-5, 0], size: [4, 9]}
      nodes:
        ex-agent: {tier: host, x: 1, y: 1}
        ex-identity: {tier: host, x: 4, y: 1}
        ex-metrics: {tier: host, x: 7, y: 1}
        ex-warehouse: {tier: host, x: 1, y: 4}
        ex-search: {tier: host, x: 4, y: 4}
        ex-documents: {tier: host, x: 7, y: 4}
        ex-trace: {tier: host, x: 1, y: 7}
        ex-semantic-view: {tier: host, x: 4, y: 7}
        ex-sql-compute: {tier: host, x: 7, y: 7}
        ex-index-compute: {tier: host, x: 1, y: 10}
        ex-question: {tier: user, x: 1, y: 1}
        ex-review: {tier: user, x: 4, y: 1}
        ex-logpolicy: {tier: user, x: 7, y: 1}
      groups:
        - {kind: cloud, provider: snowflake, label: Snowflake アカウント, tier: [host, apps], nodes: [ex-agent, ex-identity, ex-metrics, ex-warehouse, ex-search, ex-documents, ex-trace, ex-semantic-view, ex-sql-compute, ex-index-compute]}
