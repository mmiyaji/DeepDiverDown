name: Snowflake Cortex Agents の分析と文書検索
description: Cortex Agent が指標と文書を扱い、認可と実行結果を確認する構成例。
reference:
  objectives:
    - 指標の問い合わせと文書検索の責務を区別する。
    - 認証・権限と回答の出典を追う。
    - エージェントの実行を観測し評価する。
  sources:
    - title: 公式資料 1
      url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents
    - title: 公式資料 2
      url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-search/cortex-search-agents
sources:
  - docs/reference-cortex-data-agent.md
evidence:
  - type: doc
    ref: docs/reference-cortex-data-agent.md#§1
tiers:
  - id: access
    label: 利用と調整
    z: 2
    size:
      - 12
      - 3
  - id: data
    label: 指標と文書
    z: 1
    size:
      - 14
      - 3
  - id: ops
    label: 運用と評価
    z: 0
    size:
      - 12
      - 3
nodes:
  question:
    label: 利用者
    kind: actor
    tier: access
    x: 0
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  agent:
    label: Cortex Agent
    kind: service
    tier: access
    x: 4
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  identity:
    label: 利用者の権限
    kind: service
    tier: access
    x: 8
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  metrics:
    label: Cortex Analyst
    kind: service
    tier: data
    x: 0
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  warehouse:
    label: Snowflake の分析テーブル
    kind: db
    tier: data
    x: 4
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  search:
    label: Cortex Search
    kind: service
    tier: data
    x: 8
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  documents:
    label: 検索対象の文書
    kind: db
    tier: data
    x: 12
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  trace:
    label: 実行の観測
    kind: service
    tier: ops
    x: 4
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  review:
    label: 評価担当
    kind: actor
    tier: ops
    x: 8
    'y': 1
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
links:
  - id: ask
    from: question
    to: agent
    label: 売上と返品理由を質問
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  - id: authorize
    from: agent
    to: identity
    label: 利用権限を確認
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  - id: query
    from: agent
    to: metrics
    label: 対象期間の指標を取得
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  - id: read
    from: metrics
    to: warehouse
    label: 注文と返品を集計
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  - id: retrieve
    from: agent
    to: search
    label: 関連文書を検索
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  - id: lookup
    from: search
    to: documents
    label: 出典と本文を取得
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  - id: record
    from: agent
    to: trace
    label: 実行と結果を記録
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  - id: evaluate
    from: review
    to: trace
    label: 実行を評価
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
  - id: answer
    from: agent
    to: question
    label: 数値と出典を回答
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
scenarios:
  - id: answer
    label: 売上と返品理由を調べる
    evidence:
      - type: doc
        ref: docs/reference-cortex-data-agent.md#§2
    steps:
      - links:
          - ask
          - authorize
        note: 質問を受け、利用者の権限を確認する。
      - links:
          - query
          - read
        note: 指標の定義に基づいて対象期間を集計する。
      - links:
          - retrieve
          - lookup
        note: 権限のある文書から関連する出典を取得する。
      - links:
          - record
          - answer
        note: 実行を記録し、数値と出典を付けて回答する。
      - links:
          - evaluate
        note: 数値と出典を評価する。
