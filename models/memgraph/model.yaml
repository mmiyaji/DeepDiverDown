name: Memgraph のインメモリグラフ DB 構成
description: Bolt と Cypher で受けたクエリを、メモリ上のグラフに実行し、WAL とスナップショットで永続化する。Kafka の取り込みとレプリケーションも示す。
reference:
  objectives: [クエリの受付・インメモリのグラフ・永続化の関係を確認する, ストレージモードの違いと制約を確認する, ストリーム取り込みとレプリケーション・HA の位置づけを確認する]
  sources:
    - {title: Memgraph overview, url: https://memgraph.com/docs/memgraph/overview}
    - {title: Storage memory usage, url: https://memgraph.com/docs/fundamentals/storage-memory-usage}
    - {title: Backup and restore, url: https://memgraph.com/docs/database-management/backup-and-restore}
    - {title: Replication, url: https://memgraph.com/docs/clustering/replication}
    - {title: High availability, url: https://memgraph.com/docs/clustering/high-availability}
    - {title: Data streams, url: https://memgraph.com/docs/data-streams}
    - {title: Client libraries, url: https://memgraph.com/docs/client-libraries}
sources: [docs/reference-memgraph.md]
evidence: [{type: doc, ref: docs/reference-memgraph.md#§1}]
tiers:
  - {id: flow, label: クライアント・Memgraph・永続化・複製, z: 0, size: [28, 11]}
nodes:
  client: {label: アプリケーション・クライアント, kind: client, tier: flow, x: 1, y: 3, description: Bolt のクライアントライブラリで接続し、Cypher を送る。, evidence: [{type: doc, ref: docs/reference-memgraph.md#§2}]}
  kafka: {label: Kafka・Redpanda・Pulsar, kind: external, tier: flow, x: 1, y: 8, description: ストリームの取り込み元。, evidence: [{type: doc, ref: docs/reference-memgraph.md#§5}]}
  query: {label: Bolt・Cypher のクエリ処理, kind: service, tier: flow, x: 8, y: 3, description: Bolt 1、4.0、4.1、4.3、5.2 に対応する。ポートは 7687。openCypher への準拠度は未確認。, evidence: [{type: doc, ref: docs/reference-memgraph.md#§2}]}
  stream: {label: ストリーム取り込み, kind: service, tier: flow, x: 8, y: 8, description: Python の変換モジュールでメッセージをクエリに変える。Kafka は at-least-once。, evidence: [{type: doc, ref: docs/reference-memgraph.md#§5}]}
  graph: {label: インメモリのグラフストレージ, kind: db, tier: flow, x: 14, y: 5.5, description: 既定は IN_MEMORY_TRANSACTIONAL。上限は --memory-limit で指定する。, evidence: [{type: doc, ref: docs/reference-memgraph.md#§3}]}
  durable: {label: WAL とスナップショット, kind: db, tier: flow, x: 20, y: 2, description: 定期スナップショットと WAL で永続化し、起動時にスナップショットから復旧する。WAL の設定項目は未確認。, evidence: [{type: doc, ref: docs/reference-memgraph.md#§4}]}
  disk: {label: オンディスクモード（RocksDB）, kind: db, tier: flow, x: 20, y: 5.5, description: RAM を超えるデータを置ける。実験的で、レプリケーションと HA に対応しない。, evidence: [{type: doc, ref: docs/reference-memgraph.md#§3}]}
  replica: {label: REPLICA, kind: service, tier: flow, x: 20, y: 9, description: MAIN から複製を受け、読み取りだけを受け付ける。モードは SYNC、ASYNC、STRICT_SYNC。, evidence: [{type: doc, ref: docs/reference-memgraph.md#§6}]}
  coord: {label: コーディネーター（HA）, kind: service, tier: flow, x: 26, y: 9, description: Enterprise 版。Raft に基づき自動フェイルオーバーを行う。内部動作は未確認。, evidence: [{type: doc, ref: docs/reference-memgraph.md#§6}]}
links:
  - {id: bolt-query, from: client, to: query, label: Cypher を送信, evidence: [{type: doc, ref: docs/reference-memgraph.md#§2}]}
  - {id: run-graph, from: query, to: graph, label: グラフを読み書き, evidence: [{type: doc, ref: docs/reference-memgraph.md#§3}]}
  - {id: consume, from: kafka, to: stream, label: メッセージを取り込み, evidence: [{type: doc, ref: docs/reference-memgraph.md#§5}]}
  - {id: stream-write, from: stream, to: graph, label: 変換して書き込み, evidence: [{type: doc, ref: docs/reference-memgraph.md#§5}]}
  - {id: persist, from: graph, to: durable, label: WAL・スナップショットを保存, evidence: [{type: doc, ref: docs/reference-memgraph.md#§4}]}
  - {id: spill, from: graph, to: disk, label: ディスクモードで保存, evidence: [{type: doc, ref: docs/reference-memgraph.md#§3}]}
  - {id: replicate, from: graph, to: replica, label: 変更を複製, evidence: [{type: doc, ref: docs/reference-memgraph.md#§6}]}
  - {id: failover, from: coord, to: replica, label: 昇格を指示, evidence: [{type: doc, ref: docs/reference-memgraph.md#§6}]}
scenarios:
  - id: query-and-persist
    label: クエリの実行と永続化
    evidence: [{type: doc, ref: docs/reference-memgraph.md#§4}]
    steps:
      - {links: [bolt-query, run-graph], note: クライアントが Bolt で Cypher を送り、メモリ上のグラフに実行する。}
      - {links: [persist], note: WAL と定期スナップショットをデータディレクトリに保存する。}
  - id: stream-ingest
    label: Kafka からの取り込みと複製
    evidence: [{type: doc, ref: docs/reference-memgraph.md#§5}]
    steps:
      - {links: [consume, stream-write], note: 変換モジュールがメッセージをクエリに変えて書き込む。}
      - {links: [replicate], note: 変更を REPLICA へ複製する。}
requirements:
  - {id: MG-01, kind: usecase, title: メモリ上のグラフに Cypher で問い合わせる, text: Bolt で接続し、メモリ上のグラフにクエリを実行する。更新は WAL とスナップショットで永続化する。, links: [bolt-query, run-graph, persist], evidence: [{type: doc, ref: docs/reference-memgraph.md#§4}]}
unknowns:
  - {id: UNK-01, text: openCypher への準拠度と Neo4j 公式ドライバーでの接続可否は公式資料で未確認。, refs: [query]}
  - {id: UNK-02, text: WAL の設定項目、SYNC・ASYNC・STRICT_SYNC の動作、コーディネーターの内部動作とポートは取得した資料に記載がなく未確認。, refs: [durable, replica, coord]}
gates: {maxDrift: 0, maxHigh: 0}
implementations:
  - id: self-managed-main-replica
    label: 自前サーバーの Memgraph MAIN・REPLICA と Kafka
    description: Kafka から取り込み、MAIN から REPLICA へ複製する自前構成の例。HA のコーディネーターは Enterprise 版。代表例であり、導入事例ではない。
    sources:
      - {title: Replication, url: https://memgraph.com/docs/clustering/replication}
      - {title: High availability, url: https://memgraph.com/docs/clustering/high-availability}
      - {title: Data streams, url: https://memgraph.com/docs/data-streams}
      - {title: Backup and restore, url: https://memgraph.com/docs/database-management/backup-and-restore}
    tiers:
      - {id: diagram, label: クライアント・Memgraph・複製, z: 0, size: [28, 12]}
    nodes:
      mg-app: {label: アプリケーション, kind: client, tier: diagram, x: 1, y: 3, realizes: [client], description: Bolt のクライアントライブラリで MAIN に接続する。, evidence: [{type: doc, ref: docs/reference-memgraph.md#§7}]}
      mg-kafka: {label: Kafka, kind: service, tier: diagram, x: 1, y: 8, realizes: [kafka], description: Memgraph のストリームの取り込み元。, management: {type: customer, scope: "Customer operates the Kafka cluster."}, evidence: [{type: doc, ref: docs/reference-memgraph.md#§7}]}
      mg-main: {label: Memgraph MAIN, kind: service, tier: diagram, x: 9, y: 5.5, realizes: [query, stream, graph, disk], description: クエリを受け、ストリームを取り込み、メモリ上のグラフを保持する。ストレージモードの選択も担う。, management: {type: customer, scope: "Customer operates the Memgraph instance and configuration."}, evidence: [{type: doc, ref: docs/reference-memgraph.md#§7}]}
      mg-data: {label: データディレクトリ（snapshots・wal）, kind: db, tier: diagram, x: 16, y: 2, realizes: [durable], description: スナップショットと WAL を保存する。, management: {type: customer, scope: "Customer operates the disk and backups."}, evidence: [{type: doc, ref: docs/reference-memgraph.md#§7}]}
      mg-replica: {label: Memgraph REPLICA, kind: service, tier: diagram, x: 16, y: 9, realizes: [replica], description: MAIN から複製を受け、読み取りを受け付ける。, management: {type: customer, scope: "Customer operates the replica instances."}, evidence: [{type: doc, ref: docs/reference-memgraph.md#§7}]}
      mg-coord: {label: コーディネーター（Enterprise）, kind: service, tier: diagram, x: 23, y: 9, realizes: [coord], description: Raft に基づき自動フェイルオーバーを行う。台数は未確認。, management: {type: customer, scope: "Customer operates the coordinators and license."}, evidence: [{type: doc, ref: docs/reference-memgraph.md#§7}]}
    links: []
    groups:
      - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [mg-kafka, mg-main, mg-data, mg-replica, mg-coord]}
    layout2d:
      tiers:
        - {id: diagram, label: クライアント・Memgraph・複製, z: 0, size: [28, 12]}
      nodes:
        mg-app: {tier: diagram, x: 1, y: 3}
        mg-kafka: {tier: diagram, x: 1, y: 8}
        mg-main: {tier: diagram, x: 9, y: 5.5}
        mg-data: {tier: diagram, x: 16, y: 2}
        mg-replica: {tier: diagram, x: 16, y: 9}
        mg-coord: {tier: diagram, x: 23, y: 9}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [mg-kafka, mg-main, mg-data, mg-replica, mg-coord]}
    layout3d:
      tiers:
        - {id: ingress, label: 入口, z: 0, size: [6, 12]}
        - {id: db, label: Memgraph と永続化, z: 0, origin: [8, 0], size: [10, 12]}
        - {id: ha, label: HA, z: 0, origin: [20, 0], size: [6, 12]}
      nodes:
        mg-app: {tier: ingress, x: 3, y: 3}
        mg-kafka: {tier: ingress, x: 3, y: 8}
        mg-main: {tier: db, x: 2, y: 5.5}
        mg-data: {tier: db, x: 7, y: 2}
        mg-replica: {tier: db, x: 7, y: 9}
        mg-coord: {tier: ha, x: 3, y: 9}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: [ingress, db, ha], nodes: [mg-kafka, mg-main, mg-data, mg-replica, mg-coord]}
