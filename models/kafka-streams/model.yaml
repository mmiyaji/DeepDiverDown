        - {kind: nodegroup, label: "Fargate タスク", tier: [task], nodes: [aws-ecs-msk-app, aws-ecs-msk-state]}
        - {kind: cluster, label: "MSK クラスター", provider: aws, tier: [msk], nodes: [aws-ecs-msk-source, aws-ecs-msk-sink, aws-ecs-msk-changelog]}
