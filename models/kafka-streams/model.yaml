name: Apache Kafka Streams の基本アーキテクチャ
description: Kafka Topic をアプリケーション内のトポロジーで処理し、状態ストアを changelog から復元する流れを追うリファレンスです。
reference:
  objectives:
    - Topic パーティション、Task、Processor Topology の関係を理解する。
    - 集計状態を Local State Store に保持する流れを追う。
    - changelog Topic による状態復元と Task 再配置を理解する。
  sources:
    - {title: Kafka Streams Architecture, url: "https://kafka.apache.org/44/streams/architecture/"}
sources: [docs/reference-kafka-streams.md]
evidence: [{type: doc, ref: "docs/reference-kafka-streams.md#§1"}]
tiers:
  - {id: app, label: Kafka 入力と Streams アプリケーション, kind: origin, z: 0, size: [14, 3]}
  - {id: durability, label: 状態と復旧, z: 1, origin: [0, 0], size: [14, 3]}
nodes:
  topic: {label: 入力ログ, kind: queue, tier: app, x: 0, 'y': 1.5, description: パーティション化された受注イベントを保持する。, evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§2}]}
  task: {parallel: 'N', label: 分割ごとの実行単位, kind: worker, tier: app, x: 4, 'y': 1.5, description: 入力パーティションを担当し、トポロジーを実行する。, evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§2}]}
  topology: {label: ストリームの処理グラフ, kind: service, tier: app, x: 7, 'y': 1.5, description: Source、変換、集計プロセッサの処理グラフ。, evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§3}]}
  state: {partitions: 3, label: ローカル状態ストア, kind: db, tier: app, x: 10, 'y': 2.7, description: Task ごとの集計状態を保持・照会する。, evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§4}]}
  output: {label: 出力ログ, kind: queue, tier: app, x: 13, 'y': 1.5, description: トポロジーが生成した結果を公開する。, evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§3}]}
  changelog: {label: 状態の変更ログ, kind: queue, tier: durability, x: 10, 'y': 1.5, description: 状態ストアの更新を複製して記録する。, evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§5}]}
links:
  - {id: consume, from: topic, to: task, label: パーティションを割り当て, evidence: [{type: doc, ref: "docs/reference-kafka-streams.md#§2"}]}
  - {id: process, from: task, to: topology, label: レコードを処理, evidence: [{type: doc, ref: "docs/reference-kafka-streams.md#§3"}]}
  - {id: update, from: topology, to: state, label: 集計状態を更新, evidence: [{type: doc, ref: "docs/reference-kafka-streams.md#§4"}]}
  - {id: produce, from: topology, to: output, label: 結果を発行, evidence: [{type: doc, ref: "docs/reference-kafka-streams.md#§3"}]}
  - {id: log, from: state, to: changelog, label: 状態更新を記録, evidence: [{type: doc, ref: "docs/reference-kafka-streams.md#§5"}]}
  - {id: restore, from: changelog, to: state, label: 状態を再生, evidence: [{type: doc, ref: "docs/reference-kafka-streams.md#§5"}]}
scenarios:
  - id: kafka-streams-state-recovery
    label: Topic から集計・状態復元
    evidence: [{type: doc, ref: "docs/reference-kafka-streams.md#§1"}, {type: doc, ref: "docs/reference-kafka-streams.md#§6"}, {type: doc, ref: "docs/reference-kafka-streams.md#§7"}]
    steps:
      - {links: [consume, process], note: Task が入力パーティションを受け持ち、トポロジーで処理する。}
      - {links: [update, produce], note: 集計状態を更新し、結果を Output Topic へ発行する。}
      - {links: [log], note: State Store の更新を changelog Topic に記録する。}
      - {links: [restore], note: Task 再配置時に changelog を再生して状態を復元する。}

implementations:
  - id: java-rocksdb
    label: "Kafka Streams JVM と RocksDB"
    description: "Kafka Streams を組み込んだ JVM アプリケーションを複数起動する例。分割・タスク・状態はアプリケーション ID の範囲で管理する。"
    sources:
      - {title: Kafka Streams Architecture, url: https://kafka.apache.org/44/streams/architecture/}
      - {title: Configuring a Streams Application, url: https://kafka.apache.org/44/streams/developer-guide/config-streams/}
    tiers:
      - {id: processing, label: データの処理と保存, z: 0, size: [14, 5]}
      - {id: setup, label: 実行に必要な設定・成果物, z: 1, size: [14, 3]}
    nodes:
      java-rocksdb-host: {label: 自前 Linux アプリホスト群, kind: host, tier: processing, x: 3, y: 0, description: 利用者が複数の JVM アプリを起動しローカルディスクを管理する。, evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§8}]}
      java-rocksdb-brokers: {label: 自前 Kafka ブローカーホスト群, kind: host, tier: processing, x: 8, y: 0, description: 利用者がブローカーとトピックを管理する。, evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§8}]}
      java-rocksdb-input: {label: Kafka 入力トピック, kind: queue, tier: processing, x: 1, y: 1.15, realizes: [topic], description: 注文イベントをパーティションに分ける。, evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§8}]}
      java-rocksdb-java: {label: Java アプリの Stream Task と Topology, kind: worker, tier: processing, x: 1, y: 3.65, realizes: [task, topology], description: 各 JVM 内のタスクが処理グラフを実行する。, evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§8}]}
      java-rocksdb-kv: {label: ローカルの RocksDB ストア, kind: db, tier: processing, x: 5, y: 1.15, realizes: [state], description: 永続ストアを使用し、担当タスクの集計状態を保持する。, evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§8}]}
      java-rocksdb-topics: {label: Kafka 出力トピックと内部 changelog トピック, kind: queue, tier: processing, x: 5, y: 3.65, realizes: [output, changelog], description: 結果と復旧用の状態変更を異なるトピックで保持する。, evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§8}]}
      java-rocksdb-config: {label: application.id と state.dir, kind: file, tier: setup, x: 1, y: 1.5, description: 同じアプリケーションの実行個体で ID を揃え、ローカル状態の保存先を設定する。, evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§8}]}
    links:
      - {id: java-rocksdb-host-run, from: java-rocksdb-host, to: java-rocksdb-java, label: JVM アプリを実行}
      - {id: java-rocksdb-host-state, from: java-rocksdb-host, to: java-rocksdb-kv, label: ローカルディスクを提供}
      - {id: java-rocksdb-brokers-input, from: java-rocksdb-brokers, to: java-rocksdb-input, label: 入力トピックを保持}
      - {id: java-rocksdb-brokers-topics, from: java-rocksdb-brokers, to: java-rocksdb-topics, label: 出力と変更ログを保持}
      - {id: java-rocksdb-config-connection, from: java-rocksdb-config, to: java-rocksdb-java, label: グループと状態ディレクトリーを設定}

    layout2d:
      tiers:
        - {id: diagram, label: 実装構成, z: 0, size: [27, 13]}
      nodes:
        java-rocksdb-host: {tier: diagram, x: 7, y: 2}
        java-rocksdb-java: {tier: diagram, x: 7, y: 6}
        java-rocksdb-kv: {tier: diagram, x: 12, y: 6}
        java-rocksdb-config: {tier: diagram, x: 7, y: 10}
        java-rocksdb-brokers: {tier: diagram, x: 19, y: 2}
        java-rocksdb-input: {tier: diagram, x: 17, y: 6}
        java-rocksdb-topics: {tier: diagram, x: 21, y: 6}
      groups:
        - {kind: cluster, label: "自前アプリホスト群", tier: [diagram], x0: 4.3, y0: -0.5, x1: 14.5, y1: 11.6, nodes: [java-rocksdb-host, java-rocksdb-java, java-rocksdb-kv, java-rocksdb-config]}
        - {kind: cluster, label: "自前 Kafka クラスター", tier: [diagram], x0: 15, y0: 0, x1: 23, y1: 8, nodes: [java-rocksdb-brokers, java-rocksdb-input, java-rocksdb-topics]}
    layout3d:
      tiers:
        - {id: hosts, label: 自前 Linux ホスト, z: 0, size: [12, 5]}
        - {id: app, label: Kafka Streams JVM, z: 1, size: [12, 5]}
        - {id: broker, label: 自前 Kafka, z: 0, origin: [16, 0], size: [8, 5]}
      nodes:
        java-rocksdb-host: {tier: hosts, x: 5, y: 2}
        java-rocksdb-java: {tier: app, x: 2, y: 2}
        java-rocksdb-kv: {tier: app, x: 6, y: 2}
        java-rocksdb-config: {tier: app, x: 10, y: 2}
        java-rocksdb-brokers: {tier: broker, x: 1, y: 2}
        java-rocksdb-input: {tier: broker, x: 5, y: 1}
        java-rocksdb-topics: {tier: broker, x: 5, y: 4}
      groups:
        - {kind: cluster, label: "自前アプリホスト群", tier: [hosts, app], nodes: [java-rocksdb-host, java-rocksdb-java, java-rocksdb-kv, java-rocksdb-config]}
        - {kind: cluster, label: "自前 Kafka クラスター", tier: [broker], nodes: [java-rocksdb-brokers, java-rocksdb-input, java-rocksdb-topics]}

  - id: aws-ecs-msk
    label: "Amazon ECS on Fargate と Amazon MSK"
    description: "Kafka Streams を組み込んだ Java コンテナを Amazon ECS のサービスとして Fargate で実行する例。Amazon MSK が入力、出力、状態変更ログを保持する。"
    sources:
      - {title: "ECS on Fargate のタスク定義", url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-tasks-services.html}
      - {title: "Fargate タスクの一時ストレージ", url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-task-storage.html}
      - {title: "Fargate サービスタスクの置き換え", url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-maintenance.html}
      - {title: "MSK クライアントのアクセス", url: https://docs.aws.amazon.com/msk/latest/developerguide/client-access.html}
      - {title: "Kafka Streams Architecture", url: https://kafka.apache.org/44/streams/architecture/}
    tiers:
      - {id: entry, label: 投入元, kind: origin, z: 1, origin: [-5, 0], size: [3, 4]}
      - {id: runtime, label: 管理と実行, z: 1, size: [17, 7]}
      - {id: data, label: データと復旧, z: 0, size: [17, 5]}
    groups:
      - {kind: cloud, label: "AWS アカウント", provider: aws, tier: [runtime, data], nodes: [aws-ecs-msk-ecs, aws-ecs-msk-app, aws-ecs-msk-state, aws-ecs-msk-source, aws-ecs-msk-sink, aws-ecs-msk-changelog]}
      - {kind: vpc, label: "ECS タスクと MSK の VPC", provider: aws, tier: [runtime, data], nodes: [aws-ecs-msk-app, aws-ecs-msk-state, aws-ecs-msk-source, aws-ecs-msk-sink, aws-ecs-msk-changelog]}
    nodes:
      aws-ecs-msk-cli: {label: "デプロイ担当", kind: client, tier: entry, x: 1, y: 1.5, description: "ECS のタスク定義とサービスを更新する。", evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§9}]}
      aws-ecs-msk-ecs: {label: "ECS サービス", kind: scheduler, tier: runtime, x: 2, y: 1.1, svc: ecs, description: "Fargate 上のコンテナの希望数を維持し、停止したタスクを置き換える。", management: {type: shared, scope: "AWS が ECS 制御基盤を運用し、利用者がサービスと希望数を設定する。"}, evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§9}]}
      aws-ecs-msk-app: {label: "Fargate 上の Kafka Streams アプリ", kind: worker, tier: runtime, x: 7, y: 4, svc: fargate, realizes: [task, topology], parallel: N, description: "ECS タスク内の JVM が担当パーティションを処理する。", management: {type: shared, scope: "AWS が Fargate 実行基盤を運用し、利用者がコンテナとタスク定義を管理する。"}, evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§9}]}
      aws-ecs-msk-state: {label: "タスク内の RocksDB", kind: db, tier: runtime, x: 13, y: 4, realizes: [state], description: "state.dir をタスクの一時ストレージに置く。", management: {type: customer, scope: "利用者が state.dir と必要容量を設定し、アプリが状態を管理する。"}, evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§9}]}
      aws-ecs-msk-source: {label: "MSK 入力トピック", kind: queue, tier: data, x: 2, y: 1.5, svc: msk, realizes: [topic], description: "注文イベントをパーティションに分割する。", management: {type: shared, scope: "AWS が MSK 基盤を運用し、利用者がトピックと権限を管理する。"}, evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§9}]}
      aws-ecs-msk-sink: {label: "MSK 出力トピック", kind: queue, tier: data, x: 8, y: 1.5, svc: msk, realizes: [output], description: "窓集計など、処理したレコードを公開する。", management: {type: shared, scope: "AWS が MSK 基盤を運用し、利用者がトピックと権限を管理する。"}, evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§9}]}
      aws-ecs-msk-changelog: {label: "MSK changelog", kind: queue, tier: data, x: 14, y: 1.5, svc: msk, realizes: [changelog], description: "Kafka Streams が書き込む状態変更を保持する。", management: {type: shared, scope: "AWS が MSK 基盤を運用し、利用者が内部トピックの権限を管理する。"}, evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§9}]}
    links:
      - {id: aws-ecs-msk-deploy, from: aws-ecs-msk-cli, to: aws-ecs-msk-ecs, label: "タスク定義とサービスを更新", evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§9}]}
      - {id: aws-ecs-msk-launch, from: aws-ecs-msk-ecs, to: aws-ecs-msk-app, label: "コンテナを起動・置換", evidence: [{type: doc, ref: docs/reference-kafka-streams.md#§9}]}

    layout2d:
      tiers:
        - {id: diagram, label: 実装構成, z: 0, size: [27, 13]}
      nodes:
        aws-ecs-msk-cli: {tier: diagram, x: 1, y: 2}
        aws-ecs-msk-ecs: {tier: diagram, x: 6, y: 2}
        aws-ecs-msk-app: {tier: diagram, x: 11, y: 5}
        aws-ecs-msk-state: {tier: diagram, x: 11, y: 9}
        aws-ecs-msk-source: {tier: diagram, x: 19, y: 3}
        aws-ecs-msk-sink: {tier: diagram, x: 19, y: 6}
        aws-ecs-msk-changelog: {tier: diagram, x: 19, y: 9}
      groups:
        - {kind: cloud, label: "AWS アカウント", provider: aws, tier: [diagram], x0: 4, y0: 0, x1: 23, y1: 11, nodes: [aws-ecs-msk-ecs, aws-ecs-msk-app, aws-ecs-msk-state, aws-ecs-msk-source, aws-ecs-msk-sink, aws-ecs-msk-changelog]}
        - {kind: vpc, label: "タスクと MSK の利用者 VPC", provider: aws, tier: [diagram], x0: 8.3, y0: 0.5, x1: 22.5, y1: 10.6, nodes: [aws-ecs-msk-app, aws-ecs-msk-state, aws-ecs-msk-source, aws-ecs-msk-sink, aws-ecs-msk-changelog]}
        - {kind: nodegroup, label: "Fargate タスク", tier: [diagram], x0: 8.6, y0: 2.8, x1: 13.5, y1: 10.5, nodes: [aws-ecs-msk-app, aws-ecs-msk-state]}
    layout3d:
      tiers:
        - {id: entry, label: デプロイ担当, kind: origin, z: 0, origin: [-5, 0], size: [3, 5]}
        - {id: control, label: ECS サービス, z: 0, size: [3, 5]}
        - {id: task, label: Fargate タスク, z: 0, origin: [6, 0], size: [9, 5]}
        - {id: msk, label: MSK クラスター, z: 0, origin: [19, 0], size: [8, 5]}
      nodes:
        aws-ecs-msk-cli: {tier: entry, x: 1, y: 2}
