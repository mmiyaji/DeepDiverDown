blocks:
  - id: detail-map
    title: セル ID と階層・集計
    note: セル ID は架空の短縮表記です。解像度間の地理的な包含は近似です。
    hint: 項目を選ぶと説明を表示します。処理の流れに合わせて関連する項目を強調します。
    lanes:
      - id: points
        label: 入力点
        node: coord
      - id: cells
        label: 同解像度のセル
        node: cell
      - id: parents
        label: 階層・集計
        node: parent
    items:
      points:
        - id: p1
          label: 点 A
          k: 0
          note: 緯度・経度の例。
        - id: p2
          label: 点 B
          k: 1
          note: 別の入力点の例。
      cells:
        - id: h1
          label: セル X
          k: 0
          note: 点 A を解像度付きのセルに変換した例。
        - id: h2
          label: セル Y
          k: 1
          note: 点 B を同じ解像度のセルに変換した例。
      parents:
        - id: p
          label: 親セル
          k: 2
          note: 親子関係は論理的な階層。地理的包含は近似。
        - id: count
          label: 件数
          k: 3
          note: 同じ解像度のセルをキーに集計した結果。
