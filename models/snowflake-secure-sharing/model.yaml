name: "Snowflake Secure Data Sharing の公開と失効"
description: "同一リージョンのアカウント間で限定した注文情報を共有し、提供者と受領者の責任を分ける。"
parent: {"model":"snowflake","node":"sharing"}
reference:
  objectives:
    - "基表、共有用の secure view、share、受領側の読み取り専用データベースを区別する。"
    - "権限の失効で止まるアクセスと、すでに取得した結果の扱いを区別する。"
  sources:
    - {"title":"Secure Data Sharing の概念","url":"https://docs.snowflake.com/en/user-guide/data-sharing-intro"}
    - {"title":"共有用の secure object","url":"https://docs.snowflake.com/en/user-guide/data-sharing-secure-views"}
sources: ["docs/reference-snowflake-secure-sharing.md"]
evidence: [{"type":"doc","ref":"docs/reference-snowflake-secure-sharing.md#§1"}]
tiers:
  - {"id":"flow","label":"構成と処理の流れ","z":0,"size":[14.5,3.5]}
nodes:
  provider: {"label":"提供側の管理者","kind":"actor","tier":"flow","x":0,"y":0,"description":"公開先を決める。","evidence":[{"type":"doc","ref":"docs/reference-snowflake-secure-sharing.md#§1"}]}
  orders: {"label":"提供側の注文集計","kind":"db","tier":"flow","x":0,"y":3,"description":"提供元のデータ。","evidence":[{"type":"doc","ref":"docs/reference-snowflake-secure-sharing.md#§2"}]}
  view: {"label":"共有用 secure view","kind":"db","tier":"flow","x":4,"y":3,"description":"行・列を公開用に投影。","evidence":[{"type":"doc","ref":"docs/reference-snowflake-secure-sharing.md#§2"}]}
  share: {"label":"Share","kind":"service","tier":"flow","x":7,"y":1,"description":"対象オブジェクト、権限と受領者。","evidence":[{"type":"doc","ref":"docs/reference-snowflake-secure-sharing.md#§2"}]}
  imported: {"label":"受領側の読み取り専用 DB","kind":"db","tier":"flow","x":10,"y":3,"description":"Share から作る参照口。","evidence":[{"type":"doc","ref":"docs/reference-snowflake-secure-sharing.md#§3"}]}
  consumer: {"label":"受領側のウェアハウス","kind":"worker","tier":"flow","x":14,"y":3,"description":"受領側が実行する分析。","evidence":[{"type":"doc","ref":"docs/reference-snowflake-secure-sharing.md#§3"}]}
  revoke: {"label":"共有の取り消し","kind":"service","tier":"flow","x":10,"y":0,"description":"対象オブジェクトまたは受領者へのアクセスを失効。","evidence":[{"type":"doc","ref":"docs/reference-snowflake-secure-sharing.md#§4"}]}
links:
  - {"id":"prepare","from":"orders","to":"view","label":"共有可能な行・列を選ぶ","evidence":[{"type":"doc","ref":"docs/reference-snowflake-secure-sharing.md#§2"}]}
  - {"id":"grant","from":"view","to":"share","label":"参照権限を付与","evidence":[{"type":"doc","ref":"docs/reference-snowflake-secure-sharing.md#§2"}]}
  - {"id":"publish","from":"provider","to":"share","label":"受領するアカウントを指定","evidence":[{"type":"doc","ref":"docs/reference-snowflake-secure-sharing.md#§2"}]}
  - {"id":"import","from":"share","to":"imported","label":"共有を読み取り専用 DB として利用","evidence":[{"type":"doc","ref":"docs/reference-snowflake-secure-sharing.md#§3"}]}
  - {"id":"query","from":"consumer","to":"imported","label":"受領側でクエリ","evidence":[{"type":"doc","ref":"docs/reference-snowflake-secure-sharing.md#§3"}]}
  - {"id":"resolve","from":"imported","to":"view","label":"提供側の共有ビューを読む","evidence":[{"type":"doc","ref":"docs/reference-snowflake-secure-sharing.md#§3"}]}
  - {"id":"revoke","from":"provider","to":"revoke","label":"共有アクセスを取り消し","evidence":[{"type":"doc","ref":"docs/reference-snowflake-secure-sharing.md#§4"}]}
  - {"id":"effect","from":"revoke","to":"share","label":"将来の参照を制限","evidence":[{"type":"doc","ref":"docs/reference-snowflake-secure-sharing.md#§4"}]}
scenarios:
  - id: publish
    label: "限定ビューを共有して分析する"
    evidence: [{"type":"doc","ref":"docs/reference-snowflake-secure-sharing.md#§3"}]
    steps:
      - {"links":["prepare","grant","publish"],"note":"公開用ビューと権限を定義し、受領アカウントを指定する。"}
      - {"links":["import"],"note":"受領側から共有を参照するデータベースを作る。"}
      - {"links":["query","resolve"],"note":"受領側ウェアハウスが、許可されたデータを読む。"}
  - id: stop-sharing
    label: "共有契約の終了"
    evidence: [{"type":"doc","ref":"docs/reference-snowflake-secure-sharing.md#§4"}]
    steps:
      - {"links":["query","resolve"],"note":"終了前に公開対象と利用状況を確認する。"}
      - {"links":["revoke","effect"],"note":"対象の共有を取り消し、以後のクエリを制限する。"}
