name: RisingWave の基本アーキテクチャ
description: Frontend・Compute・Meta・Compactor の役割と、Hummock（オブジェクトストレージ上の LSM）、Source・Table・マテリアライズドビュー・Sink の関係。
reference:
  objectives:
    - Frontend・Compute（Streaming）・Meta・Compactor の役割を区別する。
    - 状態とマテリアライズドビューが Hummock を通じてオブジェクトストレージに置かれ、メタデータは meta store に置かれることを説明する。
    - Source・Table・マテリアライズドビュー・Sink のうち、どれが RisingWave 内にデータを持つかを区別する。
  sources:
    - title: RisingWave · Architecture
      url: https://docs.risingwave.com/get-started/architecture
    - title: RisingWave · What is RisingWave
      url: https://docs.risingwave.com/get-started/intro
    - title: RisingWave · Source, Table, MV, and Sink
      url: https://docs.risingwave.com/get-started/source-table-mv-sink
    - title: RisingWave · Key concepts
      url: https://docs.risingwave.com/reference/key-concepts
    - title: RisingWave · Storage overview
      url: https://docs.risingwave.com/store/overview
    - title: RisingWave · Deploy on Kubernetes
      url: https://docs.risingwave.com/deploy/risingwave-kubernetes
    - title: RisingWave · Docker Compose
      url: https://docs.risingwave.com/deploy/risingwave-docker-compose
    - title: RisingWave · Hardware requirements
      url: https://docs.risingwave.com/deploy/hardware-requirements
sources:
  - docs/reference-risingwave.md
evidence:
  - type: doc
    ref: docs/reference-risingwave.md#§1
  - type: doc
    ref: docs/reference-risingwave.md#§6
tiers:
  - id: flow
    label: データの流れとノード
    z: 0
    size:
      - 24
      - 10
nodes:
  client:
    label: SQL クライアント
    kind: client
    tier: flow
    x: 0
    'y': 1.5
    replicas: 2
    description: PostgreSQL プロトコルで Frontend に接続し、SQL を送って結果を読む。
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§2
  frontend:
    label: Frontend（Serving Node）
    kind: service
    tier: flow
    x: 5.5
    'y': 1.5
    parallel: 'N'
    description: ステートレスな PostgreSQL 互換ノード。SQL を解析・最適化し、バッチクエリを実行し、ストリーミングジョブの計画を Meta へ渡す。
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§2
  meta:
    label: Meta
    kind: scheduler
    tier: flow
    x: 11
    'y': 1.5
    replicas: 2
    description: カタログの管理、ストリーミングジョブの配置、Barrier と checkpoint の起動、障害時の復旧、コンパクションタスクの生成を担う。
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§2
      - type: doc
        ref: docs/reference-risingwave.md#§5
  metastore:
    label: meta store
    kind: db
    tier: flow
    x: 17
    'y': 1.5
    description: Meta がメタデータを保存する先。PostgreSQL・MySQL・SQLite を選べる。
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§3
  source:
    label: Source（Kafka・CDC など）
    kind: external
    tier: flow
    x: 0
    'y': 5
    description: RisingWave が読む外部のデータ源。CREATE SOURCE は接続の定義だけで、RisingWave 内にデータを持たない。
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§4
  compute:
    label: Compute（Streaming Node）
    kind: worker
    tier: flow
    x: 5.5
    'y': 5
    parallel: 'N'
    description: Actor としてストリームグラフを実行し、集約・結合などの状態を保つ。既定は Streaming と Serving の両方を担う。
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§2
      - type: doc
        ref: docs/reference-risingwave.md#§5
  mv:
    label: マテリアライズドビュー・Table
    kind: table
    tier: flow
    x: 11
    'y': 5
    description: 結果を RisingWave 内に保持し、入力の変化に合わせて更新される。SELECT で読める。
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§4
  hummock:
    label: Hummock（オブジェクトストレージ）
    kind: db
    tier: flow
    x: 17
    'y': 5
    description: Table・マテリアライズドビュー・ストリーム処理の状態を持つ行ベースの LSM ストレージ。永続コピーはオブジェクトストレージに置く。
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§3
  compactor:
    label: Compactor
    kind: worker
    tier: flow
    x: 17
    'y': 8.5
    parallel: 'N'
    description: Meta が割り当てたタスクで LSM を整理し、読み取りを速くして領域を回収する。
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§2
      - type: doc
        ref: docs/reference-risingwave.md#§3
  sink:
    label: Sink
    kind: external
    tier: flow
    x: 5.5
    'y': 8.5
    description: 処理結果を Kafka・Iceberg・PostgreSQL などの外部へ継続的に配信する。RisingWave 内にデータは残さない。
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§4
links:
  - id: query
    from: client
    to: frontend
    label: SQL を送る
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§5
  - id: plan
    from: frontend
    to: meta
    label: ストリーミング計画を渡す
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§5
  - id: place
    from: meta
    to: compute
    label: Actor を配置し Barrier を注入
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§5
  - id: batch
    from: frontend
    to: compute
    label: バッチクエリを実行
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§5
  - id: ingest
    from: source
    to: compute
    label: イベントを取り込む
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§5
  - id: update
    from: compute
    to: mv
    label: 結果を更新
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§4
      - type: doc
        ref: docs/reference-risingwave.md#§5
  - id: persist
    from: mv
    to: hummock
    label: 状態と結果を保存
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§3
      - type: doc
        ref: docs/reference-risingwave.md#§5
  - id: catalog
    from: meta
    to: metastore
    label: メタデータを保存
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§3
  - id: task
    from: meta
    to: compactor
    label: コンパクションタスクを割り当て
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§5
  - id: compact
    from: compactor
    to: hummock
    label: SST を整理
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§3
      - type: doc
        ref: docs/reference-risingwave.md#§5
  - id: deliver
    from: compute
    to: sink
    label: 結果を配信
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§4
scenarios:
  - id: flow
    label: イベントが結果として読めるまで
    evidence:
      - type: doc
        ref: docs/reference-risingwave.md#§5
    steps:
      - links:
          - query
          - plan
        note: CREATE MATERIALIZED VIEW を Frontend が計画し、フラグメント化した計画を Meta へ渡す。
      - links:
          - place
        note: Meta が Actor を Compute に割り当て、Barrier を注入する。
      - links:
          - ingest
          - update
        note: Source のイベントを Compute が取り込み、差分でビューを更新する。
      - links:
          - persist
          - catalog
        note: 状態と結果は checkpoint で Hummock に、メタデータは meta store に保存される。
      - links:
          - task
          - compact
        note: Meta がタスクを作り、Compactor が SST を整理する。
      - links:
          - batch
          - deliver
        note: SELECT は Frontend のバッチ実行で読み、Sink は結果を外部へ配信する。
unknowns:
  - id: UNK-01
    text: Meta の冗長化と切り替えの仕組みは確認した資料に記載がない。ハードウェア要件の資料は Meta を 2 台（主・副）にする推奨を述べるが、切り替え手順は未確認。
    refs:
      - meta
  - id: UNK-02
    text: meta store に etcd を使えるかは、Kubernetes・Docker の手順では言及がなく、メタバックアップの手順に etcd の記述がある。版による違いは未確認。
    refs:
      - metastore
  - id: UNK-03
    text: 実装例の台数・ノードサイズ・ネットワーク経路・RisingWave と EKS のバージョン互換性は資料で指定されていない。RDS を meta store に使う動作も資料に記載がなく未検証。
    refs:
      - compute
      - metastore
gates:
  maxDrift: 0
  maxHigh: 6
implementations:
  - id: aws-eks
    label: EKS 上の RisingWave・S3・RDS for PostgreSQL
    description: EKS の EC2 ノード上に RisingWave の Frontend・Meta・Compute・Compactor の Pod を置き、S3 を state store、RDS for PostgreSQL を meta store にする構成例。
    sources:
      - title: RisingWave · Architecture
        url: https://docs.risingwave.com/get-started/architecture
      - title: RisingWave · Storage overview
        url: https://docs.risingwave.com/store/overview
      - title: RisingWave · Source, Table, MV, and Sink
        url: https://docs.risingwave.com/get-started/source-table-mv-sink
      - title: RisingWave · Deploy on Kubernetes
        url: https://docs.risingwave.com/deploy/risingwave-kubernetes
      - title: RisingWave · Hardware requirements
        url: https://docs.risingwave.com/deploy/hardware-requirements
      - title: Amazon EKS managed node groups
        url: https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html
      - title: IAM roles for service accounts
        url: https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html
      - title: Amazon RDS for PostgreSQL
        url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_PostgreSQL.html
    tiers:
      - id: entry
        label: 利用者・外部システム
        kind: origin
        z: 2
        size:
          - 18
          - 3
      - id: control-plane
        label: AWS の管理・認証
        z: 1
        size:
          - 18
          - 3
      - id: processing
        label: EKS の RisingWave 実行
        z: 0
        size:
          - 18
          - 3
      - id: storage
        label: 状態とメタデータの保存
        z: -1
        size:
          - 18
          - 3
    nodes:
      rw-aws-client:
        label: psql などの SQL クライアント
        kind: client
        tier: entry
        x: 1
        'y': 1.5
        realizes:
          - client
        description: PostgreSQL プロトコルで Frontend に接続する。公開方式は Service の種類（ClusterIP・NodePort・LoadBalancer）で選ぶ。
        evidence:
          - type: doc
            ref: docs/reference-risingwave.md#§7
      rw-aws-kafka:
        label: Apache Kafka（実行場所は未選定）
        kind: external
        tier: entry
        x: 5
        'y': 1.5
        realizes:
          - source
        description: RisingWave の資料は Kafka の提供元を指定しない。Amazon MSK など実行場所は利用者が選ぶ（未確認）。
        evidence:
          - type: doc
            ref: docs/reference-risingwave.md#§7
      rw-aws-downstream:
        label: 出力先（Kafka・Iceberg・PostgreSQL など）
        kind: external
        tier: entry
        x: 9
        'y': 1.5
        realizes:
          - sink
        description: Sink の配信先。実行場所は選んだ出力先による。
        evidence:
          - type: doc
            ref: docs/reference-risingwave.md#§7
      rw-aws-eks:
        label: Amazon EKS / Kubernetes API
        svc: eks
        kind: service
        tier: control-plane
        x: 3
        'y': 1.5
        description: Kubernetes の制御プレーン。RisingWave Operator のカスタムリソースと Pod の配置を管理する。
        management:
          type: shared
          scope: AWS が制御プレーンを運用し、利用者が Kubernetes API、Operator、クラスタ設定を操作する。
        evidence:
          - type: doc
            ref: docs/reference-risingwave.md#§7
      rw-aws-iam:
        label: IAM / サービスアカウント用ロール
        svc: iam
        kind: policy
        tier: control-plane
        x: 9
        'y': 1.5
        description: state store の useServiceAccount を使い S3 へ届くための権限。必要な権限の一覧は資料で確認していない。
        management:
          type: customer
          scope: 利用者がサービスアカウントと IAM ロール・ポリシーを設定する。
        evidence:
          - type: doc
            ref: docs/reference-risingwave.md#§7
      rw-aws-ec2:
        label: EC2 / EKS ノードグループ
        svc: ec2
        kind: host
        tier: processing
        x: 15
        'y': 1.5
        description: マネージドノードグループの EC2 が RisingWave の Pod を実行する。
        management:
          type: shared
          scope: AWS が EC2 基盤を運用し、利用者がノードグループ、台数、更新を管理する。
        evidence:
          - type: doc
            ref: docs/reference-risingwave.md#§7
      rw-aws-frontend:
        label: Frontend Pod
        kind: service
        tier: processing
        x: 1
        'y': 1.5
        parallel: 'N'
        realizes:
          - frontend
        description: SQL を受けて計画する。
        management:
          type: customer
          scope: 利用者が RisingWave の配置・設定・容量・更新を管理する。
        evidence:
          - type: doc
            ref: docs/reference-risingwave.md#§7
      rw-aws-meta:
        label: Meta Pod
        kind: service
        tier: processing
        x: 5
        'y': 1.5
        realizes:
          - meta
        description: メタデータ、ジョブ配置、Barrier、コンパクションタスクを管理する。
        management:
          type: customer
          scope: 利用者が RisingWave の配置・設定・容量・更新を管理する。
        evidence:
          - type: doc
            ref: docs/reference-risingwave.md#§7
      rw-aws-compute:
        label: Compute Pod
        kind: worker
        tier: processing
        x: 9
        'y': 1.5
        parallel: 'N'
        realizes:
          - compute
          - mv
        description: Actor を実行し、状態とマテリアライズドビューを保持する。
        management:
          type: customer
          scope: 利用者が RisingWave の配置・設定・容量・更新を管理する。
        evidence:
          - type: doc
            ref: docs/reference-risingwave.md#§7
      rw-aws-compactor:
        label: Compactor Pod
        kind: worker
        tier: processing
        x: 13
        'y': 1.5
        parallel: 'N'
        realizes:
          - compactor
        description: コンパクションタスクを実行する。CPU 負荷が中心。
        management:
          type: customer
          scope: 利用者が RisingWave の配置・設定・容量・更新を管理する。
        evidence:
          - type: doc
            ref: docs/reference-risingwave.md#§7
      rw-aws-s3:
        label: Amazon S3（Hummock の state store）
        svc: s3
        kind: db
        tier: storage
        x: 9
        'y': 1.5
        realizes:
          - hummock
        description: state store。spec.stateStore の s3 にバケット・リージョンを指定し、useServiceAccount で認証できる。dataDirectory は既定 hummock。
        management:
          type: shared
          scope: AWS が S3 基盤を運用し、利用者がバケット、権限、データを管理する。
        evidence:
          - type: doc
            ref: docs/reference-risingwave.md#§7
      rw-aws-rds:
        label: RDS for PostgreSQL（meta store）
        svc: rds
        kind: db
        tier: storage
        x: 3
        'y': 1.5
        realizes:
          - metastore
        description: Meta のメタデータ保存先。meta store に PostgreSQL を使う例で、RDS を選ぶことは RisingWave の資料に記載がない（未確認）。
        management:
          type: shared
          scope: AWS がデータベース基盤を運用し、利用者がスキーマ、接続、バックアップ設定を管理する。
        evidence:
          - type: doc
            ref: docs/reference-risingwave.md#§7
    links:
      - id: rw-aws-eks-ec2
        from: rw-aws-eks
        to: rw-aws-ec2
        label: ノードグループに Pod を配置
        evidence:
          - type: doc
            ref: docs/reference-risingwave.md#§7
      - id: rw-aws-ec2-fe
        from: rw-aws-ec2
        to: rw-aws-frontend
        label: Pod を実行
        evidence:
          - type: doc
            ref: docs/reference-risingwave.md#§7
      - id: rw-aws-ec2-meta
        from: rw-aws-ec2
        to: rw-aws-meta
        label: Pod を実行
        evidence:
          - type: doc
            ref: docs/reference-risingwave.md#§7
      - id: rw-aws-ec2-cn
        from: rw-aws-ec2
        to: rw-aws-compute
        label: Pod を実行
        evidence:
          - type: doc
            ref: docs/reference-risingwave.md#§7
      - id: rw-aws-ec2-cp
        from: rw-aws-ec2
        to: rw-aws-compactor
        label: Pod を実行
        evidence:
          - type: doc
            ref: docs/reference-risingwave.md#§7
      - id: rw-aws-iam-cn
        from: rw-aws-iam
        to: rw-aws-compute
        label: S3 アクセス権を付与
        evidence:
          - type: doc
            ref: docs/reference-risingwave.md#§7
      - id: rw-aws-iam-cp
        from: rw-aws-iam
        to: rw-aws-compactor
        label: S3 アクセス権を付与
        evidence:
          - type: doc
            ref: docs/reference-risingwave.md#§7
    groups:
      - kind: cloud
        label: AWS アカウント
        provider: aws
        tier:
          - control-plane
          - processing
          - storage
        nodes:
          - rw-aws-eks
