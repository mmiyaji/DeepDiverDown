        ex-sql: {tier: dbx, x: 1, y: 1}
        ex-warehouse: {tier: dbx, x: 4, y: 1}
        ex-search: {tier: dbx, x: 7, y: 1}
        ex-index: {tier: dbx, x: 1, y: 4}
        ex-documents: {tier: dbx, x: 4, y: 4}
        ex-question: {tier: users, x: 1, y: 1}
        ex-review: {tier: users, x: 1, y: 4}
        ex-logpolicy: {tier: users, x: 1, y: 7}
      groups:
        - {kind: cloud, provider: aws, label: 顧客 AWS アカウント, tier: [runtime, app, aws], nodes: [ex-fargate, ex-agent, ex-identity, ex-trace, ex-ecs, ex-cognito, ex-cloudwatch]}
        - {kind: cloud, label: dbt platform, tier: [dbt], nodes: [ex-metrics]}
        - {kind: cloud, provider: databricks, label: Databricks ワークスペース, tier: [dbx], nodes: [ex-sql, ex-warehouse, ex-search, ex-index, ex-documents]}
