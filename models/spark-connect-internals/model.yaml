          x1: 29.5
          y1: 15.8
          nodes: [ex-plan, ex-proxy, ex-server, ex-executor, ex-result, ex-cluster]
        - kind: cluster
          label: Spark Standalone クラスター
          tier:
            - diagram
          x0: 9
