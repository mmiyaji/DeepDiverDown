            ref: docs/reference-data-catalog-architecture.md#§8
      uc-on-aws-external-client:
        label: 外部 Iceberg クライアント
        kind: client
        tier: runtime
        x: 0
        y: 1
        description: Unity Catalog の Iceberg REST 入口を介して対象テーブルにアクセスする。
        evidence:
          - type: doc
            ref: docs/reference-data-catalog-architecture.md#§8
      uc-on-aws-uc:
        label: Databricks Unity Catalog
        kind: catalog
        tier: runtime
        x: 8
        'y': 1
        description: REST インターフェース、ワークスペース内のリネージ、検索、権限申請を提供する。
        realizes:
          - technical
