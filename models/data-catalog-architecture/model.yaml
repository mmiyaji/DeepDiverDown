        kind: actor
        tier: actors
        x: 13
        'y': 1
        description: Catalog Explorer で資産を探し、必要な権限を申請する。
        realizes:
          - consumer
        evidence:
          - type: doc
            ref: docs/reference-data-catalog-architecture.md#§8
      uc-on-aws-compute:
        label: Databricks Jobs サーバーレス コンピュート
