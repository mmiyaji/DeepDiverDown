name: K3s の基本アーキテクチャ
description: 選択した単一 server + agent トポロジーで、注文 API の投入、Service 経由のアクセス、agent 障害後の再調整を追います。
reference:
  objectives:
    - K3s server と agent の責務と構成差を区別する。
    - server の API を通じて注文 API Pod を agent で起動する流れを追う。
    - agent 障害時に server 側の制御が扱う再調整経路を理解する。
  sources:
    - {title: K3s Architecture, url: "https://docs.k3s.io/architecture"}
    - {title: Kubernetes Deployments, url: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"}
    - {title: Kubernetes Service, url: "https://kubernetes.io/docs/concepts/services-networking/service/"}
    - {title: Kubernetes Workloads, url: "https://kubernetes.io/docs/concepts/workloads/"}
sources: [docs/reference-k3s.md]
evidence:
  - {type: doc, ref: "docs/reference-k3s.md#§1"}
  - {type: doc, ref: "docs/reference-k3s.md#§2"}
  - {type: doc, ref: "docs/reference-k3s.md#§3"}
  - {type: doc, ref: "docs/reference-k3s.md#§4"}
  - {type: doc, ref: "docs/reference-k3s.md#§5"}
tiers:
  - {id: client, label: 利用者, kind: origin, z: 1, origin: [-4, 0], size: [2.5, 3]}
  - {id: server, label: K3s server, z: 1, size: [8, 3]}
  - {id: agent, label: K3s agent, z: 0, size: [8, 3]}
  - {id: network, label: Service ネットワーク, z: 0, origin: [9, 0], size: [3, 3]}
nodes:
  kubectl:
    {label: 構成の投入クライアント, kind: client, tier: client, x: 0, 'y': 1.5, description: K3s API を通じて注文 API のリソースを操作する。, evidence: [{type: doc, ref: docs/reference-k3s.md#§3}]}
  server:
    {label: クラスタ制御部, kind: service, tier: server, x: 1, 'y': 1.5, description: control-plane と datastore を管理し、K3s API を提供する。, evidence: [{type: doc, ref: docs/reference-k3s.md#§2}, {type: doc, ref: docs/reference-k3s.md#§3}]}
  datastore:
    {label: クラスタ状態ストア, kind: db, tier: server, x: 4, 'y': 1.5, description: server が管理するクラスタ状態のデータストア。選択トポロジーの論理表現。, evidence: [{type: doc, ref: docs/reference-k3s.md#§2}]}
  agent:
    {label: ノード参加エージェント, kind: worker, tier: agent, x: 1, 'y': 1.5, description: control-plane と datastore を持たず server に登録されるホスト。, evidence: [{type: doc, ref: docs/reference-k3s.md#§2}]}
  runtime:
    {label: ノード実行・ネットワーク, kind: worker, tier: agent, x: 4, 'y': 1.5, description: K3s agent 上で実行され、Pod の起動とネットワークを担う構成要素群。, evidence: [{type: doc, ref: docs/reference-k3s.md#§2}, {type: doc, ref: docs/reference-k3s.md#§3}]}
  order-api:
    {label: 注文 API の実行単位, kind: service, tier: agent, x: 7, 'y': 1.5, description: agent 側で起動される注文 API の Pod。, evidence: [{type: doc, ref: docs/reference-k3s.md#§3}, {type: doc, ref: docs/reference-k3s.md#§4}]}
  service:
    {label: 注文 API の公開, kind: lb, tier: network, x: 1.5, 'y': 1.5, description: 注文 API Pod への安定したネットワーク入口。, evidence: [{type: doc, ref: docs/reference-k3s.md#§4}]}
links:
  - {id: apply, from: kubectl, to: server, label: リソースを適用, evidence: [{type: doc, ref: "docs/reference-k3s.md#§3"}]}
  - {id: persist, from: server, to: datastore, label: 状態を保存, evidence: [{type: doc, ref: "docs/reference-k3s.md#§2"}]}
  - {id: register, from: agent, to: server, label: server に登録, evidence: [{type: doc, ref: "docs/reference-k3s.md#§2"}]}
  - {id: schedule, from: server, to: runtime, label: Pod を配置, evidence: [{type: doc, ref: "docs/reference-k3s.md#§3"}]}
  - {id: start, from: runtime, to: order-api, label: Pod を起動, evidence: [{type: doc, ref: "docs/reference-k3s.md#§3"}]}
  - {id: expose, from: service, to: order-api, label: Service が転送, evidence: [{type: doc, ref: "docs/reference-k3s.md#§4"}]}
  - {id: agent-loss, from: server, to: agent, label: Agent 状態を扱う, evidence: [{type: doc, ref: "docs/reference-k3s.md#§5"}]}
scenarios:
  - id: deploy-order-api
    label: K3s に注文 API をデプロイ
    evidence: [{type: doc, ref: "docs/reference-k3s.md#§3"}, {type: doc, ref: "docs/reference-k3s.md#§4"}]
    steps:
      - {links: [apply, persist], note: "利用者が K3s API へ注文 API のリソースを適用し、server が状態を datastore に扱う。"}
      - {links: [register, schedule, start], note: "agent が server に登録され、agent 上の kubelet / runtime が Pod を起動する。"}
      - {links: [expose], note: "クライアントは注文 API Service 経由で Pod へアクセスする。"}
  - id: agent-loss
    label: agent 障害後の再調整
    evidence: [{type: doc, ref: "docs/reference-k3s.md#§5"}]
    steps:
      - {links: [agent-loss], note: "agent ホスト障害が server 側の control-plane に扱われ、注文 API Pod に影響する。"}
      - {links: [schedule, start, expose], note: "Deployment の差分調整により新しい配置を試みる。結果と時間は構成・リソース・設定に依存する。"}
implementations:
  - id: ha
    label: K3s の組み込み etcd 構成
    description: 小規模なオンプレミス環境で、3 台の K3s server と複数の agent に注文 API を配備する例。
    sources:
      - title: K3s High Availability Embedded etcd
        url: https://docs.k3s.io/datastore/ha-embedded
      - title: K3s Networking Services
        url: https://docs.k3s.io/networking/networking-services
      - {title: "K3s の etcd スナップショット", url: https://docs.k3s.io/cli/etcd-snapshot}
    tiers:
      - id: client
        label: 利用者
        kind: origin
        z: 1
        origin:
          - -4
          - 0
      - id: server
        label: K3s server
        z: 1
      - id: agent
        label: K3s agent
        z: 0
      - id: network
        label: Service ネットワーク
        z: 0
        origin:
          - 9
          - 0
    groups:
      - kind: cluster
        label: K3s クラスタ
        provider: k8s
        tier:
          - server
          - agent
          - network
        nodes:
          - ha-server
          - vm-etcd-disk
          - ha-agent
          - ha-order-api
          - ha-service
    nodes:
      ha-kubectl:
        label: kubectl
        kind: client
        tier: client
        realizes:
          - kubectl
        description: クラスタ共通の API アドレスに接続する。
        evidence:
          - type: doc
            ref: docs/reference-k3s.md#§6
      ha-server:
        label: K3s server VM × 3
        kind: worker
        tier: server
        svc: onprem:vm
        realizes:
          - server
        description: K3s server と組み込み etcd を同じサーバーに配置し、クラスタ状態を複製する。
        management: {type: customer, scope: 利用者がこの例の設定と運用を担う。}
        evidence:
          - type: doc
            ref: docs/reference-k3s.md#§6
      ha-agent:
        label: K3s agent VM
        kind: worker
        tier: agent
        svc: onprem:vm
        realizes:
          - agent
          - runtime
        description: K3s agent、kubelet、containerd、CNI の実行を担う。
        management: {type: customer, scope: 利用者がこの例の設定と運用を担う。}
        evidence:
          - type: doc
            ref: docs/reference-k3s.md#§6
      ha-order-api:
        label: 注文 API Deployment
        kind: service
        tier: agent
        svc: k8s:deployment
        realizes:
          - order-api
        description: agent ノードで注文 API の Pod を実行する。
        management: {type: customer, scope: 利用者がこの例の設定と運用を担う。}
        evidence:
          - type: doc
            ref: docs/reference-k3s.md#§6
      ha-service:
        label: LoadBalancer Service / ServiceLB
        kind: lb
        tier: network
        svc: k8s:service
        realizes:
          - service
        description: ServiceLB がポート利用可能なノードに Pod を配置し、hostPort を通じて Service に転送する。
        management: {type: customer, scope: 利用者がこの例の設定と運用を担う。}
        evidence:
          - type: doc
            ref: docs/reference-k3s.md#§6
      ha-registration:
        label: 固定 API・登録アドレス
        kind: lb
        tier: network
        svc: onprem:lb
        description: 外部 TCP ロードバランサーを介して server に接続する。
        management: {type: customer, scope: 利用者がこの例の設定と運用を担う。}
        evidence:
          - type: doc
            ref: docs/reference-k3s.md#§6
      vm-etcd-disk: {label: "各 K3s server の組み込み etcd（永続ディスク）", kind: db, tier: server, realizes: [datastore], description: "各 server が自己の永続ディスクに etcd データを保持する。", evidence: [{type: doc, ref: docs/reference-k3s.md#§6}]}
    links:
      - {id: ha-servicelb-host, from: ha-agent, to: ha-service, label: ServiceLB Pod の hostPort を提供, evidence: [{type: doc, ref: docs/reference-k3s.md#§6}]}
      - {id: ha-kubectl-api, from: ha-kubectl, to: ha-registration, label: 固定 API エンドポイントへ接続, realizes: [apply], replace: true, evidence: [{type: doc, ref: docs/reference-k3s.md#§6}]}
      - id: ha-register
        from: ha-agent
        to: ha-registration
        label: 固定アドレスへ接続
        realizes: [register]
        replace: true
        evidence:
          - type: doc
            ref: docs/reference-k3s.md#§6
      - id: ha-forward
        from: ha-registration
        to: ha-server
        label: 健全な server へ中継
        realizes: [register, apply]
        replace: true
        evidence:
          - type: doc
            ref: docs/reference-k3s.md#§6

    layout2d:
      tiers: [{id: diagram, label: 自主管理環境, z: 0, origin: [-4, 0], size: [22, 11]}]
      nodes:
        ha-kubectl: {tier: diagram, x: -3, y: 1}
        ha-registration: {tier: diagram, x: 2, y: 1}
        ha-server: {tier: diagram, x: 6, y: 1}
        vm-etcd-disk: {tier: diagram, x: 10, y: 1}
        ha-agent: {tier: diagram, x: 6, y: 5}
        ha-order-api: {tier: diagram, x: 6, y: 8}
        ha-service: {tier: diagram, x: 10, y: 6}
      groups:
        - {kind: datacenter, label: 利用者の環境, tier: [diagram], x0: 0, y0: -1, x1: 16, y1: 10, nodes: [ha-registration, ha-server, vm-etcd-disk, ha-agent, ha-order-api, ha-service]}
        - {kind: cluster, provider: k8s, label: K3s クラスタ, tier: [diagram], x0: 4, y0: -0.5, x1: 12, y1: 9.5, nodes: [ha-server, vm-etcd-disk, ha-agent, ha-order-api, ha-service]}
    layout3d:
      tiers:
        - {id: nodes, label: 制御・実行ノード, z: 0, size: [10, 4]}
        - {id: apps, label: ノード上のアプリ・データ, z: 1, size: [10, 4]}
        - {id: external, label: クラスタ外のサービス, z: 0, origin: [12, 0], size: [8, 7]}
        - {id: outside, label: 利用者, z: 0, origin: [-5, 0], size: [3, 3]}
      nodes:
        ha-kubectl: {tier: outside, x: 1, y: 1}
        ha-server: {tier: nodes, x: 2, y: 2}
        vm-etcd-disk: {tier: apps, x: 2, y: 2}
        ha-agent: {tier: nodes, x: 6, y: 2}
        ha-order-api: {tier: apps, x: 6, y: 2}
        ha-service: {tier: apps, x: 9, y: 2}
        ha-registration: {tier: external, x: 1, y: 1}
      groups:
        - {kind: datacenter, label: 利用者の環境, tier: [nodes, apps, external], nodes: [ha-registration, ha-server, vm-etcd-disk, ha-agent, ha-order-api, ha-service]}
        - {kind: cluster, provider: k8s, label: K3s クラスタ, tier: [nodes, apps], nodes: [ha-server, vm-etcd-disk, ha-agent, ha-order-api, ha-service]}
