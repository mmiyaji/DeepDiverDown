name: Cadence の基本アーキテクチャ
description: Cadence のサーバーサービス（Frontend・History・Matching）、タスクリスト、ワーカー、イベント履歴の永続化、検索用の可視性ストアを示す。
reference:
  objectives: [ワークフローの状態がイベント履歴として保存される流れを確認する, 決定タスクとアクティビティタスクがタスクリスト経由でワーカーへ渡る流れを確認する, サーバーが前提とする永続化ストアと可視性ストアを確認する]
  sources:
    - {title: Cadence Introduction, url: https://cadenceworkflow.io/docs/concepts/}
    - {title: Cadence Workflows, url: https://cadenceworkflow.io/docs/concepts/workflows/}
    - {title: Cadence Deployment topology, url: https://cadenceworkflow.io/docs/concepts/topology/}
    - {title: Cadence Task lists, url: https://cadenceworkflow.io/docs/concepts/task-lists/}
    - {title: cadence-workflow/cadence (GitHub), url: https://github.com/cadence-workflow/cadence}
sources: [docs/reference-cadence.md]
evidence: [{type: doc, ref: docs/reference-cadence.md#§1}]
tiers:
  - {id: flow, label: クライアント・サーバー・ワーカー, z: 0, size: [38, 13]}
nodes:
  client: {label: クライアント, kind: client, tier: flow, x: 1, y: 6, description: ワークフローの開始、シグナルの送信、クエリを行うアプリケーションや CLI。, evidence: [{type: doc, ref: docs/reference-cadence.md#§1}]}
  frontend: {label: Frontend サービス, kind: service, tier: flow, x: 7, y: 6, description: ステートレスなサービス。クライアントとワーカーからの要求を受ける。外部のロードバランサーで負荷を分散する。, evidence: [{type: doc, ref: docs/reference-cadence.md#§2}]}
  history: {label: History サービス, kind: workflow, tier: flow, x: 13, y: 6, description: ワークフローとアクティビティの進行を制御する。ワークフローの状態と永続的なタイマーを持つ。, evidence: [{type: doc, ref: docs/reference-cadence.md#§2}]}
  store: {label: イベント履歴の永続化ストア, kind: db, tier: flow, x: 19, y: 2, description: ワークフローの進行をイベント履歴として保存する。Cassandra・MySQL・PostgreSQL が公式の対応先。, evidence: [{type: doc, ref: docs/reference-cadence.md#§3}]}
  visibility: {label: 可視性ストア, kind: db, tier: flow, x: 19, y: 10, description: ワークフローの検索（高度な可視性）に使う。Elasticsearch・OpenSearch・Pinot が対応先で、Kafka を併用する。, evidence: [{type: doc, ref: docs/reference-cadence.md#§5}]}
  matching: {label: Matching サービス, kind: service, tier: flow, x: 19, y: 6, description: ワークフローとアクティビティのタスクを、実行できるワーカーに引き合わせる。History がタスクを渡す。, evidence: [{type: doc, ref: docs/reference-cadence.md#§2}]}
  tasklist: {label: タスクリスト, kind: queue, tier: flow, x: 25, y: 6, description: 決定タスクとアクティビティタスクをワーカーへ届ける内部のキュー。事前登録は不要で、数の制限はない。, evidence: [{type: doc, ref: docs/reference-cadence.md#§4}]}
  wfworker: {label: ワークフローワーカー, kind: worker, tier: flow, x: 31, y: 3, description: 利用者のプロセスでワークフローのコードを動かす。決定タスクを受け、決定を返す。, evidence: [{type: doc, ref: docs/reference-cadence.md#§4}]}
  actworker: {label: アクティビティワーカー, kind: worker, tier: flow, x: 31, y: 9, description: アクティビティの実装を動かし、外部との通信を担う。完了を報告する。ハートビートとリトライに対応する。, evidence: [{type: doc, ref: docs/reference-cadence.md#§4}]}
links:
  - {id: c-fe, from: client, to: frontend, label: ワークフローを開始・シグナルを送信, evidence: [{type: doc, ref: docs/reference-cadence.md#§2}]}
  - {id: fe-hist, from: frontend, to: history, label: 要求を転送, evidence: [{type: doc, ref: docs/reference-cadence.md#§2}]}
  - {id: hist-store, from: history, to: store, label: イベントを永続化, evidence: [{type: doc, ref: docs/reference-cadence.md#§3}]}
  - {id: hist-vis, from: history, to: visibility, label: 検索用の情報を記録, evidence: [{type: doc, ref: docs/reference-cadence.md#§5}]}
  - {id: hist-match, from: history, to: matching, label: タスクを割り当て, evidence: [{type: doc, ref: docs/reference-cadence.md#§2}]}
  - {id: match-tl, from: matching, to: tasklist, label: タスクをタスクリストに追加, evidence: [{type: doc, ref: docs/reference-cadence.md#§4}]}
  - {id: tl-wf, from: tasklist, to: wfworker, label: 決定タスクをロングポーリングで取得, evidence: [{type: doc, ref: docs/reference-cadence.md#§4}]}
  - {id: tl-act, from: tasklist, to: actworker, label: アクティビティタスクをロングポーリングで取得, evidence: [{type: doc, ref: docs/reference-cadence.md#§4}]}
  - {id: wf-fe, from: wfworker, to: frontend, label: 決定を返す, evidence: [{type: doc, ref: docs/reference-cadence.md#§2}]}
  - {id: act-fe, from: actworker, to: frontend, label: 完了・失敗を報告, evidence: [{type: doc, ref: docs/reference-cadence.md#§2}]}
scenarios:
  - id: start-and-run
    label: ワークフローを開始してアクティビティを実行する
    evidence: [{type: doc, ref: docs/reference-cadence.md#§4}]
    steps:
      - {links: [c-fe, fe-hist, hist-store], note: Frontend 経由で History が開始を受け、イベント履歴に記録する。}
      - {links: [hist-match, match-tl, tl-wf], note: 決定タスクがタスクリストに入り、ワークフローワーカーが取得する。}
      - {links: [wf-fe, tl-act, act-fe], note: ワークフローの決定でアクティビティタスクが作られ、アクティビティワーカーが実行して完了を報告する。}
requirements:
  - {id: CD-01, kind: rule, title: ワークフローのコードは決定的にする, text: 回復はイベントソーシングによるため、ワークフローのコードは同じ結果を再現する必要がある。外部との通信はアクティビティで行い、時刻の取得やスリープは Cadence の API を使う。, links: [tl-wf, wf-fe], evidence: [{type: doc, ref: docs/reference-cadence.md#§1}]}
unknowns:
  - {id: UNK-01, text: シャード数と、History サービス内のシャードの割り当て方は取得した資料に記載がなく未確認。, refs: [history]}
  - {id: UNK-02, text: スティッキー実行（決定タスクを同じワーカーへ戻す仕組み）は取得した資料に記載がなく未確認。, refs: [tasklist, wfworker]}
  - {id: UNK-03, text: Internal Worker（アーカイブなど内部用ワークフローの実行）との接続の向きと、アーカイブ先は未確認のため図に描いていない。, refs: [history]}
  - {id: UNK-04, text: クロスデータセンターレプリケーションとスケジュールの詳細は未取得で未確認。, refs: [history]}
gates: {maxDrift: 0, maxHigh: 0}
implementations:
  - id: onprem-cassandra
    label: 自前のサーバー群での Cadence クラスタ（Cassandra と Elasticsearch）
    description: Frontend・History・Matching を自前のホストで動かし、イベント履歴を Cassandra、検索用の情報を Kafka 経由で Elasticsearch に置く例。ワーカーは利用者のアプリケーションホストで動く。代表例であり、導入事例ではない。
    sources:
      - {title: Cadence Deployment topology, url: https://cadenceworkflow.io/docs/concepts/topology/}
      - {title: cadence-workflow/cadence (GitHub), url: https://github.com/cadence-workflow/cadence}
    tiers:
      - {id: diagram, label: クライアント・Cadence・ストア・ワーカー, z: 0, size: [38, 11]}
    nodes:
      cd-client: {label: クライアント, kind: client, tier: diagram, x: 1, y: 5, realizes: [client], description: Go または Java の SDK、CLI、HTTP API で接続するアプリケーション。, evidence: [{type: doc, ref: docs/reference-cadence.md#§6}]}
      cd-frontend: {label: Cadence Frontend, kind: service, tier: diagram, x: 7, y: 5, realizes: [frontend], description: 複数インスタンスをロードバランサーの背後に置く。, management: {type: customer, scope: "Customer operates the hosts, Cadence processes and configuration."}, evidence: [{type: doc, ref: docs/reference-cadence.md#§6}]}
      cd-history: {label: Cadence History, kind: service, tier: diagram, x: 13, y: 5, realizes: [history], description: ワークフローの状態とタイマーを管理し、イベント履歴をストアへ書く。, management: {type: customer, scope: "Customer operates the hosts, Cadence processes and configuration."}, evidence: [{type: doc, ref: docs/reference-cadence.md#§6}]}
      cd-matching: {label: Cadence Matching, kind: service, tier: diagram, x: 19, y: 5, realizes: [matching, tasklist], description: タスクとワーカーを引き合わせ、タスクリストを管理する。, management: {type: customer, scope: "Customer operates the hosts, Cadence processes and configuration."}, evidence: [{type: doc, ref: docs/reference-cadence.md#§6}]}
      cd-cassandra: {label: Cassandra クラスタ, kind: db, tier: diagram, x: 19, y: 1.5, realizes: [store], description: イベント履歴を保存する。MySQL や PostgreSQL も選べる。, management: {type: customer, scope: "Customer operates the database cluster, schema, backups and access."}, evidence: [{type: doc, ref: docs/reference-cadence.md#§6}]}
      cd-es: {label: Kafka と Elasticsearch, kind: db, tier: diagram, x: 19, y: 8.5, realizes: [visibility], description: 高度な可視性の検索用に、ワークフローの情報を Kafka 経由で Elasticsearch に置く。, management: {type: customer, scope: "Customer operates Kafka, Elasticsearch and their access."}, evidence: [{type: doc, ref: docs/reference-cadence.md#§6}]}
      cd-wfhost: {label: ワークフローワーカーのホスト, kind: worker, tier: diagram, x: 31, y: 2.5, realizes: [wfworker], description: Go または Java の SDK でワークフローのコードを動かす利用者のアプリケーション。, management: {type: customer, scope: "Customer operates the application hosts and worker code."}, evidence: [{type: doc, ref: docs/reference-cadence.md#§6}]}
      cd-acthost: {label: アクティビティワーカーのホスト, kind: worker, tier: diagram, x: 31, y: 8, realizes: [actworker], description: アクティビティの実装を動かし、外部システムと通信する利用者のアプリケーション。, management: {type: customer, scope: "Customer operates the application hosts and worker code."}, evidence: [{type: doc, ref: docs/reference-cadence.md#§6}]}
    links:
      - {id: cd-req, from: cd-client, to: cd-frontend, label: ワークフローを開始・シグナルを送信, evidence: [{type: doc, ref: docs/reference-cadence.md#§6}]}
      - {id: cd-fwd, from: cd-frontend, to: cd-history, label: 要求を転送, evidence: [{type: doc, ref: docs/reference-cadence.md#§6}]}
      - {id: cd-write, from: cd-history, to: cd-cassandra, label: イベントを永続化, evidence: [{type: doc, ref: docs/reference-cadence.md#§6}]}
      - {id: cd-vis, from: cd-history, to: cd-es, label: 検索用の情報を記録, evidence: [{type: doc, ref: docs/reference-cadence.md#§6}]}
      - {id: cd-assign, from: cd-history, to: cd-matching, label: タスクを割り当て, evidence: [{type: doc, ref: docs/reference-cadence.md#§6}]}
      - {id: cd-poll-wf, from: cd-matching, to: cd-wfhost, label: 決定タスクをロングポーリングで渡す, evidence: [{type: doc, ref: docs/reference-cadence.md#§6}]}
      - {id: cd-poll-act, from: cd-matching, to: cd-acthost, label: アクティビティタスクをロングポーリングで渡す, evidence: [{type: doc, ref: docs/reference-cadence.md#§6}]}
      - {id: cd-wf-resp, from: cd-wfhost, to: cd-frontend, label: 決定を返す, evidence: [{type: doc, ref: docs/reference-cadence.md#§6}]}
      - {id: cd-act-resp, from: cd-acthost, to: cd-frontend, label: 完了・失敗を報告, evidence: [{type: doc, ref: docs/reference-cadence.md#§6}]}
    groups:
      - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [cd-frontend, cd-history, cd-matching, cd-cassandra, cd-es, cd-wfhost, cd-acthost]}
    layout2d:
      tiers:
        - {id: diagram, label: クライアント・Cadence・ストア・ワーカー, z: 0, size: [38, 11]}
      nodes:
        cd-client: {tier: diagram, x: 1, y: 5}
        cd-frontend: {tier: diagram, x: 7, y: 5}
        cd-history: {tier: diagram, x: 13, y: 5}
        cd-matching: {tier: diagram, x: 19, y: 5}
        cd-cassandra: {tier: diagram, x: 19, y: 1.5}
        cd-es: {tier: diagram, x: 19, y: 8.5}
        cd-wfhost: {tier: diagram, x: 31, y: 2.5}
        cd-acthost: {tier: diagram, x: 31, y: 8}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: diagram, nodes: [cd-frontend, cd-history, cd-matching, cd-cassandra, cd-es, cd-wfhost, cd-acthost]}
    layout3d:
      tiers:
        - {id: clients, label: クライアント, z: 0, size: [6, 11]}
        - {id: servers, label: Cadence・ストア・ワーカー, z: 0, origin: [8, 0], size: [32, 11]}
      nodes:
        cd-client: {tier: clients, x: 3, y: 5}
        cd-frontend: {tier: servers, x: 2, y: 5}
        cd-history: {tier: servers, x: 8, y: 5}
        cd-matching: {tier: servers, x: 14, y: 5}
        cd-cassandra: {tier: servers, x: 14, y: 1.5}
        cd-es: {tier: servers, x: 14, y: 8.5}
        cd-wfhost: {tier: servers, x: 26, y: 2.5}
        cd-acthost: {tier: servers, x: 26, y: 8}
      groups:
        - {kind: datacenter, label: 自前のサーバー群, provider: onprem, tier: [servers], nodes: [cd-frontend, cd-history, cd-matching, cd-cassandra, cd-es, cd-wfhost, cd-acthost]}
