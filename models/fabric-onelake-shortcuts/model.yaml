name: Microsoft Fabric：OneLake とショートカット
description: ショートカットが Lakehouse の Tables と Files に置く参照であり、ターゲットごとに認可・キャッシュの扱いが変わることを追う。
parent:
  model: microsoft-fabric
  node: onelake
reference:
  objectives: [Tables と Files でショートカットの置き方が違うことを説明する。, 内部ショートカットと外部ショートカットで認可の主体が異なることを区別する。, キャッシュの対象と制限を説明する。]
  sources: [{title: Microsoft Learn · OneLake shortcuts, url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts}, {title: Microsoft Learn · OneLake, url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-overview}, {title: Microsoft Learn · SQL analytics endpoint, url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sql-analytics-endpoint}, {title: Microsoft Learn · Lakehouse shortcuts, url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-shortcuts}]
sources:
  - docs/reference-fabric-onelake-shortcuts.md
evidence:
  - {type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§1}
  - {type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§2}
tiers:
  - {id: flow, label: ショートカットの参照と認可, z: 0, size: [24, 10]}
nodes:
  engines: {label: 利用エンジン（Spark・SQL・Direct Lake）, kind: worker, tier: flow, x: 0, 'y': 4, description: ショートカットをフォルダとして読む。OneLake API を通すため、Fabric 外のサービスも同じ経路を使える。, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§3}]}
  lh: {label: Lakehouse（Tables・Files）, kind: table, tier: flow, x: 5, 'y': 4, description: 最上位に Tables と Files を持つ。ショートカットはここに置く。, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§2}]}
  sct: {label: Tables のショートカット, kind: file, tier: flow, x: 10, 'y': 1.5, description: Tables 直下の最上位にだけ置ける。Delta などの対応形式を持つターゲットはテーブルとして認識し、スキーマを自動で同期する。, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§2}]}
  scf: {label: Files のショートカット, kind: file, tier: flow, x: 10, 'y': 6.5, description: 任意の階層に置ける。形式を問わず、テーブルの自動検出は行われない。, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§2}]}
  internal: {label: 内部ターゲット（他の Lakehouse・Warehouse など）, kind: db, tier: flow, x: 15, 'y': 0, description: 同じワークスペースや別ワークスペースの項目。種類が違ってもよい。, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§3}]}
  conn: {label: クラウド接続（資格情報）, kind: policy, tier: flow, x: 15, 'y': 4, description: ADLS や S3 のショートカットが認可に使う接続。接続を指定する操作には接続への権限が要る。, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§4}]}
  cache: {label: ショートカットキャッシュ, kind: cache, tier: flow, x: 15, 'y': 8.5, description: ワークスペース単位。保持期間は 1〜28 日で、アクセスのたびに延長される。1 GB を超えるファイルは対象外。, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§5}]}
  adls: {label: ADLS Gen2・Azure Blob Storage, kind: db, tier: flow, x: 21, 'y': 1.5, description: Azure の外部ターゲット。, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§4}]}
  s3: {label: Amazon S3（S3 互換・GCS も同種）, kind: db, tier: flow, x: 21, 'y': 7, description: AWS の外部ターゲット。S3 互換と Google Cloud Storage も外部ショートカットの種類として扱う。, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§4}]}
links:
  - {id: read, from: engines, to: lh, label: Tables・Files を読む, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§3}]}
  - {id: place-t, from: lh, to: sct, label: Tables 直下に置く, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§2}]}
  - {id: place-f, from: lh, to: scf, label: Files の任意階層に置く, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§2}]}
  - {id: sync, from: sct, to: lh, label: テーブルとスキーマを同期, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§2}]}
  - {id: ref-internal, from: sct, to: internal, label: 呼び出し元の ID で認可して参照, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§3}]}
  - {id: ref-adls, from: sct, to: adls, label: Delta ターゲットを参照, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§4}]}
  - {id: files-adls, from: scf, to: adls, label: 任意形式を参照, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§4}]}
  - {id: files-s3, from: scf, to: s3, label: 任意形式を参照, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§4}]}
  - {id: use-conn, from: scf, to: conn, label: 接続を指定, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§4}]}
  - {id: auth-adls, from: conn, to: adls, label: 資格情報で認証, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§4}]}
  - {id: auth-s3, from: conn, to: s3, label: 資格情報で認証, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§4}]}
  - {id: cache-fill, from: s3, to: cache, label: 読んだファイルを保持, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§5}]}
  - {id: cache-hit, from: cache, to: scf, label: 再読み取りに応答, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§5}]}
scenarios:
  - {id: read-external, label: S3 のファイルを Files から読む, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§1}], steps: [{links: [read, place-f, use-conn], note: エンジンが Files のショートカットを読むと、指定した接続が使われる。}, {links: [auth-s3, files-s3, cache-fill], note: 接続の資格情報で S3 に認証してファイルを読み、キャッシュが有効なら保持する。}, {links: [cache-hit], note: 保持期間内の再読み取りはキャッシュから応答する。}]}
  - {id: read-table, label: ADLS の Delta をテーブルとして読む, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§1}], steps: [{links: [place-t, ref-adls, auth-adls, files-adls], note: ショートカットが ADLS のターゲットを参照する。Tables 直下の Delta はテーブルになる。}, {links: [sync], note: Lakehouse がテーブルとして認識し、スキーマ変更も同期する。}, {links: [ref-internal], note: 内部ターゲットでは接続を使わず、呼び出し元の ID で認可する。}]}
unknowns:
  - {id: gcs-gate, text: Iceberg ショートカットと Dataverse・OneDrive・SharePoint のショートカットの提供状況（GA・Preview）は未確認。, refs: [ref-adls]}
  - {id: latency, text: 同期の伝播時間はデータ源の性能やネットワークで変わり、具体値は未確認。, refs: [sync]}
implementations:
  - {id: fabric-shortcuts-adls-s3, label: ADLS と S3 を参照する Lakehouse, description: Azure の ADLS Gen2 と AWS の S3 を、Fabric ワークスペースの Lakehouse のショートカットで参照する例。, sources: [{title: Microsoft Learn · OneLake shortcuts, url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts}, {title: Microsoft Learn · OneLake, url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-overview}, {title: Microsoft Learn · SQL analytics endpoint, url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sql-analytics-endpoint}], tiers: [{id: flow, label: ショートカットの参照と認可, z: 0, size: [24, 10]}], nodes: {i-engines: {svc: fabric:notebook, label: Fabric Spark ノートブック・SQL 分析エンドポイント, kind: worker, tier: flow, x: 0, 'y': 4, realizes: [engines], description: 相対パスやテーブル名でショートカットを読む。, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§6}]}, i-lh: {svc: fabric:lakehouse, label: Lakehouse, kind: table, tier: flow, x: 5, 'y': 4, realizes: [lh], description: Tables と Files にショートカットを持つ。, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§6}]}, i-sct: {svc: fabric:lakehouse, label: Tables のショートカット, kind: file, tier: flow, x: 10, 'y': 1.5, realizes: [sct], description: ADLS の Delta ターゲットをテーブルとして見せる。, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§6}]}, i-scf: {svc: fabric:lakehouse, label: Files のショートカット, kind: file, tier: flow, x: 10, 'y': 6.5, realizes: [scf], description: S3 などのファイルを Files 配下に見せる。, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§6}]}, i-internal: {svc: fabric:lakehouse, label: 別ワークスペースの Lakehouse, kind: db, tier: flow, x: 15, 'y': 0, realizes: [internal], description: 呼び出し元の ID で認可する。, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§6}]}, i-conn: {svc: fabric:platform, label: 接続（ADLS・S3 用）, kind: policy, tier: flow, x: 15, 'y': 4, realizes: [conn], description: 資格情報を保持する。利用者が作成と権限を管理する。, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§6}]}, i-cache: {svc: fabric:platform, label: ワークスペースのキャッシュ設定, kind: cache, tier: flow, x: 15, 'y': 8.5, realizes: [cache], description: ワークスペース設定の OneLake タブで有効にする。, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§6}]}, i-adls: {svc: azure:storage, label: ADLS Gen2, kind: db, tier: flow, x: 21, 'y': 1.5, realizes: [adls], description: Delta テーブルを置くストレージアカウント。, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§6}]}, i-s3: {svc: aws:s3, label: Amazon S3 バケット, kind: db, tier: flow, x: 21, 'y': 7, realizes: [s3], description: ファイルを置く。AWS のアカウントに属する。, evidence: [{type: doc, ref: docs/reference-fabric-onelake-shortcuts.md#§6}]}}, links: [], groups: [{kind: cloud, provider: fabric, label: Fabric テナント・ワークスペース, tier: [flow], nodes: [i-engines, i-lh, i-sct, i-scf, i-internal, i-conn, i-cache]}, {kind: cloud, provider: azure, label: Azure サブスクリプション, tier: [flow], nodes: [i-adls]}, {kind: cloud, provider: aws, label: AWS アカウント, tier: [flow], nodes: [i-s3]}], layout2d: {tiers: [{id: diagram, label: ショートカットの参照と認可, z: 0, size: [28, 14]}], nodes: {i-engines: {tier: diagram, x: 2, 'y': 6}, i-lh: {tier: diagram, x: 7, 'y': 6}, i-sct: {tier: diagram, x: 12, 'y': 3.5}, i-scf: {tier: diagram, x: 12, 'y': 8.5}, i-internal: {tier: diagram, x: 17, 'y': 2}, i-conn: {tier: diagram, x: 17, 'y': 6}, i-cache: {tier: diagram, x: 17, 'y': 10.5}, i-adls: {tier: diagram, x: 23, 'y': 3.5}, i-s3: {tier: diagram, x: 23, 'y': 9}}, groups: [{kind: cloud, label: Fabric テナント・ワークスペース, provider: fabric, tier: [diagram], x0: 0.3999999999999999, y0: 0.6000000000000001, x1: 18.6, y1: 11.9, nodes: [i-engines, i-lh, i-sct, i-scf, i-internal, i-conn, i-cache]}, {kind: cloud, label: Azure サブスクリプション, provider: azure, tier: [diagram], x0: 21.4, y0: 2.1, x1: 24.6, y1: 4.9, nodes: [i-adls]}, {kind: cloud, label: AWS アカウント, provider: aws, tier: [diagram], x0: 21.4, y0: 7.6, x1: 24.6, y1: 10.4, nodes: [i-s3]}]}, layout3d: {tiers: [{id: fabric, label: Fabric テナント・