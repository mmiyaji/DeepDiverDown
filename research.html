<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'">
  <title>リファレンスの調査一覧 | DeepDiverDown</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/research.css">
  <link rel="stylesheet" href="css/product-theme.css?v=brand2">
  <script type="module" src="js/research.js?v=ext1"></script>
</head>
<body class="research-page">
  <a class="skip" href="#reference-search">リファレンス一覧へ移動</a>
  <header class="top research-top">
    <a class="brand" href="./"><img class="brand-icon" src="brand-mark.svg" alt="">DeepDiverDown</a>
    <nav aria-label="ページ">
      <a href="./">構成図</a>
      <a href="research.html" aria-current="page">調査一覧</a>
      <a href="knowledge-graph.html">ナレッジグラフ</a>
      <a href="objects.html">オブジェクト一覧</a>
      <a href="about.html">サイト情報</a>
    </nav>
  </header>
  <div class="research-heading" id="research-heading">
    <h1>リファレンスの調査一覧</h1>
    <a id="research-candidates" href="research.html?doc=docs%2Freference-modern-data-stack-candidates.md">モダンデータスタック 調査候補</a>
  </div>
  <div class="research-layout" id="research-list-view">
    <aside class="research-history" aria-label="調査履歴">
      <details id="history-panel">
        <summary>調査履歴</summary>
        <p>収録日は解説を追加したコミットの日付です。</p>
        <div id="history-list" role="group" aria-label="収録・見直しの単位"></div>
      </details>
    </aside>
    <main class="research-main">
      <h2 id="reference-search" tabindex="-1">リファレンス</h2>
      <form class="research-controls" id="filters" role="search">
        <fieldset id="research-intents" class="research-intents" disabled>
          <legend>学びたいこと</legend>
          <div id="research-intent-options" class="research-intent-options"></div>
        </fieldset>
        <div class="research-fields">
          <label for="research-query">キーワード
            <input type="search" id="research-query" placeholder="製品名、学習内容、実装例など" autocomplete="off" disabled>
          </label>
          <label for="research-domain">領域
            <select id="research-domain" disabled>
              <option value="">すべての領域</option>
            </select>
          </label>
          <button type="reset" id="research-reset" disabled>絞り込みを解除</button>
        </div>
      </form>
      <section id="history-selection" class="research-selection" aria-label="選択中の履歴" hidden></section>
      <p id="research-status" role="status">調査一覧を読み込み中です。</p>
      <div id="research-error" role="alert" hidden>
        <p>調査一覧を読み込めませんでした。接続を確認し、再読み込みしてください。</p>
        <button type="button" id="research-retry">再読み込み</button>
      </div>
      <div id="research-table-wrap" hidden>
        <table class="research-table" role="table" aria-label="調査済みリファレンス">
          <thead role="rowgroup">
            <tr role="row"><th scope="col" role="columnheader">リファレンス</th><th scope="col" role="columnheader">構成図</th><th scope="col" role="columnheader">解説と資料</th></tr>
          </thead>
          <tbody id="research-results" role="rowgroup"></tbody>
        </table>
      </div>
      <noscript><p>調査一覧と絞り込みには JavaScript が必要です。</p></noscript>
    </main>
  </div>
  <main class="research-reader" id="research-reader" hidden>
    <a id="research-back" href="research.html">調査一覧へ戻る</a>
    <div id="research-reader-status" role="status">解説を読み込み中です。</div>
    <p id="research-reader-error" role="alert" hidden>解説を読み込めませんでした。調査一覧から再度開いてください。</p>
    <article id="research-article" aria-label="解説"></article>
  </main>
</body>
</html>
