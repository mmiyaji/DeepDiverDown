<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- importmap を変更したら script-src の SHA-256 も更新する。 -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'sha256-hkzRjflwL67QuBNHfcX51SOxPQzPEfwGduwXdxJWLPQ='; object-src 'none'; base-uri 'none'">
<title>DeepDiverDown</title>
<script src="js/home-route.js"></script>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="css/style.css?v=minimap1">
<link rel="stylesheet" href="css/settings-panel.css">
<link rel="stylesheet" href="css/diagram-symbols.css?v=compare-layout3">
<link rel="stylesheet" href="css/review-actions.css">
<link rel="stylesheet" href="css/product-theme.css?v=view-overview3">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<a class="skip" href="#panel">詳細パネルへ移動</a>
<header class="top">
  <button class="icon" data-act="nav" aria-controls="sidebar" aria-label="モデル一覧の開閉（[）" title="モデル一覧の開閉（[）">☰</button>
  <a class="brand" href="home.html" aria-label="DeepDiverDown トップページ"><img class="brand-icon" src="brand-mark.svg" alt="">DeepDiverDown</a>
  <a class="crumb-up" id="mparent" hidden></a>
  <button class="crumb" id="mtitle" data-act="pick-model" title="モデルを切り替え（Ctrl+K）"></button>
  <div class="search" role="search">
    <input id="q" type="search" placeholder="部品・ID・根拠・モデルを検索（/）" aria-label="部品・ID・根拠・モデルを検索" aria-controls="qres" autocomplete="off">
    <div id="qres" class="qres" role="listbox" hidden></div>
  </div>
  <nav class="actions" aria-label="操作">
    <details class="menu">
      <summary>一覧 ▾</summary>
      <div class="menu-list directory-links">
        <a href="research.html">調査一覧</a>
        <a href="knowledge-graph.html">ナレッジグラフ</a>
        <a href="objects.html">オブジェクト一覧</a>
        <a href="about.html">サイト情報</a>
      </div>
    </details>
    <button data-act="design" title="要件定義から設計を作成・編集">設計</button>
    <button data-act="open" title="YAML を開く">開く</button>
    <details class="menu">
      <summary title="共有・書き出し">書き出し ▾</summary>
      <div class="menu-list" role="menu">
        <button role="menuitem" data-act="share">リンクをコピー<small>今の視点を含む</small></button>
        <button role="menuitem" data-act="png">PNG 画像<small>表示中の構成図</small></button>
        <button role="menuitem" data-act="svg">SVG<small>表示範囲</small></button>
        <button role="menuitem" data-act="svg-full" hidden>SVG（全体）<small>2D の構成図全体</small></button>
        <button role="menuitem" data-act="report">レポート<small>点検・指摘の Markdown</small></button>
      </div>
    </details>
    <button class="icon" data-act="help" aria-label="ヘルプ（?）" title="ヘルプ（?）">?</button>
    <button class="header-settings" data-act="settings" aria-label="設定" title="設定"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="M19.4 13.4c.1-.9.1-1.9 0-2.8l1.7-1.3-1.7-2.9-2 .8a8 8 0 0 0-2.4-1.4L14.7 3h-3.4L11 5.8a8 8 0 0 0-2.4 1.4l-2-.8-1.7 2.9 1.7 1.3a9 9 0 0 0 0 2.8l-1.7 1.3 1.7 2.9 2-.8a8 8 0 0 0 2.4 1.4l.3 2.8h3.4l.3-2.8a8 8 0 0 0 2.4-1.4l2 .8 1.7-2.9-1.7-1.3Z"/></svg><span>設定</span></button>
  </nav>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="モデル一覧">
    <div class="sidebar-heading"><div><strong>モデル一覧</strong><span>構成図を選ぶ</span></div><button type="button" class="icon sidebar-close" data-act="nav" aria-label="モデル一覧を閉じる">×</button></div>
    <section class="library-section">
      <details class="library" id="library" open>
        <summary><h5>探す・絞り込む</h5><small>Ctrl+K</small></summary>
        <input id="model-filter" type="search" placeholder="名前・ラベルで絞り込む（例：OSS）" aria-label="モデルを絞り込む" autocomplete="off">
        <div id="tag-filter" class="tag-filter" aria-label="ラベルで絞り込む"></div>
        <div id="reference-section" hidden>
          <div class="ref-head"><span class="vc-h">リファレンス</span></div>
          <a class="research-entry" href="research.html">調査一覧</a>
          <a class="research-entry" href="knowledge-graph.html">ナレッジグラフ</a>
          <div id="reference-list"></div>
        </div>
        <details class="my-models" id="my-models"><summary>自分の設計 <small id="my-count"></small></summary><div id="mlist" class="mlist"></div></details>
      </details>
    </section>
  </aside>
  <div class="scrim" data-act="nav" aria-hidden="true"></div>

  <main class="main">
    <div class="stage">
      <div class="stage-head">
        <div class="stage-context"><h1 id="viewer-title"></h1><div class="stats" id="stats" aria-live="polite"></div></div>
        <div class="stage-actions"><a class="b small" id="graph-entry" hidden>関連グラフ</a><button type="button" class="b small compare-entry" id="compare-entry" data-act="reference-compare" aria-haspopup="dialog" hidden></button></div>
      </div>
        <div class="toolbar" role="toolbar" aria-label="構成図の操作">
          <div class="tb-disp" role="group" aria-label="図の表示">
            <details class="menu tb-menu">
              <summary title="ビューの切り替え（V）"><span class="tb-k">ビュー</span><b id="view-cur"></b><i>▾</i></summary>
              <div id="views" class="menu-list views" role="menu" aria-label="ビュー"></div>
            </details>
            <details class="menu tb-menu">
              <summary title="表示モードの切り替え（1〜）"><span class="tb-k">モード</span><b id="mode-cur"></b><i>▾</i></summary>
              <div id="modes" class="menu-list modes" role="menu" aria-label="表示モード"></div>
            </details>
            <details class="menu tb-menu">
              <summary title="フロア・周辺表示・ミニマップ"><span class="tb-k">表示</span><b id="opts-cur"></b><i>▾</i></summary>
              <div class="menu-list tb-opts" aria-label="表示の設定">
                <span class="tb-opts-h">フロア</span>
                <div id="floors" class="floors"></div>
                <span class="tb-opts-h">その他</span>
                <label class="chk"><input type="checkbox" id="nbr"> 選択中の部品の周辺だけ</label>
                <label class="chk"><input type="checkbox" id="spread-floors"> 3D のフロア間隔を広げる</label>
                <label class="chk"><input type="checkbox" id="minimap"> 全体図（ミニマップ）</label>
                <button type="button" class="b small" data-act="readable-diagram" hidden aria-pressed="false" title="文字を大きく表示し、図をスクロールして見る">文字を拡大</button>
              </div>
            </details>
          </div>
          <div class="tb-group" role="group" aria-label="次元">
            <button data-dimension="2" title="依存関係を追う（D で切替）">2D 接続図</button>
            <button data-dimension="3" title="フロアと境界を見る（D で切替）">3D 配置図</button>
          </div>
          <div class="tb-group" role="group" aria-label="視点"><button data-view="reset" title="全体が収まるように戻す">⤢<span>全体</span></button></div>
          <details class="menu tb-menu view-extra">
            <summary title="回転・移動と視点の設定" aria-label="その他の図の操作">⋯</summary>
            <div class="menu-list view-extra-list">
              <span class="tb-opts-h">ドラッグ</span>
              <div class="tb-group" role="group" aria-label="ドラッグの操作">
                <button data-drag="rotate" title="ドラッグで回転（R）">⟳<span>回転</span></button>
                <button data-drag="pan" title="ドラッグで移動（M）">✥<span>移動</span></button>
              </div>
              <span class="tb-opts-h">視点</span>
              <div class="tb-group" role="group" aria-label="視点の切り替え"><button data-view="iso" title="斜めから">斜め</button><button data-view="top" title="真上から">真上</button><button data-view="side" title="横から">横</button><button data-view="back" title="裏側から">裏</button></div>
            </div>
          </details>
          <div class="tb-spacer"></div>
          <div class="tb-group" role="group" aria-label="表示領域">
            <button data-act="maximize-view" aria-pressed="false" title="構成図を画面内で最大化">⛶<span>最大化</span></button>
            <button class="detail-toggle" id="detail-toggle" aria-controls="panel" aria-expanded="true" title="詳細パネルの開閉">詳細</button>
          </div>
        </div>
      <div class="diagram-workspace">
      <div class="view" id="view" aria-label="構成図。部品や矢印を選択">
        <div class="hint" id="hint"></div>
      </div>
      <div class="flow-controls" id="flow-controls" role="group" aria-label="処理の流れの操作" hidden>
        <button type="button" class="flow-play" data-act="flow-play"></button>
        <div class="flow-position" id="flow-position" hidden>
          <button type="button" data-step="-1" aria-label="前のステップ">←</button>
          <span id="flow-progress"></span>
          <button type="button" data-step="1" aria-label="次のステップ">→</button>
        </div>
        <label class="flow-scenario" id="flow-scenario-label" hidden><span>シナリオ</span><select id="flow-scenario" aria-label="シナリオを選択"></select></label>
      </div>
      </div>
      <div class="legend" id="legend" role="group" aria-label="図の凡例と表示切替"></div>
      <section class="filemap" id="filemap" hidden aria-label="データの見取り図"></section>
    </div>
  </main>

  <aside class="panel" id="panel" tabindex="-1" aria-label="詳細">
    <div class="panel-heading"><div><strong>詳細</strong><span>選択した部品・接続の情報</span></div><button class="icon detail-close" id="detail-close" aria-label="詳細パネルを閉じる" title="閉じる">×</button></div>
    <div id="panel-body"></div>
    <section class="view-overview" aria-labelledby="view-overview-heading">
      <h2 id="view-overview-heading">構成概要</h2>
      <h3 id="view-overview-title"></h3>
      <p id="view-overview-description"></p>
    </section>
  </aside>
</div>

<div id="modal" class="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="dialog-head"><h2 id="modal-title"></h2><button type="button" class="b small" id="compare-fullscreen" aria-pressed="false">全画面で比較</button><button class="close icon" aria-label="閉じる">×</button></div>
    <div id="modal-body" class="dialog-body"></div>
  </div>
</div>
<div id="drop" class="drop" hidden><div>YAML をドロップして読み込む</div></div>
<input type="file" id="file" accept=".yaml,.yml" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="vendor/js-yaml/js-yaml.min.js"></script>
<script src="js/catalog.js?v=objects1"></script>
<script src="js/layout.js"></script>
<script src="js/analyze.js?v=routes1"></script>
<script src="js/views.js?v=routes1"></script>
<script src="js/view-controls.js?v=tbmenu1"></script>
<script type="module" src="js/app.js?v=performance-compare1"></script>
</body>
</html>
