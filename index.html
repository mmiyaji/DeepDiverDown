<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepDiverDown</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<header class="top">
  <div class="brand">DeepDiverDown</div>
  <div class="meta"><select id="msel"></select></div>
</header>
<nav class="modes" id="modes"></nav>
<div class="app">
  <section class="main">
    <div class="stage">
      <div class="stats" id="stats"></div>
      <div class="view" id="view">
        <div class="dragctl" role="group" aria-label="ドラッグの操作">
          <button data-drag="rotate" title="ドラッグで回転（R）">⟳ 回転</button><button data-drag="pan" title="ドラッグで移動（M）">✥ 移動</button>
        </div>
        <div class="viewctl">
          <button data-view="iso">斜め</button><button data-view="top">真上</button><button data-view="side">横</button><button data-view="back">裏側</button><button data-view="reset">リセット</button>
        </div>
        <div class="hint" id="hint"></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </section>
  <aside class="panel" id="panel"></aside>
</div>

<script src="vendor/js-yaml/js-yaml.min.js"></script>
<script src="js/aws.js"></script>
<script src="js/analyze.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
