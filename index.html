<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepDiverDown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header class="top">
  <div class="brand">DeepDiverDown</div>
  <div class="meta"><select id="msel"></select></div>
</header>
<nav class="modes" id="modes"></nav>
<div class="app">
  <section class="main">
    <div class="stage">
      <div class="stats" id="stats"></div>
      <div class="view" id="view">
        <div class="viewctl">
          <button data-view="iso">斜め</button><button data-view="top">真上</button><button data-view="side">横</button><button data-view="back">裏側</button><button data-view="reset">リセット</button>
        </div>
        <div class="hint">ドラッグ：回転 ／ 右ドラッグ・Shift+ドラッグ：移動 ／ ホイール：拡大縮小</div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </section>
  <aside class="panel" id="panel"></aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="js/aws.js"></script>
<script src="js/analyze.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
