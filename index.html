<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepDiverDown</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="css/style.css?v=drill1">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<a class="skip" href="#panel">詳細パネルへ移動</a>
<header class="top">
  <button class="icon" data-act="nav" aria-label="サイドバーの開閉（[）" title="サイドバーの開閉（[）">☰</button>
  <div class="brand">DeepDiverDown</div>
  <a class="crumb-up" id="mparent" hidden></a>
  <button class="crumb" id="mtitle" data-act="pick-model" title="モデルを切り替え（Ctrl+K）"></button>
  <div class="search" role="search">
    <input id="q" type="search" placeholder="部品・ID・根拠・モデルを検索（/）" aria-label="部品・ID・根拠・モデルを検索" aria-controls="qres" autocomplete="off">
    <div id="qres" class="qres" role="listbox" hidden></div>
  </div>
  <nav class="actions" aria-label="操作">
    <button data-act="design" title="要件定義から設計を作成・編集">設計</button>
    <button data-act="open" title="YAML を開く">開く</button>
    <details class="menu">
      <summary title="共有・書き出し">書き出し ▾</summary>
      <div class="menu-list" role="menu">
        <button role="menuitem" data-act="share">リンクをコピー<small>今の視点を含む</small></button>
        <button role="menuitem" data-act="png">PNG 画像<small>表示中の構成図</small></button>
        <button role="menuitem" data-act="svg">SVG<small>表示範囲</small></button>
        <button role="menuitem" data-act="svg-full" hidden>SVG（全体）<small>2D の構成図全体</small></button>
        <button role="menuitem" data-act="report">レポート<small>点検・指摘の Markdown</small></button>
      </div>
    </details>
    <button class="icon" data-act="help" aria-label="ヘルプ（?）" title="ヘルプ（?）">?</button>
    <button class="icon" data-act="settings" aria-label="設定" title="設定">⚙</button>
  </nav>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="表示の切り替え">
    <section><h5>ビュー</h5><div id="views" class="views" role="group" aria-label="ビュー"></div></section>
    <section><h5>表示モード</h5><nav id="modes" class="modes" aria-label="表示モード"></nav></section>
    <section><h5>フロア</h5><div id="floors" class="floors"></div></section>
    <section><h5>表示</h5><label class="chk"><input type="checkbox" id="nbr"> 選択中の部品の周辺だけ</label>
      <label class="chk"><input type="checkbox" id="minimap"> 全体図（ミニマップ）</label></section>
    <section class="library-section">
      <details class="library" id="library">
        <summary><h5>モデル一覧</h5><small>Ctrl+K</small></summary>
        <input id="model-filter" type="search" placeholder="モデルを絞り込む" aria-label="モデルを絞り込む" autocomplete="off">
        <div id="mlist" class="mlist"></div>
        <div id="reference-section" hidden>
          <div class="ref-head"><h5>アーキテクチャリファレンス</h5><button type="button" class="b small" data-act="reference-compare">比較する</button></div>
          <div id="reference-list"></div>
        </div>
      </details>
    </section>
  </aside>
  <div class="scrim" data-act="nav" aria-hidden="true"></div>

  <main class="main">
    <div class="stage">
      <div class="stage-head">
        <div class="stats" id="stats" aria-live="polite"></div>
      </div>
      <div class="view" id="view" aria-label="構成図。部品をクリックで選択">
        <div class="toolbar" role="toolbar" aria-label="構成図の操作">
          <div class="tb-group" role="group" aria-label="ドラッグの操作">
            <button data-drag="rotate" title="ドラッグで回転（R）">⟳<span>回転</span></button>
            <button data-drag="pan" title="ドラッグで移動（M）">✥<span>移動</span></button>
          </div>
          <div class="tb-group" role="group" aria-label="次元">
            <button data-act="dimension" title="3D と 2D の切り替え（D）">3D / 2D</button>
          </div>
          <div class="tb-group" role="group" aria-label="視点">
            <button data-view="iso" title="斜めから">斜め</button><button data-view="top" title="真上から">真上</button><button data-view="side" title="横から">横</button><button data-view="back" title="裏側から">裏</button><button data-view="reset" title="全体が収まるように戻す">⤢<span>全体</span></button>
          </div>
          <div class="tb-spacer"></div>
          <div class="tb-group" role="group" aria-label="表示領域">
            <button data-act="maximize-view" aria-pressed="false" title="構成図を画面内で最大化">⛶<span>最大化</span></button>
            <button class="detail-toggle" id="detail-toggle" aria-controls="panel" aria-expanded="true" title="詳細パネルの開閉">詳細</button>
          </div>
        </div>
        <div class="hint" id="hint"></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </main>

  <aside class="panel" id="panel" tabindex="-1" aria-label="詳細">
    <button class="icon detail-close" id="detail-close" aria-label="詳細パネルを閉じる" title="閉じる">×</button>
    <div id="panel-body"></div>
  </aside>
</div>

<div id="modal" class="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="dialog-head"><h2 id="modal-title"></h2><button class="close icon" aria-label="閉じる">×</button></div>
    <div id="modal-body" class="dialog-body"></div>
  </div>
</div>
<div id="drop" class="drop" hidden><div>YAML をドロップして読み込む</div></div>
<input type="file" id="file" accept=".yaml,.yml" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="vendor/js-yaml/js-yaml.min.js"></script>
<script src="js/catalog.js"></script>
<script src="js/layout.js"></script>
<script src="js/analyze.js"></script>
<script src="js/views.js"></script>
<script src="js/view-controls.js?v=drill1"></script>
<script type="module" src="js/app.js?v=drill1"></script>
</body>
</html>
