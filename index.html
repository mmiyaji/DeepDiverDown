<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepDiverDown</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="css/style.css?v=card-icons">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<a class="skip" href="#panel">詳細パネルへ移動</a>
<header class="top">
  <button class="icon" data-act="nav" aria-label="サイドバーの開閉（[）" title="サイドバーの開閉（[）">☰</button>
  <div class="brand">DeepDiverDown</div>
  <div class="crumb" id="mtitle"></div>
  <div class="search" role="search">
    <input id="q" type="search" placeholder="部品・ID・根拠を検索（/）" aria-label="部品・ID・根拠を検索" aria-controls="qres" autocomplete="off">
    <div id="qres" class="qres" role="listbox" hidden></div>
  </div>
  <nav class="actions" aria-label="操作">
    <button data-act="design" title="要件定義から設計を作成・編集">設計</button>
    <button data-act="open" title="YAML を開く">開く</button>
    <button data-act="share" title="今の画面（視点を含む）のリンクをコピー">共有</button>
    <button data-act="png" title="構成図を PNG で保存">PNG</button>
    <button data-act="svg" title="現在の表示範囲を SVG で保存">SVG</button>
    <button data-act="svg-full" title="表示中の2D構成図全体を SVG で保存" hidden>SVG 全体</button>
    <button data-act="report" title="点検・指摘を Markdown で保存">レポート</button>
    <button class="icon" data-act="help" aria-label="ヘルプ（?）" title="ヘルプ（?）">?</button>
    <button class="icon" data-act="settings" aria-label="設定" title="設定">⚙</button>
  </nav>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="モデルと表示">
    <section aria-labelledby="design-models-heading">
      <h5 id="design-models-heading">設計モデル</h5><div id="mlist" class="mlist"></div>
    </section>
    <section id="reference-section" aria-labelledby="reference-heading" hidden>
      <h5 id="reference-heading">アーキテクチャリファレンス</h5><div id="reference-list"></div>
    </section>
    <section><h5>ビュー</h5><div id="views" class="views" role="group" aria-label="ビュー"></div></section>
    <section><h5>表示モード</h5><nav id="modes" class="modes" aria-label="表示モード"></nav></section>
    <section><h5>フロア</h5><div id="floors" class="floors"></div></section>
    <section><h5>表示</h5><label class="chk"><input type="checkbox" id="nbr"> 選択中の部品の周辺だけ</label></section>
  </aside>
  <div class="scrim" data-act="nav" aria-hidden="true"></div>

  <main class="main">
    <div class="stage">
      <div class="stage-head">
        <div class="stats" id="stats" aria-live="polite"></div>
        <button class="b detail-toggle" id="detail-toggle" aria-controls="panel" aria-expanded="true">詳細を閉じる</button>
      </div>
      <div class="view" id="view" aria-label="構成図。部品をクリックで選択">
        <div class="dragctl" role="group" aria-label="ドラッグの操作">
          <button data-drag="rotate" title="ドラッグで回転（R）">⟳ 回転</button><button data-drag="pan" title="ドラッグで移動（M）">✥ 移動</button>
          <button data-act="dimension" title="3D と 2D の切り替え（D）">3D / 2D</button>
          <button data-act="maximize-view" aria-pressed="false" title="構成図を画面内で最大化">最大化</button>
        </div>
        <div class="viewctl" role="group" aria-label="視点">
          <button data-view="iso">斜め</button><button data-view="top">真上</button><button data-view="side">横</button><button data-view="back">裏側</button><button data-view="reset">リセット</button>
        </div>
        <div class="hint" id="hint"></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </main>

  <aside class="panel" id="panel" tabindex="-1" aria-label="詳細">
    <button class="b detail-close" id="detail-close" aria-label="詳細パネルを閉じる">閉じる</button>
    <div id="panel-body"></div>
  </aside>
</div>

<div id="modal" class="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="dialog-head"><h2 id="modal-title"></h2><button class="close icon" aria-label="閉じる">×</button></div>
    <div id="modal-body" class="dialog-body"></div>
  </div>
</div>
<div id="drop" class="drop" hidden><div>YAML をドロップして読み込む</div></div>
<input type="file" id="file" accept=".yaml,.yml" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="vendor/js-yaml/js-yaml.min.js"></script>
<script src="js/catalog.js"></script>
<script src="js/layout.js"></script>
<script src="js/analyze.js"></script>
<script src="js/views.js"></script>
<script src="js/view-controls.js?v=detail-drawer"></script>
<script type="module" src="js/app.js?v=card-icons"></script>
</body>
</html>
