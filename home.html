<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'">
  <title>DeepDiverDown | リファレンス</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="css/home.css">
  <script src="vendor/js-yaml/js-yaml.min.js"></script>
  <script src="js/layout.js"></script>
  <script type="module" src="js/home.js"></script>
</head>
<body>
  <div id="site">
    <header class="topbar">
      <a class="brand" href="home.html"><span class="brand-mark">D</span> DeepDiverDown</a>
      <nav aria-label="ナビゲーション"><a href="research.html">調査一覧</a><a href="knowledge-graph.html">ナレッジグラフ</a><a href="objects.html">オブジェクト一覧</a></nav>
    </header>
    <main>
      <div class="intro"><div><h1>構成図一覧</h1><p>技術名や分野からリファレンスを探せます。</p></div><label class="search"><span>リファレンスを検索</span><input id="search" type="search" placeholder="技術名やキーワード" autocomplete="off"></label></div>
      <div class="section-heading"><div><h2>リファレンス</h2><p id="count" aria-live="polite">読み込み中…</p></div><label>分野 <select id="domain"><option value="">すべて</option></select></label></div>
      <div id="cards" class="cards"></div>
      <div class="more"><button type="button" id="show-all" aria-expanded="false">すべてのリファレンスを表示</button></div>
      <p id="empty" class="empty" hidden>該当するリファレンスがありません。検索条件を変えてお試しください。</p>
      <p id="load-error" class="empty" hidden>一覧を読み込めませんでした。ページを再読み込みしてください。</p>
    </main>
  </div>
  <div class="lock-overlay" id="lock" hidden>
    <section class="lock-dialog" role="dialog" aria-modal="true" aria-labelledby="lock-title" aria-describedby="lock-description lock-note">
      <h2 id="lock-title">閲覧用の合言葉</h2>
      <p id="lock-description">合言葉を入力して、リファレンスを開きます。</p>
      <form id="lock-form">
        <label class="pass-label" for="passphrase">合言葉</label>
        <div class="pass-wrap"><input id="passphrase" type="password" placeholder="合言葉を入力" autocomplete="current-password" required><button type="button" id="show-password" aria-label="合言葉を表示" aria-pressed="false">表示</button></div>
        <p id="lock-error" class="lock-error" role="alert" hidden>合言葉が違います。もう一度お試しください。</p>
        <label class="remember"><input type="checkbox" id="remember"> このブラウザで7日間保持する</label>
        <button class="unlock" type="submit">開く</button>
      </form>
      <p id="lock-note">この画面は簡易ロックです。機密情報の保護には使用しません。</p>
    </section>
  </div>
</body>
</html>
